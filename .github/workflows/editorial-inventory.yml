name: Korean editorial inventory
on:
  push:
    branches: [editorial/ko-431]
    paths: [editorial/extract.mjs, .github/workflows/editorial-inventory.yml]
permissions:
  contents: write
jobs:
  inventory:
    if: github.ref == 'refs/heads/editorial/ko-431'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/ko-431
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts && npm install --no-save --ignore-scripts acorn@8.15.0
      - run: npx playwright install --with-deps chromium
      - name: Inventory in a clean browser
        run: |
          python3 -m http.server 4173 >/tmp/editorial-server.log 2>&1 &
          sleep 2
          node editorial/extract.mjs
      - name: Preserve app-only inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial/catalog
          git diff --cached --quiet || git commit -m 'Record app text and grading baseline for Korean revision'
          git pull --rebase origin editorial/ko-431
          git push origin HEAD:editorial/ko-431
