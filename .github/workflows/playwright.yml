name: Economy Designer 4.3.1 Playwright

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'reference/**'
      - 'editorial/**'
      - 'revised/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package*.json'
      - 'playwright.config.mjs'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: economy431-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify preserved original and baseline recovery edits
        run: node scripts/verify-source.mjs
      - name: Install dependencies and compile the Korean edition
        run: npm ci
      - name: Record dependency versions
        run: |
          mkdir -p evidence
          npm ls @playwright/test acorn > evidence/dependencies.txt
          cp package-lock.json evidence/dependency-lock.json
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run all Playwright regressions
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee evidence/playwright.log
      - name: Summarize actual results
        if: always()
        run: |
          node scripts/summarize-results.mjs
          if [ -f evidence/results.json ]; then node editorial/summarize-tests.mjs; fi
      - name: Upload evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy431-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            editorial/reports/build.json
            editorial/reports/regressions.json
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: error
