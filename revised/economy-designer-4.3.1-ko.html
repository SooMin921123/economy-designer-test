const KOREAN_EDITION_431={"CT41":{"S1-1":{"title":"경제 위기와 정부의 대응","prompt":"다음 상황과 정책을 가장 적절하게 설명한 것은?","why":"과잉 생산, 소비 부족, 실업에 대응하기 위해 정부가 공공사업을 추진하고 유효 수요를 늘리려 한다. 시장 실패를 해결하기 위한 정부의 적극적인 역할을 강조하므로 수정 자본주의와 관련된다.","origin":""},"S1-2":{"title":"자원 배분과 경제 체제","prompt":"각 자원 배분 방식에 해당하는 경제 체제를 고르시오.","why":"시장 가격과 민간의 선택에 따라 자원을 배분하는 것은 시장경제 체제이다. 정부의 명령과 계획에 따르는 것은 계획경제 체제이다. 두 요소를 함께 활용하는 것은 혼합 경제 체제이다.","origin":""},"S1-3":{"title":"중상주의와 뉴딜 정책","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["중상주의와 뉴딜 정책은 모두 정부의 활동이지만,","배경과 목적이 모두 동일하다","."],"options":["등장 배경과 정책의 목적이 서로 다르다","정부의 시장 개입을 모두 부정한다","당시의 생산 방식이 언제나 같다"]},"why":"중상주의는 절대 왕정이 상공업과 교역을 장려하여 국가의 부를 늘리려 한 정책이다. 뉴딜 정책은 대공황에 따른 실업과 수요 부족에 대응하였다. 두 정책 모두 정부의 활동이지만 등장 배경과 목적은 다르다.","origin":""},"S1-4":{"title":"자본주의와 경제 체제","prompt":"자본주의의 전개와 경제 체제에 대한 설명으로 옳은 것을 모두 고르시오.","why":"상업 자본주의는 상품의 유통 과정에서 이윤을 얻는 것을 중시하였다. 산업 자본주의는 산업 혁명과 대량 생산을 배경으로 발달하였다. 혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소가 함께 나타난다.","origin":""},"S2-1":{"title":"행사장 선택의 기회비용","prompt":"두 행사장 중 하나만 선택한다. 표의 편익과 앞으로 지출할 명시적 비용만 고려하며 다른 대안과 매몰 비용은 없다. 각 행사장 선택의 비용표를 완성하시오. 단위는 만 원이다.","why":"A의 편익에서 명시적 비용을 빼면 60−20=40만 원, B는 72−26=46만 원이다. A를 선택하면 B의 46만 원을 포기하므로 기회비용은 20+46=66만 원이다. B를 선택하면 A의 40만 원을 포기하므로 기회비용은 26+40=66만 원이다.\n\n순편익은 A가 −6만 원, B가 6만 원이므로 B가 유리하다.","origin":""},"S2-2":{"title":"행사 규모와 주민 피해","prompt":"표는 행사 규모별 주최 측 이익과 주민 피해를 같은 금액 단위로 나타낸 것이다. 다른 효과는 없다. 이익에서 피해를 뺀 금액이 가장 큰 규모를 고르고 그 금액을 구하시오.","why":"규모별로 이익에서 피해를 빼면 0, 27, 40, 32이다. 규모가 2일 때 40으로 가장 크다.","origin":""},"S2-3":{"title":"가로등 설치비와 납부액","prompt":"주민 4명은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하고 각 주민은 편익 10을 얻는다. 실패하면 납부액을 돌려받는다. 다른 세 주민은 각각 6토큰씩 낸다.\n\n0, 4, 6, 10토큰 중 내게 가장 유리한 납부액을 고르고 남은 토큰과 편익의 합을 구하시오.","why":"다른 주민의 납부액 합계는 18토큰이다. 내가 6토큰을 내면 설치비 24토큰이 모두 모인다. 내게 남는 4토큰에 편익 10을 더하면 14이다. 제시된 다른 납부액을 선택했을 때보다 크므로 6토큰이 가장 유리하다.","origin":""},"S2-4":{"title":"행사에 나타난 경제 개념","prompt":"각 사례에 해당하는 경제 개념을 고르시오.","why":"행사 소음으로 주민이 피해를 입고 보상받지 못하는 것은 외부 불경제이다. 설치비 부담을 피하려 하여 가로등이 충분히 공급되지 않는 것은 공공재 부족 문제이다. 행사장 선택으로 포기한 최선의 다른 대안의 가치는 암묵적 비용이다.","origin":""},"S3-1":{"title":"회수할 수 없는 개발비","prompt":"과거에 지출한 개발비는 어떤 대안을 선택해도 회수할 수 없다. 현재의 선택에서 이 비용을 어떻게 고려해야 하는가?","why":"개발비는 이미 지출하여 회수할 수 없는 매몰 비용이다. 현재의 합리적 선택에서는 이를 제외하고 앞으로 얻을 편익과 각 대안의 기회비용을 비교해야 한다.","origin":""},"S3-2":{"title":"경영안을 검토할 자료","prompt":"예산 10 안에서 노동, 환경, 정보에 관한 문서를 각각 1개 이상 준비하시오. 표의 값은 선택한 항목에서 얻는 문서의 수이다.","why":"세 문서를 각각 1개씩 고르면 노동·환경·정보에 관한 자료가 모두 마련된다. 총비용은 4+3+3=10으로 예산과 같다.","origin":""},"S3-3":{"title":"노동자의 권리와 기업가 정신","prompt":"각 활동에 해당하는 권리나 개념을 고르시오.","why":"노동조합 가입은 단결권의 행사이다. 노동조합을 통해 사용자와 임금을 협상하는 것은 단체 교섭권과 관련된다. 불확실성을 감수하며 기술 혁신에 도전하는 모습에서는 기업가 정신이 드러난다.","origin":""},"S3-4":{"title":"경제 주체의 책임과 소비","prompt":"기업의 역할과 소비자의 선택에 대한 설명으로 옳은 것을 모두 고르시오.","why":"기업은 노동자와 소비자의 권리를 존중하고 사회적 책임을 다해야 한다. 위험을 감수한 시장 개척은 기업가 정신과 관련된다. 윤리적 가치를 실천하면서 얻는 만족도 편익에 포함될 수 있으므로 윤리적이면서 합리적인 소비가 가능하다.","origin":""},"S4-1":{"title":"지위와 수익으로 금융 자산 구분하기","prompt":"일반적인 수익 형태와 보유자의 지위를 보고 해당 금융 자산을 고르시오.","why":"이자 수익만 기대하는 것은 예금이다. 기업의 지분을 보유하고 배당 수익과 시세 차익을 기대하는 것은 주식이다. 원금과 이자의 지급을 약속한 차용 증서이며 이자 수익과 시세 차익을 기대하는 것은 채권이다.","origin":""},"S4-2":{"title":"지출 기한과 초기 자금","prompt":"3개월 동안 매월 말에 200을 지출한다. 수입 600은 3개월째 월초에 들어오며 남은 돈을 다음 달로 넘길 수 있다. 대출과 지출 연기가 불가능할 때 필요한 최소 초기 자금을 구하시오.","why":"수입을 받기 전에 첫 두 달의 지출 200×2=400을 감당해야 한다. 초기 자금이 400이면 이 지출을 마친 뒤 3개월째 월초 수입으로 마지막 지출을 할 수 있다.","origin":""},"S4-3":{"title":"외화 금액과 환율의 변화","prompt":"처음 80달러를 1,200원/달러에 취득하였다. 나중 외화 금액이 90달러가 되었을 때 1,100원/달러로 환산하였다. 다른 비용과 수익은 없다. 처음과 나중의 원화 금액, 원화 손익을 구하시오.","why":"처음 원화 금액은 80×1,200=96,000원이다. 나중 원화 금액은 90×1,100=99,000원이다. 따라서 원화 손익은 99,000−96,000=3,000원이다.","origin":""},"S4-4":{"title":"재무 계획의 수정","prompt":"돈을 써야 하는 기한과 경제적 환경이 달라졌다. 이에 대한 대응으로 적절한 것은?","why":"필요한 시기에 돈을 마련할 수 있는지, 기존 자산 구성이 달라진 경제 환경에 알맞은지 다시 살펴야 한다. 목표와 현재 재무 상태를 검토하고 필요한 부분을 수정한다.","origin":""},"S5-1":{"title":"생산량과 기회비용","prompt":"양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 한 재화만 생산할 때 최대 생산량은 A국이 X재 16개 또는 Y재 8개, B국이 X재 6개 또는 Y재 9개이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","why":"A국은 X재 16개 생산으로 Y재 8개를 포기하므로 X재 1개의 기회비용은 Y재 8÷16=0.5개이다. B국은 Y재 9÷6=1.5개이다.","origin":""},"S5-2":{"title":"두 재화의 생산 조합","prompt":"자원과 기술은 고정되어 있고 두 재화만 생산하며 생산 가능 곡선은 직선이다. X재 생산량을 8개로 맞추고 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.","why":"X재만 생산하면 최대 16개를 만들 수 있으므로 8개는 자원의 절반을 사용한다. 남은 절반으로 Y재를 최대 8×1/2=4개 만들 수 있다.","origin":""},"S5-3":{"title":"양국에 유리한 교환 계약","prompt":"양국은 같은 노동량으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. A국은 X재, B국은 Y재에 완전 특화하고 거래 비용은 없다. X재 4개와 교환할 Y재 수량을 정하여 양국 모두 직접 생산할 때보다 이익을 얻도록 하시오. 각국의 이익은 Y재 수량으로 구한다.","why":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1.5개이다. 예를 들어 X재 4개와 Y재 4개를 교환하면 A국은 4−4×0.5=2개의 이익을 얻고, B국은 4×1.5−4=2개를 절약한다.","origin":""},"S5-4":{"title":"정해진 교환 후의 보유량","prompt":"A국은 X재 16개만, B국은 Y재 9개만 생산하였다. 이번 문제에서는 앞에서 제안한 계약과 관계없이 X재 4개와 Y재 4개를 교환한다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.","d":{"labels":["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"]},"why":"A국은 X재 16개 중 4개를 주고 Y재 4개를 받으므로 X재 12개, Y재 4개를 보유한다. B국은 X재 4개를 받고 Y재 9개 중 4개를 주므로 Y재 5개가 남는다.","origin":""},"S6-1":{"title":"무역 증가와 주민 생활","prompt":"다음 자료를 바탕으로 내릴 수 있는 결론으로 가장 적절한 것은?","why":"총생산과 수출액이 증가했다는 사실은 알 수 있다. 그러나 생산자에게 지급한 대가, 노동 조건, 환경에 관한 자료가 없어 모든 주민의 생활이 개선되었는지는 알 수 없다.","origin":""},"S6-2":{"title":"주민 피해를 고려한 활동 규모","prompt":"표의 이익과 주민 피해는 같은 금액 단위이며 다른 효과는 없다. 이익에서 피해를 뺀 금액이 가장 큰 활동량을 고르고 그 금액을 구하시오.","why":"활동량별 금액은 0, 20, 32, 26이다. 활동량이 2일 때 32로 가장 크다.","origin":""},"S6-3":{"title":"환율 상승과 거래 당사자","prompt":"외화 금액은 그대로이고 원/달러 환율만 상승하였다. 각 거래 당사자에게 나타나는 변화를 고르시오.","why":"같은 외화를 원화로 바꿀 때 받는 금액은 늘어난다. 따라서 외화를 받는 사람의 원화 수입은 커진다. 반면 외화 대금을 지급하려는 사람은 외화를 사는 데 더 많은 원화를 지출해야 한다.","origin":""},"S6-4":{"title":"무역 보고서의 작성","prompt":"제시된 자료로 무역 보고서를 작성하는 방법으로 적절한 것을 모두 고르시오.","why":"무역의 이익과 부정적 영향을 함께 설명하고 노동·환경·분배에 관한 자료를 살펴야 한다. 자료가 없는 부분은 추가로 조사한다. 예를 들어 환경 자료가 없다고 피해를 0으로 계산할 수는 없다.","origin":""},"C01-01":{"title":"상업 자본주의의 배경","prompt":"다음 사례와 관련된 정책과 자본주의의 유형을 옳게 짝지은 것은?\n\n절대 왕정은 상인의 교역 활동을 지원하고 세금을 확보하였다.","why":"중상주의는 국가의 부를 늘리기 위해 국내 산업을 보호하고 수출을 장려한 정책이다. 절대 왕정의 중상주의 정책은 교역과 상인의 활동을 뒷받침하여 상업 자본주의의 발달에 기여하였다.","origin":""},"C01-02":{"title":"자본주의의 전개 순서","prompt":"다음 네 가지 자본주의를 등장한 순서대로 배열해 보자.","why":"상업 자본주의, 산업 자본주의, 수정 자본주의, 신자유주의의 순서이다. 교역의 확대, 산업 혁명, 대공황, 석유 파동 이후의 정부 대응 한계를 각 시기의 등장 배경과 함께 정리할 수 있다.","origin":""},"C01-03":{"title":"자본주의의 등장 배경","prompt":"각 자본주의의 등장 배경으로 알맞은 것을 고르시오.","why":"산업 혁명으로 대량 생산이 가능해지면서 산업 자본주의가 발달하였다. 대공황 이후에는 시장 실패를 해결하기 위한 수정 자본주의가 등장하였다. 신자유주의는 석유 파동 이후 정부 대응의 한계와 정부 개입에 따른 비효율이 드러난 것을 배경으로 한다.","origin":""},"C01-04":{"title":"활동과 정책에 나타난 자본주의","prompt":"각 설명에 해당하는 자본주의의 유형을 고르시오.","why":"상품의 유통에서 이윤을 얻는 것은 상업 자본주의, 대규모 설비로 상품을 생산하는 것은 산업 자본주의의 특징이다. 공공사업으로 유효 수요를 늘리는 정책은 수정 자본주의, 공기업 민영화는 신자유주의와 관련된다.","origin":""},"C01-05":{"title":"정부 개입의 목적 비교","prompt":"다음 두 사례에 대한 설명으로 옳은 것은?","d":{"options":["A와 B는 모두 대공황을 극복하기 위한 정책이다.","A와 B는 모두 정부가 개입한 사례이지만, 정책의 목적은 서로 다르다.","A와 B는 모두 상품의 유통 과정에서 이윤을 얻는 것을 주된 목적으로 한다."],"clues":["A: 절대 왕정이 상인의 교역 활동을 장려하였다.","B: 대공황 이후 정부가 공공사업을 추진하여 일자리를 제공하였다.","두 사례 모두 정부가 경제활동에 개입하였다."]},"why":"A는 중상주의 정책으로 교역을 장려한 사례이며 상업 자본주의와 관련된다. B는 고용과 수요를 늘리기 위한 공공사업으로 수정 자본주의와 관련된다.\n\n두 사례 모두 정부가 개입하였지만 A는 교역을 통한 부의 축적을, B는 실업과 수요 부족의 해결을 추구하였다. 대공황 극복을 목적으로 한 것은 B이며, 상품 유통을 통한 이윤 추구는 A와 관련된다.","origin":""},"C01-06":{"title":"산업 자본주의의 등장 배경","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","why":"산업 자본주의는 산업 혁명으로 기계를 이용한 대량 생산이 가능해지면서 발달하였다. 따라서 ‘대공황’을 ‘산업 혁명’으로 고쳐야 한다. 대공황은 수정 자본주의의 등장 배경이다.","origin":""},"C01-07":{"title":"자본주의의 특징","prompt":"자본주의에 대한 설명으로 옳은 것을 모두 고르시오.","why":"자본주의는 사유 재산권을 보장한다. 산업 자본주의는 시장의 자유로운 활동을, 신자유주의는 정부 역할의 축소를 강조하였다. 수정 자본주의는 정부의 모든 역할을 부정한 것이 아니라, 시장 실패를 해결하기 위한 정부의 적극적인 개입을 강조하였다.","origin":""},"C01-08":{"title":"사상가와 주요 주장","prompt":"각 사상가의 주장으로 알맞은 것을 고르시오.","why":"애덤 스미스는 시장 가격의 조정 기능을 중시하고 정부의 시장 개입을 최소화해야 한다고 보았다. 케인스는 시장의 한계를 보완하는 정부의 적극적 개입을 강조하였다. 프리드먼과 하이에크는 정부 역할의 축소와 시장 기능의 강화를 강조하였다.","origin":""},"C01-09":{"title":"유통과 생산을 통한 이윤 추구","prompt":"다음 두 자료에 대한 설명으로 옳은 것은?","d":{"options":{"1":"1은 상업 자본주의, 2는 산업 자본주의에 해당한다."}},"why":"1은 상품의 유통과 해외 교역을 통해 이윤을 얻으므로 상업 자본주의에 해당한다. 2는 공장 설비를 이용하여 상품을 대량 생산하므로 산업 자본주의에 해당한다.","origin":""},"C01-10":{"title":"공공사업과 유효 수요","prompt":"대공황 이후 공공사업으로 일자리를 제공하고 유효 수요를 늘리려는 정책과 관련된 자본주의는?","why":"수정 자본주의이다. 정부가 공공사업으로 일자리를 제공하면 노동자는 임금을 받고 상품을 구입할 수 있다. 이를 통해 고용과 유효 수요를 늘리고자 하였다.","origin":""},"R01-1":{"title":"중상주의와 수정 자본주의의 비교","prompt":"절대 왕정의 교역 장려 정책과 대공황 이후의 공공사업을 구별할 때 살펴야 할 내용으로 가장 적절한 것은?","d":{"options":["정책이 시행된 시대적 배경과 목적을 비교한다.","정부가 개입했으므로 같은 자본주의의 단계로 구분한다.","두 정책 모두 민간의 상품 거래를 금지했다고 본다."]},"why":"교역 장려 정책은 상업 자본주의, 대공황 이후의 공공사업은 수정 자본주의와 관련된다. 두 정책 모두 정부의 개입이지만 등장한 시기와 해결하려는 문제가 다르다. 따라서 시대적 배경과 정책 목적을 비교해야 한다.","origin":""},"R01-2":{"title":"자본주의의 등장 배경 복습","prompt":"각 설명에 해당하는 자본주의를 고르시오.","why":"산업 혁명에 따른 대량 생산은 산업 자본주의, 대공황에 대한 대응은 수정 자본주의의 배경이다. 정부 실패를 줄이고 시장의 기능을 강화하려는 입장은 신자유주의와 관련된다.","origin":""},"X01-1":{"title":"독점 자본주의를 포함한 전개 순서","prompt":"독점 자본주의를 별도 단계로 구분할 때, 다음 다섯 단계를 등장한 순서대로 배열해 보자.","why":"상업 자본주의, 산업 자본주의, 독점 자본주의, 수정 자본주의, 신자유주의의 순서이다. 산업 자본주의가 발달하면서 소수 거대 기업의 시장 지배가 나타났으며, 대공황 이후에는 시장 실패를 해결하는 정부의 역할이 강조되었다.","origin":""},"C02-01":{"title":"계획에 따른 생산","prompt":"정부가 생산할 상품과 수량을 정하여 생산을 지시한다. 이 사례에 해당하는 경제 체제는?","why":"계획경제 체제이다. 정부가 상품의 종류와 수량을 정하고 생산을 지시하므로 정부의 계획과 통제에 따라 경제 문제를 해결한다.","origin":""},"C02-02":{"title":"경제 체제의 구분","prompt":"각 설명에 해당하는 경제 체제를 고르시오.","d":{"rows":["시장 가격과 민간의 자유로운 선택을 중시한다.","정부가 생산과 분배를 계획한다.","시장 원리와 정부의 개입을 함께 활용한다."]},"why":"민간의 자유로운 선택과 시장 가격을 중시하는 것은 시장경제 체제이다. 정부의 계획과 통제로 경제 문제를 해결하는 것은 계획경제 체제이다. 두 요소가 결합한 것은 혼합 경제 체제이다.","origin":""},"C02-03":{"title":"기본적인 경제 문제","prompt":"각 질문이 어떤 경제 문제에 해당하는지 고르시오.","d":{"options":["어떻게 생산할 것인가","무엇을 얼마나 생산할 것인가","누구에게 어떻게 분배할 것인가"]},"why":"생산할 상품과 수량을 정하는 것은 ‘무엇을 얼마나 생산할 것인가’의 문제이다. 기술을 선택하는 것은 ‘어떻게 생산할 것인가’, 생산물을 나누는 것은 분배에 관한 문제이다.","origin":""},"C02-04":{"title":"시장경제 체제의 자원 배분","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","why":"시장경제 체제에서는 민간 경제 주체가 시장 가격을 고려하여 자유롭게 경제활동을 결정한다. 정부의 명령만으로 자원을 배분한다는 설명은 시장경제 체제의 특징에 맞지 않는다.","origin":""},"C02-05":{"title":"시장경제 체제의 장점과 한계","prompt":"시장경제 체제에 대한 설명으로 옳은 것을 모두 고르시오.","why":"시장경제 체제는 사유 재산권과 경제활동의 자유를 보장하므로 개인의 능력과 창의성 발휘에 유리하다. 그러나 빈부 격차와 급격한 경기 변동이 발생할 수 있으며 모든 욕구를 완전히 충족하지는 못한다.","origin":""},"C02-06":{"title":"보상 증가 전후의 선택","prompt":"A 작업의 편익은 12, 명시적 비용은 4이고 B 작업의 편익은 13, 명시적 비용은 6이다. 이후 B의 편익만 16으로 증가하였다. 변경 전과 후에 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.","d":{"labels":["변경 전 B의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"]},"why":"변경 전 B는 13−6=7, 변경 후에는 16−6=10이다. A의 편익에서 명시적 비용을 빼면 12−4=8이다. 따라서 처음에는 A가 유리하지만, B의 보상이 늘어난 뒤에는 B가 유리하다.","origin":""},"C02-07":{"title":"계획경제 체제의 한계","prompt":"계획경제 체제의 한계로 옳은 것은?","why":"정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기는 어렵다. 사유 재산권과 자유로운 경제활동이 제한되어 개인의 경제적 유인이 부족해질 수 있다는 한계도 있다.","origin":""},"C02-08":{"title":"시장과 정부의 역할","prompt":"다음 자료에 나타난 경제 운영 방식에 대한 설명으로 옳은 것은?","why":"민간의 시장 거래와 정부의 공공재 공급 및 경쟁 질서 유지가 함께 나타난다. 시장경제적 요소와 계획경제적 요소가 결합한 혼합 경제 체제로 설명할 수 있다.","origin":""},"C02-09":{"title":"경제 체제의 특징 비교","prompt":"각 설명의 옳고 그름을 판단하시오.","d":{"rows":{"2":"혼합 경제는 시장경제적 요소와 계획경제적 요소를 함께 활용한다."},"options":["옳다","옳지 않다"]},"why":"시장경제 체제는 자원 배분의 효율성을 상대적으로 중시하지만 불평등이 발생할 수 있다. 계획경제 체제는 정부의 계획과 통제를, 혼합 경제 체제는 시장경제적 요소와 계획경제적 요소의 결합을 특징으로 한다.","origin":""},"C02-10":{"title":"혼합 경제 체제의 특징","prompt":"혼합 경제 체제에 대한 설명으로 옳은 것은?","why":"혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소를 함께 활용한다. 국가가 추구하는 목표와 경제 상황에 따라 두 요소의 결합 정도는 다르다.","origin":""},"R02-1":{"title":"효율성과 형평성","prompt":"한 학생이 ‘시장경제는 효율성이 높으므로 불평등이 발생하지 않는다.’라고 설명하였다. 이에 대한 평가로 옳은 것은?","d":{"options":{"1":"불평등이 발생하지 않는다는 설명은 옳지 않다."}},"why":"시장경제 체제는 시장 가격을 통한 효율적인 자원 배분에 유리하다. 그러나 빈부 격차가 발생하여 분배의 형평성이 낮아질 수 있다. 따라서 불평등이 발생하지 않는다는 설명은 옳지 않다.","origin":""},"R02-2":{"title":"경제 문제의 해결 방식","prompt":"각 설명에 해당하는 경제 체제를 고르시오.","d":{"rows":["정부의 계획과 통제에 따라 경제활동을 결정한다.","시장 가격을 바탕으로 민간이 자유롭게 선택한다.","시장경제적 요소와 계획경제적 요소를 결합한다."]},"why":"정부의 계획과 통제를 따르는 것은 계획경제 체제, 시장 가격과 민간의 선택을 중시하는 것은 시장경제 체제이다. 두 체제의 요소가 결합한 것은 혼합 경제 체제이다.","origin":""},"X02-1":{"title":"보상이 늘어도 선택이 유지되는 경우","prompt":"A의 편익은 24, 명시적 비용은 8이고 B의 편익은 25, 명시적 비용은 12이다. 이후 B의 편익만 2 증가하였다. 다른 조건은 같다. A와 변경 후 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.","d":{"labels":["A의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"]},"why":"A는 24−8=16이다. B의 편익은 27이 되었으므로 변경 후에는 27−12=15이다. B의 보상이 늘어도 A의 16보다 작으므로 A를 선택하는 것이 여전히 유리하다.","origin":""},"C03-01":{"title":"자원의 희소성","prompt":"자원의 희소성에 대한 설명으로 옳은 것은?","why":"희소성은 인간의 욕구에 비해 사용할 수 있는 자원이 상대적으로 부족한 상태이다. 자원의 양이 많더라도 사람들이 원하는 양에 비해 부족하면 희소성이 나타난다.","origin":""},"C03-02":{"title":"예산에 맞는 물품 선택","prompt":"준비금은 10토큰이다. 각 물품은 최대 1개까지 살 수 있으며, 여러 물품에서 얻는 편익은 더할 수 있다. 예산 안에서 편익을 17 이상 얻도록 물품을 고르시오.","why":"자료 꾸러미와 체험 도구를 선택하면 비용은 6+4=10토큰이다. 편익은 10+7=17이므로 예산을 넘지 않으면서 필요한 편익을 얻을 수 있다.","origin":""},"C03-03":{"title":"명시적 비용과 암묵적 비용","prompt":"체험 활동을 선택할 때 발생하는 각 비용을 구분하시오.","d":{"rows":["참가비 3만 원을 지불한다.","대신 일을 했다면 비용을 제외하고 얻을 수 있었던 5만 원을 포기한다."]},"why":"참가비 3만 원은 직접 지출한 금액이므로 명시적 비용이다. 일을 했다면 얻을 수 있었던 5만 원은 다른 대안을 선택할 기회를 포기한 가치이므로 암묵적 비용이다.","origin":""},"C03-04":{"title":"두 대안의 기회비용","prompt":"표의 두 대안 중 하나만 선택할 수 있다. 각 대안의 암묵적 비용과 기회비용을 구하고 합리적인 대안을 고르시오.\n\n단위는 만 원이다. 다른 대안과 매몰 비용은 없으며, 표의 편익과 명시적 비용만 고려한다.","why":"A의 편익에서 명시적 비용을 빼면 18−6=12만 원, B는 22−9=13만 원이다.\n\nA를 선택하면 B를 포기하므로 암묵적 비용은 13만 원이다. 명시적 비용 6만 원을 더하면 기회비용은 19만 원이다. B를 선택하면 A를 포기하므로 암묵적 비용은 12만 원이고, 기회비용은 9+12=21만 원이다.\n\n순편익은 A가 18−19=−1만 원, B가 22−21=1만 원이다. 따라서 B가 합리적인 선택이다.","origin":""},"C03-05":{"title":"포기한 대안 중 가장 큰 가치","prompt":"A, B, C 중 하나만 선택할 수 있으며 A를 선택하였다. B의 편익은 15만 원, 명시적 비용은 5만 원이고 C의 편익은 12만 원, 명시적 비용은 4만 원이다. A 선택의 암묵적 비용을 구하시오. 답은 만 원 단위로 입력한다.","why":"B를 선택했다면 15−5=10만 원, C를 선택했다면 12−4=8만 원의 가치를 얻을 수 있었다. 포기한 두 대안 중 더 큰 가치는 B의 10만 원이다. 따라서 A 선택의 암묵적 비용은 10만 원이다.","origin":""},"C03-06":{"title":"암묵적 비용의 의미","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","why":"하나만 선택할 수 있는 대안들의 가치를 모두 더해서는 안 된다. 다른 대안들을 동시에 선택할 수 있었던 것은 아니기 때문이다. 암묵적 비용은 포기한 대안 중 가장 큰 가치이다.","origin":""},"C03-07":{"title":"비용 증가와 선택의 변화","prompt":"A의 편익은 18, 명시적 비용은 6이고 B의 편익은 22, 명시적 비용은 9이다. 이후 B의 명시적 비용만 11로 증가하였다. 변경 후 각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.","why":"A는 18−6=12, 변경 후 B는 22−11=11이다. 변경 전에는 B의 13이 A의 12보다 컸지만, 비용이 늘어난 뒤에는 A가 더 유리하다.","d":{"labels":["A의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"]},"origin":""},"C03-08":{"title":"공연 선택의 기회비용","prompt":"공연 관람의 편익은 14만 원, 표 값은 4만 원이다. 대신 할 수 있는 일의 편익은 9만 원, 명시적 비용은 2만 원이다. 둘 중 하나만 선택할 때 공연 선택의 암묵적 비용과 기회비용을 구하시오. 답은 만 원 단위로 입력한다.","why":"일을 했다면 편익 9만 원을 얻고 비용 2만 원을 지출하므로 포기한 가치는 7만 원이다. 따라서 공연 선택의 암묵적 비용은 7만 원이다. 여기에 표 값 4만 원을 더하면 기회비용은 11만 원이다.","origin":""},"C03-09":{"title":"세 대안의 기회비용","prompt":"표의 세 대안 중 하나만 선택할 수 있다. 각 대안의 암묵적 비용과 기회비용을 구하고 가장 유리한 대안을 고르시오.\n\n단위는 만 원이다. 다른 대안과 매몰 비용은 없으며, 표의 편익과 명시적 비용만 고려한다.","why":"편익에서 명시적 비용을 빼면 A는 18만 원, B는 21만 원, C는 19만 원이다. A나 C를 선택할 때에는 B를 포기한 21만 원이 암묵적 비용이다. B를 선택할 때에는 남은 A와 C 중 가치가 더 큰 C의 19만 원이 암묵적 비용이다.\n\n명시적 비용을 더하면 기회비용은 A가 33만 원, B가 35만 원, C가 37만 원이다. 순편익은 각각 −3만 원, 2만 원, −2만 원이므로 B를 선택하는 것이 합리적이다.","origin":""},"C03-10":{"title":"합리적 선택의 비용","prompt":"편익이 같은 대안 중 합리적으로 선택하기 위해 비교해야 할 비용은?","why":"편익이 같다면 기회비용이 작은 대안의 순편익이 더 크다. 기회비용에는 직접 지출하는 명시적 비용과 포기한 가치인 암묵적 비용이 모두 포함된다.","origin":""},"R03-1":{"title":"주말 활동의 기회비용","prompt":"독서, 체험, 공연 중 하나만 선택한다. 표를 이용하여 각 활동의 암묵적 비용과 기회비용을 구하고 가장 유리한 활동을 고르시오.\n\n단위는 만 원이다. 다른 대안과 매몰 비용은 없으며, 표의 편익과 명시적 비용만 고려한다.","why":"편익에서 명시적 비용을 빼면 독서는 20만 원, 체험은 22만 원, 공연은 19만 원이다. 체험을 선택하면 독서와 공연 중 가치가 더 큰 독서의 20만 원이 암묵적 비용이다.\n\n체험 선택의 기회비용은 8+20=28만 원, 순편익은 30−28=2만 원이다. 독서와 공연의 순편익은 음수이므로 체험이 가장 유리하다.","origin":""},"R03-2":{"title":"기회비용에 포함할 대안","prompt":"세 대안 중 하나만 선택한다. A의 명시적 비용은 5이다. B와 C의 편익에서 명시적 비용을 뺀 값은 각각 8과 11이다. A 선택의 기회비용을 구하시오.","why":"A를 선택하면 B와 C를 포기한다. 두 대안 중 더 큰 가치는 C의 11이므로 A의 암묵적 비용은 11이다. 명시적 비용 5를 더하면 기회비용은 16이다.","origin":""},"X03-1":{"title":"암묵적 비용·기회비용·순편익","prompt":"A의 편익과 명시적 비용은 각각 41과 12, B는 49와 17, C는 46과 13이다. 세 대안 중 하나만 선택한다. C 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.","why":"A의 편익에서 명시적 비용을 빼면 29, B는 32이다. C를 선택하면 두 대안 중 더 큰 가치인 32를 포기하므로 암묵적 비용은 32이다.\n\n기회비용은 13+32=45, 순편익은 46−45=1이다.","origin":""},"C04-01":{"title":"매몰 비용과 추가 비용","prompt":"과거 지출 60은 어떤 대안을 선택해도 회수할 수 없다. 현재 A를 선택하면 90, B를 선택하면 55를 추가로 지출한다. 각 비용을 구분하시오.","d":{"rows":["회수할 수 없는 과거 지출 60","A를 선택할 때 추가로 드는 비용 90","B를 선택할 때 추가로 드는 비용 55"],"options":["매몰 비용","현재 선택에 따라 발생하는 명시적 비용"]},"why":"이미 지출하여 돌려받을 수 없는 60은 매몰 비용이다. A의 90과 B의 55는 지금 선택하는 대안에 따라 새로 발생하는 명시적 비용이다.","origin":""},"C04-02":{"title":"편익과 비용의 비교","prompt":"A의 편익은 150, 명시적 비용은 90이고 B의 편익은 130, 명시적 비용은 55이다. 두 대안 중 하나만 선택할 때 어느 대안이 유리한가?","why":"편익에서 명시적 비용을 빼면 A는 150−90=60, B는 130−55=75이다. B의 순편익은 75−60=15로 양수이므로 B를 선택하는 것이 유리하다. A의 편익이 더 크더라도 비용까지 고려하면 결과가 달라진다.","origin":""},"C04-03":{"title":"사업 지속과 전환의 기회비용","prompt":"사업을 계속하는 A와 다른 사업으로 전환하는 B 중 하나만 선택한다. 각 대안의 암묵적 비용과 기회비용을 구하고 유리한 대안을 고르시오.\n\n단위는 만 원이다. 다른 대안과 매몰 비용은 없으며, 표의 편익과 명시적 비용만 고려한다.","why":"A를 선택하면 B에서 얻을 수 있었던 130−55=75만 원을 포기한다. 따라서 A의 기회비용은 90+75=165만 원이다. B를 선택하면 A에서 얻을 수 있었던 150−90=60만 원을 포기하므로 B의 기회비용은 55+60=115만 원이다.\n\n순편익은 A가 −15만 원, B가 15만 원이므로 B가 유리하다.","origin":""},"C04-04":{"title":"과거 지출과 합리적 선택","prompt":"A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55로 일정하다. 어떤 선택에서도 회수할 수 없는 과거 지출만 아래와 같이 다르다. 각 경우에 유리한 대안을 고르시오.","d":{"rows":["과거 지출이 20인 경우","과거 지출이 60인 경우","과거 지출이 200인 경우"]},"why":"회수할 수 없는 과거 지출은 매몰 비용이므로 현재의 선택에서 제외한다. 모든 경우에 A의 편익에서 명시적 비용을 뺀 값은 60, B는 75이다. 따라서 과거 지출의 크기와 관계없이 B가 유리하다.","origin":""},"C04-05":{"title":"사업 전환 비용이 증가한 경우","prompt":"A의 편익은 150, 명시적 비용은 90이다. B의 편익은 130이고 명시적 비용만 55에서 75로 증가하였다. 변경 후 어느 대안을 선택하는 것이 유리한가?","why":"A의 편익에서 명시적 비용을 빼면 60, 변경 후 B는 130−75=55이다. B를 선택할 때의 비용이 늘어나면서 A가 더 유리해졌다.","origin":""},"C04-06":{"title":"반환금을 받는 대안","prompt":"A의 편익과 명시적 비용은 각각 150과 90, B는 130과 75이다. 새 계약에 따라 B를 선택할 때만 반환금 20을 받는다. 반환금을 포함한 편익에서 명시적 비용을 뺀 값을 각 대안별로 구하시오. 반환금은 제시된 B의 편익에 포함되어 있지 않다.","why":"A는 반환금을 받지 않으므로 150−90=60이다. B는 반환금 20을 추가로 받으므로 130+20−75=75이다. 반환금을 포함하면 B가 더 유리하다.","d":{"labels":["A의 편익−명시적 비용","B의 반환금을 포함한 편익−명시적 비용"]},"origin":""},"C04-07":{"title":"두 대안이 동률이 되는 비용","prompt":"A의 편익에서 명시적 비용을 뺀 값은 60이고 B의 편익은 130이다. 두 대안이 동률이 되는 B의 명시적 비용을 구하시오.","why":"B의 명시적 비용을 x라고 하면 130−x=60이다. 따라서 x=70이다. 이때 A와 B의 값이 모두 60이므로 어느 한 대안만 더 유리하지는 않다.","origin":""},"C04-08":{"title":"새로운 사업 대안의 추가","prompt":"표의 세 대안 중 하나만 선택한다. 각 대안의 암묵적 비용과 기회비용을 구하고 가장 유리한 대안을 고르시오.\n\n단위는 만 원이다. 다른 대안과 매몰 비용은 없으며, 표의 편익과 명시적 비용만 고려한다.","why":"편익에서 명시적 비용을 빼면 A는 60만 원, B는 75만 원, C는 70만 원이다. B를 선택할 때에는 A와 C 중 더 큰 가치인 C의 70만 원이 암묵적 비용이다. B의 기회비용은 55+70=125만 원, 순편익은 130−125=5만 원이다.\n\nA나 C를 선택하면 B의 75만 원을 포기하므로 순편익이 음수가 된다. 따라서 B가 가장 유리하다.","origin":""},"C04-09":{"title":"명시적 비용 구하기","prompt":"A와 B 중 하나만 선택한다. A 선택의 암묵적 비용은 75이고 B의 편익은 130이다. B의 명시적 비용을 구하시오.","why":"A를 선택하면 B를 포기한다. 따라서 B의 편익 130에서 명시적 비용을 뺀 값이 A의 암묵적 비용 75이다. B의 명시적 비용은 130−75=55이다.","origin":""},"C04-10":{"title":"사업 선택의 기회비용과 순편익","prompt":"A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55이다. 두 대안 중 하나만 선택한다. 과거 지출 60은 어떤 선택에서도 회수할 수 없다. 옳은 설명을 모두 고르시오.","d":{"options":{"1":"회수할 수 없는 과거 지출 60은 매몰 비용이다.","2":"B 선택의 순편익은 15이다.","3":"B 선택의 기회비용은 115이다."}},"why":"과거 지출 60은 매몰 비용이다. B를 선택할 때의 암묵적 비용도 60이지만, 이는 과거 지출이 아니라 A를 포기한 가치 150−90=60이다.\n\nB의 기회비용은 55+60=115이고, 순편익은 130−115=15이다.","origin":""},"R04-1":{"title":"매몰 비용의 변화","prompt":"현재 두 대안의 편익과 비용은 그대로인데, 어떤 선택에서도 회수할 수 없는 과거 지출만 커졌다. 이에 대한 설명으로 옳은 것은?","d":{"options":{"0":"매몰 비용의 증가만으로 유리한 대안이 달라지지는 않는다."}},"why":"과거 지출은 매몰 비용이므로 현재의 선택에서 고려하지 않는다. 각 대안의 편익과 앞으로 부담할 비용이 같다면 과거 지출만 커져도 유리한 대안은 바뀌지 않는다.","origin":""},"R04-2":{"title":"비용이 바뀐 뒤의 선택","prompt":"A의 편익과 명시적 비용은 각각 80과 30, B는 90과 35이다. 이후 B의 명시적 비용만 45로 증가하였다. 변경 후 각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.","why":"A는 80−30=50이고, 변경 후 B는 90−45=45이다. 따라서 비용이 바뀐 뒤에는 A가 더 유리하다.","d":{"labels":["A의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"]},"origin":""},"X04-1":{"title":"B가 더 유리해지는 최소 반환금","prompt":"A의 편익과 명시적 비용은 각각 70과 20, B는 74와 30이다. B를 선택할 때만 반환금을 받으며 그 금액은 0 이상의 정수이다. B가 A보다 더 유리해지는 최소 반환금을 구하시오.","why":"A의 편익에서 명시적 비용을 빼면 50이다. 반환금을 r라고 하면 B는 74+r−30=44+r이다.\n\nB가 더 유리하려면 44+r>50이어야 하므로 r>6이다. 반환금은 정수이므로 최소값은 7이다. 6에서는 두 대안이 같아진다.","origin":""},"C05-01":{"title":"생산에 따른 외부 불경제","prompt":"기업의 생산 활동으로 인근 주민이 피해를 입었지만 기업은 이를 보상하지 않았다. 이 사례에 해당하는 개념은?","why":"기업이 생산 과정에서 다른 경제 주체인 주민에게 피해를 주고도 그 대가를 지불하지 않았으므로 외부 불경제에 해당한다.","origin":""},"C05-02":{"title":"개인 이익이 가장 큰 활동량","prompt":"표를 보고 개인 이익이 가장 큰 활동량을 고른 뒤, 그때의 개인 이익을 입력하시오.\n\n개인 이익과 제3자의 피해는 같은 금액 단위이며 다른 효과는 없다. 이 문제에서는 개인 이익만 비교한다.","why":"개인 이익은 활동량이 4일 때 76으로 가장 크다. 따라서 활동량은 4, 개인 이익은 76이다.","origin":""},"C05-03":{"title":"피해를 고려한 활동량","prompt":"개인 이익에서 제3자의 피해를 뺀 값이 가장 큰 활동량을 고른 뒤, 그때의 금액을 입력하시오.\n\n이익과 피해는 같은 금액 단위이며 다른 효과는 없다.","why":"개인 이익에서 제3자의 피해를 빼면 활동량별로 0, 32, 48, 42, 24이다. 활동량이 2일 때 48로 가장 크므로 피해까지 고려한 유리한 활동량은 2이다.","origin":""},"C05-04":{"title":"외부 효과에 대한 정부의 대응","prompt":"각 외부 효과를 개선하기 위한 정부의 대응을 고르시오.","d":{"options":["세금·부담금 등으로 생산과 소비를 억제한다.","세금 감면·보조금 등으로 생산과 소비를 촉진한다."]},"why":"외부 경제가 발생하면 사회적 최적 수준보다 적게 생산하거나 소비하므로 세금 감면과 보조금으로 생산·소비를 늘릴 수 있다. 외부 불경제가 발생하면 사회적 최적 수준보다 많이 생산하거나 소비하므로 세금이나 부담금으로 생산·소비를 줄일 수 있다.","origin":""},"C05-05":{"title":"부담금을 낸 뒤의 이익","prompt":"활동 1단위당 부담금 14를 낸다. 부담금을 낸 뒤 개인에게 남는 이익이 가장 큰 활동량을 고르고, 그때의 이익을 입력하시오. 표에 없는 다른 효과는 없다.","why":"부담금 총액은 활동량에 14를 곱하여 구한다. 개인 이익에서 총부담금을 빼면 활동량별로 0, 22, 32, 30, 20이다. 따라서 활동량이 2일 때 납부 후 이익이 32로 가장 크다.","origin":""},"C05-06":{"title":"생산자 이익과 정부 수입","prompt":"생산량은 2, 부담금 납부 전 이익은 60, 부담금 총액은 28, 주민 피해는 12이다. 생산자가 낸 부담금 28은 정부의 수입이다. 행정 비용 등 다른 효과는 없다. 아래 각 금액을 구하시오.","d":{"labels":["생산자의 납부 후 이익","정부의 부담금 수입","생산자 이익+정부 수입−주민 피해"]},"why":"부담금을 낸 뒤 생산자에게 남는 이익은 60−28=32이다. 정부는 부담금 28을 수입으로 얻는다.\n\n두 주체의 금액을 더하고 주민 피해를 빼면 32+28−12=48이다. 생산자 이익에서는 이미 부담금이 빠졌으므로 합계에서 다시 빼지 않는다.","origin":""},"C05-07":{"title":"제3자의 편익을 더한 활동량","prompt":"개인 이익과 제3자의 편익을 더한 값이 가장 큰 활동량을 고르고, 그때의 합계를 입력하시오. 두 금액의 단위는 같으며 다른 효과는 없다.","why":"개인 이익과 제3자의 편익을 더하면 활동량별로 0, 32, 56, 70, 78이다. 활동량이 4일 때 합계가 78로 가장 크다.","origin":""},"C05-08":{"title":"보조금을 받은 뒤의 이익","prompt":"활동 1단위당 보조금 10을 받는다. 보조금을 포함한 개인 이익이 가장 큰 활동량을 고르고, 그때의 금액을 입력하시오. 표에 없는 다른 효과는 없다.","why":"보조금 총액은 활동량에 10을 곱하여 구한다. 개인 이익에 보조금을 더하면 0, 34, 56, 64, 68이다. 활동량이 4일 때 68로 가장 크다.","origin":""},"C05-09":{"title":"외부 불경제의 사례","prompt":"각 사례가 외부 불경제에 해당하는지 판단하시오.","d":{"rows":["생산자의 배출물로 주민이 피해를 입었지만 보상받지 못했다.","상품 구매자가 판매자에게 약정한 가격을 지불했다.","경제활동과 무관한 자연재해로 설비가 파손되었다."],"options":["외부 불경제에 해당한다.","제시된 내용은 외부 불경제 사례가 아니다."]},"why":"공장의 배출물로 주민이 피해를 입고 보상받지 못한 것은 외부 불경제이다.\n\n상품을 사고 가격을 지불한 것은 거래 당사자 사이에서 대가를 주고받은 경우이다. 경제활동과 무관한 자연재해의 피해도 다른 경제 주체의 생산이나 소비에서 발생한 것이 아니므로 외부 불경제에 해당하지 않는다.","origin":""},"C05-10":{"title":"외부 경제와 과소 생산","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["긍정적 외부 효과가 발생하면","사회적 적정 수준보다 많이 생산·소비된다","."],"options":["사회적 적정 수준보다 적게 생산·소비된다","항상 사회적 적정 수준만큼 생산·소비된다","어떤 생산·소비도 이루어지지 않는다"]},"why":"긍정적 외부 효과인 외부 경제가 발생하면 다른 경제 주체에게 돌아가는 이익이 개인의 선택에 충분히 반영되지 않는다. 따라서 사회적 최적 수준보다 적게 생산하거나 소비하게 된다.","origin":""},"R05-1":{"title":"외부 경제와 외부 불경제","prompt":"각 사례에 해당하는 외부 효과를 고르시오.","d":{"rows":["경제활동으로 제3자에게 피해를 주었지만 보상하지 않았다.","경제활동으로 제3자에게 이익을 주었지만 대가를 받지 못했다."]},"why":"경제활동으로 제3자에게 피해를 주고도 보상하지 않으면 외부 불경제이다. 제3자에게 이익을 주고도 대가를 받지 못하면 외부 경제이다.","origin":""},"R05-2":{"title":"제3자 피해를 고려한 선택","prompt":"개인 이익에서 제3자의 피해를 뺀 값이 가장 큰 활동량과 그때의 금액을 구하시오. 두 금액의 단위는 같으며 다른 효과는 없다.","why":"활동량별로 개인 이익에서 피해를 빼면 0, 18, 25, 18이다. 활동량이 2일 때 25로 가장 크다.","origin":""},"X05-1":{"title":"축제 규모와 주민 피해","prompt":"개인 이익에서 주민 피해를 뺀 값이 가장 큰 활동량을 고르고, 그때의 금액을 입력하시오. 이익과 피해는 같은 금액 단위이며 다른 효과는 없다.","why":"활동량별로 개인 이익에서 주민 피해를 빼면 0, 24, 34, 26이다. 활동량이 2일 때 34로 가장 크므로 주민 피해까지 고려하면 활동량 2가 유리하다.","origin":""},"C06-01":{"title":"공공재의 두 특성","prompt":"각 설명에 해당하는 공공재의 특성을 고르시오.","d":{"rows":["대가를 지불하지 않은 사람을 소비에서 배제할 수 없다.","한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다."]},"why":"대가를 지불하지 않은 사람의 소비를 막을 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는 것은 비경합성이다.","origin":""},"C06-02":{"title":"네 주민의 가로등 모금","prompt":"네 주민은 각각 10토큰을 가지고 있으며 설치비로 6토큰씩 냈다. 가로등 설치비는 24토큰이고, 설치되면 각 주민은 편익 10을 얻는다. 전체 납부액과 설치 후 각자의 남은 토큰·편익의 합을 구하시오.","d":{"labels":["전체 납부액","설치 후 각자의 남은 토큰과 편익의 합"]},"why":"전체 납부액은 6×4=24토큰으로 설치비가 모두 모인다. 각 주민은 6토큰을 내고 4토큰을 남기며, 가로등에서 편익 10을 얻는다. 남은 토큰과 편익의 합은 4+10=14이다.","origin":""},"C06-03":{"title":"납부액과 가로등 설치","prompt":"네 주민은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하며, 설치되면 납부 여부와 관계없이 각자 편익 10을 얻는다. 설치에 실패하면 납부액을 돌려받는다.\n\n다른 세 주민의 납부액은 표와 같이 정해져 있다. 0·4·6·10토큰 중 내게 가장 유리한 납부액을 고르고, 남은 토큰과 편익의 합을 입력하시오.","why":"다른 주민이 낸 돈은 모두 18토큰이다. 내가 6토큰을 내면 24토큰이 모여 가로등이 설치되고, 남은 토큰과 편익의 합은 10−6+10=14이다.\n\n0토큰이나 4토큰을 내면 설치에 실패한다. 낸 금액만 돌려받으므로 처음과 같이 총 10토큰을 보유한다. 10토큰을 내면 설치되지만 남은 토큰과 편익의 합은 10이다. 따라서 제시된 납부액 중 6토큰이 가장 유리하다.","origin":""},"C06-04":{"title":"다른 주민이 설치비를 모두 낸 경우","prompt":"네 주민은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하며, 설치되면 납부 여부와 관계없이 각자 편익 10을 얻는다. 설치에 실패하면 납부액을 돌려받는다.\n\n다른 주민의 납부액은 표와 같다. 0·4·6·10토큰 중 내게 가장 유리한 납부액을 고르고, 남은 토큰과 편익의 합을 입력하시오.","why":"다른 주민만으로 8+8+8=24토큰이 모였다. 내가 비용을 내지 않아도 가로등이 설치된다. 0토큰을 내면 보유 토큰 10을 그대로 남기고 편익 10을 얻으므로 합은 20이다. 비용을 더 내면 남는 토큰만 줄어드므로 0토큰이 가장 유리하다.","origin":""},"C06-05":{"title":"가로등 설치 조건","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["다른 주민의 납부액 합계와 설치비가 모두 24이면","가로등을 설치할 수 없다","."],"options":["가로등을 설치할 수 있다","다른 납부액과 관계없이 언제나 설치할 수 없다","설치 여부를 판단할 정보가 전혀 없다"]},"why":"다른 주민이 낸 금액이 24토큰이고 설치비도 24토큰이면 필요한 비용이 모두 모인 것이다. 따라서 가로등을 설치할 수 있다. 비용을 내지 않고 이용하는 사람이 있어도 모금액이 충분하면 설치에 성공한다.","origin":""},"C06-06":{"title":"공공재 공급과 정부","prompt":"공공재가 시장에서 충분히 공급되지 않을 때 정부가 할 수 있는 역할은?","why":"공공재는 대가를 내지 않은 사람의 소비를 막기 어려워 민간 기업이 생산을 통해 이윤을 얻기 어렵다. 정부는 공공재 생산과 공급에 직접 참여하여 공급 부족을 보완할 수 있다.","origin":""},"C06-07":{"title":"가격 담합의 근거","prompt":"다음 자료 중 업체들이 가격을 담합하였음을 보여 주는 근거로 가장 적절한 것은?","d":{"options":["여러 업체의 판매 가격이 같다는 사실만으로 담합을 확인할 수 있다.","업체들이 가격을 함께 올리기로 합의한 문서가 있다.","업체 수가 적다는 사실만으로 담합을 확인할 수 있다."]},"why":"업체들이 가격 인상에 합의한 문서는 서로 경쟁하지 않고 가격을 함께 정했다는 근거이다. 반면 판매 가격이 같거나 업체 수가 적다는 사실만으로 실제 합의가 있었다고 단정할 수는 없다.","origin":""},"C06-08":{"title":"판매자와 구매자의 정보 차이","prompt":"중고 물품 거래에 관한 두 자료를 읽고 옳은 설명을 고르시오.","why":"판매자는 제품의 상태를 알지만 구매자는 알지 못한다. 거래에 필요한 정보가 두 당사자 사이에 다르므로 정보의 비대칭성이 나타난다.","origin":""},"C06-09":{"title":"정보의 비대칭성을 줄이는 방법","prompt":"판매자와 구매자 사이의 제품 정보 차이를 줄이는 데 도움이 되는 것은?","why":"제품 상태의 검사 결과를 제공하면 구매자가 품질을 파악하기 쉬워진다. 품질 보증 역시 거래의 불확실성을 줄이는 데 도움이 된다. 이러한 제도는 정보의 비대칭성을 개선할 수 있다.","origin":""},"C06-10":{"title":"시장 실패의 유형","prompt":"각 사례에 해당하는 시장 실패의 원인을 고르시오.","d":{"rows":["가로등 설치에 필요한 모금액이 부족하다.","업체들이 가격을 함께 올리기로 합의한다.","판매자가 아는 제품 상태를 구매자는 모른다.","생산 오염으로 입은 피해를 보상받지 못한다."]},"why":"가로등 공급 부족은 공공재의 특성과 관련된다. 업체들의 가격 인상 합의는 경쟁을 제한하는 담합이다. 판매자와 구매자의 제품 정보 차이는 정보의 비대칭성이고, 보상되지 않은 생산 오염 피해는 외부 불경제이다.","origin":""},"R06-1":{"title":"부족한 설치비와 나의 납부액","prompt":"네 주민은 각각 10토큰을 가지고 있으며 가로등 설치비는 24토큰이다. 설치되면 각자 편익 10을 얻고, 설치에 실패하면 납부액을 돌려받는다.\n\n다른 세 주민의 납부액은 표와 같이 고정되어 있다. 0·4·6·10토큰 중 내게 가장 유리한 납부액을 고르고, 남은 토큰과 편익의 합을 입력하시오.","why":"다른 주민의 납부액은 8+6+4=18토큰이다. 내가 6토큰을 내면 총 24토큰이 모여 설치에 성공하며, 남은 토큰과 편익의 합은 14이다. 0토큰이나 4토큰을 내면 설치에 실패하고, 10토큰을 내면 설치 후 합이 10이므로 6토큰이 가장 유리하다.","origin":""},"R06-2":{"title":"비배제성과 비경합성","prompt":"각 설명에 해당하는 특성을 고르시오.","d":{"rows":["대가를 내지 않은 사람을 소비에서 배제할 수 없다.","한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는다."]},"why":"대가를 내지 않은 사람을 소비에서 배제할 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 것은 비경합성이다.","origin":""},"X06-1":{"title":"경쟁·정보·공공재의 구별","prompt":"각 자료에 나타난 문제나 재화의 특성을 고르시오.","d":{"rows":["여러 판매자가 공급 수량을 함께 제한하기로 합의한 문서가 있다.","판매자는 제품의 결함을 알지만 구매자는 모른다.","가로등 비용을 내지 않은 사람도 불빛을 이용할 수 있다."]},"why":"판매자들이 공급량을 함께 제한하기로 합의한 것은 경쟁을 제한하는 행위이다. 제품의 결함을 판매자만 아는 것은 정보의 비대칭성이다. 가로등 비용을 내지 않은 사람도 불빛을 이용할 수 있는 것은 비배제성이다.","origin":""},"C07-01":{"title":"경제 주체의 역할","prompt":"각 활동을 담당하는 경제 주체를 고르시오.","why":"정부는 공정한 경쟁 질서를 마련한다. 기업가는 위험을 감수하며 기술 혁신과 새로운 시장 개척을 추진한다. 노동자는 자신의 권리를 추구하며 생산에 참여하고, 소비자는 소비가 사회에 미치는 영향을 고려한다.","origin":""},"C07-02":{"title":"기업가 정신과 기술 혁신","prompt":"다음 자료에 나타난 기업의 활동에 대한 설명으로 옳은 것은?","why":"성공 여부가 불확실한 기술에 투자하고 새로운 시장에 도전하는 모습에서 기업가 정신을 찾을 수 있다. 기업가 정신은 이윤을 추구하는 과정에서 위험과 불확실성을 무릅쓰고 도전하는 정신이다.","origin":""},"C07-03":{"title":"노동 3권","prompt":"각 활동에 해당하는 노동자의 권리를 고르시오.","why":"노동조합을 조직하거나 가입하는 것은 단결권의 행사이다. 노동조합을 통해 사용자와 임금이나 근로 조건을 협상하는 것은 단체 교섭권, 파업 등 쟁의 행위를 하는 것은 단체 행동권과 관련된다.","origin":""},"C07-04":{"title":"기업의 사회적 책임","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","why":"기업은 이윤을 추구하면서도 법규를 준수하고 노동자와 소비자의 권리를 존중해야 한다. 기업 활동이 지역 사회와 환경에 미치는 영향을 고려하여 사회적 책임을 다할 필요가 있다.","origin":""},"C07-05":{"title":"기업 활동을 검토할 자료","prompt":"예산 9 안에서 노동, 환경, 소비자 정보에 관한 문서를 각각 1개 이상 준비하시오. 각 항목은 최대 1개까지 선택할 수 있다. 표의 값은 해당 항목을 선택했을 때 얻는 문서의 수이다.","why":"재교육 검토서, 환경 설비 검토서, 품질 공개 계획을 고르면 세 분야의 문서를 모두 준비할 수 있다. 비용은 4+3+2=9로 예산과 같다. 장식 변경은 필요한 문서를 제공하지 않는다.","origin":""},"C07-06":{"title":"윤리적 소비와 합리적 소비","prompt":"갑은 윤리적 상품을 구매하며 얻는 만족을 편익에 포함하고, 그 편익과 기회비용을 비교하였다. 이러한 소비에 대한 설명으로 옳은 것은?","why":"윤리적 가치를 실천하면서 얻는 만족도 편익에 포함될 수 있다. 이를 고려한 순편익이 가장 큰 대안을 선택한다면 윤리적이면서 합리적인 소비가 가능하다.","origin":""},"C07-07":{"title":"정부의 문제 해결 방안","prompt":"각 문제를 해결하는 데 알맞은 정부의 대응을 고르시오.","why":"품질 보증과 정보 표시는 정보의 비대칭성을 줄이는 데 도움이 된다. 정부의 공공재 생산은 공급 부족을 보완한다. 보조금은 외부 경제가 발생하는 활동을 늘릴 수 있으며, 소득 재분배는 경제적 불평등을 완화하기 위한 역할이다.","origin":""},"C07-08":{"title":"친환경 광고를 확인할 자료","prompt":"다음 자료를 바탕으로 친환경 광고에 대해 내린 판단으로 옳은 것은?","why":"친환경 광고의 내용이 사실인지 알려면 생산 과정의 자원 사용량과 폐기물 등에 관한 자료가 필요하다. 윤리적 소비를 위해서는 상품의 품질과 노동 조건도 살펴볼 수 있다. 광고에 사용된 그림은 이러한 사실을 뒷받침하는 근거가 되기 어렵다.","origin":""},"C07-09":{"title":"지속가능발전을 위한 실천","prompt":"지속가능발전을 위한 실천으로 적절한 것을 모두 고르시오.","why":"지속가능발전은 경제적 성과와 함께 사회적 책임, 환경 보전, 미래 세대의 필요를 고려한다. 현재의 이윤만을 위해 노동자의 권리나 소비자의 안전을 무시하는 것은 적절하지 않다.","origin":""},"C07-10":{"title":"소비자 주권","prompt":"소비자가 재화와 서비스의 종류나 수량을 결정하는 데 결정적인 권한을 가진다는 개념은?","why":"소비자 주권이다. 소비자가 무엇을 얼마나 구매하는지는 기업이 어떤 상품을 얼마나 생산할지에 영향을 미친다.","origin":""},"R07-1":{"title":"윤리적 소비와 합리성","prompt":"윤리적 소비와 합리적 소비의 관계에 대한 설명으로 옳은 것은?","why":"윤리적 소비에서 얻는 만족도 편익에 포함될 수 있다. 그 편익과 기회비용을 고려하여 순편익이 가장 큰 대안을 선택한다면 윤리적 소비가 합리적 소비일 수 있다.","origin":""},"R07-2":{"title":"활동에 따른 경제 주체의 구분","prompt":"각 활동을 하는 경제 주체를 고르시오.","why":"기술 혁신의 위험을 감수하는 주체는 기업가이다. 노동조합을 통해 근로 조건을 협상하는 주체는 노동자이고, 상품 선택으로 생산에 영향을 미치는 주체는 소비자이다.","origin":""},"X07-1":{"title":"윤리적 만족을 포함한 선택","prompt":"A의 편익은 16, 가격은 7이다. B의 편익은 윤리적 만족을 포함하여 22이고 가격은 11이다. 두 상품 중 하나만 선택하며, 제시된 편익과 비용만 고려한다. 각 상품의 편익에서 가격을 뺀 값을 구하시오.","why":"A는 16−7=9, B는 22−11=11이다. B의 가격은 더 높지만 윤리적 만족을 포함한 편익도 더 크다. 두 대안의 편익과 비용을 함께 비교하면 B를 선택하는 것이 유리하다.","d":{"labels":["A의 편익−가격","B의 윤리적 만족을 포함한 편익−가격"]},"origin":""},"C08-01":{"title":"금융 자산별 수익","prompt":"각 설명에 해당하는 금융 자산을 고르시오. 예금, 주식, 채권의 일반적인 특징을 기준으로 한다.","d":{"rows":["이자 수익을 기대할 수 있지만 시세 차익은 기대할 수 없다.","이자 수익 대신 배당 수익을 기대할 수 있다.","이자 수익과 시세 차익을 모두 기대할 수 있다."]},"why":"정기 예금에서는 이자 수익을 기대할 수 있다. 주식에서는 배당 수익과 시세 차익을, 채권에서는 이자 수익과 시세 차익을 기대할 수 있다.","origin":""},"C08-02":{"title":"채권 보유자의 지위","prompt":"다음 발행 자료에 나타난 증서를 보유한 사람의 지위는?","why":"자금을 빌리면서 원금과 이자의 지급을 약속하고 발행한 차용 증서는 채권이다. 채권 보유자는 발행자에게 돈을 빌려준 채권자이다. 기업의 지분을 소유한 주주와는 다르다.","origin":""},"C08-03":{"title":"예금의 종류","prompt":"각 납입 방식과 입출금 조건에 해당하는 예금의 종류를 고르시오.","why":"목돈을 한 번에 맡기는 것은 정기 예금, 일정 금액을 정기적으로 납입하는 것은 정기 적금이다. 입금과 출금이 자유로운 것은 요구불 예금이다.","origin":""},"C08-04":{"title":"주주와 채권자의 차이","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"options":["기업의 지분을 가진 주주","금융 기관에 돈을 맡긴 예금자","다른 사람의 채무를 인수한 사람"]},"why":"주식은 기업에 대한 투자자의 지분을 나타내며, 주식을 보유한 사람은 주주이다. 돈을 빌려준 채권자와 구별된다. 주주는 배당 수익을, 채권자는 이자 수익을 기대할 수 있다.","origin":""},"C08-05":{"title":"시세 차익과 배당","prompt":"주식 1주를 100에 사서 120에 팔고 배당 3을 받았다. 세금과 수수료는 없다. 시세 차익과 배당을 포함한 총이익을 각각 구하시오.","why":"시세 차익은 매도 가격에서 매수 가격을 뺀 120−100=20이다. 배당 3을 더하면 총이익은 23이다. 매도 대금 120에는 처음 투자한 금액도 포함되어 있다.","origin":""},"C08-06":{"title":"주식과 채권의 공통점","prompt":"주식과 채권에 공통으로 해당하는 설명을 모두 고르시오.","why":"주식과 채권은 모두 매매할 수 있으므로 시세 차익을 기대할 수 있다. 가격이 하락하면 매매 손실이 발생할 수도 있다. 다만 보유자의 지위는 주주와 채권자로 다르며, 채권에서는 배당 수익을 기대할 수 없다.","origin":""},"C08-07":{"title":"주식과 채권 발행의 영향","prompt":"새로 발행할 때의 영향과 보유자의 지위를 보고 해당 금융 자산을 고르시오.","why":"주식을 새로 발행하여 자금을 조달하면 발행자의 자본금이 늘며, 보유자는 주주가 된다. 채권 발행은 자금을 빌리는 것이므로 발행자의 부채가 늘고, 보유자는 채권자가 된다.","origin":""},"C08-08":{"title":"금융 자산 선택의 기회비용","prompt":"세 금융 자산 중 하나만 선택한다. 표의 편익은 수익과 안전성에서 얻는 만족 등을 금액으로 나타낸 값이다. 실제 수익률을 뜻하지 않는다. 표의 편익과 명시적 비용만 고려하여 비용표를 완성하시오. 원금은 명시적 비용에 추가하지 않는다.","why":"명시적 비용이 모두 0이므로 편익에서 명시적 비용을 뺀 값은 A가 90, B가 80, C가 100이다. A나 B를 선택하면 C의 100을 포기한다. C를 선택할 때에는 남은 대안 중 가치가 더 큰 A의 90을 포기한다.\n\n따라서 C 선택의 순편익은 100−90=10으로 가장 크다.","origin":""},"C08-09":{"title":"수익 형태로 금융 자산 구분하기","prompt":"A~C는 각각 정기 예금, 주식, 채권 중 하나이다. 다음 자료를 바탕으로 A~C를 옳게 구분한 것은?","d":{"options":["A: 채권 / B: 정기 예금 / C: 주식","A: 정기 예금 / B: 주식 / C: 채권","A~C 모두 정기 예금"]},"why":"이자 수익만 기대하는 A는 정기 예금이다. 배당 수익을 기대하는 B는 주식이고, 이자 수익과 시세 차익을 모두 기대하는 C는 채권이다.","origin":""},"C08-10":{"title":"정기 적금의 납입 방식","prompt":"계약 기간 동안 일정한 금액을 정기적으로 납입하는 예금은?","why":"정기 적금이다. 정기 적금은 일정 금액을 나누어 납입한다. 계좌를 개설할 때 목돈을 한 번에 맡기는 정기 예금과 납입 방식이 다르다.","origin":""},"R08-1":{"title":"예금·주식·채권의 수익 비교","prompt":"각 수익 형태에 해당하는 금융 자산을 고르시오. 일반적으로 기대할 수 있는 수익을 기준으로 한다.","why":"예금에서는 이자 수익, 채권에서는 이자 수익과 시세 차익, 주식에서는 배당 수익과 시세 차익을 기대할 수 있다.","origin":""},"R08-2":{"title":"매매 손실과 배당","prompt":"주식 1주를 80에 사서 75에 팔고 배당 2를 받았다. 다른 비용은 없다. 매매 손익과 배당을 포함한 총손익을 각각 구하시오.","why":"매매 손익은 75−80=−5이다. 여기에 배당 2를 더하면 총손익은 −3이다. 배당을 받았지만 매매 손실이 더 크므로 전체적으로는 손실이 발생하였다.","origin":""},"X08-1":{"title":"주식 수를 고려한 손익","prompt":"주식 3주를 주당 40에 사서 주당 44에 팔았다. 배당은 주당 2이며 다른 비용은 없다. 매수 총액, 매매 차익, 배당을 포함한 총이익을 각각 구하시오.","why":"매수 총액은 주당 가격에 주식 수를 곱한 40×3=120이다. 주당 매매 차익은 44−40=4이므로 세 주의 매매 차익은 12이다. 배당 총액은 2×3=6이다. 따라서 매매 차익과 배당을 합한 총이익은 18이다.","origin":""},"C09-01":{"title":"자산 관리의 세 원칙","prompt":"각 설명에 해당하는 자산 관리의 원칙을 고르시오.","why":"안전성은 자산의 가치가 안전하게 보호될 수 있는 정도이다. 수익성은 자산 가치의 상승이나 이자 수익 등을 기대할 수 있는 정도이고, 유동성은 자산을 현금으로 쉽게 바꿀 수 있는 정도이다.","origin":""},"C09-02":{"title":"돈이 필요한 시기와 현금화","prompt":"다음 약정과 자금 사용 계획을 보고, 지출 기한에 맞게 사용할 수 있는 자산에 대한 설명을 고르시오.","why":"돈을 써야 하는 날은 내일이다. A는 오늘 현금화할 수 있으므로 내일의 지출에 사용할 수 있다. B는 한 달 뒤에만 현금화할 수 있으므로 제시된 약정 아래에서는 내일의 지출에 사용할 수 없다.","origin":""},"C09-03":{"title":"필요한 현금을 남기는 자산 배분","prompt":"세 자산의 단위 가격은 모두 10이다. 투자금 100을 전부 배분하되, 즉시 사용할 수 있는 금액이 30 이상이 되도록 각 자산의 수량을 정하시오. 제시된 약정만 고려하며 수익이 가장 큰 조합을 찾을 필요는 없다.","why":"A를 3단위, B를 4단위, C를 3단위 보유하면 총투자금은 (3+4+3)×10=100이다. 즉시 사용할 수 있는 금액도 30이므로 조건을 충족한다.\n\n이는 정답의 한 예이다. 투자금 100을 전부 사용하고 즉시 사용 가능액이 30 이상인 다른 조합도 정답이다.","origin":""},"C09-04":{"title":"펀드·보험·연금","prompt":"각 설명에 해당하는 금융 상품을 고르시오.","why":"펀드는 전문 기관이 투자자들로부터 모은 돈을 운용하는 간접 투자 상품이다. 보험은 사고가 발생했을 때의 손실에 대비하며, 연금은 노후 생활의 안정을 목적으로 한다.","origin":""},"C09-05":{"title":"펀드의 원금 손실 위험","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["펀드는 전문가가 운용하더라도","원금 손실 위험이 없다","."],"options":["원금 손실 위험이 있다","예금과 모든 특징이 같다","배당이 반드시 보장된다"]},"why":"펀드는 전문가가 대신 운용하지만 운용 결과에 따라 원금 손실이 발생할 수 있다. 따라서 ‘원금 손실 위험이 없다’를 ‘원금 손실 위험이 있다’로 고쳐야 한다.","origin":""},"C09-06":{"title":"수익성과 안전성","prompt":"수익성과 안전성의 일반적인 관계에 대한 설명으로 옳은 것은?","why":"일반적으로 높은 수익을 기대할 수 있는 금융 자산은 원금 손실 위험도 크다. 반대로 안전성이 높은 금융 자산은 높은 수익을 기대하기 어렵다.","origin":""},"C09-07":{"title":"분산 투자 후의 자산 금액","prompt":"A와 B에 각각 50을 투자하였다. 상황 1에서 수익률은 A가 +20%, B가 −10%이고, 상황 2에서는 A가 −20%, B가 +10%이다. 세금과 수수료는 없다. 각 상황에서 두 자산의 최종 금액을 합하여 구하시오.","why":"상황 1에서는 A가 50×1.2=60, B가 50×0.9=45이므로 합계는 105이다.\n\n상황 2에서는 A가 50×0.8=40, B가 50×1.1=55이므로 합계는 95이다. 처음 투자한 100보다 적으므로 분산 투자했더라도 손실이 발생한다.","origin":""},"C09-08":{"title":"금융 상품과 분산 투자","prompt":"금융 상품과 분산 투자에 대한 설명으로 옳은 것을 모두 고르시오.","why":"보험은 사고로 인한 손실에 대비하고, 연금은 노후 생활의 안정을 목적으로 한다. 펀드는 전문가가 운용해도 원금 손실 위험이 있다. 분산 투자는 위험을 줄이는 방법이지만 모든 위험을 없애지는 못한다.","origin":""},"C09-09":{"title":"목적에 따른 금융 계획","prompt":"다음 세 사람의 계획을 보고, 금융 자산을 선택할 때 고려할 사항으로 적절한 것을 고르시오.","why":"갑은 가까운 시기의 지출, 을은 장기적인 목표, 병은 사고에 따른 손실에 대비하려 한다. 돈을 사용할 목적과 시기, 감당할 수 있는 위험을 고려하여 각자의 계획에 알맞은 금융 자산을 선택해야 한다.","origin":""},"C09-10":{"title":"유동성의 의미","prompt":"어떤 자산은 현금으로 쉽게 바꿀 수 있지만 가치가 크게 하락할 가능성도 있다. 이 중 ‘현금으로 쉽게 바꿀 수 있다’는 특징에 해당하는 자산 관리 원칙은?","why":"유동성이다. 유동성은 현금으로 바꾸기 쉬운 정도이고, 안전성은 자산 가치가 보호되는 정도이다. 두 원칙은 구별된다.","origin":""},"R09-1":{"title":"자산 관리 원칙과 금융 상품","prompt":"각 설명에 해당하는 개념이나 금융 상품을 고르시오.","why":"현금으로 쉽게 바꿀 수 있는 정도는 유동성이다. 사고 손실에 대비하는 상품은 보험이고, 노후 생활의 안정을 위한 상품이나 제도는 연금이다.","origin":""},"R09-2":{"title":"분산 투자와 손실","prompt":"여러 금융 자산에 나누어 투자했지만 일부 자산에서 손실이 발생하였다. 이에 대한 설명으로 옳은 것은?","why":"분산 투자는 특정 자산에 투자가 집중되는 위험을 줄이는 방법이다. 원금이나 수익을 보장하는 것은 아니므로 분산 투자한 경우에도 손실이 발생할 수 있다.","origin":""},"X09-1":{"title":"투자 비중을 고려한 총손익","prompt":"A에 80, B에 20을 투자하였다. A의 수익률은 +10%, B의 수익률은 −20%이며 다른 비용은 없다. 각 자산의 최종 금액과 전체 투자금의 총손익을 구하시오.","why":"A는 80×1.1=88, B는 20×0.8=16이다. 최종 금액의 합은 104이고 처음 투자한 금액의 합은 100이므로 총손익은 4이다.\n\n두 자산에 투자한 금액이 다르므로 수익률을 단순히 더하여 평균을 내면 전체 수익률을 구할 수 없다.","origin":""},"C10-01":{"title":"금융 생활 설계의 순서","prompt":"금융 생활 설계의 다섯 단계를 순서대로 배열하시오.","why":"먼저 재무 목표를 정하고 현재의 재무 상태를 분석한다. 이를 바탕으로 계획을 수립하여 실행한다. 실행한 뒤에는 결과를 평가하고 문제점을 찾아 계획을 수정한다.","origin":""},"C10-02":{"title":"재무 설계 단계별 활동","prompt":"각 활동에 해당하는 재무 설계 단계를 고르시오.","why":"앞으로 필요한 금액을 정하는 것은 재무 목표 설정이다. 자산·부채·수입·지출을 파악하는 것은 재무 상태 분석이다. 결산 후 문제점을 찾아 계획을 바꾸는 것은 평가 및 수정에 해당한다.","origin":""},"C10-03":{"title":"총수입과 월말 잔액","prompt":"초기 자금은 0이다. 6개월 동안 매월 초에 200을 받고 매월 말에 200을 지출하며 대출은 없다. 6개월간 총수입과 6개월째 월말의 잔액을 각각 구하시오.","why":"총수입은 200×6=1,200이고 총지출도 200×6=1,200이다. 따라서 6개월째 월말의 잔액은 0이다. 총수입 1,200이 그대로 남는 것은 아니다.","origin":""},"C10-04":{"title":"수입을 받기 전에 필요한 자금","prompt":"6개월 동안 매월 말에 200을 지출한다. 수입 1,200은 6개월째 월초에 한 번 들어온다. 남은 돈은 다음 달로 넘길 수 있지만 대출을 받거나 지출을 미룰 수는 없다. 모든 지출 기한을 지키는 데 필요한 최소 초기 자금을 구하시오.","why":"수입을 받기 전에 첫 다섯 달의 지출을 감당해야 한다. 필요한 돈은 200×5=1,000이다.\n\n초기 자금이 1,000이면 첫 다섯 달의 지출을 할 수 있고, 6개월째에는 월초에 받는 수입으로 마지막 지출을 할 수 있다. 따라서 최소 초기 자금은 1,000이다.","origin":""},"C10-05":{"title":"수입이 먼저 들어오는 경우","prompt":"초기 자금은 0이며 첫 달 월초에 1,200을 받는다. 남은 돈을 다음 달로 넘길 수 있을 때, 6개월 동안 매월 말에 200씩 지출할 수 있는가?","why":"처음 받은 1,200으로 200씩 여섯 번 지출할 수 있다. 매달 남은 돈을 다음 달로 넘겨 사용하면 되므로 별도의 초기 자금이 필요하지 않다.","origin":""},"C10-06":{"title":"단리와 복리의 원리금","prompt":"원금 100을 연 10%로 2년 동안 예치한다. 매년 말에 이자를 계산하며 다른 비용은 없다. 단리와 연복리를 적용한 원리금을 각각 구하시오.","why":"단리에서는 매년 원금 100에 대해서만 이자를 계산한다. 해마다 이자 10이 붙으므로 2년 뒤 원리금은 100+10+10=120이다.\n\n복리에서는 첫해의 원리금 110에도 이자가 붙는다. 둘째 해 말에는 110×1.1=121이 된다.","origin":""},"C10-07":{"title":"납입 시점에 따른 복리 계산","prompt":"연 10% 복리 상품에 첫해 초 100, 둘째 해 초 100을 넣고 둘째 해 말에 찾는다. 다른 입출금, 세금, 수수료는 없다. 각 납입금의 원리금과 합계를 구하시오.","why":"첫해 초에 넣은 돈에는 2년간 이자가 붙는다. 원리금은 100×1.1²=121이다. 둘째 해 초에 넣은 돈에는 1년간 이자가 붙으므로 원리금은 110이다. 두 금액을 합하면 231이다.","origin":""},"C10-08":{"title":"재무 계획의 평가와 수정","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["금융 생활 설계에서는","실행한 뒤 평가하거나 수정할 필요가 없다","."]},"why":"금융 생활 설계에서는 계획을 실행한 뒤에도 결산을 통해 결과와 문제점을 살펴야 한다. 평가 결과를 바탕으로 계획을 수정할 필요가 있다.","origin":""},"C10-09":{"title":"지출 기한에 부족한 돈","prompt":"다음 자료를 보고 지출 기한에 필요한 돈을 마련할 수 있는지 판단하시오.","d":{"clues":["3개월 말에 300을 지출해야 한다.","그때까지 사용할 수 있는 돈은 200이다.","4개월 초에 수입 500이 들어온다. 대출과 지출 연기는 불가능하다."]},"why":"3개월 말에 300을 지출해야 하지만 그때까지 사용할 수 있는 돈은 200이다. 따라서 100이 부족하다. 4개월 초에 받는 수입은 앞선 지출 기한에 사용할 수 없으며, 대출이나 지출 연기도 허용되지 않는다.","origin":""},"C10-10":{"title":"생애 주기를 고려한 재무 설계","prompt":"생애 주기를 고려한 금융 생활 설계로 적절한 것은?","why":"생애 주기별 과업을 고려하여 재무 목표를 정하고 수입과 지출을 함께 파악해야 한다. 목표를 달성하는 데 필요한 돈과 마련할 수 있는 시기를 고려하여 계획을 세운다.","origin":""},"R10-1":{"title":"원금 200의 단리·복리 비교","prompt":"원금 200을 연 10%로 2년 동안 예치한다. 매년 말에 이자를 계산하며 추가 납입과 다른 비용은 없다. 단리 원리금과 연복리 원리금을 각각 구하시오.","why":"단리에서는 해마다 200×0.1=20의 이자가 붙으므로 원리금은 240이다. 연복리에서는 200×1.1²=242이다. 복리는 첫해에 붙은 이자에도 둘째 해 이자를 계산한다.","origin":""},"R10-2":{"title":"지출을 감당할 최소 초기 자금","prompt":"4개월 동안 매월 말에 100을 지출한다. 수입 400은 4개월째 월초에 들어오며, 남은 돈은 다음 달로 넘길 수 있다. 대출과 지출 연기가 불가능할 때 필요한 최소 초기 자금을 구하시오.","why":"수입이 들어오기 전에 첫 세 달의 지출 100×3=300을 감당해야 한다. 초기 자금 300이 있으면 이 지출을 마치고, 4개월째에는 월초 수입으로 마지막 지출을 할 수 있다.","origin":""},"X10-1":{"title":"세 납입금의 복리 계산","prompt":"연 10% 복리 상품에 첫해, 둘째 해, 셋째 해 초마다 100씩 넣고 셋째 해 말에 찾는다. 다른 비용은 없다. 각 납입금의 원리금과 합계를 구하시오.","d":{"labels":["첫 번째 납입금의 원리금","두 번째 납입금의 원리금","세 번째 납입금의 원리금","원리금 합계"]},"why":"첫 번째 납입금에는 3년, 두 번째에는 2년, 세 번째에는 1년간 이자가 붙는다.\n\n원리금은 각각 100×1.1³=133.1, 100×1.1²=121, 100×1.1=110이다. 합계는 364.1이다.","origin":""},"C11-01":{"title":"금리·물가·환율","prompt":"각 설명에 해당하는 경제 지표를 고르시오.","why":"금리는 원금에 대한 이자의 비율, 물가는 재화와 서비스의 종합적인 가격 수준, 환율은 두 통화의 교환 비율이다.","origin":""},"C11-02":{"title":"외화 가격과 원화 기준 손익","prompt":"외화 자산 1개를 100달러에 사서 90달러에 팔았다. 매수 당시 환율은 1,200원/달러, 매도 당시 환율은 1,400원/달러였다. 배당과 다른 비용은 없다. 원화로 환산한 매수 금액, 매도 금액, 손익을 각각 구하시오.","why":"매수할 때 지출한 원화는 100×1,200=120,000원이다. 매도 대금 90달러를 원화로 바꾸면 90×1,400=126,000원을 받는다.\n\n따라서 원화 기준 손익은 126,000−120,000=6,000원이다. 달러 가격은 하락했지만 환율 상승의 영향으로 원화 기준 이익이 발생하였다.","origin":""},"C11-03":{"title":"원화 손익이 0이 되는 환율","prompt":"원화 매수 금액은 120,000원이고 매도 대금은 100달러이다. 다른 비용은 없다. 원화 손익이 0이 되는 환율을 원/달러 단위로 구하시오.","why":"원화 손익이 0이 되려면 100달러를 환전하여 120,000원을 받아야 한다. 필요한 환율은 120,000÷100=1,200원/달러이다.","origin":""},"C11-04":{"title":"가격 상승과 구매 가능량","prompt":"상품 1개의 가격이 1,000원에서 1,250원으로 올랐다. 쓸 수 있는 돈은 10,000원으로 일정하며 상품은 정수 개만 구입한다. 가격 상승 전후에 살 수 있는 최대 수량을 각각 구하시오.","why":"가격이 오르기 전에는 10,000÷1,000=10개, 오른 뒤에는 10,000÷1,250=8개를 살 수 있다. 같은 돈으로 살 수 있는 양이 2개 줄어든다.","origin":""},"C11-05":{"title":"금리와 이자 부담","prompt":"대출 원금 1,000만 원에 대해 1년 단리 3% 계약과 5% 계약을 비교한다. 기간 중 원금 상환과 수수료는 없다. 각 계약의 이자와 두 이자의 차이를 만 원 단위로 구하시오.","why":"3% 계약의 이자는 1,000×0.03=30만 원이다. 5% 계약의 이자는 1,000×0.05=50만 원이다. 원금과 기간이 같을 때 이자율이 높은 계약의 이자 부담이 20만 원 더 크다.","origin":""},"C11-06":{"title":"환율 상승이 미치는 영향","prompt":"달러 금액은 그대로이고 원/달러 환율만 상승하였다. 다음 두 사람에게 나타나는 변화에 대한 설명으로 옳은 것은?","d":{"clues":["갑은 받은 100달러를 원화로 바꾼다.","을은 상품 대금 100달러를 지급하기 위해 달러를 구매한다."]},"why":"환율이 오르면 같은 100달러를 원화로 바꿀 때 더 많은 원화를 받는다. 따라서 갑이 받는 원화는 늘어난다. 반면 을은 100달러를 마련하는 데 더 많은 원화를 지출해야 한다.","origin":""},"C11-07":{"title":"금융 위기와 자산 선택","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["금융 위기로 불확실성이 커지면","안전성보다 수익성을 중시하게 된다","."],"options":["수익성보다 안전성을 중시할 수 있다","모든 자산의 손실 위험이 사라진다","모든 자산에서 같은 수익을 얻는다"]},"why":"금융 위기로 불확실성이 커지면 높은 수익보다 자산의 안전성과 유동성을 중시하는 경향이 나타날 수 있다. 따라서 안전성보다 수익성을 중시한다는 부분을 고쳐야 한다.","origin":""},"C11-08":{"title":"금융 의사 결정의 환경 요인","prompt":"각 요인을 경제적 환경과 사회적 환경으로 구분하시오.","why":"금리와 환율의 변화는 경제적 환경에 해당한다. 팬데믹으로 인한 경제활동 위축과 전쟁으로 인한 불확실성 증가는 사회적 환경의 변화에 해당한다.","origin":""},"C11-09":{"title":"외화 금액이 늘어난 뒤의 원화 손익","prompt":"처음 100달러를 1,000원/달러에 취득하였다. 이후 외화 금액이 110달러가 되었을 때 900원/달러로 환산하였다. 다른 비용은 없다. 처음과 나중의 원화 금액 및 원화 손익을 구하시오.","why":"처음 지출한 금액은 100×1,000=100,000원이다. 나중의 110달러를 환산하면 110×900=99,000원이다.\n\n원화 손익은 99,000−100,000=−1,000원이다. 외화 금액은 늘었지만 환율이 하락하여 원화 기준으로는 손실이 발생하였다.","origin":""},"C11-10":{"title":"환율 하락과 원화 환산액","prompt":"100달러의 금액은 그대로이고 원/달러 환율만 하락하였다. 원화로 환산한 금액은 어떻게 달라지는가?","why":"원화 환산액은 달러 금액에 원/달러 환율을 곱하여 구한다. 달러 금액이 같고 환율이 낮아졌으므로 원화 환산액은 감소한다.","origin":""},"R11-1":{"title":"외화 이익과 환율 하락","prompt":"자산을 50달러에 사서 60달러에 팔았다. 매수 당시 환율은 1,200원/달러, 매도 당시 환율은 1,000원/달러였으며 다른 비용은 없다. 원화 매수 금액, 매도 금액, 손익을 구하시오.","why":"매수 금액은 50×1,200=60,000원이다. 매도 금액도 60×1,000=60,000원이므로 원화 손익은 0이다. 달러 가격 상승으로 얻은 이익이 환율 하락으로 상쇄되었다.","origin":""},"R11-2":{"title":"달러 구매에 필요한 원화","prompt":"원/달러 환율이 1,000원에서 1,100원으로 상승하였다. 10달러를 구매하는 데 필요한 원화 금액은 어떻게 달라지는가?","why":"환율 상승 전에는 10×1,000=10,000원이 필요하다. 상승 후에는 10×1,100=11,000원이 필요하므로 지출할 원화가 1,000원 늘어난다.","origin":""},"X11-1":{"title":"원화 취득액과 손익 분기 환율","prompt":"처음 80달러를 1,250원/달러에 취득하였고, 나중의 외화 금액은 100달러가 되었다. 다른 비용은 없다. 처음 원화 금액과 원화 손익이 0이 되는 나중의 환율을 구하시오.","why":"처음 원화 금액은 80×1,250=100,000원이다. 나중의 100달러를 100,000원으로 바꿀 수 있어야 손익이 0이다. 필요한 환율은 100,000÷100=1,000원/달러이다.","origin":""},"C12-01":{"title":"국가별 생산 조건","prompt":"각 설명과 가장 밀접한 생산 조건을 고르시오.","why":"광물의 매장량과 품질은 부존자원, 기온·강수·토양은 자연환경과 관련된다. 노동과 자본의 보유 정도는 생산 요소에 관한 설명이며, 재료를 가공하는 방법은 기술 수준과 관련된다.","origin":""},"C12-02":{"title":"생산 조건의 차이와 교환","prompt":"다음 두 집단의 생산 조건을 보고 교환에 대한 설명으로 옳은 것을 고르시오.","why":"A는 재료가 많지만 도구가 부족하고, B는 도구가 있지만 재료가 부족하다. 두 집단은 각각 부족한 것을 교환하는 방법을 생각할 수 있다. 생산에 필요한 자원의 보유 정도가 다르면 교환이 이루어질 수 있다.","origin":""},"C12-03":{"title":"예산 안에서 생산 요소 구하기","prompt":"재료 4와 기술 서비스 2가 필요하다. 표의 가격과 제공량을 이용하여 필요한 양을 모두 구하되, 비용이 12 이하가 되도록 항목과 수량을 고르시오.","why":"결합 계약 2개를 고르면 재료 4와 기술 서비스 2를 모두 얻는다. 총비용은 6×2=12이므로 예산도 넘지 않는다.","origin":""},"C12-04":{"title":"재료와 노동이 제한된 생산","prompt":"제품 1개를 만들려면 재료 2와 노동 1이 필요하다. 재료 8과 노동 3을 가지고 있으며 기술 요건은 충족하였다. 제품은 정수 개만 만든다. 최대 생산량과 그때 남는 재료를 구하시오.","why":"재료로는 8÷2=4개를 만들 수 있지만, 노동으로는 3개만 만들 수 있다. 두 조건을 모두 충족해야 하므로 최대 생산량은 3개이다. 재료는 2×3=6을 사용하므로 2가 남는다.","origin":""},"C12-05":{"title":"노동 증가 후의 생산량","prompt":"제품 1개에 재료 2와 노동 1이 필요하다. 재료는 8로 일정하고 노동이 3에서 4로 늘었다. 다른 제약이 없을 때 최대 생산량과 남는 재료를 구하시오.","why":"재료와 노동 모두 제품 4개를 만들기에 충분하다. 따라서 최대 생산량은 4개이다. 재료는 2×4=8을 모두 사용하므로 남지 않는다.","origin":""},"C12-06":{"title":"운송 경로별 비용","prompt":"직행 운송비는 9이다. 경유할 때에는 중간 지점까지 4, 그곳에서 목적지까지 3이 든다. 다른 비용과 시간 제약은 없다. 경유 비용과 직행에 비해 절약하는 금액을 구하시오.","why":"경유 비용은 두 구간의 비용을 합한 4+3=7이다. 직행 비용 9보다 2만큼 적게 든다.","origin":""},"C12-07":{"title":"국내 생산이 가능한 상품의 수입","prompt":"국내에서 생산할 수 있는 상품도 수입하는 이유로 적절한 것은?","why":"국가마다 생산 조건이 달라 같은 상품을 생산하는 데 드는 비용도 다를 수 있다. 국내에서 생산할 수 있더라도 다른 나라에서 더 낮은 비용으로 생산한다면 수입하는 것이 효율적일 수 있다.","origin":""},"C12-08":{"title":"생산량별 평균 생산 단가","prompt":"100개를 생산할 때 총비용은 200, 200개를 생산할 때 총비용은 300이다. 각 경우의 평균 생산 단가를 구하시오.","why":"평균 생산 단가는 총비용을 생산량으로 나누어 구한다. 100개일 때에는 200÷100=2이고, 200개일 때에는 300÷200=1.5이다. 총비용은 늘었지만 1개당 생산 비용은 줄었다.","origin":""},"C12-09":{"title":"무역의 필요성과 이익","prompt":"무역의 필요성과 이익에 대한 설명으로 옳은 것을 모두 고르시오.","why":"무역을 통해 국내에서 생산되지 않는 재화를 얻고 상품과 서비스의 선택 기회를 넓힐 수 있다. 국가 간 생산 조건의 차이도 무역이 발생하는 원인이다. 다만 무역의 이익이 모든 노동자에게 똑같이 돌아가는 것은 아니다.","origin":""},"C12-10":{"title":"규모의 경제","prompt":"생산 규모가 커지거나 생산량이 늘어날수록 평균 생산 단가가 하락하는 현상은?","why":"규모의 경제이다. 생산량이 늘면서 1개당 생산 비용이 줄어드는 현상으로, 총비용이 늘더라도 나타날 수 있다.","origin":""},"R12-1":{"title":"재료와 기술 서비스 구입","prompt":"재료 6과 기술 서비스 2가 필요하다. 예산 14 안에서 필요한 양을 모두 구하도록 항목과 수량을 고르시오.","why":"재료 묶음 3개를 구입하면 재료 6을 얻고, 기술 제공 2개를 구입하면 기술 서비스 2를 얻는다. 총비용은 2×3+4×2=14로 예산과 같다.","origin":""},"R12-2":{"title":"총비용과 평균 생산 단가","prompt":"100개를 생산할 때 총비용은 250, 200개를 생산할 때 총비용은 400이다. 각 경우의 평균 생산 단가를 구하시오.","why":"100개일 때의 평균 생산 단가는 250÷100=2.5이다. 200개일 때에는 400÷200=2이다. 생산량이 증가하면서 평균 생산 단가는 하락하였다.","origin":""},"X12-1":{"title":"생산량과 남는 생산 요소","prompt":"제품 1개에 재료 3과 노동 2가 필요하다. 재료 18과 노동 10을 가지고 있으며 제품은 정수 개만 만든다. 최대 생산량과 그때 남는 재료, 노동을 구하시오.","why":"재료로는 18÷3=6개를 만들 수 있고, 노동으로는 10÷2=5개를 만들 수 있다. 따라서 최대 생산량은 5개이다.\n\n재료는 18−3×5=3이 남으며, 노동은 10−2×5=0이므로 모두 사용한다.","origin":""},"C13-01":{"title":"절대 우위와 비교 우위","prompt":"각 정의에 해당하는 개념을 고르시오.","why":"절대 우위는 다른 생산자보다 같은 양을 더 적은 비용으로 생산할 수 있는 능력이다. 비교 우위는 같은 양을 더 작은 기회비용으로 생산할 수 있는 능력이다.","origin":""},"C13-02":{"title":"최대 생산량과 기회비용","prompt":"양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 한 재화만 생산할 때 A국은 X재 12개 또는 Y재 6개, B국은 X재 4개 또는 Y재 4개를 최대로 생산할 수 있다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","why":"A국은 X재 12개를 생산하려면 Y재 6개를 포기한다. 따라서 X재 1개 생산의 기회비용은 Y재 6÷12=0.5개이다. B국은 X재 4개 생산으로 Y재 4개를 포기하므로 기회비용은 Y재 1개이다.","origin":""},"C13-03":{"title":"비교 우위에 있는 재화","prompt":"양국이 같은 총노동량을 모두 투입할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선은 직선이다. 각국이 비교 우위를 갖는 재화를 고르시오.","why":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 기회비용이 더 작은 A국이 X재에 비교 우위를 갖는다.\n\nY재 1개 생산의 기회비용은 A국이 X재 2개, B국이 X재 1개이다. 따라서 B국은 Y재에 비교 우위를 갖는다.","origin":""},"C13-04":{"title":"함께 생산할 수 있는 최대 수량","prompt":"자원과 기술은 고정되어 있고 X재와 Y재만 생산하며 생산 가능 곡선은 직선이다. X재 생산량을 4개로 맞추고, 이때 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.","why":"X재만 생산하면 최대 12개를 만들 수 있다. 4개를 만들 때에는 자원의 1/3을 사용하므로 2/3가 남는다. Y재만 생산할 때의 최대 생산량은 6개이므로 남은 자원으로 6×2/3=4개를 만들 수 있다.","origin":""},"C13-05":{"title":"노동시간과 생산의 기회비용","prompt":"재화 1개당 필요한 노동시간은 A국이 X재 2시간, Y재 4시간이고 B국이 X재 3시간, Y재 3시간이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","why":"A국은 X재 1개에 노동 2시간을 사용한다. 그 시간으로 Y재를 2÷4=0.5개 만들 수 있으므로 기회비용은 Y재 0.5개이다. B국에서는 X재 1개에 쓰는 3시간으로 Y재도 1개 만들 수 있다.","origin":""},"C13-06":{"title":"모든 재화에 절대 우위를 갖는 경우","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["한 나라가 두 재화 모두 절대 우위인 경우에도","비교 우위로 무역의 발생을 설명할 수 없다","."],"options":["비교 우위로 무역의 발생을 설명할 수 있다","두 나라의 모든 생산 기회비용은 항상 같다","상대국의 생산 조건을 살펴볼 필요가 없다"]},"why":"한 나라가 두 재화를 모두 더 적은 비용으로 생산하더라도 각국의 생산 기회비용은 다를 수 있다. 각국이 기회비용이 작은 재화에 특화하여 교환하는 무역은 비교 우위로 설명할 수 있다.","origin":""},"C13-07":{"title":"생산 가능 곡선과 생산 조합","prompt":"한 재화만 생산할 때 A국은 X재를 최대 12개, Y재를 최대 6개 생산할 수 있다. 생산 가능 곡선이 직선일 때, 각 조합이 곡선 안쪽, 곡선 위, 곡선 바깥쪽 중 어디에 해당하는지 구분하시오.","d":{"rows":["X재 6개·Y재 3개","X재 12개·Y재 6개","X재 4개·Y재 2개"]},"why":"X재 6개와 Y재 3개는 두 재화에 자원을 절반씩 사용한 조합이므로 곡선 위에 있다.\n\nX재 12개와 Y재 6개는 각각 모든 자원을 사용해야 만들 수 있는 양이다. 두 양을 함께 생산할 수 없으므로 곡선 바깥쪽이다. X재 4개와 Y재 2개는 전체 자원의 2/3를 사용하므로 곡선 안쪽에 있다.","origin":""},"C13-08":{"title":"Y재 생산의 기회비용","prompt":"한 재화만 생산할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선이 직선일 때, 각국의 Y재 1개 생산의 기회비용을 X재 수량으로 구하시오.","why":"A국은 Y재 6개 생산으로 X재 12개를 포기한다. 따라서 Y재 1개의 기회비용은 X재 12÷6=2개이다. B국은 X재 4÷4=1개이다.","origin":""},"C13-09":{"title":"절대 우위를 판단하는 기준","prompt":"다음 자료만으로 두 나라의 절대 우위를 판단하기 어려운 이유와 추가로 살펴야 할 내용으로 적절한 것은?","d":{"clues":["같은 재화의 생산량은 A국이 20, B국이 10이다.","두 나라가 투입한 노동량과 생산 비용은 제시되지 않았다."]},"why":"A국의 생산량이 더 많지만 그만큼 노동을 더 투입했을 수도 있다. 생산량으로 절대 우위를 비교하려면 투입한 노동량 등 생산 조건을 함께 알아야 한다.","origin":""},"C13-10":{"title":"기회비용과 비교 우위","prompt":"X재 1개 생산의 기회비용은 갑국이 Y재 2개, 을국이 Y재 3개이다. X재 생산에 비교 우위를 갖는 나라는?","why":"갑국이다. 같은 X재 1개를 생산할 때 포기하는 Y재가 을국보다 1개 적으므로 갑국의 기회비용이 더 작다.","origin":""},"R13-1":{"title":"최대 생산량표의 기회비용","prompt":"한 재화만 생산할 때 A국의 최대 생산량은 X재 20개 또는 Y재 10개이고, B국은 X재 8개 또는 Y재 12개이다. 생산 가능 곡선이 직선일 때, 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","why":"A국은 X재 20개 생산으로 Y재 10개를 포기하므로 X재 1개의 기회비용이 Y재 0.5개이다. B국은 Y재 12÷8=1.5개이다.","origin":""},"R13-2":{"title":"X재 생산량과 남은 자원","prompt":"자원과 기술은 고정되어 있고 X재와 Y재만 생산하며 생산 가능 곡선은 직선이다. X재 생산량을 8개로 맞추고, 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.","why":"X재의 최대 생산량이 20개이므로 8개를 생산할 때 자원의 8/20을 사용한다. 남은 자원은 12/20이다. Y재의 최대 생산량은 10개이므로 남은 자원으로 10×12/20=6개를 만들 수 있다.","origin":""},"X13-1":{"title":"단위당 노동시간과 기회비용","prompt":"재화 1개당 노동시간은 A국이 X재 4시간, Y재 10시간이고 B국이 X재 9시간, Y재 6시간이다. 각국의 X재 1개 생산의 기회비용과 A국의 Y재 1개 생산의 기회비용을 구하시오.","why":"X재 1개에 쓰는 시간으로 생산할 수 있는 Y재를 구하면 A국은 4÷10=0.4개, B국은 9÷6=1.5개이다.\n\nA국에서 Y재 1개에 쓰는 10시간으로 X재를 10÷4=2.5개 생산할 수 있으므로 Y재 1개의 기회비용은 X재 2.5개이다.","origin":""},"C14-01":{"title":"교환 비율과 기회비용","prompt":"한 재화만 생산할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선이 직선일 때, 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하여 작은 값부터 쓰시오.","why":"A국의 기회비용은 Y재 6÷12=0.5개, B국은 Y재 4÷4=1개이다. 두 값은 모두 X재 1개를 생산할 때 포기하는 Y재 수량이다.","origin":""},"C14-02":{"title":"양국이 이익을 얻는 교환","prompt":"양국은 같은 노동량으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. A국은 X재, B국은 Y재만 생산하고 거래 비용은 없다. X재 4개와 교환할 Y재 수량을 정하시오. 양국 모두 직접 생산할 때보다 이익을 얻어야 한다. 각국의 이익도 Y재 수량으로 구하시오.","why":"X재 4개와 Y재 3개를 교환하는 경우를 보자. A국은 X재 4개를 만드는 대신 Y재 2개를 포기하는데, 교환으로 Y재 3개를 받으므로 1개를 더 얻는다. B국은 X재 4개를 직접 만들려면 Y재 4개를 포기해야 하지만 3개만 지급하므로 1개를 절약한다.\n\n이는 정답의 한 예이다. 제시된 생산량과 수량 간격 안에서 양국 모두 이익을 얻는 다른 교환도 가능하다.","origin":""},"C14-03":{"title":"교역 후 양국의 보유량","prompt":"A국은 X재 12개만, B국은 Y재 4개만 생산하였다. A국이 X재 4개를 주고 B국으로부터 Y재 3개를 받았다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.","d":{"labels":["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"]},"why":"A국은 X재 12개 중 4개를 주었으므로 X재 8개가 남고, Y재 3개를 받는다. B국은 X재 4개를 받고 Y재 4개 중 3개를 주므로 Y재 1개가 남는다.\n\n양국의 보유량을 합하면 X재 12개, Y재 4개로 생산 총량과 같다.","origin":""},"C14-04":{"title":"직접 생산과 교환의 비교","prompt":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. A국이 X재 4개를 주고 Y재 3개를 받는다. A국이 직접 생산할 때보다 더 얻는 Y재와 B국이 절약하는 Y재를 각각 구하시오.","d":{"labels":["A국이 추가로 얻는 Y재 수량","B국이 절약하는 Y재 수량"]},"why":"A국은 X재 4개를 만드는 데 Y재 4×0.5=2개를 포기한다. 교환으로 3개를 받으므로 이익은 Y재 1개이다.\n\nB국이 X재 4개를 직접 만들 때의 기회비용은 Y재 4개이다. 교환에서는 3개만 지급하므로 Y재 1개를 절약한다.","origin":""},"C14-05":{"title":"교환 비율에 따른 양국의 이익","prompt":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. A국은 X재를 주고 B국은 Y재를 준다. 각 교환 비율에서 양국의 이익이 어떻게 달라지는지 구분하시오.","d":{"options":["A국의 추가 이익이 0","양국의 추가 이익이 모두 양수","B국의 추가 이익이 0","B국에 불리한 교환"]},"why":"X재 1개를 Y재 0.5개와 교환하면 A국은 직접 생산할 때와 차이가 없다. Y재 1개와 교환하면 B국의 이익이 0이다.\n\nY재 수량이 0.5개보다 크고 1개보다 작으면 양국 모두 이익을 얻는다. Y재 1.2개를 지급해야 한다면 B국은 직접 생산하는 편이 유리하다.","origin":""},"C14-06":{"title":"생산 조건이 달라진 교환","prompt":"양국은 같은 노동량으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. A국은 X재, B국은 Y재에 완전 특화하고 거래 비용은 없다. X재 2개와 교환할 Y재 수량을 정하시오. 양국 모두 직접 생산할 때보다 이익을 얻어야 한다. 각국의 이익도 Y재 수량으로 구하시오.","why":"X재 1개 생산의 기회비용은 A국이 Y재 1개, B국이 Y재 3개이다. X재 2개와 Y재 4개를 교환하면 A국은 4−2×1=2개의 이익을 얻는다. B국은 2×3−4=2개를 절약한다. 이 역시 양국이 이익을 얻는 교환의 한 예이다.","origin":""},"C14-07":{"title":"X재 1개당 교환 비율","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"segments":["X재 4개와 Y재 3개를 교환하는 비율은","X재 1개당 Y재 4/3개","이다."],"options":["X재 1개당 Y재 3/4개","X재 1개당 Y재 4개","X재 1개당 Y재 3개"]},"why":"X재 4개와 Y재 3개의 수량을 각각 4로 나누면 X재 1개와 Y재 3/4개가 된다. 따라서 교환 비율은 X재 1개당 Y재 3/4개이다.","origin":""},"C14-08":{"title":"같은 소비량을 얻는 생산 비용","prompt":"재화 1개당 생산 비용은 A국이 X재 10달러, Y재 20달러이고 B국은 X재 40달러, Y재 30달러이다. 각국은 X재와 Y재를 1개씩 소비하려 한다. 두 재화를 1:1로 교환하며 거래 비용은 없다. 자급 비용과 특화 후 생산 비용을 각각 구하시오.","d":{"labels":["A국의 자급 비용(달러)","A국이 X재 2개를 생산하는 비용(달러)","B국의 자급 비용(달러)","B국이 Y재 2개를 생산하는 비용(달러)"]},"why":"A국이 두 재화를 1개씩 직접 생산하면 10+20=30달러가 든다. X재 2개를 생산하여 하나를 Y재와 교환하면 같은 소비량을 얻으면서 생산 비용은 20달러로 줄어든다.\n\nB국의 자급 비용은 40+30=70달러이다. Y재 2개를 생산하여 하나를 X재와 교환하면 비용은 60달러이다. 양국 모두 10달러씩 절약한다.","origin":""},"C14-09":{"title":"국가의 교역 이익과 개인의 이익","prompt":"다음 보고서의 자료를 바탕으로 내릴 수 있는 판단으로 적절한 것은?","why":"국가별 생산량과 소비량을 비교하면 교역을 통한 이익을 구할 수 있다. 그러나 그 이익이 개인들에게 어떻게 나뉘었는지는 개인별 분배 자료가 있어야 알 수 있다. 국가가 이익을 얻었다고 모든 개인이 같은 이익을 얻는 것은 아니다.","origin":""},"C14-10":{"title":"양국에 유리한 교환 비율","prompt":"X재 1개 생산의 기회비용은 A국이 Y재 2개, B국이 Y재 5개이다. A국은 X재를 주고 B국은 Y재를 준다. 양국 모두 직접 생산할 때보다 이익을 얻는 교환 비율은?","why":"A국은 X재 1개를 주고 Y재를 2개보다 많이 받아야 이익이다. B국은 X재 1개를 받기 위해 Y재를 5개보다 적게 지급해야 이익이다. 제시된 비율 중 Y재 3개가 두 조건을 모두 충족한다.","origin":""},"R14-1":{"title":"새 생산량표에 따른 교환","prompt":"양국은 같은 노동량으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. A국은 X재, B국은 Y재에 완전 특화하고 거래 비용은 없다. X재 4개와 교환할 Y재 수량을 정하시오. 양국 모두 직접 생산할 때보다 이익을 얻어야 한다. 각국의 이익도 Y재 수량으로 구하시오.","why":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1.5개이다. X재 4개와 Y재 4개를 교환하면 A국은 4−4×0.5=2개의 이익을 얻고, B국은 4×1.5−4=2개를 절약한다. 이는 가능한 정답의 한 예이다.","origin":""},"R14-2":{"title":"수출입과 최종 보유량","prompt":"A국은 X재 20개만, B국은 Y재 12개만 생산하였다. A국이 X재 4개를 주고 Y재 4개를 받았다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.","d":{"labels":["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"]},"why":"A국의 X재는 20−4=16개가 남고 Y재는 4개이다. B국은 X재 4개를 받고 Y재는 12−4=8개가 남는다. 양국의 보유량을 합하면 원래의 생산 총량과 같다.","origin":""},"X14-1":{"title":"교역 후 소비량으로 생산량 구하기","prompt":"A국은 X재, B국은 Y재만 생산하였다. 교역 후 소비량은 A국이 X재 18개와 Y재 5개, B국이 X재 6개와 Y재 7개이다. 다른 나라와의 거래, 재고, 손실은 없다. 각국의 특화 생산량, A국의 X재 수출량, X재 1개당 교환한 Y재 수량을 구하시오.","d":{"labels":["A국의 X재 생산량","B국의 Y재 생산량","A국의 X재 수출량","X재 1개당 교환한 Y재 수량"]},"why":"X재의 소비량을 합하면 18+6=24개이다. X재는 A국만 생산했으므로 A국의 생산량이 24개이다. Y재의 소비량 합계 5+7=12개는 B국의 생산량이다.\n\nB국이 소비한 X재 6개는 A국으로부터 수입한 양이다. A국은 X재 6개를 주고 Y재 5개를 받았으므로 교환 비율은 X재 1개당 Y재 5/6개이다.","origin":""},"C15-01":{"title":"무역 확대의 영향","prompt":"각 내용을 무역 확대의 긍정적 영향과 부정적 영향으로 구분하시오.","d":{"rows":["상품 선택 기회의 확대","기술의 전파","경쟁력이 낮은 산업의 위축","경제 문제의 국가 간 확산"]},"why":"상품을 선택할 기회가 넓어지고 기술이 전파되는 것은 긍정적 영향이다. 반면 경쟁력이 낮은 국내 산업이 위축되거나 한 나라의 경제 문제가 다른 나라로 확산되는 것은 부정적 영향이다.","origin":""},"C15-02":{"title":"무역 이익의 분배","prompt":"다음 자료를 바탕으로 무역 이익의 분배를 평가한 내용으로 적절한 것은?","why":"거래 총액은 거래의 전체 규모를 나타낸다. 생산자와 노동자에게 이익이 공정하게 돌아갔는지 알려면 지급한 대가, 노동 조건, 수익의 분배 방식을 함께 살펴야 한다.","origin":""},"C15-03":{"title":"WTO와 FTA","prompt":"각 설명에 해당하는 국제기구나 협정을 고르시오.","d":{"rows":["국가 간 무역 관계를 관리·감독하는 국제기구","체결국 사이의 관세·비관세 장벽을 완화하는 협정"]},"why":"WTO는 국가 간 무역 관계를 관리·감독하는 세계 무역 기구이다. FTA는 체결국 사이의 관세와 비관세 장벽을 완화하는 자유 무역 협정이다.","origin":""},"C15-04":{"title":"자유 무역과 보호 무역","prompt":"각 정책을 자유 무역과 보호 무역으로 구분하시오.","d":{"rows":["관세와 비관세 장벽을 낮추어 교역을 확대함","관세와 비관세 장벽으로 국내 산업을 보호함"]},"why":"관세와 비관세 장벽을 낮추어 자유로운 교역을 추구하는 것은 자유 무역이다. 관세나 비관세 장벽을 활용하여 국내 산업을 보호·육성하는 것은 보호 무역이다.","origin":""},"C15-05":{"title":"무역 계약을 검토할 자료","prompt":"예산 9 안에서 대가 지급, 노동 조건, 환경에 관한 문서를 각각 1개 이상 준비하시오. 각 항목은 최대 1개까지 선택할 수 있다. 표의 값은 각 항목에서 얻는 문서의 수이다.","why":"대가 지급 검토, 노동 조건 검토, 환경 과정 검토를 고르면 세 문서를 모두 얻는다. 총비용은 3+3+3=9이다. 표지 디자인은 필요한 자료를 제공하지 않는다. 문서를 구한 뒤에는 그 내용을 바탕으로 계약을 검토해야 한다.","origin":""},"C15-06":{"title":"무역 의존도","prompt":"가상 국가의 GDP는 500, 수출액은 120, 수입액은 80이다. 금액의 기간과 단위는 같다. 다음 식으로 무역 의존도를 구하시오.\n\n무역 의존도(%)=(수출액+수입액)÷GDP×100","why":"수출액과 수입액을 합하면 200이다. GDP에서 차지하는 비율은 200÷500=0.4이므로 무역 의존도는 40%이다.","origin":""},"C15-07":{"title":"지속가능한 무역을 위한 실천","prompt":"지속가능한 국제 무역을 위한 방안으로 적절한 것을 모두 고르시오.","d":{"options":["생산자에게 정당한 대가를 지급한다.","안전한 노동 환경을 고려한다.","친환경적인 생산과 운송 방식을 검토한다.","아동 노동과 강제 노동을 확대한다."]},"why":"생산자에게 정당한 대가를 지급하고 안전한 노동 환경을 보장하며 친환경적인 생산과 운송을 실천해야 한다. 아동 노동과 강제 노동의 확대는 생산자와 노동자의 권리를 보호하는 방향과 맞지 않는다.","origin":""},"C15-08":{"title":"지속가능한 무역의 고려 사항","prompt":"다음 문장의 잘못된 부분을 찾아 알맞은 표현으로 고치시오.","d":{"options":["경제적 효율성·사회적 책임·환경을 함께 고려하는","당장의 거래 총액만 고려하는","미래 세대의 필요를 무시하는"]},"why":"지속가능한 국제 무역은 미래 세대의 필요를 해치지 않으면서 경제적 효율성, 사회적 책임, 환경 보호를 함께 고려하는 무역이다. 당장의 거래액만을 늘리는 것으로 충분하지 않다.","origin":""},"C15-09":{"title":"무역 보고서의 결론","prompt":"다음 자료를 바탕으로 보고서를 작성하는 방법으로 가장 적절한 것은?","d":{"options":["거래 총액이 늘었으므로 노동과 환경도 개선되었다고 쓴다.","확인된 이익과 손실을 각각 설명하고 노동과 환경에 관한 부족한 자료를 추가로 조사한다.","환경 자료가 없으므로 환경 피해도 없었다고 쓴다."]},"why":"자료에서는 총생산과 교역의 증가, 일부 산업의 고용 감소를 확인할 수 있다. 이 사실들을 함께 설명해야 한다. 나머지 노동 조건과 환경 영향은 관련 자료가 더 필요하다.","origin":""},"C15-10":{"title":"지속가능한 무역의 평가","prompt":"국제 무역의 지속가능성을 평가하는 방법으로 가장 적절한 것은?","d":{"options":["효율성·노동·환경·분배를 함께 검토한다.","수출액만으로 평가를 마친다.","내용과 조건이 달라도 모든 무역을 동일하게 평가한다."]},"why":"경제적 효율성과 함께 이익의 분배, 노동자의 권리, 생산과 운송 과정의 환경 영향을 살펴야 한다. 수출액만으로 이러한 내용을 모두 알 수는 없다.","origin":""},"R15-1":{"title":"무역의 지속가능성 검토 항목","prompt":"무역의 지속가능성을 평가할 때 살펴야 할 항목을 모두 고르시오.","why":"생산자에게 지급한 대가, 노동 조건, 환경 영향은 지속가능한 무역의 중요한 평가 항목이다. 상품 이름의 글자 수는 이 내용을 알려 주는 자료가 아니다.","origin":""},"R15-2":{"title":"수출입 합계와 무역 의존도","prompt":"가상 국가의 GDP는 800, 수출액은 200, 수입액은 120이다. 금액의 기간과 단위는 같다. 다음 식으로 무역 의존도를 구하시오.\n\n무역 의존도(%)=(수출액+수입액)÷GDP×100","d":{"labels":["무역 의존도(%)"]},"why":"수출액과 수입액의 합은 320이다. 이를 GDP 800으로 나누어 백분율로 나타내면 320÷800×100=40%이다.","origin":""},"X15-1":{"title":"총액 자료에서 알 수 있는 사실","prompt":"거래액은 15%, 생산자에게 지급한 대가의 총액은 4% 증가하였다. 노동시간과 환경에 관한 자료는 없다. 옳은 설명을 모두 고르시오.","d":{"options":["거래액과 지급 대가 총액의 증가율은 다르다.","시간당 보수는 4% 증가하였다.","시간당 보수와 환경의 변화를 알려면 관련 자료가 더 필요하다.","환경 피해는 발생하지 않았다."]},"why":"거래액과 지급 대가 총액은 모두 늘었지만 증가율은 다르다. 시간당 보수는 지급한 대가를 노동시간으로 나누어 구하므로 노동시간의 변화가 필요하다. 환경 자료가 없다는 이유로 피해가 없었다고 결론 내릴 수도 없다.","origin":""}},"CAMPAIGNS42":{"1":{"title":"자본주의와 경제 체제","hook":"역사적 배경과 정책을 바탕으로 자본주의의 전개 과정을 살펴보고 경제 체제를 구분해 보자."},"2":{"title":"축제의 이익과 주민의 부담","hook":"행사장 선택의 기회비용, 소음에 따른 주민 피해, 가로등 설치비를 계산해 보자."},"3":{"title":"공장의 투자와 사회적 책임","hook":"개발비와 앞으로의 투자 비용을 구별하고, 기업의 책임과 노동자의 권리를 살펴보자."},"4":{"title":"금융 자산과 자금 계획","hook":"금융 자산을 구분하고 지출 기한과 원화 손익을 계산하여 재무 계획을 검토해 보자."},"5":{"title":"생산과 교역의 이익","hook":"기회비용과 생산 가능량을 구하고, 교환 후에 각국이 보유하는 재화와 이익을 계산해 보자."},"6":{"title":"무역 확대와 주민 생활","hook":"무역 확대의 이익과 피해, 환율의 영향, 주민에게 돌아가는 몫을 여러 자료로 살펴보자."}},"PROJECTS42":{"P1":{"title":"자본주의 설명하기","checks":["각 유형의 특징과 등장 배경을 설명하였다.","시장과 정부의 역할이 시대에 따라 어떻게 달라졌는지 비교하였다.","배운 내용을 확인할 질문을 만들었다."],"outline":"자본주의의 뜻을 설명한다. 역사적 배경에 따라 각 유형을 소개하고 시장과 정부의 역할을 비교한다. 마지막으로 확인 문제를 만든다.","origin":""},"P2":{"title":"기회비용 문제 만들기","checks":["선택할 수 있는 대안과 수치의 단위, 비용의 회수 가능 여부를 적었다.","암묵적 비용, 기회비용, 순편익을 정확히 계산하였다.","정답이 되는 이유와 오답이 틀린 이유를 설명하였다."],"outline":"선택 상황을 정하고 편익과 비용을 표로 나타낸다. 질문을 만든 뒤 정답을 계산한다. 각 선지의 옳고 그름을 설명한다.","origin":""},"P3":{"title":"시장 실패의 사례 설명하기","checks":["외부 효과에서는 다른 경제 주체에게 미친 영향과 대가의 유무를 설명하였다.","공공재 부족, 경쟁 제한, 정보의 비대칭성을 구별하였다.","문제의 원인에 맞는 해결 방안을 제시하였다."],"outline":"시장 실패의 사례를 소개한다. 자료의 어느 부분에서 문제가 드러나는지 설명하고, 그 원인과 해결 방안을 정리한다.","origin":""},"P4":{"title":"금융 설명서 고쳐 쓰기","checks":["보유자의 지위와 수익 형태, 자산 관리 원칙을 정확히 설명하였다.","계산할 때 통화와 기간, 납입 시점을 반영하였다.","원금 손실의 가능성을 빠뜨리지 않았다."],"outline":"잘못된 금융 설명을 찾아 바로잡고 그 이유를 적는다. 관련된 계산 예제와 확인 문제를 만든다.","origin":""},"P5":{"title":"비교 우위와 교역 문제 만들기","checks":["표의 제목과 단위, 생산 조건을 적었다.","재화별 기회비용과 교환 비율을 정확히 계산하였다.","수출량이 생산량을 넘지 않는지, 양국이 이익을 얻는지 확인하였다."],"outline":"생산 조건을 제시하고 재화별 기회비용을 구한다. 특화할 재화와 교환량을 정한 뒤 최종 보유량과 양국의 이익을 계산한다.","origin":""},"P6":{"title":"경제 자료로 보고서 쓰기","checks":["효율성, 분배, 노동, 환경을 관련 자료로 설명하였다.","자료에서 알 수 없는 내용은 추가 조사가 필요하다고 밝혔다.","결론을 뒷받침하는 근거를 제시하였다."],"outline":"살펴볼 경제 상황을 소개한다. 자료에 나타난 변화와 그 원인을 설명하고, 이익과 부정적 영향을 함께 정리한다. 근거가 부족한 내용은 추가로 조사할 항목에 적는다.","origin":""}},"CAST":{"한결":{"role":"학습 도우미","quote":"돈을 내지 않았더라도 다른 기회를 포기하면 비용이 생겨."},"도윤":{"role":"학습 도우미","quote":"가로등은 설치비를 내지 않은 사람도 이용할 수 있어."},"리아":{"role":"학습 도우미","quote":"한 개를 더 만들려면 다른 상품을 얼마나 포기해야 할까?"},"은서":{"role":"학습 도우미","quote":"전체 이익이 늘어도 사람마다 돌아가는 몫은 다를 수 있어."},"서진":{"role":"학습 도우미","quote":"물건을 더 만들려면 필요한 재료와 노동이 모두 있어야 해."},"민호":{"role":"학습 도우미","quote":"돈이 얼마나 있는지뿐 아니라 언제 쓸 수 있는지도 중요해."}},"CASES":{"choice":{"title":"선택과 기회비용","hook":"한정된 시간에 어떤 활동을 하면 좋을까요? 편익과 기회비용을 비교하고 조건이 바뀔 때의 선택을 계산해 보세요.","badge":"기회비용 집중 탐구","tags":["기회비용","매몰 비용","조건 변화"]},"public":{"title":"가로등 설치비 모금","hook":"가로등 설치비를 모으려고 합니다. 주민들의 납부액으로 설치할 수 있는지 계산하고, 공공재가 부족해질 수 있는 이유를 알아보세요.","badge":"공공재 집중 탐구"},"trade":{"title":"비교 우위와 무역의 이익","hook":"한 나라가 두 상품을 모두 더 많이 만들 수 있어도 무역하는 이유는 무엇일까요? 기회비용을 구하고 양국이 이익을 얻는 교환을 찾아보세요.","badge":"무역 집중 탐구"}},"GUIDES43":{"G01-1":{"title":"상업 자본주의와 산업 자본주의","premise":"자료 A는 해외 교역과 상품 유통을, 자료 B는 산업 혁명과 공장의 대량 생산을 설명한다. 두 자료에 해당하는 자본주의를 구분해 보자.","model":"상업 자본주의는 상품의 유통, 산업 자본주의는 상품의 생산에서 이윤을 얻는 것을 중시하였다.","origin":"","steps":[{"title":"이윤을 얻는 과정","q":"A와 B를 구분하는 데 필요한 내용은?","why":"상업 자본주의와 산업 자본주의는 모두 이윤을 추구한다. 차이는 주로 상품을 유통하여 이윤을 얻는지, 생산하여 이윤을 얻는지에 있다.","hint":"A와 B에서 이윤을 얻는 방법이 어떻게 다른지 생각해 보세요."},{"title":"자본주의의 유형","q":"A와 B에 해당하는 자본주의를 옳게 짝지은 것은?","why":"교역과 상품 유통을 설명한 A는 상업 자본주의이다. 산업 혁명과 대량 생산을 설명한 B는 산업 자본주의이다.","hint":"상업 자본주의는 유통, 산업 자본주의는 생산을 중시했습니다."},{"title":"이윤 추구만 제시된 자료","q":"새 자료에는 ‘이윤을 추구한다’는 내용만 있다. 상업 자본주의와 산업 자본주의를 구분하려면 무엇이 더 필요한가?","why":"두 유형 모두 이윤을 추구하므로 이 설명만으로는 구분할 수 없다. 이윤을 얻는 주요 활동과 시대적 배경을 더 알아야 한다.","hint":"이윤을 얻기 위해 어떤 활동을 했는지 알아야 합니다."}]},"G01-2":{"title":"중상주의와 수정 자본주의","premise":"자료 A는 절대 왕정의 교역 장려를, 자료 B는 대공황 이후 공공사업으로 일자리와 수요를 늘리는 정책을 설명한다.","model":"두 정책은 모두 정부의 개입이다. 그러나 A는 교역을 통한 부의 축적, B는 실업과 수요 부족의 해결을 추구하였다.","steps":[{"title":"정부가 해결하려는 문제","q":"두 정책을 구별할 때 살펴야 할 내용으로 적절한 것은?","why":"같은 정부 활동이라도 시행한 시기와 해결하려는 문제, 정책 수단은 다를 수 있다.","hint":"정부가 언제 어떤 목적으로 정책을 시행했는지 살펴보세요."},{"title":"각 정책과 자본주의","q":"A와 B에 대한 설명으로 옳은 것은?","why":"A는 중상주의 정책으로 상인의 교역을 장려한 상업 자본주의와 관련된다. B는 대공황을 극복하기 위해 정부의 적극적인 역할을 강조한 수정 자본주의와 관련된다.","hint":"대공황을 배경으로 정부의 역할이 확대된 시기는 수정 자본주의입니다."},{"title":"공공재 공급과 시장 거래","q":"정부가 공공재를 공급하면 민간의 시장 거래는 모두 금지되는가?","why":"정부의 공공재 공급과 민간의 시장 거래는 함께 나타날 수 있다. 혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소를 함께 활용한다.","hint":"혼합 경제 체제에서는 시장과 정부가 함께 역할을 합니다."}],"origin":""},"G02-1":{"title":"기본적인 경제 문제","premise":"공방 회의에서 A는 어떤 제품을 몇 개 만들지, B는 어떤 기술로 생산할지, C는 생산물을 누구에게 나눌지 논의한다.","model":"상품의 종류와 수량, 생산 방법, 분배 방식은 기본적인 경제 문제이다.","steps":[{"title":"무엇을 얼마나 생산할까","q":"A가 해결하려는 경제 문제는?","why":"어떤 제품을 몇 개 만들지 정하는 것은 ‘무엇을 얼마나 생산할 것인가’의 문제이다.","hint":"제품의 종류와 수량을 정하는 질문입니다."},{"title":"생산 방법과 분배","q":"B와 C가 논의하는 경제 문제를 순서대로 옳게 짝지은 것은?","why":"B의 기술 선택은 생산 방법에 관한 문제이다. C의 생산물 배분은 누구에게 나눌 것인지에 관한 분배 문제이다.","hint":"기술은 만드는 방법, 배분은 나누는 방법과 관련됩니다."},{"title":"경제 문제와 경제 체제","q":"세 가지 경제 문제를 논의한다는 이유만으로 계획경제 체제라고 볼 수 있는가?","why":"시장경제 체제에서도 같은 경제 문제를 해결해야 한다. 두 체제의 차이는 경제 문제의 유무가 아니라, 시장 가격과 민간의 선택을 따르는지 정부의 계획과 명령을 따르는지에 있다.","hint":"시장경제 체제에서도 무엇을 얼마나 생산할지 결정해야 합니다."}],"origin":""},"G02-2":{"title":"보상이 늘어난 뒤의 선택","premise":"A와 B 중 하나만 선택한다. A의 편익은 28, 명시적 비용은 9이고 B의 편익은 25, 명시적 비용은 8이다. 이후 B의 편익만 1 증가한다. 모든 값의 단위는 같고 다른 비용은 없다.","model":"각 대안의 편익에서 명시적 비용을 빼면 유리한 대안을 비교할 수 있다. 보상이 바뀐 뒤에도 두 값을 다시 비교한다.","steps":[{"title":"변경 전 편익과 비용","q":"각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.","why":"A는 28−9=19, B는 25−8=17이다. 따라서 처음에는 A가 유리하다.","hint":"A는 28에서 9를, B는 25에서 8을 빼세요.","labels":{"0":"A의 편익−명시적 비용","1":"B의 편익−명시적 비용"}},{"title":"보상 증가 후의 비교","q":"B의 편익이 26으로 증가하였다. 변경 후 B의 ‘편익−명시적 비용’과 A에서 구한 값 19에서 이를 뺀 차이를 구하시오.","why":"B는 26−8=18이다. A의 값은 19로 그대로이므로 차이는 19−18=1이다.","hint":"B의 명시적 비용은 여전히 8입니다.","labels":{"0":"변경 후 B의 편익−명시적 비용","1":"19에서 변경 후 B의 값을 뺀 차이"}},{"title":"선택의 변화","q":"B의 보상이 증가한 뒤 가장 유리한 대안은?","why":"B는 전보다 유리해졌지만 편익에서 명시적 비용을 뺀 18이 A의 19보다 작다. 따라서 A를 선택하는 것이 여전히 유리하다.","hint":"보상 증가 후에도 19와 18을 비교해야 합니다."}],"origin":""},"G03-1":{"title":"기회비용과 순편익 구하기","premise":"A의 편익은 42, 명시적 비용은 12이고 B의 편익은 48, 명시적 비용은 20이다. 두 대안 중 하나만 선택하며 다른 대안과 매몰 비용은 없다.","model":"A를 선택하면 B를 포기한다. B를 선택했을 때 얻을 수 있었던 가치가 A 선택의 암묵적 비용이다.","steps":[{"title":"각 대안에서 얻을 수 있는 가치","q":"각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.","why":"A는 42−12=30, B는 48−20=28이다.","hint":"이 단계에서는 직접 지출하는 비용만 뺍니다. 포기한 대안의 가치는 다음 단계에서 반영합니다.","labels":{"0":"A의 편익−명시적 비용","1":"B의 편익−명시적 비용"}},{"title":"A의 기회비용과 순편익","q":"A 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.","why":"A를 선택하면 B의 28을 포기하므로 암묵적 비용은 28이다. 명시적 비용 12를 더하면 기회비용은 40이다. 편익에서 기회비용을 뺀 순편익은 42−40=2이다.","hint":"암묵적 비용에는 B를 선택했을 때 얻을 수 있었던 가치를 넣으세요."},{"title":"명시적 비용과 기회비용의 차이","q":"A의 편익에서 명시적 비용을 뺀 30을 A의 순편익이라고 할 수 있는가?","why":"30에는 B를 포기한 가치 28이 아직 반영되지 않았다. 순편익은 편익에서 기회비용을 뺀 값이므로 A의 순편익은 2이다.","hint":"기회비용에는 명시적 비용과 암묵적 비용이 모두 포함됩니다."}],"origin":""},"G03-2":{"title":"다른 대안의 가치와 순편익","premise":"A의 편익과 명시적 비용은 각각 52와 20, B는 54와 19, C는 46과 13이다. 세 대안 중 하나만 선택하며 제시된 것 외의 비용은 없다.","model":"편익에서 명시적 비용을 빼면 A는 32, B는 35, C는 33이다. B를 선택할 때에는 남은 A와 C 중 더 큰 가치를 포기한다.","steps":[{"title":"B 선택의 암묵적 비용","q":"B를 선택할 때의 암묵적 비용으로 옳은 것은?","options":["A와 C의 가치를 합한 65","B의 편익에서 명시적 비용을 뺀 35","포기한 A와 C 중 더 큰 C의 가치 33"],"why":"B를 선택하면 A와 C를 포기한다. 두 대안은 동시에 선택할 수 없으므로 가치를 합하지 않고 더 큰 하나인 C의 33을 암묵적 비용으로 본다.","hint":"B 자신이 아니라, 선택하지 않은 A와 C를 비교하세요."},{"title":"B의 기회비용과 순편익","q":"B 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.","why":"암묵적 비용은 33이다. 명시적 비용 19를 더하면 기회비용은 52이고, 순편익은 54−52=2이다.","hint":"기회비용을 구한 뒤 B의 편익 54에서 빼세요."},{"title":"포기한 가치가 커진 경우","q":"C의 편익에서 명시적 비용을 뺀 값만 34.5로 증가하고 B는 35로 일정하다. 옳은 설명은?","options":["B가 여전히 가장 유리하지만 B 선택의 암묵적 비용은 커진다.","선택이 같으므로 암묵적 비용도 그대로이다.","C가 반드시 가장 유리해진다."],"why":"B의 35가 C의 34.5보다 크므로 B가 여전히 유리하다. 그러나 B를 선택하면서 포기하는 C의 가치는 커졌다. 따라서 암묵적 비용은 늘고 순편익은 35−34.5=0.5로 줄어든다.","hint":"선택이 바뀌는지와 포기한 가치가 달라지는지를 각각 생각해 보세요."}],"origin":""},"G04-1":{"title":"매몰 비용과 현재의 선택","premise":"과거에 지출한 200은 어떤 대안을 선택해도 회수할 수 없다. 앞으로 A를 선택하면 편익 180과 추가 비용 120이, B를 선택하면 편익 145와 추가 비용 70이 발생한다.","model":"회수할 수 없는 과거 지출 200은 매몰 비용이다. 현재의 선택에서는 앞으로 얻을 편익과 추가로 부담할 비용을 비교한다.","steps":[{"title":"앞으로의 편익과 비용","q":"A와 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.","why":"A는 180−120=60, B는 145−70=75이다. 과거 지출 200은 두 계산에서 제외한다.","hint":"이미 지출하여 회수할 수 없는 돈은 현재의 비용에 더하지 않습니다.","labels":{"0":"A의 편익−명시적 비용","1":"B의 편익−명시적 비용"}},{"title":"B의 기회비용과 순편익","q":"B 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.","why":"B를 선택하면 A에서 얻을 수 있었던 60을 포기한다. 암묵적 비용은 60이고, 기회비용은 70+60=130이다. 순편익은 145−130=15이다.","hint":"암묵적 비용은 2, 단위당 부담금은 8, 제3자의 피해는 18이다. 정부 수입도 합산하며 행정 비용 등 다른 효과는 없다.","model":"생산자가 낸 부담금은 정부가 수입으로 받는다. 생산자의 납부 후 이익과 정부 수입을 더한 뒤 제3자의 피해를 뺀다.","steps":[{"title":"총부담금과 생산자 이익","q":"부담금 총액과 납부 후 생산자 이익을 각각 구하시오.","why":"총부담금은 3×8=24이다. 생산자의 납부 후 이익은 72−24=48이다.","hint":"부담금 8은 1단위당 금액입니다. 활동량 3을 곱해야 총액이 됩니다."},{"title":"정부 수입을 포함한 합계","q":"정부 수입과 ‘생산자의 납부 후 이익+정부 수입−제3자의 피해’를 각각 구하시오.","why":"정부가 받은 부담금은 24이다. 따라서 전체 합계는 48+24−18=54이다.","hint":"생산자가 낸 24는 이미 생산자 이익에서 빠졌습니다. 정부 수입으로 더하세요."},{"title":"부담금의 정책 효과","q":"이번 계산에서 부담금이 생산자에게서 정부로 옮겨 간다는 이유로 부담금 정책에 아무 효과도 없다고 볼 수 있는가?","why":"이번에는 활동량 3이 고정되어 있다. 부담금 때문에 생산자가 선택하는 활동량이 달라진다면 이익과 피해도 달라질 수 있다. 이 계산만으로 정책에 효과가 없다고 결론 내릴 수는 없다.","hint":"이번 문제는 활동량이 바뀌는 경우를 계산한 것이 아닙니다."}],"origin":""},"G06-1":{"title":"가로등 모금액과 나의 선택","premise":"주민 4명은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하고 각자 편익 10을 얻는다. 설치에 실패하면 납부액을 돌려받는다. 다른 세 주민의 납부액은 8, 4, 6으로 정해져 있고, 나는 0, 4, 6, 10 중 하나를 낸다.","model":"총모금액이 설치비에 미치는지에 따라 설치 여부가 달라진다. 설치 후에는 남은 토큰과 편익의 합으로 내게 유리한 선택을 비교한다.","origin":"","steps":[{"title":"부족한 설치비","q":"다른 주민의 납부액 합계와 설치에 더 필요한 금액을 각각 구하시오.","why":"다른 주민의 납부액은 8+4+6=18토큰이다. 설치비 24토큰에서 18토큰을 빼면 6토큰이 부족하다.","hint":"24토큰에서 다른 주민이 낸 돈을 빼세요."},{"title":"4토큰과 6토큰을 내는 경우","q":"내가 4토큰을 내는 경우와 6토큰을 내는 경우에 남은 토큰과 설치 편익의 합을 각각 구하시오.","why":"4토큰을 내면 22토큰만 모여 설치하지 못한다. 납부액을 돌려받으므로 처음처럼 10토큰을 보유하고 편익은 없다.\n\n6토큰을 내면 설치에 성공한다. 4토큰이 남고 편익 10을 얻으므로 합은 14이다.","hint":"설치하지 못하면 낸 돈만 돌려받으며 가로등의 편익은 얻지 못합니다."},{"title":"설치비가 이미 모인 경우","q":"다른 주민만으로 24토큰이 모였다. 제시된 납부액 중 내게 가장 유리한 것은?","why":"0토큰을 내도 가로등이 설치된다. 보유 토큰 10을 그대로 남기고 편익 10을 얻으므로 합이 20으로 가장 크다.","hint":"다른 주민이 설치비를 전부 냈으므로 내가 추가로 낼 필요는 없습니다."}]},"G06-2":{"title":"담합·정보의 비대칭성·비배제성","premise":"A는 업체들이 함께 가격을 올리기로 합의한 문서이다. B는 판매자만 알고 있는 제품 결함에 관한 자료이다. C는 비용을 내지 않은 주민도 가로등을 이용할 수 있다는 설명이다.","model":"세 자료는 각각 경쟁 제한, 거래 정보의 차이, 공공재의 이용 특성과 관련된다.","steps":[{"title":"가격 인상 합의","q":"A가 보여 주는 문제는?","why":"업체들이 가격을 함께 올리기로 합의한 것은 서로 경쟁하지 않고 가격을 조정하는 담합이다.","hint":"업체들이 서로 합의하여 경쟁을 제한했습니다."},{"title":"제품 정보와 공공재의 이용","q":"B와 C에 해당하는 개념을 순서대로 옳게 짝지은 것은?","why":"B에서는 판매자와 구매자가 제품 상태에 대해 가진 정보가 다르므로 정보의 비대칭성이 나타난다. C는 대가를 내지 않은 사람의 소비를 막을 수 없는 비배제성이다.","hint":"B는 거래 정보의 차이이고, C는 대가를 내지 않은 사람의 이용에 관한 설명입니다."},{"title":"제품 정보의 차이를 줄이는 방법","q":"구매자가 제품 상태를 파악하는 데 가장 도움이 되는 자료는?","why":"제품의 상태 검사 결과와 품질 보증은 구매자가 품질을 파악하고 거래의 불확실성을 줄이는 데 도움이 된다.","hint":"제품의 결함이나 품질을 확인할 수 있는 자료를 찾으세요."}],"origin":""},"G07-1":{"title":"노동 3권과 기업가 정신","premise":"A는 노동조합에 가입하였다. B는 노동조합을 통해 사용자와 임금을 협상하였다. C는 불확실성을 감수하며 기업의 새로운 시장 개척을 추진하였다.","model":"노동조합 가입과 임금 협상은 노동자의 권리 행사이다. 새로운 시장에 대한 도전은 기업가 정신과 관련된다.","steps":[{"title":"가입과 협상에 관한 권리","q":"A와 B의 활동에 해당하는 권리를 순서대로 옳게 짝지은 것은?","why":"노동조합을 조직하거나 가입하는 것은 단결권이다. 노동조합을 통해 사용자와 임금이나 근로 조건을 협상하는 것은 단체 교섭권이다.","hint":"A는 조합에 가입하였고, B는 사용자와 협상하였습니다.","options":["단결권 / 단체 교섭권","단체 교섭권 / 단결권","단체 행동권 / 단체 교섭권"]},{"title":"새로운 시장에 대한 도전","q":"C의 활동에서 드러나는 정신은?","why":"위험과 불확실성을 무릅쓰고 새로운 시장을 개척하며 도전하는 정신은 기업가 정신이다.","hint":"C는 성공이 보장되지 않은 새로운 시장에 도전하고 있습니다.","options":["기업가 정신","소비자 주권","기업의 사회적 책임"]},{"title":"파업과 관련된 권리","q":"노동조합이 협상 결렬 후 파업 등 쟁의 행위로 사용자에게 대항하는 것과 관련된 권리는?","why":"단체 행동권이다. 단체 교섭권은 사용자와의 협상에 관한 권리이고, 단체 행동권은 파업 등 쟁의 행위에 관한 권리이다.","hint":"이번에는 협상이 아니라 파업 등 쟁의 행위를 묻습니다.","options":["단체 교섭권","단체 행동권"]}],"origin":""},"G07-2":{"title":"윤리적 만족을 포함한 소비","premise":"A와 B 중 하나의 소비 계획을 선택한다. A의 총편익은 30, 명시적 비용은 18이고 B의 총편익은 37, 명시적 비용은 22이다. B의 편익에는 윤리적 만족이 이미 포함되어 있으며 다른 비용은 없다.","model":"윤리적 가치를 실천하는 만족도 편익에 포함될 수 있다. B에서는 그 만족을 포함한 총편익 37을 사용한다.","steps":[{"title":"편익에 포함된 윤리적 만족","q":"B의 윤리적 만족을 계산에 반영하는 방법으로 옳은 것은?","why":"B의 총편익 37에는 윤리적 만족이 이미 포함되어 있다. 따라서 37을 그대로 사용하며 같은 만족을 다시 더하지 않는다.","hint":"총편익에 이미 포함된 금액은 별도로 더하지 않습니다."},{"title":"두 계획의 편익과 비용","q":"각 계획의 편익에서 명시적 비용을 뺀 값을 구하시오.","why":"A는 30−18=12, B는 37−22=15이다.","hint":"A는 30에서 18을, B는 37에서 22를 빼세요.","labels":{"0":"A의 편익−명시적 비용","1":"B의 편익−명시적 비용"}},{"title":"합리적인 소비 계획","q":"계산 결과에 대한 설명으로 옳은 것은?","why":"B는 비용이 더 크지만 윤리적 만족을 포함한 편익까지 고려하면 A보다 유리하다. 따라서 이 경우 윤리적 소비와 합리적 소비가 함께 이루어질 수 있다.","hint":"비용만 비교하지 말고 편익에서 비용을 뺀 두 금액을 비교하세요."}],"origin":""},"G08-1":{"title":"주식 수와 거래비용을 반영한 손익","premise":"주식 3주를 주당 70에 사서 주당 74에 팔았다. 배당은 주당 1이고 전체 거래비용은 2이다. 다른 비용이나 수익은 없다.","model":"주당 금액에는 주식 수 3을 곱한다. 거래비용 2는 전체 금액이므로 한 번만 뺀다.","steps":[{"title":"매수 총액과 매매 차익","q":"매수 총액과 세 주의 매매 차익을 각각 구하시오.","why":"매수 총액은 70×3=210이다. 주당 매매 차익은 74−70=4이므로 세 주의 차익은 4×3=12이다.","hint":"주당 금액에 주식 수를 곱하세요."},{"title":"배당과 거래비용","q":"배당 총액과 거래비용까지 반영한 총손익을 각각 구하시오.","why":"배당 총액은 1×3=3이다. 매매 차익 12에 배당 3을 더하고 거래비용 2를 빼면 총손익은 13이다.","hint":"거래비용 2는 주당 금액이 아니라 전체 금액입니다."},{"title":"배당의 의미","q":"주식회사가 얻은 수익의 일부를 지분에 따라 주주에게 나누어 주는 것은?","why":"배당이다. 주주는 배당 수익을 기대할 수 있으며, 이는 예금이나 채권에서 얻는 이자 수익과 다르다.","hint":"주주에게 회사의 수익을 나누어 준다는 설명입니다."}],"origin":""},"G08-2":{"title":"금융 자산과 보유자의 지위","premise":"A는 목돈을 예치하고 이자를 받는 통장이다. B는 기업이 원금과 이자의 지급을 약속한 차용 증서이고, C는 주식회사의 지분을 표시한 증서이다. 일반적인 금융 자산의 특징을 적용한다.","model":"예금자는 금융 기관에 돈을 맡긴 사람이다. 채권자는 발행자에게 돈을 빌려준 사람이고, 주주는 회사의 지분을 보유한 사람이다.","steps":[{"title":"차용 증서의 보유자","q":"B의 종류와 보유자의 지위를 옳게 짝지은 것은?","why":"자금을 빌리면서 원금과 이자의 지급을 약속한 증서는 채권이다. 보유자는 돈을 빌려준 채권자이다.","hint":"회사의 지분이 아니라 빌려준 돈에 관한 증서입니다."},{"title":"주식 발행과 수익","q":"C를 새로 발행할 때의 영향과 보유자가 기대할 수 있는 수익을 옳게 짝지은 것은?","why":"C는 주식이다. 새로 발행하면 기업의 자본금이 증가한다. 주주는 배당 수익과 매매를 통한 시세 차익을 기대할 수 있다.","hint":"기존 주식의 매매가 아니라 새 주식의 발행입니다."},{"title":"시세 차익과 매매 손실","q":"시세 차익을 기대할 수 있는 자산이면 매매할 때마다 이익을 얻는가?","why":"산 가격보다 높은 가격에 팔면 시세 차익을 얻는다. 반대로 낮은 가격에 팔면 매매 손실이 발생한다.","hint":"매도 가격이 매수 가격보다 낮을 때를 생각해 보세요."}],"origin":""},"G09-1":{"title":"자산 총액과 당장 쓸 수 있는 돈","premise":"A는 지금 30으로 현금화할 수 있고 금액은 변하지 않는다. B는 한 달 뒤에 90으로만 회수할 수 있다. 내일 40을 지출해야 하며 대출과 지출 연기는 불가능하다.","model":"두 자산의 표시 금액을 합한 값과 내일까지 현금으로 쓸 수 있는 돈은 다르다.","steps":[{"title":"총액과 사용 가능액","q":"두 자산의 표시 금액 합계와 내일까지 쓸 수 있는 금액을 각각 구하시오.","why":"표시 금액의 합계는 30+90=120이다. 그러나 내일까지 쓸 수 있는 것은 지금 현금화할 수 있는 A의 30뿐이다.","hint":"B의 90은 한 달 뒤에만 회수할 수 있습니다."},{"title":"부족한 금액","q":"내일의 지출에 부족한 금액을 구하시오.","why":"필요한 돈은 40이고 쓸 수 있는 돈은 30이다. 따라서 40−30=10이 부족하다.","hint":"필요한 금액 40에서 당장 쓸 수 있는 30을 빼세요."},{"title":"현금화와 유동성","q":"자산을 현금으로 쉽게 바꿀 수 있는 정도를 뜻하는 원칙은?","why":"유동성이다. 자산의 총액이 크더라도 필요한 때에 현금으로 바꾸기 어렵다면 지출에 차질이 생길 수 있다.","hint":"안전성, 수익성, 유동성 중 현금화에 관한 원칙을 고르세요."}],"origin":""},"G09-2":{"title":"투자 비중과 전체 수익률","premise":"A에 150, B에 50을 투자하였다. 같은 기간의 수익률은 A가 +8%, B가 −4%이다. 중간 입출금과 다른 비용은 없다.","model":"각 자산의 손익을 합하여 총손익을 구한다. 총손익을 전체 투자금으로 나누어 백분율로 나타내면 전체 수익률이다.","steps":[{"title":"자산별 손익","q":"A와 B의 손익을 각각 구하시오.","why":"A의 손익은 150×0.08=12이다. B는 50×(−0.04)=−2이므로 2의 손실이 발생한다.","hint":"손실은 음수로 나타내세요."},{"title":"총손익과 전체 수익률","q":"총손익과 전체 투자금에 대한 수익률을 구하시오.","why":"총손익은 12+(−2)=10이다. 전체 투자금은 150+50=200이므로 수익률은 10÷200×100=5%이다.","hint":"수익률을 구할 때에는 전체 투자금으로 나누세요."},{"title":"수익률의 단순 평균","q":"두 수익률의 단순 평균인 2%가 전체 수익률인가?","why":"A에 투자한 돈이 B의 3배이므로 A의 수익률이 전체 결과에 더 크게 영향을 준다. 두 자산의 투자 비중을 반영해야 전체 수익률을 구할 수 있다.","hint":"두 자산에 같은 금액을 투자한 것이 아닙니다."}],"origin":""},"G10-1":{"title":"지출을 감당할 초기 자금","premise":"4개월 동안 매월 말에 150을 지출한다. 수입 600은 4개월째 월초에 한 번 들어온다. 남은 돈을 다음 달로 넘길 수 있지만 대출과 지출 연기는 불가능하다.","model":"수입을 받기 전에 얼마가 부족해지는지 구하면 처음 마련해야 할 돈을 알 수 있다. 초기 자금 없이 계산한 음수는 실제 대출금이 아니라 부족한 자금이다.","steps":[{"title":"수입 전까지 부족한 돈","q":"초기 자금이 0일 때 1, 2, 3개월 말의 ‘누적 수입−누적 지출’을 각각 구하시오.","why":"첫 세 달에는 수입이 없고 매달 150을 지출한다. 따라서 값은 차례로 −150, −300, −450이다.","hint":"월말마다 지출 150이 쌓입니다."},{"title":"초기 자금과 마지막 잔액","q":"필요한 최소 초기 자금과, 그 금액을 처음 마련했을 때 4개월 말의 잔액을 각각 구하시오.","why":"3개월 말까지 450이 부족하므로 처음에 최소 450을 마련해야 한다. 4개월 말의 잔액은 초기 자금 450에 수입 600을 더하고 총지출 600을 뺀 450이다.","hint":"마지막 잔액에는 처음 마련한 돈도 포함하세요."},{"title":"수입·지출의 총액과 시점","q":"총수입과 총지출이 모두 600이므로 초기 자금이 없어도 계획대로 지출할 수 있는가?","why":"수입은 4개월 초에 들어오지만 지출은 첫 달부터 시작한다. 초기 자금이 없으면 앞선 세 달의 지출을 할 수 없다.","hint":"총액이 같더라도 돈이 들어오는 시기가 늦습니다."}],"origin":""},"G10-2":{"title":"납입 시점이 다른 복리 계산","premise":"첫해 초에 300, 둘째 해 초에 100을 납입하고 둘째 해 말에 찾는다. 연 5% 복리로 매년 말에 이자를 계산한다. 다른 입출금, 세금, 수수료는 없다.","model":"첫 납입금에는 2년간, 둘째 납입금에는 1년간 이자가 붙는다. 각 납입금의 원리금을 따로 구한 뒤 합한다.","steps":[{"title":"각 납입금의 예치 기간","q":"두 납입금에 이자가 붙는 기간을 옳게 나타낸 것은?","why":"300은 첫해 초부터 둘째 해 말까지 2년간 예치된다. 100은 둘째 해 초부터 그해 말까지 1년간 예치된다.","hint":"각 돈을 넣은 때부터 찾는 때까지의 기간을 세어 보세요."},{"title":"원리금과 전체 이자","q":"중간에 반올림하지 않고 각 납입금의 원리금, 원리금 합계, 전체 이자를 구하시오.","why":"첫 납입금의 원리금은 300×1.05²=330.75이고 둘째 납입금은 100×1.05=105이다. 합계는 435.75이다. 납입 원금의 합 400을 빼면 전체 이자는 35.75이다.","hint":"이자는 원리금 합계에서 납입한 원금을 뺀 금액입니다."},{"title":"원금을 합하여 계산하면?","q":"원금 400 전체에 2년간 복리를 적용해도 되는가?","why":"둘째 납입금 100은 1년 동안만 예치된다. 전체 원금에 2년간 이자를 붙이면 둘째 납입금의 예치 기간을 실제보다 길게 계산하게 된다.","hint":"두 납입금은 같은 날 넣은 돈이 아닙니다."}],"origin":""},"G11-1":{"title":"달러와 원화 기준 손익의 차이","premise":"자산을 80달러에 사서 100달러에 전액 매도하였다. 매수 당시 환율은 1,250원/달러, 매도하여 환전할 때의 환율은 900원/달러이다. 중간 수입과 지출, 다른 비용은 없다.","model":"매수 금액은 매수 당시 환율로, 매도 금액은 매도 당시 환율로 환산한다. 두 원화 금액을 비교하여 손익을 구한다.","steps":[{"title":"매수·매도 금액의 원화 환산","q":"처음과 나중의 원화 금액을 각각 구하시오.","why":"매수 금액은 80×1,250=100,000원이다. 매도 금액은 100×900=90,000원이다.","hint":"각 달러 금액에 같은 시점의 환율을 곱하세요."},{"title":"원화 손익과 수익률","q":"원화 기준 손익과 처음 투자금을 기준으로 한 수익률을 구하시오.","why":"손익은 90,000−100,000=−10,000원이다. 수익률은 −10,000÷100,000×100=−10%이다.","hint":"수익률은 손익을 처음 투자한 100,000원으로 나누어 구합니다."},{"title":"달러 가격 상승과 원화 손실","q":"달러 금액이 80에서 100으로 늘었으므로 원화 기준으로도 이익인가?","why":"달러 가격은 올랐지만 환율은 하락하였다. 두 변화를 모두 반영한 원화 매도 금액이 매수 금액보다 작으므로 원화 기준으로는 손실이다.","hint":"달러 금액뿐 아니라 원화로 환산한 금액을 비교하세요."}],"origin":""},"G11-2":{"title":"가격 상승과 구매량 감소","premise":"보유액은 12,000원으로 일정하다. 같은 상품의 가격이 800원에서 1,000원으로 올랐고, 상품은 정수 개만 산다. 다른 비용은 없다.","model":"보유액을 가격으로 나누어 구매 가능한 수량을 구한다. 감소율은 줄어든 수량을 처음 수량으로 나누어 구한다.","steps":[{"title":"가격 상승 전후의 구매량","q":"가격 상승 전후에 살 수 있는 최대 수량을 각각 구하시오.","why":"상승 전에는 12,000÷800=15개, 상승 후에는 12,000÷1,000=12개를 살 수 있다.","hint":"같은 돈을 각 시점의 상품 가격으로 나누세요."},{"title":"감소량과 감소율","q":"줄어든 수량과 처음 구매량에 대한 감소율을 구하시오.","why":"15−12=3개가 줄었다. 처음의 15개를 기준으로 하면 3÷15×100=20% 감소한 것이다.","hint":"감소율의 기준은 처음 살 수 있었던 15개입니다."},{"title":"자료에서 알 수 있는 내용","q":"제시된 자료에서 알 수 있는 내용으로 옳은 것은?","why":"이 상품의 가격과 보유액으로 구매 가능량의 변화를 알 수 있다. 전체 물가 상승률이나 다른 사람의 생활 수준을 알려면 여러 상품의 가격과 소득 등에 관한 자료가 더 필요하다.","hint":"자료에는 한 상품의 가격만 제시되어 있습니다."}],"origin":""},"G12-1":{"title":"재료와 노동이 제한된 생산","premise":"제품 1개에 재료 4와 노동 3이 필요하다. 재료 29와 노동 20을 가지고 있으며 정수 개의 완제품만 생산한다. 기술 등 다른 요건은 충족하였다.","model":"제품마다 재료와 노동이 모두 필요하다. 두 요소로 만들 수 있는 수량을 각각 계산하면 전체 생산량을 제한하는 요소를 알 수 있다.","steps":[{"title":"생산량을 제한하는 요소","q":"최대 생산량을 구하는 방법으로 옳은 것은?","why":"재료가 충분해도 노동이 부족하면 제품을 더 만들 수 없다. 두 생산 한도 중 작은 것을 적용하고 정수 개만 생산한다는 조건을 고려해야 한다.","hint":"완제품 한 개에 두 요소가 모두 들어갑니다."},{"title":"생산량과 남는 재료·노동","q":"최대 완제품 수와 그때 남는 재료, 노동을 구하시오.","why":"재료 29로는 7개까지 만들 수 있지만 노동 20으로는 6개까지 만들 수 있다. 따라서 최대 6개이다. 재료는 29−4×6=5, 노동은 20−3×6=2가 남는다.","hint":"먼저 최대 생산량을 구하고 각 요소의 사용량을 빼세요."},{"title":"재료만 늘어난 경우","q":"노동은 20으로 그대로이고 재료만 40으로 늘었다. 최대 완제품 수는?","why":"노동 20으로는 여전히 제품 6개까지만 만들 수 있다. 재료가 늘어도 노동의 부족은 해결되지 않으므로 최대 생산량은 6개이다.","hint":"생산을 제한한 요소는 노동이었습니다."}],"origin":""},"G12-2":{"title":"생산량과 평균 생산 단가","premise":"같은 상품을 100개 생산할 때 총비용은 280이고, 200개 생산할 때 총비용은 460이다. 통화와 비용에 포함한 항목은 같다.","model":"평균 생산 단가는 총비용을 생산량으로 나눈 값이다. 규모의 경제는 생산량이 늘면서 평균 생산 단가가 낮아지는 현상이다.","steps":[{"title":"평균 생산 단가","q":"각 생산량에서의 평균 생산 단가를 구하시오.","why":"100개일 때에는 280÷100=2.8이고, 200개일 때에는 460÷200=2.3이다.","hint":"총비용을 해당 생산량으로 나누세요."},{"title":"한 개당 비용의 감소","q":"생산량이 늘면서 한 개당 비용은 얼마나 줄었는가?","why":"평균 생산 단가가 2.8에서 2.3으로 낮아졌으므로 한 개당 비용은 0.5 줄었다.","hint":"총비용이 아니라 두 평균 단가를 비교하세요."},{"title":"규모의 경제","q":"제시된 두 생산량을 비교한 설명으로 옳은 것은?","why":"100개에서 200개로 생산량이 늘면서 평균 생산 단가가 낮아졌다. 이 두 생산량 사이에서는 규모의 경제가 나타난다. 그보다 많은 생산량의 단가는 제시되어 있지 않다.","hint":"생산량이 늘었을 때 평균 생산 단가가 어떻게 변했는지 보세요."}],"origin":""},"G13-1":{"title":"노동시간표와 최대 생산량표","premise":"A국의 총노동량은 60시간이다. X재 1개에 3시간, Y재 1개에 5시간이 필요하며 단위당 노동시간은 일정하다. 두 재화만 생산한다.","model":"총노동량을 재화 1개당 노동시간으로 나누면 최대 생산량을 구할 수 있다. 같은 생산 조건을 두 종류의 표로 나타내어 기회비용을 계산해 보자.","steps":[{"title":"각 재화의 최대 생산량","q":"모든 노동을 한 재화에 투입할 때 X재와 Y재의 최대 생산량을 각각 구하시오.","why":"X재는 60÷3=20개, Y재는 60÷5=12개까지 생산할 수 있다.","hint":"60시간을 각 재화 1개를 만드는 시간으로 나누세요."},{"title":"X재 1개 생산의 기회비용","q":"X재 1개 생산의 기회비용을 Y재 수량으로 구하시오. 분수로 입력해도 된다.","why":"X재 1개에 쓰는 3시간으로 Y재를 3/5개 만들 수 있다. 따라서 기회비용은 Y재 0.6개이다. 최대 생산량을 이용해도 Y재 12÷20=0.6개로 같다.","hint":"X재에 쓰는 시간으로 만들 수 있었던 Y재가 포기한 수량입니다."},{"title":"표에 따른 계산 방식","q":"단위당 노동시간표와 최대 생산량표에서 숫자가 놓인 위치가 같으면 같은 방향으로 나누면 되는가?","why":"노동시간표에서는 X재 1개에 쓰는 시간을 Y재 1개에 필요한 시간으로 나눈다. 최대 생산량표에서는 포기하는 Y재의 최대량을 X재의 최대량으로 나눈다. 두 표는 수치의 의미가 다르다.","hint":"3÷5와 12÷20이 왜 같은 기회비용인지 생각해 보세요."}],"origin":""},"G13-2":{"title":"생산 조합과 남은 자원","premise":"자원과 기술은 고정되어 있다. 한 재화만 생산하면 X재는 최대 18개, Y재는 최대 12개 만들 수 있다. 생산 가능 곡선은 직선이며 X재를 6개 생산한다.","model":"X재 6개를 만드는 데 전체 자원의 6/18을 사용한다. 남은 자원으로 Y재를 얼마나 생산할 수 있는지 구한다.","steps":[{"title":"사용한 자원과 남은 비율","q":"X재 생산에 사용한 자원의 비율과 남은 비율을 구하시오. 분수나 소수로 입력할 수 있다.","why":"X재에 사용한 비율은 6/18=1/3이다. 전체를 1로 보면 남은 비율은 1−1/3=2/3이다.","hint":"전체에서 사용한 비율을 빼세요."},{"title":"함께 생산할 수 있는 Y재","q":"X재 6개와 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.","why":"Y재만 생산하면 12개를 만들 수 있다. 남은 자원은 전체의 2/3이므로 최대 12×2/3=8개를 생산할 수 있다.","hint":"Y재의 최대 생산량 12에 남은 자원의 비율을 곱하세요."},{"title":"곡선 안쪽의 생산 조합","q":"같은 조건에서 X재 6개와 Y재 6개를 생산하는 조합은 어디에 해당하는가?","why":"X재 6개를 만들면서 Y재는 최대 8개까지 만들 수 있다. 6개만 만드는 조합은 자원을 모두 사용하지 않으므로 생산 가능 곡선의 안쪽에 있다.","hint":"함께 만들 수 있는 최대 Y재 8개보다 적게 생산합니다."}],"origin":""},"G14-1":{"title":"유리한 교환 비율과 가능한 수량","premise":"양국의 총노동량은 같고 생산 가능 곡선은 직선이다. A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 8개이다. A국은 X재 24개, B국은 Y재 8개만 생산하였다. 두 나라만 거래하며 재고, 손실, 거래 비용은 없다.","model":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 양국에 유리한 교환이라도 각국이 실제로 가진 수량을 넘겨 줄 수는 없다.","origin":"","steps":[{"title":"보유량보다 큰 수출량","q":"X재 12개와 Y재 9개의 교환 비율은 X재 1개당 Y재 0.75개로 양국의 기회비용 사이에 있다. 그러나 이 교환을 실행할 수 없는 이유는?","options":["A국이 X재 12개를 제공할 수 없기 때문이다.","B국은 Y재 8개만 생산하여 9개를 제공할 수 없기 때문이다.","교환 비율은 언제나 1:1이어야 하기 때문이다."],"why":"B국은 Y재를 8개만 생산하였다. 다른 거래나 재고가 없으므로 Y재 9개를 줄 수 없다.","hint":"B국이 가진 수량은 8개인데 약속한 수량은 9개입니다."},{"title":"수량을 줄인 교환의 이익","q":"X재 8개와 Y재 6개를 교환한다. A국이 직접 생산할 때보다 더 얻는 Y재와 B국이 절약하는 Y재를 각각 구하시오.","why":"A국은 X재 8개 생산으로 Y재 4개를 포기하고 6개를 받으므로 2개의 이익을 얻는다. B국은 X재 8개를 직접 생산하면 Y재 8
