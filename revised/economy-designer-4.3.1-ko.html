cm41("자산 관리의 세 원칙","각 설명에 해당하는 자산 관리의 원칙을 고르시오.",['자산 가치의 보호 정도','이자나 가치 상승의 기대 정도','현금으로 쉽게 바꾸는 정도'],['유동성','안전성','수익성'],[1,2,0],"안전성은 자산의 가치가 안전하게 보호될 수 있는 정도이다. 수익성은 자산 가치의 상승이나 이자 수익 등을 기대할 수 있는 정도이고, 유동성은 자산을 현금으로 쉽게 바꿀 수 있는 정도이다."),
ci41("돈이 필요한 시기와 현금화","다음 약정과 자금 사용 계획을 보고, 지출 기한에 맞게 사용할 수 있는 자산에 대한 설명을 고르시오.",['A: 오늘 현금화 가능, 금액 변동 없음.','B: 한 달 뒤에만 현금화 가능.',"의뢰인은 내일 30이 필요하다."],['둘 다 즉시 사용할 수 있다.','A는 날짜 조건에 맞고 B는 맞지 않는다.','상품 이름만으로 날짜를 무시한다.'],1,"돈을 써야 하는 날은 내일이다. A는 오늘 현금화할 수 있으므로 내일의 지출에 사용할 수 있다. B는 한 달 뒤에만 현금화할 수 있으므로 제시된 약정 아래에서는 내일의 지출에 사용할 수 없다."),
cb41("필요한 현금을 남기는 자산 배분","세 자산의 단위 가격은 모두 10이다. 투자금 100을 전부 배분하되, 즉시 사용할 수 있는 금액이 30 이상이 되도록 각 자산의 수량을 정하시오. 제시된 약정만 고려하며 수익이 가장 큰 조합을 찾을 필요는 없다.",[['즉시 현금화 A',10,[10,10],10],['만기형 B',10,[0,10],10],['변동형 C',10,[0,10],10]],['즉시 사용액','투자금'],[30,100],[null,100],100,[3,4,3],"A를 3단위, B를 4단위, C를 3단위 보유하면 총투자금은 (3+4+3)×10=100이다. 즉시 사용할 수 있는 금액도 30이므로 조건을 충족한다.\n\n이는 정답의 한 예이다. 투자금 100을 전부 사용하고 즉시 사용 가능액이 30 이상인 다른 조합도 정답이다."),
cm41("펀드·보험·연금","각 설명에 해당하는 금융 상품을 고르시오.",['전문 기관이 모은 자금을 운용','사고 발생에 따른 손실 대비','은퇴 이후 생활 안정 목적 지급'],['펀드','보험','연금'],[0,1,2],"펀드는 전문 기관이 투자자들로부터 모은 돈을 운용하는 간접 투자 상품이다. 보험은 사고가 발생했을 때의 손실에 대비하며, 연금은 노후 생활의 안정을 목적으로 한다."),
cf41("펀드의 원금 손실 위험",["펀드는 전문가가 운용하더라도",'원금 손실 위험이 없다',"."],1,['원금 손실 위험이 있다','예금과 모든 특징이 같다','배당이 반드시 보장된다'],0,"펀드는 전문가가 대신 운용하지만 운용 결과에 따라 원금 손실이 발생할 수 있다. 따라서 ‘원금 손실 위험이 없다’를 ‘원금 손실 위험이 있다’로 고쳐야 한다."),
cp41("수익성과 안전성","수익성과 안전성의 일반적인 관계에 대한 설명으로 옳은 것은?",['기대 수익이 높으면 언제나 가장 안전하다.','높은 기대 수익과 원금 손실 위험을 함께 고려한다.','수익성만으로 유동성을 정확히 알 수 있다.'],1,"일반적으로 높은 수익을 기대할 수 있는 금융 자산은 원금 손실 위험도 크다. 반대로 안전성이 높은 금융 자산은 높은 수익을 기대하기 어렵다."),
cn41("분산 투자 후의 자산 금액","A와 B에 각각 50을 투자하였다. 상황 1에서 수익률은 A가 +20%, B가 −10%이고, 상황 2에서는 A가 −20%, B가 +10%이다. 세금과 수수료는 없다. 각 상황에서 두 자산의 최종 금액을 합하여 구하시오.",["상황 1 최종 합계","상황 2 최종 합계"],[105,95],"상황 1에서는 A가 50×1.2=60, B가 50×0.9=45이므로 합계는 105이다.\n\n상황 2에서는 A가 50×0.8=40, B가 50×1.1=55이므로 합계는 95이다. 처음 투자한 100보다 적으므로 분산 투자했더라도 손실이 발생한다."),
cu41("금융 상품과 분산 투자","금융 상품과 분산 투자에 대한 설명으로 옳은 것을 모두 고르시오.",['보험은 사고 손실에 대비한다.','연금은 노후 생활 안정과 연결된다.','펀드는 전문가가 운용해도 손실 위험이 있다.','분산하면 모든 위험이 사라진다.'],[0,1,2],"보험은 사고로 인한 손실에 대비하고, 연금은 노후 생활의 안정을 목적으로 한다. 펀드는 전문가가 운용해도 원금 손실 위험이 있다. 분산 투자는 위험을 줄이는 방법이지만 모든 위험을 없애지는 못한다."),
ci41("목적에 따른 금융 계획","다음 세 사람의 계획을 보고, 금융 자산을 선택할 때 고려할 사항으로 적절한 것을 고르시오.",['갑은 곧 사용할 돈이 필요하다.','을은 장기 목표를 정했다.','병은 사고 손실 대비를 중요하게 생각한다.'],['항상 같은 상품만 선택하게 한다.','목적·기간·위험을 구분하여 검토한다.','세 사람의 조건은 완전히 같다.'],1,"갑은 가까운 시기의 지출, 을은 장기적인 목표, 병은 사고에 따른 손실에 대비하려 한다. 돈을 사용할 목적과 시기, 감당할 수 있는 위험을 고려하여 각자의 계획에 알맞은 금융 자산을 선택해야 한다."),
cp41("개념 적용 문제","어떤 자산은 현금으로 쉽게 바꿀 수 있지만 가치가 크게 하락할 가능성도 있다. 이 중 ‘현금으로 쉽게 바꿀 수 있다’는 특징에 해당하는 자산 관리 원칙은?",['안전성','유동성','확정 수익률'],1,"유동성이다. 유동성은 현금으로 바꾸기 쉬운 정도이고, 안전성은 자산 가치가 보호되는 정도이다. 두 원칙은 구별된다.")
],[cm41("자산 관리 원칙과 금융 상품","각 설명에 해당하는 개념이나 금융 상품을 고르시오.",['쉽게 현금화','사고 손실 대비','노후 안정'],['보험','연금','유동성'],[2,0,1],"현금으로 쉽게 바꿀 수 있는 정도는 유동성이다. 사고 손실에 대비하는 상품은 보험이고, 노후 생활의 안정을 위한 상품이나 제도는 연금이다."),cp41("분산 투자와 손실","여러 금융 자산에 나누어 투자했지만 일부 자산에서 손실이 발생하였다. 이에 대한 설명으로 옳은 것은?",['분산했으므로 손실 자료는 무조건 오류이다.','분산과 손실의 완전한 제거는 다르다.','모든 자산이 예금으로 바뀐다.'],1,"분산 투자는 특정 자산에 투자가 집중되는 위험을 줄이는 방법이다. 원금이나 수익을 보장하는 것은 아니므로 분산 투자한 경우에도 손실이 발생할 수 있다.")],cn41("투자 비중을 고려한 총손익","A에 80, B에 20을 투자하였다. A의 수익률은 +10%, B의 수익률은 −20%이며 다른 비용은 없다. 각 자산의 최종 금액과 전체 투자금의 총손익을 구하시오.",['A 최종액','B 최종액','총손익'],[88,16,4],"A는 80×1.1=88, B는 20×0.8=16이다. 최종 금액의 합은 104이고 처음 투자한 금액의 합은 100이므로 총손익은 4이다.\n\n두 자산에 투자한 금액이 다르므로 수익률을 단순히 더하여 평균을 내면 전체 수익률을 구할 수 없다."));
addCourse41(10,"금융 생활 설계와 이자 계산",5,"재무 목표에 맞는 계획을 세우고, 돈을 받거나 쓰는 시기와 납입 기간을 고려하여 자금과 이자를 계산해 보자.",['F90','F91'],[
co41("금융 생활 설계의 순서",['재무 목표 설정','재무 상태 분석','재무 계획 수립','재무 계획 실행','평가 및 수정'],"먼저 재무 목표를 정하고 현재의 재무 상태를 분석한다. 이를 바탕으로 계획을 수립하여 실행한다. 실행한 뒤에는 결과를 평가하고 문제점을 찾아 계획을 수정한다."),
cm41("재무 설계 단계별 활동","각 활동에 해당하는 재무 설계 단계를 고르시오.",['3년 뒤 필요한 금액 결정','자산·부채·수입·지출 확인','결산의 문제점을 찾아 계획 변경'],['재무 목표','재무 상태 분석','평가 및 수정'],[0,1,2],"앞으로 필요한 금액을 정하는 것은 재무 목표 설정이다. 자산·부채·수입·지출을 파악하는 것은 재무 상태 분석이다. 결산 후 문제점을 찾아 계획을 바꾸는 것은 평가 및 수정에 해당한다."),
cn41("총수입과 월말 잔액","초기 자금은 0이다. 6개월 동안 매월 초에 200을 받고 매월 말에 200을 지출하며 대출은 없다. 6개월간 총수입과 6개월째 월말의 잔액을 각각 구하시오.",['총수입','6개월 말 잔액'],[1200,0],"총수입은 200×6=1,200이고 총지출도 200×6=1,200이다. 따라서 6개월째 월말의 잔액은 0이다. 총수입 1,200이 그대로 남는 것은 아니다."),
cr41("수입을 받기 전에 필요한 자금","6개월 동안 매월 말에 200을 지출한다. 수입 1,200은 6개월째 월초에 한 번 들어온다. 남은 돈은 다음 달로 넘길 수 있지만 대출을 받거나 지출을 미룰 수는 없다. 모든 지출 기한을 지키는 데 필요한 최소 초기 자금을 구하시오.",0,1400,50,1000,"수입을 받기 전에 첫 다섯 달의 지출을 감당해야 한다. 필요한 돈은 200×5=1,000이다.\n\n초기 자금이 1,000이면 첫 다섯 달의 지출을 할 수 있고, 6개월째에는 월초에 받는 수입으로 마지막 지출을 할 수 있다. 따라서 최소 초기 자금은 1,000이다."),
cp41("수입이 먼저 들어오는 경우","초기 자금은 0이며 첫 달 월초에 1,200을 받는다. 남은 돈을 다음 달로 넘길 수 있을 때, 6개월 동안 매월 말에 200씩 지출할 수 있는가?",['가능하다.','반드시 불가능하다.','매월 수입이 아니면 항상 실패한다.'],0,"처음 받은 1,200으로 200씩 여섯 번 지출할 수 있다. 매달 남은 돈을 다음 달로 넘겨 사용하면 되므로 별도의 초기 자금이 필요하지 않다."),
cn41("단리와 복리의 원리금","원금 100을 연 10%로 2년 동안 예치한다. 매년 말에 이자를 계산하며 다른 비용은 없다. 단리와 연복리를 적용한 원리금을 각각 구하시오.",['단리 원리금','연복리 원리금'],[120,121],"단리에서는 매년 원금 100에 대해서만 이자를 계산한다. 해마다 이자 10이 붙으므로 2년 뒤 원리금은 100+10+10=120이다.\n\n복리에서는 첫해의 원리금 110에도 이자가 붙는다. 둘째 해 말에는 110×1.1=121이 된다."),
cn41("납입 시점에 따른 복리 계산","연 10% 복리 상품에 첫해 초 100, 둘째 해 초 100을 넣고 둘째 해 말에 찾는다. 다른 입출금, 세금, 수수료는 없다. 각 납입금의 원리금과 합계를 구하시오.",['첫 납입금의 원리금','두 번째 납입금의 원리금',"원리금 합계"],[121,110,231],"첫해 초에 넣은 돈에는 2년간 이자가 붙는다. 원리금은 100×1.1²=121이다. 둘째 해 초에 넣은 돈에는 1년간 이자가 붙으므로 원리금은 110이다. 두 금액을 합하면 231이다."),
cf41("재무 계획의 평가와 수정",["금융 생활 설계에서는",'실행한 뒤 평가하거나 수정할 필요가 없다',"."],1,['실행 결과를 평가하고 계획을 수정한다','처음 계획을 무조건 유지한다','재무 상태를 확인하지 않는다'],0,"금융 생활 설계에서는 계획을 실행한 뒤에도 결산을 통해 결과와 문제점을 살펴야 한다. 평가 결과를 바탕으로 계획을 수정할 필요가 있다."),
ci41("지출 기한에 부족한 돈","다음 자료를 보고 지출 기한에 필요한 돈을 마련할 수 있는지 판단하시오.",["3개월 말에 300을 지출해야 한다.","그때까지 사용할 수 있는 돈은 200이다.","4개월 초에 수입 500이 들어온다. 대출과 지출 연기는 불가능하다."],['총수입만 크면 문제없다.',"기한 전에 100이 부족하다.","4개월 수입을 3개월 잔액에 넣는다."],1,"3개월 말에 300을 지출해야 하지만 그때까지 사용할 수 있는 돈은 200이다. 따라서 100이 부족하다. 4개월 초에 받는 수입은 앞선 지출 기한에 사용할 수 없으며, 대출이나 지출 연기도 허용되지 않는다."),
cp41("개념 적용 문제","생애 주기를 고려한 금융 생활 설계로 적절한 것은?",['수입·지출·목표를 함께 파악한다.','실제 모든 사람의 수입 곡선은 같다.',"은퇴 뒤 필요한 자금은 항상 0이다."],0,"생애 주기별 과업을 고려하여 재무 목표를 정하고 수입과 지출을 함께 파악해야 한다. 목표를 달성하는 데 필요한 돈과 마련할 수 있는 시기를 고려하여 계획을 세운다.")
],[cn41("원금 200의 단리·복리 비교","원금 200을 연 10%로 2년 동안 예치한다. 매년 말에 이자를 계산하며 추가 납입과 다른 비용은 없다. 단리 원리금과 연복리 원리금을 각각 구하시오.",['단리 원리금','연복리 원리금'],[240,242],"단리에서는 해마다 200×0.1=20의 이자가 붙으므로 원리금은 240이다. 연복리에서는 200×1.1²=242이다. 복리는 첫해에 붙은 이자에도 둘째 해 이자를 계산한다."),cr41("지출을 감당할 최소 초기 자금","4개월 동안 매월 말에 100을 지출한다. 수입 400은 4개월째 월초에 들어오며, 남은 돈은 다음 달로 넘길 수 있다. 대출과 지출 연기가 불가능할 때 필요한 최소 초기 자금을 구하시오.",0,500,10,300,"수입이 들어오기 전에 첫 세 달의 지출 100×3=300을 감당해야 한다. 초기 자금 300이 있으면 이 지출을 마치고, 4개월째에는 월초 수입으로 마지막 지출을 할 수 있다.")],cn41('세 번 넣은 돈의 나이',"연 10% 복리 상품에 첫해, 둘째 해, 셋째 해 초마다 100씩 넣고 셋째 해 말에 찾는다. 다른 비용은 없다. 각 납입금의 원리금과 합계를 구하시오.",["첫 번째 납입금의 원리금","두 번째 납입금의 원리금","세 번째 납입금의 원리금","원리금 합계"],[133.1,121,110,364.1],"첫 번째 납입금에는 3년, 두 번째에는 2년, 세 번째에는 1년간 이자가 붙는다.\n\n원리금은 각각 100×1.1³=133.1, 100×1.1²=121, 100×1.1=110이다. 합계는 364.1이다."));
addCourse41(11,"금리·물가·환율",5,"금리, 물가, 환율의 변화를 알아보고 이자 부담과 구매력, 원화 기준 손익을 비교해 보자.",['F91'],[
cm41("금리·물가·환율","각 설명에 해당하는 경제 지표를 고르시오.",['원금에 대한 이자의 비율','종합적인 가격 수준','두 통화의 교환 비율'],['금리','물가','환율'],[0,1,2],"금리는 원금에 대한 이자의 비율, 물가는 재화와 서비스의 종합적인 가격 수준, 환율은 두 통화의 교환 비율이다."),
cn41("외화 가격과 원화 기준 손익","외화 자산 1개를 100달러에 사서 90달러에 팔았다. 매수 당시 환율은 1,200원/달러, 매도 당시 환율은 1,400원/달러였다. 배당과 다른 비용은 없다. 원화로 환산한 매수 금액, 매도 금액, 손익을 각각 구하시오.",['매수 원화','매도 원화','원화 손익'],[120000,126000,6000],"매수할 때 지출한 원화는 100×1,200=120,000원이다. 매도 대금 90달러를 원화로 바꾸면 90×1,400=126,000원을 받는다.\n\n따라서 원화 기준 손익은 126,000−120,000=6,000원이다. 달러 가격은 하락했지만 환율 상승의 영향으로 원화 기준 이익이 발생하였다."),
cr41("원화 손익이 0이 되는 환율","원화 매수 금액은 120,000원이고 매도 대금은 100달러이다. 다른 비용은 없다. 원화 손익이 0이 되는 환율을 원/달러 단위로 구하시오.",800,1600,10,1200,"원화 손익이 0이 되려면 100달러를 환전하여 120,000원을 받아야 한다. 필요한 환율은 120,000÷100=1,200원/달러이다."),
cn41("가격 상승과 구매 가능량","상품 1개의 가격이 1,000원에서 1,250원으로 올랐다. 쓸 수 있는 돈은 10,000원으로 일정하며 상품은 정수 개만 구입한다. 가격 상승 전후에 살 수 있는 최대 수량을 각각 구하시오.",['이전 개수','이후 개수'],[10,8],"가격이 오르기 전에는 10,000÷1,000=10개, 오른 뒤에는 10,000÷1,250=8개를 살 수 있다. 같은 돈으로 살 수 있는 양이 2개 줄어든다."),
cn41("금리와 이자 부담","대출 원금 1,000만 원에 대해 1년 단리 3% 계약과 5% 계약을 비교한다. 기간 중 원금 상환과 수수료는 없다. 각 계약의 이자와 두 이자의 차이를 만 원 단위로 구하시오.",['3% 이자(만 원)','5% 이자(만 원)','차이(만 원)'],[30,50,20],"3% 계약의 이자는 1,000×0.03=30만 원이다. 5% 계약의 이자는 1,000×0.05=50만 원이다. 원금과 기간이 같을 때 이자율이 높은 계약의 이자 부담이 20만 원 더 크다."),
ci41("환율 상승이 미치는 영향","달러 금액은 그대로이고 원/달러 환율만 상승하였다. 다음 두 사람에게 나타나는 변화에 대한 설명으로 옳은 것은?",["갑은 받은 100달러를 원화로 바꾼다.","을은 상품 대금 100달러를 지급하기 위해 달러를 구매한다."],['둘 다 원화액이 줄어든다.','갑의 환산액과 을의 필요 원화액이 함께 증가한다.','환율 변화의 영향이 없다.'],1,"환율이 오르면 같은 100달러를 원화로 바꿀 때 더 많은 원화를 받는다. 따라서 갑이 받는 원화는 늘어난다. 반면 을은 100달러를 마련하는 데 더 많은 원화를 지출해야 한다."),
cf41("금융 위기와 자산 선택",["금융 위기로 불확실성이 커지면","안전성보다 수익성을 중시하게 된다","."],1,["수익성보다 안전성을 중시할 수 있다","모든 자산의 손실 위험이 사라진다","모든 자산에서 같은 수익을 얻는다"],0,"금융 위기로 불확실성이 커지면 높은 수익보다 자산의 안전성과 유동성을 중시하는 경향이 나타날 수 있다. 따라서 안전성보다 수익성을 중시한다는 부분을 고쳐야 한다."),
cm41("금융 의사 결정의 환경 요인","각 요인을 경제적 환경과 사회적 환경으로 구분하시오.",['예금 금리 변화','환율 변화','팬데믹으로 활동 위축','전쟁으로 불확실성 증가'],['경제적 환경 지표','사회적 환경 변화'],[0,0,1,1],"금리와 환율의 변화는 경제적 환경에 해당한다. 팬데믹으로 인한 경제활동 위축과 전쟁으로 인한 불확실성 증가는 사회적 환경의 변화에 해당한다."),
cn41("외화 금액이 늘어난 뒤의 원화 손익","처음 100달러를 1,000원/달러에 취득하였다. 이후 외화 금액이 110달러가 되었을 때 900원/달러로 환산하였다. 다른 비용은 없다. 처음과 나중의 원화 금액 및 원화 손익을 구하시오.",['처음 원화','마지막 원화','원화 손익'],[100000,99000,-1000],"처음 지출한 금액은 100×1,000=100,000원이다. 나중의 110달러를 환산하면 110×900=99,000원이다.\n\n원화 손익은 99,000−100,000=−1,000원이다. 외화 금액은 늘었지만 환율이 하락하여 원화 기준으로는 손실이 발생하였다."),
cp41("개념 적용 문제","100달러의 금액은 그대로이고 원/달러 환율만 하락하였다. 원화로 환산한 금액은 어떻게 달라지는가?",['증가','감소','동일'],1,"원화 환산액은 달러 금액에 원/달러 환율을 곱하여 구한다. 달러 금액이 같고 환율이 낮아졌으므로 원화 환산액은 감소한다.")
],[cn41("외화 이익과 환율 하락","자산을 50달러에 사서 60달러에 팔았다. 매수 당시 환율은 1,200원/달러, 매도 당시 환율은 1,000원/달러였으며 다른 비용은 없다. 원화 매수 금액, 매도 금액, 손익을 구하시오.",['처음 원화','나중 원화','차익'],[60000,60000,0],"매수 금액은 50×1,200=60,000원이다. 매도 금액도 60×1,000=60,000원이므로 원화 손익은 0이다. 달러 가격 상승으로 얻은 이익이 환율 하락으로 상쇄되었다."),cp41("달러 구매에 필요한 원화","원/달러 환율이 1,000원에서 1,100원으로 상승하였다. 10달러를 구매하는 데 필요한 원화 금액은 어떻게 달라지는가?",['1000원 증가','1000원 감소','동일'],0,"환율 상승 전에는 10×1,000=10,000원이 필요하다. 상승 후에는 10×1,100=11,000원이 필요하므로 지출할 원화가 1,000원 늘어난다.")],cn41("원화 취득액과 손익 분기 환율","처음 80달러를 1,250원/달러에 취득하였고, 나중의 외화 금액은 100달러가 되었다. 다른 비용은 없다. 처음 원화 금액과 원화 손익이 0이 되는 나중의 환율을 구하시오.",['처음 원화 금액','원금과 같아지는 원/달러 환율'],[100000,1000],"처음 원화 금액은 80×1,250=100,000원이다. 나중의 100달러를 100,000원으로 바꿀 수 있어야 손익이 0이다. 필요한 환율은 100,000÷100=1,000원/달러이다."));
addCourse41(12,"생산 조건과 무역의 필요성",4,"생산 조건이 나라별로 다른 이유를 알아보고, 생산에 필요한 자원과 평균 생산 단가를 계산해 보자.",['T103'],[
cm41("국가별 생산 조건","각 설명과 가장 밀접한 생산 조건을 고르시오.",['매장 광물의 양과 질','기온·강수·토양','노동·자본 보유','같은 재료를 가공하는 기술'],['부존자원','자연환경','생산 요소','기술 수준'],[0,1,2,3],"광물의 매장량과 품질은 부존자원, 기온·강수·토양은 자연환경과 관련된다. 노동과 자본의 보유 정도는 생산 요소에 관한 설명이며, 재료를 가공하는 방법은 기술 수준과 관련된다."),
ci41("생산 조건의 차이와 교환","다음 두 집단의 생산 조건을 보고 교환에 대한 설명으로 옳은 것을 고르시오.",['A집단은 재료가 많으나 필요한 도구가 부족하다.','B집단은 도구가 있으나 재료가 부족하다.'],['차이를 활용한 교환을 검토할 수 있다.','조건이 다르면 어떤 교환도 불가능하다.','두 집단의 조건은 완전히 같다.'],0,"A는 재료가 많지만 도구가 부족하고, B는 도구가 있지만 재료가 부족하다. 두 집단은 각각 부족한 것을 교환하는 방법을 생각할 수 있다. 생산에 필요한 자원의 보유 정도가 다르면 교환이 이루어질 수 있다."),
cb41("예산 안에서 생산 요소 구하기","재료 4와 기술 서비스 2가 필요하다. 표의 가격과 제공량을 이용하여 필요한 양을 모두 구하되, 비용이 12 이하가 되도록 항목과 수량을 고르시오.",[['재료 묶음',3,[2,0],3],['기술서비스',4,[0,1],2],['결합 계약',6,[2,1],2]],['재료','기술서비스'],[4,2],[null,null],12,[0,0,2],"결합 계약 2개를 고르면 재료 4와 기술 서비스 2를 모두 얻는다. 총비용은 6×2=12이므로 예산도 넘지 않는다."),
cn41("재료와 노동이 제한된 생산","제품 1개를 만들려면 재료 2와 노동 1이 필요하다. 재료 8과 노동 3을 가지고 있으며 기술 요건은 충족하였다. 제품은 정수 개만 만든다. 최대 생산량과 그때 남는 재료를 구하시오.",['최대 제작 수','그때 남는 재료'],[3,2],"재료로는 8÷2=4개를 만들 수 있지만, 노동으로는 3개만 만들 수 있다. 두 조건을 모두 충족해야 하므로 최대 생산량은 3개이다. 재료는 2×3=6을 사용하므로 2가 남는다."),
cn41("노동 증가 후의 생산량","제품 1개에 재료 2와 노동 1이 필요하다. 재료는 8로 일정하고 노동이 3에서 4로 늘었다. 다른 제약이 없을 때 최대 생산량과 남는 재료를 구하시오.",['최대 제작 수','남는 재료'],[4,0],"재료와 노동 모두 제품 4개를 만들기에 충분하다. 따라서 최대 생산량은 4개이다. 재료는 2×4=8을 모두 사용하므로 남지 않는다."),
cn41("운송 경로별 비용","직행 운송비는 9이다. 경유할 때에는 중간 지점까지 4, 그곳에서 목적지까지 3이 든다. 다른 비용과 시간 제약은 없다. 경유 비용과 직행에 비해 절약하는 금액을 구하시오.",['경유 비용','직행 대비 절약'],[7,2],"경유 비용은 두 구간의 비용을 합한 4+3=7이다. 직행 비용 9보다 2만큼 적게 든다."),
cp41("국내 생산이 가능한 상품의 수입","국내에서 생산할 수 있는 상품도 수입하는 이유로 적절한 것은?",['국내 생산이 가능하면 수입은 항상 불가능하다.','국가별 생산 비용 차이를 고려할 수 있다.','모든 생산 조건은 전 세계가 동일하다.'],1,"국가마다 생산 조건이 달라 같은 상품을 생산하는 데 드는 비용도 다를 수 있다. 국내에서 생산할 수 있더라도 다른 나라에서 더 낮은 비용으로 생산한다면 수입하는 것이 효율적일 수 있다."),
cn41("생산량별 평균 생산 단가","100개를 생산할 때 총비용은 200, 200개를 생산할 때 총비용은 300이다. 각 경우의 평균 생산 단가를 구하시오.",['100개일 때 평균 단가','200개일 때 평균 단가'],[2,1.5],"평균 생산 단가는 총비용을 생산량으로 나누어 구한다. 100개일 때에는 200÷100=2이고, 200개일 때에는 300÷200=1.5이다. 총비용은 늘었지만 1개당 생산 비용은 줄었다."),
cu41("무역의 필요성과 이익","무역의 필요성과 이익에 대한 설명으로 옳은 것을 모두 고르시오.",['자국에서 생산하지 않는 재화를 얻을 수 있다.','상품·서비스 선택 기회가 넓어질 수 있다.','나라별 생산 조건이 다를 수 있다.','모든 노동자에게 동일한 이익이 자동 보장된다.'],[0,1,2],"무역을 통해 국내에서 생산되지 않는 재화를 얻고 상품과 서비스의 선택 기회를 넓힐 수 있다. 국가 간 생산 조건의 차이도 무역이 발생하는 원인이다. 다만 무역의 이익이 모든 노동자에게 똑같이 돌아가는 것은 아니다."),
cp41("개념 적용 문제","생산 규모가 커지거나 생산량이 늘어날수록 평균 생산 단가가 하락하는 현상은?",['규모의 경제','매몰 비용','비배제성'],0,"규모의 경제이다. 생산량이 늘면서 1개당 생산 비용이 줄어드는 현상으로, 총비용이 늘더라도 나타날 수 있다.")
],[cb41("재료와 기술 서비스 구입","재료 6과 기술 서비스 2가 필요하다. 예산 14 안에서 필요한 양을 모두 구하도록 항목과 수량을 고르시오.",[['재료 묶음',2,[2,0],4],['기술 제공',4,[0,1],2]],['재료','기술'],[6,2],[null,null],14,[3,2],"재료 묶음 3개를 구입하면 재료 6을 얻고, 기술 제공 2개를 구입하면 기술 서비스 2를 얻는다. 총비용은 2×3+4×2=14로 예산과 같다."),cn41("총비용과 평균 생산 단가","100개를 생산할 때 총비용은 250, 200개를 생산할 때 총비용은 400이다. 각 경우의 평균 생산 단가를 구하시오.",['처음 평균 단가','나중 평균 단가'],[2.5,2],"100개일 때의 평균 생산 단가는 250÷100=2.5이다. 200개일 때에는 400÷200=2이다. 생산량이 증가하면서 평균 생산 단가는 하락하였다.")],cn41("생산량과 남는 생산 요소","제품 1개에 재료 3과 노동 2가 필요하다. 재료 18과 노동 10을 가지고 있으며 제품은 정수 개만 만든다. 최대 생산량과 그때 남는 재료, 노동을 구하시오.",['최대 제작 수','남는 재료','남는 노동'],[5,3,0],"재료로는 18÷3=6개를 만들 수 있고, 노동으로는 10÷2=5개를 만들 수 있다. 따라서 최대 생산량은 5개이다.\n\n재료는 18−3×5=3이 남으며, 노동은 10−2×5=0이므로 모두 사용한다."));
addCourse41(13,"절대 우위와 비교 우위",2,"생산량과 노동시간, 생산 가능 곡선으로 기회비용을 구하고 비교 우위에 있는 재화를 찾아보자.",['T103','T104','A86'],[
cm41("절대 우위와 비교 우위","각 정의에 해당하는 개념을 고르시오.",['같은 양을 더 적은 비용으로 생산','같은 양을 더 작은 기회비용으로 생산'],['비교 우위','절대 우위'],[1,0],"절대 우위는 다른 생산자보다 같은 양을 더 적은 비용으로 생산할 수 있는 능력이다. 비교 우위는 같은 양을 더 작은 기회비용으로 생산할 수 있는 능력이다."),
cn41("최대 생산량과 기회비용","양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 한 재화만 생산할 때 A국은 X재 12개 또는 Y재 6개, B국은 X재 4개 또는 Y재 4개를 최대로 생산할 수 있다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",['A의X1 기회비용(Y개)','B의X1 기회비용(Y개)'],[0.5,1],"A국은 X재 12개를 생산하려면 Y재 6개를 포기한다. 따라서 X재 1개 생산의 기회비용은 Y재 6÷12=0.5개이다. B국은 X재 4개 생산으로 Y재 4개를 포기하므로 기회비용은 Y재 1개이다."),
cm41("비교 우위에 있는 재화","양국이 같은 총노동량을 모두 투입할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선은 직선이다. 각국이 비교 우위를 갖는 재화를 고르시오.",['A국','B국'],['X재','Y재'],[0,1],"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 기회비용이 더 작은 A국이 X재에 비교 우위를 갖는다.\n\nY재 1개 생산의 기회비용은 A국이 X재 2개, B국이 X재 1개이다. 따라서 B국은 Y재에 비교 우위를 갖는다."),
ppf42("함께 생산할 수 있는 최대 수량",12,6,4,"X재만 생산하면 최대 12개를 만들 수 있다. 4개를 만들 때에는 자원의 1/3을 사용하므로 2/3가 남는다. Y재만 생산할 때의 최대 생산량은 6개이므로 남은 자원으로 6×2/3=4개를 만들 수 있다."),
cn41("노동시간과 생산의 기회비용","재화 1개당 필요한 노동시간은 A국이 X재 2시간, Y재 4시간이고 B국이 X재 3시간, Y재 3시간이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",['A의X1 기회비용(Y개)','B의X1 기회비용(Y개)'],[0.5,1],"A국은 X재 1개에 노동 2시간을 사용한다. 그 시간으로 Y재를 2÷4=0.5개 만들 수 있으므로 기회비용은 Y재 0.5개이다. B국에서는 X재 1개에 쓰는 3시간으로 Y재도 1개 만들 수 있다."),
cf41("모든 재화에 절대 우위를 갖는 경우",["한 나라가 두 재화 모두 절대 우위인 경우에도","비교 우위로 무역의 발생을 설명할 수 없다","."],1,["비교 우위로 무역의 발생을 설명할 수 있다","두 나라의 모든 생산 기회비용은 항상 같다","상대국의 생산 조건을 살펴볼 필요가 없다"],0,"한 나라가 두 재화를 모두 더 적은 비용으로 생산하더라도 각국의 생산 기회비용은 다를 수 있다. 각국이 기회비용이 작은 재화에 특화하여 교환하는 무역은 비교 우위로 설명할 수 있다."),
cm41("생산 가능 곡선과 생산 조합","한 재화만 생산할 때 A국은 X재를 최대 12개, Y재를 최대 6개 생산할 수 있다. 생산 가능 곡선이 직선일 때, 각 조합이 곡선 안쪽, 곡선 위, 곡선 바깥쪽 중 어디에 해당하는지 구분하시오.",['X6·Y3','X12·Y6','X4·Y2'],['생산 가능 곡선 위',"현재의 자원과 기술로는 생산할 수 없다.",'생산 가능 영역 내부'],[0,1,2],"X재 6개와 Y재 3개는 두 재화에 자원을 절반씩 사용한 조합이므로 곡선 위에 있다.\n\nX재 12개와 Y재 6개는 각각 모든 자원을 사용해야 만들 수 있는 양이다. 두 양을 함께 생산할 수 없으므로 곡선 바깥쪽이다. X재 4개와 Y재 2개는 전체 자원의 2/3를 사용하므로 곡선 안쪽에 있다."),
cn41("Y재 생산의 기회비용","한 재화만 생산할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선이 직선일 때, 각국의 Y재 1개 생산의 기회비용을 X재 수량으로 구하시오.",['A의Y1 기회비용(X개)','B의Y1 기회비용(X개)'],[2,1],"A국은 Y재 6개 생산으로 X재 12개를 포기한다. 따라서 Y재 1개의 기회비용은 X재 12÷6=2개이다. B국은 X재 4÷4=1개이다."),
ci41("절대 우위를 판단하는 기준","다음 자료만으로 두 나라의 절대 우위를 판단하기 어려운 이유와 추가로 살펴야 할 내용으로 적절한 것은?",["같은 재화의 생산량은 A국이 20, B국이 10이다.","두 나라가 투입한 노동량과 생산 비용은 제시되지 않았다."],['수치만으로 같은 투입 기준의 절대 우위를 확정한다.','투입 조건을 더 확인한다.','절대 우위는 기회비용과 같은 말이다.'],1,"A국의 생산량이 더 많지만 그만큼 노동을 더 투입했을 수도 있다. 생산량으로 절대 우위를 비교하려면 투입한 노동량 등 생산 조건을 함께 알아야 한다."),
cp41("개념 적용 문제","X재 1개 생산의 기회비용은 갑국이 Y재 2개, 을국이 Y재 3개이다. X재 생산에 비교 우위를 갖는 나라는?",['갑','을','생산량표가 없으므로 판별 불가'],0,"갑국이다. 같은 X재 1개를 생산할 때 포기하는 Y재가 을국보다 1개 적으므로 갑국의 기회비용이 더 작다.")
],[cn41("최대 생산량표의 기회비용","한 재화만 생산할 때 A국의 최대 생산량은 X재 20개 또는 Y재 10개이고, B국은 X재 8개 또는 Y재 12개이다. 생산 가능 곡선이 직선일 때, 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",['A의X1 기회비용(Y개)','B의X1 기회비용(Y개)'],[0.5,1.5],"A국은 X재 20개 생산으로 Y재 10개를 포기하므로 X재 1개의 기회비용이 Y재 0.5개이다. B국은 Y재 12÷8=1.5개이다."),ppf42("X재 생산량과 남은 자원",20,10,8,"X재의 최대 생산량이 20개이므로 8개를 생산할 때 자원의 8/20을 사용한다. 남은 자원은 12/20이다. Y재의 최대 생산량은 10개이므로 남은 자원으로 10×12/20=6개를 만들 수 있다.")],cn41("단위당 노동시간과 기회비용","재화 1개당 노동시간은 A국이 X재 4시간, Y재 10시간이고 B국이 X재 9시간, Y재 6시간이다. 각국의 X재 1개 생산의 기회비용과 A국의 Y재 1개 생산의 기회비용을 구하시오.",['A의X1 기회비용(Y개)','B의X1 기회비용(Y개)','A의Y1 기회비용(X개)'],[0.4,1.5,2.5],"X재 1개에 쓰는 시간으로 생산할 수 있는 Y재를 구하면 A국은 4÷10=0.4개, B국은 9÷6=1.5개이다.\n\nA국에서 Y재 1개에 쓰는 10시간으로 X재를 10÷4=2.5개 생산할 수 있으므로 Y재 1개의 기회비용은 X재 2.5개이다."));
addCourse41(14,"교환 비율과 무역의 이익",2,"양국에 유리한 교환 비율을 구하고, 실제로 교환할 수 있는 수량과 교역 후의 이익을 계산해 보자.",['T104','A86'],[
cn41("교환 비율과 기회비용","한 재화만 생산할 때 A국의 최대 생산량은 X재 12개 또는 Y재 6개이고, B국은 X재 4개 또는 Y재 4개이다. 생산 가능 곡선이 직선일 때, 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하여 작은 값부터 쓰시오.",['작은 기회비용(Y개)','큰 기회비용(Y개)'],[0.5,1],"A국의 기회비용은 Y재 6÷12=0.5개, B국은 Y재 4÷4=1개이다. 두 값은 모두 X재 1개를 생산할 때 포기하는 Y재 수량이다."),
trade42("양국이 이익을 얻는 교환",12,6,4,4,4,"X재 4개와 Y재 3개를 교환하는 경우를 보자. A국은 X재 4개를 만드는 대신 Y재 2개를 포기하는데, 교환으로 Y재 3개를 받으므로 1개를 더 얻는다. B국은 X재 4개를 직접 만들려면 Y재 4개를 포기해야 하지만 3개만 지급하므로 1개를 절약한다.\n\n이는 정답의 한 예이다. 제시된 생산량과 수량 간격 안에서 양국 모두 이익을 얻는 다른 교환도 가능하다."),
cn41("교역 후 양국의 보유량","A국은 X재 12개만, B국은 Y재 4개만 생산하였다. A국이 X재 4개를 주고 B국으로부터 Y재 3개를 받았다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.",["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"],[8,3,4,1],"A국은 X재 12개 중 4개를 주었으므로 X재 8개가 남고, Y재 3개를 받는다. B국은 X재 4개를 받고 Y재 4개 중 3개를 주므로 Y재 1개가 남는다.\n\n양국의 보유량을 합하면 X재 12개, Y재 4개로 생산 총량과 같다."),
cn41("직접 생산과 교환의 비교","X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. A국이 X재 4개를 주고 Y재 3개를 받는다. A국이 직접 생산할 때보다 더 얻는 Y재와 B국이 절약하는 Y재를 각각 구하시오.",["A국이 추가로 얻는 Y재 수량","B국이 절약하는 Y재 수량"],[1,1],"A국은 X재 4개를 만드는 데 Y재 4×0.5=2개를 포기한다. 교환으로 3개를 받으므로 이익은 Y재 1개이다.\n\nB국이 X재 4개를 직접 만들 때의 기회비용은 Y재 4개이다. 교환에서는 3개만 지급하므로 Y재 1개를 절약한다."),
cm41("교환 비율에 따른 양국의 이익","X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. A국은 X재를 주고 B국은 Y재를 준다. 각 교환 비율에서 양국의 이익이 어떻게 달라지는지 구분하시오.",['X1:Y0.5','X1:Y0.75','X1:Y1','X1:Y1.2'],["A국의 추가 이익이 0","양국의 추가 이익이 모두 양수","B국의 추가 이익이 0","B국에 불리한 교환"],[0,1,2,3],"X재 1개를 Y재 0.5개와 교환하면 A국은 직접 생산할 때와 차이가 없다. Y재 1개와 교환하면 B국의 이익이 0이다.\n\nY재 수량이 0.5개보다 크고 1개보다 작으면 양국 모두 이익을 얻는다. Y재 1.2개를 지급해야 한다면 B국은 직접 생산하는 편이 유리하다."),
trade42("생산 조건이 달라진 교환",8,8,4,12,2,"X재 1개 생산의 기회비용은 A국이 Y재 1개, B국이 Y재 3개이다. X재 2개와 Y재 4개를 교환하면 A국은 4−2×1=2개의 이익을 얻는다. B국은 2×3−4=2개를 절약한다. 이 역시 양국이 이익을 얻는 교환의 한 예이다."),
cf41("X재 1개당 교환 비율",["X재 4개와 Y재 3개를 교환하는 비율은","X재 1개당 Y재 4/3개","이다."],1,["X재 1개당 Y재 3/4개","X재 1개당 Y재 4개","X재 1개당 Y재 3개"],0,"X재 4개와 Y재 3개의 수량을 각각 4로 나누면 X재 1개와 Y재 3/4개가 된다. 따라서 교환 비율은 X재 1개당 Y재 3/4개이다."),
cn41("같은 소비량을 얻는 생산 비용","재화 1개당 생산 비용은 A국이 X재 10달러, Y재 20달러이고 B국은 X재 40달러, Y재 30달러이다. 각국은 X재와 Y재를 1개씩 소비하려 한다. 두 재화를 1:1로 교환하며 거래 비용은 없다. 자급 비용과 특화 후 생산 비용을 각각 구하시오.",["A국의 자급 비용(달러)","A국이 X재 2개를 생산하는 비용(달러)","B국의 자급 비용(달러)","B국이 Y재 2개를 생산하는 비용(달러)"],[30,20,70,60],"A국이 두 재화를 1개씩 직접 생산하면 10+20=30달러가 든다. X재 2개를 생산하여 하나를 Y재와 교환하면 같은 소비량을 얻으면서 생산 비용은 20달러로 줄어든다.\n\nB국의 자급 비용은 40+30=70달러이다. Y재 2개를 생산하여 하나를 X재와 교환하면 비용은 60달러이다. 양국 모두 10달러씩 절약한다."),
ci41("국가의 교역 이익과 개인의 이익","다음 보고서의 자료를 바탕으로 내릴 수 있는 판단으로 적절한 것은?",['계산은 두 국가의 생산·소비 조합이다.','각국 안의 개인별 이익 분배는 제시하지 않았다.'],['모든 개인에게 같은 이익이 보장된다.','국가 간 계산과 개인별 분배를 구분한다.','생산 비용은 언제나 볼 필요 없다.'],1,"국가별 생산량과 소비량을 비교하면 교역을 통한 이익을 구할 수 있다. 그러나 그 이익이 개인들에게 어떻게 나뉘었는지는 개인별 분배 자료가 있어야 알 수 있다. 국가가 이익을 얻었다고 모든 개인이 같은 이익을 얻는 것은 아니다."),
cp41("개념 적용 문제","X재 1개 생산의 기회비용은 A국이 Y재 2개, B국이 Y재 5개이다. A국은 X재를 주고 B국은 Y재를 준다. 양국 모두 직접 생산할 때보다 이익을 얻는 교환 비율은?",['X1:Y1','X1:Y3','X1:Y6'],1,'2<3<5이다.')
],[trade42("새 생산량표에 따른 교환",20,10,8,12,4,"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1.5개이다. X재 4개와 Y재 4개를 교환하면 A국은 4−4×0.5=2개의 이익을 얻고, B국은 4×1.5−4=2개를 절약한다. 이는 가능한 정답의 한 예이다."),cn41("수출입과 최종 보유량","A국은 X재 20개만, B국은 Y재 12개만 생산하였다. A국이 X재 4개를 주고 Y재 4개를 받았다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.",["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"],[16,4,4,8],"A국의 X재는 20−4=16개가 남고 Y재는 4개이다. B국은 X재 4개를 받고 Y재는 12−4=8개가 남는다. 양국의 보유량을 합하면 원래의 생산 총량과 같다.")],cn41("교역 후 소비량으로 생산량 구하기","A국은 X재, B국은 Y재만 생산하였다. 교역 후 소비량은 A국이 X재 18개와 Y재 5개, B국이 X재 6개와 Y재 7개이다. 다른 나라와의 거래, 재고, 손실은 없다. 각국의 특화 생산량, A국의 X재 수출량, X재 1개당 교환한 Y재 수량을 구하시오.",["A국의 X재 생산량","B국의 Y재 생산량","A국의 X재 수출량","X재 1개당 교환한 Y재 수량"],[24,12,6,5/6],"X재의 소비량을 합하면 18+6=24개이다. X재는 A국만 생산했으므로 A국의 생산량이 24개이다. Y재의 소비량 합계 5+7=12개는 B국의 생산량이다.\n\nB국이 소비한 X재 6개는 A국으로부터 수입한 양이다. A국은 X재 6개를 주고 Y재 5개를 받았으므로 교환 비율은 X재 1개당 Y재 5/6개이다."));
COURSE41.tasks.find(t=>t.id==='C14-08').origin="";
addCourse41(15,"무역의 영향과 지속가능발전",3,"무역 확대가 생산과 고용, 분배와 환경에 미치는 영향을 알아보고 지속가능한 무역의 방안을 살펴보자.",['T104','T105'],[
cm41("무역 확대의 영향","각 내용을 무역 확대의 긍정적 영향과 부정적 영향으로 구분하시오.",["상품 선택 기회의 확대","기술의 전파","경쟁력이 낮은 산업의 위축","경제 문제의 국가 간 확산"],['긍정적 영향','부정적 영향'],[0,0,1,1],"상품을 선택할 기회가 넓어지고 기술이 전파되는 것은 긍정적 영향이다. 반면 경쟁력이 낮은 국내 산업이 위축되거나 한 나라의 경제 문제가 다른 나라로 확산되는 것은 부정적 영향이다."),
ci41("무역 이익의 분배","다음 자료를 바탕으로 무역 이익의 분배를 평가한 내용으로 적절한 것은?",['거래 총액이 증가했다.','생산자 대가와 노동 조건을 확인한다.','수익이 누구에게 돌아가는지 기록한다.'],['총액만으로 분배 검토가 끝난다.','대가·조건·분배 자료를 함께 확인한다.','상품 색만 본다.'],1,"거래 총액은 거래의 전체 규모를 나타낸다. 생산자와 노동자에게 이익이 공정하게 돌아갔는지 알려면 지급한 대가, 노동 조건, 수익의 분배 방식을 함께 살펴야 한다.",[1,2]),
cm41("WTO와 FTA",'교재의 개념을 연결하세요.',["국가 간 무역 관계를 관리·감독하는 국제기구","체결국 사이의 관세·비관세 장벽을 완화하는 협정"],['FTA','WTO'],[1,0],"WTO는 국가 간 무역 관계를 관리·감독하는 세계 무역 기구이다. FTA는 체결국 사이의 관세와 비관세 장벽을 완화하는 자유 무역 협정이다."),
cm41("자유 무역과 보호 무역","각 정책을 자유 무역과 보호 무역으로 구분하시오.",["관세와 비관세 장벽을 낮추어 교역을 확대함","관세와 비관세 장벽으로 국내 산업을 보호함"],['자유 무역','보호 무역'],[0,1],"관세와 비관세 장벽을 낮추어 자유로운 교역을 추구하는 것은 자유 무역이다. 관세나 비관세 장벽을 활용하여 국내 산업을 보호·육성하는 것은 보호 무역이다."),
cb41("무역 계약을 검토할 자료","예산 9 안에서 대가 지급, 노동 조건, 환경에 관한 문서를 각각 1개 이상 준비하시오. 각 항목은 최대 1개까지 선택할 수 있다. 표의 값은 각 항목에서 얻는 문서의 수이다.",[['대가 지급 검토',3,[1,0,0],1],['노동 조건 검토',3,[0,1,0],1],['환경 과정 검토',3,[0,0,1],1],['표지 디자인',2,[0,0,0],1]],['대가 문서','노동 문서','환경 문서'],[1,1,1],[null,null,null],9,[1,1,1,0],"대가 지급 검토, 노동 조건 검토, 환경 과정 검토를 고르면 세 문서를 모두 얻는다. 총비용은 3+3+3=9이다. 표지 디자인은 필요한 자료를 제공하지 않는다. 문서를 구한 뒤에는 그 내용을 바탕으로 계약을 검토해야 한다."),
cn41("무역 의존도","가상 국가의 GDP는 500, 수출액은 120, 수입액은 80이다. 금액의 기간과 단위는 같다. 다음 식으로 무역 의존도를 구하시오.\n\n무역 의존도(%)=(수출액+수입액)÷GDP×100",['무역 의존도(%)'],[40],"수출액과 수입액을 합하면 200이다. GDP에서 차지하는 비율은 200÷500=0.4이므로 무역 의존도는 40%이다."),
cu41("지속가능한 무역을 위한 실천","지속가능한 국제 무역을 위한 방안으로 적절한 것을 모두 고르시오.",["생산자에게 정당한 대가를 지급한다.","안전한 노동 환경을 고려한다.","친환경적인 생산과 운송 방식을 검토한다.","아동 노동과 강제 노동을 확대한다."],[0,1,2],"생산자에게 정당한 대가를 지급하고 안전한 노동 환경을 보장하며 친환경적인 생산과 운송을 실천해야 한다. 아동 노동과 강제 노동의 확대는 생산자와 노동자의 권리를 보호하는 방향과 맞지 않는다."),
cf41("지속가능한 무역의 고려 사항",['지속가능한 국제 무역은','환경만 보고 사회적 책임은 제외하는','무역이다.'],1,['경제적 효율성·사회적 책임·환경을 함께 고려하는',"당장의 거래 총액만 고려하는","미래 세대의 필요를 무시하는"],0,"지속가능한 국제 무역은 미래 세대의 필요를 해치지 않으면서 경제적 효율성, 사회적 책임, 환경 보호를 함께 고려하는 무역이다. 당장의 거래액만을 늘리는 것으로 충분하지 않다."),
ci41("무역 보고서의 결론","다음 자료를 바탕으로 보고서를 작성하는 방법으로 가장 적절한 것은?",['총생산과 교역이 증가했다.','일부 산업의 고용은 감소했다.','노동·환경의 추가 자료는 아직 없다.'],["거래 총액이 늘었으므로 노동과 환경도 개선되었다고 쓴다.","확인된 이익과 손실을 각각 설명하고 노동과 환경에 관한 부족한 자료를 추가로 조사한다.","환경 자료가 없으므로 환경 피해도 없었다고 쓴다."],1,"자료에서는 총생산과 교역의 증가, 일부 산업의 고용 감소를 확인할 수 있다. 이 사실들을 함께 설명해야 한다. 나머지 노동 조건과 환경 영향은 관련 자료가 더 필요하다."),
cp41("개념 적용 문제","국제 무역의 지속가능성을 평가하는 방법으로 가장 적절한 것은?",["효율성·노동·환경·분배를 함께 검토한다.","수출액만으로 평가를 마친다.","내용과 조건이 달라도 모든 무역을 동일하게 평가한다."],0,"경제적 효율성과 함께 이익의 분배, 노동자의 권리, 생산과 운송 과정의 환경 영향을 살펴야 한다. 수출액만으로 이러한 내용을 모두 알 수는 없다.")
],[cu41("무역의 지속가능성 검토 항목","무역의 지속가능성을 평가할 때 살펴야 할 항목을 모두 고르시오.",['생산자 대가','노동 조건','환경 영향','상품 이름의 글자 수만'],[0,1,2],"생산자에게 지급한 대가, 노동 조건, 환경 영향은 지속가능한 무역의 중요한 평가 항목이다. 상품 이름의 글자 수는 이 내용을 알려 주는 자료가 아니다."),cn41("수출입 합계와 무역 의존도","가상 국가의 GDP는 800, 수출액은 200, 수입액은 120이다. 금액의 기간과 단위는 같다. 다음 식으로 무역 의존도를 구하시오.\n\n무역 의존도(%)=(수출액+수입액)÷GDP×100",["무역 의존도(%)"],[40],"수출액과 수입액의 합은 320이다. 이를 GDP 800으로 나누어 백분율로 나타내면 320÷800×100=40%이다.")],cu41("총액 자료에서 알 수 있는 사실","거래액은 15%, 생산자에게 지급한 대가의 총액은 4% 증가하였다. 노동시간과 환경에 관한 자료는 없다. 옳은 설명을 모두 고르시오.",["거래액과 지급 대가 총액의 증가율은 다르다.","시간당 보수는 4% 증가하였다.","시간당 보수와 환경의 변화를 알려면 관련 자료가 더 필요하다.","환경 피해는 발생하지 않았다."],[0,2],"거래액과 지급 대가 총액은 모두 늘었지만 증가율은 다르다. 시간당 보수는 지급한 대가를 노동시간으로 나누어 구하므로 노동시간의 변화가 필요하다. 환경 자료가 없다는 이유로 피해가 없었다고 결론 내릴 수도 없다."));
addLesson41(8,1,"예금의 종류와 납입 방식","요구불 예금, 정기 예금, 정기 적금의 특징을 비교해 보자.",[
"예금은 이자 수익이나 자금 보관을 목적으로 금융 기관에 맡기는 자금 또는 금융 자산이다. 요구불 예금은 입금과 출금이 자유로워 주로 자금의 보관과 결제에 이용된다. 저축성 예금은 정해진 기간 동안 자금을 맡기거나 정기적으로 적립하는 예금이다.",
"정기 예금은 목돈을 한 번에 맡기고 만기에 원금과 이자를 받는 방식이다. 정기 적금은 일정 금액을 정기적으로 납입하고 만기에 원금과 이자를 받는 방식이다. 두 상품은 돈을 한꺼번에 맡기는지, 나누어 맡기는지에서 차이가 있다.",
"납입 총액이 같아도 돈을 맡긴 시점이 다르면 이자는 달라질 수 있다. 정기 적금에서는 나중에 납입한 돈일수록 예치 기간이 짧다. 따라서 예금과 적금의 이자를 비교할 때에는 이자율뿐 아니라 각 금액을 맡긴 기간과 이자 계산 방식도 고려해야 한다."
],"A는 첫 달에 600을 한 번 맡기고, B는 여섯 달 동안 매월 100씩 맡긴다. 두 방식의 납입 총액과 예치 기간을 비교해 보자.",[
"A는 첫 달에 600을 맡기므로 납입 총액은 600이다.","B는 매월 100씩 여섯 번 맡기므로 납입 총액은 100×6=600이다.","납입 총액은 같지만 B는 나중에 맡긴 돈일수록 예치 기간이 짧다. 따라서 납입 총액이 같다는 이유만으로 이자도 같다고 할 수는 없다."
],"두 방식의 납입 총액은 모두 600이다. 다만 돈을 맡긴 시점과 예치 기간이 다르다.","자유로운 입출금은 요구불 예금, 목돈을 한 번에 맡기는 방식은 정기 예금, 정기적으로 나누어 납입하는 방식은 정기 적금이다.","특정 날짜에 자금을 사용할 수 있는지 묻는 문제에서는 제시된 만기일과 인출 조건을 적용한다.",{q:"일정 금액을 일정 기간 동안 정기적으로 납입하는 저축성 예금은?",o:['정기 예금','정기 적금','주식'],a:1,why:"정기 적금이다. 정기 예금은 목돈을 한 번에 맡기는 방식이다."},['F88','F89']);
addLesson41(8,2,"주식과 채권","주식과 채권의 발행자, 보유자의 지위, 수익 형태를 비교해 보자.",[
"주식은 주식회사가 경영 자금을 마련하기 위해 투자자의 지분을 표시하여 발행하는 증서이다. 주식을 보유한 사람은 주주로서 회사의 의사 결정에 관한 권리를 가진다. 또한 배당 수익을 기대할 수 있으며, 주식을 산 가격보다 높은 가격에 팔면 시세 차익을 얻는다.",
"채권은 정부, 지방 자치 단체, 공공 기관, 기업 등이 자금을 빌리면서 원금과 이자의 지급을 약속하고 발행하는 차용 증서이다. 채권을 보유한 사람은 발행자에게 돈을 빌려준 채권자이다. 채권에서는 이자 수익을 기대할 수 있으며, 만기 전에 매매하여 시세 차익을 얻을 수도 있다.",
"주식회사가 주식을 새로 발행하여 자금을 조달하면 자본금이 증가한다. 채권을 발행하여 자금을 빌리면 부채가 증가한다.\n\n이미 발행된 주식이나 채권을 투자자끼리 사고파는 것은 새로운 발행과 다르다. 이 경우 매수자가 낸 돈은 매도자에게 지급되므로 발행자에게 새 자금이 들어오는 것은 아니다."
],"A는 기업에 대한 투자자의 지분을 표시한 증서이다. B는 기업이 빌린 돈의 원금과 이자를 지급하기로 약속한 증서이다. 각 증서와 보유자의 지위를 구분해 보자.",[
"A는 투자자의 지분을 표시한 주식이며, 보유자는 주주이다.","B는 원금과 이자 지급을 약속한 채권이며, 보유자는 채권자이다.","새로 발행하는 경우 주식은 발행자의 자본금을, 채권은 발행자의 부채를 증가시킨다."
],"A는 주식, B는 채권이다. 주식 보유자는 주주, 채권 보유자는 채권자이다.","주식과 채권은 모두 시세 차익을 기대할 수 있다. 주식에서는 배당을, 채권에서는 이자를 기대할 수 있다는 차이가 있다.","채권은 원금과 이자의 지급을 약속한 증서이지만, 발행자의 지급 능력에 따라 손실 위험이 달라질 수 있다.",{q:"원금과 이자 지급을 약속한 차용 증서를 보유한 사람의 지위는?",o:['주주','채권자'],a:1,why:"채권을 보유한 사람이므로 채권자이다. 주식을 보유한 주주와 구별된다."},['F88','F89']);
addLesson41(8,3,"이자·배당·시세 차익과 총손익","금융 자산의 수익 형태를 구별하고 총손익을 계산해 보자.",[
"예금과 채권에서는 이자 수익을, 주식에서는 배당 수익을 기대할 수 있다. 배당은 주식회사가 얻은 수익 중 일부를 지분에 따라 주주에게 나누어 주는 것이다. 주식과 채권은 매매를 통해 시세 차익도 얻을 수 있다.",
"자산을 산 가격보다 높은 가격에 팔면 시세 차익을 얻고, 낮은 가격에 팔면 매매 손실이 발생한다. 매도 대금에는 처음 투자한 금액도 포함되므로 매도 대금 전체가 이익은 아니다.\n\n매매 손익 = 매도 대금 − 매수 대금",
"주식의 총손익을 구할 때에는 매매 손익에 배당 수익을 더한다. 주당 배당금이 2이고 보유 주식이 3주라면 배당 총액은 2×3=6이다. 매매 손익도 주당 가격 차이에 주식 수를 곱하여 구한다. 세금이나 수수료가 제시되었다면 그 금액을 비용으로 반영한다."
],"주식 2주를 주당 50에 사서 주당 56에 팔았다. 배당은 주당 1이며 다른 비용은 없다. 총이익을 구해 보자.",[
"매수 대금은 50×2=100, 매도 대금은 56×2=112이다.","매매 차익은 매도 대금에서 매수 대금을 뺀 112−100=12이다.","배당 총액은 1×2=2이다. 매매 차익에 배당을 더하면 총이익은 12+2=14이다."
],"매도 대금은 112이지만, 매매 차익과 배당을 합한 총이익은 14이다.","주당 금액과 전체 보유 주식에 대한 금액을 구별한다. 주당 가격 차이와 주당 배당금에는 각각 주식 수를 곱한다.","배당을 받았더라도 매매 손실이 더 크면 총손익은 음(-)의 값이 될 수 있다.",{q:"주식 1주를 80에 사서 75에 팔고 배당 2를 받았다. 총손익은 얼마인가?",o:['−5','−3','2'],a:1,why:"매매 손익은 75−80=−5이다. 배당 2를 더하면 총손익은 −3이다."},['F88','F89']);
addLesson41(9,1,"자산 관리의 세 가지 원칙","안전성·수익성·유동성의 의미와 차이를 알아보자.",[
"자산 관리는 안정적인 경제생활을 위해 자산의 취득, 보유, 처분을 합리적으로 선택하는 과정이다. 자산을 관리할 때에는 다음의 원칙을 고려한다.\n\n① 안전성: 투자한 자산의 가치가 보호될 수 있는 정도\n② 수익성: 자산의 가치 상승이나 이자 등의 수익을 기대할 수 있는 정도\n③ 유동성: 보유한 자산을 쉽게 현금으로 바꿀 수 있는 정도",
"자산을 쉽게 팔 수 있다는 것과 손실 없이 팔 수 있다는 것은 다르다. 바로 매도할 수 있어도 가격이 크게 떨어질 수 있다면 유동성은 높지만 안전성은 낮을 수 있다. 반대로 받을 금액이 정해져 있어도 필요한 날짜까지 현금화할 수 없다면 당장의 지출에 쓰기 어렵다.",
"일반적으로 수익성과 안전성은 상충 관계에 있다. 높은 수익을 기대할 수 있는 자산은 원금 손실의 위험도 큰 편이고, 원금 손실의 위험이 낮은 자산에서는 높은 수익을 기대하기 어렵다. 따라서 자금을 어디에 사용할지와 언제 필요한지를 고려하여 자산을 선택한다."
],"A는 오늘 현금화할 수 있지만 금액이 변동한다. B는 금액이 고정되어 있으나 한 달 뒤에만 찾을 수 있다. 내일 돈이 필요할 때 두 자산의 어떤 특성을 고려해야 하는가?",[
"A를 오늘 현금화할 수 있다는 것은 유동성에 관한 정보이다.","B의 금액이 고정되어 있다는 것은 가치에 관한 정보이고, 한 달 뒤에만 찾을 수 있다는 것은 인출 시점에 관한 정보이다.","내일 자금을 사용하려면 그 전에 현금화할 수 있어야 하며, 실제로 받을 금액도 필요한 지출액 이상이어야 한다."
],"현금화할 수 있는 시점과 실제로 받을 금액을 함께 살펴야 한다.","가치의 보호는 안전성, 수익에 대한 기대는 수익성, 현금화의 용이성은 유동성이다.","",{q:"자산을 짧은 시간 안에 쉽게 매도할 수 있다는 것은 어떤 특성인가?",o:['유동성','배당률','원금 보장'],a:0,why:"쉽게 현금으로 바꿀 수 있는 정도인 유동성에 관한 설명이다."},['F89','F90']);
addLesson41(9,2,"펀드·보험·연금","펀드·보험·연금의 목적과 특징을 구분해 보자.",[
"펀드는 전문 기관이 투자자들의 자금을 모아 운용하고 그 결과에 따라 수익을 돌려주는 간접 투자 상품이다. 전문가가 투자를 대신한다는 장점이 있다. 다만 운용 결과에 따라 수익이 달라지므로 원금 손실이 발생할 수 있다.",
"보험은 미래의 위험에 대비하여 평소에 보험료를 내고 사고가 발생하면 보험금을 받는 금융 상품이다. 수익을 최대한 늘리기보다 사고에 따른 손실을 줄이는 데 목적이 있다. 가입자가 내는 돈은 보험료이고, 사고 발생 시 약정에 따라 받는 돈은 보험금이다.",
"연금은 노후 생활의 안정을 위해 일정 금액을 적립하고 노령이나 은퇴 시 약속한 금액을 받는 금융 상품 또는 제도이다. 공적 연금, 퇴직 연금, 개인 연금 등이 있다. 연금은 노후에 필요한 소득을 마련하는 데 목적이 있다."
],"A는 전문 기관이 투자자들의 자금을 모아 운용한다. B는 사고로 인한 손실에 대비한다. C는 은퇴 이후의 생활 안정을 준비한다. 각각 어떤 금융 자산에 해당하는가?",[
"A는 전문 기관이 자금을 모아 운용하는 펀드이다.","B는 사고로 인한 손실에 대비하는 보험이다.","C는 노후 생활의 안정을 위한 연금이다."
],"A는 펀드, B는 보험, C는 연금이다.","간접 투자는 펀드, 사고 손실에 대한 대비는 보험, 노후 소득 마련은 연금과 관련된다.","",{q:"펀드의 특징으로 옳은 것은?",o:["전문가가 운용하므로 원금 손실이 발생하지 않는다.","전문가가 운용하더라도 원금 손실이 발생할 수 있다."],a:1,why:"펀드의 수익은 운용 결과에 따라 달라지므로 원금 손실이 발생할 수 있다."},['F89']);
addLesson41(9,3,"분산 투자와 전체 수익률","투자 금액을 고려하여 전체 손익을 구해 보자.",[
"분산 투자는 자금을 여러 금융 상품에 나누어 투자하는 것이다. 안전성과 수익성의 상충 관계를 고려하여 투자 목적과 기간, 각 자산의 특성에 맞게 자금을 배분한다. 보유한 금융 자산의 목록을 포트폴리오라고 한다.",
"여러 자산에 투자했을 때의 전체 손익은 각 자산의 투자 금액과 수익률을 이용하여 구한다. 투자 금액이 많은 자산의 수익률 변화는 전체 손익에 더 큰 영향을 준다. 따라서 투자 금액이 서로 다르면 수익률의 단순 평균을 전체 수익률로 사용할 수 없다.",
"자산별 최종 금액을 모두 더한 뒤 전체 투자 원금을 빼면 총손익이다. 총손익을 전체 원금으로 나누면 전체 수익률을 구할 수 있다.\n\n총손익 = 최종 금액의 합 − 투자 원금의 합\n전체 수익률 = 총손익 ÷ 투자 원금의 합 × 100\n\n분산 투자에도 손실 가능성은 남아 있다. 여러 자산의 가치가 함께 하락하면 전체 자산의 가치도 줄어들 수 있다."
],"A에 80, B에 20을 투자하였다. 어느 상황에서 A의 수익률은 +10%, B의 수익률은 −20%이며 다른 비용은 없다. 전체 최종 금액과 총손익을 구해 보자.",[
"A의 최종 금액은 80×1.1=88이다.","B의 최종 금액은 20×0.8=16이다.","최종 금액의 합은 88+16=104이다. 전체 원금 100을 빼면 총손익은 +4이다."
],"전체 최종 금액은 104, 총손익은 +4이다. 투자 금액이 다르므로 두 수익률의 단순 평균인 −5%를 적용하지 않는다.","투자 비중이 다르면 각 투자 금액에 해당 수익률을 적용한 뒤 합산한다.","",{q:"분산 투자에 대한 설명으로 옳은 것은?",o:["여러 자산에 투자하면 손실이 완전히 사라진다.","목적·기간·위험을 고려하여 나누어 투자하되 손실 가능성도 고려해야 한다."],a:1,why:"분산 투자를 해도 각 자산의 운용 결과에 따라 전체 자산에서 손실이 발생할 수 있다."},['F89','F90']);
addLesson41(10,1,"금융 생활 설계와 자금의 사용 시점","재무 목표와 수입·지출 시점을 고려하여 자금 계획을 세워 보자.",[
"금융 생활 설계는 생애 주기별 과업을 고려하여 재무 목표를 정하고, 이를 달성하기 위해 자산을 효율적으로 관리하는 것이다. 재무 목표 설정, 재무 상태 분석, 재무 계획 수립, 실행, 평가 및 수정의 순서로 이루어진다.",
"재무 상태를 분석할 때에는 현재의 자산과 부채, 수입과 지출, 이용 가능한 자원을 파악한다. 전체 수입이 충분해도 지출일 전에 돈이 들어오지 않으면 자금이 부족할 수 있다. 따라서 금액과 함께 수입일과 지출일도 고려해야 한다.",
"생애 주기별 수입·지출 곡선은 삶의 단계에 따라 수입과 지출이 달라지는 모습을 나타낸다. 개인의 소득, 가족 상황, 목표가 다르면 필요한 자금과 마련 방법도 달라진다. 금융 생활을 설계할 때에는 자신의 현재 여건과 앞으로 필요한 자금을 함께 고려한다."
],"6개월 동안 매월 말에 200씩 지출한다. 수입 1,200은 6개월째 월초에 한 번 들어온다. 남은 돈은 다음 달에 사용할 수 있지만 대출을 받거나 지출을 미룰 수는 없다. 처음에 준비해야 할 최소 자금을 구해 보자.",[
"수입은 6개월째 월초에 들어오므로 첫 다섯 달의 지출은 초기 자금으로 충당해야 한다.","첫 다섯 달의 지출 합계는 200×5=1,000이다.","처음에 1,000을 준비하면 첫 다섯 달의 지출을 감당할 수 있다. 6개월째 말의 지출은 그달 월초에 들어온 수입 1,200으로 낼 수 있다."
],"모든 지출을 제때 하려면 초기 자금이 최소 1,000 필요하다.","수입이 들어오기 전에 발생하는 지출은 초기 자금으로 준비해야 한다. 날짜순으로 잔액을 계산하면 필요한 금액을 구할 수 있다.","",{q:"재무 상태를 분석할 때 살펴야 할 항목은?",o:['자산·부채·수입·지출','목표 금액만'],a:0,why:"현재의 자산과 부채, 수입과 지출을 파악해야 이용 가능한 자금과 부담해야 할 금액을 알 수 있다."},['F90']);
addLesson41(10,2,"단리와 복리","이자 계산 방식에 따른 원리금의 차이를 알아보자.",[
"단리는 기간마다 처음 원금에 대해서만 이자를 계산하는 방식이다. 원금과 이자율이 일정하면 매 기간 발생하는 이자도 같다. 원금 100을 연 10% 단리로 맡기면 해마다 이자는 10씩 발생한다.",
"복리는 원금에 이전 기간의 이자를 더한 금액을 기준으로 다음 기간의 이자를 계산하는 방식이다. 첫 기간에는 단리와 이자가 같지만, 다음 기간부터는 이미 발생한 이자에도 이자가 붙는다. 연복리라면 해마다 계산한 원리금이 다음 해의 이자 계산 기준이 된다.",
"원금이 P, 한 기간의 이자율이 r, 기간 수가 n이고 중간 입출금과 별도 비용이 없다면 다음과 같이 계산한다.\n\n단리 원리금 = P(1+rn)\n복리 원리금 = P(1+r)ⁿ\n\n원리금은 원금과 이자를 합한 금액이다. 이자만 구하려면 원리금에서 처음 원금을 뺀다."
],"원금 100을 연 10%의 이자율로 2년 동안 맡긴다. 이자는 매년 말 계산하며 중간 입출금, 세금, 수수료는 없다. 단리와 복리의 원리금 및 이자를 비교해 보자.",[
"단리는 매년 원금 100에 대한 이자 10이 발생한다. 2년 후 원리금은 100+10+10=120이다.","복리는 1년 말에 원리금이 110이 되고, 2년째에는 110에 이자가 붙는다. 2년 말 원리금은 110×1.1=121이다.","원리금에서 원금 100을 빼면 이자는 단리 20, 복리 21이다."
],"2년 후 원리금은 단리 120, 복리 121이며, 이자는 각각 20과 21이다.","처음 원금에만 이자가 붙으면 단리, 이전 기간의 이자까지 합한 금액에 이자가 붙으면 복리이다.","이자율과 기간의 단위를 맞춘다. 연 이자율을 매달 그대로 적용하지 않는다.",{q:"원금 100을 연 10% 복리로 2년 동안 맡겼을 때 이자는 얼마인가?",o:['121','21','120'],a:1,why:"원리금은 100×1.1²=121이다. 여기서 원금 100을 빼면 이자는 21이다."},['F91']);
addLesson41(10,3,"납입 시점과 예치 기간","각 납입금의 예치 기간을 고려하여 만기 금액을 계산해 보자.",[
"여러 번 납입한 돈을 같은 날 찾더라도 예치 기간은 서로 다를 수 있다. 첫해 초에 맡긴 돈은 둘째 해 초에 맡긴 돈보다 더 오래 예치된다. 따라서 납입금마다 이자가 붙는 기간을 따로 계산해야 한다.",
"이자를 매년 말 계산하는 연복리에서 첫해 초에 납입하고 둘째 해 말에 찾으면 예치 기간은 2년이다. 둘째 해 초에 납입하고 그해 말에 찾으면 1년이다. 각 납입금에 해당 기간의 복리를 적용한 뒤 원리금을 더하면 만기 총액을 구할 수 있다.",
"만기 총액에는 납입한 원금과 이자가 모두 포함된다. 따라서 이자만 구하려면 만기 총액에서 전체 납입 원금을 뺀다. 나중에 납입한 돈에도 처음부터 이자가 붙었다고 계산하면 이자를 실제보다 크게 구하게 된다."
],"연 10% 복리로 첫해 초에 100, 둘째 해 초에 100을 납입하고 둘째 해 말에 찾는다. 이자는 매년 말 계산하며 다른 거래와 비용은 없다. 만기 총액과 이자를 구해 보자.",[
"첫 번째 납입금은 2년 동안 예치되므로 원리금은 100×1.1²=121이다.","두 번째 납입금은 1년 동안 예치되므로 원리금은 100×1.1=110이다.","두 원리금을 합하면 만기 총액은 121+110=231이다.","전체 원금 200을 빼면 이자는 231−200=31이다."
],"만기 총액은 231, 이자는 31이다. 전체 원금 200에 모두 2년 복리를 적용한 242는 잘못된 계산이다.","각 납입금의 납입일에서 인출일까지 이자가 몇 번 계산되는지 센 뒤 원리금을 구한다.","월초·월말 등 납입일이 달라지면 예치 기간도 달라질 수 있다. 문제에 제시된 납입일과 이자 계산일을 적용한다.",{q:"첫해 초와 둘째 해 초에 납입한 돈을 둘째 해 말에 찾는다. 각 납입금의 예치 기간은?",o:["둘 다 2년이다.","각각 2년과 1년이다.","둘 다 1년이다."],a:1,why:"첫 번째 납입금은 첫해와 둘째 해에, 두 번째 납입금은 둘째 해에 이자가 붙는다."},['F88','F91']);
addLesson41(11,1,"금리·물가와 화폐의 구매력","금리와 물가의 의미를 이해하고 이자와 구매 가능 수량을 계산해 보자.",[
"금리는 이자를 원금에 대한 비율로 나타낸 것으로 이자율이라고도 한다. 원금과 기간, 이자 계산 방식이 같다면 금리가 높을수록 이자 금액이 커진다. 금리가 3%에서 5%로 올랐다면 2%포인트 상승한 것이다.",
"물가는 여러 재화와 서비스의 가격을 일정한 기준에 따라 평균한 종합적인 가격 수준이다. 물가가 상승하면 같은 돈으로 살 수 있는 재화와 서비스의 양이 줄어들므로 화폐의 실질 가치가 하락한다. 반대로 물가가 하락하면 같은 돈으로 더 많은 재화와 서비스를 살 수 있다.",
"금리가 높아지면 같은 원금의 대출에 대한 이자 부담이 커질 수 있다. 물가가 오르면 금융 자산으로 얻은 금액의 구매력이 줄어들 수 있다. 이처럼 금리와 물가의 변화는 개인의 저축·투자·대출에 관한 결정에 영향을 준다. 구체적인 금액은 주어진 원금, 기간, 가격 등의 조건으로 계산한다."
],"예산 10,000원으로 같은 상품을 구입한다. 상품 가격이 1,000원에서 1,250원으로 올랐으며, 상품은 정수 개만 살 수 있다. 구매 가능한 수량은 어떻게 달라지는가?",[
"가격이 오르기 전에는 10,000÷1,000=10개를 살 수 있다.","가격이 오른 뒤에는 10,000÷1,250=8개를 살 수 있다.","같은 예산으로 살 수 있는 수량이 10개에서 8개로 줄어든다."
],"예산은 그대로이지만 상품 가격이 올라 구매 가능한 수량은 10개에서 8개로 감소한다.","이자는 원금과 이자율, 기간을 이용하여 계산한다. 구매 가능 수량은 예산을 상품 한 개의 가격으로 나누어 구한다.","예제는 한 상품의 가격 변화를 다룬다. 개별 상품의 가격과 여러 상품의 종합적인 가격 수준인 물가는 구별한다.",{q:"원금 1,000만 원을 연 5% 단리로 1년 동안 맡겼을 때 이자는 얼마인가?",o:['5만 원','50만 원','1050만 원'],a:1,why:"1,000×0.05=50이므로 이자는 50만 원이다. 원금과 이자를 합한 원리금은 1,050만 원이다."},['F91']);
addLesson41(11,2,"환율과 원화 기준 손익","매수·매도 시점의 환율을 적용하여 원화 기준 손익을 구해 보자.",[
"환율은 한 나라의 통화와 다른 나라 통화 사이의 교환 비율이다. 원/달러 환율은 1달러와 교환할 수 있는 원화 금액을 나타낸다. 달러를 원화로 환산할 때에는 달러 금액에 원/달러 환율을 곱한다. 원화로 살 수 있는 달러 금액은 원화 금액을 원/달러 환율로 나누어 구한다.",
"원/달러 환율이 상승하면 같은 달러 금액을 원화로 바꿀 때 더 많은 원화를 받는다. 반대로 달러를 사야 하는 사람은 더 많은 원화를 지출해야 한다. 환율이 하락하면 같은 달러의 원화 환산액이 작아진다.",
"외화 자산의 가격과 환율이 함께 달라졌다면 매수할 때 지출한 원화 금액과 매도한 뒤 받은 원화 금액을 각각 계산한다. 두 금액의 차이가 원화 기준 매매 손익이다. 자산의 달러 가격이 하락하더라도 환율 상승의 영향으로 원화 기준 이익이 발생할 수 있다."
],"자산 1개를 100달러에 매수하였다. 매수 당시 원/달러 환율은 1달러당 1,200원이었다. 이후 이 자산을 90달러에 매도하였으며, 매도 당시 환율은 1달러당 1,400원이었다. 별도의 비용과 수익은 없다. 원화 기준 손익을 구해 보자.",[
"매수할 때 100달러를 마련하려면 1달러당 1,200원이 필요했다. 따라서 지출한 원화 금액은 100×1,200=120,000원이다.","매도 대금 90달러를 1달러당 1,400원에 원화로 바꾸면 90×1,400=126,000원을 받는다.","받은 금액에서 지출한 금액을 빼면 126,000−120,000=6,000원이다. 따라서 원화 기준으로 6,000원의 이익이 발생하였다."
],"달러 가격은 하락했지만 환율 상승의 영향으로 원화 기준 이익 6,000원이 발생하였다.","매수 금액에는 매수 당시의 환율을, 매도 금액에는 매도 당시의 환율을 적용한다.","수수료·배당 등 별도의 비용이나 수익이 제시되었다면 해당 금액과 환산 시점도 반영한다.",{q:"100달러를 1달러당 1,200원의 환율로 바꾸면 몇 원인가?",o:['120000원','1200원','100/1200원'],a:0,why:"100×1,200=120,000원이므로 12만 원이다."},['F91']);
addLesson41(11,3,"경제 환경의 변화와 금융 의사 결정","금리·물가·환율과 사회적 변화가 금융 선택에 미치는 영향을 알아보자.",[
"금융 의사 결정은 개인의 재무 목표뿐 아니라 경제적·정치적·사회적 환경의 영향을 받는다. 금리, 물가, 환율은 대표적인 경제적 요인이다. 전쟁, 팬데믹, 금융 위기와 같은 사회적 변화도 자산의 선택과 관리에 영향을 줄 수 있다.",
"경제 상황에 대한 불확실성이 커지면 높은 수익보다 자산의 안전성과 유동성을 중시하는 경향이 나타날 수 있다. 자금을 언제 사용해야 하는지, 어느 정도의 손실을 감당할 수 있는지에 따라서도 선택이 달라진다. 따라서 금융 선택에는 경제 환경과 개인의 여건이 함께 작용한다.",
"같은 환율 변화라도 달러를 받는 사람과 지급하는 사람에게 미치는 영향은 다르다. 원/달러 환율이 오르면 같은 달러를 원화로 바꾸는 사람은 더 많은 원화를 받는다. 달러 대금을 마련하는 사람은 더 많은 원화가 필요하므로 지출 부담이 커진다."
],"원/달러 환율이 1달러당 1,000원에서 1,100원으로 올랐다. 갑은 100달러를 받아 원화로 바꾸고, 을은 100달러를 마련해야 한다. 다른 조건이 같을 때 두 사람에게 어떤 변화가 생기는가?",[
"갑이 받는 원화는 100×1,000=100,000원에서 100×1,100=110,000원으로 늘어난다.","을이 100달러를 마련하는 데 지출할 원화도 100,000원에서 110,000원으로 늘어난다.","갑은 받는 금액이 증가하지만 을은 지출 부담이 증가한다."
],"환율 상승으로 갑이 받는 원화 금액과 을이 지출할 원화 금액이 모두 증가한다.","환율 변화 문제에서는 각 경제 주체가 외화를 받는지, 외화를 지급해야 하는지 구분한다.","",{q:"금융 위기 때 안전성을 중시하는 경향이 나타날 수 있다는 설명으로 알 수 있는 것은?",o:["모든 자산의 가격 상승이 보장된다.","경제 상황의 변화가 금융 선택에 영향을 줄 수 있다."],a:1,why:"경제적 불확실성의 증가는 자산 선택에 영향을 줄 수 있다. 다만 특정 자산의 가격 상승이 보장되는 것은 아니다."},['F91']);
addLesson41(12,1,"생산 조건의 차이와 무역","나라별 생산 조건의 차이가 무역의 원인이 되는 이유를 알아보자.",[
"국제 분업은 각 나라가 무역에 유리한 재화나 서비스를 특화하여 생산하는 것이다. 무역은 각 나라가 생산한 재화와 서비스 등을 다른 나라와 사고파는 국제 거래이다. 나라별로 생산 조건이 다르기 때문에 같은 상품을 생산하더라도 비용과 효율에 차이가 생긴다.",
"각 나라가 보유한 자원의 양과 질, 기후·지형·토양 등의 자연환경은 서로 다르다. 노동·자본·토지와 같은 생산 요소의 보유 정도와 기술 수준에도 차이가 있다. 이러한 차이는 생산할 수 있는 상품의 종류와 생산 비용에 영향을 준다.",
"무역을 통해 자국에서 생산되지 않는 재화를 구하고 다양한 상품과 서비스를 소비할 수 있다. 국내에서 생산할 수 있는 상품이라도 외국에서 더 낮은 비용으로 생산한다면 수입하는 것이 유리할 수 있다. 시장이 넓어져 생산량이 늘면 규모의 경제를 얻을 수도 있다."
],"A 집단은 재료가 풍부하지만 도구가 부족하다. B 집단은 도구를 가지고 있지만 재료가 부족하다. 두 집단이 교환을 통해 얻을 수 있는 이익을 설명해 보자.",[
"A 집단에는 도구가, B 집단에는 재료가 부족하다.","A 집단의 재료와 B 집단의 도구나 기술 서비스를 서로 교환할 수 있다.","교환을 통해 각 집단은 생산에 필요한 재료나 도구를 확보할 수 있다."
],"두 집단은 교환을 통해 자신에게 부족한 재료나 도구를 확보할 수 있다.","부존자원, 자연환경, 생산 요소, 기술 수준의 차이는 나라별 생산 비용의 차이를 가져올 수 있다.","국가가 무역으로 이익을 얻더라도 그 이익이 국내의 모든 사람에게 똑같이 돌아가는 것은 아니다.",{q:"같은 재료를 가공하는 방법의 차이는 무엇과 가장 직접적으로 관련되는가?",o:['기술 수준','환율만','매몰 비용만'],a:0,why:"재료를 가공하는 방법은 생산 기술에 해당하므로 기술 수준의 차이와 관련된다."},['T103']);
addLesson41(12,2,"생산 요소와 최대 생산량","재료와 노동의 보유량을 고려하여 최대 생산량을 구해 보자.",[
"제품을 생산하려면 필요한 생산 요소를 모두 투입해야 한다. 재료가 충분해도 노동이 부족하면 원하는 수량을 생산하기 어렵다. 아래에서는 제품 한 개에 필요한 재료와 노동의 양이 일정하고, 제품은 정수 개만 생산할 수 있다고 가정한다.",
"제품 한 개에 재료 2와 노동 1이 필요한데 재료는 8, 노동은 3을 가지고 있다고 하자. 재료는 제품 4개분이지만 노동은 3개분이다. 재료와 노동이 모두 필요하므로 최대 생산량은 3개이다. 재료가 남더라도 노동이 부족하면 더 생산할 수 없다.",
"부족한 생산 요소를 추가로 확보하면 생산량을 늘릴 수 있다. 반면 이미 충분한 요소만 늘리면 다른 요소의 부족으로 생산량이 그대로일 수 있다. 각 요소로 생산할 수 있는 수량을 구한 뒤 가장 작은 수량을 찾으면 최대 생산량을 알 수 있다."
],"제품 한 개를 생산하는 데 재료 3과 노동 2가 필요하다. 보유한 재료는 18, 노동은 10이며 제품은 정수 개만 생산한다. 최대 생산량과 생산 후 남는 재료·노동을 구해 보자.",[
"재료만 고려하면 18÷3=6개를 생산할 수 있다.","노동만 고려하면 10÷2=5개를 생산할 수 있다.","두 요소가 모두 필요하므로 최대 생산량은 더 작은 값인 5개이다.","제품 5개를 생산하면 재료는 18−3×5=3이 남고 노동은 10−2×5=0이 남는다."
],"최대 생산량은 5개이며, 생산 후 재료는 3이 남고 노동은 모두 사용된다.","요소별 보유량을 제품 한 개에 필요한 양으로 나눈 뒤, 생산 가능한 수량 중 가장 작은 값을 고른다.","",{q:"재료는 제품 6개분, 노동은 5개분이며 다른 제약은 없다. 두 요소가 모두 필요할 때 최대 생산량은?",o:["최대 11개","최대 6개","최대 5개"],a:2,why:"노동이 5개분뿐이므로 최대 5개를 생산할 수 있다."},['T103']);
addLesson41(12,3,"규모의 경제와 평균 생산 단가","총비용과 평균 생산 단가를 구별하여 규모의 경제를 판단해 보자.",[
"규모의 경제는 생산 규모가 커지거나 생산량이 늘어날수록 평균 생산 단가가 하락하는 현상이다. 평균 생산 단가는 총비용을 생산량으로 나눈 값으로, 제품 한 단위를 생산하는 데 평균적으로 드는 비용을 나타낸다.",
"생산량이 증가하면 총비용이 늘더라도 평균 생산 단가는 낮아질 수 있다. 100개를 생산할 때 총비용이 200이고 200개를 생산할 때 총비용이 300이면, 평균 단가는 각각 2와 1.5이다. 총비용은 증가했지만 한 개당 평균 비용은 감소하였다.",
"생산량이 100개에서 200개로 늘어난 경우를 다시 살펴보자. 총비용은 200에서 300으로 늘었지만 생산량은 두 배가 되었다. 그 결과 한 개당 비용은 2에서 1.5로 줄었다. 규모의 경제는 이처럼 총비용이 아니라 평균 생산 단가의 변화로 파악한다."
],"생산량이 100개일 때 총비용은 250이고, 200개일 때 총비용은 400이다. 평균 생산 단가를 구하고 규모의 경제가 나타나는지 판단해 보자.",[
"100개를 생산할 때의 평균 단가는 250÷100=2.5이다.","200개를 생산할 때의 평균 단가는 400÷200=2이다.","생산량이 늘면서 평균 단가가 2.5에서 2로 낮아졌으므로 규모의 경제가 나타난다."
],"총비용은 증가했지만 평균 생산 단가는 하락하였으므로 규모의 경제가 나타난다.","평균 생산 단가 = 총비용 ÷ 생산량이다. 생산량이 증가할 때 이 값이 낮아지는지 비교한다.","",{q:"총비용이 증가했다는 사실만으로 규모의 경제가 나타나지 않았다고 할 수 있는가?",o:['그렇다.',"아니다. 생산량을 고려하여 평균 단가를 구해야 한다."],a:1,why:"규모의 경제는 총비용이 아니라 평균 생산 단가가 하락하는 현상이다."},['T103']);
addLesson41(13,1,"생산량표와 투입량표의 기회비용","표의 종류에 따라 생산의 기회비용을 구해 보자.",[
"최대 생산량표는 자원을 모두 한 재화에 투입했을 때 생산할 수 있는 양을 나타낸다. 생산 가능 곡선이 직선이고 X재를 최대 12개 또는 Y재를 최대 6개 생산할 수 있다면, X재 12개를 생산하기 위해 Y재 6개를 포기해야 한다. 따라서 X재 1개 생산의 기회비용은 Y재 6/12개, 즉 1/2개이다.",
"단위당 투입량표는 재화 한 개를 생산하는 데 필요한 생산 요소의 양을 나타낸다. X재 1개에 노동 2, Y재 1개에 노동 4가 필요하다면 X재에 투입한 노동 2로 Y재를 2/4개 생산할 수 있다. 따라서 X재 1개 생산의 기회비용은 Y재 1/2개이다.",
"생산량표와 투입량표는 서로 다른 양을 나타내므로 기회비용을 구할 때 나누는 방향이 다르다.\n\n최대 생산량표: X재 1개 생산의 기회비용 = Y재 최대량 ÷ X재 최대량\n단위당 투입량표: X재 1개 생산의 기회비용 = X재 투입량 ÷ Y재 투입량\n\n두 경우 모두 X재를 생산하면서 포기하는 Y재의 양으로 답한다."
],"A국의 총노동량은 48시간이다. X재 1개를 생산하는 데 2시간, Y재 1개를 생산하는 데 4시간이 필요하다. 최대 생산량과 단위당 노동시간을 각각 이용하여 X재 1개 생산의 기회비용을 구해 보자.",[
"모든 노동을 한 재화에 투입하면 X재는 48÷2=24개, Y재는 48÷4=12개를 생산할 수 있다.","최대 생산량으로 구하면 X재 1개 생산의 기회비용은 Y재 12/24=1/2개이다.","X재 1개에 쓰이는 2시간으로 Y재를 2/4개 생산할 수 있다. 따라서 노동시간으로 구한 기회비용도 Y재 1/2개이다.","같은 생산 조건을 두 방식으로 계산했으므로 결과가 일치한다."
],"X재 1개 생산의 기회비용은 Y재 1/2개이다.","생산하려는 재화에 사용한 자원으로 다른 재화를 얼마나 생산할 수 있는지 생각하면 기회비용을 구할 수 있다.","분수의 값이 같아도 재화 단위가 다르면 답의 뜻이 달라진다. X재 생산의 기회비용은 포기한 Y재의 수량으로 표시한다.",{q:"X재 1개에 노동 3, Y재 1개에 노동 6이 필요하다. X재 1개 생산의 기회비용은?",o:["Y재 2개","Y재 1/2개"],a:1,why:"X재에 투입한 노동 3으로 Y재를 3/6=1/2개 생산할 수 있다."},['T103','T104','A86']);
addLesson41(13,2,"생산 가능 곡선과 생산 조합","주어진 자원으로 생산할 수 있는 두 재화의 조합을 구해 보자.",[
"생산 가능 곡선은 보유한 자원과 기술을 모두 활용하여 최대로 생산할 수 있는 두 재화의 조합을 나타낸다. 두 축의 절편은 한 재화만 생산할 때의 최대 생산량이다. X재 최대량이 12개, Y재 최대량이 6개라는 것은 각각 한 재화만 생산할 때의 수량이지 두 수량을 동시에 생산할 수 있다는 뜻은 아니다.",
"생산 가능 곡선이 직선이면 생산에 투입한 자원의 비율에 따라 생산량이 달라진다. X재를 최대 생산량의 1/3만큼 생산하면 전체 자원의 1/3을 X재 생산에 사용한다. 남은 자원 2/3으로는 Y재 최대 생산량의 2/3을 생산할 수 있다.",
"직선인 생산 가능 곡선에서는 ‘X재 생산량÷X재 최대량’과 ‘Y재 생산량÷Y재 최대량’의 합으로 생산 가능 여부를 판단할 수 있다. 합이 1이면 곡선 위의 조합이고, 1보다 작으면 곡선 안쪽의 조합이다. 합이 1보다 크면 현재의 자원과 기술로는 생산할 수 없는 조합이다."
],"A국의 생산 가능 곡선은 직선이다. X재만 생산하면 최대 12개, Y재만 생산하면 최대 6개를 만들 수 있다. X재 4개와 함께 생산할 수 있는 Y재의 최대량을 구하고, X재 4개·Y재 2개 조합의 생산 가능 여부를 판단해 보자.",[
"X재 4개는 최대량 12개의 1/3이므로 전체 자원의 1/3을 사용한다.","남은 자원은 2/3이다. 따라서 Y재를 최대 6×2/3=4개 생산할 수 있다.","X재 4개·Y재 2개의 자원 사용 비율 합은 4/12+2/6=2/3이다. 1보다 작으므로 곡선 안쪽의 생산 가능한 조합이다."
],"X재 4개를 생산할 때 Y재는 최대 4개까지 생산할 수 있다. X재 4개·Y재 2개 조합은 생산 가능 곡선 안쪽에 있다.","X재 생산에 사용한 자원의 비율을 구한 뒤 남은 비율에 Y재 최대량을 곱한다.","이 계산은 생산 가능 곡선이 직선이라는 조건에 따른다. 교역 후 소비할 수 있는 조합과 자국에서 생산할 수 있는 조합도 구별한다.",{q:"X재를 최대 12개 또는 Y재를 최대 6개 생산할 수 있는 직선 모형에서, X재 12개와 Y재 6개를 동시에 생산할 수 있는가?",o:["생산 가능 곡선 위의 조합이므로 가능하다.","현재의 자원과 기술로는 생산할 수 없다."],a:1,why:"각 최대량을 동시에 생산하려면 자원 사용 비율의 합이 12/12+6/6=2가 되어 보유 자원을 초과한다."},['T104','A86']);
addLesson41(13,3,"절대 우위와 비교 우위","생산 비용과 기회비용을 기준으로 두 우위를 구별해 보자.",[
"절대 우위는 다른 생산자보다 같은 양의 재화를 더 적은 비용으로 생산할 수 있는 능력이다. 같은 노동량으로 더 많은 재화를 생산할 수 있는 경우에도 절대 우위가 있다고 볼 수 있다. 최대 생산량으로 비교할 때에는 두 나라가 투입하는 생산 요소의 양이 같아야 한다.",
"비교 우위는 다른 생산자보다 같은 양의 재화를 더 작은 기회비용으로 생산할 수 있는 능력이다. X재의 비교 우위를 구하려면 각 나라가 X재 1개를 생산하면서 포기하는 Y재의 양을 비교한다. 포기하는 Y재가 적은 나라가 X재 생산에 비교 우위를 가진다.",
"한 나라가 두 재화 모두 절대 우위를 가지더라도 비교 우위는 두 나라에 나뉠 수 있다. 이 경우 각 나라가 비교 우위 재화에 특화하여 교환하면 무역으로 이익을 얻을 수 있다. 절대 우위만으로 설명하기 어려운 무역도 기회비용의 차이를 통해 설명할 수 있다."
],"같은 총노동량을 투입할 때 A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 8개이다. 양국의 생산 가능 곡선은 직선이다. 절대 우위와 비교 우위를 구해 보자.",[
"A국은 같은 노동량으로 X재와 Y재를 모두 더 많이 생산할 수 있으므로 두 재화 모두 절대 우위가 있다.","X재 1개 생산의 기회비용은 A국이 Y재 12/24=1/2개, B국이 Y재 8/8=1개이다. 기회비용이 작은 A국이 X재에 비교 우위를 가진다.","Y재 1개 생산의 기회비용은 A국이 X재 24/12=2개, B국이 X재 8/8=1개이다. 기회비용이 작은 B국이 Y재에 비교 우위를 가진다."
],"A국은 두 재화 모두 절대 우위가 있다. 비교 우위는 X재에 A국, Y재에 B국이 가진다.","절대 우위는 같은 재화의 생산 비용을, 비교 우위는 같은 재화 생산의 기회비용을 비교한다.","두 나라의 생산 기회비용이 같다면 어느 한 나라가 해당 재화에 비교 우위를 가진다고 할 수 없다.",{q:"X재 1개 생산의 기회비용이 A국은 Y재 2개, B국은 Y재 3개이다. X재에 비교 우위가 있는 나라는?",o:['A','B'],a:0,why:"A국이 같은 X재 1개를 생산하면서 더 적은 Y재를 포기하므로 X재에 비교 우위가 있다."},['T103','T104','A86']);
addLesson41(14,1,"양국이 모두 이익을 얻는 교환 비율","생산의 기회비용을 이용하여 양국에 유리한 교환 비율을 구해 보자.",[
"각 나라가 비교 우위 재화에 특화하더라도 교환 비율에 따라 얻는 이익은 달라진다. 교역으로 이익을 얻으려면 직접 생산하는 것보다 유리한 조건으로 교환해야 한다. 아래에서는 두 나라가 두 재화를 생산하고, 생산 가능 곡선은 직선이며 거래 비용은 없다고 가정한다.",
"X재 1개 생산의 기회비용이 A국에서 Y재 0.5개라고 하자. A국이 X재 1개를 수출하면서 Y재를 0.5개만 받으면 직접 생산할 때와 차이가 없다. 이익을 얻으려면 X재 1개를 생산하면서 포기한 양보다 많은 Y재를 받아야 하므로 교환 비율이 0.5보다 커야 한다.",
"B국의 X재 1개 생산 기회비용이 Y재 1개라면, B국은 X재 1개를 수입하면서 Y재를 1개보다 적게 주어야 이익을 얻는다. 따라서 양국 모두 이익을 얻는 교환 비율은 X재 1개당 Y재 0.5개 초과 1개 미만이다."
],"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. X재 4개와 Y재 3개를 교환하는 비율이 양국 모두에게 유리한지 판단해 보자.",[
"X재 1개당 교환하는 Y재의 수량은 3/4=0.75개이다.","A국은 직접 생산하며 포기한 0.5개보다 많이 받고, B국은 직접 생산할 때 포기할 1개보다 적게 준다. 0.5<0.75<1이므로 양국 모두에게 유리한 비율이다.","이 비율로 실제 교환하려면 A국이 X재 4개, B국이 Y재 3개를 제공할 수 있어야 한다."
],"X재 1개당 Y재 0.75개의 교환 비율은 양국 모두에게 유리하다.","양국의 생산 기회비용과 교환 비율을 같은 재화 단위로 나타내어 비교한다.","양국 모두 이익이 0보다 커야 한다면 기회비용과 같은 경계값은 제외한다. 교환 가능한 수량도 따로 확인해야 한다.",{q:"X재 1개 생산의 기회비용이 A국은 Y재 2개, B국은 Y재 5개이다. 양국이 모두 이익을 얻는 교환 비율은?",o:['X1:Y1','X1:Y3','X1:Y6'],a:1,why:'2<3<5이다.'},['T104','A86']);
addLesson41(14,2,"교역 후 소비량과 교역의 이익","교역 후 소비량을 구하고 자급 생산보다 늘어난 이익을 계산해 보자.",[
"교역 후 소비할 수 있는 양은 자국 생산량에서 수출량을 빼고 수입량을 더하여 구한다.\n\n소비량 = 생산량 − 수출량 + 수입량\n\n두 나라만 거래하고 재고와 손실이 없다면, 재화별로 양국의 소비량을 합한 값은 양국의 총생산량과 같다.",
"교역 이익은 직접 생산했을 때와 비교하여 구한다. A국이 X재 4개를 생산하느라 Y재 2개를 포기하고, 그 X재를 수출하여 Y재 3개를 받았다면 Y재 1개만큼 이익을 얻는다. B국이 X재 4개를 직접 생산하려면 Y재 4개를 포기해야 하지만 수입할 때에는 3개만 준다면 Y재 1개를 절약한다.",
"교역을 하면 자국의 생산 가능 곡선 밖에 있는 조합을 소비할 수 있다. 이는 생산 능력이 즉시 늘어난 것이 아니라 교환을 통해 소비할 수 있는 재화의 조합이 넓어진 것이다. 교역 후 소비량과 직접 생산할 때보다 추가로 얻은 이익은 서로 다른 값이다."
],"A국은 X재 12개, B국은 Y재 4개에 특화하고 X재 4개와 Y재 3개를 교환한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 교역 후 소비량과 각국의 교역 이익을 구해 보자.",[
"A국은 X재 12개에서 4개를 수출하고 Y재 3개를 수입하므로 X재 8개·Y재 3개를 소비한다. B국은 X재 4개·Y재 1개를 소비한다.","양국의 소비량을 합하면 X재 12개·Y재 4개로 총생산량과 같다.","A국은 Y재 3개를 받고 생산의 기회비용 Y재 4×0.5=2개를 부담하므로 이익은 Y재 1개이다. B국도 직접 생산할 때 포기할 Y재 4개 대신 3개만 지급하므로 이익은 Y재 1개이다."
],"교역 후 A국은 X재 8개·Y재 3개, B국은 X재 4개·Y재 1개를 소비한다. 각국의 교역 이익은 Y재 1개이다.","소비량은 생산·수출·수입량으로 구한다. 교역 이익은 직접 생산하는 경우와 비교하여 구한다.","국가의 교역 이익이 국내의 모든 사람에게 같은 크기로 분배되는 것은 아니다.",{q:"A국이 X재 12개를 생산하여 4개를 수출하였다. 수입한 X재가 없다면 남은 X재는 몇 개인가?",o:['8','12','16'],a:0,why:"12−4=8개이다."},['T104','A86']);
addLesson41(14,3,"소비량으로 생산량과 교환 비율 구하기","교역 후 소비량을 이용하여 생산량과 교환 수량을 구해 보자.",[
"두 나라가 각자 한 재화에 완전 특화하고 재고·손실·다른 거래가 없다면, 재화별 소비량 합계가 그 재화를 생산한 나라의 생산량이다. A국이 X재만 생산했다면 양국의 X재 소비량을 더하여 A국의 생산량을 구한다.",
"완전 특화한 나라는 자신이 생산하지 않은 재화를 수입하여 소비한다. A국이 X재만 생산했다면 A국의 Y재 소비량은 Y재 수입량이다. B국이 Y재만 생산했다면 B국의 X재 소비량은 X재 수입량이다.",
"두 나라 사이에서 서로 교환한 수량을 알면 교환 비율을 구할 수 있다. X재 q개와 Y재 y개를 교환했다면 X재 1개당 Y재 y/q개를 교환한 것이다. 다만 자급 생산이나 다른 거래가 있었다면 소비량만으로 수입량을 정하기 어려울 수 있다."
],"A국은 X재, B국은 Y재에 완전 특화하였다. 교역 후 A국은 X재 18개·Y재 5개, B국은 X재 6개·Y재 7개를 소비한다. 재고·손실·다른 거래는 없다. 생산량과 교환 비율을 구해 보자.",[
"X재 소비량의 합은 18+6=24개이다. X재는 A국만 생산하므로 A국의 생산량은 24개이다.","Y재 소비량의 합은 5+7=12개이다. Y재는 B국만 생산하므로 B국의 생산량은 12개이다.","A국이 소비한 Y재 5개는 수입량이고, B국이 소비한 X재 6개도 수입량이다.","따라서 X재 6개와 Y재 5개를 교환하였다. X재 1개당 교환 비율은 Y재 5/6개이다."
],"A국은 X재 24개, B국은 Y재 12개를 생산하였다. 교환 비율은 X재 6개 대 Y재 5개이다.","완전 특화한 경우에는 생산하지 않은 재화의 소비량으로 수입량을 구한다.","",{q:"두 나라만 거래하고 재고와 손실이 없다면 교역 후 재화별 소비량의 합계는?",o:["양국의 총생산량과 같다.","양국의 총생산량보다 항상 크다."],a:0,why:"교역은 이미 생산된 재화가 나라 사이에서 이동하는 것이므로 전체 수량은 변하지 않는다."},['A86','T104']);
addLesson41(15,1,"무역 확대의 영향","무역 확대가 소비자와 생산자, 산업과 고용에 미치는 영향을 알아보자.",[
"무역이 확대되면 소비자는 다양한 상품과 서비스를 구입할 수 있다. 기업은 해외 시장에 상품을 판매하여 생산을 늘릴 수 있으며, 이에 따라 일자리가 생길 수 있다. 또한 해외 기업과 경쟁하거나 기술을 도입하는 과정에서 기술 수준과 상품의 품질이 높아질 수 있다.",
"반면 외국 상품과의 경쟁에서 밀리는 국내 산업은 생산이 줄고 실업이 늘어날 수 있다. 국가 간 경제적 격차가 확대되거나 한 나라의 경제 문제가 다른 나라로 확산될 가능성도 있다. 무역액이 증가하는 동안 일부 산업에서는 생산과 고용이 감소할 수 있다.",
"무역의 이익이 모든 사람에게 똑같이 돌아가는 것은 아니다. 전체 거래액이 늘어나도 생산자에게 돌아가는 대가의 증가 폭은 작을 수 있다. 생산자가 받는 총액, 한 사람당 받는 금액, 한 시간 일하고 받는 금액은 서로 다른 값이다. 개인별 소득과 노동 조건을 살펴보려면 지급 총액과 함께 참여 인원, 분배 방식, 노동시간을 알아야 한다."
],"거래 총액은 15%, 생산자에게 지급한 대가의 총액은 4% 증가하였다. 노동시간은 제시되어 있지 않다. 두 총액의 변화와 시간당 보수에 대해 알 수 있는 내용을 설명해 보자.",[
"거래 총액과 생산자에게 지급한 대가의 총액은 모두 증가하였다. 거래 총액의 증가율이 더 크다.","시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 노동시간의 변화를 모르므로 시간당 보수가 증가했는지는 알 수 없다.","생산자 개인에게 돌아간 금액을 알려면 지급 총액이 각 사람에게 어떻게 나뉘었는지도 알아야 한다."
],"두 총액은 모두 증가했지만, 시간당 보수와 개인별 소득의 변화는 노동시간과 분배에 관한 자료가 있어야 알 수 있다.","총액이 증가한 것과 1인당 금액이나 시간당 금액이 증가한 것은 다르다. 평균을 구할 때에는 총액을 나눌 인원이나 시간을 알아야 한다.","",{q:"무역액이 증가했더라도 일부 산업의 고용 감소를 함께 살펴야 하는 이유는?",o:['가능하다.',"무역 전체의 성장과 특정 산업의 위축이 함께 나타날 수 있기 때문이다."],a:1,why:"무역이 확대되면 수출 산업이 성장하는 한편, 외국 상품과의 경쟁에서 밀리는 국내 산업은 위축될 수 있다."},['T105']);
addLesson41(15,2,"WTO·FTA와 무역 의존도","무역 관련 기구와 협정의 역할을 알아보고 무역 의존도를 계산해 보자.",[
"세계 무역 기구(WTO)는 국가 간 무역 관계를 관리·감독하는 국제기구이다. 무역 장벽을 낮추고 무역 분쟁을 조정하는 등의 역할을 한다.\n\n자유 무역 협정(FTA)은 체결국 사이의 관세와 비관세 장벽을 완화하는 협정이다. WTO가 국제기구인 데 비해 FTA는 국가 간에 맺는 협정이라는 차이가 있다.",
"자유 무역은 국가 간 무역에 대한 장벽을 낮추고 자유로운 거래를 추구한다. 반면 보호 무역은 국내 산업을 보호·육성하기 위해 관세나 비관세 장벽으로 무역을 규제한다. 외국 상품에 대한 관세를 높여 국내 산업을 보호하는 정책은 보호 무역에 해당한다.",
"무역 의존도는 한 나라의 경제가 무역에 의존하는 정도를 나타낸다. 국내 총생산(GDP)에서 수출액과 수입액의 합이 차지하는 비율로 구한다.\n\n무역 의존도(%) = (수출액 + 수입액) ÷ GDP × 100\n\n무역 의존도가 높을수록 국제 경제 환경의 변화에 더 큰 영향을 받을 수 있다."
],"GDP는 500, 수출액은 120, 수입액은 80이다. 모두 같은 통화와 기간의 값이다. 무역 의존도를 구해 보자.",[
"수출액과 수입액을 합하면 120+80=200이다.","무역액 200을 GDP 500으로 나누면 200÷500=0.4이다.","백분율로 나타내면 0.4×100=40%이다."
],"무역 의존도는 40%이다.","무역 의존도에는 수출액과 수입액의 합을 사용한다. 두 금액의 차를 사용하는 것이 아니다.","수출액, 수입액, GDP의 통화와 기간을 같게 맞추어 계산한다.",{q:"WTO와 FTA의 성격을 각각 바르게 설명한 것은?",o:["국제기구와 국가 간 협정","둘 다 금융 상품"],a:0,why:"WTO는 국가 간 무역 관계를 관리·감독하는 국제기구이고, FTA는 체결국 사이의 무역 장벽을 완화하는 협정이다."},['T104','T105']);
addLesson41(15,3,"지속가능한 국제 무역","공정한 분배와 노동자의 권리, 환경을 고려하는 무역의 방안을 알아보자.",[
"지속가능한 국제 무역은 미래 세대의 필요를 해치지 않으면서 경제적 효율성, 사회적 책임, 환경 보호를 함께 고려하는 무역 활동이다. 무역으로 얻는 이익뿐 아니라 그 이익이 어떻게 분배되는지, 노동자의 권리가 보장되는지, 생산과 운송이 환경에 어떤 영향을 주는지도 중요하다.",
"공정 무역은 국제 무역에서 더 공평한 관계를 추구하고 소외된 생산자와 노동자의 권리를 보호하려는 무역이다. 생산자에게 정당한 대가를 지급하고 안전한 노동 환경을 보장하는 것이 중요하다. 친환경적인 생산과 운송, 국제 규범의 마련, 국가 간 협력도 지속가능한 무역에 기여할 수 있다.",
"무역 계약을 평가할 때 매출액만 살펴보면 생산자와 노동자, 환경에 미친 영향을 놓치기 쉽다. 생산자에게 지급한 대가는 분배를, 노동시간과 작업장의 안전은 노동 조건을, 생산과 운송 과정의 오염은 환경 영향을 살펴보는 자료가 된다. 아래 활동에서는 이 세 종류의 자료를 조사하는 데 드는 비용을 계산한다."
],"무역 계약을 검토하려고 한다. 현재 매출액 자료만 가지고 있으며, 추가 조사에 사용할 수 있는 예산은 9이다. 생산자에게 지급한 대가, 노동 조건, 환경 영향에 관한 자료를 구하는 비용은 각각 3이다. 예산 안에서 세 자료를 모두 구할 수 있는가?",[
"매출액 자료만으로는 생산자에게 돌아간 대가나 노동 조건, 환경 영향을 알기 어렵다. 세 종류의 자료를 추가로 조사해야 한다.","세 자료를 모두 구하는 데 드는 비용은 3+3+3=9이다.","총비용이 예산 9와 같으므로 세 자료를 모두 구할 수 있다."
],"예산 9로 세 자료를 모두 구할 수 있다. 자료를 확보한 뒤에는 생산자에게 지급한 대가와 노동 조건, 환경 영향을 각각 살펴본다.","생산자에게 정당한 대가를 지급했는지, 노동자의 권리를 보장했는지, 환경을 보호했는지를 함께 살펴본다.","자료를 구한 뒤에는 그 내용을 살펴야 한다. 노동 조건이나 환경이 개선되었는지는 조사 결과로 확인한다.",{q:"지속가능한 무역인지 살펴보기 위해 필요한 자료는?",o:["수출액에 관한 자료만","경제적 효율성, 분배, 노동, 환경에 관한 자료"],a:1,why:"지속가능한 무역은 경제적 효율성뿐 아니라 사회적 책임과 환경 보호를 함께 고려한다."},['T105']);

const CAMPAIGNS42=[],PROJECTS42=[];
function capstone42(id,title,hook,chs,missions){const c={id,title,hook,chapters:chs,tasks:[]};const refs=[...new Set(chs.flatMap(n=>COURSE41.chapters[n-1].refs))];missions.forEach((t,i)=>{t.id='S'+id+'-'+(i+1);t.ch=chs[0];t.group='case';t.campaign=id;t.refs=refs;t.origin="";t.lesson='L'+String(chs[0]).padStart(2,'0')+'-1';COURSE41.tasks.push(t);c.tasks.push(t.id);});CAMPAIGNS42.push(c);}
capstone42(1,"자본주의와 경제 체제","역사적 배경과 정책을 바탕으로 자본주의의 전개 과정을 살펴보고 경제 체제를 구분해 보자.",[1,2],[
ci41("경제 위기와 정부의 대응","다음 상황과 정책을 가장 적절하게 설명한 것은?",['과잉 생산·소비 부족·실업이 커졌다.','정부가 공공사업으로 유효 수요를 늘리려 한다.'],['상업 자본주의의 교역 장려','수정 자본주의의 정부 역할','정부 역할의 전면 부정'],1,"과잉 생산, 소비 부족, 실업에 대응하기 위해 정부가 공공사업을 추진하고 유효 수요를 늘리려 한다. 시장 실패를 해결하기 위한 정부의 적극적인 역할을 강조하므로 수정 자본주의와 관련된다."),
cm41("자원 배분과 경제 체제","각 자원 배분 방식에 해당하는 경제 체제를 고르시오.",['가격을 통한 민간 선택','정부 명령과 계획','두 요소의 결합'],['시장경제','계획경제','혼합 경제'],[0,1,2],"시장 가격과 민간의 선택에 따라 자원을 배분하는 것은 시장경제 체제이다. 정부의 명령과 계획에 따르는 것은 계획경제 체제이다. 두 요소를 함께 활용하는 것은 혼합 경제 체제이다."),
cf41("중상주의와 뉴딜 정책",["중상주의와 뉴딜 정책은 모두 정부의 활동이지만,","배경과 목적이 모두 동일하다","."],1,["등장 배경과 정책의 목적이 서로 다르다","정부의 시장 개입을 모두 부정한다","당시의 생산 방식이 언제나 같다"],0,"중상주의는 절대 왕정이 상공업과 교역을 장려하여 국가의 부를 늘리려 한 정책이다. 뉴딜 정책은 대공황에 따른 실업과 수요 부족에 대응하였다. 두 정책 모두 정부의 활동이지만 등장 배경과 목적은 다르다."),
cu41("자본주의와 경제 체제","자본주의의 전개와 경제 체제에 대한 설명으로 옳은 것을 모두 고르시오.",['상업 자본주의는 유통 이윤과 연결된다.','산업 자본주의는 산업 혁명과 연결된다.','혼합 경제는 시장과 정부를 함께 활용한다.','정부가 존재하면 시장 거래는 절대 없다.'],[0,1,2],"상업 자본주의는 상품의 유통 과정에서 이윤을 얻는 것을 중시하였다. 산업 자본주의는 산업 혁명과 대량 생산을 배경으로 발달하였다. 혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소가 함께 나타난다.")]);
capstone42(2,"축제의 이익과 주민의 부담","행사장 선택의 기회비용, 소음에 따른 주민 피해, 가로등 설치비를 계산해 보자.",[3,5,6],[
cl41("행사장 선택의 기회비용",[['A행사장',60,20],['B행사장',72,26]],"A의 편익에서 명시적 비용을 빼면 60−20=40만 원, B는 72−26=46만 원이다. A를 선택하면 B의 46만 원을 포기하므로 기회비용은 20+46=66만 원이다. B를 선택하면 A의 40만 원을 포기하므로 기회비용은 26+40=66만 원이다.\n\n순편익은 A가 −6만 원, B가 6만 원이므로 B가 유리하다."),
ce41("행사 규모와 주민 피해",[[0,0,0],[1,30,3],[2,50,10],[3,60,28]],'negative',0,"규모별로 이익에서 피해를 빼면 0, 27, 40, 32이다. 규모가 2일 때 40으로 가장 크다."),
cg41("가로등 설치비와 납부액",[6,6,6],"다른 주민의 납부액 합계는 18토큰이다. 내가 6토큰을 내면 설치비 24토큰이 모두 모인다. 내게 남는 4토큰에 편익 10을 더하면 14이다. 제시된 다른 납부액을 선택했을 때보다 크므로 6토큰이 가장 유리하다."),
cm41("행사에 나타난 경제 개념","각 사례에 해당하는 경제 개념을 고르시오.",['행사 소음의 미보상 피해','비용 부담 회피로 조명 부족','포기한 다른 행사장의 가치'],['외부 불경제','공공재 부족','암묵적 비용'],[0,1,2],"행사 소음으로 주민이 피해를 입고 보상받지 못하는 것은 외부 불경제이다. 설치비 부담을 피하려 하여 가로등이 충분히 공급되지 않는 것은 공공재 부족 문제이다. 행사장 선택으로 포기한 최선의 다른 대안의 가치는 암묵적 비용이다.")]);
capstone42(3,"공장의 투자와 사회적 책임","개발비와 앞으로의 투자 비용을 구별하고, 기업의 책임과 노동자의 권리를 살펴보자.",[4,7],[
cp41("회수할 수 없는 개발비","과거에 지출한 개발비는 어떤 대안을 선택해도 회수할 수 없다. 현재의 선택에서 이 비용을 어떻게 고려해야 하는가?",['그 비용 때문에 무조건 계속한다.','매몰 비용으로 구분한다.',"모든 미래 편익을 0으로 둔다."],1,"개발비는 이미 지출하여 회수할 수 없는 매몰 비용이다. 현재의 합리적 선택에서는 이를 제외하고 앞으로 얻을 편익과 각 대안의 기회비용을 비교해야 한다."),
cb41("경영안을 검토할 자료","예산 10 안에서 노동, 환경, 정보에 관한 문서를 각각 1개 이상 준비하시오. 표의 값은 선택한 항목에서 얻는 문서의 수이다.",[['노동 검토',4,[1,0,0],1],['환경 검토',3,[0,1,0],1],['정보 공개',3,[0,0,1],1]],['노동','환경','정보'],[1,1,1],[null,null,null],10,[1,1,1],"세 문서를 각각 1개씩 고르면 노동·환경·정보에 관한 자료가 모두 마련된다. 총비용은 4+3+3=10으로 예산과 같다."),
cm41("노동자의 권리와 기업가 정신","각 활동에 해당하는 권리나 개념을 고르시오.",['노동조합 가입','사용자와 임금 협상','불확실한 기술 혁신'],['단결권','단체 교섭권','기업가 정신'],[0,1,2],"노동조합 가입은 단결권의 행사이다. 노동조합을 통해 사용자와 임금을 협상하는 것은 단체 교섭권과 관련된다. 불확실성을 감수하며 기술 혁신에 도전하는 모습에서는 기업가 정신이 드러난다."),
cu41("경제 주체의 책임과 소비","기업의 역할과 소비자의 선택에 대한 설명으로 옳은 것을 모두 고르시오.",['노동자·소비자 권리를 존중한다.','위험을 감수한 새 시장 개척은 기업가 정신과 연결된다.','윤리적 소비와 합리적 소비는 양립할 수 있다.','사회적 책임은 모든 법규를 무시하는 것이다.'],[0,1,2],"기업은 노동자와 소비자의 권리를 존중하고 사회적 책임을 다해야 한다. 위험을 감수한 시장 개척은 기업가 정신과 관련된다. 윤리적 가치를 실천하면서 얻는 만족도 편익에 포함될 수 있으므로 윤리적이면서 합리적인 소비가 가능하다.")]);
capstone42(4,"금융 자산과 자금 계획","금융 자산을 구분하고 지출 기한과 원화 손익을 계산하여 재무 계획을 검토해 보자.",[8,9,10,11],[
cm41("지위와 수익으로 금융 자산 구분하기","일반적인 수익 형태와 보유자의 지위를 보고 해당 금융 자산을 고르시오.",['이자만 기대하는 일반적 금융 자산','지분·배당·시세 차익','차용 증서·이자·시세 차익'],['예금','주식','채권'],[0,1,2],"이자 수익만 기대하는 것은 예금이다. 기업의 지분을 보유하고 배당 수익과 시세 차익을 기대하는 것은 주식이다. 원금과 이자의 지급을 약속한 차용 증서이며 이자 수익과 시세 차익을 기대하는 것은 채권이다."),
cr41("지출 기한과 초기 자금","3개월 동안 매월 말에 200을 지출한다. 수입 600은 3개월째 월초에 들어오며 남은 돈을 다음 달로 넘길 수 있다. 대출과 지출 연기가 불가능할 때 필요한 최소 초기 자금을 구하시오.",0,800,20,400,"수입을 받기 전에 첫 두 달의 지출 200×2=400을 감당해야 한다. 초기 자금이 400이면 이 지출을 마친 뒤 3개월째 월초 수입으로 마지막 지출을 할 수 있다."),
cn41("외화 금액과 환율의 변화","처음 80달러를 1,200원/달러에 취득하였다. 나중 외화 금액이 90달러가 되었을 때 1,100원/달러로 환산하였다. 다른 비용과 수익은 없다. 처음과 나중의 원화 금액, 원화 손익을 구하시오.",['처음 원화','나중 원화','손익'],[96000,99000,3000],"처음 원화 금액은 80×1,200=96,000원이다. 나중 원화 금액은 90×1,100=99,000원이다. 따라서 원화 손익은 99,000−96,000=3,000원이다."),
cp41("재무 계획의 수정","돈을 써야 하는 기한과 경제적 환경이 달라졌다. 이에 대한 대응으로 적절한 것은?",['목표와 재무 상태를 다시 검토한다.','한 번 정한 계획은 어떤 변경도 금지한다.','수익률만 보고 기한을 삭제한다.'],0,"필요한 시기에 돈을 마련할 수 있는지, 기존 자산 구성이 달라진 경제 환경에 알맞은지 다시 살펴야 한다. 목표와 현재 재무 상태를 검토하고 필요한 부분을 수정한다.")]);

cn41("생산량과 기회비용","양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 한 재화만 생산할 때 최대 생산량은 A국이 X재 16개 또는 Y재 8개, B국이 X재 6개 또는 Y재 9개이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",['A의X1기회비용(Y개)','B의X1기회비용(Y개)'],[0.5,1.5],"A국은 X재 16개 생산으로 Y재 8개를 포기하므로 X재 1개의 기회비용은 Y재 8÷16=0.5개이다. B국은 Y재 9÷6=1.5개이다."),

cn41("정해진 교환 후의 보유량","A국은 X재 16개만, B국은 Y재 9개만 생산하였다. 이번 문제에서는 앞에서 제안한 계약과 관계없이 X재 4개와 Y재 4개를 교환한다. 교역 후 각국의 X재와 Y재 보유량을 구하시오.",["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"],[12,4,4,5],"A국은 X재 16개 중 4개를 주고 Y재 4개를 받으므로 X재 12개, Y재 4개를 보유한다. B국은 X재 4개를 받고 Y재 9개 중 4개를 주므로 Y재 5개가 남는다.")]);

ci41("무역 증가와 주민 생활","다음 자료를 바탕으로 내릴 수 있는 결론으로 가장 적절한 것은?",['총생산과 수출액이 늘었다.','대가·노동·환경 자료는 없다.'],['모든 주민의 삶이 개선되었다고 확정한다.','확인된 총액과 미확인 영향을 구분한다.','빈칸은 임의의 높은 점수로 채운다.'],1,"총생산과 수출액이 증가했다는 사실은 알 수 있다. 그러나 생산자에게 지급한 대가, 노동 조건, 환경에 관한 자료가 없어 모든 주민의 생활이 개선되었는지는 알 수 없다."),

cm41("환율 상승과 거래 당사자","외화 금액은 그대로이고 원/달러 환율만 상승하였다. 각 거래 당사자에게 나타나는 변화를 고르시오.",['외화 수입을 원화로 바꾸는 사람','외화 대금을 마련하는 구매자'],['필요 원화 증가','환산 원화 수입 증가'],[1,0],"같은 외화를 원화로 바꿀 때 받는 금액은 늘어난다. 따라서 외화를 받는 사람의 원화 수입은 커진다. 반면 외화 대금을 지급하려는 사람은 외화를 사는 데 더 많은 원화를 지출해야 한다."),
cu41("무역 보고서의 작성","제시된 자료로 무역 보고서를 작성하는 방법으로 적절한 것을 모두 고르시오.",['무역의 이익과 부정적 영향을 함께 살핀다.','노동·환경·분배의 근거를 확인한다.','부족한 자료는 추가 조사 항목으로 남긴다.',"누락 수치를 몰래 0으로 가정한다."],[0,1,2],"무역의 이익과 부정적 영향을 함께 설명하고 노동·환경·분배에 관한 자료를 살펴야 한다. 자료가 없는 부분은 추가로 조사한다. 예를 들어 환경 자료가 없다고 피해를 0으로 계산할 수는 없다.")]);

["자본주의 설명하기",[1,2],["각 유형의 특징과 등장 배경을 설명하였다.","시장과 정부의 역할이 시대에 따라 어떻게 달라졌는지 비교하였다.","배운 내용을 확인할 질문을 만들었다."],"자본주의의 뜻을 설명한다. 역사적 배경에 따라 각 유형을 소개하고 시장과 정부의 역할을 비교한다. 마지막으로 확인 문제를 만든다."],
["기회비용 문제 만들기",[3,4],["선택할 수 있는 대안과 수치의 단위, 비용의 회수 가능 여부를 적었다.","암묵적 비용, 기회비용, 순편익을 정확히 계산하였다.","정답이 되는 이유와 오답이 틀린 이유를 설명하였다."],"선택 상황을 정하고 편익과 비용을 표로 나타낸다. 질문을 만든 뒤 정답을 계산한다. 각 선지의 옳고 그름을 설명한다."],

function courseEmpty41(){return {version:1,read:{},checks:{},records:{},drafts:{},exposed:{},notes:{},last:null};}
function freshCourse41(t){return {choice:null,selected:[],map:t?.type==='map'?t.d.rows.map(()=>null):[],sequence:[],bad:null,replacement:null,nums:Array(t?.type==='num'?t.d.labels.length:t?.type==='ledger'?t.d.rows.length*2:['external','public'].includes(t?.type)?1:0).fill(''),opened:[],counts:t?.type==='build'?t.d.items.map(()=>0):[],value:t?.d?.min??0,donation:null,confidence:'',help:false,assisted:false,mode:'first'};}
function responseCourse41(t,raw){const x=freshCourse41(t);if(!raw||typeof raw!=='object')return x;for(const k of ['choice','bad','replacement','donation'])if(Number.isInteger(raw[k])&&raw[k]>=0&&raw[k]<100)x[k]=raw[k];x.value=savedValue431(raw,x.value,['range','external','ppf','trade'].includes(t.type));for(const k of ['map','counts'])if(Array.isArray(raw[k]))x[k]=x[k].map((v,i)=>Number.isInteger(raw[k][i])?raw[k][i]:v);if(Array.isArray(raw.nums))x.nums=x.nums.map((_,i)=>['string','number'].includes(typeof raw.nums[i])?String(raw.nums[i]).slice(0,100):'');for(const k of ['selected','sequence','opened'])if(Array.isArray(raw[k]))x[k]=raw[k].slice(0,30).filter(v=>Number.isInteger(v)&&v>=0&&v<100);x.confidence=['sure','unsure','guess'].includes(raw.confidence)?raw.confidence:'';x.help=raw.help===true;x.assisted=raw.assisted===true||x.help;x.mode=['first','assisted','recheck','legacy'].includes(raw.mode)?raw.mode:'legacy';if(x.assisted)x.mode='assisted';return x;}
function courseLedger41(t){return costRows(t.d.rows);}
function courseTotals41(t,a){const vals=t.d.labels.map(()=>0);let cost=0;t.d.items.forEach((it,i)=>{const n=a.counts[i]||0;cost+=it[1]*n;it[2].forEach((v,j)=>vals[j]+=n*v);});return {cost,vals};}

function courseGrade41(t,a){try{if(!t||!a)return false;const d=t.d;switch(t.type){case'pick':return a.choice===t.answer;case'multi':return arrEq([...new Set(a.selected)].sort((x,y)=>x-y),t.answer.slice().sort((x,y)=>x-y));case'map':return arrEq(a.map,t.answer);case'sort':return arrEq(a.sequence,t.answer);case'fix':return a.bad===t.answer[0]&&a.replacement===t.answer[1];case'num':return numsEq(a.nums,t.answer);case'inspect':return a.choice===t.answer&&d.required.every(i=>a.opened.includes(i));case'range':return inGrid41(a.value,d.min,d.max,d.step)&&near(a.value,t.answer);case'ledger':{const rows=courseLedger41(t),max=Math.max(...rows.map(v=>v.g));return numsEq(a.nums,rows.flatMap(v=>[v.implicit,v.oc]))&&rows[a.choice]?.g===max;}case'build':{if(a.counts.length!==d.items.length||!a.counts.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=d.items[i][3]))return false;const z=courseTotals41(t,a);return z.cost<=d.budget+1e-7&&z.vals.every((v,i)=>v>=d.mins[i]-1e-7&&(d.maxs[i]==null||v<=d.maxs[i]+1e-7));}case'external':{const index=d.rows.findIndex(v=>v[0]===num(a.value)),values=courseExternal41(t);return index>=0&&values[index]===Math.max(...values)&&numsEq(a.nums,[values[index]]);}case'public':{if(![0,4,6,10].includes(a.donation))return false;const z=publicCalc(d.others,a.donation);return z.value===Math.max(...[0,4,6,10].map(n=>publicCalc(d.others,n).value))&&numsEq(a.nums,[z.value]);}default:return false;}}catch(error){return false;}}

normalize=function(raw){const next=priorNormalize42(raw),old=raw?.course41;if(!old||old.version!==1)return next;for(const l of COURSE41.lessons){if(old.read?.[l.id]===true)next.course41.read[l.id]=true;const q=old.checks?.[l.id];if(q&&Number.isInteger(q.choice)&&q.choice>=0&&q.choice<l.check.o.length)next.course41.checks[l.id]={choice:q.choice,ok:q.choice===l.check.a};}for(const t of COURSE41.tasks){const rec=old.records?.[t.id];if(rec&&typeof rec==='object'){const sol=responseCourse41(t,rec.solved);next.course41.records[t.id]={solved:rec.solved&&courseGrade41(t,sol)?sol:null,history:Array.isArray(rec.history)?rec.history.slice(-15).filter(v=>v&&typeof v==='object').map(v=>({answer:responseCourse41(t,v.answer),time:typeof v.time==='string'?v.time.slice(0,50):''})):[]};}if(old.drafts?.[t.id])next.course41.drafts[t.id]=responseCourse41(t,old.drafts[t.id]);if(old.exposed?.[t.id]===true||next.course41.records[t.id]?.solved||next.course41.records[t.id]?.history.length||next.course41.drafts[t.id]?.help)next.course41.exposed[t.id]=true;}for(const ch of COURSE41.chapters)next.course41.notes[ch.id]=typeof old.notes?.[ch.id]==='string'?old.notes[ch.id].slice(0,50000):'';next.course41.last=typeof old.last==='string'&&(CT41[old.last]||CL41[old.last])?old.last:null;return next;};

function orderCourse41(n,key){const a=Array.from({length:n},(_,i)=>i);let seed=Array.from(key).reduce((v,c)=>(Math.imul(v,31)+c.charCodeAt(0))>>>0,1729);for(let i=n-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a;}
function courseButton41(t,extra=''){const last=courseLast41(t),done=coursePassed41(t.id);return '<button class="bookcard card" data-action="c41-task" data-id="'+t.id+'"><span class="tag">'+esc(t.id)+' · '+esc(extra||{main:"기본 문제",review:'복습',transfer:"응용 문제"}[t.group])+'</span><h3>'+esc(t.title)+'</h3><span class="tiny muted">'+(done?"정답을 맞힌 문제":last?'재확인':"아직 풀지 않음")+' · '+esc(COURSE_TYPES41[t.type])+'</span></button>';}
const COURSE_TYPES41={pick:'단서 판별',multi:"옳은 설명 모두 고르기",map:'개념 연결',sort:"순서 배열",fix:"문장 바로잡기",num:"수치 계산",inspect:'자료 조사',ledger:"기회비용 계산",build:'제약 조건 조합',range:"조건에 맞는 값 구하기",external:'외부 효과 장부',public:'공공재 모금'};
function courseHub41(){return "<div class=\"narrow\"><span class=\"eyebrow\">CORE COURSE · 01—07</span><h1>개념에서 사건 해결까지</h1><p class=\"muted\">자본주의·경제 체제·합리적 선택·시장 실패·경제 주체를 하나의 경로로 연결했습니다. 3.1의 원고와 문제를 재편성한 통합 제작판입니다.</p><div class=\"notice\">01~07: 정규 강의 21개, 본편 70개, 기존 복습 14개, 신규 조건 7개. 강의 확인 질문 21개는 별도로 관리합니다. 첫 세 집중 사건의 12강·24활동은 겹치는 주제가 있으므로 새 학습량으로 단순 합산하지 않습니다.</div><div class=\"stack section\">"+COURSE41.chapters.map(ch=>'<article class="card"><span class="tag">CHAPTER '+String(ch.id).padStart(2,'0')+'</span><h2>'+esc(ch.title)+'</h2><p>'+esc(ch.hook)+'</p><p class="tiny muted">강의 읽음 '+ch.lessons.filter(id=>cpState41().read[id]).length+'/3 · 본편 해결 '+ch.main.filter(coursePassed41).length+'/10 · 새 조건 '+ch.transfer.filter(coursePassed41).length+'/1</p><div class="actions"><button class="primary" data-action="c41-unit" data-id="'+ch.id+'">학습 경로 열기</button><button data-action="c41-lesson" data-id="'+ch.lessons[0]+'">강의부터</button></div></article>').join('')+"<article class=\"card\"><h2>08~15챕터는 다음 통합 대상입니다</h2><p>금융·생산·무역 전 범위는 기존 3.1 파일에 보존되어 있습니다. 이 파일에 새 구조로 이전된 것은 01~07과 기존 세 집중 사건입니다.</p><a class=\"btn\" href=\"https://drive.google.com/file/d/1rG3rA33XvRvMi3cABhcdsfo_K1imKEBz/view\" target=\"_blank\" rel=\"noopener noreferrer\">기존 3.1 전 범위 파일 위치</a></article></div></div>";}
function courseUnit41(id){const ch=CU41[String(id)];if(!ch)return courseHub41();return '<div class="narrow"><button class="small" data-action="c41-course">← 정규 과정</button><article class="card section"><span class="tag">CHAPTER '+String(ch.id).padStart(2,'0')+'</span><h1>'+esc(ch.title)+'</h1>'+speaker({who:ch.who},ch.hook)+"<p>개념을 익힌 뒤 예제를 풀어 보고, 연습 문제에 적용해 보세요.</p></article><h2 class=\"section\">권장 학습 순서</h2><div class=\"stack\">"+ch.path.map((id,i)=>CL41[id]?'<button class="card bookcard" data-action="c41-lesson" data-id="'+id+'"><span class="tag">'+(i+1)+' · 개념 강의 · '+id+'</span><h3>'+esc(CL41[id].title)+'</h3><span class="tiny muted">'+(cpState41().read[id]?"학습한 강의":'설명 → 예제 → 확인')+'</span></button>':courseButton41(CT41[id],(i+1)+'번째 · 본편')).join('')+'</div><h2 class="section">조건을 바꿔 다시 확인</h2><div class="stack">'+[...ch.review,...ch.transfer].map(id=>courseButton41(CT41[id])).join('')+'</div><div class="actions"><button data-action="c41-notes" data-id="'+ch.id+'">이 단원의 강의 메모</button><button data-action="c41-course">다른 단원</button></div>'+courseRefs41(ch.refs)+'</div>';}

function courseControls41(t){const a=CF41.response,d=t.d;switch(t.type){case'pick':return courseOptions41(d.options);case'multi':return '<p class="tiny muted">옳은 문장을 모두 고릅니다.</p>'+courseOptions41(d.options,'selected',true);case'map':return d.rows.map((label,i)=>'<div class="field"><label for="c41m'+i+'">'+esc(label)+'</label><select id="c41m'+i+'" data-cfield41="map" data-i="'+i+'"><option value="">연결할 개념</option>'+orderCourse41(d.options.length,t.id+i).map(j=>'<option value="'+j+'" '+(a.map[i]===j?'selected':'')+'>'+esc(d.options[j])+'</option>').join('')+'</select></div>').join('');case'sort':return '<div class="coursepool41">'+orderCourse41(d.rows.length,t.id).filter(i=>!a.sequence.includes(i)).map(i=>'<button data-action="c41-sort-add" data-i="'+i+'">'+esc(d.rows[i])+'</button>').join('')+'</div><div class="courseseq41"><span class="tiny muted">선택한 순서 · 놓은 카드를 누르면 되돌립니다</span>'+a.sequence.map((i,j)=>'<button data-action="c41-sort-remove" data-i="'+j+'"><b>'+(j+1)+'</b> '+esc(d.rows[i])+'</button>').join('')+'</div>';case'fix':return '<div class="coursesentence41">'+d.segments.map((text,i)=>'<button class="'+(a.bad===i?'selected':'')+'" data-action="c41-option" data-key="bad" data-i="'+i+'">'+esc(text)+'</button>').join('')+'</div><h3>선택한 부분의 수정안</h3>'+courseOptions41(d.options,'replacement');case'num':return (d.table?textTable(d.table[0],d.table.slice(1)):'')+courseNumbers41(d.labels);case'inspect':return '<div class="courseevidence41">'+d.clues.map((text,i)=>'<button data-action="c41-clue" data-i="'+i+'" class="card '+(a.opened.includes(i)?'selected':'')+'"><span class="tag">자료 '+(i+1)+'</span><p>'+esc(a.opened.includes(i)?text:'열어서 자료를 확인하세요.')+'</p></button>').join('')+'</div><h3>자료에 근거한 판단</h3>'+courseOptions41(d.options);case'ledger':return textTable(['대안','편익','명시적 비용'],d.rows)+courseNumbers41(d.rows.flatMap(row=>[row[0]+'의 암묵적 비용',row[0]+'의 기회비용']))+'<h3>가장 유리한 대안</h3>'+courseOptions41(d.rows.map(row=>row[0]));case'range':return courseSlider41(d,'조건에 맞는 값');case'build':{const totals=courseTotals41(t,a);return '<div class="rule"><b>창작 제약 조건</b>비용 '+d.budget+' 이하. '+d.labels.map((v,i)=>esc(v)+' '+d.mins[i]+' 이상'+(d.maxs[i]==null?'':' / '+d.maxs[i]+' 이하')).join(' · ')+'</div>'+d.items.map((it,i)=>'<div class="courseitem41"><div><b>'+esc(it[0])+'</b><p class="tiny muted">단위 비용 '+it[1]+' · '+d.labels.map((v,j)=>esc(v)+' '+it[2][j]).join(' / ')+' · 최대 '+it[3]+'</p></div><div class="counter"><button aria-label="'+esc(it[0])+' 줄이기" data-action="c41-count" data-i="'+i+'" data-delta="-1">−</button><b>'+a.counts[i]+'</b><button aria-label="'+esc(it[0])+' 늘리기" data-action="c41-count" data-i="'+i+'" data-delta="1">＋</button></div></div>').join('')+'<div class="coursemeters41"><div>총비용<strong>'+f(totals.cost)+'</strong></div>'+totals.vals.map((v,i)=>'<div>'+esc(d.labels[i])+'<strong>'+f(v)+'</strong></div>').join('')+'</div>';}case'external':return '<div class="rule"><b>비교 목표</b>'+esc(courseExternalLabel41(t))+'의 최대값'+(['tax','subsidy'].includes(d.mode)?" · 활동 1단위당 "+d.rate+(d.mode==='tax'?' 부담금':' 보조금'):'')+'</div>'+textTable(['활동량','개인 이익','제3자 '+(['positive','subsidy'].includes(d.mode)?'편익':'피해')],d.rows)+courseSlider41({min:d.rows[0][0],max:d.rows[d.rows.length-1][0],step:1},'선택할 활동량')+courseNumbers41(["선택한 활동량에서 구한 금액"]);case'public':return textTable(['다른 주민 A','다른 주민 B','다른 주민 C'],[d.others])+'<div class="row">'+[0,4,6,10].map(n=>'<button class="'+(a.donation===n?'selected':'')+'" data-action="c41-option" data-key="donation" data-i="'+n+'">'+n+'토큰 납부</button>').join('')+'</div>'+courseNumbers41(['내 최종 토큰+편익']);default:return '<p>등록되지 않은 형식입니다.</p>';}}
function courseSolution41(t,a=CF41.response){const d=t.d;switch(t.type){case'pick':case'inspect':return '<p><b>판단:</b> '+esc(d.options[t.answer])+'</p>';case'multi':return t.answer.map(i=>'<p>✓ '+esc(d.options[i])+'</p>').join('');case'map':return textTable(['자료','연결'],d.rows.map((x,i)=>[x,d.options[t.answer[i]]]));case'sort':return '<p>'+t.answer.map((i,j)=>(j+1)+'. '+esc(d.rows[i])).join('<br>')+'</p>';case'fix':return '<p><b>수정 문장:</b> '+d.segments.map((v,i)=>esc(i===t.answer[0]?d.options[t.answer[1]]:v)).join(' ')+'</p>';case'num':return textTable(['항목','정답'],d.labels.map((v,i)=>[v,f(t.answer[i])]));case'range':return '<p><b>조건을 만족하는 값: '+f(t.answer)+'</b></p>';case'ledger':return textTable(['대안',"편익−명시적 비용",'암묵적 비용','기회비용','순편익'],courseLedger41(t).map(v=>[v.name,v.g,v.implicit,v.oc,v.surplus]));case'build':return '<p>제약을 모두 충족하면 정답입니다. 가능한 예시는 다음과 같습니다.</p>'+textTable(['선택','수량'],d.items.map((v,i)=>[v[0],d.witness[i]]));case'external':return textTable(['활동량',courseExternalLabel41(t)],d.rows.map((v,i)=>[v[0],courseExternal41(t)[i]]));case'public':return textTable(['내 납부','모금 합계','설치',"남은 토큰과 편익의 합"],[0,4,6,10].map(n=>{const z=publicCalc(d.others,n);return[n,z.total,z.lit?'성공':'실패·반환',z.value];}));default:return '';}}

render=function(){if(route.view==='course'||route.view.startsWith('course-')){frame();if(route.view!=='course-task'){CF41.task=null;CF41.response=null;CF41.result=null;}let html=route.view==='course'?courseHub41():route.view==='course-unit'?courseUnit41(route.id):route.view==='course-task'?courseTaskHTML41(route.id):route.view==='course-lesson'?courseLessonHTML41(route.id):route.view==='course-notes'?courseNotesHTML41(route.id):courseHub41();$('app').innerHTML=html;}else{CF41.task=null;CF41.response=null;CF41.result=null;previousRender42();}};

case 5:{const p=publicCalc([v.a,v.b,v.c],v.me);return {title:p.lit?'가로등 설치':'설치 실패·납부액 반환',headers:['항목','값'],rows:[["다른 주민의 납부 합계",v.a+v.b+v.c],["내 납부액",v.me],["전체 모금액",p.total],["남은 토큰과 편익의 합",p.value]],detail:"설치에 성공하면 비용을 내지 않은 주민도 편익을 얻습니다. 실패하면 납부액을 전액 돌려받는 학습용 모형입니다.",lit:p.lit};}
case 6:{const defs=[['예금','자금 예치',"금융 기관에 맡긴 자금",'이자 수익',"일반적인 예금에서는 시세 차익을 기대하지 않음"],['채권','차용 증서','채권자','이자 수익·시세 차익','발행자의 부채 증가'],['주식','지분 표시','주주','배당 수익·시세 차익','발행자의 자본금 증가']][v.asset];return {title:defs[0],headers:['기준','내용'],rows:[['구조',defs[1]],["보유 관계",defs[2]],["기대 수익 형태",defs[3]],['구분할 특징',defs[4]]],detail:"원금과 이익을 구분하세요. 수익을 기대할 수 있다는 것은 실제 수익을 보장한다는 뜻이 아닙니다."};}

case 8:{const r=1+v.rate/100,amounts=[v.first,v.second,v.third],rows=amounts.map((p,i)=>[i+1,p,3-i,p*Math.pow(r,3-i)]),sum=rows.reduce((s,row)=>s+row[3],0);return {title:'3년째 말 합계 '+f(sum),headers:["납입한 연도의 초",'원금',"예치 기간(년)",'만기 원리금'],rows,detail:"각 납입금의 예치 기간은 서로 다릅니다. 원금별 원리금을 따로 구한 뒤 합하세요."};}
case 9:{const before=v.usd0*v.krw0,after=v.usd1*v.krw1;return {title:'원화 손익 '+f(after-before),headers:['시점','외화액(달러)','환율(원/달러)','원화액'],rows:[['처음',v.usd0,v.krw0,before],['나중',v.usd1,v.krw1,after]],detail:"매수 금액에는 매수 시 환율을, 매도 금액에는 매도 시 환율을 적용합니다. 두 원화 금액의 차이가 이 모형의 손익입니다."};}

handleAction=async function(b){const action=b.dataset.action,id=b.dataset.id;if(action==='reset'){if(confirm('4.2의 모든 학습 기록·메모·편집 초안을 초기화할까요? 기존 버전 저장 공간은 바꾸지 않습니다. 먼저 백업을 보관하세요.')){clearTransient42();state=empty();storeOK=true;save();go('home');toast('4.2 기록만 초기화했습니다.');}return;}if(action==='restore'){stash();clearTransient42();go('settings');$('restore').click();return;}if(!action.startsWith('v42-'))return earlierHandle42(b);switch(action){case'v42-campaigns':courseGo41('course-campaigns');break;case'v42-campaign':courseGo41('course-campaign',id);break;case'v42-projects':courseGo41('course-projects');break;case'v42-project':courseGo41('course-project',id);break;case'v42-labs':courseGo41('course-workshops');break;case'v42-lab':courseGo41('course-workshop',id);break;case'v42-project-save':{const p=PROJECTS42.find(p=>p.id===id),rec=state.projects42[id];if(!p||!rec?.text.trim()||!p.checks.every((_,i)=>rec.checks[i])){toast("초안과 스스로 점검하기을 모두 확인하세요.");break;}rec.saved=true;save();refresh();toast('초안과 자기 점검을 기록했습니다. 서술 정확성 인증은 아닙니다.');break;}case'v42-project-export':{const p=PROJECTS42.find(p=>p.id===id);if(p)download(p.title+'\n\n'+(state.projects42[id]?.text||''),"경제설계자 4_2_"+id+'_초안.txt');break;}case'v42-lab-note':{const l=WORKSHOPS42.find(l=>l.id===ACTIVE_LAB42),z=labResult42(l.id,LAB_VALUES42[l.id]);courseAppend41(l.ch,'[자유 실험 '+l.id+' '+l.title+']\n조건: '+l.intro+'\n'+Object.entries(LAB_VALUES42[l.id]).map(([k,v])=>k+'='+v).join(', ')+'\n'+z.title+'\n'+z.rows.map(row=>row.join(' / ')).join('\n')+'\n'+z.detail);break;}case'v42-export-all':download(allNotes42(),"경제설계자 4_2_전체메모.txt");break;case'v42-report':courseGo41('course-report');break;case'v42-audit':{const checks=runChecks();LAST_TEST42={at:new Date().toISOString(),build:BUILD,userAgent:navigator.userAgent,scope:'현재 브라우저에서 수행한 자동 검사. 실기기 전체 조작·내용 교열과 별도.',results:checks};if($('audit42'))$('audit42').innerHTML='<h3>'+checks.filter(x=>x.ok).length+'/'+checks.length+' 항목 통과</h3>'+textTable(['검사','결과'],checks.map(x=>
