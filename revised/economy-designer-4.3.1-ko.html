개를 포기하지만 6개만 지급하므로 2개를 절약한다.","hint":"X재 8개 생산의 기회비용과 교환할 Y재 6개를 비교하세요."},{"title":"교환 조건의 확인","q":"실제로 실행할 수 있고 양국 모두 이익을 얻는 교환인지 알려면 무엇을 확인해야 하는가?","why":"각국의 생산 기회비용과 교환 비율을 비교하여 이익을 확인한다. 또한 수출할 수량이 보유량을 넘지 않는지도 살펴야 한다.","hint":"첫 번째 교환은 비율이 유리해도 줄 수 있는 수량이 부족했습니다."}]},"G14-2":{"title":"소비량으로 교환량 구하기","premise":"A국은 X재만, B국은 Y재만 생산하였다. 교역 후 소비량은 A국이 X재 14개와 Y재 4개, B국이 X재 6개와 Y재 8개이다. 두 나라만 거래하며 재고, 손실, 다른 거래는 없다.","model":"같은 재화의 소비량을 합하면 생산 총량이다. 각국이 만들지 않은 재화는 상대국에서 수입한 것이다.","steps":[{"title":"특화 생산량","q":"A국의 X재 생산량과 B국의 Y재 생산량을 각각 구하시오.","why":"X재는 14+6=20개로 A국의 생산량이다. Y재는 4+8=12개로 B국의 생산량이다.","hint":"X재끼리, Y재끼리 소비량을 더하세요."},{"title":"수출입 수량과 비율","q":"A국의 X재 수출량과 Y재 수입량을 구하고, X재 1개당 교환한 Y재 수량을 구하시오.","why":"B국이 가진 X재 6개는 A국에서 수입한 것이다. A국이 가진 Y재 4개는 B국에서 수입하였다. 따라서 X재 6개와 Y재 4개를 교환했고, 비율은 X재 1개당 Y재 4/6=2/3개이다.","hint":"A국이 주고받은 수량은 X재 6개와 Y재 4개입니다."},{"title":"다른 나라와도 거래했다면?","q":"다른 나라에서도 수입했다는 조건이 추가되면 기존 계산을 그대로 적용할 수 있는가?","why":"소비한 재화 중 일부가 다른 나라에서 왔다면 두 나라의 소비량 합계가 두 나라의 생산량과 같지 않을 수 있다. 다른 나라에서 수입한 수량을 더 알아야 한다.","hint":"원래 계산은 두 나라 사이의 거래만 있다고 가정했습니다."}],"origin":""},"G15-1":{"title":"무역 의존도 계산","premise":"가상 국가의 GDP는 750, 수출액은 180, 수입액은 120이다. 기간과 통화는 같다. 무역 의존도는 ‘(수출액+수입액)÷GDP×100’으로 구한다.","model":"수출액과 수입액을 합한 금액이 GDP에서 차지하는 비율을 구한다.","steps":[{"title":"수출액과 수입액의 합","q":"무역 의존도 계산에 사용할 수출입 합계를 구하시오.","why":"수출액 180과 수입액 120을 합하면 300이다.","hint":"무역 의존도에는 두 금액의 차가 아니라 합을 사용합니다."},{"title":"GDP에 대한 비율","q":"무역 의존도를 백분율로 구하시오.","why":"300÷750=0.4이므로 무역 의존도는 40%이다.","hint":"수출입 합계를 GDP로 나눈 뒤 100을 곱하세요."},{"title":"무역 의존도와 생활의 변화","q":"무역 의존도만으로 모든 산업과 개인의 생활이 개선되었다고 알 수 있는가?","why":"무역 의존도는 GDP에서 수출입 합계가 차지하는 비율이다. 산업별 고용이나 개인의 소득, 노동 조건의 변화는 해당 자료를 더 살펴야 한다.","hint":"무역 의존도의 식에는 고용이나 개인별 소득이 들어 있지 않습니다."}],"origin":""},"G15-2":{"title":"거래 총액과 시간당 보수","premise":"보고서 A에는 전체 거래액이 10% 증가했다고, B에는 생산자에게 지급한 대가 총액이 5% 증가했다고 기록되어 있다. 노동시간, 참여 인원, 환경에 관한 자료는 없다.","model":"총액이 증가한 것과 시간당·1인당 금액이 증가한 것은 다르다. 평균액을 구하려면 노동시간과 인원도 알아야 한다.","steps":[{"title":"자료에서 알 수 있는 사실","q":"두 보고서에서 알 수 있는 사실은?","why":"거래액은 10%, 지급한 대가 총액은 5% 증가하였다. 두 총액은 모두 늘었지만 증가율은 서로 다르다.","hint":"보고서에 실제로 제시된 것은 두 총액의 증가율입니다."},{"title":"시간당 보수를 알려면?","q":"‘시간당 보수가 5% 올랐다’는 문장을 어떻게 고쳐야 하는가?","why":"시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 지급 총액이 5% 증가했더라도 노동시간이 어떻게 달라졌는지 모르면 시간당 보수의 변화는 알 수 없다.","hint":"노동시간이 함께 늘어났을 수도 있습니다."},{"title":"지속가능한 무역의 평가","q":"무역의 지속가능성을 평가하기 위해 추가로 해야 할 일은?","why":"생산자에게 정당한 대가를 지급했는지, 노동 조건은 어떠한지, 환경에 어떤 영향을 주었는지를 조사해야 한다. 거래 규모뿐 아니라 사회적 책임과 환경 보호도 고려할 필요가 있다.","hint":"노동시간과 참여 인원, 작업 환경과 오염 등에 관한 자료가 필요합니다."}],"origin":""}},"LESSONS":{"CH-L1":{"title":"명시적 비용과 암묵적 비용","lead":"선택할 때 직접 지출하는 돈과 포기하는 가치를 알아보자.","sections":[["희소성과 선택","희소성은 인간의 욕구에 비해 사용할 수 있는 자원이 상대적으로 부족한 상태이다. 같은 시간에 공연을 보는 것과 일을 하는 것을 모두 할 수 없다면 하나를 선택해야 한다. 시간과 자원이 한정되어 있기 때문에 선택에는 다른 기회의 포기가 따른다."],["편익과 명시적 비용","편익은 선택을 통해 얻는 이득이나 만족감이다. 일해서 받는 보수와 공연을 즐기면서 얻는 만족이 그 예이다. 명시적 비용은 선택에 따라 실제로 지출하는 금전적 비용이다. 공연 표 값과 교통비 등이 이에 해당한다."],["암묵적 비용과 기회비용","암묵적 비용은 선택으로 포기한 다른 대안 중 가장 큰 가치이다. 다른 대안에서도 돈을 지출해야 했다면, 그 대안의 편익에서 명시적 비용을 뺀 금액이 포기한 가치가 된다. 기회비용은 명시적 비용과 암묵적 비용을 더한 값이다. 편익에서 기회비용을 빼면 순편익을 구할 수 있다."]],"example":{"p":"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 표 값은 3만 원이다. 일을 하면 보수 8만 원을 받지만 교통비 1만 원이 든다. 공연 선택의 기회비용을 구해 보자.","steps":["표 값 3만 원은 공연을 보기 위해 직접 지출하므로 명시적 비용이다.","일을 했다면 보수 8만 원에서 교통비 1만 원을 뺀 7만 원을 얻었을 것이다. 공연을 선택하면서 포기한 이 금액이 암묵적 비용이다.","기회비용은 명시적 비용과 암묵적 비용을 더한 3+7=10만 원이다."],"result":"공연 선택의 명시적 비용은 3만 원, 암묵적 비용은 7만 원, 기회비용은 10만 원이다."},"tip":{"rule":"돈을 직접 내지 않는 활동에도 기회비용이 있다. 다른 활동을 선택할 기회를 포기하기 때문이다.","limit":"예제에서 만족을 금액으로 나타낸 값은 편익으로 사용한다."},"advanced":"일을 하지 않으면 보수 8만 원을 받지 못하지만 교통비 1만 원도 내지 않는다. 따라서 일을 포기한 가치는 보수 전체가 아니라 교통비를 뺀 7만 원이다. 포기한 대안의 편익만을 암묵적 비용으로 계산하면 비용을 실제보다 크게 구하게 된다."},"CH-L2":{"title":"기회비용과 순편익","lead":"각 대안의 기회비용과 순편익을 구하여 합리적인 선택을 찾아보자.","sections":[["선택하지 않은 대안의 가치","A와 B 중 하나만 선택할 수 있다고 하자. A를 선택하면 B를 포기하므로 B의 편익에서 명시적 비용을 뺀 값이 A 선택의 암묵적 비용이다. 반대로 B를 선택할 때에는 A를 포기한 가치가 암묵적 비용이다."],["기회비용과 순편익의 계산","선택한 대안의 명시적 비용에 암묵적 비용을 더하면 기회비용이다. 그 대안의 편익에서 기회비용을 빼면 순편익이다. 편익에서 명시적 비용만 뺀 금액에는 아직 다른 대안을 포기한 가치가 반영되지 않았다."],["편익이 다른 두 대안","편익이 같다면 기회비용이 작은 대안이 더 유리하다. 그러나 편익이 다르면 기회비용이 더 큰 대안의 순편익이 더 클 수 있다. 합리적으로 선택하려면 편익과 기회비용을 함께 고려해야 한다."]],"example":{"p":"A의 편익은 25, 명시적 비용은 7이고 B의 편익은 32, 명시적 비용은 11이다. 둘 중 하나만 선택하며 다른 대안과 매몰 비용은 없다. 각 대안의 기회비용과 순편익을 구해 보자.","steps":["A의 편익에서 명시적 비용을 빼면 25−7=18이다. B는 32−11=21이다.","A를 선택하면 B의 21을 포기한다. A의 기회비용은 명시적 비용 7을 더한 28이다.","B를 선택하면 A의 18을 포기한다. B의 기회비용은 명시적 비용 11을 더한 29이다.","순편익은 A가 25−28=−3, B가 32−29=3이다."],"result":"B의 기회비용은 A보다 크지만 순편익도 더 크므로 B가 합리적인 선택이다."},"tip":{"rule":"기회비용은 명시적 비용과 암묵적 비용의 합이다. 순편익은 편익에서 기회비용을 뺀 값이다.","limit":"이 예제에서는 두 대안 중 하나만 선택할 수 있고 다른 대안은 없다."},"advanced":"두 대안만 있다면 각 대안의 편익에서 명시적 비용을 뺀 금액을 비교하여 유리한 쪽을 찾을 수 있다. 예제에서는 B의 21이 A의 18보다 3 크다. 이 차이가 B 선택의 순편익이다. A를 선택할 때의 순편익은 반대로 −3이다. 두 금액이 같다면 두 대안의 순편익은 모두 0이다."},"CH-L3":{"title":"매몰 비용과 비용의 변화","lead":"회수할 수 없는 과거 지출과 앞으로 부담할 비용을 구별해 보자.","sections":[["매몰 비용","매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 어떤 대안을 선택하더라도 돌려받지 못하므로 현재의 합리적 선택에서 고려하지 않는다. 사업을 계속할 때와 중단할 때 모두 회수할 수 없는 과거 개발비가 그 예이다."],["새 계약에 따른 반환금","새로운 계약으로 특정 대안을 선택할 때만 반환금을 받게 되었다면 앞으로 받을 수 있는 금액에 차이가 생긴다. 그 대안의 편익에 반환금을 더하여 다른 대안과 비교한다. 반환금이 제시된 편익에 이미 포함되어 있다면 다시 더하지 않는다."],["보상과 비용의 변화","보상이 늘거나 앞으로 낼 비용이 줄면 해당 대안이 이전보다 유리해진다. 다만 다른 대안보다 유리해졌는지는 두 대안의 편익과 비용을 다시 비교해야 알 수 있다. 두 대안이 같아진 경우와 어느 하나가 더 유리한 경우도 구별해야 한다."]],"example":{"p":"A의 앞으로의 편익은 150, 명시적 비용은 90이고 B는 각각 130과 55이다. 과거 지출 60은 어떤 선택에서도 회수할 수 없다. 이후 B의 명시적 비용만 75로 증가하였다. 유리한 대안은 어떻게 바뀌는가?","steps":["처음에는 A의 편익에서 명시적 비용을 뺀 값이 60, B는 75이므로 B가 유리하다.","과거 지출 60은 매몰 비용이므로 두 대안을 비교할 때 제외한다.","B의 명시적 비용이 75가 되면 편익에서 명시적 비용을 뺀 값은 55이다. A의 60보다 작으므로 A가 더 유리해진다."],"result":"B가 앞으로 부담할 비용이 증가하여 유리한 대안이 B에서 A로 바뀌었다."},"tip":{"rule":"현재의 선택에는 앞으로 달라지는 편익과 비용을 반영한다. 회수할 수 없는 과거 지출은 제외한다.","limit":"과거에 냈더라도 현재의 선택에 따라 돌려받을 수 있는 금액은 매몰 비용과 구별한다."},"advanced":"두 대안이 같은 수준으로 유리해지는 금액과 어느 한 대안이 더 유리해지는 금액은 다르다. 반환금을 정수로만 받을 수 있다면 두 대안이 같아지는 금액을 구한 뒤 그다음 정수에서의 결과를 살펴볼 수 있다. 동률을 허용하는지에 따라 경계값을 포함할지가 달라진다."},"CH-L4":{"title":"포기한 가치와 순편익의 변화","lead":"가장 유리한 선택이 그대로여도 순편익은 달라질 수 있다.","sections":[["세 대안 중 하나를 선택하는 경우","A, B, C의 편익에서 명시적 비용을 뺀 값이 각각 22, 26, 25라고 하자. B의 값이 가장 크므로 B를 선택하는 것이 유리하다. B를 선택할 때에는 남은 A와 C 중 가치가 더 큰 C의 25를 암묵적 비용으로 계산한다."],["가장 유리한 선택의 순편익","B의 편익에서 명시적 비용을 빼면 26이고 암묵적 비용은 25이다. 따라서 B의 순편익은 26−25=1이다. A나 C를 선택하면 더 큰 B의 26을 포기하므로 순편익이 음수가 된다."],["포기한 대안의 가치가 커진 경우","C의 가치가 커져도 B의 26보다 작다면 B가 여전히 가장 유리하다. 그러나 B를 선택할 때 포기하는 가치는 커진다. B의 명시적 비용이 일정하다면 기회비용은 증가하고 순편익은 감소한다."]],"example":{"p":"A, B, C의 편익에서 명시적 비용을 뺀 값은 각각 22, 26, 25이다. 다른 조건은 같고 C의 값만 25.5로 증가하였다. B 선택의 순편익은 어떻게 달라지는가?","steps":["처음 B의 순편익은 26−25=1이다.","변경 후에도 B의 26이 C의 25.5보다 크므로 B를 선택하는 것이 가장 유리하다.","B를 선택할 때 포기하는 가치는 25.5로 커진다. 따라서 순편익은 26−25.5=0.5로 줄어든다."],"result":"가장 유리한 대안은 B로 같지만, 암묵적 비용은 증가하고 순편익은 감소하였다."},"tip":{"rule":"선택한 대안을 제외한 나머지 대안 중 가장 큰 가치가 암묵적 비용이다.","limit":"‘아무것도 하지 않기’도 선택할 수 있는 대안으로 제시되었다면 그 가치까지 비교한다."},"advanced":"편익이 서로 다르면 명시적 비용이나 기회비용이 가장 작은 대안이 언제나 최선은 아니다. 비용이 더 크더라도 편익의 차이가 충분히 크면 순편익도 더 클 수 있다. 반대로 편익이 가장 큰 대안도 비용을 고려하면 불리할 수 있다."},"PG-L1":{"title":"공공재의 비배제성과 비경합성","lead":"가로등의 사례로 공공재의 두 특성을 알아보자.","sections":[["공공재","공공재는 비배제성과 비경합성을 가진 재화나 서비스이다. 국방과 치안 서비스가 대표적이다. 공공재의 두 특성은 대가를 내지 않은 사람도 소비할 수 있는지, 한 사람의 소비가 다른 사람의 소비 기회를 줄이는지에 관한 것이다."],["비배제성","비배제성은 대가를 지불하지 않은 사람을 소비에서 배제할 수 없는 특성이다. 가로등 설치비를 내지 않은 주민도 가로등의 불빛을 이용할 수 있다는 점에서 비배제성이 나타난다."],["비경합성","비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 한 주민이 가로등의 불빛을 이용하더라도 다른 주민의 이용 기회가 줄어들지 않는다는 점에서 비경합성이 나타난다."]],"example":{"p":"가로등이 골목을 비추고 있다. 설치비를 내지 않은 주민도 불빛을 이용할 수 있고, 한 주민이 이용해도 다른 주민의 이용 기회는 줄지 않는다. 가로등의 두 특성을 설명해 보자.","steps":["설치비를 내지 않은 주민의 이용을 막을 수 없으므로 비배제성이 있다.","한 주민이 불빛을 이용해도 다른 주민의 이용 기회가 줄지 않으므로 비경합성이 있다.","비배제성과 비경합성을 모두 가지므로 이 사례의 가로등은 공공재에 해당한다."],"result":"설치비를 내지 않아도 이용할 수 있다는 것은 비배제성, 함께 이용해도 다른 사람의 소비 기회가 줄지 않는다는 것은 비경합성이다."},"tip":{"rule":"비배제성은 대가를 내지 않은 사람의 이용과, 비경합성은 다른 사람의 소비 기회와 관련된다.","limit":"혼잡이나 이용 제한이 제시된 시설은 그 조건에 따라 두 특성이 나타나는지 살펴본다."},"advanced":"공공재는 대가를 내지 않아도 이용할 수 있으므로 비용을 부담하지 않으려는 무임승차가 나타날 수 있다. 이 때문에 민간 기업이 이윤을 얻기 어려워 필요한 만큼 공급하지 못할 수 있다. 공공재 부족은 시장 실패의 한 유형이다."},"PG-L2":{"title":"가로등 설치비 모금","lead":"설치에 성공할 때와 실패할 때 각 주민에게 남는 토큰과 편익을 계산해 보자.","sections":[["네 주민의 모금 활동","네 주민이 가로등 설치비를 모은다. 각 주민은 10토큰을 가지고 있으며 설치비는 24토큰이다. 가로등이 설치되면 비용을 냈는지와 관계없이 각자 편익 10을 얻는다. 설치에 실패하면 납부한 토큰은 모두 돌려받는다."],["설치에 성공한 경우","총모금액이 24토큰 이상이면 가로등을 설치한다. 각 주민이 납부한 토큰을 처음의 10토큰에서 빼면 남은 토큰이다. 여기에 가로등에서 얻는 편익 10을 더한다.\n\n남은 토큰과 편익의 합 = 10 − 납부액 + 10"],["설치에 실패한 경우","총모금액이 24토큰에 미치지 못하면 가로등을 설치하지 않는다. 납부액을 돌려받으므로 각 주민은 처음처럼 10토큰을 보유한다. 가로등은 설치되지 않았으므로 편익은 없다. 따라서 남은 토큰과 편익의 합은 10이다."]],"example":{"p":"네 주민이 모두 6토큰씩 낸다. 각자의 처음 보유액은 10토큰, 설치비는 24토큰, 설치 시 편익은 각자 10이다. 설치 후 남은 토큰과 편익의 합을 구해 보자.","steps":["총모금액은 6×4=24토큰으로 설치비가 모두 모인다.","각 주민은 6토큰을 내고 10−6=4토큰을 남긴다.","가로등에서 얻는 편익 10을 더하면 합은 14이다."],"result":"가로등 설치에 성공하며 각자의 남은 토큰과 편익의 합은 14이다."},"tip":{"rule":"먼저 모금액으로 가로등을 설치할 수 있는지 확인한다. 설치 여부에 따라 납부액 반환과 편익이 달라진다.","limit":"이 활동에서는 주민 4명과 위의 설치·반환 규칙을 적용한다. 앞선 모금 문제의 다른 주민 납부액은 공개된 값이다."},"advanced":"다른 주민의 납부액을 알면 내가 얼마를 더 내야 가로등을 설치할 수 있는지 계산할 수 있다. 그러나 다른 주민이 얼마를 내는지 모르면 설치 성공 여부도 달라질 수 있다. 같은 납부액을 선택하더라도 다른 주민의 행동에 따라 결과가 달라지는 것이다."},"PG-L3":{"title":"다른 주민의 납부액과 나의 선택","lead":"다른 주민이 낸 금액에 따라 내게 유리한 납부액이 달라지는 이유를 알아보자.","sections":[["설치비가 부족한 경우","다른 세 주민이 모두 18토큰을 냈다고 하자. 내가 6토큰을 내면 설치비 24토큰이 모두 모인다. 설치 후 남은 토큰과 편익의 합은 10−6+10=14이다. 제시된 납부액 0, 4, 6, 10 중에서는 6토큰이 가장 유리하다."],["설치비가 이미 모인 경우","다른 주민만으로 24토큰이 모였다면 내가 0토큰을 내도 가로등이 설치된다. 보유한 10토큰을 그대로 남기면서 편익 10을 얻으므로 합은 20이다. 추가로 돈을 내면 남은 토큰이 줄어들므로 이 경우에는 0토큰이 가장 유리하다."],["다른 주민의 납부액을 모르는 경우","두 상황에서 내게 유리한 납부액은 서로 다르다. 어느 상황이 발생하는지 모르고 각 상황의 확률도 주어지지 않았다면 하나의 납부액을 최선이라고 정하기 어렵다. 다른 주민의 납부액이나 행동에 관한 정보가 더 필요하다."]],"example":{"p":"내 납부액은 0, 4, 6, 10토큰 중 하나이다. 상황 A에서 다른 주민의 납부액 합계는 18토큰, 상황 B에서는 24토큰이다. 어느 상황인지와 각 상황의 발생 확률은 알려져 있지 않다. 두 경우에 내게 유리한 선택을 비교해 보자.","steps":["상황 A에서는 6토큰을 내면 설치에 성공하며 남은 토큰과 편익의 합이 14로 가장 크다.","상황 B에서는 비용을 내지 않아도 설치된다. 0토큰을 내면 합이 20으로 가장 크다.","상황에 따라 가장 유리한 납부액이 다르므로 추가 정보 없이 둘 중 하나를 최선이라고 정할 수는 없다."],"result":"다른 주민이 낸 금액을 알면 상황별로 유리한 선택을 계산할 수 있다. 그 금액이 알려져 있지 않은 경우에는 추가 정보가 필요하다."},"tip":{"rule":"다른 주민의 납부액이 달라졌을 때 설치 여부와 내게 남는 토큰을 다시 계산한다.","limit":"각 상황의 확률이 주어지지 않았다면 두 상황이 같은 확률로 발생한다고 가정하지 않는다."},"advanced":"모든 주민이 같은 금액을 낸다는 규칙이 정해져 있다면 그 규칙을 이용하여 총모금액을 구할 수 있다. 각자의 납부액을 모르는 상황과 공동의 납부 규칙이 정해진 상황은 다르다. 문제에 주어진 정보와 규칙에 따라 설치 결과를 계산한다."},"PG-L4":{"title":"무임승차와 정부의 공공재 공급","lead":"공공재가 시장에서 충분히 공급되지 않는 이유와 정부의 역할을 알아보자.","sections":[["무임승차자 문제","공공재는 대가를 지불하지 않은 사람도 이용할 수 있다. 따라서 비용을 부담하지 않고 혜택만 누리려는 무임승차가 나타날 수 있다. 가로등 비용은 다른 주민이 내기를 바라면서 불빛은 함께 이용하려는 경우가 그 예이다."],["공공재의 공급 부족","무임승차가 나타나면 민간 기업은 이용자에게 충분한 대가를 받기 어렵다. 공공재를 생산하여 비용을 회수하고 이윤을 얻기 어려우므로 생산을 줄이거나 포기할 수 있다. 그 결과 시장에서 사회가 필요로 하는 양만큼 공급되지 않을 수 있다."],["정부의 직접 공급","정부는 공공재의 생산과 공급에 직접 참여하여 공급 부족을 보완할 수 있다. 공공재 부족의 원인을 해결하기 위한 역할이다. 외부 불경제가 발생한 활동에 부담금을 부과하거나 제품 정보를 제공하여 정보의 비대칭성을 줄이는 역할과는 구별된다."]],"example":{"p":"설치비를 내지 않은 주민도 가로등을 이용할 수 있다. 이에 따라 다른 주민이 비용을 내기를 기다리면서 자신의 부담을 피하려는 사람이 늘었다. 공공재 부족이 발생할 수 있는 이유와 정부의 역할을 설명해 보자.","steps":["설치비를 내지 않은 주민도 이용할 수 있다는 것은 비배제성이다.","자신은 비용을 부담하지 않고 혜택을 누리려는 것은 무임승차이다.","비용이 충분히 모이지 않으면 공급이 부족해질 수 있다. 정부는 가로등을 직접 공급하여 이를 보완할 수 있다."],"result":"공공재의 비배제성으로 무임승차가 나타나 공급이 부족해질 수 있으며, 정부의 직접 공급은 이를 보완하는 방법이다."},"tip":{"rule":"무임승차는 비배제성과 관련된다. 비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다는 특성이다.","limit":"공급 부족이 발생할 수 있다는 것은 모든 모금이 반드시 실패한다는 뜻은 아니다."},"advanced":"공공재인지는 공급 주체만으로 구분하지 않는다. 정부가 공급하는 재화도 이용료를 내지 않은 사람을 배제할 수 있거나 한 사람의 소비로 다른 사람의 소비 기회가 줄어들 수 있다. 비배제성과 비경합성이라는 소비의 특성을 살펴야 한다."},"TR-L1":{"title":"절대 우위와 비교 우위","lead":"생산 능력과 생산의 기회비용을 구별해 보자.","sections":[["절대 우위","절대 우위는 다른 생산자보다 같은 상품을 더 적은 비용으로 생산할 수 있는 능력이다. 같은 총노동량을 투입하여 더 많은 양을 생산하는 나라는 그 재화에 절대 우위를 갖는다. 생산량만 주어졌다면 투입한 노동량도 같았는지 알아야 한다."],["비교 우위","비교 우위는 같은 재화를 더 작은 기회비용으로 생산할 수 있는 능력이다. 한 나라가 두 재화를 모두 많이 생산할 수 있더라도, 재화 한 개를 만들 때 포기하는 다른 재화의 수량은 상대국보다 많을 수 있다. 따라서 절대 우위와 비교 우위는 구별된다."],["최대 생산량","양국이 같은 총노동량으로 X재와 Y재만 생산하고 생산 가능 곡선은 직선이라고 하자. 모든 노동을 한 재화에 쓰면 A국은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개를 생산한다. 최대 생산량은 모든 노동을 해당 재화에 사용할 때의 양이므로 두 재화의 최대량을 동시에 생산할 수는 없다."]],"example":{"p":"A국은 모든 노동을 투입하면 X재를 24개 또는 Y재를 12개 생산할 수 있다. 생산 가능 곡선은 직선이다. X재 1개 생산의 기회비용과 X재 18개를 만들 때 함께 생산할 수 있는 Y재의 최대량을 구해 보자.","steps":["X재 24개를 생산하면 대신 생산할 수 있었던 Y재 12개를 포기한다.","X재 1개 생산의 기회비용은 Y재 12÷24=1/2개이다.","X재 18개에 자원의 18/24를 쓰고 1/4을 남긴다. 따라서 Y재는 최대 12×1/4=3개를 생산할 수 있다."],"result":"X재 1개의 기회비용은 Y재 1/2개이다. X재 18개와 Y재 3개를 생산하는 조합은 생산 가능 곡선 위에 있다."},"tip":{"rule":"최대 생산량표에서 X재 1개의 기회비용은 Y재의 최대량을 X재의 최대량으로 나누어 구한다.","limit":"자원과 기술이 고정되어 있고 생산 가능 곡선이 직선인 경우의 계산이다."},"advanced":"생산 가능 곡선의 절편은 모든 자원을 한 재화에 투입했을 때의 최대 생산량이다. 곡선 위의 조합은 주어진 자원을 모두 효율적으로 사용한 경우이다. 곡선 안쪽에서는 더 생산할 여지가 있지만, 곡선 바깥쪽은 주어진 자원과 기술로 생산할 수 없다."},"TR-L2":{"title":"노동시간표와 최대 생산량표","lead":"같은 생산 조건을 두 종류의 표로 나타내어 기회비용을 구해 보자.","sections":[["최대 생산량으로 구하기","A국은 X재 24개 대신 Y재 12개를 생산할 수 있다. 따라서 X재 1개를 만드는 데 포기하는 Y재는 12÷24=1/2개이다. B국의 최대량은 X재와 Y재 모두 8개이므로 X재 1개의 기회비용은 Y재 1개이다. 기회비용이 더 작은 A국은 X재에 비교 우위를 갖는다."],["노동시간으로 구하기","X재 1개에 2시간, Y재 1개에 4시간이 필요하다고 하자. X재를 만드는 데 쓴 2시간으로 Y재를 2/4개 만들 수 있었다. 따라서 X재 1개 생산의 기회비용은 Y재 1/2개이다. 이때는 X재에 필요한 시간을 Y재에 필요한 시간으로 나눈다."],["총노동량과 최대 생산량","총노동량을 알면 노동시간표를 최대 생산량표로 바꿀 수 있다. 총노동량을 재화 1개당 노동시간으로 나눈 값이 그 재화의 최대 생산량이다. 두 표가 같은 생산 조건을 나타낸다면 계산한 기회비용도 같다."]],"example":{"p":"총노동량은 각국 48시간이다. 재화 1개당 필요한 노동시간은 A국이 X재 2시간, Y재 4시간이고 B국은 X재와 Y재 모두 6시간이다. 두 표로 나타낸 생산량과 기회비용을 비교해 보자.","steps":["A국의 최대 생산량은 X재 48÷2=24개 또는 Y재 48÷4=12개이다. B국은 두 재화 모두 각각 최대 8개이다.","노동시간으로 계산한 X재 1개의 기회비용은 A국이 Y재 2/4=1/2개, B국이 Y재 6/6=1개이다.","최대 생산량으로 계산하면 A국은 Y재 12/24=1/2개, B국은 Y재 8/8=1개로 같다."],"result":"노동시간표와 최대 생산량표는 수치의 의미가 다르지만, 같은 생산 조건이라면 기회비용은 같다."},"tip":{"rule":"X재 1개의 기회비용: 최대 생산량표에서는 ‘Y재 최대량÷X재 최대량’, 노동시간표에서는 ‘X재의 시간÷Y재의 시간’이다.","limit":"같은 생산 요소와 단위로 비교한다. 양국의 기회비용이 같다면 어느 한 나라만 비교 우위에 있지 않다."},"advanced":"직선인 생산 가능 곡선에서 두 재화 생산의 기회비용은 서로 역수이다. X재 1개의 기회비용이 Y재 1/2개라면 Y재 1개의 기회비용은 X재 2개이다. 결과에 포기한 재화의 단위를 붙이면 무엇의 생산 비용인지 분명해진다."},"TR-L3":{"title":"양국에 유리한 교환 비율","lead":"직접 생산할 때와 교환할 때를 비교하여 양국의 이익을 계산해 보자.","sections":[["X재 1개당 교환하는 Y재","A국의 최대 생산량은 X재 24개 또는 Y재 12개이고 B국은 X재 8개 또는 Y재 8개이다. A국은 X재만, B국은 Y재만 생산한다. X재 q개와 Y재 y개를 교환한다면 X재 1개당 교환하는 Y재는 y/q개이다."],["양국이 이익을 얻는 조건","A국은 X재 q개 생산으로 Y재 q/2개를 포기하므로 그보다 많은 Y재를 받아야 이익이다. B국은 X재 q개를 직접 생산하려면 Y재 q개를 포기해야 하므로 그보다 적게 지급해야 이익이다. 따라서 양국 모두 이익을 얻는 범위는 1/2<y/q<1이다."],["실제로 교환할 수 있는 수량","A국이 생산한 X재는 24개, B국이 생산한 Y재는 8개이다. 다른 나라와의 거래나 재고가 없다면 각국은 이 수량보다 많이 수출할 수 없다. 교환 비율이 유리하더라도 실제 보유량이 부족하면 교환을 실행할 수 없다."]],"example":{"p":"A국은 X재 24개, B국은 Y재 8개만 생산하였다. A국이 X재 6개를 주고 Y재 4개를 받는다. 생산 가능 곡선은 직선이며 두 나라만 거래한다. 재고와 거래 비용은 없다. 각국의 이익과 최종 보유량을 구해 보자.","steps":["교환 비율은 X재 1개당 Y재 4/6=2/3개로, 양국의 기회비용 1/2과 1 사이에 있다.","A국은 X재 6개를 생산하며 Y재 3개를 포기하지만 교환으로 4개를 받는다. 이익은 Y재 1개이다.","B국은 X재 6개를 직접 만들려면 Y재 6개를 포기해야 하지만 4개만 지급한다. Y재 2개를 절약한다.","교역 후 A국은 X재 18개와 Y재 4개, B국은 X재 6개와 Y재 4개를 보유한다."],"result":"A국은 Y재 1개, B국은 Y재 2개의 이익을 얻는다. 두 나라의 이익이 같지 않아도 양국 모두에게 유리한 교환이다."},"tip":{"rule":"수출국은 생산에 따른 기회비용보다 많이 받아야 하고, 수입국은 직접 생산할 때의 기회비용보다 적게 지급해야 이익이다.","limit":"두 나라·두 재화, 직선인 생산 가능 곡선, 정해진 특화 방향, 거래 비용이 없는 조건을 적용한다."},"advanced":"국가 전체가 재화를 더 많이 소비할 수 있게 되더라도 그 이익이 모든 개인에게 똑같이 돌아가는 것은 아니다. 개인별 이익을 알려면 국내의 생산과 소비, 소득 분배에 관한 자료를 더 살펴야 한다."},"TR-L4":{"title":"교환 비율의 범위와 소비량","lead":"교역 이익이 0이 되는 경우를 알아보고, 소비량으로 생산량과 교환량을 구해 보자.","sections":[["한 나라의 이익이 0인 경우","X재 1개 생산의 기회비용이 A국은 Y재 1/2개, B국은 Y재 1개라고 하자. X재 1개와 Y재 1/2개를 교환하면 A국은 직접 생산할 때와 차이가 없다. Y재 1개와 교환하면 B국의 이익이 0이다. 양국 모두 양의 이익을 얻어야 한다면 두 경계값을 제외해야 한다."],["소비량으로 생산량 구하기","양국이 서로 다른 재화만 생산하고 재고나 손실, 다른 거래가 없다면 각 재화의 소비량 합계는 생산 총량과 같다. 생산하지 않은 재화를 소비한 양은 상대국에서 수입한 양이다. 이를 이용하여 특화 생산량과 교환량을 구할 수 있다."],["생산의 기회비용이 같은 경우","A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 4개라고 하자. X재 1개 생산의 기회비용이 양국 모두 Y재 1/2개로 같다. 이 경우에는 A국이 1/2개보다 많이 받으면서 동시에 B국이 1/2개보다 적게 지급할 수 없으므로 양국 모두 이익인 교환 비율이 없다."]],"example":{"p":"교역 후 A국은 X재 18개와 Y재 4개, B국은 X재 6개와 Y재 4개를 소비한다. A국은 X재만, B국은 Y재만 생산하였다. 다른 나라와의 거래, 재고, 손실은 없다. 생산량과 교환량을 구해 보자.","steps":["X재 소비량 합계는 18+6=24개이고, Y재 소비량 합계는 4+4=8개이다. 각각 A국과 B국의 생산량이다.","A국이 가진 Y재 4개는 B국에서 수입한 것이다. B국이 가진 X재 6개는 A국에서 수입한 것이다.","따라서 X재 6개와 Y재 4개를 교환하였다. 교환 비율은 X재 1개당 Y재 2/3개이다."],"result":"A국은 X재 24개, B국은 Y재 8개를 생산하고, 그중 X재 6개와 Y재 4개를 교환하였다."},"tip":{"rule":"같은 재화의 소비량을 더하면 생산 총량이다. 각국이 생산하지 않은 재화의 소비량은 수입량이다.","limit":"완전 특화, 양국 사이의 거래만 존재, 재고와 손실이 없다는 조건이 필요하다."},"advanced":"‘양의 이익’은 이익이 0보다 커야 한다는 뜻이다. ‘손해를 보지 않는다’는 조건에는 이익이 0인 경우도 포함된다. 교환 비율의 범위를 구할 때에는 문제에서 두 조건 중 어느 것을 요구하는지 구별해야 한다."}},"STAGES":{"CH-L1":{"title":"명시적 비용과 암묵적 비용"},"CH-L2":{"title":"기회비용과 순편익"},"CH-L3":{"title":"매몰 비용과 비용의 변화"},"CH-L4":{"title":"포기한 가치와 순편익의 변화"},"CH-T1":{"title":"편익과 두 비용의 구분","prompt":"공연을 선택하였다. 각 설명에 해당하는 개념을 고르시오.","why":"공연을 보면서 얻는 만족은 편익이다. 실제로 낸 표 값은 명시적 비용이고, 대신 일을 해서 얻을 수 있었던 가치는 암묵적 비용이다.","hint":"얻는 만족, 직접 지출하는 돈, 포기한 기회의 가치를 구별해 보세요.","data":{"rows":{"2":"대신 일을 했다면 비용을 제외하고 얻을 수 있었던 7만 원"}}},"CH-T2":{"title":"가장 유리한 활동과 포기한 대안","prompt":"세 활동 중 하나만 선택한다. 가장 유리한 활동을 고르고, 그 활동을 선택할 때 포기하는 다른 대안 중 가장 가치가 큰 것을 고르시오.","why":"편익에서 명시적 비용을 빼면 A는 22, B는 26, C는 25이다. B의 값이 가장 크므로 B가 유리하다. B를 선택하면 남은 A와 C 중 더 큰 가치인 C의 25를 포기한다.","hint":"각 활동의 편익에서 명시적 비용을 빼세요. 선택한 활동을 제외한 나머지 중에서 포기한 가치를 찾습니다."},"CH-T3":{"title":"B 선택의 기회비용과 순편익","prompt":"세 활동 중 B를 선택한다. B 선택의 암묵적 비용, 기회비용, 순편익을 만 원 단위로 구하시오.","why":"B를 선택할 때 포기한 대안 중 가장 큰 가치는 C의 32−7=25만 원이다. B의 명시적 비용은 10만 원이므로 기회비용은 35만 원이다. 순편익은 편익에서 기회비용을 뺀 36−35=1만 원이다.","hint":"C를 포기한 가치 25에 B의 명시적 비용을 더하면 기회비용입니다."},"CH-T4":{"title":"새로운 세 대안의 기회비용","prompt":"A, B, C 중 하나만 선택한다. 표의 비용은 앞으로 지출할 명시적 비용이다. B 선택의 암묵적 비용, 기회비용, 순편익을 구하시오.","why":"편익에서 명시적 비용을 빼면 A는 18, B는 21, C는 19이다. B를 선택하면 남은 대안 중 더 큰 C의 19를 포기한다. 기회비용은 7+19=26이고 순편익은 28−26=2이다.","hint":"B를 선택할 때 포기하는 A와 C의 가치를 비교하세요."},"CH-T5":{"title":"C가 가장 유리해지는 비용","prompt":"B의 명시적 비용만 정수로 높일 수 있다. C가 다른 두 대안보다 더 유리해지는 B의 명시적 비용 중 가장 작은 정수를 구하시오.","why":"B의 비용이 11이면 편익에서 명시적 비용을 뺀 값이 25로 C와 같다. 비용이 12가 되면 B는 24로 작아진다. 따라서 비용이 12일 때 C가 다른 두 대안보다 유리하다.","hint":"C와 B가 같은 경우가 아니라 C가 더 유리해지는 값을 찾아야 합니다."},"CH-T6":{"title":"과거 지출만 커진 경우","prompt":"앞으로 각 대안에서 얻을 편익과 부담할 비용은 같다. 어떤 선택에서도 회수할 수 없는 과거 지출만 60에서 200으로 커졌다. 이에 대한 설명으로 옳은 것은?","why":"과거 지출은 매몰 비용이다. 현재의 선택에 따른 편익과 비용이 변하지 않았으므로 유리한 대안도 그대로이다.","hint":"현재의 선택은 회수할 수 없는 과거 지출을 제외하고 비교합니다."},"CH-T7":{"title":"순편익이 줄어드는 조건","prompt":"A와 B의 조건은 그대로이고 C의 편익만 0.5씩 높일 수 있다. B가 다른 두 대안보다 더 유리하면서 B의 순편익이 0보다 크고 1보다 작아지도록 C의 편익을 조절하시오.","why":"C의 편익이 32.5이면 명시적 비용 7을 뺀 값은 25.5이다. B의 26보다 작으므로 B가 여전히 가장 유리하다. 그러나 B의 순편익은 26−25.5=0.5로 줄어든다.","hint":"B의 26과 C의 ‘편익−명시적 비용’ 사이의 차이가 0보다 크고 1보다 작아야 합니다."},"CH-W":{"title":"암묵적 비용을 자신의 말로 설명하기","prompt":"암묵적 비용을 구할 때 왜 포기한 대안들의 가치를 모두 더하지 않는지 설명해 보자.","data":{"checks":["대안 중 하나만 선택할 수 있다는 조건을 설명하였다.","명시적 비용, 암묵적 비용, 기회비용, 순편익의 뜻을 구별하였다.","가장 유리한 대안이 그대로여도 순편익이 달라지는 예를 들었다."],"starter":"여러 대안 중 하나만 선택할 수 있다면…"},"why":"쓴 글을 저장한 뒤, 개념 설명과 예제 풀이를 보며 내용을 확인해 보자. 작성한 글은 자동 채점하지 않는다.","hint":"각 대안의 편익에서 명시적 비용을 뺀 값이 22, 26, 25인 예제를 활용해 보세요."},"PG-L1":{"title":"공공재의 비배제성과 비경합성"},"PG-L2":{"title":"가로등 설치비 모금"},"PG-L3":{"title":"다른 주민의 납부액과 나의 선택"},"PG-L4":{"title":"무임승차와 정부의 공공재 공급"},"PG-T1":{"title":"공공재의 두 특성","prompt":"각 설명에 해당하는 공공재의 특성을 고르시오.","why":"대가를 내지 않은 사람의 소비를 막을 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는 것은 비경합성이다.","hint":"비용을 내지 않은 사람의 이용과 다른 사람의 소비 기회를 구별하세요."},"PG-T2":{"title":"주민 전체의 편익과 설치비","prompt":"이번 활동의 주민 수는 20명이다. 가로등 설치비는 12만 원이며, 설치되면 각 주민은 편익 1만 원을 얻는다. 다른 편익과 비용은 없다. 주민 전체의 추가 편익과, 그 총편익에서 설치비를 뺀 금액을 만 원 단위로 구하시오.","why":"주민 전체의 추가 편익은 20×1=20만 원이다. 설치비 12만 원을 빼면 8만 원이다. 전체 편익이 설치비보다 크더라도 실제로 설치비가 모이는지는 별도로 살펴야 한다.","hint":"주민 20명의 편익을 먼저 합하세요. 뒤의 4인 활동과 주민 수가 다릅니다."},"PG-T3":{"title":"부족한 설치비와 나의 납부액","prompt":"네 주민은 각각 10토큰을 가지고 있다. 설치비는 24토큰이며, 설치되면 각자 편익 10을 얻는다. 실패하면 납부액을 돌려받는다. 다른 세 주민은 각각 6토큰씩 냈다. 내 납부액 0, 4, 6, 10 중 가장 유리한 것을 고르고 남은 토큰과 편익의 합을 구하시오.","why":"다른 주민의 납부액은 18토큰이다. 내가 6토큰을 내면 설치에 성공하여 남은 토큰과 편익의 합이 14이다. 0이나 4를 내면 설치에 실패하여 처음의 10토큰을 보유한다. 10을 내면 설치되지만 합은 10이므로 6토큰이 가장 유리하다.","hint":"6토큰을 내면 설치비 24가 모두 모입니다. 다른 납부액의 결과와 비교해 보세요."},"PG-T4":{"title":"설치비가 이미 모인 경우","prompt":"각자 10토큰을 가지고 있으며 설치비는 24토큰, 설치 편익은 각자 10이다. 실패하면 납부액을 돌려받는다. 다른 세 주민은 각각 8토큰씩 냈다. 내 납부액 0, 4, 6, 10 중 가장 유리한 것을 고르고 남은 토큰과 편익의 합을 구하시오.","why":"다른 주민만으로 8×3=24토큰이 모였다. 내가 내지 않아도 설치되므로 0토큰을 내면 보유 토큰 10을 남기고 편익 10을 얻는다. 합은 20이다.","hint":"다른 주민이 이미 설치비를 모두 냈습니다."},"PG-T5":{"title":"납부액을 정하기에 부족한 정보","prompt":"다른 주민의 납부액 합계가 18인지 24인지 알 수 없고, 두 상황의 발생 확률도 모른다. 앞선 두 상황에서 같은 납부액이 언제나 가장 유리한가?","why":"합계가 18이면 6토큰, 24이면 0토큰을 내는 것이 가장 유리하다. 상황별 선택이 다르므로 추가 정보 없이 하나를 최선이라고 정할 수는 없다.","hint":"두 상황에서 가장 유리했던 납부액이 같은지 비교하세요."},"PG-T6":{"title":"조건에 맞는 비용 분담","prompt":"이번 활동에서는 주민 4명의 납부액 합계가 정확히 24이고 누구도 6을 넘게 내지 않기로 합의하였다. 두 조건을 충족하도록 각 주민의 납부액을 정하시오.","why":"한 사람이 낼 수 있는 최대액은 6이다. 네 사람이 모두 최대액을 내야 6×4=24가 되므로 각자 6씩 내야 한다.","hint":"누군가 6보다 적게 내면, 다른 사람도 6을 넘게 낼 수 없으므로 합계 24에 도달하지 못합니다."},"PG-T7":{"title":"공공재에 관한 종합 문제","prompt":"공공재의 개념과 이번 모금 활동에 대한 설명으로 옳은 것을 모두 고르시오.","why":"비배제성은 비용을 내지 않은 사람도 이용할 수 있는 특성이고, 비경합성은 다른 사람의 소비 기회가 줄지 않는 특성이다. 정부는 공급 부족을 보완하기 위해 공공재를 직접 공급할 수 있다. 무임승차가 가능하더라도 설치비가 충분히 모이면 설치에 성공한다.","hint":"공공재의 정의와 설치에 필요한 모금액을 각각 적용해 보세요."},"PG-W":{"title":"공공재와 정부의 역할 설명하기","prompt":"가로등의 비배제성과 비경합성을 설명하고, 무임승차와 공급 부족이 나타날 수 있는 이유 및 정부의 역할을 정리해 보자.","data":{"checks":["가로등의 두 특성을 각각 설명하였다.","20인 활동과 4인 활동의 인원과 규칙을 구별하였다.","무임승차가 공급 부족으로 이어질 수 있는 이유를 설명하였다."],"starter":"가로등은 설치비를 내지 않은 주민도 이용할 수 있다. 이처럼…"},"why":"쓴 글을 저장한 뒤 개념 설명과 비교해 보자. 작성한 글은 자동 채점하지 않는다.","hint":"비배제성 때문에 무임승차가 나타날 수 있고, 비용을 충분히 걷기 어려워 공급이 부족해질 수 있습니다."},"TR-L1":{"title":"절대 우위와 비교 우위"},"TR-L2":{"title":"노동시간표와 최대 생산량표"},"TR-L3":{"title":"양국에 유리한 교환 비율"},"TR-L4":{"title":"교환 비율의 범위와 소비량"},"TR-T1":{"title":"같은 노동량과 절대 우위","prompt":"같은 총노동량으로 한 재화만 생산할 때 A국은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개를 최대로 생산한다. 절대 우위에 대한 설명으로 옳은 것은?","why":"같은 노동량으로 A국이 두 재화 모두 더 많이 생산하므로 두 재화에 모두 절대 우위를 갖는다. 비교 우위는 기회비용을 계산하여 구분한다.","hint":"X재와 Y재 각각의 생산량을 나라별로 비교하세요."},"TR-T2":{"title":"X재와 함께 생산할 Y재","prompt":"A국은 X재를 최대 24개 또는 Y재를 최대 12개 생산할 수 있다. 생산 가능 곡선이 직선일 때 X재 생산량을 18개로 맞추고, 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.","why":"X재 18개를 만들려면 자원의 18/24=3/4이 필요하다. 남은 자원 1/4로 Y재는 최대 12×1/4=3개를 만들 수 있다.","hint":"X재에 쓰고 남은 자원의 비율을 Y재의 최대 생산량에 곱하세요."},"TR-T3":{"title":"최대 생산량으로 기회비용 구하기","prompt":"양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 최대 생산량은 A국이 X재 24개 또는 Y재 12개, B국이 X재 8개 또는 Y재 8개이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","data":{"labels":["A국의 X재 1개 기회비용(Y재 개)","B국의 X재 1개 기회비용(Y재 개)"]},"why":"A국은 X재 24개 생산으로 Y재 12개를 포기하므로 X재 1개의 기회비용은 Y재 1/2개이다. B국에서는 Y재 8÷8=1개이다.","hint":"포기하는 Y재의 최대량을 X재의 최대량으로 나누세요."},"TR-T4":{"title":"노동시간으로 기회비용 구하기","prompt":"재화 1개당 노동시간은 A국이 X재 3시간, Y재 6시간이고 B국은 X재 6시간, Y재 4시간이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.","data":{"labels":["A국의 X재 1개 기회비용(Y재 개)","B국의 X재 1개 기회비용(Y재 개)"]},"why":"A국에서 X재에 쓰는 3시간으로는 Y재 3/6=1/2개를 만들 수 있다. B국에서 X재에 쓰는 6시간으로는 Y재 6/4=3/2개를 만들 수 있다.","hint":"X재 1개에 쓰는 시간으로 생산할 수 있었던 Y재를 구합니다."},"TR-T5":{"title":"양국이 이익을 얻는 교환","prompt":"A국의 최대 생산량은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개이다. A국은 X재 24개만, B국은 Y재 8개만 생산하였다. X재 6개와 교환할 Y재 수량을 정하여 양국 모두 양의 이익을 얻도록 하시오. 각국의 이익을 Y재 수량으로 구하시오.","why":"A국은 X재 6개 생산으로 Y재 3개를 포기하므로 3개보다 많이 받아야 한다. B국은 X재 6개를 직접 만들려면 Y재 6개를 포기해야 하므로 6개보다 적게 지급해야 한다. 따라서 교환할 Y재 수량은 3개 초과 6개 미만이다.","hint":"A국의 이익은 받은 Y재에서 3을 뺀 값, B국의 이익은 6에서 지급한 Y재를 뺀 값입니다."},"TR-T6":{"title":"정해진 교환 후의 보유량","prompt":"이번에는 X재 6개와 Y재 4개를 교환한다. 교역 전 A국은 X재 24개만, B국은 Y재 8개만 생산하였다. 각국의 교역 후 보유량을 구하시오.","data":{"labels":["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"]},"why":"A국은 X재 24−6=18개와 Y재 4개를 보유한다. B국은 X재 6개와 Y재 8−4=4개를 보유한다. 같은 재화의 양국 보유량을 합하면 생산 총량과 같다.","hint":"앞 문제에서 제안한 수량이 아니라 이번에 지정한 X재 6개, Y재 4개를 적용하세요."},"TR-T7":{"title":"교환 비율과 양국의 이익","prompt":"첫 네 경우에서 X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 마지막 경우에서만 B국의 생산 조건이 달라진다. 각 교환의 결과를 구분하시오.","data":{"rows":["X재 1개와 Y재 0.5개를 교환","X재 1개와 Y재 0.75개를 교환","X재 1개와 Y재 1개를 교환","X재 1개와 Y재 1.2개를 교환","새 조건: 최대 생산량은 B국이 X재 8개·Y재 4개, A국은 X재 24개·Y재 12개"],"options":["A국의 추가 이익이 0","양국의 추가 이익이 모두 양수","B국의 추가 이익이 0","B국에 자급 생산보다 불리한 교환","양국 모두 양의 추가 이익을 얻는 비율이 없음"]},"why":"X재 1개당 교환하는 Y재가 0.5개이면 A국의 이익이 0이고, 1개이면 B국의 이익이 0이다. 두 값 사이에서는 양국 모두 이익이다. 1.2개를 지급해야 한다면 B국은 직접 생산하는 것이 유리하다. 마지막 경우에는 양국의 기회비용이 모두 0.5개여서 양국 모두 이익인 교환 비율이 없다.","hint":"마지막 경우에는 B국의 새 최대 생산량으로 기회비용을 다시 구하세요."},"TR-W":{"title":"비교 우위와 무역의 이익 설명하기","prompt":"한 나라가 두 재화를 모두 더 많이 생산할 수 있어도 다른 나라와 무역하는 이유를 기회비용과 교환의 예로 설명해 보자.","data":{"checks":["같은 투입량으로 비교하는 절대 우위와 기회비용으로 비교하는 비교 우위를 구별하였다.","교환 비율과 양국의 이익을 계산하고 단위를 적었다.","직선인 생산 가능 곡선, 거래 비용, 특화에 관한 조건을 설명하였다."],"starter":"한 나라가 두 재화 모두 절대 우위를 갖더라도…"},"why":"쓴 글을 저장한 뒤 개념 설명과 계산 결과를 비교해 보자. 작성한 글은 자동 채점하지 않는다.","hint":"각국의 기회비용을 구하고, 그 사이의 교환 비율에서 양국이 얻는 이익을 설명해 보세요."}},"CL41":{"L00-1":{"title":"선택의 편익과 비용","goal":"선택으로 얻는 편익과 부담하는 비용을 알아보자.","headings":["선택과 편익","직접 지출한 돈과 포기한 기회","편익과 비용의 비교"],"paragraphs":["편익은 어떤 선택으로 얻는 이득이나 만족감이다. 일을 하고 받는 보수뿐 아니라 공연을 보며 느끼는 만족도 편익에 포함된다. 사람마다 원하는 것이 다르므로 같은 활동에서 얻는 편익도 다를 수 있다.","어떤 대안을 선택하면 돈을 지출하기도 하고, 다른 활동을 할 기회를 포기하기도 한다. 공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다면, 공연을 보기 위해서는 관람료를 내고 일을 해서 받을 수 있었던 보수도 포기해야 한다. 선택의 비용에는 직접 지출한 돈과 포기한 기회의 가치가 모두 포함된다.","합리적으로 선택하려면 각 대안에서 얻는 편익과 부담하는 비용을 비교해야 한다. 계산 문제에서는 만족의 크기를 화폐 단위로 제시하기도 한다. 이 경우 주어진 금액을 편익으로 사용한다. 여러 사람의 선택을 다루는 문제에서는 각 사람의 편익과 비용을 따로 계산한다."],"example":"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 관람료는 2만 원이며, 일을 하면 보수 5만 원을 받는다. 다른 비용은 없다. 공연을 선택할 때의 기회비용을 구해 보자.","steps":["선택할 수 있는 활동은 공연 관람과 일이다. 공연을 선택하면 일을 할 수 없다.","공연 관람료 2만 원을 직접 지출하고, 일을 했다면 받을 수 있었던 보수 5만 원을 포기한다.","두 금액을 합하면 공연 선택의 기회비용은 2+5=7만 원이다."],"result":"공연 선택의 기회비용은 관람료 2만 원과 포기한 보수 5만 원을 합한 7만 원이다.","tip":"기회비용을 구할 때에는 직접 지출한 돈뿐 아니라 다른 대안을 선택했다면 얻을 수 있었던 가치도 고려한다.","caution":"여러 대안 중 하나만 선택할 수 있다면, 포기한 대안들의 가치를 모두 더하지 않고 그중 가장 큰 가치를 고려한다.","check":{"q":"어떤 활동을 선택하면서 다른 활동에서 얻을 수 있었던 만족을 포기하였다. 이 만족은 선택의 비용에 포함되는가?","o":["현금으로 받은 것이 아니므로 비용에서 제외한다.","포기한 대안의 가치이므로 비용에 포함한다."],"why":"선택의 비용에는 직접 지출한 금액과 포기한 기회의 가치가 포함된다. 돈으로 받은 것이 아니어도 포기한 만족은 비용이 될 수 있다."},"origin":""},"L00-2":{"title":"분수와 백분율","goal":"백분율로 나타낸 비율을 이용하여 금액을 계산해 보자.","headings":["백분율의 의미","분수에 쓰인 단위","이자와 원리금"],"paragraphs":["백분율은 기준이 되는 전체를 100으로 보았을 때 비교하는 값의 크기이다. 100만 원 중 20만 원의 비율은 20÷100=0.2이므로 20%이다. 어떤 금액의 5%를 구하려면 그 금액에 5÷100, 즉 0.05를 곱한다.","분수로 나타낸 값에도 단위가 필요하다. X재 1개 생산의 기회비용이 Y재 1/2개라는 것은 X재 한 개를 더 생산하기 위해 Y재 반 개를 포기해야 한다는 뜻이다. 같은 1/2이라도 어느 재화의 양을 나타내는지에 따라 의미가 달라진다.","원금을 맡긴 대가로 받는 돈을 이자라고 한다. 원금과 이자를 합한 금액은 원리금이다. 예를 들어 원금 300에 대한 이자율이 4%라면 이자는 300×0.04로 구한다. 원리금을 구할 때에는 계산한 이자를 원금에 더한다."],"example":"원금 200만 원을 연 5%의 단리로 1년 동안 맡긴다. 세금과 수수료는 없다. 이자와 원리금을 각각 구해 보자.","steps":["5%를 소수로 나타내면 0.05이다.","원금에 이자율을 곱하면 이자는 200×0.05=10만 원이다.","원리금은 원금에 이자를 더한 200+10=210만 원이다."],"result":"이자는 10만 원, 원리금은 210만 원이다.","tip":"1%에 해당하는 금액은 전체 금액을 100으로 나누어 구한다. 5%는 10%에 해당하는 금액의 절반이다.","caution":"연 이자율은 1년을 기준으로 한 비율이다. 이자를 계산할 때에는 돈을 맡긴 기간도 함께 고려한다.","check":{"q":"300만 원의 4%는 얼마인가?","why":"300×0.04=12이므로 12만 원이다."},"origin":""},"L00-3":{"title":"금액의 단위와 수입·지출 시점","goal":"금액의 단위를 맞추고, 돈이 들어오고 나가는 시점을 살펴보자.","headings":["표에 제시된 값의 의미","기간과 통화의 환산","수입보다 지출이 먼저 발생하는 경우"],"paragraphs":["경제 자료의 숫자는 표의 제목과 단위에 따라 의미가 달라진다. 재화 한 개를 만드는 데 필요한 노동시간은 투입량을 나타낸다. 일정한 노동으로 만들 수 있는 재화의 최대 수량은 생산량을 나타낸다. 두 표는 서로 다른 정보를 담고 있으므로 계산 방법도 달라진다.","금액을 비교하려면 기간과 통화의 단위를 맞추어야 한다. 같은 월급을 12번 받는다면 월급에 12를 곱하여 연간 수입을 구한다. 달러로 표시된 금액과 원화로 표시된 금액은 주어진 환율로 환산한 뒤 비교한다. 환율이 달라졌다면 각 거래가 이루어진 시점의 환율을 적용한다.","전체 수입이 전체 지출보다 많아도 필요한 날짜에 돈이 부족할 수 있다. 수입이 들어오기 전에 지출해야 한다면 그때까지 보유한 자금으로 지출을 감당해야 하기 때문이다. 따라서 자금 계획을 세울 때에는 수입과 지출의 금액뿐 아니라 발생 시점도 고려해야 한다."],"example":"초기 자금은 0이다. 1개월째 말에 30만 원을 지출해야 하고, 2개월째 초에 50만 원의 수입이 들어온다. 대출을 받거나 지출을 미룰 수 없다. 첫 지출을 제때 할 수 있는지 판단해 보자.","steps":["첫 지출일은 1개월째 말이며, 필요한 금액은 30만 원이다.","초기 자금이 없고 첫 지출일까지 들어온 수입도 없으므로 사용할 수 있는 돈은 0이다.","50만 원의 수입은 2개월째 초에 들어온다. 따라서 1개월째 말의 지출에 사용할 수 없다."],"result":"전체 수입은 지출보다 많지만, 첫 지출일에 돈이 없어 30만 원을 제때 낼 수 없다.","tip":"날짜순으로 이전 잔액에 수입을 더하고 지출을 빼면, 어느 시점에 자금이 부족한지 알 수 있다.","caution":"수입과 지출이 같은 달에 발생해도 월초인지 월말인지에 따라 사용할 수 있는 자금이 달라질 수 있다.","check":{"q":"매월 400만 원을 12번 받는다면 연간 수입은 얼마인가?","why":"400×12=4,800이므로 연간 수입은 4,800만 원이다."},"origin":""},"L00-4":{"title":"생산량표와 투입량표","goal":"최대 생산량과 단위당 투입량의 차이를 알아보자.","headings":["최대 생산량","단위당 투입량","표의 종류와 기회비용 계산"],"paragraphs":["최대 생산량표는 주어진 생산 요소를 모두 투입할 때 각 재화를 얼마나 생산할 수 있는지 나타낸다. 투입하는 노동량이 같다면 최대 생산량이 많은 쪽의 생산성이 높다. 최대 생산량을 비교할 때에는 두 생산자가 같은 양의 생산 요소를 사용하는지 확인해야 한다.","단위당 투입량표는 재화 한 단위를 생산하는 데 필요한 노동이나 비용을 나타낸다. 같은 재화를 생산하는 데 필요한 투입량이 적을수록 생산성이 높다. 최대 생산량표에서는 생산량이 큰 쪽이, 단위당 투입량표에서는 투입량이 작은 쪽이 유리하다.","기회비용은 한 재화를 더 생산하기 위해 포기해야 하는 다른 재화의 양이다. 최대 생산량으로 계산할 때와 단위당 노동시간으로 계산할 때에는 나누는 방향이 다르다. 최대 생산량표에서는 포기하는 재화의 최대 생산량을 생산하려는 재화의 최대 생산량으로 나눈다. 노동시간표에서는 생산하려는 재화의 노동시간을 포기하는 재화의 노동시간으로 나눈다."],"example":"자료 A에서는 같은 노동량으로 X재를 최대 24개 또는 Y재를 최대 12개 생산할 수 있다. 자료 B에서는 X재 1개를 생산하는 데 2시간, Y재 1개를 생산하는 데 4시간이 필요하다. 각 자료에서 X재 1개 생산의 기회비용을 구해 보자.","steps":["자료 A는 최대 생산량을, 자료 B는 재화 1개 생산에 필요한 노동시간을 나타낸다.","자료 A에서 X재 24개를 생산하는 대신 Y재 12개를 생산할 수 있다. 따라서 X재 1개 생산의 기회비용은 Y재 12/24개이다.","자료 B에서 X재 1개에 필요한 2시간으로 Y재를 2/4개 생산할 수 있다. 두 자료에서 X재 1개 생산의 기회비용은 모두 Y재 1/2개이다."],"result":"두 자료는 같은 생산 조건을 서로 다른 방식으로 나타낸다. X재 1개 생산의 기회비용은 모두 Y재 1/2개이다.","tip":"생산량표는 생산할 수 있는 양을, 투입량표는 생산에 필요한 양을 나타낸다.","caution":"서로 다른 재화의 생산량을 곧바로 비교하여 절대 우위를 판단하지 않는다. 같은 재화를 생산하는 두 생산자를 비교한다.","check":{"q":"최대 생산량표와 단위당 투입량표의 숫자 위치가 같으면 기회비용을 구할 때 나누는 방향도 같은가?","o":["항상 같다.","다르다. 표에 제시된 값의 의미에 따라 계산한다."],"why":"최대 생산량과 단위당 투입량은 서로 다른 정보이다. 기회비용을 구할 때 나누는 방향도 달라진다."},"origin":""},"L00-5":{"title":"퍼센트와 퍼센트포인트","goal":"비율의 차이와 증가율을 구별해 보자.","headings":["퍼센트포인트","증가율","금리 차이와 이자 차이"],"paragraphs":["퍼센트포인트는 퍼센트로 나타낸 두 비율의 차이를 표시하는 단위이다. 금리가 3%에서 5%로 올랐다면 금리는 2%포인트 상승한 것이다. 두 금리에서 퍼센트 기호 앞의 수를 빼면 그 차이를 구할 수 있다.","증가율은 증가한 양을 처음 값으로 나눈 비율이다. 값이 3에서 5로 늘었다면 증가한 양은 2이고, 증가율은 2/3이다. 금리가 3%에서 5%로 오른 경우에도 금리 자체의 증가율은 처음 금리 3%를 기준으로 계산한다. 2%포인트 상승과 2% 증가는 서로 다른 뜻이다.","금리의 차이는 비율의 차이이고, 이자의 차이는 금액의 차이이다. 같은 원금을 같은 기간 동안 단리로 맡긴다면 금리가 높은 쪽의 이자가 더 크다. 이자 차이를 구하려면 원금에 금리 차이와 기간을 곱한다. 금리는 같아도 원금이나 기간이 다르면 이자는 달라진다."],"example":"원금 1,000만 원을 1년 동안 맡기는 연 3% 단리 계약과 연 5% 단리 계약이 있다. 다른 비용은 없다. 두 계약의 금리 차이와 이자 차이를 각각 구해 보자.","steps":["금리 차이는 5−3=2%포인트이다.","연 3%일 때 이자는 1,000×0.03=30만 원, 연 5%일 때 이자는 1,000×0.05=50만 원이다.","이자 차이는 50−30=20만 원이다."],"result":"두 계약의 금리는 2%포인트, 이자는 20만 원 차이가 난다.","tip":"같은 원금을 1년간 단리로 맡긴다면 원금에 금리 차이 0.02를 곱하여 이자 차이를 바로 구할 수 있다.","caution":"이자율의 차이를 계산에 사용할 때에는 퍼센트를 소수로 바꾼다. 2%포인트에 해당하는 비율은 0.02이다.","check":{"q":"금리 3%와 5%의 차이는 몇 %포인트인가?","why":"5−3=2이므로 2%포인트이다."},"origin":""},"L00-6":{"title":"편익과 비용이 달라질 때의 선택","goal":"조건이 달라지기 전과 후의 합리적 선택을 비교해 보자.","headings":["편익과 명시적 비용의 변화","암묵적 비용에 미치는 영향","반환금이 생긴 경우"],"paragraphs":["어떤 대안에서 얻는 편익이 커지거나 직접 지출할 비용이 줄어들면 그 대안은 이전보다 유리해진다. 반대로 편익이 줄거나 비용이 늘면 이전보다 불리해진다. 다만 다른 대안과 비교했을 때도 더 유리해야 합리적인 선택이 바뀐다.","한 대안의 가치가 달라지면 다른 대안을 선택할 때의 암묵적 비용도 달라질 수 있다. A 대신 선택할 수 있는 B의 가치가 커졌다면, A를 선택하면서 포기하는 가치도 커지기 때문이다. 따라서 기회비용과 순편익을 구할 때에는 선택하지 않은 대안의 변화도 반영한다.","계약이 바뀌어 특정 대안을 선택할 때 반환금을 받을 수 있게 되었다면 그 금액도 고려해야 한다. 반환금을 받을 수 있는 대안에서 얻는 금액에 이를 포함하여 다른 대안과 비교한다. 반환금이 이미 제시된 편익에 포함되어 있다면 다시 더하지 않는다."],"example":"A의 편익은 30, 명시적 비용은 8이다. B의 편익은 36, 명시적 비용은 10이다. 이후 B의 명시적 비용만 15로 증가하였다. 조건 변경 전후에 어느 대안을 선택하는 것이 유리한지 비교해 보자.","steps":["처음에는 편익에서 명시적 비용을 뺀 값이 A는 30−8=22, B는 36−10=26이다. 따라서 B가 유리하다.","비용이 증가한 뒤에는 A가 22, B가 36−15=21이다. 따라서 A가 유리하다.","A의 편익과 비용은 그대로이지만 B의 명시적 비용이 증가하여 합리적인 선택이 B에서 A로 바뀌었다."],"result":"변경 전에는 B, 변경 후에는 A가 유리하다. B의 명시적 비용 증가가 선택을 바꾸었다.","tip":"편익이나 명시적 비용이 달라지면 변경된 금액으로 각 대안을 비교한다. 기회비용을 구할 때에는 포기한 대안의 가치도 다시 계산한다.","caution":"최선의 대안이 그대로여도 그 대안의 기회비용과 순편익은 달라질 수 있다.","check":{"q":"한 대안의 보상이 조금 늘어나더라도 기존의 선택이 유지될 수 있는가?","o":["유지될 수 있다.","반드시 다른 대안으로 바뀐다."],"why":"보상이 늘어난 뒤에도 다른 대안을 선택할 때의 순편익이 더 크다면 기존의 선택이 유지된다."},"origin":""},"L01-1":{"title":"자본주의의 의미와 특징","goal":"자본주의의 의미와 세 가지 특징을 알아보자.","headings":["자본주의의 의미","자본주의의 특징","자본주의와 정부의 역할"],"paragraphs":["자본주의는 생산 수단의 사적 소유를 인정하고, 시장에서 자유로운 경쟁과 교환을 통해 경제활동이 이루어지는 경제 체제이다.","① 사유 재산권의 보장\n개인은 자유롭게 재산을 획득하고 사용할 수 있다. 공장이나 기계와 같은 생산 수단도 개인이나 기업이 소유할 수 있다.\n\n② 시장의 기능 활성화\n상품은 시장에서 결정된 가격에 따라 거래된다. 경제 주체는 시장 가격을 고려하여 생산과 소비를 결정한다.\n\n③ 경제활동의 자유 보장\n경제 주체는 자유롭게 경제활동을 하며 사적 이익을 추구할 수 있다. 기업은 이윤을 얻기 위해 상품을 생산하고, 소비자는 자신의 필요에 따라 상품을 구입한다.","자본주의가 전개되는 과정에서 정부의 역할에 대한 입장은 달라졌다. 산업 자본주의에서는 자유로운 경제활동을 중시하여 정부의 시장 개입을 최소화하려 했다. 반면 대공황 이후 등장한 수정 자본주의에서는 시장 실패를 해결하기 위한 정부의 적극적인 개입을 강조했다.\n\n수정 자본주의는 자본주의의 기본 틀을 유지하면서 정부의 역할을 확대하려는 입장이다."],"example":"생산자가 개인 소유의 설비로 상품을 만들고, 소비자는 가격과 상품에서 얻는 만족을 비교하여 구매한다. 이 사례에 나타난 자본주의의 특징을 설명해 보자.","steps":["생산자가 설비를 소유한다는 점에서 사유 재산권의 보장이 나타난다.","소비자가 시장 가격을 고려하여 상품을 구매한다는 점에서 시장의 기능을 확인할 수 있다.","생산자와 소비자가 각각 생산과 구매를 결정한다는 점에서 경제활동의 자유가 나타난다."],"result":"사유 재산권의 보장, 시장의 기능 활성화, 경제활동의 자유 보장이 모두 나타난다.","tip":"공장이나 기계의 사적 소유는 사유 재산권, 시장 가격을 고려한 거래는 시장의 기능, 생산과 소비에 대한 자율적 결정은 경제활동의 자유에 해당한다.","caution":"","check":{"q":"자본주의의 특징으로 옳은 것은?","why":"자본주의에서는 생산 수단의 사적 소유를 인정하고, 경제 주체의 자유로운 경제활동을 보장한다."},"origin":""},"L01-2":{"title":"상업·산업 자본주의와 독점 자본주의","goal":"자본주의의 전개 과정과 각 시기의 특징을 알아보자.","headings":["상업 자본주의","산업 자본주의","독점 자본주의"],"paragraphs":["상업 자본주의는 상품의 유통 과정에서 이윤을 얻는 것을 중시하였다. 신항로 개척으로 교역이 확대되면서 상인들은 해외에서 들여온 상품을 판매하여 이윤을 얻었다. 절대 왕정은 국가의 부를 늘리기 위해 국내 산업을 보호하고 수출을 장려하는 중상주의 정책을 추진하였다. 이러한 정책은 상업 자본주의의 발달을 뒷받침하였다.","산업 혁명으로 기계를 이용한 대량 생산이 가능해졌다. 이에 따라 공장과 기계를 소유한 자본가들이 상품을 생산하여 이윤을 얻는 산업 자본주의가 발달하였다. 상업 자본주의가 상품의 유통을 중시했다면 산업 자본주의는 상품의 생산을 중시하였다.\n\n자본가들은 자유롭게 상품을 생산하고 판매할 수 있기를 요구하였다. 애덤 스미스는 자유방임주의를 바탕으로 정부의 시장 개입을 최소화해야 한다고 주장하였다. 그가 말한 ‘보이지 않는 손’은 자원이 효율적으로 배분되도록 하는 시장 가격의 기능을 뜻한다.","산업 자본주의가 발달하면서 소수의 거대 기업이 시장을 지배하는 독점 자본주의가 나타났다. 거대 기업의 시장 지배력이 커지면 자유로운 경쟁이 제한되고 자원이 효율적으로 배분되기 어려워진다.\n\n자본주의의 전개 과정에서 독점 자본주의를 별도 단계로 구분하기도 한다. 이 경우 상업 자본주의, 산업 자본주의, 독점 자본주의, 수정 자본주의, 신자유주의의 순서로 정리한다."],"example":"자료 A는 교역을 장려하는 정책 아래 상인이 상품 유통으로 이윤을 얻는 모습을, B는 기계 설비를 이용한 대량 생산을, C는 소수 거대 기업의 시장 지배를 설명한다. 각 자료에 해당하는 자본주의의 유형을 구분해 보자.","steps":["A는 교역 장려와 상품 유통을 통한 이윤 추구가 나타나므로 상업 자본주의에 해당한다.","B는 기계 설비를 이용한 대량 생산이 나타나므로 산업 자본주의에 해당한다.","C는 소수의 거대 기업이 시장을 지배하므로 독점 자본주의에 해당한다."],"result":"A는 상업 자본주의, B는 산업 자본주의, C는 독점 자본주의이다.","tip":"상업 자본주의는 상품의 유통, 산업 자본주의는 상품의 생산, 독점 자본주의는 소수 거대 기업의 시장 지배가 특징이다.","caution":"독점 자본주의를 별도로 구분하지 않는 네 단계 배열에서는 제시된 상업 자본주의, 산업 자본주의, 수정 자본주의, 신자유주의를 시대순으로 정리한다.","check":{"q":"산업 자본주의와 수정 자본주의 사이에서 소수 거대 기업이 시장을 지배한 시기를 별도로 구분한 것은?","why":"소수의 거대 기업이 시장에서 강력한 지배력을 행사한 시기를 독점 자본주의로 구분한다."},"origin":""},"L01-3":{"title":"수정 자본주의와 신자유주의","goal":"수정 자본주의와 신자유주의의 등장 배경과 정책을 비교해 보자.","headings":["대공황과 수정 자본주의","유효 수요와 공공사업","스태그플레이션과 신자유주의"],"paragraphs":["대공황이 발생하면서 기업이 도산하고 실업자가 크게 늘어났다. 시장에 경제활동을 맡기는 것만으로는 이러한 문제를 해결하기 어렵다는 인식이 확산되었다. 수정 자본주의는 정부의 적극적인 시장 개입을 통해 시장 실패를 해결하려는 입장이다. 자본주의의 기본 틀을 유지하면서 시장의 한계를 보완하는 정부의 역할을 강조한다.","케인스는 대공황의 원인을 유효 수요의 부족에서 찾았다. 유효 수요란 상품을 구매할 의사와 능력을 갖춘 수요이다. 상품을 사고 싶어도 이를 구입할 돈이 없다면 구매로 이어지기 어렵다.\n\n정부가 공공사업을 추진하면 실업자에게 일자리를 제공할 수 있다. 일자리를 얻은 사람들은 임금을 받고, 그 소득으로 상품을 구입한다. 케인스는 이처럼 정부가 지출을 늘려 고용과 수요를 확대해야 한다고 보았다.","석유 파동 이후 경기 침체와 물가 상승이 동시에 나타나는 스태그플레이션이 발생하였다. 이에 대한 정부 대응의 한계가 드러나고, 지나친 시장 개입과 복지 확대에 따른 비효율 및 재정 악화가 문제로 지적되었다.\n\n이러한 배경에서 신자유주의가 등장하였다. 신자유주의는 정부의 역할을 줄이고 시장의 기능과 자유로운 경제활동을 강화해야 한다고 본다. 공기업 민영화, 복지 축소, 노동 시장의 유연화 등이 대표적인 정책이다."],"example":"A는 수요 부족과 실업을 해결하기 위해 정부가 적극적으로 개입해야 한다고 주장한다. B는 지나치게 커진 정부의 역할을 줄이고 민간의 자유로운 활동을 확대해야 한다고 주장한다. 두 주장이 각각 어떤 입장에 해당하는지 구분해 보자.","steps":["A는 시장의 한계를 보완하기 위한 정부의 적극적인 개입을 강조한다.","B는 정부 개입에 따른 비효율을 줄이고 시장의 기능을 강화해야 한다고 본다.","따라서 A는 수정 자본주의, B는 신자유주의에 해당한다."],"result":"수정 자본주의는 시장 실패를 해결하는 정부의 역할을, 신자유주의는 정부 역할의 축소와 시장 기능의 강화를 강조한다.","tip":"대공황과 유효 수요 확대는 수정 자본주의, 스태그플레이션과 정부 역할 축소는 신자유주의와 관련된다.","caution":"","check":{"q":"대공황 이후 공공사업을 통해 고용과 유효 수요를 늘리려는 입장은?","why":"수정 자본주의는 정부의 적극적인 시장 개입을 강조한다. 공공사업을 통한 고용과 수요의 확대는 그 대표적인 정책이다."},"origin":""},"L02-1":{"title":"기본적인 경제 문제와 경제 체제","goal":"기본적인 경제 문제와 경제 체제의 의미를 알아보자.","headings":["기본적인 경제 문제","시장경제 체제","계획경제 체제"],"paragraphs":["자원이 희소하기 때문에 모든 재화와 서비스를 원하는 만큼 생산할 수는 없다. 따라서 무엇을 얼마나 생산할 것인지, 어떻게 생산할 것인지, 누구를 위해 생산할 것인지를 결정해야 한다.\n\n무엇을 얼마나 생산할 것인지는 생산물의 종류와 수량에 관한 문제이다. 어떻게 생산할 것인지는 생산 방법의 문제이며, 누구를 위해 생산할 것인지는 분배의 문제이다. 이러한 기본적인 경제 문제를 해결하기 위해 합의된 제도나 방식을 경제 체제라고 한다.","시장경제 체제에서는 가계와 기업 등 민간 경제 주체가 각자의 이익을 추구하며 생산과 소비를 결정한다. 이때 시장 가격이 자원 배분의 기준이 된다.\n\n소비자들이 새로운 형태의 상품을 선호하면 그 상품에 대한 수요가 증가한다. 생산자는 판매 가격과 예상 이익을 고려하여 생산을 조정한다. 이처럼 시장 가격은 생산자와 소비자의 경제활동에 필요한 정보를 제공한다.","계획경제 체제에서는 정부의 계획과 명령에 따라 기본적인 경제 문제를 해결한다. 정부가 필요한 상품의 종류와 수량을 정하고, 생산에 사용할 자원을 배분하며, 생산물의 분배 방식을 결정한다. 민간 경제 주체의 자율적 선택과 시장 가격을 중시하는 시장경제 체제와 차이가 있다."],"example":"소비자들이 새로운 형태의 상품을 선호하자 생산자들이 판매 가능성과 시장 가격을 고려하여 생산 계획을 조정하였다. 이 사례에 나타난 경제 체제의 특징을 설명해 보자.","steps":["소비자의 선호가 바뀌면서 상품에 대한 수요가 달라졌다.","생산자는 시장 가격과 예상 이익을 고려하여 생산을 조정하였다.","민간 경제 주체가 시장 가격을 바탕으로 생산을 결정하므로 시장경제 체제의 특징이 나타난다."],"result":"시장경제 체제에서는 민간 경제 주체가 시장 가격을 고려하여 생산과 소비를 결정한다.","tip":"생산할 상품과 수량은 ‘무엇을 얼마나’, 생산 기술과 방법은 ‘어떻게’, 분배 방식은 ‘누구를 위해’ 생산할 것인가의 문제이다.","caution":"","check":{"q":"어떤 생산 기술을 사용할지 결정하는 것은 다음 중 어느 문제에 해당하는가?","why":"생산 기술의 선택은 생산 방법을 결정하는 문제이므로 ‘어떻게 생산할 것인가’에 해당한다."},"origin":""},"L02-2":{"title":"시장경제 체제와 계획경제 체제의 비교","goal":"두 경제 체제의 장점과 한계를 비교해 보자.","headings":["시장경제 체제의 장점과 한계","계획경제 체제의 장점과 한계","효율성과 형평성"],"paragraphs":["시장경제 체제에서는 가계와 기업 등 민간 경제 주체가 시장 가격을 고려하여 생산과 소비를 결정한다. 사유 재산권과 자유로운 경제활동이 보장되므로 개인이 능력과 창의성을 발휘하기에 유리하다. 또한 시장 가격을 통해 자원이 효율적으로 배분될 수 있다.\n\n그러나 빈부 격차가 발생하여 분배의 형평성이 낮아질 수 있다. 급격한 경기 변동으로 경제가 불안정해질 수 있다는 한계도 있다.","계획경제 체제에서는 정부가 생산과 자원 배분을 계획하고 통제한다. 정부의 계획에 따라 자원을 배분하므로 부와 소득의 불평등을 완화하고 사회의 주요 목표를 신속하게 달성하는 데 유리하다.\n\n반면 사유 재산권과 경제활동의 자유가 제한되어 개인의 경제적 유인이 부족해질 수 있다. 이로 인해 능력과 창의성이 충분히 발휘되기 어렵고, 자원이 비효율적으로 배분될 수 있다. 정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기도 어렵다.","시장경제 체제는 자원 배분의 효율성을, 계획경제 체제는 분배의 형평성을 상대적으로 중시한다. 시장경제 체제에서는 자유로운 경제활동이 효율적인 자원 배분에 도움이 되지만 불평등이 발생할 수 있다. 계획경제 체제에서는 정부의 계획이 불평등 완화에 도움이 되지만 경제적 유인 부족으로 효율성이 낮아질 수 있다."],"example":"A에서는 민간 경제 주체가 시장 가격을 고려하여 생산을 결정한다. B에서는 정부가 필요한 생산량을 정하여 생산을 지시한다. A와 B의 경제 체제를 구분하고 각각의 장점과 한계를 설명해 보자.","steps":["A는 민간의 자율적 선택과 시장 가격을 중시하므로 시장경제 체제이다.","B는 정부의 계획과 명령에 따라 생산하므로 계획경제 체제이다.","시장경제 체제는 개인의 능력과 창의성 발휘에 유리하지만 빈부 격차가 발생할 수 있다. 계획경제 체제는 불평등 완화에 유리하지만 경제적 유인이 부족해질 수 있다."],"result":"A는 시장경제 체제, B는 계획경제 체제이다. 두 체제는 경제 문제의 해결 방식과 장점·한계가 다르다.","tip":"시장의 자율적 조정은 시장경제 체제, 정부의 계획과 통제는 계획경제 체제의 특징이다.","caution":"","check":{"q":"계획경제 체제의 한계로 옳은 것은?","why":"정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기는 어렵다."},"origin":""},"L02-3":{"title":"혼합 경제 체제와 경제적 유인","goal":"혼합 경제 체제의 특징과 경제적 유인이 선택에 미치는 영향을 알아보자.","headings":["혼합 경제 체제","경제적 유인","보상 증가와 합리적 선택"],"paragraphs":["혼합 경제 체제는 시장경제적 요소와 계획경제적 요소가 결합된 경제 체제이다. 시장을 통해 이루어지는 민간의 경제활동과 정부의 개입이 함께 나타난다. 민간이 시장에서 상품을 거래하고 정부가 공공재를 공급하는 것이 그 예이다. 시장과 정부의 역할이 결합되는 정도는 국가가 추구하는 목표에 따라 다르다.","경제적 유인은 사람들이 어떤 행동을 하거나 하지 않도록 동기를 부여하는 금전적 보상이나 손실이다. 보상이 늘어나거나 지출할 비용이 줄어들면 해당 활동이 이전보다 유리해질 수 있다. 반대로 부담해야 할 비용이 늘어나면 그 활동을 줄이려는 동기가 생길 수 있다.","한 대안의 보상이 늘어났다면 변경된 편익과 비용으로 다른 대안과 비교한다. 두 대안 중 하나만 선택할 때에는 각각의 편익에서 명시적 비용을 뺀 값으로 어느 쪽이 유리한지 비교할 수 있다. 보상이 늘어난 뒤에도 다른 대안이 더 유리하다면 선택은 바뀌지 않는다."],"example":"A의 편익은 15, 명시적 비용은 5이고, B의 편익은 16, 명시적 비용은 8이다. 두 대안 중 하나만 선택한다. 이후 B를 선택할 때 받는 보상이 4 늘어났다. 합리적인 선택은 어떻게 달라질까?","steps":["처음에는 편익에서 명시적 비용을 뺀 값이 A는 15−5=10, B는 16−8=8이므로 A가 유리하다.","보상이 늘어난 뒤 B의 편익은 20이다. 명시적 비용을 빼면 20−8=12이다.","변경 후에는 B의 12가 A의 10보다 크므로 B가 유리하다."],"result":"B에서 받는 보상이 늘어나면서 합리적인 선택이 A에서 B로 바뀌었다.","tip":"경제적 유인의 변화는 선택의 편익이나 비용을 바꾸어 경제 주체의 행동에 영향을 준다.","caution":"편익에서 명시적 비용을 뺀 값과 순편익은 다르다. 순편익을 구하려면 암묵적 비용까지 빼야 한다.","check":{"q":"민간의 시장 거래와 정부의 공공재 공급이 함께 나타나는 경제 체제는 어떻게 설명할 수 있는가?","o":["두 활동은 함께 나타날 수 없다.","시장과 정부의 역할이 결합된 혼합 경제 체제로 설명할 수 있다."],"why":"혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소가 함께 나타난다."},"origin":""},"L03-1":{"title":"명시적 비용과 암묵적 비용","goal":"명시적 비용과 암묵적 비용을 구별하고 기회비용을 구해 보자.","headings":["편익과 명시적 비용","암묵적 비용","기회비용과 순편익"],"paragraphs":["편익은 어떤 선택으로 얻는 이득이나 만족감이다. 공연을 보면서 얻는 만족과 일을 하고 받는 보수가 그 예이다. 명시적 비용은 선택에 따라 실제로 지불하는 금전적 비용이다. 공연을 보기 위해 지불하는 표 값이 이에 해당한다.","암묵적 비용은 어떤 대안을 선택하면서 포기한 다른 대안 중 가장 큰 가치이다. 공연을 보는 대신 일을 할 수 있었다면, 일을 해서 얻을 수 있었던 가치를 포기한 것이다. 일을 하는 데에도 교통비와 같은 명시적 비용이 든다면, 보수에서 그 비용을 뺀 금액이 포기한 가치가 된다.","기회비용은 명시적 비용과 암묵적 비용을 합한 값이다. 공연을 선택할 때의 기회비용에는 표 값과 일을 했다면 얻을 수 있었던 가치가 모두 포함된다.\n\n순편익은 편익에서 기회비용을 뺀 값이다. 따라서 순편익을 구할 때에는 명시적 비용뿐 아니라 암묵적 비용도 빼야 한다."],"example":"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 표 값은 3만 원이다. 일을 하면 보수 8만 원을 받지만 교통비 1만 원이 든다. 공연을 선택할 때의 기회비용을 구해 보자.","steps":["공연 표 값 3만 원은 공연을 보기 위해 직접 지출하는 돈이므로 명시적 비용이다.","일을 했다면 보수 8만 원을 받고 교통비 1만 원을 지출했을 것이다. 따라서 공연을 선택하면서 포기한 가치는 8−1=7만 원이며, 이 금액이 암묵적 비용이다.","기회비용은 명시적 비용과 암묵적 비용을 합한 3+7=10만 원이다."],"result":"공연 선택의 명시적 비용은 3만 원, 암묵적 비용은 7만 원, 기회비용은 10만 원이다.","tip":"포기한 대안에도 명시적 비용이 든다면, 그 대안의 편익에서 명시적 비용을 뺀 금액을 암묵적 비용으로 계산한다.","caution":"일을 하지 않으면 보수도 받지 못하지만 교통비도 지출하지 않는다. 따라서 포기한 가치는 보수 8만 원 전체가 아니라 교통비를 뺀 7만 원이다.","check":{"q":"편익에서 명시적 비용만 뺀 값은 항상 순편익과 같은가?","o":["항상 같다.","그렇지 않다. 순편익은 편익에서 기회비용을 뺀 값이다."],"why":"기회비용에는 명시적 비용과 암묵적 비용이 모두 포함된다. 순편익은 편익에서 두 비용을 모두 뺀 값이다."},"origin":""},"L03-2":{"title":"두 대안의 기회비용과 순편익","goal":"두 대안의 기회비용과 순편익을 구하여 합리적인 선택을 찾아보자.","headings":["두 대안의 암묵적 비용","기회비용과 순편익의 계산","합리적 선택"],"paragraphs":["A와 B 중 하나만 선택할 수 있다면 A를 선택할 때 B를 포기한다. B의 편익을 얻으려면 B의 명시적 비용도 지출해야 하므로, B를 포기한 가치는 B의 편익에서 명시적 비용을 뺀 값이다. 이 값이 A 선택의 암묵적 비용이다.\n\n반대로 B를 선택하면 A를 포기하므로, B 선택의 암묵적 비용은 A의 편익에서 명시적 비용을 뺀 값이다.","각 대안의 명시적 비용에 암묵적 비용을 더하면 기회비용을 구할 수 있다. 편익에서 기회비용을 빼면 순편익이다.\n\n기회비용 = 명시적 비용 + 암묵적 비용\n순편익 = 편익 − 기회비용","합리적 선택은 순편익이 가장 큰 대안을 선택하는 것이다. 편익이 같다면 기회비용이 작은 대안이 유리하다. 그러나 편익이 다르면 기회비용이 큰 대안의 순편익이 더 클 수도 있다. 따라서 편익과 기회비용을 함께 비교해야 한다."],"example":"A의 편익은 25, 명시적 비용은 7이고, B의 편익은 32, 명시적 비용은 11이다. 두 대안 중 하나만 선택할 수 있으며 다른 대안이나 매몰 비용은 없다. 각 대안의 기회비용과 순편익을 구해 보자.","steps":["각 대안의 편익에서 명시적 비용을 빼면 A는 25−7=18, B는 32−11=21이다.","A를 선택하면 B를 포기한다. 암묵적 비용은 21이고 명시적 비용은 7이므로, A 선택의 기회비용은 7+21=28이다.","B를 선택하면 A를 포기한다. 암묵적 비용은 18이고 명시적 비용은 11이므로, B 선택의 기회비용은 11+18=29이다.","편익에서 기회비용을 빼면 A의 순편익은 25−28=−3, B의 순편익은 32−29=3이다. B의 순편익이 더 크므로 B를 선택하는 것이 합리적이다."],"result":"A의 순편익은 −3, B의 순편익은 3이다. B의 기회비용은 더 크지만 편익의 차이가 더 커서 B가 유리하다.","tip":"A의 암묵적 비용에는 B를 포기한 가치를, B의 암묵적 비용에는 A를 포기한 가치를 넣는다.","caution":"이 예제에서는 A와 B 중 하나만 선택할 수 있다. 다른 대안이 추가되면 그 대안의 가치도 고려하여 암묵적 비용을 구해야 한다.","check":{"q":"예제에서 A를 선택할 때의 순편익은 얼마인가?","why":"A의 편익은 25, 기회비용은 28이다. 따라서 순편익은 25−28=−3이다."},"origin":""},"L03-3":{"title":"세 대안 중 하나를 선택할 때의 기회비용","goal":"포기한 대안 중 가장 큰 가치를 찾아 기회비용을 계산해 보자.","headings":["포기한 대안 중 가장 큰 가치","대안별 암묵적 비용","최선의 선택과 순편익"],"paragraphs":["A, B, C 중 하나만 선택할 수 있다고 하자. A를 선택하면 B와 C를 모두 포기한다. 그러나 B와 C를 동시에 선택할 수 있었던 것은 아니므로 두 대안의 가치를 모두 더하지 않는다. A 선택의 암묵적 비용은 B와 C 중 더 큰 가치이다.","먼저 각 대안의 편익에서 명시적 비용을 뺀다. 그다음 선택하지 않은 대안들 가운데 이 값이 가장 큰 대안을 찾는다. 그 대안을 포기한 가치가 선택한 대안의 암묵적 비용이다. 여기에 명시적 비용을 더하면 기회비용이 된다.","편익에서 명시적 비용을 뺀 값이 가장 큰 대안을 선택하면, 그다음으로 큰 대안의 가치가 암묵적 비용이 된다. 따라서 최선의 선택에 따른 순편익은 가장 큰 값과 두 번째로 큰 값의 차이이다. 두 값이 같다면 두 대안의 순편익은 모두 0이며 어느 하나만 더 유리하지는 않다."],"example":"A의 편익과 명시적 비용은 각각 40과 12, B는 45와 14, C는 39와 10이다. 세 대안 중 하나만 선택할 때 각 대안의 기회비용과 순편익을 구해 보자.","steps":["편익에서 명시적 비용을 빼면 A는 40−12=28, B는 45−14=31, C는 39−10=29이다.","A나 C를 선택하면 가치가 가장 큰 B를 포기하므로 암묵적 비용은 31이다. B를 선택하면 A와 C 중 가치가 더 큰 C를 포기하므로 암묵적 비용은 29이다.","명시적 비용과 암묵적 비용을 더하면 기회비용은 A가 12+31=43, B가 14+29=43, C가 10+31=41이다.","편익에서 기회비용을 빼면 순편익은 A가 −3, B가 2, C가 −2이다. 따라서 B를 선택하는 것이 합리적이다."],"result":"B의 순편익이 2로 가장 크다. B를 선택할 때의 암묵적 비용은 포기한 A와 C 중 가치가 더 큰 C의 29이다.","tip":"선택한 대안을 제외한 뒤, 남은 대안들의 ‘편익−명시적 비용’ 중 가장 큰 값을 암묵적 비용으로 삼는다.","caution":"하나만 선택할 수 있는 대안들의 가치를 모두 더하면 암묵적 비용을 실제보다 크게 계산하게 된다.","check":{"q":"A, B, C의 ‘편익−명시적 비용’이 각각 20, 27, 23이다. B 선택의 암묵적 비용은 얼마인가?","why":"B를 선택하면 A와 C를 포기한다. 두 값 중 큰 값은 C의 23이므로 암묵적 비용은 23이다."},"origin":""},"L04-1":{"title":"매몰 비용과 합리적 선택","goal":"매몰 비용의 의미와 합리적 선택에서 이를 제외하는 이유를 알아보자.","headings":["매몰 비용의 의미","현재의 선택과 매몰 비용","돌려받을 수 있는 지출"],"paragraphs":["매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 사업을 계속하든 중단하든 돌려받을 수 없는 개발비가 이에 해당한다.","합리적으로 선택하려면 각 대안을 선택할 때 앞으로 얻을 편익과 부담할 비용을 비교해야 한다. 매몰 비용은 어느 대안을 선택하더라도 회수할 수 없으므로 현재의 선택에서 고려하지 않는다.\n\n기업이 사업을 계속할지 중단할지 고민하고 있다고 하자. 이미 지출한 개발비를 돌려받을 수 없다면, 개발비가 아깝다는 이유만으로 사업을 계속해서는 안 된다. 앞으로 얻을 편익과 추가로 지출할 비용을 고려해야 한다.","이미 지출했더라도 선택에 따라 돌려받을 수 있는 금액은 매몰 비용이 아니다. 그 금액을 돌려받을 수 있는지에 따라 각 대안의 유불리가 달라질 수 있기 때문이다. 현재의 선택으로 새롭게 발생하는 비용 역시 매몰 비용과 구별하여 계산한다."],"example":"과거에 지출한 개발비 40은 회수할 수 없다. 지금 A를 선택하면 편익 100과 명시적 비용 45가 발생하고, B를 선택하면 편익 95와 명시적 비용 35가 발생한다. 어느 대안을 선택하는 것이 유리한가?","steps":["개발비 40은 A와 B 중 어느 대안을 선택해도 회수할 수 없으므로 매몰 비용이다. 현재의 선택에서는 제외한다.","각 대안의 편익에서 명시적 비용을 빼면 A는 100−45=55, B는 95−35=60이다.","B의 값이 더 크므로 B가 유리하다. 회수할 수 없는 과거 개발비만 80으로 달라져도 현재 대안의 편익과 비용은 같으므로 선택은 바뀌지 않는다."],"result":"B가 유리하다. 회수할 수 없는 과거 개발비는 현재의 선택에 영향을 주지 않는다.","tip":"매몰 비용은 과거에 지출했고 현재 어떤 선택을 하더라도 회수할 수 없는 비용이다.","caution":"이미 지출한 금액이라도 선택에 따라 돌려받을 수 있다면 그 반환금은 현재의 선택에 반영한다.","check":{"q":"현재의 선택에 따라 앞으로 새로 발생하는 비용도 매몰 비용인가?","o":["매몰 비용이다.","매몰 비용이 아니다. 선택의 편익과 함께 고려해야 한다."],"why":"매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 앞으로 선택에 따라 새로 발생하는 비용은 이에 해당하지 않는다."},"origin":""},"L04-2":{"title":"비용과 반환금의 변화","goal":"비용이 늘어나거나 반환금이 생겼을 때 합리적인 선택을 비교해 보자.","headings":["앞으로 지출할 비용의 증가","반환금이 있는 선택","두 대안이 같아지는 금액"],"paragraphs":["앞으로 지출할 명시적 비용이 늘어나면 그 대안은 이전보다 불리해진다. 편익이 같아도 지출하는 금액이 많아지기 때문이다. 반면 이미 지출하여 회수할 수 없는 비용은 현재 어떤 대안을 선택하든 달라지지 않으므로 비교에서 제외한다.","특정 대안을 선택하면 돈을 돌려받는 계약이 생겼다면 그 반환금도 고려해야 한다. 반환금은 받을 수 있는 대안에만 더한다. 같은 대안을 선택하더라도 반환금을 받을 수 없었던 경우와 받을 수 있게 된 경우의 결과는 다르다.","두 대안의 편익에서 명시적 비용을 뺀 값이 같으면 두 대안은 동률이다. 어느 한 대안만 더 유리해지는 금액을 묻는다면 동률이 되는 값은 답이 될 수 없다. 금액이 정수로 제한되어 있다면 동률이 되는 값과 그다음 정수에서의 결과를 비교한다."],"example":"A의 편익과 명시적 비용은 각각 100과 45, B는 95와 35이다. 이후 B의 명시적 비용만 45로 증가하였다. 이어서 B를 선택하면 8을 돌려받는 계약이 생겼다. 각 경우에 어느 대안이 유리한지 구해 보자.","steps":["처음에는 A의 ‘편익−명시적 비용’이 100−45=55, B는 95−35=60이므로 B가 유리하다.","B의 명시적 비용이 45로 늘어나면 B는 95−45=50이 된다. A는 55이므로 A가 유리하다.","B를 선택할 때 반환금 8을 받게 되면 B는 95+8−45=58이 된다. A의 55보다 크므로 다시 B가 유리하다."],"result":"B의 비용이 늘어나면 A가 유리해지고, B에 반환금이 생기면 다시 B가 유리해진다.","tip":"반환금이 생긴 경우에는 해당 대안에서 받을 금액에 반환금을 포함한 뒤 명시적 비용을 뺀다.","caution":"반환금이 이미 편익에 포함되어 있다면 다시 더하지 않는다.","check":{"q":"A의 ‘편익−명시적 비용’은 55이고 B의 편익은 95이다. 두 대안이 동률이 되는 B의 명시적 비용은 얼마인가?","why":"B의 명시적 비용이 40이면 95−40=55로 A와 같아진다."},"origin":""},"L04-3":{"title":"기회비용 표의 빈칸 구하기","goal":"편익과 비용의 관계를 이용하여 표의 빈칸을 구해 보자.","headings":["기회비용의 구성","두 대안의 암묵적 비용","계산 결과의 확인"],"paragraphs":["기회비용은 명시적 비용과 암묵적 비용의 합이다. 따라서 기회비용에서 명시적 비용을 빼면 암묵적 비용을, 암묵적 비용을 빼면 명시적 비용을 구할 수 있다. 표의 빈칸을 채울 때에는 먼저 주어진 값이 편익인지, 명시적 비용인지, 암묵적 비용인지 구분한다.","A와 B 중 하나만 선택할 수 있다면 A 선택의 암묵적 비용은 B의 편익에서 명시적 비용을 뺀 값이다. 그러므로 B의 편익과 A의 암묵적 비용을 알면 B의 명시적 비용을 구할 수 있다.\n\nB의 명시적 비용 = B의 편익 − A 선택의 암묵적 비용","빈칸을 구한 뒤에는 명시적 비용과 암묵적 비용을 더해 주어진 기회비용과 일치하는지 확인한다. 대안이 셋 이상이면 선택하지 않은 대안 중 가장 큰 가치를 찾아야 한다. 이 경우 다른 대안 하나의 값만으로 암묵적 비용을 정할 수는 없다."],"example":"A와 B 중 하나만 선택할 수 있다. A 선택의 암묵적 비용은 24, B의 편익은 35, B 선택의 기회비용은 31이다. B의 명시적 비용과 A의 ‘편익−명시적 비용’을 구해 보자.","steps":["A를 선택하면 B를 포기한다. 따라서 B의 편익 35에서 B의 명시적 비용을 뺀 값이 A의 암묵적 비용 24이다.","B의 명시적 비용은 35−24=11이다.","B의 암묵적 비용은 기회비용 31에서 명시적 비용 11을 뺀 20이다.","B를 선택하면 A를 포기하므로 A의 ‘편익−명시적 비용’은 20이다."],"result":"B의 명시적 비용은 11이고, A의 ‘편익−명시적 비용’은 20이다. B의 두 비용을 합하면 11+20=31로 주어진 기회비용과 일치한다.","tip":"기회비용에서 명시적 비용을 빼면 암묵적 비용이다. 두 대안 중 하나만 선택할 때에는 그 값이 다른 대안의 ‘편익−명시적 비용’과 같다.","caution":"대안이 셋 이상이면 선택하지 않은 대안들의 ‘편익−명시적 비용’ 중 가장 큰 값을 사용한다.","check":{"q":"명시적 비용이 9이고 기회비용이 26일 때 암묵적 비용은 얼마인가?","why":"기회비용에서 명시적 비용을 빼면 26−9=17이다."},"origin":""},"L05-1":{"title":"시장 실패와 외부 효과","goal":"시장 실패의 의미와 외부 경제·외부 불경제의 차이를 알아보자.","headings":["시장 실패","외부 효과","외부 경제와 외부 불경제"],"paragraphs":["시장 실패는 시장이 자원을 효율적으로 배분하지 못하는 상태이다. 개별 경제 주체가 자신의 편익과 비용을 고려하여 합리적으로 선택하더라도 사회 전체의 자원이 효율적으로 배분되지 않을 수 있다. 외부 효과, 공공재의 부족, 독과점 문제, 정보의 비대칭성 등이 시장 실패의 원인이 된다.","외부 효과는 한 경제 주체의 생산이나 소비가 다른 경제 주체에게 의도하지 않은 이익이나 손해를 주지만, 그에 대한 대가를 주고받지 않는 경우이다. 공장이 상품을 생산하면서 배출한 오염 물질로 인근 주민이 피해를 입었는데 공장이 이를 보상하지 않았다면 생산에 따른 외부 효과가 발생한 것이다.","다른 경제 주체에게 의도하지 않은 이익을 주고도 대가를 받지 않는 경우를 외부 경제라고 한다. 반대로 다른 경제 주체에게 의도하지 않은 손해를 주고도 대가를 지불하지 않는 경우를 외부 불경제라고 한다. 공장이 보상하지 않은 주민의 오염 피해는 외부 불경제에 해당한다."],"example":"공장이 상품을 생산하여 이익을 얻었다. 생산 과정에서 배출된 오염 물질로 이웃 주민이 피해를 입었지만, 공장은 그 피해를 보상하지 않았다. 이 사례에 해당하는 외부 효과를 설명해 보자.","steps":["주민의 피해는 공장의 생산 활동에서 발생하였다.","오염 물질로 피해를 입은 사람은 공장 인근의 주민이다.","공장이 다른 경제 주체인 주민에게 피해를 주고도 보상하지 않았으므로 외부 불경제에 해당한다."],"result":"공장의 생산 활동에 따른 외부 불경제가 발생하였다.","tip":"대가 없이 다른 경제 주체에게 이익을 주면 외부 경제, 손해를 주면 외부 불경제이다.","caution":"상품을 사고 그 가격을 지불하는 거래는 외부 효과와 다르다. 외부 효과는 생산이나 소비의 영향에 대한 대가를 주고받지 않는 경우이다.","check":{"q":"생산이나 소비로 다른 경제 주체에게 의도하지 않은 이익을 주고도 그 대가를 받지 않는 경우는?","why":"다른 경제 주체에게 대가 없이 이익을 주므로 외부 경제에 해당한다."},"origin":""},"L05-2":{"title":"외부 효과와 사회적 최적 생산량","goal":"외부 효과가 과다 생산이나 과소 생산을 일으키는 이유를 알아보자.","headings":["외부 불경제와 과다 생산","외부 경제와 과소 생산","이익과 피해를 고려한 활동량"],"paragraphs":["외부 불경제가 발생하면 생산자나 소비자는 다른 사람에게 주는 피해를 충분히 고려하지 않은 채 활동량을 결정한다. 그 결과 사회적 최적 수준보다 많이 생산하거나 소비하게 된다. 과다 생산은 전년보다 많이 생산했다는 뜻이 아니라 사회적 최적 생산량보다 많이 생산했다는 뜻이다.","외부 경제가 발생하면 다른 사람에게 돌아가는 이익이 생산자나 소비자의 선택에 충분히 반영되지 않는다. 따라서 사회적 최적 수준보다 적게 생산하거나 소비하게 된다. 과소 생산 역시 사회적 최적 생산량을 기준으로 판단한다.","개인의 이익과 제3자의 피해를 같은 금액 단위로 제시한 경우에는, 개인의 이익에서 제3자의 피해를 뺀 값을 비교할 수 있다. 다른 효과가 없다고 가정하면 이 값이 가장 큰 활동량이 제3자의 피해까지 고려했을 때 가장 유리하다. 제3자에게 피해가 아니라 편익이 발생했다면 개인의 이익에 그 편익을 더한다."],"example":"활동량이 1, 2, 3일 때 개인의 이익은 각각 30, 48, 54이고 제3자의 피해는 각각 3, 10, 25이다. 이익과 피해는 같은 단위로 표시하며 다른 효과는 없다. 개인의 이익만 고려한 경우와 제3자의 피해까지 고려한 경우의 활동량을 비교해 보자.","steps":["개인의 이익은 활동량이 3일 때 54로 가장 크다. 따라서 개인의 이익만 고려하면 활동량 3을 선택한다.","제3자의 피해를 빼면 활동량별 값은 30−3=27, 48−10=38, 54−25=29이다.","피해를 뺀 값은 활동량이 2일 때 38로 가장 크다. 따라서 제3자의 피해까지 고려하면 활동량 2가 유리하다."],"result":"개인은 활동량 3을 선택하지만, 제3자의 피해까지 고려하면 활동량 2가 유리하다.","tip":"개인의 이익이 가장 큰 활동량과 제3자의 영향까지 반영한 값이 가장 큰 활동량을 비교한다.","caution":"과다·과소 생산의 기준은 사회적 최적 생산량이다. 전년 생산량이나 다른 기업의 생산량과 비교하는 것이 아니다.","check":{"q":"외부 경제가 발생한 경우 개인이 선택한 활동량은 2, 사회적 최적 활동량은 4이다. 이에 대한 설명으로 옳은 것은?","o":["사회적 최적 수준보다 적게 활동한다.","사회적 최적 수준보다 많이 활동한다."],"why":"개인의 활동량 2가 사회적 최적 활동량 4보다 작으므로 과소 활동에 해당한다."},"origin":""},"L05-3":{"title":"외부 효과를 개선하는 세금과 보조금","goal":"세금과 보조금의 목적을 이해하고 총액을 계산해 보자.","headings":["외부 효과에 대한 정부의 대응","단위당 금액과 총액","생산자의 지출과 정부의 수입"],"paragraphs":["정부는 외부 불경제가 발생하는 활동에 세금이나 부담금을 부과하여 과다한 생산과 소비를 줄일 수 있다. 반대로 외부 경제가 발생하는 활동에는 세금을 감면하거나 보조금을 지급하여 부족한 생산과 소비를 늘릴 수 있다.\n\n외부 불경제: 세금·부담금 부과 → 생산·소비 억제\n외부 경제: 세금 감면·보조금 지급 → 생산·소비 촉진","생산 1단위당 부담금이 8이면 생산량이 2일 때 납부할 총부담금은 2×8=16이다. 생산자에게 남는 이익을 구하려면 납부 전 이익에서 총부담금을 빼야 한다. 보조금도 단위당 지급액에 활동량을 곱하여 총액을 구한다.","생산자가 낸 부담금은 정부의 수입이 된다. 생산자와 정부의 금액을 함께 계산하는 문제에서는 생산자의 납부 후 이익에 정부 수입을 더한다. 주민의 피해도 제시되었다면 이를 뺀다. 행정 비용 등 다른 효과가 있는지는 문제의 조건에 따른다."],"example":"생산량은 2, 부담금 납부 전 생산자 이익은 50, 주민 피해는 12이다. 생산 1단위당 부담금은 8이다. 정부 수입을 포함하고 다른 효과는 없을 때, 생산자 이익과 정부 수입에서 주민 피해를 뺀 합계를 구해 보자.","steps":["총부담금은 생산량에 단위당 부담금을 곱한 2×8=16이다.","부담금을 낸 뒤 생산자에게 남는 이익은 50−16=34이다.","생산자가 낸 부담금 16은 정부의 수입이다.","생산자 이익 34와 정부 수입 16을 더하고 주민 피해 12를 빼면 34+16−12=38이다."],"result":"부담금 납부 후 생산자 이익은 34, 정부 수입은 16이다. 주민 피해까지 반영한 합계는 38이다.","tip":"단위당 부담금과 총부담금을 구별한다. 생산자 이익에서 빼는 금액은 총부담금이다.","caution":"생산자의 납부 후 이익에는 이미 부담금이 빠져 있다. 정부 수입과 합산할 때 부담금을 다시 빼지 않는다.","check":{"q":"활동량이 3단위이고 단위당 보조금이 4일 때 보조금 총액은 얼마인가?","why":"단위당 보조금에 활동량을 곱하면 4×3=12이다."},"origin":""},"L06-1":{"title":"공공재의 비배제성과 비경합성","goal":"공공재의 두 특성과 무임승차가 나타나는 이유를 알아보자.","headings":["공공재와 비배제성","비경합성","무임승차와 공급 부족"],"paragraphs":["공공재는 비배제성과 비경합성을 가진 재화나 서비스이다. 국방과 치안 서비스가 대표적인 예이다.\n\n비배제성은 대가를 지불하지 않은 사람을 소비에서 배제할 수 없는 특성이다. 가로등 설치비를 내지 않은 주민도 가로등의 불빛을 이용할 수 있다는 점에서 비배제성이 나타난다.","비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 한 주민이 가로등의 불빛을 이용하더라도 다른 주민의 이용 기회가 줄어들지 않는다는 점에서 비경합성이 나타난다.\n\n비배제성은 대가를 내지 않은 사람의 이용을 막을 수 있는지에 관한 특성이고, 비경합성은 한 사람의 이용이 다른 사람의 이용 기회를 줄이는지에 관한 특성이다.","공공재는 대가를 지불하지 않아도 이용할 수 있다. 따라서 비용을 부담하지 않고 혜택만 누리려는 무임승차가 나타날 수 있다.\n\n무임승차자가 많으면 민간 기업은 공공재를 생산해도 비용을 회수하고 이윤을 얻기 어렵다. 이 때문에 공공재의 생산을 시장에만 맡기면 사회에서 필요로 하는 만큼 충분히 공급되지 않을 수 있다. 정부는 공공재를 직접 공급하여 이러한 문제를 해결할 수 있다."],"example":"가로등 설치비를 내지 않은 주민도 가로등을 이용할 수 있다. 또한 한 주민이 불빛을 이용하더라도 다른 주민의 이용 기회는 줄어들지 않는다. 가로등에 나타나는 두 특성을 설명해 보자.","steps":["설치비를 내지 않은 주민의 이용을 막을 수 없으므로 비배제성이 나타난다.","한 주민의 이용이 다른 주민의 이용 기회를 줄이지 않으므로 비경합성이 나타난다.","비용을 내지 않고도 이용할 수 있으므로 비용 부담을 피하려는 무임승차가 나타날 수 있다."],"result":"가로등은 비배제성과 비경합성을 가진다. 무임승차는 대가를 내지 않아도 이용할 수 있는 비배제성과 관련된다.","tip":"‘돈을 내지 않아도 이용할 수 있다’는 비배제성, ‘함께 이용해도 다른 사람의 이용 기회가 줄지 않는다’는 비경합성이다.","caution":"공급자가 정부인지보다 재화 자체의 비배제성과 비경합성이 공공재를 구분하는 기준이다. 이용 제한이나 혼잡 조건이 제시되었다면 그 조건도 고려한다.","check":{"q":"한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성은?","why":"비경합성이다. 비배제성은 대가를 내지 않은 사람을 소비에서 배제할 수 없는 특성이다."},"origin":""},"L06-2":{"title":"가로등 설치비 모금","goal":"설치비를 얼마씩 부담하는 것이 유리한지 비교해 보자.","headings":["가로등 설치 조건","설치 성공과 실패","나의 납부액과 설치 여부"],"paragraphs":["네 주민이 가로등 설치비를 모으려고 한다. 각 주민은 10토큰을 가지고 있으며, 가로등을 설치하려면 24토큰이 필요하다. 다른 세 주민의 납부액은 공개되어 있고, 나는 이를 보고 낼 금액을 결정한다.","24토큰 이상이 모이면 가로등을 설치한다. 가로등이 설치되면 비용을 냈는지와 관계없이 각 주민은 10의 편익을 얻는다. 설치비가 부족하면 가로등을 설치하지 않고 낸 토큰을 모두 돌려준다.\n\n이 활동에서는 남은 토큰과 가로등에서 얻는 편익의 합이 클수록 유리한 선택으로 본다. 설치에 성공하면 ‘10−내 납부액+10’, 실패하면 토큰을 돌려받으므로 10이다.","다른 주민이 낸 돈만으로 설치비가 모두 모였다면 나는 내지 않고도 가로등을 이용할 수 있다. 설치비가 부족하다면 내가 낸 금액에 따라 가로등 설치 여부가 달라질 수 있다. 이때에는 납부액뿐 아니라 설치 성공 여부를 함께 고려하여 남은 토큰과 편익의 합을 비교한다."],"example":"다른 세 주민은 각각 6토큰씩 내기로 하였다. 내가 6토큰을 내는 경우와 4토큰을 내는 경우 중 어느 쪽이 유리한지 비교해 보자.","steps":["다른 세 주민이 내는 금액은 6×3=18토큰이다.","내가 6토큰을 내면 총 24토큰이 모이므로 가로등이 설치된다. 내게 남는 토큰은 4이고 편익은 10이므로 두 값의 합은 14이다.","내가 4토큰을 내면 총모금액은 22토큰으로 설치비가 부족하다. 가로등은 설치되지 않고 납부액을 돌려받으므로 내게 남는 토큰은 10이다."],"result":"다른 세 주민이 각각 6토큰을 낼 때에는 내가 4토큰보다 6토큰을 내는 것이 유리하다. 남은 토큰과 편익의 합이 10보다 14가 더 크기 때문이다.","tip":"총모금액이 24토큰 이상이면 남은 토큰에 편익 10을 더한다. 24토큰 미만이면 납부액을 돌려받으며 가로등 편익은 없다.","caution":"","check":{"q":"다른 주민만으로 24토큰이 모였다. 내가 0토큰을 냈을 때 남은 토큰과 편익의 합은 얼마인가?","why":"가로등이 설치되므로 보유 토큰 10에 편익 10을 더한 20이다."},"origin":""},"L06-3":{"title":"독과점과 정보의 비대칭성","goal":"독과점 문제와 정보의 비대칭성을 구별해 보자.","headings":["독과점과 담합","정보의 비대칭성","시장 실패의 개선 방안"],"paragraphs":["독점은 시장에 공급자가 하나만 있는 상태이고, 과점은 소수의 공급자가 있는 상태이다. 독과점 기업이 가격이나 생산량을 임의로 조정하면 소비자가 피해를 입을 수 있다.\n\n기업들이 가격 인상이나 생산량 제한에 합의하여 경쟁을 피하는 행위를 담합이라고 한다. 담합은 경쟁을 제한하여 자원의 효율적 배분을 어렵게 할 수 있다.","정보의 비대칭성은 거래 당사자가 가진 거래에 필요한 정보의 양과 질이 서로 다른 상태이다. 중고 제품의 결함을 판매자는 알지만 구매자는 모르는 경우가 그 예이다. 구매자가 제품의 상태를 제대로 알지 못하면 거래에 관한 합리적 판단이 어려워질 수 있다.","정부는 독과점 기업의 횡포와 불공정 거래를 규제하여 공정한 경쟁을 촉진할 수 있다. 정보의 비대칭성을 줄이기 위해서는 품질 보증, 성분 표시, 원산지 표시 등을 활용할 수 있다. 공공재 부족은 정부의 직접 공급으로, 외부 불경제는 세금이나 부담금 부과 등으로 개선할 수 있다."],"example":"A 자료에는 기업들이 가격 인상에 합의한 내용이 있다. B 자료에는 판매자만 알고 있는 제품의 결함이 제시되어 있다. C 자료에는 생산 과정에서 발생했지만 보상되지 않은 오염 피해가 나타난다. 각 사례에 해당하는 개념을 구분해 보자.","steps":["A는 기업들이 가격 인상에 합의하여 경쟁을 제한하므로 담합이다.","B는 판매자와 구매자가 가진 제품 정보가 다르므로 정보의 비대칭성이다.","C는 생산으로 다른 경제 주체에게 피해를 주고도 보상하지 않았으므로 외부 불경제이다."],"result":"A는 담합, B는 정보의 비대칭성, C는 외부 불경제이다.","tip":"업체 간 경쟁 제한 합의는 담합, 거래 당사자 간 정보 차이는 정보의 비대칭성에 해당한다.","caution":"여러 업체의 가격이 같다는 사실만으로 담합이라고 할 수는 없다. 가격을 함께 정하기로 합의했는지에 관한 정보가 필요하다.","check":{"q":"제품의 결함을 판매자는 알지만 구매자는 모르는 경우에 해당하는 개념은?","why":"거래 당사자가 가진 제품 정보에 차이가 있으므로 정보의 비대칭성이다."},"origin":""},"L07-1":{"title":"시장경제에서 정부의 역할","goal":"정부가 시장 실패와 경제적 불평등을 개선하는 방법을 알아보자.","headings":["공정한 경쟁과 외부 효과 개선","공공재 공급과 정보 제공","소득 재분배"],"paragraphs":["정부는 시장이 자원을 효율적으로 배분하지 못하는 문제를 개선하기 위해 개입한다. 독과점 기업의 횡포, 담합, 불공정 거래 등을 규제하여 공정한 경쟁을 촉진할 수 있다.\n\n외부 불경제가 발생하는 활동에는 세금이나 부담금을 부과하여 과다한 생산과 소비를 줄인다. 외부 경제가 발생하는 활동에는 세금 감면이나 보조금 지급으로 생산과 소비를 늘릴 수 있다.","공공재는 무임승차 문제 등으로 민간 시장에서 충분히 공급되기 어렵다. 정부는 공공재를 직접 공급하여 이러한 부족을 보완할 수 있다.\n\n상품의 품질과 성분, 원산지 등에 관한 정보 제공은 거래 당사자 사이의 정보 차이를 줄이는 데 도움이 된다. 품질 보증, 성분 표시, 원산지 표시 등이 정보의 비대칭성을 개선하는 방안이다.","정부는 소득 재분배를 통해 경제적 불평등을 완화할 수 있다. 누진세 제도와 사회 보장 제도 등이 그 수단이다.\n\n같은 세금이나 보조금을 사용하더라도 정책의 목적은 다를 수 있다. 오염을 줄이기 위한 세금은 외부 불경제의 개선, 경제적 불평등을 완화하기 위한 조세·사회 보장 정책은 소득 재분배와 관련된다."],"example":"정부의 정책 A는 상품의 성분 표시, B는 치안 서비스 공급, C는 경제적 불평등 완화를 목적으로 한다. 각 정책에 해당하는 정부의 역할을 구분해 보자.","steps":["A는 상품 정보를 제공하므로 정보의 비대칭성을 개선하는 정책이다.","B는 치안 서비스를 제공하므로 공공재를 공급하는 역할이다.","C는 경제적 불평등을 완화하므로 소득 재분배 역할에 해당한다."],"result":"A는 정보의 비대칭성 개선, B는 공공재 공급, C는 소득 재분배이다.","tip":"어떤 정책 수단을 쓰는지와 함께 해결하려는 문제가 무엇인지 살펴보면 정부의 역할을 구분할 수 있다.","caution":"","check":{"q":"품질 보증과 성분 표시를 통해 개선하려는 문제는 무엇인가?","why":"거래에 필요한 정보를 제공하여 판매자와 소비자 사이의 정보의 비대칭성을 줄이려는 것이다."},"origin":""},"L07-2":{"title":"기업의 책임과 노동자의 권리","goal":"기업가 정신, 기업의 사회적 책임, 노동 3권을 알아보자.","headings":["기업가 정신","기업의 사회적 책임","노동자의 역할과 노동 3권"],"paragraphs":["기업가 정신은 이윤을 추구하는 과정에서 위험과 불확실성을 무릅쓰고 새로운 시장을 개척하며 도전하는 정신이다. 새로운 기술이나 상품을 개발하고 기존에 없던 시장에 진출하려는 노력에서 기업가 정신을 찾을 수 있다.","기업의 활동은 노동자, 소비자, 지역 사회와 환경에 영향을 미친다. 따라서 기업은 법규를 준수하고 노동자와 소비자의 권리를 존중하며 사회적 책임을 다해야 한다. 근로 조건을 개선하고 소비자의 안전을 보호하며 환경에 미치는 영향을 줄이려는 노력이 이에 해당한다.","노동자는 자신의 권리를 보장받기 위해 노력하고 생산 활동에 적극적으로 참여하며 기업과 협력할 필요가 있다. 노동 3권에는 다음의 권리가 있다.\n\n① 단결권: 노동조합을 조직하거나 가입할 수 있는 권리\n② 단체 교섭권: 노동조합을 통해 사용자와 임금·근로 조건 등을 협상할 수 있는 권리\n③ 단체 행동권: 협상이 결렬되었을 때 파업 등 쟁의 행위를 통해 사용자에게 대항할 수 있는 권리"],"example":"노동자들이 노동조합에 가입하였다. 노동조합은 노동자를 대표하여 사용자와 근로 조건을 협상하였다. 각 활동에 해당하는 권리를 구분해 보자.","steps":["노동조합에 가입하는 것은 단결권의 행사이다.","노동조합이 사용자와 근로 조건을 협상하는 것은 단체 교섭권의 행사이다.","조직·가입에 관한 단결권과 사용자와의 협상에 관한 단체 교섭권은 서로 다른 권리이다."],"result":"노동조합 가입은 단결권, 사용자와의 근로 조건 협상은 단체 교섭권에 해당한다.","tip":"노동조합의 조직·가입은 단결권, 사용자와의 협상은 단체 교섭권, 파업 등 쟁의 행위는 단체 행동권이다.","caution":"","check":{"q":"위험과 불확실성을 무릅쓰고 새로운 기술과 시장에 도전하는 정신은?","why":"이윤을 추구하는 과정에서 위험을 감수하며 혁신과 새로운 시장에 도전하는 정신은 기업가 정신이다."},"origin":""},"L07-3":{"title":"소비자 주권과 윤리적 소비","goal":"소비자가 생산과 지속가능발전에 미치는 영향을 알아보자.","headings":["소비자 주권","윤리적 소비","윤리적 만족과 합리적 선택"],"paragraphs":["소비자 주권은 재화와 서비스의 종류나 수량을 결정하는 데 소비자가 결정적인 권한을 가진다는 의미이다. 소비자의 선택은 기업이 무엇을 얼마나 생산할지에 영향을 준다. 소비자는 상품의 가격과 품질에 관한 정보를 바탕으로 합리적으로 소비하여 기업의 생산을 바람직한 방향으로 이끌 수 있다.","윤리적 소비는 더 나은 사회를 만들기 위해 윤리적 가치와 신념을 고려하는 소비이다. 생산자의 대우, 노동 조건, 환경에 미치는 영향 등을 고려하여 상품을 선택하는 것이 그 예이다. 이러한 소비는 경제 성장, 사회의 안정과 통합, 환경 보전을 함께 추구하는 지속가능발전에 기여할 수 있다.","편익에는 상품을 이용하면서 느끼는 만족뿐 아니라 윤리적 가치를 실천하는 만족도 포함될 수 있다. 따라서 가격이 더 비싼 상품을 샀다는 이유만으로 비합리적이라고 할 수는 없다. 아래 예제처럼 윤리적 만족을 포함한 편익이 주어졌다면 이를 비용과 함께 비교하여 합리적인 선택을 구한다."],"example":"A의 편익은 16, 가격은 6이다. B의 편익은 윤리적 가치를 실천하는 만족을 포함하여 20이고 가격은 9이다. 두 상품 중 하나만 선택하며 주어진 편익과 비용만 고려한다. 어느 상품을 선택하는 것이 유리한가?","steps":["A의 편익에서 가격을 빼면 16−6=10이다.","B의 편익에는 윤리적 만족이 포함되어 있다. 가격을 빼면 20−9=11이다.","B의 가격은 더 높지만 편익에서 가격을 뺀 값도 더 크므로 B가 유리하다."],"result":"주어진 편익과 비용을 비교하면 B를 선택하는 것이 유리하다.","tip":"합리적 소비는 가장 싼 상품을 고르는 것과 다르다. 상품에서 얻는 편익과 기회비용을 함께 고려한다.","caution":"이 예제에서는 B의 편익 20에 윤리적 만족이 이미 포함되어 있다. 이를 별도로 다시 더하지 않는다.","check":{"q":"윤리적 소비와 합리적 소비의 관계로 옳은 것은?","o":["두 소비는 함께 이루어질 수 없다.","윤리적이면서 합리적인 소비가 가능하다."],"why":"윤리적 가치를 실천하는 만족도 편익에 포함될 수 있다. 이를 고려한 순편익이 가장 크다면 윤리적 소비가 합리적 선택이 될 수 있다."},"origin":""},"L08-1":{"title":"예금의 종류와 납입 방식","goal":"요구불 예금, 정기 예금, 정기 적금의 특징을 비교해 보자.","headings":["요구불 예금과 저축성 예금","정기 예금과 정기 적금","예치 기간과 이자"],"paragraphs":["예금은 이자 수익이나 자금 보관을 목적으로 금융 기관에 맡기는 자금 또는 금융 자산이다. 요구불 예금은 입금과 출금이 자유로워 주로 자금의 보관과 결제에 이용된다. 저축성 예금은 정해진 기간 동안 자금을 맡기거나 정기적으로 적립하는 예금이다.","정기 예금은 목돈을 한 번에 맡기고 만기에 원금과 이자를 받는 방식이다. 정기 적금은 일정 금액을 정기적으로 납입하고 만기에 원금과 이자를 받는 방식이다. 두 상품은 돈을 한꺼번에 맡기는지, 나누어 맡기는지에서 차이가 있다.","납입 총액이 같아도 돈을 맡긴 시점이 다르면 이자는 달라질 수 있다. 정기 적금에서는 나중에 납입한 돈일수록 예치 기간이 짧다. 따라서 예금과 적금의 이자를 비교할 때에는 이자율뿐 아니라 각 금액을 맡긴 기간과 이자 계산 방식도 고려해야 한다."],"example":"A는 첫 달에 600을 한 번 맡기고, B는 여섯 달 동안 매월 100씩 맡긴다. 두 방식의 납입 총액과 예치 기간을 비교해 보자.","steps":["A는 첫 달에 600을 맡기므로 납입 총액은 600이다.","B는 매월 100씩 여섯 번 맡기므로 납입 총액은 100×6=600이다.","납입 총액은 같지만 B는 나중에 맡긴 돈일수록 예치 기간이 짧다. 따라서 납입 총액이 같다는 이유만으로 이자도 같다고 할 수는 없다."],"result":"두 방식의 납입 총액은 모두 600이다. 다만 돈을 맡긴 시점과 예치 기간이 다르다.","tip":"자유로운 입출금은 요구불 예금, 목돈을 한 번에 맡기는 방식은 정기 예금, 정기적으로 나누어 납입하는 방식은 정기 적금이다.","caution":"특정 날짜에 자금을 사용할 수 있는지 묻는 문제에서는 제시된 만기일과 인출 조건을 적용한다.","check":{"q":"일정 금액을 일정 기간 동안 정기적으로 납입하는 저축성 예금은?","why":"정기 적금이다. 정기 예금은 목돈을 한 번에 맡기는 방식이다."},"origin":""},"L08-2":{"title":"주식과 채권","goal":"주식과 채권의 발행자, 보유자의 지위, 수익 형태를 비교해 보자.","headings":["주식","채권","새로운 발행과 기존 증서의 매매"],"paragraphs":["주식은 주식회사가 경영 자금을 마련하기 위해 투자자의 지분을 표시하여 발행하는 증서이다. 주식을 보유한 사람은 주주로서 회사의 의사 결정에 관한 권리를 가진다. 또한 배당 수익을 기대할 수 있으며, 주식을 산 가격보다 높은 가격에 팔면 시세 차익을 얻는다.","채권은 정부, 지방 자치 단체, 공공 기관, 기업 등이 자금을 빌리면서 원금과 이자의 지급을 약속하고 발행하는 차용 증서이다. 채권을 보유한 사람은 발행자에게 돈을 빌려준 채권자이다. 채권에서는 이자 수익을 기대할 수 있으며, 만기 전에 매매하여 시세 차익을 얻을 수도 있다.","주식회사가 주식을 새로 발행하여 자금을 조달하면 자본금이 증가한다. 채권을 발행하여 자금을 빌리면 부채가 증가한다.\n\n이미 발행된 주식이나 채권을 투자자끼리 사고파는 것은 새로운 발행과 다르다. 이 경우 매수자가 낸 돈은 매도자에게 지급되므로 발행자에게 새 자금이 들어오는 것은 아니다."],"example":"A는 기업에 대한 투자자의 지분을 표시한 증서이다. B는 기업이 빌린 돈의 원금과 이자를 지급하기로 약속한 증서이다. 각 증서와 보유자의 지위를 구분해 보자.","steps":["A는 투자자의 지분을 표시한 주식이며, 보유자는 주주이다.","B는 원금과 이자 지급을 약속한 채권이며, 보유자는 채권자이다.","새로 발행하는 경우 주식은 발행자의 자본금을, 채권은 발행자의 부채를 증가시킨다."],"result":"A는 주식, B는 채권이다. 주식 보유자는 주주, 채권 보유자는 채권자이다.","tip":"주식과 채권은 모두 시세 차익을 기대할 수 있다. 주식에서는 배당을, 채권에서는 이자를 기대할 수 있다는 차이가 있다.","caution":"채권은 원금과 이자의 지급을 약속한 증서이지만, 발행자의 지급 능력에 따라 손실 위험이 달라질 수 있다.","check":{"q":"원금과 이자 지급을 약속한 차용 증서를 보유한 사람의 지위는?","why":"채권을 보유한 사람이므로 채권자이다. 주식을 보유한 주주와 구별된다."},"origin":""},"L08-3":{"title":"이자·배당·시세 차익과 총손익","goal":"금융 자산의 수익 형태를 구별하고 총손익을 계산해 보자.","headings":["금융 자산별 수익 형태","매매 손익","배당을 포함한 총손익"],"paragraphs":["예금과 채권에서는 이자 수익을, 주식에서는 배당 수익을 기대할 수 있다. 배당은 주식회사가 얻은 수익 중 일부를 지분에 따라 주주에게 나누어 주는 것이다. 주식과 채권은 매매를 통해 시세 차익도 얻을 수 있다.","자산을 산 가격보다 높은 가격에 팔면 시세 차익을 얻고, 낮은 가격에 팔면 매매 손실이 발생한다. 매도 대금에는 처음 투자한 금액도 포함되므로 매도 대금 전체가 이익은 아니다.\n\n매매 손익 = 매도 대금 − 매수 대금","주식의 총손익을 구할 때에는 매매 손익에 배당 수익을 더한다. 주당 배당금이 2이고 보유 주식이 3주라면 배당 총액은 2×3=6이다. 매매 손익도 주당 가격 차이에 주식 수를 곱하여 구한다. 세금이나 수수료가 제시되었다면 그 금액을 비용으로 반영한다."],"example":"주식 2주를 주당 50에 사서 주당 56에 팔았다. 배당은 주당 1이며 다른 비용은 없다. 총이익을 구해 보자.","steps":["매수 대금은 50×2=100, 매도 대금은 56×2=112이다.","매매 차익은 매도 대금에서 매수 대금을 뺀 112−100=12이다.","배당 총액은 1×2=2이다. 매매 차익에 배당을 더하면 총이익은 12+2=14이다."],"result":"매도 대금은 112이지만, 매매 차익과 배당을 합한 총이익은 14이다.","tip":"주당 금액과 전체 보유 주식에 대한 금액을 구별한다. 주당 가격 차이와 주당 배당금에는 각각 주식 수를 곱한다.","caution":"배당을 받았더라도 매매 손실이 더 크면 총손익은 음(-)의 값이 될 수 있다.","check":{"q":"주식 1주를 80에 사서 75에 팔고 배당 2를 받았다. 총손익은 얼마인가?","why":"매매 손익은 75−80=−5이다. 배당 2를 더하면 총손익은 −3이다."},"origin":""},"L09-1":{"title":"자산 관리의 세 가지 원칙","goal":"안전성·수익성·유동성의 의미와 차이를 알아보자.","headings":["안전성·수익성·유동성","안전성과 유동성의 차이","수익성과 안전성의 관계"],"paragraphs":["자산 관리는 안정적인 경제생활을 위해 자산의 취득, 보유, 처분을 합리적으로 선택하는 과정이다. 자산을 관리할 때에는 다음의 원칙을 고려한다.\n\n① 안전성: 투자한 자산의 가치가 보호될 수 있는 정도\n② 수익성: 자산의 가치 상승이나 이자 등의 수익을 기대할 수 있는 정도\n③ 유동성: 보유한 자산을 쉽게 현금으로 바꿀 수 있는 정도","자산을 쉽게 팔 수 있다는 것과 손실 없이 팔 수 있다는 것은 다르다. 바로 매도할 수 있어도 가격이 크게 떨어질 수 있다면 유동성은 높지만 안전성은 낮을 수 있다. 반대로 받을 금액이 정해져 있어도 필요한 날짜까지 현금화할 수 없다면 당장의 지출에 쓰기 어렵다.","일반적으로 수익성과 안전성은 상충 관계에 있다. 높은 수익을 기대할 수 있는 자산은 원금 손실의 위험도 큰 편이고, 원금 손실의 위험이 낮은 자산에서는 높은 수익을 기대하기 어렵다. 따라서 자금을 어디에 사용할지와 언제 필요한지를 고려하여 자산을 선택한다."],"example":"A는 오늘 현금화할 수 있지만 금액이 변동한다. B는 금액이 고정되어 있으나 한 달 뒤에만 찾을 수 있다. 내일 돈이 필요할 때 두 자산의 어떤 특성을 고려해야 하는가?","steps":["A를 오늘 현금화할 수 있다는 것은 유동성에 관한 정보이다.","B의 금액이 고정되어 있다는 것은 가치에 관한 정보이고, 한 달 뒤에만 찾을 수 있다는 것은 인출 시점에 관한 정보이다.","내일 자금을 사용하려면 그 전에 현금화할 수 있어야 하며, 실제로 받을 금액도 필요한 지출액 이상이어야 한다."],"result":"현금화할 수 있는 시점과 실제로 받을 금액을 함께 살펴야 한다.","tip":"가치의 보호는 안전성, 수익에 대한 기대는 수익성, 현금화의 용이성은 유동성이다.","caution":"","check":{"q":"자산을 짧은 시간 안에 쉽게 매도할 수 있다는 것은 어떤 특성인가?","why":"쉽게 현금으로 바꿀 수 있는 정도인 유동성에 관한 설명이다."},"origin":""},"L09-2":{"title":"펀드·보험·연금","goal":"펀드·보험·연금의 목적과 특징을 구분해 보자.","headings":["펀드","보험","연금"],"paragraphs":["펀드는 전문 기관이 투자자들의 자금을 모아 운용하고 그 결과에 따라 수익을 돌려주는 간접 투자 상품이다. 전문가가 투자를 대신한다는 장점이 있다. 다만 운용 결과에 따라 수익이 달라지므로 원금 손실이 발생할 수 있다.","보험은 미래의 위험에 대비하여 평소에 보험료를 내고 사고가 발생하면 보험금을 받는 금융 상품이다. 수익을 최대한 늘리기보다 사고에 따른 손실을 줄이는 데 목적이 있다. 가입자가 내는 돈은 보험료이고, 사고 발생 시 약정에 따라 받는 돈은 보험금이다.","연금은 노후 생활의 안정을 위해 일정 금액을 적립하고 노령이나 은퇴 시 약속한 금액을 받는 금융 상품 또는 제도이다. 공적 연금, 퇴직 연금, 개인 연금 등이 있다. 연금은 노후에 필요한 소득을 마련하는 데 목적이 있다."],"example":"A는 전문 기관이 투자자들의 자금을 모아 운용한다. B는 사고로 인한 손실에 대비한다. C는 은퇴 이후의 생활 안정을 준비한다. 각각 어떤 금융 자산에 해당하는가?","steps":["A는 전문 기관이 자금을 모아 운용하는 펀드이다.","B는 사고로 인한 손실에 대비하는 보험이다.","C는 노후 생활의 안정을 위한 연금이다."],"result":"A는 펀드, B는 보험, C는 연금이다.","tip":"간접 투자는 펀드, 사고 손실에 대한 대비는 보험, 노후 소득 마련은 연금과 관련된다.","caution":"","check":{"q":"펀드의 특징으로 옳은 것은?","o":["전문가가 운용하므로 원금 손실이 발생하지 않는다.","전문가가 운용하더라도 원금 손실이 발생할 수 있다."],"why":"펀드의 수익은 운용 결과에 따라 달라지므로 원금 손실이 발생할 수 있다."},"origin":""},"L09-3":{"title":"분산 투자와 전체 수익률","goal":"투자 금액을 고려하여 전체 손익을 구해 보자.","headings":["분산 투자와 포트폴리오","투자 금액에 따른 손익","전체 수익률"],"paragraphs":["분산 투자는 자금을 여러 금융 상품에 나누어 투자하는 것이다. 안전성과 수익성의 상충 관계를 고려하여 투자 목적과 기간, 각 자산의 특성에 맞게 자금을 배분한다. 보유한 금융 자산의 목록을 포트폴리오라고 한다.","여러 자산에 투자했을 때의 전체 손익은 각 자산의 투자 금액과 수익률을 이용하여 구한다. 투자 금액이 많은 자산의 수익률 변화는 전체 손익에 더 큰 영향을 준다. 따라서 투자 금액이 서로 다르면 수익률의 단순 평균을 전체 수익률로 사용할 수 없다.","자산별 최종 금액을 모두 더한 뒤 전체 투자 원금을 빼면 총손익이다. 총손익을 전체 원금으로 나누면 전체 수익률을 구할 수 있다.\n\n총손익 = 최종 금액의 합 − 투자 원금의 합\n전체 수익률 = 총손익 ÷ 투자 원금의 합 × 100\n\n분산 투자에도 손실 가능성은 남아 있다. 여러 자산의 가치가 함께 하락하면 전체 자산의 가치도 줄어들 수 있다."],"example":"A에 80, B에 20을 투자하였다. 어느 상황에서 A의 수익률은 +10%, B의 수익률은 −20%이며 다른 비용은 없다. 전체 최종 금액과 총손익을 구해 보자.","steps":["A의 최종 금액은 80×1.1=88이다.","B의 최종 금액은 20×0.8=16이다.","최종 금액의 합은 88+16=104이다. 전체 원금 100을 빼면 총손익은 +4이다."],"result":"전체 최종 금액은 104, 총손익은 +4이다. 투자 금액이 다르므로 두 수익률의 단순 평균인 −5%를 적용하지 않는다.","tip":"투자 비중이 다르면 각 투자 금액에 해당 수익률을 적용한 뒤 합산한다.","caution":"","check":{"q":"분산 투자에 대한 설명으로 옳은 것은?","o":["여러 자산에 투자하면 손실이 완전히 사라진다.","목적·기간·위험을 고려하여 나누어 투자하되 손실 가능성도 고려해야 한다."],"why":"분산 투자를 해도 각 자산의 운용 결과에 따라 전체 자산에서 손실이 발생할 수 있다."},"origin":""},"L10-1":{"title":"금융 생활 설계와 자금의 사용 시점","goal":"재무 목표와 수입·지출 시점을 고려하여 자금 계획을 세워 보자.","headings":["금융 생활 설계","재무 상태와 자금의 사용 시점","생애 주기를 고려한 계획"],"paragraphs":["금융 생활 설계는 생애 주기별 과업을 고려하여 재무 목표를 정하고, 이를 달성하기 위해 자산을 효율적으로 관리하는 것이다. 재무 목표 설정, 재무 상태 분석, 재무 계획 수립, 실행, 평가 및 수정의 순서로 이루어진다.","재무 상태를 분석할 때에는 현재의 자산과 부채, 수입과 지출, 이용 가능한 자원을 파악한다. 전체 수입이 충분해도 지출일 전에 돈이 들어오지 않으면 자금이 부족할 수 있다. 따라서 금액과 함께 수입일과 지출일도 고려해야 한다.","생애 주기별 수입·지출 곡선은 삶의 단계에 따라 수입과 지출이 달라지는 모습을 나타낸다. 개인의 소득, 가족 상황, 목표가 다르면 필요한 자금과 마련 방법도 달라진다. 금융 생활을 설계할 때에는 자신의 현재 여건과 앞으로 필요한 자금을 함께 고려한다."],"example":"6개월 동안 매월 말에 200씩 지출한다. 수입 1,200은 6개월째 월초에 한 번 들어온다. 남은 돈은 다음 달에 사용할 수 있지만 대출을 받거나 지출을 미룰 수는 없다. 처음에 준비해야 할 최소 자금을 구해 보자.","steps":["수입은 6개월째 월초에 들어오므로 첫 다섯 달의 지출은 초기 자금으로 충당해야 한다.","첫 다섯 달의 지출 합계는 200×5=1,000이다.","처음에 1,000을 준비하면 첫 다섯 달의 지출을 감당할 수 있다. 6개월째 말의 지출은 그달 월초에 들어온 수입 1,200으로 낼 수 있다."],"result":"모든 지출을 제때 하려면 초기 자금이 최소 1,000 필요하다.","tip":"수입이 들어오기 전에 발생하는 지출은 초기 자금으로 준비해야 한다. 날짜순으로 잔액을 계산하면 필요한 금액을 구할 수 있다.","caution":"","check":{"q":"재무 상태를 분석할 때 살펴야 할 항목은?","why":"현재의 자산과 부채, 수입과 지출을 파악해야 이용 가능한 자금과 부담해야 할 금액을 알 수 있다."},"origin":""},"L10-2":{"title":"단리와 복리","goal":"이자 계산 방식에 따른 원리금의 차이를 알아보자.","headings":["단리","복리","원리금과 이자의 계산"],"paragraphs":["단리는 기간마다 처음 원금에 대해서만 이자를 계산하는 방식이다. 원금과 이자율이 일정하면 매 기간 발생하는 이자도 같다. 원금 100을 연 10% 단리로 맡기면 해마다 이자는 10씩 발생한다.","복리는 원금에 이전 기간의 이자를 더한 금액을 기준으로 다음 기간의 이자를 계산하는 방식이다. 첫 기간에는 단리와 이자가 같지만, 다음 기간부터는 이미 발생한 이자에도 이자가 붙는다. 연복리라면 해마다 계산한 원리금이 다음 해의 이자 계산 기준이 된다.","원금이 P, 한 기간의 이자율이 r, 기간 수가 n이고 중간 입출금과 별도 비용이 없다면 다음과 같이 계산한다.\n\n단리 원리금 = P(1+rn)\n복리 원리금 = P(1+r)ⁿ\n\n원리금은 원금과 이자를 합한 금액이다. 이자만 구하려면 원리금에서 처음 원금을 뺀다."],"example":"원금 100을 연 10%의 이자율로 2년 동안 맡긴다. 이자는 매년 말 계산하며 중간 입출금, 세금, 수수료는 없다. 단리와 복리의 원리금 및 이자를 비교해 보자.","steps":["단리는 매년 원금 100에 대한 이자 10이 발생한다. 2년 후 원리금은 100+10+10=120이다.","복리는 1년 말에 원리금이 110이 되고, 2년째에는 110에 이자가 붙는다. 2년 말 원리금은 110×1.1=121이다.","원리금에서 원금 100을 빼면 이자는 단리 20, 복리 21이다."],"result":"2년 후 원리금은 단리 120, 복리 121이며, 이자는 각각 20과 21이다.","tip":"처음 원금에만 이자가 붙으면 단리, 이전 기간의 이자까지 합한 금액에 이자가 붙으면 복리이다.","caution":"이자율과 기간의 단위를 맞춘다. 연 이자율을 매달 그대로 적용하지 않는다.","check":{"q":"원금 100을 연 10% 복리로 2년 동안 맡겼을 때 이자는 얼마인가?","why":"원리금은 100×1.1²=121이다. 여기서 원금 100을 빼면 이자는 21이다."},"origin":""},"L10-3":{"title":"납입 시점과 예치 기간","goal":"각 납입금의 예치 기간을 고려하여 만기 금액을 계산해 보자.","headings":["같은 만기일과 다른 납입일","납입금별 원리금 계산","전체 원금과 이자"],"paragraphs":["여러 번 납입한 돈을 같은 날 찾더라도 예치 기간은 서로 다를 수 있다. 첫해 초에 맡긴 돈은 둘째 해 초에 맡긴 돈보다 더 오래 예치된다. 따라서 납입금마다 이자가 붙는 기간을 따로 계산해야 한다.","이자를 매년 말 계산하는 연복리에서 첫해 초에 납입하고 둘째 해 말에 찾으면 예치 기간은 2년이다. 둘째 해 초에 납입하고 그해 말에 찾으면 1년이다. 각 납입금에 해당 기간의 복리를 적용한 뒤 원리금을 더하면 만기 총액을 구할 수 있다.","만기 총액에는 납입한 원금과 이자가 모두 포함된다. 따라서 이자만 구하려면 만기 총액에서 전체 납입 원금을 뺀다. 나중에 납입한 돈에도 처음부터 이자가 붙었다고 계산하면 이자를 실제보다 크게 구하게 된다."],"example":"연 10% 복리로 첫해 초에 100, 둘째 해 초에 100을 납입하고 둘째 해 말에 찾는다. 이자는 매년 말 계산하며 다른 거래와 비용은 없다. 만기 총액과 이자를 구해 보자.","steps":["첫 번째 납입금은 2년 동안 예치되므로 원리금은 100×1.1²=121이다.","두 번째 납입금은 1년 동안 예치되므로 원리금은 100×1.1=110이다.","두 원리금을 합하면 만기 총액은 121+110=231이다.","전체 원금 200을 빼면 이자는 231−200=31이다."],"result":"만기 총액은 231, 이자는 31이다. 전체 원금 200에 모두 2년 복리를 적용한 242는 잘못된 계산이다.","tip":"각 납입금의 납입일에서 인출일까지 이자가 몇 번 계산되는지 센 뒤 원리금을 구한다.","caution":"월초·월말 등 납입일이 달라지면 예치 기간도 달라질 수 있다. 문제에 제시된 납입일과 이자 계산일을 적용한다.","check":{"q":"첫해 초와 둘째 해 초에 납입한 돈을 둘째 해 말에 찾는다. 각 납입금의 예치 기간은?","o":["둘 다 2년이다.","각각 2년과 1년이다.","둘 다 1년이다."],"why":"첫 번째 납입금은 첫해와 둘째 해에, 두 번째 납입금은 둘째 해에 이자가 붙는다."},"origin":""},"L11-1":{"title":"금리·물가와 화폐의 구매력","goal":"금리와 물가의 의미를 이해하고 이자와 구매 가능 수량을 계산해 보자.","headings":["금리와 이자","물가와 화폐의 실질 가치","금리·물가와 금융 의사 결정"],"paragraphs":["금리는 이자를 원금에 대한 비율로 나타낸 것으로 이자율이라고도 한다. 원금과 기간, 이자 계산 방식이 같다면 금리가 높을수록 이자 금액이 커진다. 금리가 3%에서 5%로 올랐다면 2%포인트 상승한 것이다.","물가는 여러 재화와 서비스의 가격을 일정한 기준에 따라 평균한 종합적인 가격 수준이다. 물가가 상승하면 같은 돈으로 살 수 있는 재화와 서비스의 양이 줄어들므로 화폐의 실질 가치가 하락한다. 반대로 물가가 하락하면 같은 돈으로 더 많은 재화와 서비스를 살 수 있다.","금리가 높아지면 같은 원금의 대출에 대한 이자 부담이 커질 수 있다. 물가가 오르면 금융 자산으로 얻은 금액의 구매력이 줄어들 수 있다. 이처럼 금리와 물가의 변화는 개인의 저축·투자·대출에 관한 결정에 영향을 준다. 구체적인 금액은 주어진 원금, 기간, 가격 등의 조건으로 계산한다."],"example":"예산 10,000원으로 같은 상품을 구입한다. 상품 가격이 1,000원에서 1,250원으로 올랐으며, 상품은 정수 개만 살 수 있다. 구매 가능한 수량은 어떻게 달라지는가?","steps":["가격이 오르기 전에는 10,000÷1,000=10개를 살 수 있다.","가격이 오른 뒤에는 10,000÷1,250=8개를 살 수 있다.","같은 예산으로 살 수 있는 수량이 10개에서 8개로 줄어든다."],"result":"예산은 그대로이지만 상품 가격이 올라 구매 가능한 수량은 10개에서 8개로 감소한다.","tip":"이자는 원금과 이자율, 기간을 이용하여 계산한다. 구매 가능 수량은 예산을 상품 한 개의 가격으로 나누어 구한다.","caution":"예제는 한 상품의 가격 변화를 다룬다. 개별 상품의 가격과 여러 상품의 종합적인 가격 수준인 물가는 구별한다.","check":{"q":"원금 1,000만 원을 연 5% 단리로 1년 동안 맡겼을 때 이자는 얼마인가?","why":"1,000×0.05=50이므로 이자는 50만 원이다. 원금과 이자를 합한 원리금은 1,050만 원이다."},"origin":""},"L11-2":{"title":"환율과 원화 기준 손익","goal":"매수·매도 시점의 환율을 적용하여 원화 기준 손익을 구해 보자.","headings":["원/달러 환율","환율 변화와 원화 환산액","외화 자산의 매매 손익"],"paragraphs":["환율은 한 나라의 통화와 다른 나라 통화 사이의 교환 비율이다. 원/달러 환율은 1달러와 교환할 수 있는 원화 금액을 나타낸다. 달러를 원화로 환산할 때에는 달러 금액에 원/달러 환율을 곱한다. 원화로 살 수 있는 달러 금액은 원화 금액을 원/달러 환율로 나누어 구한다.","원/달러 환율이 상승하면 같은 달러 금액을 원화로 바꿀 때 더 많은 원화를 받는다. 반대로 달러를 사야 하는 사람은 더 많은 원화를 지출해야 한다. 환율이 하락하면 같은 달러의 원화 환산액이 작아진다.","외화 자산의 가격과 환율이 함께 달라졌다면 매수할 때 지출한 원화 금액과 매도한 뒤 받은 원화 금액을 각각 계산한다. 두 금액의 차이가 원화 기준 매매 손익이다. 자산의 달러 가격이 하락하더라도 환율 상승의 영향으로 원화 기준 이익이 발생할 수 있다."],"example":"자산 1개를 100달러에 매수하였다. 매수 당시 원/달러 환율은 1달러당 1,200원이었다. 이후 이 자산을 90달러에 매도하였으며, 매도 당시 환율은 1달러당 1,400원이었다. 별도의 비용과 수익은 없다. 원화 기준 손익을 구해 보자.","steps":["매수할 때 100달러를 마련하려면 1달러당 1,200원이 필요했다. 따라서 지출한 원화 금액은 100×1,200=120,000원이다.","매도 대금 90달러를 1달러당 1,400원에 원화로 바꾸면 90×1,400=126,000원을 받는다.","받은 금액에서 지출한 금액을 빼면 126,000−120,000=6,000원이다. 따라서 원화 기준으로 6,000원의 이익이 발생하였다."],"result":"달러 가격은 하락했지만 환율 상승의 영향으로 원화 기준 이익 6,000원이 발생하였다.","tip":"매수 금액에는 매수 당시의 환율을, 매도 금액에는 매도 당시의 환율을 적용한다.","caution":"수수료·배당 등 별도의 비용이나 수익이 제시되었다면 해당 금액과 환산 시점도 반영한다.","check":{"q":"100달러를 1달러당 1,200원의 환율로 바꾸면 몇 원인가?","why":"100×1,200=120,000원이므로 12만 원이다."},"origin":""},"L11-3":{"title":"경제 환경의 변화와 금융 의사 결정","goal":"금리·물가·환율과 사회적 변화가 금융 선택에 미치는 영향을 알아보자.","headings":["경제적·사회적 환경","불확실성과 자산 선택","환율 변화와 거래의 차이"],"paragraphs":["금융 의사 결정은 개인의 재무 목표뿐 아니라 경제적·정치적·사회적 환경의 영향을 받는다. 금리, 물가, 환율은 대표적인 경제적 요인이다. 전쟁, 팬데믹, 금융 위기와 같은 사회적 변화도 자산의 선택과 관리에 영향을 줄 수 있다.","경제 상황에 대한 불확실성이 커지면 높은 수익보다 자산의 안전성과 유동성을 중시하는 경향이 나타날 수 있다. 자금을 언제 사용해야 하는지, 어느 정도의 손실을 감당할 수 있는지에 따라서도 선택이 달라진다. 따라서 금융 선택에는 경제 환경과 개인의 여건이 함께 작용한다.","같은 환율 변화라도 달러를 받는 사람과 지급하는 사람에게 미치는 영향은 다르다. 원/달러 환율이 오르면 같은 달러를 원화로 바꾸는 사람은 더 많은 원화를 받는다. 달러 대금을 마련하는 사람은 더 많은 원화가 필요하므로 지출 부담이 커진다."],"example":"원/달러 환율이 1달러당 1,000원에서 1,100원으로 올랐다. 갑은 100달러를 받아 원화로 바꾸고, 을은 100달러를 마련해야 한다. 다른 조건이 같을 때 두 사람에게 어떤 변화가 생기는가?","steps":["갑이 받는 원화는 100×1,000=100,000원에서 100×1,100=110,000원으로 늘어난다.","을이 100달러를 마련하는 데 지출할 원화도 100,000원에서 110,000원으로 늘어난다.","갑은 받는 금액이 증가하지만 을은 지출 부담이 증가한다."],"result":"환율 상승으로 갑이 받는 원화 금액과 을이 지출할 원화 금액이 모두 증가한다.","tip":"환율 변화 문제에서는 각 경제 주체가 외화를 받는지, 외화를 지급해야 하는지 구분한다.","caution":"","check":{"q":"금융 위기 때 안전성을 중시하는 경향이 나타날 수 있다는 설명으로 알 수 있는 것은?","o":["모든 자산의 가격 상승이 보장된다.","경제 상황의 변화가 금융 선택에 영향을 줄 수 있다."],"why":"경제적 불확실성의 증가는 자산 선택에 영향을 줄 수 있다. 다만 특정 자산의 가격 상승이 보장되는 것은 아니다."},"origin":""},"L12-1":{"title":"생산 조건의 차이와 무역","goal":"나라별 생산 조건의 차이가 무역의 원인이 되는 이유를 알아보자.","headings":["국제 분업과 무역","생산 조건과 생산 비용","무역의 이익"],"paragraphs":["국제 분업은 각 나라가 무역에 유리한 재화나 서비스를 특화하여 생산하는 것이다. 무역은 각 나라가 생산한 재화와 서비스 등을 다른 나라와 사고파는 국제 거래이다. 나라별로 생산 조건이 다르기 때문에 같은 상품을 생산하더라도 비용과 효율에 차이가 생긴다.","각 나라가 보유한 자원의 양과 질, 기후·지형·토양 등의 자연환경은 서로 다르다. 노동·자본·토지와 같은 생산 요소의 보유 정도와 기술 수준에도 차이가 있다. 이러한 차이는 생산할 수 있는 상품의 종류와 생산 비용에 영향을 준다.","무역을 통해 자국에서 생산되지 않는 재화를 구하고 다양한 상품과 서비스를 소비할 수 있다. 국내에서 생산할 수 있는 상품이라도 외국에서 더 낮은 비용으로 생산한다면 수입하는 것이 유리할 수 있다. 시장이 넓어져 생산량이 늘면 규모의 경제를 얻을 수도 있다."],"example":"A 집단은 재료가 풍부하지만 도구가 부족하다. B 집단은 도구를 가지고 있지만 재료가 부족하다. 두 집단이 교환을 통해 얻을 수 있는 이익을 설명해 보자.","steps":["A 집단에는 도구가, B 집단에는 재료가 부족하다.","A 집단의 재료와 B 집단의 도구나 기술 서비스를 서로 교환할 수 있다.","교환을 통해 각 집단은 생산에 필요한 재료나 도구를 확보할 수 있다."],"result":"두 집단은 교환을 통해 자신에게 부족한 재료나 도구를 확보할 수 있다.","tip":"부존자원, 자연환경, 생산 요소, 기술 수준의 차이는 나라별 생산 비용의 차이를 가져올 수 있다.","caution":"국가가 무역으로 이익을 얻더라도 그 이익이 국내의 모든 사람에게 똑같이 돌아가는 것은 아니다.","check":{"q":"같은 재료를 가공하는 방법의 차이는 무엇과 가장 직접적으로 관련되는가?","why":"재료를 가공하는 방법은 생산 기술에 해당하므로 기술 수준의 차이와 관련된다."},"origin":""},"L12-2":{"title":"생산 요소와 최대 생산량","goal":"재료와 노동의 보유량을 고려하여 최대 생산량을 구해 보자.","headings":["생산에 필요한 요소","부족한 생산 요소","추가 투입과 생산량"],"paragraphs":["제품을 생산하려면 필요한 생산 요소를 모두 투입해야 한다. 재료가 충분해도 노동이 부족하면 원하는 수량을 생산하기 어렵다. 아래에서는 제품 한 개에 필요한 재료와 노동의 양이 일정하고, 제품은 정수 개만 생산할 수 있다고 가정한다.","제품 한 개에 재료 2와 노동 1이 필요한데 재료는 8, 노동은 3을 가지고 있다고 하자. 재료는 제품 4개분이지만 노동은 3개분이다. 재료와 노동이 모두 필요하므로 최대 생산량은 3개이다. 재료가 남더라도 노동이 부족하면 더 생산할 수 없다.","부족한 생산 요소를 추가로 확보하면 생산량을 늘릴 수 있다. 반면 이미 충분한 요소만 늘리면 다른 요소의 부족으로 생산량이 그대로일 수 있다. 각 요소로 생산할 수 있는 수량을 구한 뒤 가장 작은 수량을 찾으면 최대 생산량을 알 수 있다."],"example":"제품 한 개를 생산하는 데 재료 3과 노동 2가 필요하다. 보유한 재료는 18, 노동은 10이며 제품은 정수 개만 생산한다. 최대 생산량과 생산 후 남는 재료·노동을 구해 보자.","steps":["재료만 고려하면 18÷3=6개를 생산할 수 있다.","노동만 고려하면 10÷2=5개를 생산할 수 있다.","두 요소가 모두 필요하므로 최대 생산량은 더 작은 값인 5개이다.","제품 5개를 생산하면 재료는 18−3×5=3이 남고 노동은 10−2×5=0이 남는다."],"result":"최대 생산량은 5개이며, 생산 후 재료는 3이 남고 노동은 모두 사용된다.","tip":"요소별 보유량을 제품 한 개에 필요한 양으로 나눈 뒤, 생산 가능한 수량 중 가장 작은 값을 고른다.","caution":"","check":{"q":"재료는 제품 6개분, 노동은 5개분이며 다른 제약은 없다. 두 요소가 모두 필요할 때 최대 생산량은?","why":"노동이 5개분뿐이므로 최대 5개를 생산할 수 있다."},"origin":""},"L12-3":{"title":"규모의 경제와 평균 생산 단가","goal":"총비용과 평균 생산 단가를 구별하여 규모의 경제를 판단해 보자.","headings":["규모의 경제","총비용과 평균 생산 단가","생산량 증가와 비용 비교"],"paragraphs":["규모의 경제는 생산 규모가 커지거나 생산량이 늘어날수록 평균 생산 단가가 하락하는 현상이다. 평균 생산 단가는 총비용을 생산량으로 나눈 값으로, 제품 한 단위를 생산하는 데 평균적으로 드는 비용을 나타낸다.","생산량이 증가하면 총비용이 늘더라도 평균 생산 단가는 낮아질 수 있다. 100개를 생산할 때 총비용이 200이고 200개를 생산할 때 총비용이 300이면, 평균 단가는 각각 2와 1.5이다. 총비용은 증가했지만 한 개당 평균 비용은 감소하였다.","생산량이 100개에서 200개로 늘어난 경우를 다시 살펴보자. 총비용은 200에서 300으로 늘었지만 생산량은 두 배가 되었다. 그 결과 한 개당 비용은 2에서 1.5로 줄었다. 규모의 경제는 이처럼 총비용이 아니라 평균 생산 단가의 변화로 파악한다."],"example":"생산량이 100개일 때 총비용은 250이고, 200개일 때 총비용은 400이다. 평균 생산 단가를 구하고 규모의 경제가 나타나는지 판단해 보자.","steps":["100개를 생산할 때의 평균 단가는 250÷100=2.5이다.","200개를 생산할 때의 평균 단가는 400÷200=2이다.","생산량이 늘면서 평균 단가가 2.5에서 2로 낮아졌으므로 규모의 경제가 나타난다."],"result":"총비용은 증가했지만 평균 생산 단가는 하락하였으므로 규모의 경제가 나타난다.","tip":"평균 생산 단가 = 총비용 ÷ 생산량이다. 생산량이 증가할 때 이 값이 낮아지는지 비교한다.","caution":"","check":{"q":"총비용이 증가했다는 사실만으로 규모의 경제가 나타나지 않았다고 할 수 있는가?","o":["그렇다.","아니다. 생산량을 고려하여 평균 단가를 구해야 한다."],"why":"규모의 경제는 총비용이 아니라 평균 생산 단가가 하락하는 현상이다."},"origin":""},"L13-1":{"title":"생산량표와 투입량표의 기회비용","goal":"표의 종류에 따라 생산의 기회비용을 구해 보자.","headings":["최대 생산량으로 계산하기","단위당 투입량으로 계산하기","기회비용의 재화 단위"],"paragraphs":["최대 생산량표는 자원을 모두 한 재화에 투입했을 때 생산할 수 있는 양을 나타낸다. 생산 가능 곡선이 직선이고 X재를 최대 12개 또는 Y재를 최대 6개 생산할 수 있다면, X재 12개를 생산하기 위해 Y재 6개를 포기해야 한다. 따라서 X재 1개 생산의 기회비용은 Y재 6/12개, 즉 1/2개이다.","단위당 투입량표는 재화 한 개를 생산하는 데 필요한 생산 요소의 양을 나타낸다. X재 1개에 노동 2, Y재 1개에 노동 4가 필요하다면 X재에 투입한 노동 2로 Y재를 2/4개 생산할 수 있다. 따라서 X재 1개 생산의 기회비용은 Y재 1/2개이다.","생산량표와 투입량표는 서로 다른 양을 나타내므로 기회비용을 구할 때 나누는 방향이 다르다.\n\n최대 생산량표: X재 1개 생산의 기회비용 = Y재 최대량 ÷ X재 최대량\n단위당 투입량표: X재 1개 생산의 기회비용 = X재 투입량 ÷ Y재 투입량\n\n두 경우 모두 X재를 생산하면서 포기하는 Y재의 양으로 답한다."],"example":"A국의 총노동량은 48시간이다. X재 1개를 생산하는 데 2시간, Y재 1개를 생산하는 데 4시간이 필요하다. 최대 생산량과 단위당 노동시간을 각각 이용하여 X재 1개 생산의 기회비용을 구해 보자.","steps":["모든 노동을 한 재화에 투입하면 X재는 48÷2=24개, Y재는 48÷4=12개를 생산할 수 있다.","최대 생산량으로 구하면 X재 1개 생산의 기회비용은 Y재 12/24=1/2개이다.","X재 1개에 쓰이는 2시간으로 Y재를 2/4개 생산할 수 있다. 따라서 노동시간으로 구한 기회비용도 Y재 1/2개이다.","같은 생산 조건을 두 방식으로 계산했으므로 결과가 일치한다."],"result":"X재 1개 생산의 기회비용은 Y재 1/2개이다.","tip":"생산하려는 재화에 사용한 자원으로 다른 재화를 얼마나 생산할 수 있는지 생각하면 기회비용을 구할 수 있다.","caution":"분수의 값이 같아도 재화 단위가 다르면 답의 뜻이 달라진다. X재 생산의 기회비용은 포기한 Y재의 수량으로 표시한다.","check":{"q":"X재 1개에 노동 3, Y재 1개에 노동 6이 필요하다. X재 1개 생산의 기회비용은?","o":["Y재 2개","Y재 1/2개"],"why":"X재에 투입한 노동 3으로 Y재를 3/6=1/2개 생산할 수 있다."},"origin":""},"L13-2":{"title":"생산 가능 곡선과 생산 조합","goal":"주어진 자원으로 생산할 수 있는 두 재화의 조합을 구해 보자.","headings":["생산 가능 곡선의 의미","두 재화에 나누어 쓰는 자원","곡선 위·안쪽·바깥쪽의 조합"],"paragraphs":["생산 가능 곡선은 보유한 자원과 기술을 모두 활용하여 최대로 생산할 수 있는 두 재화의 조합을 나타낸다. 두 축의 절편은 한 재화만 생산할 때의 최대 생산량이다. X재 최대량이 12개, Y재 최대량이 6개라는 것은 각각 한 재화만 생산할 때의 수량이지 두 수량을 동시에 생산할 수 있다는 뜻은 아니다.","생산 가능 곡선이 직선이면 생산에 투입한 자원의 비율에 따라 생산량이 달라진다. X재를 최대 생산량의 1/3만큼 생산하면 전체 자원의 1/3을 X재 생산에 사용한다. 남은 자원 2/3으로는 Y재 최대 생산량의 2/3을 생산할 수 있다.","직선인 생산 가능 곡선에서는 ‘X재 생산량÷X재 최대량’과 ‘Y재 생산량÷Y재 최대량’의 합으로 생산 가능 여부를 판단할 수 있다. 합이 1이면 곡선 위의 조합이고, 1보다 작으면 곡선 안쪽의 조합이다. 합이 1보다 크면 현재의 자원과 기술로는 생산할 수 없는 조합이다."],"example":"A국의 생산 가능 곡선은 직선이다. X재만 생산하면 최대 12개, Y재만 생산하면 최대 6개를 만들 수 있다. X재 4개와 함께 생산할 수 있는 Y재의 최대량을 구하고, X재 4개·Y재 2개 조합의 생산 가능 여부를 판단해 보자.","steps":["X재 4개는 최대량 12개의 1/3이므로 전체 자원의 1/3을 사용한다.","남은 자원은 2/3이다. 따라서 Y재를 최대 6×2/3=4개 생산할 수 있다.","X재 4개·Y재 2개의 자원 사용 비율 합은 4/12+2/6=2/3이다. 1보다 작으므로 곡선 안쪽의 생산 가능한 조합이다."],"result":"X재 4개를 생산할 때 Y재는 최대 4개까지 생산할 수 있다. X재 4개·Y재 2개 조합은 생산 가능 곡선 안쪽에 있다.","tip":"X재 생산에 사용한 자원의 비율을 구한 뒤 남은 비율에 Y재 최대량을 곱한다.","caution":"이 계산은 생산 가능 곡선이 직선이라는 조건에 따른다. 교역 후 소비할 수 있는 조합과 자국에서 생산할 수 있는 조합도 구별한다.","check":{"q":"X재를 최대 12개 또는 Y재를 최대 6개 생산할 수 있는 직선 모형에서, X재 12개와 Y재 6개를 동시에 생산할 수 있는가?","o":["생산 가능 곡선 위의 조합이므로 가능하다.","현재의 자원과 기술로는 생산할 수 없다."],"why":"각 최대량을 동시에 생산하려면 자원 사용 비율의 합이 12/12+6/6=2가 되어 보유 자원을 초과한다."},"origin":""},"L13-3":{"title":"절대 우위와 비교 우위","goal":"생산 비용과 기회비용을 기준으로 두 우위를 구별해 보자.","headings":["절대 우위","비교 우위","두 재화 모두 절대 우위인 경우"],"paragraphs":["절대 우위는 다른 생산자보다 같은 양의 재화를 더 적은 비용으로 생산할 수 있는 능력이다. 같은 노동량으로 더 많은 재화를 생산할 수 있는 경우에도 절대 우위가 있다고 볼 수 있다. 최대 생산량으로 비교할 때에는 두 나라가 투입하는 생산 요소의 양이 같아야 한다.","비교 우위는 다른 생산자보다 같은 양의 재화를 더 작은 기회비용으로 생산할 수 있는 능력이다. X재의 비교 우위를 구하려면 각 나라가 X재 1개를 생산하면서 포기하는 Y재의 양을 비교한다. 포기하는 Y재가 적은 나라가 X재 생산에 비교 우위를 가진다.","한 나라가 두 재화 모두 절대 우위를 가지더라도 비교 우위는 두 나라에 나뉠 수 있다. 이 경우 각 나라가 비교 우위 재화에 특화하여 교환하면 무역으로 이익을 얻을 수 있다. 절대 우위만으로 설명하기 어려운 무역도 기회비용의 차이를 통해 설명할 수 있다."],"example":"같은 총노동량을 투입할 때 A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 8개이다. 양국의 생산 가능 곡선은 직선이다. 절대 우위와 비교 우위를 구해 보자.","steps":["A국은 같은 노동량으로 X재와 Y재를 모두 더 많이 생산할 수 있으므로 두 재화 모두 절대 우위가 있다.","X재 1개 생산의 기회비용은 A국이 Y재 12/24=1/2개, B국이 Y재 8/8=1개이다. 기회비용이 작은 A국이 X재에 비교 우위를 가진다.","Y재 1개 생산의 기회비용은 A국이 X재 24/12=2개, B국이 X재 8/8=1개이다. 기회비용이 작은 B국이 Y재에 비교 우위를 가진다."],"result":"A국은 두 재화 모두 절대 우위가 있다. 비교 우위는 X재에 A국, Y재에 B국이 가진다.","tip":"절대 우위는 같은 재화의 생산 비용을, 비교 우위는 같은 재화 생산의 기회비용을 비교한다.","caution":"두 나라의 생산 기회비용이 같다면 어느 한 나라가 해당 재화에 비교 우위를 가진다고 할 수 없다.","check":{"q":"X재 1개 생산의 기회비용이 A국은 Y재 2개, B국은 Y재 3개이다. X재에 비교 우위가 있는 나라는?","why":"A국이 같은 X재 1개를 생산하면서 더 적은 Y재를 포기하므로 X재에 비교 우위가 있다."},"origin":""},"L14-1":{"title":"양국이 모두 이익을 얻는 교환 비율","goal":"생산의 기회비용을 이용하여 양국에 유리한 교환 비율을 구해 보자.","headings":["자급 생산과 교역의 비교","X재를 수출하는 나라","X재를 수입하는 나라"],"paragraphs":["각 나라가 비교 우위 재화에 특화하더라도 교환 비율에 따라 얻는 이익은 달라진다. 교역으로 이익을 얻으려면 직접 생산하는 것보다 유리한 조건으로 교환해야 한다. 아래에서는 두 나라가 두 재화를 생산하고, 생산 가능 곡선은 직선이며 거래 비용은 없다고 가정한다.","X재 1개 생산의 기회비용이 A국에서 Y재 0.5개라고 하자. A국이 X재 1개를 수출하면서 Y재를 0.5개만 받으면 직접 생산할 때와 차이가 없다. 이익을 얻으려면 X재 1개를 생산하면서 포기한 양보다 많은 Y재를 받아야 하므로 교환 비율이 0.5보다 커야 한다.","B국의 X재 1개 생산 기회비용이 Y재 1개라면, B국은 X재 1개를 수입하면서 Y재를 1개보다 적게 주어야 이익을 얻는다. 따라서 양국 모두 이익을 얻는 교환 비율은 X재 1개당 Y재 0.5개 초과 1개 미만이다."],"example":"X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. X재 4개와 Y재 3개를 교환하는 비율이 양국 모두에게 유리한지 판단해 보자.","steps":["X재 1개당 교환하는 Y재의 수량은 3/4=0.75개이다.","A국은 직접 생산하며 포기한 0.5개보다 많이 받고, B국은 직접 생산할 때 포기할 1개보다 적게 준다. 0.5<0.75<1이므로 양국 모두에게 유리한 비율이다.","이 비율로 실제 교환하려면 A국이 X재 4개, B국이 Y재 3개를 제공할 수 있어야 한다."],"result":"X재 1개당 Y재 0.75개의 교환 비율은 양국 모두에게 유리하다.","tip":"양국의 생산 기회비용과 교환 비율을 같은 재화 단위로 나타내어 비교한다.","caution":"양국 모두 이익이 0보다 커야 한다면 기회비용과 같은 경계값은 제외한다. 교환 가능한 수량도 따로 확인해야 한다.","check":{"q":"X재 1개 생산의 기회비용이 A국은 Y재 2개, B국은 Y재 5개이다. 양국이 모두 이익을 얻는 교환 비율은?","why":"X재 1개당 Y재 3개는 2개와 5개 사이에 있으므로 양국 모두 이익을 얻을 수 있다."},"origin":""},"L14-2":{"title":"교역 후 소비량과 교역의 이익","goal":"교역 후 소비량을 구하고 자급 생산보다 늘어난 이익을 계산해 보자.","headings":["교역 후 소비량","재화 단위로 구하는 교역 이익","생산 가능량과 소비 가능량"],"paragraphs":["교역 후 소비할 수 있는 양은 자국 생산량에서 수출량을 빼고 수입량을 더하여 구한다.\n\n소비량 = 생산량 −
