 수출량 + 수입량\n\n두 나라만 거래하고 재고와 손실이 없다면, 재화별로 양국의 소비량을 합한 값은 양국의 총생산량과 같다.","교역 이익은 직접 생산했을 때와 비교하여 구한다. A국이 X재 4개를 생산하느라 Y재 2개를 포기하고, 그 X재를 수출하여 Y재 3개를 받았다면 Y재 1개만큼 이익을 얻는다. B국이 X재 4개를 직접 생산하려면 Y재 4개를 포기해야 하지만 수입할 때에는 3개만 준다면 Y재 1개를 절약한다.","교역을 하면 자국의 생산 가능 곡선 밖에 있는 조합을 소비할 수 있다. 이는 생산 능력이 즉시 늘어난 것이 아니라 교환을 통해 소비할 수 있는 재화의 조합이 넓어진 것이다. 교역 후 소비량과 직접 생산할 때보다 추가로 얻은 이익은 서로 다른 값이다."],"example":"A국은 X재 12개, B국은 Y재 4개에 특화하고 X재 4개와 Y재 3개를 교환한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 교역 후 소비량과 각국의 교역 이익을 구해 보자.","steps":["A국은 X재 12개에서 4개를 수출하고 Y재 3개를 수입하므로 X재 8개·Y재 3개를 소비한다. B국은 X재 4개·Y재 1개를 소비한다.","양국의 소비량을 합하면 X재 12개·Y재 4개로 총생산량과 같다.","A국은 Y재 3개를 받고 생산의 기회비용 Y재 4×0.5=2개를 부담하므로 이익은 Y재 1개이다. B국도 직접 생산할 때 포기할 Y재 4개 대신 3개만 지급하므로 이익은 Y재 1개이다."],"result":"교역 후 A국은 X재 8개·Y재 3개, B국은 X재 4개·Y재 1개를 소비한다. 각국의 교역 이익은 Y재 1개이다.","tip":"소비량은 생산·수출·수입량으로 구한다. 교역 이익은 직접 생산하는 경우와 비교하여 구한다.","caution":"국가의 교역 이익이 국내의 모든 사람에게 같은 크기로 분배되는 것은 아니다.","check":{"q":"A국이 X재 12개를 생산하여 4개를 수출하였다. 수입한 X재가 없다면 남은 X재는 몇 개인가?","why":"12−4=8개이다."},"origin":""},"L14-3":{"title":"소비량으로 생산량과 교환 비율 구하기","goal":"교역 후 소비량을 이용하여 생산량과 교환 수량을 구해 보자.","headings":["소비량 합계와 총생산량","완전 특화와 수입량","교환 비율의 계산"],"paragraphs":["두 나라가 각자 한 재화에 완전 특화하고 재고·손실·다른 거래가 없다면, 재화별 소비량 합계가 그 재화를 생산한 나라의 생산량이다. A국이 X재만 생산했다면 양국의 X재 소비량을 더하여 A국의 생산량을 구한다.","완전 특화한 나라는 자신이 생산하지 않은 재화를 수입하여 소비한다. A국이 X재만 생산했다면 A국의 Y재 소비량은 Y재 수입량이다. B국이 Y재만 생산했다면 B국의 X재 소비량은 X재 수입량이다.","두 나라 사이에서 서로 교환한 수량을 알면 교환 비율을 구할 수 있다. X재 q개와 Y재 y개를 교환했다면 X재 1개당 Y재 y/q개를 교환한 것이다. 다만 자급 생산이나 다른 거래가 있었다면 소비량만으로 수입량을 정하기 어려울 수 있다."],"example":"A국은 X재, B국은 Y재에 완전 특화하였다. 교역 후 A국은 X재 18개·Y재 5개, B국은 X재 6개·Y재 7개를 소비한다. 재고·손실·다른 거래는 없다. 생산량과 교환 비율을 구해 보자.","steps":["X재 소비량의 합은 18+6=24개이다. X재는 A국만 생산하므로 A국의 생산량은 24개이다.","Y재 소비량의 합은 5+7=12개이다. Y재는 B국만 생산하므로 B국의 생산량은 12개이다.","A국이 소비한 Y재 5개는 수입량이고, B국이 소비한 X재 6개도 수입량이다.","따라서 X재 6개와 Y재 5개를 교환하였다. X재 1개당 교환 비율은 Y재 5/6개이다."],"result":"A국은 X재 24개, B국은 Y재 12개를 생산하였다. 교환 비율은 X재 6개 대 Y재 5개이다.","tip":"완전 특화한 경우에는 생산하지 않은 재화의 소비량으로 수입량을 구한다.","caution":"","check":{"q":"두 나라만 거래하고 재고와 손실이 없다면 교역 후 재화별 소비량의 합계는?","o":["양국의 총생산량과 같다.","양국의 총생산량보다 항상 크다."],"why":"교역은 이미 생산된 재화가 나라 사이에서 이동하는 것이므로 전체 수량은 변하지 않는다."},"origin":""},"L15-1":{"title":"무역 확대의 영향","goal":"무역 확대가 소비자와 생산자, 산업과 고용에 미치는 영향을 알아보자.","headings":["무역 확대의 이익","국내 산업의 위축과 경제적 격차","무역 이익의 분배"],"paragraphs":["무역이 확대되면 소비자는 다양한 상품과 서비스를 구입할 수 있다. 기업은 해외 시장에 상품을 판매하여 생산을 늘릴 수 있으며, 이에 따라 일자리가 생길 수 있다. 또한 해외 기업과 경쟁하거나 기술을 도입하는 과정에서 기술 수준과 상품의 품질이 높아질 수 있다.","반면 외국 상품과의 경쟁에서 밀리는 국내 산업은 생산이 줄고 실업이 늘어날 수 있다. 국가 간 경제적 격차가 확대되거나 한 나라의 경제 문제가 다른 나라로 확산될 가능성도 있다. 무역액이 증가하는 동안 일부 산업에서는 생산과 고용이 감소할 수 있다.","무역의 이익이 모든 사람에게 똑같이 돌아가는 것은 아니다. 전체 거래액이 늘어나도 생산자에게 돌아가는 대가의 증가 폭은 작을 수 있다. 생산자가 받는 총액, 한 사람당 받는 금액, 한 시간 일하고 받는 금액은 서로 다른 값이다. 개인별 소득과 노동 조건을 살펴보려면 지급 총액과 함께 참여 인원, 분배 방식, 노동시간을 알아야 한다."],"example":"거래 총액은 15%, 생산자에게 지급한 대가의 총액은 4% 증가하였다. 노동시간은 제시되어 있지 않다. 두 총액의 변화와 시간당 보수에 대해 알 수 있는 내용을 설명해 보자.","steps":["거래 총액과 생산자에게 지급한 대가의 총액은 모두 증가하였다. 거래 총액의 증가율이 더 크다.","시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 노동시간의 변화를 모르므로 시간당 보수가 증가했는지는 알 수 없다.","생산자 개인에게 돌아간 금액을 알려면 지급 총액이 각 사람에게 어떻게 나뉘었는지도 알아야 한다."],"result":"두 총액은 모두 증가했지만, 시간당 보수와 개인별 소득의 변화는 노동시간과 분배에 관한 자료가 있어야 알 수 있다.","tip":"총액이 증가한 것과 1인당 금액이나 시간당 금액이 증가한 것은 다르다. 평균을 구할 때에는 총액을 나눌 인원이나 시간을 알아야 한다.","caution":"","check":{"q":"무역액이 증가했더라도 일부 산업의 고용 감소를 함께 살펴야 하는 이유는?","o":["무역액이 증가하면 모든 산업의 고용도 증가하기 때문이다.","무역 전체의 성장과 특정 산업의 위축이 함께 나타날 수 있기 때문이다."],"why":"무역이 확대되면 수출 산업이 성장하는 한편, 외국 상품과의 경쟁에서 밀리는 국내 산업은 위축될 수 있다."},"origin":""},"L15-2":{"title":"WTO·FTA와 무역 의존도","goal":"무역 관련 기구와 협정의 역할을 알아보고 무역 의존도를 계산해 보자.","headings":["세계 무역 기구와 자유 무역 협정","자유 무역과 보호 무역","무역 의존도"],"paragraphs":["세계 무역 기구(WTO)는 국가 간 무역 관계를 관리·감독하는 국제기구이다. 무역 장벽을 낮추고 무역 분쟁을 조정하는 등의 역할을 한다.\n\n자유 무역 협정(FTA)은 체결국 사이의 관세와 비관세 장벽을 완화하는 협정이다. WTO가 국제기구인 데 비해 FTA는 국가 간에 맺는 협정이라는 차이가 있다.","자유 무역은 국가 간 무역에 대한 장벽을 낮추고 자유로운 거래를 추구한다. 반면 보호 무역은 국내 산업을 보호·육성하기 위해 관세나 비관세 장벽으로 무역을 규제한다. 외국 상품에 대한 관세를 높여 국내 산업을 보호하는 정책은 보호 무역에 해당한다.","무역 의존도는 한 나라의 경제가 무역에 의존하는 정도를 나타낸다. 국내 총생산(GDP)에서 수출액과 수입액의 합이 차지하는 비율로 구한다.\n\n무역 의존도(%) = (수출액 + 수입액) ÷ GDP × 100\n\n무역 의존도가 높을수록 국제 경제 환경의 변화에 더 큰 영향을 받을 수 있다."],"example":"GDP는 500, 수출액은 120, 수입액은 80이다. 모두 같은 통화와 기간의 값이다. 무역 의존도를 구해 보자.","steps":["수출액과 수입액을 합하면 120+80=200이다.","무역액 200을 GDP 500으로 나누면 200÷500=0.4이다.","백분율로 나타내면 0.4×100=40%이다."],"result":"무역 의존도는 40%이다.","tip":"무역 의존도에는 수출액과 수입액의 합을 사용한다. 두 금액의 차를 사용하는 것이 아니다.","caution":"수출액, 수입액, GDP의 통화와 기간을 같게 맞추어 계산한다.","check":{"q":"WTO와 FTA의 성격을 각각 바르게 설명한 것은?","o":["국제기구와 국가 간 협정","둘 다 금융 상품"],"why":"WTO는 국가 간 무역 관계를 관리·감독하는 국제기구이고, FTA는 체결국 사이의 무역 장벽을 완화하는 협정이다."},"origin":""},"L15-3":{"title":"지속가능한 국제 무역","goal":"공정한 분배와 노동자의 권리, 환경을 고려하는 무역의 방안을 알아보자.","headings":["지속가능한 무역의 의미","공정 무역과 환경 보호","분배·노동·환경에 관한 조사"],"paragraphs":["지속가능한 국제 무역은 미래 세대의 필요를 해치지 않으면서 경제적 효율성, 사회적 책임, 환경 보호를 함께 고려하는 무역 활동이다. 무역으로 얻는 이익뿐 아니라 그 이익이 어떻게 분배되는지, 노동자의 권리가 보장되는지, 생산과 운송이 환경에 어떤 영향을 주는지도 중요하다.","공정 무역은 국제 무역에서 더 공평한 관계를 추구하고 소외된 생산자와 노동자의 권리를 보호하려는 무역이다. 생산자에게 정당한 대가를 지급하고 안전한 노동 환경을 보장하는 것이 중요하다. 친환경적인 생산과 운송, 국제 규범의 마련, 국가 간 협력도 지속가능한 무역에 기여할 수 있다.","무역 계약을 평가할 때 매출액만 살펴보면 생산자와 노동자, 환경에 미친 영향을 놓치기 쉽다. 생산자에게 지급한 대가는 분배를, 노동시간과 작업장의 안전은 노동 조건을, 생산과 운송 과정의 오염은 환경 영향을 살펴보는 자료가 된다. 아래 활동에서는 이 세 종류의 자료를 조사하는 데 드는 비용을 계산한다."],"example":"무역 계약을 검토하려고 한다. 현재 매출액 자료만 가지고 있으며, 추가 조사에 사용할 수 있는 예산은 9이다. 생산자에게 지급한 대가, 노동 조건, 환경 영향에 관한 자료를 구하는 비용은 각각 3이다. 예산 안에서 세 자료를 모두 구할 수 있는가?","steps":["매출액 자료만으로는 생산자에게 돌아간 대가나 노동 조건, 환경 영향을 알기 어렵다. 세 종류의 자료를 추가로 조사해야 한다.","세 자료를 모두 구하는 데 드는 비용은 3+3+3=9이다.","총비용이 예산 9와 같으므로 세 자료를 모두 구할 수 있다."],"result":"예산 9로 세 자료를 모두 구할 수 있다. 자료를 확보한 뒤에는 생산자에게 지급한 대가와 노동 조건, 환경 영향을 각각 살펴본다.","tip":"생산자에게 정당한 대가를 지급했는지, 노동자의 권리를 보장했는지, 환경을 보호했는지를 함께 살펴본다.","caution":"자료를 구한 뒤에는 그 내용을 살펴야 한다. 노동 조건이나 환경이 개선되었는지는 조사 결과로 확인한다.","check":{"q":"지속가능한 무역인지 살펴보기 위해 필요한 자료는?","o":["수출액에 관한 자료만","경제적 효율성, 분배, 노동, 환경에 관한 자료"],"why":"지속가능한 무역은 경제적 효율성뿐 아니라 사회적 책임과 환경 보호를 함께 고려한다."},"origin":""},"L01-4":{"title":"중상주의와 수정 자본주의의 정부 역할","goal":"교역 장려 정책과 대공황 극복 정책의 차이를 알아보자.","headings":["중상주의 정책","대공황 이후의 정부 개입","정부가 개입한 목적의 차이"],"paragraphs":["중상주의는 국가의 부를 늘리기 위해 정부가 상공업 활동에 깊이 개입한 경제 정책이다. 절대 왕정은 국내 산업을 보호하고 수출을 장려하였다. 교역과 상인의 활동을 지원한 이러한 정책은 상업 자본주의의 발달을 뒷받침하였다.","수정 자본주의는 대공황 이후 실업과 수요 부족 등 시장의 한계를 해결하기 위해 정부의 적극적인 개입을 강조하였다. 정부가 공공사업으로 일자리를 제공하면 노동자는 임금을 받고 상품을 구매할 수 있다. 이를 통해 고용과 유효 수요를 확대하고자 하였다.","두 입장은 모두 정부의 역할을 인정하지만 개입의 목적이 다르다. 중상주의는 교역을 통한 국가의 부 축적을, 수정 자본주의는 시장 실패의 해결과 경기 회복을 추구하였다. 따라서 정부가 무역선을 지원하는 사례와 대공황 이후 공공사업을 추진하는 사례는 서로 다른 시기의 정책을 나타낸다."],"example":"A 문서는 절대 왕정의 교역 장려 정책을, B 문서는 대공황 이후의 공공사업을 설명한다. 각 문서와 관련된 자본주의의 유형을 구분해 보자.","steps":["A의 교역 장려 정책은 절대 왕정의 중상주의 정책에 해당한다.","B의 공공사업은 대공황에 따른 실업과 수요 부족을 해결하려는 정책이다.","따라서 A는 상업 자본주의, B는 수정 자본주의와 관련된다."],"result":"A는 상업 자본주의, B는 수정 자본주의와 관련된다. 두 정책은 정부 개입의 배경과 목적이 다르다.","tip":"교역을 장려하여 국가의 부를 늘리려는 정책은 중상주의, 공공사업으로 대공황을 극복하려는 정책은 수정 자본주의와 관련된다.","caution":"","check":{"q":"정부가 개입한 두 사례를 자본주의의 전개 과정에 따라 구분하려면 무엇을 살펴야 하는가?","o":["정부가 개입한 사례이므로 같은 단계로 구분한다.","정책이 시행된 시대적 배경과 목적을 비교한다."],"why":"중상주의와 수정 자본주의는 모두 정부의 역할을 인정하지만, 각각 국가의 부 축적과 시장 실패의 해결이라는 목적을 가진다."},"origin":""},"L03-4":{"title":"기회비용의 크기와 합리적 선택","goal":"기회비용이 큰 대안도 합리적인 선택이 될 수 있는 이유를 알아보자.","headings":["편익이 같은 경우","편익이 다른 경우","명시적 비용과 순편익"],"paragraphs":["합리적으로 선택하려면 편익에서 기회비용을 뺀 순편익을 비교해야 한다. 두 대안의 편익이 같다면 기회비용이 작은 대안의 순편익이 더 크다. 이 경우에는 기회비용을 적게 부담하는 대안을 선택하는 것이 유리하다.","편익이 서로 다르면 기회비용만으로 어느 대안이 유리한지 알 수 없다. 기회비용이 더 크더라도 편익이 그보다 더 많이 증가한다면 순편익은 오히려 커질 수 있다. 따라서 기회비용이 가장 작은 대안을 무조건 선택하는 것은 합리적 선택의 기준이 아니다.","명시적 비용이 작은 대안을 고르는 것과 순편익이 큰 대안을 고르는 것도 다르다. 명시적 비용은 직접 지출한 금액이지만, 기회비용에는 포기한 다른 대안의 가치인 암묵적 비용도 포함된다. 두 대안을 비교할 때에는 각각의 편익과 두 비용을 모두 고려해야 한다."],"example":"A의 편익은 25, 명시적 비용은 7이고, B의 편익은 32, 명시적 비용은 11이다. 두 대안 중 하나만 선택한다. 각 대안의 기회비용과 순편익을 비교해 보자.","steps":["A와 B의 편익에서 명시적 비용을 빼면 각각 18과 21이다. A의 암묵적 비용은 21, B의 암묵적 비용은 18이다.","기회비용은 A가 7+21=28, B가 11+18=29이다.","순편익은 A가 25−28=−3, B가 32−29=3이다. 기회비용은 B가 더 크지만 순편익도 B가 더 크므로 B가 유리하다."],"result":"B의 기회비용은 29로 A보다 크지만, 순편익 역시 B가 더 크다. 따라서 합리적인 선택은 B이다.","tip":"편익이 같은 경우에는 기회비용이 작은 대안을, 편익이 다른 경우에는 순편익이 큰 대안을 선택한다.","caution":"편익에서 명시적 비용만 뺀 값을 순편익이라고 부르지 않는다. 순편익에는 암묵적 비용도 반영된다.","check":{"q":"편익이 서로 다른 두 대안 중 기회비용이 작은 대안을 선택하면 항상 합리적인가?","o":["항상 합리적이다.","그렇지 않다."],"why":"편익과 기회비용을 함께 고려해야 한다. 기회비용이 더 크더라도 편익의 차이가 더 크면 순편익이 더 클 수 있다."},"origin":""},"L03-5":{"title":"선택은 같아도 달라지는 순편익","goal":"포기한 대안의 가치가 커질 때 암묵적 비용과 순편익의 변화를 알아보자.","headings":["가장 유리한 대안","포기한 대안의 가치 상승","순편익의 변화"],"paragraphs":["A, B, C의 편익에서 명시적 비용을 뺀 값이 각각 22, 26, 25라고 하자. B의 값이 가장 크므로 B를 선택하는 것이 유리하다. B를 선택할 때 포기하는 A와 C 중에서는 C의 가치가 더 크다. 따라서 B 선택의 암묵적 비용은 25이다.","C의 가치가 조금 증가하더라도 B의 26보다 작다면 B가 여전히 가장 유리하다. 그러나 B를 선택하면서 포기하는 C의 가치는 이전보다 커진다. 이 때문에 B 선택의 암묵적 비용과 기회비용은 증가한다.","B의 편익과 명시적 비용은 그대로인데 암묵적 비용이 증가하면 B의 순편익은 감소한다. 이처럼 선택하는 대안이 같아도 순편익은 달라질 수 있다. C의 가치가 B와 같아지면 두 대안은 동률이고, B보다 커지면 C를 선택하는 것이 유리해진다."],"example":"A, B, C의 ‘편익−명시적 비용’은 각각 22, 26, 25이다. 다른 조건은 그대로이고 C의 값만 25.5로 증가하였다. B 선택의 암묵적 비용과 순편익은 어떻게 달라지는가?","steps":["B의 26이 여전히 가장 크므로 B를 선택하는 것이 유리하다.","B를 선택할 때 포기하는 대안 중 C의 가치가 가장 크다. 따라서 암묵적 비용은 25에서 25.5로 증가한다.","B의 순편익은 26−25=1에서 26−25.5=0.5로 감소한다."],"result":"합리적인 선택은 B로 유지되지만, 암묵적 비용은 증가하고 순편익은 감소한다.","tip":"선택하지 않은 대안의 가치가 커지면, 기존 선택의 암묵적 비용이 커져 순편익이 줄어들 수 있다.","caution":"두 대안의 ‘편익−명시적 비용’이 같아지면 어느 하나만 더 유리하다고 할 수 없다.","check":{"q":"예제의 조건 변경 후에도 B가 가장 유리하다. B 선택의 순편익은 어떻게 달라지는가?","o":["감소한다.","변하지 않는다."],"why":"포기하는 대안 C의 가치가 커져 B 선택의 암묵적 비용이 증가하므로 순편익은 감소한다."},"origin":""},"L04-4":{"title":"대안 추가와 암묵적 비용","goal":"새로운 대안이 생겼을 때 암묵적 비용과 순편익의 변화를 알아보자.","headings":["선택 가능한 대안의 증가","최선의 대안은 그대로인 경우","대안별 비용 변화"],"paragraphs":["선택할 수 있는 대안이 늘어나면 포기하는 기회의 가치도 달라질 수 있다. 두 대안 중 하나만 선택할 때에는 다른 대안을 포기한 가치가 암묵적 비용이다. 세 번째 대안이 추가되면 선택하지 않은 두 대안 중 더 큰 가치를 암묵적 비용으로 삼는다.","A와 B의 ‘편익−명시적 비용’이 각각 60과 75이면 B가 유리하다. 여기에 그 값이 70인 C가 추가되어도 B의 75가 가장 크므로 B가 여전히 유리하다. 그러나 B를 선택할 때 포기한 대안 중 가장 큰 가치는 A의 60에서 C의 70으로 바뀐다. B 선택의 암묵적 비용이 증가한 것이다.","새로운 대안이 생겼다고 모든 선택의 비용이 같은 만큼 변하지는 않는다. 위 조건에서 A를 선택할 때 포기하는 가장 큰 가치는 여전히 B의 75이다. 반면 B를 선택할 때에는 암묵적 비용이 증가하여 순편익이 줄어든다. 각 선택에서 포기하는 대안을 따로 비교해야 한다."],"example":"A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55이다. 여기에 편익 100, 명시적 비용 30인 C가 추가된다. B 선택의 암묵적 비용과 순편익은 어떻게 달라지는가?","steps":["처음에는 A의 ‘편익−명시적 비용’이 60, B는 75이다. B를 선택하면 A를 포기하므로 암묵적 비용은 60이고 순편익은 75−60=15이다.","C의 ‘편익−명시적 비용’은 100−30=70이다. B의 75보다 작으므로 가장 유리한 대안은 여전히 B이다.","C가 추가된 뒤 B의 암묵적 비용은 70이 된다. 순편익은 75−70=5로 감소한다."],"result":"합리적인 선택은 B로 유지되지만, B의 암묵적 비용은 60에서 70으로 증가하고 순편익은 15에서 5로 감소한다.","tip":"새 대안이 가장 유리하지 않더라도 기존 선택의 암묵적 비용을 높일 수 있다.","caution":"새 대안의 편익 전체가 아니라 편익에서 명시적 비용을 뺀 가치를 비교한다.","check":{"q":"A와 B의 ‘편익−명시적 비용’이 각각 60과 75이다. 이 값이 70인 C가 추가되면 B 선택의 암묵적 비용은 얼마인가?","why":"B를 선택할 때 포기하는 A와 C 중에서는 C의 가치 70이 더 크다. 따라서 암묵적 비용은 70이다."},"origin":""},"L04-5":{"title":"동률과 선택이 바뀌는 최소 금액","goal":"두 대안이 같아지는 금액과 한 대안이 더 유리해지는 최소 금액을 구별해 보자.","headings":["두 대안이 동률인 경우","한 대안만 더 유리한 경우","정수 조건의 적용"],"paragraphs":["두 대안의 편익에서 명시적 비용을 뺀 값이 같으면 어느 하나가 다른 하나보다 더 유리하지 않다. 두 대안이 동률이 되는 금액은 두 값을 같게 놓은 방정식으로 구할 수 있다.","한 대안만 더 유리해지려면 두 값이 같아서는 안 되고 해당 대안의 값이 더 커야 한다. 예를 들어 반환금이 6일 때 두 대안이 같고, 반환금이 커질수록 B가 유리해진다면 B만 더 유리해지는 조건은 반환금이 6보다 큰 경우이다.","반환금이 0 이상의 정수라면 6보다 큰 값 중 가장 작은 값은 7이다. 따라서 B만 더 유리해지는 최소 정수 반환금은 7이다. 소수까지 허용하는 문제에서는 값이 변하는 간격이 다르므로 동률이 되는 금액에 무조건 1을 더하지 않는다."],"example":"A의 편익은 70, 명시적 비용은 20이고, B의 편익은 74, 명시적 비용은 30이다. 새 계약에 따라 B를 선택하면 반환금 r을 받는다. r은 0 이상의 정수이다. B만 더 유리해지는 최소 반환금을 구해 보자.","steps":["A의 ‘편익−명시적 비용’은 70−20=50이고, 반환금을 포함한 B의 값은 74+r−30=44+r이다.","44+r=50을 풀면 r=6이다. 이때 두 대안은 동률이므로 B만 더 유리하지는 않다.","B만 더 유리하려면 44+r>50, 즉 r>6이어야 한다. r은 정수이므로 최소 반환금은 7이다."],"result":"반환금 6에서는 동률이고, B만 더 유리해지는 최소 정수 반환금은 7이다.","tip":"‘같아지는 금액’은 등식으로, ‘더 유리해지는 금액’은 부등식으로 구한다.","caution":"‘최소값’을 구할 때에는 정수만 가능한지, 소수도 가능한지 확인한다.","check":{"q":"예제에서 반환금이 6일 때 두 대안의 관계로 옳은 것은?","o":["B만 더 유리하다.","두 대안이 동률이다."],"why":"A의 값은 50이고 B도 44+6=50이므로 두 대안은 동률이다."},"origin":""},"L05-4":{"title":"부담금 납부와 이익의 합산","goal":"생산자 이익, 정부 수입, 제3자 피해를 구별하여 계산해 보자.","headings":["부담금 납부 후 생산자 이익","정부 수입을 포함한 계산","생산량이 달라지는 경우"],"paragraphs":["생산자가 부담금을 내면 그만큼 생산자에게 남는 이익이 줄어든다. 납부 전 이익이 60이고 부담금이 28이면 납부 후 이익은 60−28=32이다.","생산자가 낸 부담금 28은 정부의 수입이다. 정부 수입과 제3자 피해 12까지 포함하고 다른 비용은 없다면, 합계는 32+28−12=48이다. 부담금은 생산자의 지출이자 정부의 수입이므로 두 주체의 금액을 합산할 때 다시 차감하지 않는다.","부담금이 부과되어 생산량이 달라지면 생산자 이익과 제3자 피해도 변할 수 있다. 따라서 정책 전후의 결과를 비교하는 문제에서는 각 생산량에서의 이익과 피해를 사용해야 한다. 아래 예제는 생산량과 금액이 정해져 있는 경우의 합산 연습이다."],"example":"생산량은 2, 부담금 납부 전 이익은 60, 부담금 총액은 28, 제3자 피해는 12이다. 정부 수입 28을 포함하며 다른 비용은 없다. 생산자 이익과 정부 수입에서 제3자 피해를 뺀 합계를 구해 보자.","steps":["생산자의 납부 후 이익은 60−28=32이다.","정부가 받은 부담금은 28이므로 정부 수입은 28이다.","생산자 이익과 정부 수입을 더하고 제3자 피해를 빼면 32+28−12=48이다."],"result":"정부 수입과 제3자 피해를 모두 반영한 합계는 48이다.","tip":"부담금은 생산자의 납부액과 정부의 수입액에 각각 한 번씩 반영한다.","caution":"","check":{"q":"예제에서 정부 수입과 제3자 피해를 모두 반영한 합계는 얼마인가?","why":"생산자의 납부 후 이익 32에 정부 수입 28을 더하고 피해 12를 빼면 48이다."},"origin":""},"L05-5":{"title":"외부 불경제와 다른 피해의 구별","goal":"외부 불경제에 해당하는 피해를 사례에서 찾아보자.","headings":["경제활동으로 발생한 피해","자연재해로 발생한 피해","피해에 대한 대가"],"paragraphs":["외부 불경제는 한 경제 주체의 생산이나 소비가 다른 경제 주체에게 의도하지 않은 피해를 주지만 그 대가를 지불하지 않는 경우이다. 공장이 배출한 오염 물질로 이웃 주민이 피해를 입었는데 보상하지 않았다면 생산에 따른 외부 불경제이다.","경제활동과 무관한 자연재해로 공장 설비가 파손된 경우에는 다른 경제 주체의 생산이나 소비가 피해의 원인이 아니다. 따라서 공장의 손해가 발생했더라도 앞의 오염 사례와 같은 외부 불경제로 볼 수 없다. 외부 불경제는 경제활동이 다른 경제 주체에게 준 피해라는 점이 중요하다.","외부 불경제에서는 피해를 일으킨 경제 주체가 그 피해에 대한 대가를 지불하지 않는다. 따라서 사례의 피해 원인뿐 아니라 보상 여부도 살펴야 한다. 보상 여부가 자료에 제시되지 않았다면, 보상이 없었다고 가정하지 않고 추가 정보가 필요한지 검토한다."],"example":"A에서는 공장의 생산 과정에서 나온 배출물로 이웃이 피해를 입었지만 보상받지 못했다. B에서는 경제활동과 무관한 자연재해로 공장 설비가 파손되었다. 외부 불경제에 해당하는 사례를 구분해 보자.","steps":["A에서는 공장의 생산 활동으로 다른 경제 주체인 이웃에게 피해가 발생하였다.","공장이 피해를 보상하지 않았으므로 A는 외부 불경제에 해당한다.","B의 피해는 다른 경제 주체의 생산이나 소비에서 발생한 것이 아니므로 외부 불경제에 해당하지 않는다."],"result":"A는 외부 불경제이고, B는 경제활동과 무관한 자연재해의 피해이다.","tip":"외부 불경제를 구분할 때에는 피해를 일으킨 경제활동과 피해를 입은 다른 경제 주체가 무엇인지 살펴본다.","caution":"보상 여부가 제시되지 않았다는 것과 보상하지 않았다고 명시된 것은 다르다.","check":{"q":"외부 불경제에 해당하는지 판단할 때 확인할 내용으로 적절한 것은?","o":["손해가 발생했다는 사실만 확인한다.","경제활동으로 다른 경제 주체에게 피해가 발생했는지와 대가의 지급 여부를 확인한다."],"why":"외부 불경제는 생산이나 소비로 다른 경제 주체에게 피해를 주고도 대가를 지불하지 않는 경우이다."},"origin":""},"L06-4":{"title":"납부액 정보와 모금의 선택","goal":"다른 주민의 납부액에 따라 나의 선택이 달라지는 이유를 알아보자.","headings":["다른 주민이 18토큰을 낸 경우","다른 주민이 24토큰을 낸 경우","납부액을 모르는 경우"],"paragraphs":["각 주민이 10토큰을 가지고 있고 설치비는 24토큰, 설치 편익은 10인 가로등 모금을 생각해 보자. 설치에 실패하면 납부액은 반환된다. 다른 주민이 합하여 18토큰을 냈다면 내가 6토큰을 내야 설치비가 모인다. 이때 내게 남는 토큰은 4이고 편익은 10이므로 합은 14이다.","다른 주민이 낸 금액만으로 24토큰이 모였다면 내가 내지 않아도 가로등이 설치된다. 0토큰을 내면 보유한 10토큰을 그대로 가지고 편익 10도 얻으므로 합은 20이다. 이 경우 추가로 돈을 내면 편익은 같은데 남은 토큰이 줄어든다.","다른 주민의 납부액을 모르면 어느 금액을 내는 것이 가장 유리한지 하나로 정하기 어려울 수 있다. 합계가 18토큰이면 6토큰을, 24토큰이면 0토큰을 내는 것이 유리하기 때문이다. 두 상황이 나타날 확률이나 별도의 선택 기준이 주어지지 않았다면 각 상황의 결과를 나누어 설명해야 한다."],"example":"초기 보유액은 10토큰, 설치비는 24토큰, 설치 편익은 10이다. 설치에 실패하면 납부액을 돌려받는다. 나는 0·4·6·10토큰 중 하나를 선택한다. 다른 주민의 납부액 합계는 18 또는 24이지만 어느 경우인지는 모른다. 하나의 납부액을 항상 가장 유리하다고 할 수 있는가?","steps":["다른 주민이 18토큰을 냈다면 내가 6토큰을 낼 때 남은 토큰과 편익의 합이 14로 가장 크다.","다른 주민이 24토큰을 냈다면 내가 0토큰을 낼 때 합이 20으로 가장 크다.","상황마다 가장 유리한 납부액이 다르다. 추가 정보나 선택 기준 없이 하나의 납부액을 항상 최선이라고 정하기는 어렵다."],"result":"다른 주민의 납부액에 따라 나에게 가장 유리한 납부액이 달라진다.","tip":"모금 규칙이 같아도 다른 주민이 낸 금액이 달라지면 내 납부액에 따른 결과도 달라진다.","caution":"이 문제에는 두 상황이 나타날 확률이 주어지지 않았다. 어느 상황이 더 자주 나타나는지 임의로 가정하지 않는다.","check":{"q":"다른 주민의 납부액이 18인지 24인지 모르고 각 경우의 확률도 주어지지 않았다. 옳은 판단은?","o":["0토큰을 내는 것이 언제나 유일하게 최선이다.","추가 정보나 선택 기준 없이 하나의 최선 납부액을 정하기 어렵다."],"why":"다른 주민의 합계가 18이면 6토큰, 24이면 0토큰이 유리하므로 상황마다 최선이 다르다."},"origin":""},"L06-5":{"title":"시장 실패의 원인과 개선 방안","goal":"공공재 부족, 경쟁 제한, 정보의 비대칭성을 사례와 함께 정리해 보자.","headings":["공공재의 공급 부족","경쟁 제한과 정보의 비대칭성","원인에 따른 개선 방안"],"paragraphs":["공공재는 비배제성과 비경합성을 가진다. 비용을 내지 않아도 소비할 수 있어 무임승차가 나타날 수 있고, 민간 기업이 이윤을 얻기 어려워 충분히 공급되지 않을 수 있다. 가로등을 이용하는 주민이 많아도 설치비가 잘 모이지 않는 문제는 이러한 특성과 관련된다.","기업들이 생산량을 제한하기로 합의하면 경쟁이 제한된다. 판매자만 제품의 결함을 알고 구매자는 모른다면 거래 당사자 사이에 정보의 비대칭성이 존재한다. 경쟁을 제한하는 합의와 제품 정보의 차이는 서로 다른 시장 실패의 원인이다.","정부가 공공재를 직접 공급하면 부족한 공급을 보완할 수 있다. 불공정 거래 규제는 공정한 경쟁을 촉진한다. 품질 보증과 제품 정보 제공은 판매자와 구매자가 가진 정보의 차이를 줄이는 데 도움이 된다. 시장 실패의 원인에 따라 알맞은 개선 방안도 달라진다."],"example":"A는 설치비를 내지 않은 주민의 가로등 이용, B는 업체 간 생산 수량 제한 합의, C는 판매자만 알고 있는 제품 결함에 관한 자료이다. 각 자료에 해당하는 개념을 구분해 보자.","steps":["A는 대가를 내지 않은 사람을 소비에서 배제할 수 없다는 비배제성을 보여 준다.","B는 업체들이 생산 수량을 제한하기로 합의하여 경쟁을 제한한 사례이다.","C는 판매자와 구매자가 가진 제품 정보가 다르다는 정보의 비대칭성을 보여 준다."],"result":"A는 비배제성, B는 경쟁 제한, C는 정보의 비대칭성에 해당한다.","tip":"공공재 공급, 불공정 거래 규제, 품질 보증은 각각 공급 부족, 경쟁 제한, 정보의 비대칭성을 개선하는 방안이다.","caution":"가격이 같다는 사실과 업체 간 가격 합의가 있었다는 사실은 구별한다. 담합은 경쟁을 제한하는 합의가 있는 경우이다.","check":{"q":"판매자와 구매자가 가진 제품 정보의 양과 질이 다른 상태를 무엇이라고 하는가?","why":"거래 당사자가 가진 정보가 다르므로 정보의 비대칭성이다."},"origin":""},"L07-4":{"title":"공장 개선과 경제 주체의 역할","goal":"공장 개선안을 기업·노동자·소비자·정부의 입장에서 살펴보자.","headings":["경제 주체별 관심과 역할","노동·환경·정보의 개선","검토 자료와 예산"],"paragraphs":["공장 개선안을 검토할 때 기업은 새로운 기술과 생산 비용을, 노동자는 근로 조건과 권리를 살펴볼 수 있다. 소비자는 제품의 안전과 정확한 정보에 관심을 가지며, 정부는 공정한 경쟁과 공공의 문제를 고려한다. 같은 개선안이라도 경제 주체에 따라 중점적으로 살펴볼 내용이 다르다.","기업의 매출이 늘었다는 자료만으로 근로 조건이 좋아졌는지는 알 수 없다. 노동 환경이 개선되었는지는 근로 조건에 관한 자료로, 소비자에게 정확한 정보가 제공되는지는 정보 공개 계획으로 살펴야 한다. 생산 비용이 증가하더라도 노동 환경이나 제품 안전이 개선될 수 있다.","공장 개선안을 검토하는 데 노동 검토서, 환경 검토서, 정보 공개 계획이 필요하다고 하자. 자료를 마련할 예산이 제한되어 있다면 각 자료의 확보 비용을 합하여 예산 안에서 준비할 수 있는지 계산한다. 자료 확보가 끝나면 각 문서의 내용을 바탕으로 개선안을 평가한다."],"example":"노동 검토서의 확보 비용은 4, 환경 검토서는 3, 정보 공개 계획은 2이다. 예산은 9이며 세 자료가 모두 필요하다. 예산 안에서 자료를 모두 확보할 수 있는가?","steps":["필요한 자료는 노동 검토서, 환경 검토서, 정보 공개 계획이다.","확보 비용의 합은 4+3+2=9이다.","비용이 예산 9와 같으므로 세 자료를 모두 확보할 수 있다."],"result":"세 자료의 확보 비용은 9이므로 예산 안에서 모두 준비할 수 있다.","tip":"매출, 근로 조건, 제품 정보는 서로 다른 내용이다. 알고자 하는 내용에 맞는 자료를 사용한다.","caution":"자료를 확보하는 비용과 실제 공장을 개선하는 비용은 구별한다. 이 예제는 자료의 확보 비용을 계산한다.","check":{"q":"기업의 매출이 늘었다는 사실만으로 노동 조건도 개선되었다고 알 수 있는가?","o":["알 수 있다.","노동 조건에 관한 자료가 더 필요하다."],"why":"매출은 판매 실적을 나타낸다. 노동 조건의 변화는 근로 시간, 작업 환경 등 관련 자료로 확인해야 한다."},"origin":""},"L08-4":{"title":"예금·채권·주식의 특징 비교","goal":"수익 형태와 보유자의 지위로 금융 자산을 구분해 보자.","headings":["이자와 배당","시세 차익","보유자의 지위와 증서의 성격"],"paragraphs":["예금과 채권은 모두 이자 수익을 기대할 수 있다. 주식은 이자 대신 배당 수익을 기대할 수 있다. 따라서 이자 수익이 있다는 조건만으로는 예금과 채권을 구별하기 어렵지만, 배당을 기대할 수 있다는 조건은 주식의 특징이다.","채권과 주식은 매매를 통해 시세 차익을 얻을 수 있다. 예금에서는 일반적으로 이자 수익을, 채권에서는 이자 수익과 시세 차익을, 주식에서는 배당 수익과 시세 차익을 기대할 수 있다.","채권은 원금과 이자의 지급을 약속한 차용 증서이며, 보유자는 돈을 빌려준 채권자이다. 주식은 투자자의 지분을 표시한 증서이며, 보유자는 주주이다. 수익 형태만으로 자산을 구별하기 어렵다면 차용 증서인지 지분 증서인지, 보유자가 어떤 지위를 갖는지도 함께 살펴본다."],"example":"예금·채권·주식의 일반적인 특징을 비교한다. A는 이자 수익만 기대할 수 있다. B는 매매가 가능한 차용 증서이다. C는 투자자의 지분을 나타내며 배당 수익을 기대할 수 있다. 각 자산을 구분해 보자.","steps":["A는 이자 수익을 기대하는 예금이다.","B는 차용 증서이므로 채권이다.","C는 지분을 표시하고 배당 수익을 기대할 수 있으므로 주식이다."],"result":"A는 예금, B는 채권, C는 주식이다.","tip":"이자는 예금·채권, 배당은 주식, 시세 차익은 채권·주식의 수익 형태이다.","caution":"","check":{"q":"이자 수익을 기대할 수 있다는 조건만으로 예금과 채권을 구별할 수 있는가?","o":["구별할 수 있다.","다른 특징이 더 필요하다."],"why":"예금과 채권은 모두 이자 수익을 기대할 수 있기 때문이다."},"origin":""},"L09-4":{"title":"자산 총액과 사용 가능한 금액","goal":"지출 기한 전에 마련할 수 있는 자금을 계산해 보자.","headings":["보유 자산과 현금화 시점","기한 내 사용 가능한 금액","자금 계획의 조건"],"paragraphs":["곧 지출할 돈을 마련하려면 자산을 얼마나 가지고 있는지뿐 아니라 언제 현금으로 바꿀 수 있는지도 알아야 한다. 쉽게 현금화할 수 있는지는 유동성과, 자산의 가치가 보호되는지는 안전성과 관련된다.","오늘 사용할 수 있는 자산 30과 한 달 뒤에만 찾을 수 있는 자산 100을 가지고 있다고 하자. 자산 총액은 130이지만 내일 쓸 수 있는 금액은 30이다. 한 달 뒤에 받을 돈을 내일의 지출에 바로 사용할 수는 없다.","자금 계획에서는 필요한 금액과 지출 기한을 함께 충족해야 한다. 대출이나 지출 연기가 불가능하다면 기한 전에 현금화할 수 있는 금액만으로 지출을 감당해야 한다. 같은 총액을 보유하더라도 자산의 인출 조건에 따라 계획의 실행 가능 여부가 달라진다."],"example":"A는 오늘 30을 현금화할 수 있고, B는 한 달 뒤에만 100을 찾을 수 있다. 내일 필요한 금액은 40이며 대출은 불가능하다. 필요한 자금을 마련할 수 있는가?","steps":["자산 총액은 30+100=130이다.","내일까지 현금화할 수 있는 금액은 A의 30뿐이다.","필요한 40에서 사용 가능한 30을 빼면 10이 부족하다."],"result":"자산 총액은 130이지만 내일까지 사용할 수 있는 금액은 30이므로 10이 부족하다.","tip":"필요한 날짜 전에 현금화할 수 있는 자산의 금액만 합산한다.","caution":"","check":{"q":"예제에서 내일까지 필요한 금액 40을 마련할 수 있는가?","o":["자산 총액이 130이므로 가능하다.","기한 전에 사용할 금액이 10 부족하다."],"why":"B의 100은 한 달 뒤에만 찾을 수 있으므로 내일은 A의 30만 사용할 수 있다."},"origin":""},"L10-4":{"title":"지출에 필요한 최소 초기 자금","goal":"수입 전의 지출을 감당하기 위해 처음에 필요한 자금을 구해 보자.","headings":["전체 수입과 지출일의 자금","시점별 잔액","최소 초기 자금"],"paragraphs":["전체 기간의 수입이 지출보다 많아도 지출 기한을 지키지 못할 수 있다. 나중에 들어올 수입을 그보다 앞선 지출에 사용할 수 없기 때문이다. 자금 계획에서는 지출일마다 얼마를 사용할 수 있는지 살펴야 한다.","초기 자금을 0으로 놓고 거래 순서대로 수입을 더하고 지출을 빼면 각 시점의 부족액을 알 수 있다. 이때 음(-)의 잔액은 실제로 빌린 돈이 아니라 그 시점까지 부족한 자금을 표시한 것이다.","수입·지출 시점이 정해져 있고 돈의 이월이 가능하며 대출과 지출 연기가 불가능하다면, 가장 큰 부족액만큼 처음에 마련해야 모든 지출 기한을 지킬 수 있다. 처음에 필요한 금액과 전체 거래가 끝난 뒤 남는 잔액은 서로 다르다."],"example":"3개월 동안 매월 말에 200을 지출한다. 수입 600은 3개월째 초에 한 번 들어온다. 남은 돈은 이월할 수 있지만 대출과 지출 연기는 불가능하다. 최소 초기 자금을 구해 보자.","steps":["초기 자금이 0이라면 1개월째 말에는 수입 없이 200을 지출해야 하므로 200이 부족하다.","2개월째 말까지의 지출은 200+200=400이고 아직 수입이 없으므로 400이 부족하다.","처음에 400을 준비하면 첫 두 달의 지출을 낼 수 있다. 마지막 지출은 3개월째 초에 들어온 수입 600으로 충당할 수 있다."],"result":"필요한 최소 초기 자금은 400이다.","tip":"초기 자금을 0으로 놓았을 때의 시점별 잔액 중 가장 크게 부족한 금액을 찾는다.","caution":"같은 달의 수입과 지출이라도 어느 것이 먼저 발생하는지에 따라 필요한 초기 자금이 달라질 수 있다.","check":{"q":"예제에서 모든 지출 기한을 지키기 위해 처음에 필요한 최소 금액은?","why":"수입 전에 발생하는 첫 두 달의 지출 200+200=400을 마련해야 한다."},"origin":""},"L10-5":{"title":"금융 생활 설계의 과정","goal":"재무 목표 설정부터 평가와 수정까지의 과정을 알아보자.","headings":["재무 목표 설정과 상태 분석","재무 계획 수립과 실행","평가와 수정"],"paragraphs":["재무 목표를 설정할 때에는 언제까지 얼마의 자금이 필요한지 정한다. 그다음 현재의 자산과 부채, 수입과 지출, 이용 가능한 자원을 파악한다. 이를 통해 목표를 이루기 위해 추가로 얼마를 마련해야 하는지 알 수 있다.","재무 계획을 세울 때에는 목표의 우선순위, 자금 마련 일정, 예산과 구체적인 행동을 정한다. 이후 계획에 따라 수입과 지출을 관리하고 저축 등을 실행한다. 현재 마련할 수 있는 금액이 목표에 못 미친다면 자금 마련 방법이나 목표 금액, 기한을 검토해야 한다.","실행 후에는 결산을 통해 목표를 얼마나 달성했는지 평가한다. 계획과 실제 결과가 다르다면 그 원인을 살펴보고 계획을 수정한다. 수입이 줄거나 지출이 늘어나는 등 여건이 달라졌을 때에도 계획을 다시 검토한다."],"example":"3개월 뒤에 60을 마련하려고 한다. 현재 가진 돈은 20이고 매월 10씩 추가로 마련할 수 있다. 다른 자금은 없다. 현재의 계획으로 목표를 달성할 수 있는가?","steps":["목표는 3개월 뒤에 60을 마련하는 것이다. 현재 보유액은 20이고 매월 추가로 마련할 금액은 10이다.","3개월 뒤 마련할 수 있는 총액은 20+10×3=50이다.","목표 금액 60보다 10이 부족하다. 목표 금액이나 기한, 자금 마련 방법을 재검토해야 한다."],"result":"현재의 계획으로는 50을 마련할 수 있으므로 목표까지 10이 부족하다.","tip":"목표 설정에서는 필요한 금액과 기한을, 상태 분석에서는 현재 여건을, 계획 수립에서는 마련 방법을 정한다. 실행 결과는 평가와 수정에 반영한다.","caution":"","check":{"q":"결산을 통해 문제의 원인을 찾고 재무 계획을 바꾸는 단계는?","why":"실행 결과를 살펴보고 계획을 바꾸는 과정은 평가 및 수정이다."},"origin":""},"L11-4":{"title":"외화 가격과 환율 변화의 결합","goal":"외화 가격과 환율이 함께 변할 때 원화 수익률을 구해 보자.","headings":["시점별 원화 금액","두 변화 배율의 곱","배율과 수익률"],"paragraphs":["외화 자산의 원화 가치는 외화 표시 가격에 환율을 곱하여 구한다. 가격과 환율이 모두 달라졌다면 매수 당시와 매도 당시의 원화 금액을 각각 계산한다. 매도 후 받은 금액에서 매수할 때 지출한 금액을 빼면 원화 기준 손익이다.","수량이 일정하고 별도의 수익과 비용이 없다면 원화 금액의 변화 배율은 외화 가격의 변화 배율과 환율의 변화 배율을 곱하여 구할 수 있다.\n\n나중 원화 금액 ÷ 처음 원화 금액\n= (나중 외화 가격 ÷ 처음 외화 가격) × (나중 환율 ÷ 처음 환율)","변화 배율이 1.05라면 나중 금액은 처음 금액의 1.05배이고 수익률은 5%이다. 배율에서 1을 뺀 값에 100을 곱하면 수익률을 구할 수 있다. 외화 가격의 증가율과 환율의 증가율을 그대로 더하는 방식은 두 변화가 함께 작용한 결과를 정확히 반영하지 못한다."],"example":"자산 1개의 처음 가격은 100달러이고 환율은 1달러당 1,200원이다. 나중 가격은 90달러이고 환율은 1달러당 1,400원이다. 배당·세금·수수료는 없다. 원화 기준 손익과 수익률을 구해 보자.","steps":["처음 원화 금액은 100×1,200=120,000원, 나중 금액은 90×1,400=126,000원이다. 이익은 6,000원이다.","외화 가격의 변화 배율은 90/100=0.9, 환율의 변화 배율은 1,400/1,200=7/6이다.","두 배율을 곱하면 0.9×7/6=1.05이다. 원화 금액은 처음의 1.05배가 되었으므로 수익률은 5%이다."],"result":"원화 기준 이익은 6,000원이며 수익률은 5%이다.","tip":"외화 가격과 환율의 변화는 각각의 배율을 곱한다. 그 결과에서 1을 빼면 원화 금액의 변화율을 구할 수 있다.","caution":"중간 입출금, 배당, 세금, 수수료가 있다면 각 금액과 발생 시점도 반영해야 한다.","check":{"q":"예제에서 나중 원화 금액은 처음 원화 금액의 몇 배인가?","why":"0.9×7/6=1.05이므로 처음의 1.05배이다."},"origin":""},"L13-4":{"title":"생산 자료의 표와 그래프","goal":"같은 생산 조건을 노동시간과 생산량으로 나타내 보자.","headings":["노동시간과 최대 생산량","생산 가능 곡선의 절편","생산 조합의 계산"],"paragraphs":["단위당 노동시간과 총노동량을 알면 한 재화만 생산할 때의 최대량을 구할 수 있다. 총노동량이 48시간이고 X재 1개에 2시간, Y재 1개에 4시간이 필요하다면 최대량은 X재 24개 또는 Y재 12개이다.","같은 조건을 직선인 생산 가능 곡선으로 나타내면 X축 절편은 24, Y축 절편은 12이다. X재를 24개 생산하는 대신 Y재를 12개 생산할 수 있으므로 X재 1개 생산의 기회비용은 Y재 1/2개이다. 노동시간으로 계산한 2/4개와 같다.","두 재화를 함께 생산할 때에는 한 재화에 사용한 노동시간을 빼고 남은 시간으로 다른 재화를 얼마나 생산할 수 있는지 구한다. 최대 생산량에 남은 자원의 비율을 곱하는 방법으로도 같은 결과를 얻을 수 있다."],"example":"총노동량은 48시간이다. X재 1개에 2시간, Y재 1개에 4시간이 필요하다. X재를 18개 생산할 때 함께 생산할 수 있는 Y재의 최대량을 두 방법으로 구해 보자.","steps":["모든 노동을 한 재화에 투입하면 X재는 최대 48÷2=24개, Y재는 최대 48÷4=12개이다.","X재 18개에 노동 18×2=36시간을 사용하므로 48−36=12시간이 남는다.","남은 노동으로 Y재를 12÷4=3개 생산할 수 있다. Y재 최대량에 남은 자원 비율을 곱한 12×(1−18/24)로 계산해도 3개이다."],"result":"X재 18개와 함께 생산할 수 있는 Y재의 최대량은 3개이다.","tip":"단위당 노동시간으로 최대 생산량을 구하면 투입량표와 생산량표를 서로 바꿔 나타낼 수 있다.","caution":"","check":{"q":"예제에서 X재 18개와 함께 최대로 생산할 수 있는 Y재는 몇 개인가?","why":"X재 생산에 36시간을 쓰고 남은 12시간으로 Y재를 12÷4=3개 생산할 수 있다."},"origin":""},"L13-5":{"title":"생산 기회비용이 같은 두 나라","goal":"최대 생산량이 달라도 기회비용은 같을 수 있음을 알아보자.","headings":["생산량의 크기와 비율","절대 우위와 같은 기회비용","기회비용 차이에 따른 교역 이익"],"paragraphs":["최대 생산량이 적다고 생산의 기회비용이 반드시 큰 것은 아니다. 생산 가능 곡선이 직선이면 한 재화 생산의 기회비용은 두 재화의 최대 생산량 비율로 구한다. 두 나라의 이 비율이 같다면 생산 규모가 달라도 기회비용은 같다.","같은 총노동량에서 A국의 최대량이 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 4개라고 하자. A국은 두 재화를 모두 더 많이 생산하므로 절대 우위를 가진다. 그러나 X재 1개 생산의 기회비용은 A국이 Y재 12/24개, B국이 Y재 4/8개로 모두 Y재 1/2개이다.","이 모형에서 양국이 모두 자급 생산보다 더 큰 이익을 얻으려면 교환 비율이 두 나라의 기회비용 사이에 있어야 한다. 두 기회비용이 같으면 그 사이의 비율이 없으므로, 기회비용의 차이를 이용하여 양국 모두 양(+)의 교역 이익을 얻는 교환 비율도 없다."],"example":"같은 총노동량에서 A국의 최대 생산량은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 4개이다. 생산 가능 곡선은 직선이다. X재 1개 생산의 기회비용을 비교해 보자.","steps":["A국의 X재 1개 생산 기회비용은 Y재 12/24=0.5개이다.","B국의 X재 1개 생산 기회비용도 Y재 4/8=0.5개이다.","양국 모두 양(+)의 이익을 얻으려면 교환 비율이 0.5보다 크면서 0.5보다 작아야 한다. 두 조건을 동시에 만족하는 비율은 없다."],"result":"양국의 X재 1개 생산의 기회비용은 Y재 0.5개로 같다. 주어진 생산 조건에서는 양국 모두 양의 교역 이익을 얻는 교환 비율이 없다.","tip":"절대 우위는 같은 투입량에서 생산할 수 있는 수량을 비교한다. 비교 우위는 두 재화의 최대 생산량 비율로 구한 기회비용을 비교한다.","caution":"","check":{"q":"A국의 최대량은 X재 24개·Y재 12개, B국은 X재 8개·Y재 4개이다. X재 1개 생산의 기회비용은?","o":["A국만 Y재 0.5개이다.","두 나라 모두 Y재 0.5개이다."],"why":"A국은 12/24, B국은 4/8로 계산하므로 두 나라 모두 Y재 0.5개이다."},"origin":""},"L14-4":{"title":"교역 이익이 0이 되는 교환 비율","goal":"기회비용과 같은 교환 비율에서 각국의 이익을 구해 보자.","headings":["기회비용과 같은 교환 비율","각국의 이익이 0이 되는 경우","양국 모두 양(+)의 이익을 얻는 범위"],"paragraphs":["교환 비율이 어느 나라의 생산 기회비용과 같으면 그 나라는 직접 생산할 때보다 추가로 얻는 재화가 없다. 이때 교역 이익은 0이다. 다른 나라가 이익을 얻더라도 양국 모두 양(+)의 이익을 얻는 경우는 아니다.","X재 1개 생산의 기회비용이 A국은 Y재 0.5개, B국은 Y재 1개라고 하자. A국이 X재 6개를 생산하면 Y재 3개를 포기한다. 따라서 X재 6개를 수출하고 Y재 3개를 받으면 A국의 이익은 0이다. B국은 X재 6개를 직접 생산할 때 Y재 6개를 포기하므로, 수입 대가로 Y재 6개를 지급하면 이익이 0이다.","양국 모두 0보다 큰 이익을 얻으려면 교환하는 Y재의 양이 3개보다 많고 6개보다 적어야 한다. 두 경계값에서는 어느 한 나라의 이익이 0이므로 제외한다. 손해만 보지 않으면 되는 문제라면 이익이 0인 경우를 포함할 수 있다."],"example":"A국과 B국이 X재 6개를 교환하려고 한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이고 다른 비용은 없다. 양국 모두 양(+)의 이익을 얻는 Y재 수량의 범위를 구해 보자.","steps":["Y재 3개를 교환하면 A국의 이익은 3−6×0.5=0이다.","Y재 6개를 교환하면 B국의 이익은 6×1−6=0이다.","A국은 Y재를 3개보다 많이 받아야 하고 B국은 6개보다 적게 주어야 한다. 따라서 교환할 Y재 수량 y의 범위는 3<y<6이다."],"result":"양국 모두 양(+)의 이익을 얻는 범위는 3<y<6이다.","tip":"기회비용과 같은 경계값을 대입하면 어느 나라의 이익이 0인지 확인할 수 있다.","caution":"두 나라의 이익을 합한 값이 양수라는 것과 각 나라의 이익이 모두 양수라는 것은 다르다.","check":{"q":"X재 6개와 Y재 3개를 교환할 때 A국의 교역 이익은 얼마인가?","why":"받는 Y재 3개와 X재 생산으로 포기한 Y재 3개가 같으므로 이익은 0이다."},"origin":""},"L14-5":{"title":"교환 비율과 수출 가능한 수량","goal":"교환 비율과 생산량을 함께 고려하여 교역 가능 여부를 판단해 보자.","headings":["유리한 교환 비율","생산량을 넘는 수출량","실현 가능한 교환"],"paragraphs":["교환 비율이 양국에 유리하더라도 교환할 재화를 실제로 가지고 있어야 한다. 재고와 다른 거래가 없다면 한 나라의 수출량은 그 나라의 생산량을 넘을 수 없다.","A국이 X재 24개, B국이 Y재 8개에 완전 특화했다고 하자. X재 12개와 Y재 9개를 교환하는 비율은 X재 1개당 Y재 0.75개이다. 양국의 X재 생산 기회비용이 각각 Y재 0.5개와 1개라면 비율은 유리하다. 그러나 B국은 Y재를 8개만 생산했으므로 9개를 수출할 수 없다.","같은 비율로 수량을 줄이면 생산량 안에서 가능한 교환을 찾을 수 있다. X재 8개와 Y재 6개를 교환하면 비율은 그대로 0.75이고, 두 나라 모두 생산량 안에서 수출할 수 있다. 최소 거래 단위나 정수 조건이 있다면 수량이 그 조건도 만족해야 한다."],"example":"A국은 X재 24개, B국은 Y재 8개만 생산한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. X재 8개와 Y재 6개를 교환할 수 있는지 판단하고 각국의 이익을 구해 보자.","steps":["교환 비율은 X재 1개당 Y재 6/8=0.75개이다. 0.5와 1 사이이므로 양국에 유리하다.","A국의 수출량 8개는 생산량 24개 이하이고, B국의 수출량 6개도 생산량 8개 이하이므로 교환할 수 있다.","A국의 이익은 Y재 6−8×0.5=2개이다. B국의 이익은 직접 생산할 때 포기할 Y재 8개에서 지급한 6개를 뺀 2개이다."],"result":"교환 비율이 유리하고 수출량도 생산량을 넘지 않는다. 교환은 가능하며 각국은 Y재 2개만큼 이익을 얻는다.","tip":"교환 비율이 기회비용 사이에 있는지 확인한 뒤, 각국이 수출할 수량을 실제로 보유하는지 확인한다.","caution":"","check":{"q":"B국은 Y재 8개만 생산했고 재고와 다른 거래가 없다. Y재 9개를 수출할 수 있는가?","o":["교환 비율이 유리하면 가능하다.","생산량을 넘으므로 불가능하다."],"why":"B국이 제공할 수 있는 Y재는 8개뿐이므로 9개를 수출할 수 없다."},"origin":""},"L14-6":{"title":"소비량으로 거래를 추론하는 조건","goal":"소비량에서 생산량과 수입량을 구할 수 있는 조건을 알아보자.","headings":["총생산량과 소비량의 관계","완전 특화한 나라의 수입량","추가 자료가 필요한 경우"],"paragraphs":["두 나라만 거래하고 재고와 손실이 없다면 양국의 소비량 합계는 총생산량과 같다. 재화별로 소비량을 더하여 생산된 총량을 구할 수 있다. 각 나라가 한 재화에 완전 특화했다면 해당 재화의 총량이 그 나라의 생산량이다.","완전 특화한 나라가 자신이 생산하지 않은 재화를 소비한다면 그 수량은 수입량이다. A국이 X재만 생산하고 Y재 5개를 소비했다면 Y재 5개를 수입한 것이다. 다만 Y재를 일부 자급 생산했다면 소비량 전체를 수입량으로 볼 수 없다.","다른 나라와도 거래했거나 재고가 있었다면 소비량에는 그 수량이 반영될 수 있다. 따라서 두 나라의 소비량표만으로 두 나라 사이의 교환량을 언제나 구할 수 있는 것은 아니다. 완전 특화 여부와 재고·손실·다른 거래에 관한 조건이 필요하다."],"example":"A국은 X재, B국은 Y재에 완전 특화하였다. 교역 후 A국은 X재 18개·Y재 5개, B국은 X재 6개·Y재 7개를 소비한다. 재고·손실·다른 거래는 없다. 생산량과 교환 비율을 구해 보자.","steps":["양국의 소비량 합계는 X재 18+6=24개, Y재 5+7=12개이다. 따라서 A국은 X재 24개, B국은 Y재 12개를 생산하였다.","A국이 생산하지 않은 Y재의 소비량 5개와 B국이 생산하지 않은 X재의 소비량 6개가 각각 수입량이다.","따라서 X재 6개와 Y재 5개를 교환하였고, X재 1개당 교환 비율은 Y재 5/6개이다."],"result":"완전 특화와 거래 조건을 이용하면 A국의 생산량은 X재 24개, B국은 Y재 12개이고 교환 수량은 X재 6개 대 Y재 5개임을 알 수 있다.","tip":"소비량 합계로 생산량을, 생산하지 않은 재화의 소비량으로 수입량을 구한다.","caution":"완전 특화가 아니라면 소비량에 자국 생산량과 수입량이 함께 포함될 수 있다.","check":{"q":"두 나라가 서로 거래하면서 다른 나라와도 거래했다. 두 나라의 소비량표만으로 서로 교환한 수량을 항상 알 수 있는가?","o":["항상 알 수 있다.","다른 거래에 관한 자료가 더 필요할 수 있다."],"why":"다른 나라에서 수입하거나 다른 나라로 수출한 수량이 소비량에 반영될 수 있기 때문이다."},"origin":""},"L15-4":{"title":"총액과 시간당·1인당 금액의 차이","goal":"무역 자료에서 총액과 평균액을 구별하고 필요한 정보를 찾아보자.","headings":["거래액과 생산자에게 지급한 대가","시간당 보수와 1인당 금액","노동 조건과 환경 영향"],"paragraphs":["거래 총액은 거래의 전체 규모를 나타낸다. 생산자에게 지급한 대가의 총액은 그중 생산자에게 돌아간 금액을 나타낸다. 두 총액이 모두 늘더라도 증가율은 서로 다를 수 있다. 따라서 거래액의 증가율을 생산자의 소득 증가율로 대신할 수는 없다.","시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 평균적으로 한 사람에게 돌아간 금액은 지급 총액을 인원으로 나누어 구한다. 총액이 늘어도 노동시간이나 인원이 얼마나 달라졌는지에 따라 시간당 또는 1인당 금액은 증가할 수도, 감소할 수도 있다.","소득의 변화와 노동 조건, 환경의 변화도 각각 살펴야 한다. 지급한 대가가 늘었다는 자료만으로 작업장이 안전해졌거나 환경 오염이 줄었다고 할 수는 없다. 노동 조건은 노동시간과 작업장 안전 자료로, 환경 영향은 오염과 자원 사용에 관한 자료로 살펴본다."],"example":"거래액은 15%, 생산자에게 지급한 대가 총액은 4% 증가하였다. 노동시간과 환경에 관한 자료는 없다. 이 자료에서 알 수 있는 사실과 추가로 필요한 정보를 설명해 보자.","steps":["거래액과 생산자에게 지급한 대가 총액은 모두 증가했으며, 거래액의 증가율이 더 크다.","시간당 보수의 변화를 알려면 노동시간이 얼마나 달라졌는지 알아야 한다.","환경이 개선되었는지 알려면 오염이나 자원 사용의 변화에 관한 자료가 필요하다."],"result":"두 총액의 증가는 알 수 있지만, 시간당 보수와 환경의 변화는 추가 자료가 있어야 알 수 있다.","tip":"총액을 시간으로 나누면 시간당 금액, 인원으로 나누면 평균 1인당 금액이다.","caution":"환경 자료가 없다는 사실은 환경 피해가 없다는 뜻이 아니다. 주어지지 않은 피해를 0으로 계산하지 않는다.","check":{"q":"환경에 관한 자료가 없을 때 환경 피해가 없었다고 결론 내릴 수 있는가?","o":["결론 내릴 수 있다.","환경 영향에 관한 자료가 더 필요하다."],"why":"환경에 미친 영향을 알 수 있는 자료가 있어야 피해 발생 여부를 판단할 수 있다."},"origin":""}},"CU41":{"0":{"title":"경제 자료 읽기의 기초","hook":"경제 문제에 자주 나오는 단위와 비율, 수입과 지출의 시점을 연습해 보자."},"1":{"title":"자본주의의 의미와 전개 과정","hook":"자본주의의 특징과 전개 과정을 알아보고, 시대에 따라 시장과 정부의 역할이 어떻게 달라졌는지 살펴보자."},"2":{"title":"경제 체제와 경제적 유인","hook":"시장경제 체제와 계획경제 체제의 특징을 비교하고, 보상과 비용의 변화가 선택에 미치는 영향을 알아보자."},"3":{"title":"합리적 선택과 기회비용","hook":"직접 지출하는 돈과 포기한 가치를 구별하여 기회비용을 계산하고, 가장 유리한 대안을 찾아보자."},"4":{"title":"매몰 비용과 선택의 변화","hook":"매몰 비용의 의미를 알아보고, 앞으로 낼 비용과 받을 금액이 달라질 때 선택이 어떻게 바뀌는지 계산해 보자."},"5":{"title":"외부 효과와 정부의 대응","hook":"생산과 소비가 다른 사람에게 미치는 영향을 알아보고, 외부 효과를 개선하기 위한 세금과 보조금의 역할을 살펴보자."},"6":{"title":"공공재·독과점·정보의 비대칭성","hook":"공공재의 공급 부족, 경쟁 제한, 거래 정보의 차이로 나타나는 문제와 해결 방안을 알아보자."},"7":{"title":"경제 주체의 역할과 책임","hook":"정부, 기업가, 노동자, 소비자가 지속가능발전을 위해 해야 할 일을 알아보자."},"8":{"title":"예금·주식·채권","hook":"세 금융 자산의 특징과 보유자의 지위를 비교하고, 이자·배당·시세 차익을 구별해 보자."},"9":{"title":"자산 관리와 분산 투자","hook":"안전성, 수익성, 유동성의 뜻을 알아보고, 투자금의 배분에 따라 손익이 어떻게 달라지는지 계산해 보자."},"10":{"title":"금융 생활 설계와 이자 계산","hook":"재무 목표에 맞는 계획을 세우고, 돈을 받거나 쓰는 시기와 납입 기간을 고려하여 자금과 이자를 계산해 보자."},"11":{"title":"금리·물가·환율","hook":"금리, 물가, 환율의 변화를 알아보고 이자 부담과 구매력, 원화 기준 손익을 비교해 보자."},"12":{"title":"생산 조건과 무역의 필요성","hook":"생산 조건이 나라별로 다른 이유를 알아보고, 생산에 필요한 자원과 평균 생산 단가를 계산해 보자."},"13":{"title":"절대 우위와 비교 우위","hook":"생산량과 노동시간, 생산 가능 곡선으로 기회비용을 구하고 비교 우위에 있는 재화를 찾아보자."},"14":{"title":"교환 비율과 무역의 이익","hook":"양국에 유리한 교환 비율을 구하고, 실제로 교환할 수 있는 수량과 교역 후의 이익을 계산해 보자."},"15":{"title":"무역의 영향과 지속가능발전","hook":"무역 확대가 생산과 고용, 분배와 환경에 미치는 영향을 알아보고 지속가능한 무역의 방안을 살펴보자."}},"WORKSHOPS42":{"1":{"title":"수입 시점과 필요한 초기 자금","intro":"매월 말에 지출하고, 정해진 달의 월초에 수입을 한 번 받는다. 남은 돈은 다음 달로 넘길 수 있지만 대출과 지출 연기는 불가능하다. 수입을 받는 달을 바꾸어 처음 마련해야 할 돈과 월별 잔액을 비교해 보자.","fields":[{"label":"초기 자금"},{"label":"수입을 받는 달"},{"label":"한 번에 받는 수입"},{"label":"매월 말 지출액"}]},"2":{"title":"대안별 기회비용과 순편익","intro":"세 대안 중 하나만 선택한다. 편익과 비용의 단위는 같으며 다른 대안과 매몰 비용은 없다. 각 대안의 편익과 명시적 비용을 바꾸어 기회비용과 순편익이 어떻게 달라지는지 알아보자.","fields":[{"label":"A의 편익"},{"label":"A의 명시적 비용"},{"label":"B의 편익"},{"label":"B의 명시적 비용"},{"label":"C의 편익"},{"label":"C의 명시적 비용"}]},"3":{"title":"매몰 비용·추가 비용·반환금","intro":"과거 지출은 어떤 선택에서도 회수할 수 없다. 반환금은 새 계약에 따라 B를 선택할 때만 받는다. 과거 지출과 앞으로의 비용, 반환금을 각각 바꾸어 선택에 미치는 영향을 비교해 보자.","fields":[{"label":"회수할 수 없는 과거 지출"},{"label":"A 선택 시 앞으로 지출할 비용"},{"label":"B 선택 시 앞으로 지출할 비용"},{"label":"B 선택 시 받을 반환금"}]},"4":{"title":"부담금과 생산자·정부·주민","intro":"생산자의 이익과 주민의 피해는 같은 금액 단위이다. 부담금은 생산자가 내고 정부가 받는다. 다른 효과는 없다. 부담금과 활동량을 바꾸어 생산자에게 남는 이익, 정부 수입, 주민 피해를 계산해 보자.","fields":[{"label":"활동 1단위당 부담금"},{"label":"계산할 활동량"}]},"5":{"title":"납부액과 가로등 설치","intro":"주민 4명은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하고 각자 편익 10을 얻는다. 실패하면 납부액을 돌려받는다. 각자의 납부액을 바꾸어 설치 여부와 남은 토큰·편익의 합을 살펴보자.","fields":[{"label":"주민 A의 납부액"},{"label":"주민 B의 납부액"},{"label":"주민 C의 납부액"},{"label":"나의 납부액"}]},"6":{"title":"예금·채권·주식의 특징","intro":"금융 자산을 선택하여 보유자의 지위와 기대할 수 있는 수익을 비교해 보자. 예금·채권·주식의 일반적인 특징을 다룬다.","fields":[{"label":"살펴볼 금융 자산"}]},"7":{"title":"단리와 복리의 원리금","intro":"이자율은 일정하며 매년 말에 이자를 계산한다. 중간 입출금과 세금, 수수료는 없다. 원금과 이자율, 기간을 바꾸어 단리와 복리의 원리금을 비교해 보자. 화면에 표시하는 값만 반올림하며 중간 계산에서는 반올림하지 않는다.","fields":[{"label":"처음 예치한 원금"},{"label":"연이율(%)"},{"label":"예치 기간(년)"}]},"8":{"title":"납입 시점과 복리 계산","intro":"첫해, 둘째 해, 셋째 해 초에 각각 돈을 넣고 셋째 해 말에 찾는다. 일정한 연이율로 복리를 적용하며 다른 비용은 없다. 납입액을 바꾸어 각 돈에 붙는 이자와 원리금을 계산해 보자.","fields":[{"label":"1년째 초 납입액"},{"label":"2년째 초 납입액"},{"label":"3년째 초 납입액"},{"label":"연이율(%)"}]},"9":{"title":"환율과 원화 기준 손익","intro":"외화 자산을 한 번 매수한 뒤 전액 매도한다. 배당, 세금, 수수료는 없다. 각 시점의 외화 금액과 원/달러 환율을 바꾸어 원화로 환산한 손익을 비교해 보자.","fields":[{"label":"매수 금액(달러)"},{"label":"매수 시 환율(원/달러)"},{"label":"매도 금액(달러)"},{"label":"매도 시 환율(원/달러)"}]},"10":{"title":"상품 가격과 구매 가능량","intro":"같은 돈으로 한 상품을 구입한다. 상품 가격을 바꾸어 살 수 있는 수량이 어떻게 달라지는지 계산해 보자. 여기서는 여러 상품의 종합적인 물가가 아니라 한 상품의 가격 변화를 다룬다.","fields":[{"label":"사용할 수 있는 금액(원)"},{"label":"이전 상품 가격(원)"},{"label":"변경 후 상품 가격(원)"}]},"11":{"title":"생산 가능 곡선과 생산 조합","intro":"고정된 자원으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. 각 재화의 최대량과 X재의 생산량을 바꾸어 함께 생산할 수 있는 Y재의 최대량을 구해 보자. X재는 최대 생산량 이내에서 생산한다.","fields":[{"label":"X재 최대 생산량"},{"label":"Y재 최대 생산량"},{"label":"실제 X재 생산량"}]},"12":{"title":"교환량과 양국의 이익","intro":"양국은 같은 총노동량으로 두 재화만 생산하며 생산 가능 곡선은 직선이다. A국은 X재만, B국은 Y재만 생산한다. 두 나라 사이의 거래만 있고 손실과 거래 비용은 없다. 생산량과 교환량을 바꾸어 양국의 이익을 구해 보자.","fields":[{"label":"A국의 X재 최대 생산량"},{"label":"A국의 Y재 최대 생산량"},{"label":"B국의 X재 최대 생산량"},{"label":"B국의 Y재 최대 생산량"},{"label":"교환할 X재 수량"},{"label":"교환할 Y재 수량"}]}}};
(function applyKoreanEdition431(){
 const tables={CL41,CT41,CU41,LESSONS,STAGES,CASES,CAST,GUIDES43,WORKSHOPS42,CAMPAIGNS42,PROJECTS42};
