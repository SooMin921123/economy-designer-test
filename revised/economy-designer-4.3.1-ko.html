["희소성과 선택","희소성은 인간의 욕구에 비해 사용할 수 있는 자원이 상대적으로 부족한 상태이다. 같은 시간에 공연을 보는 것과 일을 하는 것을 모두 할 수 없다면 하나를 선택해야 한다. 시간과 자원이 한정되어 있기 때문에 선택에는 다른 기회의 포기가 따른다."],
["편익과 명시적 비용","편익은 선택을 통해 얻는 이득이나 만족감이다. 일해서 받는 보수와 공연을 즐기면서 얻는 만족이 그 예이다. 명시적 비용은 선택에 따라 실제로 지출하는 금전적 비용이다. 공연 표 값과 교통비 등이 이에 해당한다."],
["암묵적 비용과 기회비용","암묵적 비용은 선택으로 포기한 다른 대안 중 가장 큰 가치이다. 다른 대안에서도 돈을 지출해야 했다면, 그 대안의 편익에서 명시적 비용을 뺀 금액이 포기한 가치가 된다. 기회비용은 명시적 비용과 암묵적 비용을 더한 값이다. 편익에서 기회비용을 빼면 순편익을 구할 수 있다."]],
{p:"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 표 값은 3만 원이다. 일을 하면 보수 8만 원을 받지만 교통비 1만 원이 든다. 공연 선택의 기회비용을 구해 보자.",steps:["표 값 3만 원은 공연을 보기 위해 직접 지출하므로 명시적 비용이다.","일을 했다면 보수 8만 원에서 교통비 1만 원을 뺀 7만 원을 얻었을 것이다. 공연을 선택하면서 포기한 이 금액이 암묵적 비용이다.","기회비용은 명시적 비용과 암묵적 비용을 더한 3+7=10만 원이다."],result:"공연 선택의 명시적 비용은 3만 원, 암묵적 비용은 7만 원, 기회비용은 10만 원이다."},
{rule:"돈을 직접 내지 않는 활동에도 기회비용이 있다. 다른 활동을 선택할 기회를 포기하기 때문이다.",limit:"예제에서 만족을 금액으로 나타낸 값은 편익으로 사용한다."},

task('CH-T1','map',"편익과 두 비용의 구분","공연을 선택하였다. 각 설명에 해당하는 개념을 고르시오.",{rows:['공연에서 얻는 만족','공연 표 값 3만 원',"대신 일을 했다면 비용을 제외하고 얻을 수 있었던 7만 원"],options:['편익','명시적 비용','암묵적 비용']},[0,1,2],"공연을 보면서 얻는 만족은 편익이다. 실제로 낸 표 값은 명시적 비용이고, 대신 일을 해서 얻을 수 있었던 가치는 암묵적 비용이다.","얻는 만족, 직접 지출하는 돈, 포기한 기회의 가치를 구별해 보세요."),

lesson('choice','CH-L2',"기회비용과 순편익","각 대안의 기회비용과 순편익을 구하여 합리적인 선택을 찾아보자.",[
["선택하지 않은 대안의 가치","A와 B 중 하나만 선택할 수 있다고 하자. A를 선택하면 B를 포기하므로 B의 편익에서 명시적 비용을 뺀 값이 A 선택의 암묵적 비용이다. 반대로 B를 선택할 때에는 A를 포기한 가치가 암묵적 비용이다."],
["기회비용과 순편익의 계산","선택한 대안의 명시적 비용에 암묵적 비용을 더하면 기회비용이다. 그 대안의 편익에서 기회비용을 빼면 순편익이다. 편익에서 명시적 비용만 뺀 금액에는 아직 다른 대안을 포기한 가치가 반영되지 않았다."],
["편익이 다른 두 대안","편익이 같다면 기회비용이 작은 대안이 더 유리하다. 그러나 편익이 다르면 기회비용이 더 큰 대안의 순편익이 더 클 수 있다. 합리적으로 선택하려면 편익과 기회비용을 함께 고려해야 한다."]],
{p:"A의 편익은 25, 명시적 비용은 7이고 B의 편익은 32, 명시적 비용은 11이다. 둘 중 하나만 선택하며 다른 대안과 매몰 비용은 없다. 각 대안의 기회비용과 순편익을 구해 보자.",table:[['대안','편익','명시적 비용'],['A',25,7],['B',32,11]],steps:["A의 편익에서 명시적 비용을 빼면 25−7=18이다. B는 32−11=21이다.","A를 선택하면 B의 21을 포기한다. A의 기회비용은 명시적 비용 7을 더한 28이다.","B를 선택하면 A의 18을 포기한다. B의 기회비용은 명시적 비용 11을 더한 29이다.","순편익은 A가 25−28=−3, B가 32−29=3이다."],result:"B의 기회비용은 A보다 크지만 순편익도 더 크므로 B가 합리적인 선택이다."},
{rule:"기회비용은 명시적 비용과 암묵적 비용의 합이다. 순편익은 편익에서 기회비용을 뺀 값이다.",limit:"이 예제에서는 두 대안 중 하나만 선택할 수 있고 다른 대안은 없다."},
"두 대안만 있다면 각 대안의 편익에서 명시적 비용을 뺀 금액을 비교하여 유리한 쪽을 찾을 수 있다. 예제에서는 B의 21이 A의 18보다 3 크다. 이 차이가 B 선택의 순편익이다. A를 선택할 때의 순편익은 반대로 −3이다. 두 금액이 같다면 두 대안의 순편익은 모두 0이다.",['E76']),
task('CH-T3','numbers',"B 선택의 기회비용과 순편익","세 활동 중 B를 선택한다. B 선택의 암묵적 비용, 기회비용, 순편익을 만 원 단위로 구하시오.",{table:[['대안','편익','명시적 비용'],...DAY],labels:['B의 암묵적 비용','B의 기회비용','B의 순편익']},[25,35,1],"B를 선택할 때 포기한 대안 중 가장 큰 가치는 C의 32−7=25만 원이다. B의 명시적 비용은 10만 원이므로 기회비용은 35만 원이다. 순편익은 편익에서 기회비용을 뺀 36−35=1만 원이다.","C를 포기한 가치 25에 B의 명시적 비용을 더하면 기회비용입니다."),
task('CH-T4','numbers',"새로운 세 대안의 기회비용","A, B, C 중 하나만 선택한다. 표의 비용은 앞으로 지출할 명시적 비용이다. B 선택의 암묵적 비용, 기회비용, 순편익을 구하시오.",{table:[['대안','편익','명시적 비용'],['A',22,4],['B',28,7],['C',25,6]],labels:['B의 암묵적 비용','B의 기회비용','B의 순편익']},[19,26,2],"편익에서 명시적 비용을 빼면 A는 18, B는 21, C는 19이다. B를 선택하면 남은 대안 중 더 큰 C의 19를 포기한다. 기회비용은 7+19=26이고 순편익은 28−26=2이다.","B를 선택할 때 포기하는 A와 C의 가치를 비교하세요."),
lesson('choice','CH-L3',"매몰 비용과 비용의 변화","회수할 수 없는 과거 지출과 앞으로 부담할 비용을 구별해 보자.",[
["매몰 비용","매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 어떤 대안을 선택하더라도 돌려받지 못하므로 현재의 합리적 선택에서 고려하지 않는다. 사업을 계속할 때와 중단할 때 모두 회수할 수 없는 과거 개발비가 그 예이다."],
["새 계약에 따른 반환금","새로운 계약으로 특정 대안을 선택할 때만 반환금을 받게 되었다면 앞으로 받을 수 있는 금액에 차이가 생긴다. 그 대안의 편익에 반환금을 더하여 다른 대안과 비교한다. 반환금이 제시된 편익에 이미 포함되어 있다면 다시 더하지 않는다."],
["보상과 비용의 변화","보상이 늘거나 앞으로 낼 비용이 줄면 해당 대안이 이전보다 유리해진다. 다만 다른 대안보다 유리해졌는지는 두 대안의 편익과 비용을 다시 비교해야 알 수 있다. 두 대안이 같아진 경우와 어느 하나가 더 유리한 경우도 구별해야 한다."]],
{p:"A의 앞으로의 편익은 150, 명시적 비용은 90이고 B는 각각 130과 55이다. 과거 지출 60은 어떤 선택에서도 회수할 수 없다. 이후 B의 명시적 비용만 75로 증가하였다. 유리한 대안은 어떻게 바뀌는가?",steps:["처음에는 A의 편익에서 명시적 비용을 뺀 값이 60, B는 75이므로 B가 유리하다.","과거 지출 60은 매몰 비용이므로 두 대안을 비교할 때 제외한다.","B의 명시적 비용이 75가 되면 편익에서 명시적 비용을 뺀 값은 55이다. A의 60보다 작으므로 A가 더 유리해진다."],result:"B가 앞으로 부담할 비용이 증가하여 유리한 대안이 B에서 A로 바뀌었다."},
{rule:"현재의 선택에는 앞으로 달라지는 편익과 비용을 반영한다. 회수할 수 없는 과거 지출은 제외한다.",limit:"과거에 냈더라도 현재의 선택에 따라 돌려받을 수 있는 금액은 매몰 비용과 구별한다."},
"두 대안이 같은 수준으로 유리해지는 금액과 어느 한 대안이 더 유리해지는 금액은 다르다. 반환금을 정수로만 받을 수 있다면 두 대안이 같아지는 금액을 구한 뒤 그다음 정수에서의 결과를 살펴볼 수 있다. 동률을 허용하는지에 따라 경계값을 포함할지가 달라진다.",['E76']),
task('CH-T5','threshold',"C가 가장 유리해지는 비용","B의 명시적 비용만 정수로 높일 수 있다. C가 다른 두 대안보다 더 유리해지는 B의 명시적 비용 중 가장 작은 정수를 구하시오.",{rows:DAY,min:10,max:18,step:1,label:'B의 새로운 명시적 비용'},12,"B의 비용이 11이면 편익에서 명시적 비용을 뺀 값이 25로 C와 같다. 비용이 12가 되면 B는 24로 작아진다. 따라서 비용이 12일 때 C가 다른 두 대안보다 유리하다.","C와 B가 같은 경우가 아니라 C가 더 유리해지는 값을 찾아야 합니다."),
task('CH-T6','choice',"과거 지출만 커진 경우","앞으로 각 대안에서 얻을 편익과 부담할 비용은 같다. 어떤 선택에서도 회수할 수 없는 과거 지출만 60에서 200으로 커졌다. 이에 대한 설명으로 옳은 것은?",{options:['이미 많이 썼으므로 반드시 기존 사업을 계속한다.','그 사실만으로 현재 대안 간 우열은 바뀌지 않는다.','과거 지출이 크므로 미래의 모든 편익은 0이다.']},1,"과거 지출은 매몰 비용이다. 현재의 선택에 따른 편익과 비용이 변하지 않았으므로 유리한 대안도 그대로이다.","현재의 선택은 회수할 수 없는 과거 지출을 제외하고 비교합니다."),
lesson('choice','CH-L4',"포기한 가치와 순편익의 변화","가장 유리한 선택이 그대로여도 순편익은 달라질 수 있다.",[
["세 대안 중 하나를 선택하는 경우","A, B, C의 편익에서 명시적 비용을 뺀 값이 각각 22, 26, 25라고 하자. B의 값이 가장 크므로 B를 선택하는 것이 유리하다. B를 선택할 때에는 남은 A와 C 중 가치가 더 큰 C의 25를 암묵적 비용으로 계산한다."],
["가장 유리한 선택의 순편익","B의 편익에서 명시적 비용을 빼면 26이고 암묵적 비용은 25이다. 따라서 B의 순편익은 26−25=1이다. A나 C를 선택하면 더 큰 B의 26을 포기하므로 순편익이 음수가 된다."],
["포기한 대안의 가치가 커진 경우","C의 가치가 커져도 B의 26보다 작다면 B가 여전히 가장 유리하다. 그러나 B를 선택할 때 포기하는 가치는 커진다. B의 명시적 비용이 일정하다면 기회비용은 증가하고 순편익은 감소한다."]],
{p:"A, B, C의 편익에서 명시적 비용을 뺀 값은 각각 22, 26, 25이다. 다른 조건은 같고 C의 값만 25.5로 증가하였다. B 선택의 순편익은 어떻게 달라지는가?",steps:['처음 B의 순편익은 26−25=1이다.',"변경 후에도 B의 26이 C의 25.5보다 크므로 B를 선택하는 것이 가장 유리하다.","B를 선택할 때 포기하는 가치는 25.5로 커진다. 따라서 순편익은 26−25.5=0.5로 줄어든다."],result:"가장 유리한 대안은 B로 같지만, 암묵적 비용은 증가하고 순편익은 감소하였다."},
{rule:"선택한 대안을 제외한 나머지 대안 중 가장 큰 가치가 암묵적 비용이다.",limit:"‘아무것도 하지 않기’도 선택할 수 있는 대안으로 제시되었다면 그 가치까지 비교한다."},
"편익이 서로 다르면 명시적 비용이나 기회비용이 가장 작은 대안이 언제나 최선은 아니다. 비용이 더 크더라도 편익의 차이가 충분히 크면 순편익도 더 클 수 있다. 반대로 편익이 가장 큰 대안도 비용을 고려하면 불리할 수 있다.",['E76']),
task('CH-T7','countermodel',"순편익이 줄어드는 조건","A와 B의 조건은 그대로이고 C의 편익만 0.5씩 높일 수 있다. B가 다른 두 대안보다 더 유리하면서 B의 순편익이 0보다 크고 1보다 작아지도록 C의 편익을 조절하시오.",{rows:DAY,min:32,max:34,step:0.5,label:'C의 새로운 편익'},32.5,"C의 편익이 32.5이면 명시적 비용 7을 뺀 값은 25.5이다. B의 26보다 작으므로 B가 여전히 가장 유리하다. 그러나 B의 순편익은 26−25.5=0.5로 줄어든다.","B의 26과 C의 ‘편익−명시적 비용’ 사이의 차이가 0보다 크고 1보다 작아야 합니다."),
task('CH-W','write',"암묵적 비용을 자신의 말로 설명하기","암묵적 비용을 구할 때 왜 포기한 대안들의 가치를 모두 더하지 않는지 설명해 보자.",{checks:["대안 중 하나만 선택할 수 있다는 조건을 설명하였다.","명시적 비용, 암묵적 비용, 기회비용, 순편익의 뜻을 구별하였다.","가장 유리한 대안이 그대로여도 순편익이 달라지는 예를 들었다."],starter:"여러 대안 중 하나만 선택할 수 있다면…"},null,"쓴 글을 저장한 뒤, 개념 설명과 예제 풀이를 보며 내용을 확인해 보자. 작성한 글은 자동 채점하지 않는다.","각 대안의 편익에서 명시적 비용을 뺀 값이 22, 26, 25인 예제를 활용해 보세요.")
]);
defineCase('public',[
lesson('public','PG-L1',"공공재의 비배제성과 비경합성","가로등의 사례로 공공재의 두 특성을 알아보자.",[
["공공재","공공재는 비배제성과 비경합성을 가진 재화나 서비스이다. 국방과 치안 서비스가 대표적이다. 공공재의 두 특성은 대가를 내지 않은 사람도 소비할 수 있는지, 한 사람의 소비가 다른 사람의 소비 기회를 줄이는지에 관한 것이다."],
['비배제성',"비배제성은 대가를 지불하지 않은 사람을 소비에서 배제할 수 없는 특성이다. 가로등 설치비를 내지 않은 주민도 가로등의 불빛을 이용할 수 있다는 점에서 비배제성이 나타난다."],
['비경합성',"비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 한 주민이 가로등의 불빛을 이용하더라도 다른 주민의 이용 기회가 줄어들지 않는다는 점에서 비경합성이 나타난다."]],
{p:"가로등이 골목을 비추고 있다. 설치비를 내지 않은 주민도 불빛을 이용할 수 있고, 한 주민이 이용해도 다른 주민의 이용 기회는 줄지 않는다. 가로등의 두 특성을 설명해 보자.",steps:["설치비를 내지 않은 주민의 이용을 막을 수 없으므로 비배제성이 있다.","한 주민이 불빛을 이용해도 다른 주민의 이용 기회가 줄지 않으므로 비경합성이 있다.","비배제성과 비경합성을 모두 가지므로 이 사례의 가로등은 공공재에 해당한다."],result:"설치비를 내지 않아도 이용할 수 있다는 것은 비배제성, 함께 이용해도 다른 사람의 소비 기회가 줄지 않는다는 것은 비경합성이다."},
{rule:"비배제성은 대가를 내지 않은 사람의 이용과, 비경합성은 다른 사람의 소비 기회와 관련된다.",limit:"혼잡이나 이용 제한이 제시된 시설은 그 조건에 따라 두 특성이 나타나는지 살펴본다."},
"공공재는 대가를 내지 않아도 이용할 수 있으므로 비용을 부담하지 않으려는 무임승차가 나타날 수 있다. 이 때문에 민간 기업이 이윤을 얻기 어려워 필요한 만큼 공급하지 못할 수 있다. 공공재 부족은 시장 실패의 한 유형이다.",['E77','D77']),
task('PG-T1','map',"공공재의 두 특성","각 설명에 해당하는 공공재의 특성을 고르시오.",{rows:['비용을 내지 않은 사람을 소비에서 배제할 수 없다.','한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다.'],options:['비배제성','비경합성']},[0,1],"대가를 내지 않은 사람의 소비를 막을 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는 것은 비경합성이다.","비용을 내지 않은 사람의 이용과 다른 사람의 소비 기회를 구별하세요."),
task('PG-T2','numbers',"주민 전체의 편익과 설치비","이번 활동의 주민 수는 20명이다. 가로등 설치비는 12만 원이며, 설치되면 각 주민은 편익 1만 원을 얻는다. 다른 편익과 비용은 없다. 주민 전체의 추가 편익과, 그 총편익에서 설치비를 뺀 금액을 만 원 단위로 구하시오.",{labels:['추가 총편익(만 원)','설치비(만 원)','추가 총편익−설치비(만 원)']},[20,12,8],"주민 전체의 추가 편익은 20×1=20만 원이다. 설치비 12만 원을 빼면 8만 원이다. 전체 편익이 설치비보다 크더라도 실제로 설치비가 모이는지는 별도로 살펴야 한다.","주민 20명의 편익을 먼저 합하세요. 뒤의 4인 활동과 주민 수가 다릅니다.",{refs:['D77']}),
lesson('public','PG-L2',"가로등 설치비 모금","설치에 성공할 때와 실패할 때 각 주민에게 남는 토큰과 편익을 계산해 보자.",[
["네 주민의 모금 활동","네 주민이 가로등 설치비를 모은다. 각 주민은 10토큰을 가지고 있으며 설치비는 24토큰이다. 가로등이 설치되면 비용을 냈는지와 관계없이 각자 편익 10을 얻는다. 설치에 실패하면 납부한 토큰은 모두 돌려받는다."],
["설치에 성공한 경우","총모금액이 24토큰 이상이면 가로등을 설치한다. 각 주민이 납부한 토큰을 처음의 10토큰에서 빼면 남은 토큰이다. 여기에 가로등에서 얻는 편익 10을 더한다.\n\n남은 토큰과 편익의 합 = 10 − 납부액 + 10"],
["설치에 실패한 경우","총모금액이 24토큰에 미치지 못하면 가로등을 설치하지 않는다. 납부액을 돌려받으므로 각 주민은 처음처럼 10토큰을 보유한다. 가로등은 설치되지 않았으므로 편익은 없다. 따라서 남은 토큰과 편익의 합은 10이다."]],
{p:"네 주민이 모두 6토큰씩 낸다. 각자의 처음 보유액은 10토큰, 설치비는 24토큰, 설치 시 편익은 각자 10이다. 설치 후 남은 토큰과 편익의 합을 구해 보자.",steps:["총모금액은 6×4=24토큰으로 설치비가 모두 모인다.","각 주민은 6토큰을 내고 10−6=4토큰을 남긴다.","가로등에서 얻는 편익 10을 더하면 합은 14이다."],result:"가로등 설치에 성공하며 각자의 남은 토큰과 편익의 합은 14이다."},
{rule:"먼저 모금액으로 가로등을 설치할 수 있는지 확인한다. 설치 여부에 따라 납부액 반환과 편익이 달라진다.",limit:"이 활동에서는 주민 4명과 위의 설치·반환 규칙을 적용한다. 앞선 모금 문제의 다른 주민 납부액은 공개된 값이다."},
"다른 주민의 납부액을 알면 내가 얼마를 더 내야 가로등을 설치할 수 있는지 계산할 수 있다. 그러나 다른 주민이 얼마를 내는지 모르면 설치 성공 여부도 달라질 수 있다. 같은 납부액을 선택하더라도 다른 주민의 행동에 따라 결과가 달라지는 것이다.",['D77','E77']),
task('PG-T3','donation',"부족한 설치비와 나의 납부액","네 주민은 각각 10토큰을 가지고 있다. 설치비는 24토큰이며, 설치되면 각자 편익 10을 얻는다. 실패하면 납부액을 돌려받는다. 다른 세 주민은 각각 6토큰씩 냈다. 내 납부액 0, 4, 6, 10 중 가장 유리한 것을 고르고 남은 토큰과 편익의 합을 구하시오.",{others:[6,6,6],choices:[0,4,6,10]},[6,14],"다른 주민의 납부액은 18토큰이다. 내가 6토큰을 내면 설치에 성공하여 남은 토큰과 편익의 합이 14이다. 0이나 4를 내면 설치에 실패하여 처음의 10토큰을 보유한다. 10을 내면 설치되지만 합은 10이므로 6토큰이 가장 유리하다.","6토큰을 내면 설치비 24가 모두 모입니다. 다른 납부액의 결과와 비교해 보세요."),
task('PG-T4','donation','이미 모인 비용',"각자 10토큰을 가지고 있으며 설치비는 24토큰, 설치 편익은 각자 10이다. 실패하면 납부액을 돌려받는다. 다른 세 주민은 각각 8토큰씩 냈다. 내 납부액 0, 4, 6, 10 중 가장 유리한 것을 고르고 남은 토큰과 편익의 합을 구하시오.",{others:[8,8,8],choices:[0,4,6,10]},[0,20],"다른 주민만으로 8×3=24토큰이 모였다. 내가 내지 않아도 설치되므로 0토큰을 내면 보유 토큰 10을 남기고 편익 10을 얻는다. 합은 20이다.","다른 주민이 이미 설치비를 모두 냈습니다."),
lesson('public','PG-L3',"다른 주민의 납부액과 나의 선택","다른 주민이 낸 금액에 따라 내게 유리한 납부액이 달라지는 이유를 알아보자.",[
["설치비가 부족한 경우","다른 세 주민이 모두 18토큰을 냈다고 하자. 내가 6토큰을 내면 설치비 24토큰이 모두 모인다. 설치 후 남은 토큰과 편익의 합은 10−6+10=14이다. 제시된 납부액 0, 4, 6, 10 중에서는 6토큰이 가장 유리하다."],
["설치비가 이미 모인 경우","다른 주민만으로 24토큰이 모였다면 내가 0토큰을 내도 가로등이 설치된다. 보유한 10토큰을 그대로 남기면서 편익 10을 얻으므로 합은 20이다. 추가로 돈을 내면 남은 토큰이 줄어들므로 이 경우에는 0토큰이 가장 유리하다."],
["다른 주민의 납부액을 모르는 경우","두 상황에서 내게 유리한 납부액은 서로 다르다. 어느 상황이 발생하는지 모르고 각 상황의 확률도 주어지지 않았다면 하나의 납부액을 최선이라고 정하기 어렵다. 다른 주민의 납부액이나 행동에 관한 정보가 더 필요하다."]],
{p:"내 납부액은 0, 4, 6, 10토큰 중 하나이다. 상황 A에서 다른 주민의 납부액 합계는 18토큰, 상황 B에서는 24토큰이다. 어느 상황인지와 각 상황의 발생 확률은 알려져 있지 않다. 두 경우에 내게 유리한 선택을 비교해 보자.",steps:["상황 A에서는 6토큰을 내면 설치에 성공하며 남은 토큰과 편익의 합이 14로 가장 크다.","상황 B에서는 비용을 내지 않아도 설치된다. 0토큰을 내면 합이 20으로 가장 크다.","상황에 따라 가장 유리한 납부액이 다르므로 추가 정보 없이 둘 중 하나를 최선이라고 정할 수는 없다."],result:"다른 주민이 낸 금액을 알면 상황별로 유리한 선택을 계산할 수 있다. 그 금액이 알려져 있지 않은 경우에는 추가 정보가 필요하다."},
{rule:"다른 주민의 납부액이 달라졌을 때 설치 여부와 내게 남는 토큰을 다시 계산한다.",limit:"각 상황의 확률이 주어지지 않았다면 두 상황이 같은 확률로 발생한다고 가정하지 않는다."},
"모든 주민이 같은 금액을 낸다는 규칙이 정해져 있다면 그 규칙을 이용하여 총모금액을 구할 수 있다. 각자의 납부액을 모르는 상황과 공동의 납부 규칙이 정해진 상황은 다르다. 문제에 주어진 정보와 규칙에 따라 설치 결과를 계산한다.",['D77','E77']),
task('PG-T5','choice',"납부액을 정하기에 부족한 정보","다른 주민의 납부액 합계가 18인지 24인지 알 수 없고, 두 상황의 발생 확률도 모른다. 앞선 두 상황에서 같은 납부액이 언제나 가장 유리한가?",{options:['두 경우 모두 반드시 0이 최선이다.','두 경우 모두 반드시 6이 최선이다.','두 경우의 최적 선택이 달라 추가 정보나 가정이 필요하다.']},2,"합계가 18이면 6토큰, 24이면 0토큰을 내는 것이 가장 유리하다. 상황별 선택이 다르므로 추가 정보 없이 하나를 최선이라고 정할 수는 없다.","두 상황에서 가장 유리했던 납부액이 같은지 비교하세요."),
task('PG-T6','allocation',"조건에 맞는 비용 분담","이번 활동에서는 주민 4명의 납부액 합계가 정확히 24이고 누구도 6을 넘게 내지 않기로 합의하였다. 두 조건을 충족하도록 각 주민의 납부액을 정하시오.",{names:['주민 A','주민 B','주민 C','주민 D'],max:10,limit:6,total:24},[6,6,6,6],"한 사람이 낼 수 있는 최대액은 6이다. 네 사람이 모두 최대액을 내야 6×4=24가 되므로 각자 6씩 내야 한다.","누군가 6보다 적게 내면, 다른 사람도 6을 넘게 낼 수 없으므로 합계 24에 도달하지 못합니다."),
lesson('public','PG-L4',"무임승차와 정부의 공공재 공급","공공재가 시장에서 충분히 공급되지 않는 이유와 정부의 역할을 알아보자.",[
['무임승차자 문제',"공공재는 대가를 지불하지 않은 사람도 이용할 수 있다. 따라서 비용을 부담하지 않고 혜택만 누리려는 무임승차가 나타날 수 있다. 가로등 비용은 다른 주민이 내기를 바라면서 불빛은 함께 이용하려는 경우가 그 예이다."],
["공공재의 공급 부족","무임승차가 나타나면 민간 기업은 이용자에게 충분한 대가를 받기 어렵다. 공공재를 생산하여 비용을 회수하고 이윤을 얻기 어려우므로 생산을 줄이거나 포기할 수 있다. 그 결과 시장에서 사회가 필요로 하는 양만큼 공급되지 않을 수 있다."],
["정부의 직접 공급","정부는 공공재의 생산과 공급에 직접 참여하여 공급 부족을 보완할 수 있다. 공공재 부족의 원인을 해결하기 위한 역할이다. 외부 불경제가 발생한 활동에 부담금을 부과하거나 제품 정보를 제공하여 정보의 비대칭성을 줄이는 역할과는 구별된다."]],
{p:"설치비를 내지 않은 주민도 가로등을 이용할 수 있다. 이에 따라 다른 주민이 비용을 내기를 기다리면서 자신의 부담을 피하려는 사람이 늘었다. 공공재 부족이 발생할 수 있는 이유와 정부의 역할을 설명해 보자.",steps:["설치비를 내지 않은 주민도 이용할 수 있다는 것은 비배제성이다.","자신은 비용을 부담하지 않고 혜택을 누리려는 것은 무임승차이다.","비용이 충분히 모이지 않으면 공급이 부족해질 수 있다. 정부는 가로등을 직접 공급하여 이를 보완할 수 있다."],result:"공공재의 비배제성으로 무임승차가 나타나 공급이 부족해질 수 있으며, 정부의 직접 공급은 이를 보완하는 방법이다."},
{rule:"무임승차는 비배제성과 관련된다. 비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다는 특성이다.",limit:"공급 부족이 발생할 수 있다는 것은 모든 모금이 반드시 실패한다는 뜻은 아니다."},
"공공재인지는 공급 주체만으로 구분하지 않는다. 정부가 공급하는 재화도 이용료를 내지 않은 사람을 배제할 수 있거나 한 사람의 소비로 다른 사람의 소비 기회가 줄어들 수 있다. 비배제성과 비경합성이라는 소비의 특성을 살펴야 한다.",['E77','D77']),
task('PG-T7','multi',"공공재에 관한 종합 문제","공공재의 개념과 이번 모금 활동에 대한 설명으로 옳은 것을 모두 고르시오.",{options:['비배제성 때문에 미납부자도 편익을 얻을 수 있다.','비경합성은 한 사람의 소비가 타인의 소비 기회를 줄이지 않는 것이다.','많이 납부한 사람이 항상 경제 개념도 더 잘 이해한다.','공공재 공급 부족과 정부의 직접 공급 역할을 연결할 수 있다.','무임승차가 가능하면 모든 모금은 어떤 조건에서도 실패한다.']},[0,1,3],"비배제성은 비용을 내지 않은 사람도 이용할 수 있는 특성이고, 비경합성은 다른 사람의 소비 기회가 줄지 않는 특성이다. 정부는 공급 부족을 보완하기 위해 공공재를 직접 공급할 수 있다. 무임승차가 가능하더라도 설치비가 충분히 모이면 설치에 성공한다.","공공재의 정의와 설치에 필요한 모금액을 각각 적용해 보세요."),
task('PG-W','write',"공공재와 정부의 역할 설명하기","가로등의 비배제성과 비경합성을 설명하고, 무임승차와 공급 부족이 나타날 수 있는 이유 및 정부의 역할을 정리해 보자.",{checks:["가로등의 두 특성을 각각 설명하였다.","20인 활동과 4인 활동의 인원과 규칙을 구별하였다.","무임승차가 공급 부족으로 이어질 수 있는 이유를 설명하였다."],starter:"가로등은 설치비를 내지 않은 주민도 이용할 수 있다. 이처럼…"},null,"쓴 글을 저장한 뒤 개념 설명과 비교해 보자. 작성한 글은 자동 채점하지 않는다.","비배제성 때문에 무임승차가 나타날 수 있고, 비용을 충분히 걷기 어려워 공급이 부족해질 수 있습니다.")
]);
defineCase('trade',[
lesson('trade','TR-L1',"절대 우위와 비교 우위","생산 능력과 생산의 기회비용을 구별해 보자.",[
["절대 우위","절대 우위는 다른 생산자보다 같은 상품을 더 적은 비용으로 생산할 수 있는 능력이다. 같은 총노동량을 투입하여 더 많은 양을 생산하는 나라는 그 재화에 절대 우위를 갖는다. 생산량만 주어졌다면 투입한 노동량도 같았는지 알아야 한다."],
["비교 우위","비교 우위는 같은 재화를 더 작은 기회비용으로 생산할 수 있는 능력이다. 한 나라가 두 재화를 모두 많이 생산할 수 있더라도, 재화 한 개를 만들 때 포기하는 다른 재화의 수량은 상대국보다 많을 수 있다. 따라서 절대 우위와 비교 우위는 구별된다."],
["최대 생산량","양국이 같은 총노동량으로 X재와 Y재만 생산하고 생산 가능 곡선은 직선이라고 하자. 모든 노동을 한 재화에 쓰면 A국은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개를 생산한다. 최대 생산량은 모든 노동을 해당 재화에 사용할 때의 양이므로 두 재화의 최대량을 동시에 생산할 수는 없다."]],
{p:"A국은 모든 노동을 투입하면 X재를 24개 또는 Y재를 12개 생산할 수 있다. 생산 가능 곡선은 직선이다. X재 1개 생산의 기회비용과 X재 18개를 만들 때 함께 생산할 수 있는 Y재의 최대량을 구해 보자.",steps:["X재 24개를 생산하면 대신 생산할 수 있었던 Y재 12개를 포기한다.","X재 1개 생산의 기회비용은 Y재 12÷24=1/2개이다.","X재 18개에 자원의 18/24를 쓰고 1/4을 남긴다. 따라서 Y재는 최대 12×1/4=3개를 생산할 수 있다."],result:"X재 1개의 기회비용은 Y재 1/2개이다. X재 18개와 Y재 3개를 생산하는 조합은 생산 가능 곡선 위에 있다."},
{rule:"최대 생산량표에서 X재 1개의 기회비용은 Y재의 최대량을 X재의 최대량으로 나누어 구한다.",limit:"자원과 기술이 고정되어 있고 생산 가능 곡선이 직선인 경우의 계산이다."},
"생산 가능 곡선의 절편은 모든 자원을 한 재화에 투입했을 때의 최대 생산량이다. 곡선 위의 조합은 주어진 자원을 모두 효율적으로 사용한 경우이다. 곡선 안쪽에서는 더 생산할 여지가 있지만, 곡선 바깥쪽은 주어진 자원과 기술로 생산할 수 없다.",['A86']),
task('TR-T1','choice',"같은 노동량과 절대 우위","같은 총노동량으로 한 재화만 생산할 때 A국은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개를 최대로 생산한다. 절대 우위에 대한 설명으로 옳은 것은?",{options:['A국이 두 재화 모두 절대 우위이다.','B국이 두 재화 모두 절대 우위이다.','A는 X, B는 Y에 반드시 절대 우위이다.']},0,"같은 노동량으로 A국이 두 재화 모두 더 많이 생산하므로 두 재화에 모두 절대 우위를 갖는다. 비교 우위는 기회비용을 계산하여 구분한다.","X재와 Y재 각각의 생산량을 나라별로 비교하세요."),
task('TR-T2','ppf',"X재와 함께 생산할 Y재","A국은 X재를 최대 24개 또는 Y재를 최대 12개 생산할 수 있다. 생산 가능 곡선이 직선일 때 X재 생산량을 18개로 맞추고, 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.",{xmax:24,ymax:12,target:18},[18,3],"X재 18개를 만들려면 자원의 18/24=3/4이 필요하다. 남은 자원 1/4로 Y재는 최대 12×1/4=3개를 만들 수 있다.","X재에 쓰고 남은 자원의 비율을 Y재의 최대 생산량에 곱하세요."),
lesson('trade','TR-L2',"노동시간표와 최대 생산량표","같은 생산 조건을 두 종류의 표로 나타내어 기회비용을 구해 보자.",[
["최대 생산량으로 구하기","A국은 X재 24개 대신 Y재 12개를 생산할 수 있다. 따라서 X재 1개를 만드는 데 포기하는 Y재는 12÷24=1/2개이다. B국의 최대량은 X재와 Y재 모두 8개이므로 X재 1개의 기회비용은 Y재 1개이다. 기회비용이 더 작은 A국은 X재에 비교 우위를 갖는다."],
["노동시간으로 구하기","X재 1개에 2시간, Y재 1개에 4시간이 필요하다고 하자. X재를 만드는 데 쓴 2시간으로 Y재를 2/4개 만들 수 있었다. 따라서 X재 1개 생산의 기회비용은 Y재 1/2개이다. 이때는 X재에 필요한 시간을 Y재에 필요한 시간으로 나눈다."],
["총노동량과 최대 생산량","총노동량을 알면 노동시간표를 최대 생산량표로 바꿀 수 있다. 총노동량을 재화 1개당 노동시간으로 나눈 값이 그 재화의 최대 생산량이다. 두 표가 같은 생산 조건을 나타낸다면 계산한 기회비용도 같다."]],
{p:"총노동량은 각국 48시간이다. 재화 1개당 필요한 노동시간은 A국이 X재 2시간, Y재 4시간이고 B국은 X재와 Y재 모두 6시간이다. 두 표로 나타낸 생산량과 기회비용을 비교해 보자.",steps:["A국의 최대 생산량은 X재 48÷2=24개 또는 Y재 48÷4=12개이다. B국은 두 재화 모두 각각 최대 8개이다.","노동시간으로 계산한 X재 1개의 기회비용은 A국이 Y재 2/4=1/2개, B국이 Y재 6/6=1개이다.","최대 생산량으로 계산하면 A국은 Y재 12/24=1/2개, B국은 Y재 8/8=1개로 같다."],result:"노동시간표와 최대 생산량표는 수치의 의미가 다르지만, 같은 생산 조건이라면 기회비용은 같다."},
{rule:"X재 1개의 기회비용: 최대 생산량표에서는 ‘Y재 최대량÷X재 최대량’, 노동시간표에서는 ‘X재의 시간÷Y재의 시간’이다.",limit:"같은 생산 요소와 단위로 비교한다. 양국의 기회비용이 같다면 어느 한 나라만 비교 우위에 있지 않다."},
"직선인 생산 가능 곡선에서 두 재화 생산의 기회비용은 서로 역수이다. X재 1개의 기회비용이 Y재 1/2개라면 Y재 1개의 기회비용은 X재 2개이다. 결과에 포기한 재화의 단위를 붙이면 무엇의 생산 비용인지 분명해진다.",['A86']),
task('TR-T3','numbers',"최대 생산량으로 기회비용 구하기","양국의 총노동량은 같고 생산 가능 곡선은 직선이다. 최대 생산량은 A국이 X재 24개 또는 Y재 12개, B국이 X재 8개 또는 Y재 8개이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",{labels:["A국의 X재 1개 기회비용(Y재 개)","B국의 X재 1개 기회비용(Y재 개)"]},[0.5,1],"A국은 X재 24개 생산으로 Y재 12개를 포기하므로 X재 1개의 기회비용은 Y재 1/2개이다. B국에서는 Y재 8÷8=1개이다.","포기하는 Y재의 최대량을 X재의 최대량으로 나누세요."),
task('TR-T4','numbers',"노동시간으로 기회비용 구하기","재화 1개당 노동시간은 A국이 X재 3시간, Y재 6시간이고 B국은 X재 6시간, Y재 4시간이다. 각국의 X재 1개 생산의 기회비용을 Y재 수량으로 구하시오.",{table:[['나라','X1 노동시간','Y1 노동시간'],['A',3,6],['B',6,4]],labels:["A국의 X재 1개 기회비용(Y재 개)","B국의 X재 1개 기회비용(Y재 개)"]},[0.5,1.5],"A국에서 X재에 쓰는 3시간으로는 Y재 3/6=1/2개를 만들 수 있다. B국에서 X재에 쓰는 6시간으로는 Y재 6/4=3/2개를 만들 수 있다.","X재 1개에 쓰는 시간으로 생산할 수 있었던 Y재를 구합니다."),
lesson('trade','TR-L3',"양국에 유리한 교환 비율","직접 생산할 때와 교환할 때를 비교하여 양국의 이익을 계산해 보자.",[
["X재 1개당 교환하는 Y재","A국의 최대 생산량은 X재 24개 또는 Y재 12개이고 B국은 X재 8개 또는 Y재 8개이다. A국은 X재만, B국은 Y재만 생산한다. X재 q개와 Y재 y개를 교환한다면 X재 1개당 교환하는 Y재는 y/q개이다."],
["양국이 이익을 얻는 조건","A국은 X재 q개 생산으로 Y재 q/2개를 포기하므로 그보다 많은 Y재를 받아야 이익이다. B국은 X재 q개를 직접 생산하려면 Y재 q개를 포기해야 하므로 그보다 적게 지급해야 이익이다. 따라서 양국 모두 이익을 얻는 범위는 1/2<y/q<1이다."],
["실제로 교환할 수 있는 수량","A국이 생산한 X재는 24개, B국이 생산한 Y재는 8개이다. 다른 나라와의 거래나 재고가 없다면 각국은 이 수량보다 많이 수출할 수 없다. 교환 비율이 유리하더라도 실제 보유량이 부족하면 교환을 실행할 수 없다."]],
{p:"A국은 X재 24개, B국은 Y재 8개만 생산하였다. A국이 X재 6개를 주고 Y재 4개를 받는다. 생산 가능 곡선은 직선이며 두 나라만 거래한다. 재고와 거래 비용은 없다. 각국의 이익과 최종 보유량을 구해 보자.",steps:["교환 비율은 X재 1개당 Y재 4/6=2/3개로, 양국의 기회비용 1/2과 1 사이에 있다.","A국은 X재 6개를 생산하며 Y재 3개를 포기하지만 교환으로 4개를 받는다. 이익은 Y재 1개이다.","B국은 X재 6개를 직접 만들려면 Y재 6개를 포기해야 하지만 4개만 지급한다. Y재 2개를 절약한다.","교역 후 A국은 X재 18개와 Y재 4개, B국은 X재 6개와 Y재 4개를 보유한다."],result:"A국은 Y재 1개, B국은 Y재 2개의 이익을 얻는다. 두 나라의 이익이 같지 않아도 양국 모두에게 유리한 교환이다."},
{rule:"수출국은 생산에 따른 기회비용보다 많이 받아야 하고, 수입국은 직접 생산할 때의 기회비용보다 적게 지급해야 이익이다.",limit:"두 나라·두 재화, 직선인 생산 가능 곡선, 정해진 특화 방향, 거래 비용이 없는 조건을 적용한다."},
"국가 전체가 재화를 더 많이 소비할 수 있게 되더라도 그 이익이 모든 개인에게 똑같이 돌아가는 것은 아니다. 개인별 이익을 알려면 국내의 생산과 소비, 소득 분배에 관한 자료를 더 살펴야 한다.",['A86']),
task('TR-T5','trade',"양국이 이익을 얻는 교환","A국의 최대 생산량은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 8개이다. A국은 X재 24개만, B국은 Y재 8개만 생산하였다. X재 6개와 교환할 Y재 수량을 정하여 양국 모두 양의 이익을 얻도록 하시오. 각국의 이익을 Y재 수량으로 구하시오.",{ax:24,ay:12,bx:8,by:8,q:6,min:0,max:8,step:0.5},null,"A국은 X재 6개 생산으로 Y재 3개를 포기하므로 3개보다 많이 받아야 한다. B국은 X재 6개를 직접 만들려면 Y재 6개를 포기해야 하므로 6개보다 적게 지급해야 한다. 따라서 교환할 Y재 수량은 3개 초과 6개 미만이다.","A국의 이익은 받은 Y재에서 3을 뺀 값, B국의 이익은 6에서 지급한 Y재를 뺀 값입니다."),
task('TR-T6','numbers',"정해진 교환 후의 보유량","이번에는 X재 6개와 Y재 4개를 교환한다. 교역 전 A국은 X재 24개만, B국은 Y재 8개만 생산하였다. 각국의 교역 후 보유량을 구하시오.",{labels:["A국의 최종 X재 수량","A국의 최종 Y재 수량","B국의 최종 X재 수량","B국의 최종 Y재 수량"]},[18,4,6,4],"A국은 X재 24−6=18개와 Y재 4개를 보유한다. B국은 X재 6개와 Y재 8−4=4개를 보유한다. 같은 재화의 양국 보유량을 합하면 생산 총량과 같다.","앞 문제에서 제안한 수량이 아니라 이번에 지정한 X재 6개, Y재 4개를 적용하세요."),
lesson('trade','TR-L4',"교환 비율의 범위와 소비량","교역 이익이 0이 되는 경우를 알아보고, 소비량으로 생산량과 교환량을 구해 보자.",[
["한 나라의 이익이 0인 경우","X재 1개 생산의 기회비용이 A국은 Y재 1/2개, B국은 Y재 1개라고 하자. X재 1개와 Y재 1/2개를 교환하면 A국은 직접 생산할 때와 차이가 없다. Y재 1개와 교환하면 B국의 이익이 0이다. 양국 모두 양의 이익을 얻어야 한다면 두 경계값을 제외해야 한다."],
["소비량으로 생산량 구하기","양국이 서로 다른 재화만 생산하고 재고나 손실, 다른 거래가 없다면 각 재화의 소비량 합계는 생산 총량과 같다. 생산하지 않은 재화를 소비한 양은 상대국에서 수입한 양이다. 이를 이용하여 특화 생산량과 교환량을 구할 수 있다."],
["생산의 기회비용이 같은 경우","A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 4개라고 하자. X재 1개 생산의 기회비용이 양국 모두 Y재 1/2개로 같다. 이 경우에는 A국이 1/2개보다 많이 받으면서 동시에 B국이 1/2개보다 적게 지급할 수 없으므로 양국 모두 이익인 교환 비율이 없다."]],
{p:"교역 후 A국은 X재 18개와 Y재 4개, B국은 X재 6개와 Y재 4개를 소비한다. A국은 X재만, B국은 Y재만 생산하였다. 다른 나라와의 거래, 재고, 손실은 없다. 생산량과 교환량을 구해 보자.",steps:["X재 소비량 합계는 18+6=24개이고, Y재 소비량 합계는 4+4=8개이다. 각각 A국과 B국의 생산량이다.","A국이 가진 Y재 4개는 B국에서 수입한 것이다. B국이 가진 X재 6개는 A국에서 수입한 것이다.","따라서 X재 6개와 Y재 4개를 교환하였다. 교환 비율은 X재 1개당 Y재 2/3개이다."],result:"A국은 X재 24개, B국은 Y재 8개를 생산하고, 그중 X재 6개와 Y재 4개를 교환하였다."},
{rule:"같은 재화의 소비량을 더하면 생산 총량이다. 각국이 생산하지 않은 재화의 소비량은 수입량이다.",limit:"완전 특화, 양국 사이의 거래만 존재, 재고와 손실이 없다는 조건이 필요하다."},
"‘양의 이익’은 이익이 0보다 커야 한다는 뜻이다. ‘손해를 보지 않는다’는 조건에는 이익이 0인 경우도 포함된다. 교환 비율의 범위를 구할 때에는 문제에서 두 조건 중 어느 것을 요구하는지 구별해야 한다.",['A86']),

function choiceScene(selected=1,sacrifice=2,rows=DAY){const calc=costRows(rows);return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="선택한 대안과 포기한 대안을 나란히 보여 주는 장부"><rect x="22" y="31" width="586" height="246" rx="19" fill="#1c4750"/><path d="M56 92H580M56 216H580" stroke="#4e6c67" stroke-dasharray="4 6"/>${calc.map((d,i)=>{const x=60+i*184;return `<g opacity="${i===selected?1:.58}"><rect x="${x}" y="65" width="156" height="176" rx="13" fill="${i===selected?'#f5df9c':'#98bfae'}"/><text x="${x+18}" y="97" fill="#133d40" font-size="15" font-weight="700">${['A','B','C'][i]} · ${i===selected?'선택한 활동':'포기한 활동'}</text><text x="${x+18}" y="140" fill="#173b3d" font-size="12">편익 ${f(d.benefit)} − 비용 ${f(d.cost)}</text><text x="${x+18}" y="184" fill="#173b3d" font-size="35" font-weight="800">${f(d.g)}</text><text x="${x+18}" y="217" fill="#173b3d" font-size="12">${i===sacrifice?"포기한 대안 중 가장 큰 가치":'편익 − 명시적 비용'}</text></g>`;}).join('')}<text x="315" y="299" text-anchor="middle" fill="#d4e8d7" font-size="13">편익−명시적 비용은 순편익이 아닙니다.</text></svg>`;}
function publicScene(others=[6,6,6],paid=0,reveal=false){const out=publicCalc(others,paid),lit=reveal&&out.lit;let houses='';for(let i=0;i<4;i++){const x=54+i*143;houses+=`<g><path d="M${x-16} 173L${x+39} 134 ${x+94} 173Z" fill="${i===3?'#af9970':'#628d84'}"/><rect x="${x-4}" y="173" width="86" height="75" rx="4" fill="${i===3?'#8e8066':'#39676c'}"/><rect x="${x+10}" y="187" width="20" height="24" fill="${lit?'#f3d488':'#82a5a0'}"/><rect x="${x+49}" y="187" width="20" height="24" fill="${lit?'#f3d488':'#82a5a0'}"/><text x="${x+39}" y="272" text-anchor="middle" fill="#e8f2da" font-size="13">${i===3?'나':'주민 '+['A','B','C'][i]} · ${i===3?paid:others[i]}토큰</text></g>`;}return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="${lit?'모든 주민에게 빛이 닿는':'설치 여부를 확인하기 전의'} 가로등 골목"><rect width="630" height="310" rx="15" fill="#12333f"/><circle cx="544" cy="43" r="17" fill="#d8e8c6"/><g fill="#bcdccc" opacity=".65"><circle cx="51" cy="30" r="1.7"/><circle cx="140" cy="47" r="1.4"/><circle cx="421" cy="29" r="1.7"/></g><path d="M0 244H630V310H0Z" fill="#28505b"/>${houses}${lit?'<path class="lantern-glow" d="M309 75L17 279H608L326 75Z" fill="#f5ce75" opacity=".16"/>':''}<path d="M315 82V245M298 248h34" stroke="#b4c6b2" stroke-width="7" stroke-linecap="round"/><path d="M291 65h48l-5 18h-38Z" fill="${lit?'#f9d884':'#758f88'}"/><circle cx="315" cy="75" r="29" fill="#f7d782" opacity="${lit ? 0.22 : 0}"/><text x="315" y="26" text-anchor="middle" fill="#e8e8c9" font-size="14">${reveal?(lit?'설치됨 · 납부 여부와 관계없이 편익':'설치 실패 · 납부액 반환'):'조건을 고르고 결과를 먼저 예상하세요'}</text></svg>`;}
function tradeScene(y=4,reveal=false){const d={ax:24,ay:12,bx:8,by:8,q:6},t=tradeCalc(d,y);const crates=(x,color,count)=>Array.from({length:Math.min(8,count)},(_,i)=>`<rect x="${x+(i%4)*22}" y="${186-Math.floor(i/4)*24}" width="19" height="19" rx="3" fill="${color}"/>`).join('');return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="A국의 X재와 B국의 Y재를 교환하는 두 항구"><rect width="630" height="310" rx="16" fill="#143741"/><path d="M0 188H630V310H0Z" fill="#265966"/><path d="M19 223h170l-19 24H5ZM454 223h166l9 24H470Z" fill="#c9b890"/><path d="M42 154l64 -37 64 37v69H42Z" fill="#94b6a4"/><path d="M464 154l62 -37 62 37v69H464Z" fill="#a7b4c7"/>${crates(60,'#e7bf6a',8)}${crates(482,'#a3cbb8',8)}<g fill="#e6f5df" font-size="17" font-weight="750"><text x="106" y="50" text-anchor="middle">A국 · X 특화</text><text x="526" y="50" text-anchor="middle">B국 · Y 특화</text></g><g fill="#bcd9c9" font-size="13"><text x="106" y="76" text-anchor="middle">${reveal?'소비 X18 · Y'+f(y):'생산 X24 · Y0'}</text><text x="526" y="76" text-anchor="middle">${reveal?'소비 X6 · Y'+f(8-y):'생산 X0 · Y8'}</text></g><path d="M198 122H424l-12 -8m12 8l-12 8M425 161H202l12 -8m-12 8l12 8" fill="none" stroke="#e4cd8d" stroke-width="2.5"/><text x="315" y="111" fill="#f1d785" font-size="15" text-anchor="middle">X재 6개 →</text><text x="315" y="186" fill="#c9e7cf" font-size="15" text-anchor="middle">← Y재 ${f(y)}개</text><g class="${reveal?'boat-motion':''}" transform="translate(320 256)"><path d="M-61 -8H59L39 19H-41Z" fill="#e3b867"/><rect x="-30" y="-26" width="23" height="18" rx="3" fill="#9ec9b0"/><rect x="-3" y="-26" width="25" height="18" rx="3" fill="#ded6b4"/><path d="M30 -28v20" stroke="#cfddd2" stroke-width="3"/></g><text x="315" y="300" fill="#cbe3d3" font-size="12" text-anchor="middle">${reveal?'계약 후 총량 X24 · Y8 보존':'양국의 생산 기회비용을 먼저 비교하세요'}</text></svg>`;}
function ppfPicture(d,x,pred,reveal=false){const v=Number.isFinite(x)?Math.max(0,Math.min(d.xmax,x)):0,real=ppfMax(d.xmax,d.ymax,v),px=62+v/d.xmax*460,py=245-real/d.ymax*180;return `<svg class="scene-svg" viewBox="0 0 620 310" role="img" aria-label="X 최대 ${d.xmax}, Y 최대 ${d.ymax}의 직선 생산 가능 곡선"><rect width="620" height="310" rx="15" fill="#143742"/><path d="M62 40V245H553" stroke="#aacbbb" stroke-width="2" fill="none"/><path d="M62 65L522 245H62Z" fill="#245a5e"/><path d="M62 65L522 245" stroke="#8ad7b5" stroke-width="3"/><path d="M${px} 45V245" stroke="#e6bf71" stroke-dasharray="5 6"/><g fill="#d8ebce" font-size="14"><text x="38" y="30">Y재</text><text x="555" y="259">X재</text><text x="30" y="69">${d.ymax}</text><text x="507" y="269">${d.xmax}</text><text x="44" y="267">0</text><text x="${px}" y="286" text-anchor="middle">X ${f(v)}</text></g>${Number.isFinite(pred)&&pred>=0&&pred<=d.ymax?`<circle cx="${px}" cy="${245-pred/d.ymax*180}" r="7" fill="#edc66e"/>`:''}${reveal?`<circle cx="${px}" cy="${py}" r="5" fill="#a4edc9"/><text x="${Math.min(px+10,460)}" y="${py-12}" fill="#e5f7d9" font-size="15">Y ${f(real)}</text>`:''}<text x="300" y="27" fill="#c7e3d2" font-size="13" text-anchor="middle">금색 점: 내 예상 / 민트색 점: 계산 결과</text></svg>`;}
function picture(c,s=null,response=null,reveal=false){if(s&&!['ghost','threshold','countermodel','donation','allocation','ppf','trade'].includes(s.type))return cityMap();if(c==='public'){if(s?.type==='allocation'){const p=response?.counts||[0,0,0,0];return publicScene(p.slice(0,3),p[3],reveal);}return publicScene(s?.data?.others||[6,6,6],response?.donation??0,reveal);}if(c==='trade'){if(s?.type==='ppf')return ppfPicture(s.data,num(response?.value),num(response?.nums?.[0]),reveal);return tradeScene(s?.type==='trade'?num(response?.value)||0:4,reveal);}let rows=DAY;if(s?.type==='threshold')rows=[DAY[0],[DAY[1][0],36,Number.isFinite(num(response?.value))?num(response.value):10],DAY[2]];if(s?.type==='countermodel')rows=[DAY[0],DAY[1],[DAY[2][0],Number.isFinite(num(response?.value))?num(response.value):32,7]];if(s?.type==='threshold'||s?.type==='countermodel'){const cr=costRows(rows),bi=cr.findIndex(v=>v.g===Math.max(...cr.map(w=>w.g))),second=Math.max(...cr.filter((_,i)=>i!==bi).map(v=>v.g)),si=cr.findIndex((v,i)=>i!==bi&&v.g===second);return choiceScene(bi,si,rows);}return choiceScene(Number.isInteger(response?.chosen)?response.chosen:s?.type==='ghost'?-1:1,Number.isInteger(response?.sacrifice)?response.sacrifice:s?.type==='ghost'?-1:2,rows);}

function frame(){applySettings();const xp=totalXP();$('xp').innerHTML=`Lv.${Math.floor(xp/100)+1} · ${xp} XP<div class="bar"><i style="width:${xp%100}%"></i></div>`;const items=[['home','◈','사건 지도'],['library','▤','강의실'],['lab','⌁','실험실'],['review','↻','재의뢰'],['studio','✎',"설명 노트"]];$('nav').innerHTML=items.map(([v,g,t])=>`<button data-action="nav" data-view="${v}" ${route.view===v?'aria-current="page"':''}><b aria-hidden="true">${g}</b>${t}</button>`).join('');if(!storeOK)showWarning('브라우저 저장이 제한되어 기록을 임시로 보관합니다. 종료 전에 JSON 백업을 저장하세요.');}
function homeHTML(){const n=STAGES.filter(s=>s.kind==='task'&&s.type!=='write'&&solved(s.id)).length,read=LESSONS.filter(l=>state.read[l.id]).length;return `<section class="hero"><div class="hero-grid"><div><div class="eyebrow">ECONOMY ARCHITECT / FIRST PLAYABLE</div><h1>숫자는 맞는데,<br>결론은 왜 틀렸을까?</h1><p>선택하지 않은 하루, 불 꺼진 골목, 두 나라의 계약.<br>개념을 배우고 조건을 움직여, 도시의 두 번째 장부를 찾아보세요.</p><span class="tag">3개의 완결 사건</span><span class="tag">강의 12개</span><span class="tag">적용·제작 24개</span><div class="actions"><button class="gold" data-action="stage" data-id="${state.last||'CH-L1'}">${state.last?'이어서 조사하기':'첫 이야기 시작'}</button><button data-action="nav" data-view="library">개념부터 읽기</button></div></div><div class="visual"><div class="map-block">${cityMap()}<div class="map-buttons">${CASES.map(c=>`<button data-action="case" data-id="${c.id}">${c.n} · ${esc(c.district)}</button>`).join('')}</div></div></div></div></section><div class="statgrid"><div class="stat"><b>${n}/21</b><span>계산·개념 미션 해결</span></div><div class="stat"><b>${read}/12</b><span>강의 읽음 기록</span></div><div class="stat"><b>${CASES.filter(complete).length}/3</b><span>사건의 모든 활동 기록</span></div><div class="stat"><b>90분</b><span>세 사건의 설계 목표·실측 전</span></div></div><div class="row between section"><h2>오늘의 조사 구역</h2><span class="tiny muted">순서대로 학습 권장 · 모든 사건을 열 수 있습니다</span></div><div class="grid">${CASES.map(c=>`<article class="card casecard"><div class="caseart">${picture(c.id)}</div><div class="casecopy"><div class="row between"><span class="num">종합 ${c.n} · ${esc(c.district)}</span><span class="tag">${c.stageIds.filter(done).length}/12</span></div><h2>${esc(c.title)}</h2><p>${esc(c.hook)}</p><div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="progressdots">${c.stageIds.map(id=>`<i class="${done(id)?'done':''}"></i>`).join('')}</div><button class="primary" data-action="case" data-id="${c.id}">사건 열기</button></div></article>`).join('')}</div><section class="grid section">${CASES.map(c=>`<article class="badgecard"><div class="seal">${complete(c)?'◈':'◇'}</div><span class="tag">${complete(c)?'획득':'수집 목표'}</span><h3>${esc(c.badge)}</h3><p class="tiny muted">해당 사건의 12단계 기록을 마치면 획득합니다. 경제 지식의 완전한 숙달을 인증하는 지표는 아닙니다.</p></article>`).join('')}</section><section class="card section"><h2>이 파일에서 달라진 것</h2><p>선택하지 않은 대안이 장부 옆에 남고, 납부 조건에 따라 가로등이 켜지며, 교역 계약에 따라 두 항구의 재화가 이동합니다. 처음 배우는 사람을 위한 강의와 단계별 예제를 먼저 읽을 수 있습니다.</p><p class="notice">4.0의 첫 세 사건 실행판입니다. 경제 전 범위 30시간판 전체가 4.0 화면으로 전환된 것은 아닙니다. 기존 3.1의 15챕터·48강의·210미션은 별도 파일에 보존했습니다. 이 파일은 3.1 저장 데이터를 수정하지 않습니다.</p><a class="btn small" href="https://drive.google.com/file/d/1rG3rA33XvRvMi3cABhcdsfo_K1imKEBz/view" target="_blank" rel="noopener noreferrer">기존 3.1 파일 위치 · 온라인</a></section>`;}
function caseHTML(id){const c=CASES.find(c=>c.id===id)||CASES[0];return `<div class="narrow"><button class="small" data-action="home">← 사건 지도</button><article class="card section"><span class="eyebrow">종합 ${c.n} / ${esc(c.district)}</span><h1>${esc(c.title)}</h1><div class="play-scene">${picture(c.id)}</div>${speaker(c,c.hook)}<p class="smalltext muted">강의 4개 → 적용·계산 7개 → 설명 초안 1개. 읽음, 도움받은 해결, 독립 해결, 스스로 점검하기을 구분해 기록합니다.</p><div class="actions"><button class="primary" data-action="stage" data-id="${c.stageIds.find(id=>!done(id))||c.stageIds[0]}">${complete(c)?'처음부터 다시 보기':'이어서 시작'}</button><button data-action="lab" data-id="${c.id}">자유 실험</button></div></article><section class="section stack">${c.stageIds.map((id,i)=>{const s=BYID[id];return `<button class="bookcard card" data-action="stage" data-id="${id}"><div class="row between"><span class="tag">${String(i+1).padStart(2,'0')} · ${s.kind==='lesson'?'개념 강의':s.type==='write'?'자기 설명':'게임 미션'}</span><span class="tiny">${done(id)?s.kind==='lesson'?'읽음':s.type==='write'?'초안 기록':state.records[id]?.solved?.assisted?'도움받아 해결':'독립 해결':'미완료'}</span></div><h3>${esc(s.title)}</h3></button>`;}).join('')}</section>${refsHTML(c.sources)}</div>`;}
function lessonHTML(l,standalone=false){const c=CASES.find(c=>c.id===l.c),idx=BYID[l.id].index;return `<article class="card"><span class="tag">텍스트 강의 · ${esc(l.id)}</span><h1>${esc(l.title)}</h1><p class="smalltext muted">${esc(l.lead)}</p>${speaker(c,l.lead)}<div class="tabs"><button data-action="depth" data-depth="basic" class="${lessonDepth==='basic'?'selected':''}">개념 이해</button><button data-action="depth" data-depth="worked" class="${lessonDepth==='worked'?'selected':''}">함께 푸는 예제</button><button data-action="depth" data-depth="teacher" class="${lessonDepth==='teacher'?'selected':''}">핵심 정리 심화</button></div>${lessonDepth==='basic'?`<div class="lessonbody">${l.sections.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}<button class="primary wide" data-action="depth" data-depth="worked">이해한 내용을 예제로 확인하기</button></div>`:lessonDepth==='worked'?`<section class="example"><span class="tag gold">자료의 개념으로 구성한 풀이 예제</span><p>${esc(l.example.p)}</p>${l.example.table?textTable(l.example.table[0],l.example.table.slice(1)):''}<ol>${l.example.steps.slice(0,lessonSteps).map(v=>`<li class="pulse">${esc(v)}</li>`).join('')}</ol>${lessonSteps<l.example.steps.length?`<div class="actions"><button class="primary" data-action="example-next">다음 풀이 보기 ${lessonSteps+1}/${l.example.steps.length}</button><button data-action="example-all">전체 풀이</button></div>`:`<div class="equation">${esc(l.example.result)}</div><button class="primary" data-action="depth" data-depth="teacher">풀이 요령의 적용 조건 확인</button>`}</section>`:`<div class="lessonbody"><h3>풀이 요령</h3><div class="tip">${esc(l.tip.rule)}<small><b>유의 사항</b><br>${esc(l.tip.limit)}</small></div><h3>더 깊이 이해하기</h3><p>${esc(l.advanced)}</p><div class="notice">풀이 요령을 활용할 때에도 문제의 조건을 확인하세요. 기본 풀이와 같은 가정에서 사용할 수 있는 방법입니다.</div></div>`}<div class="actions"><button class="primary" data-action="lesson-done" data-id="${l.id}">${standalone?'읽음으로 표시':'읽음 기록하고 다음 활동'}</button><button data-action="stage" data-id="${c.stageIds[Math.min(idx+1,c.stageIds.length-1)]}">읽음 표시 없이 활동으로</button></div><p class="tiny muted">읽음 표시는 강의를 어디까지 읽었는지 기록하는 기능입니다.</p>${refsHTML(l.refs)}</article>`;}
function stageBar(s){const c=CASES.find(c=>c.id===s.c);return `<div class="stephead"><button class="small" data-action="case" data-id="${c.id}">← ${esc(c.title)}</button><span class="tiny muted">${s.index+1}/12 · ${s.kind==='lesson'?'설명 먼저':'적용과 발견'}</span></div><div class="steps" aria-label="사건의 단계">${c.stageIds.map((id,i)=>`<button data-action="stage" data-id="${id}" class="${id===s.id?'on':done(id)?'done':''}" aria-label="${i+1}단계 ${esc(BYID[id].title)}">${i+1}</button>`).join('')}</div>`;}
function opt(options,value,key='choice',multi=false){return options.map((o,i)=>`<button class="option ${multi?value.includes(i)?'selected':'':value===i?'selected':''}" data-action="option" data-key="${key}" data-index="${i}" aria-pressed="${multi?value.includes(i):value===i}"><span class="letter">${multi?'□':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('');}
function numInputs(labels){return labels.map((l,i)=>`<div class="field"><label for="n${i}">${esc(l)}</label><input id="n${i}" type="text" inputmode="text" autocomplete="off" maxlength="60" placeholder="예: 0.5 또는 1/2" data-field="number" data-index="${i}" value="${esc(r.nums[i]||'')}"></div>`).join('')+`<p class="tiny muted">단위는 질문에 표시되어 있습니다. 숫자 칸에는 0.5, 1/2, -3처럼 입력하세요.</p>`;}
function rangeControl(d,label){const v=Number.isFinite(r.value)?r.value:(d.min||0);return `<div class="rangebox"><div class="rangetop"><b>${esc(label||d.label||'조건 조절')}</b><input aria-label="${esc(label||d.label||'설정값')} 숫자 입력" type="number" min="${d.min||0}" max="${d.max}" step="${d.step||1}" data-field="value" value="${v}"></div><input aria-label="${esc(label||d.label||'설정값')} 슬라이더" type="range" min="${d.min||0}" max="${d.max}" step="${d.step||1}" data-field="value" value="${v}"></div>`;}
function taskControls(s){const d=s.data;switch(s.type){case'choice':return opt(d.options,r.choice);case'multi':return `<p class="tiny muted">옳은 항목을 모두 선택하세요.</p>`+opt(d.options,r.selected,'selected',true);case'map':return d.rows.map((v,i)=>`<div class="field"><label for="m${i}">${esc(v)}</label><select id="m${i}" data-field="map" data-index="${i}"><option value="">개념 선택</option>${d.options.map((o,j)=>`<option value="${j}" ${r.map[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('');case'ghost':return `<div class="rule"><b>창작 조건</b>세 활동 중 정확히 하나만 한다. 다른 대안·매몰 비용은 없다. 편익과 비용의 단위는 만 원이다.</div><h3>1. 가장 유리한 활동을 고른다</h3><div class="cardchoices">${d.rows.map((row,i)=>`<button class="activity ${r.chosen===i?'chosen':r.chosen!==null?'faded':''}" data-action="option" data-key="chosen" data-index="${i}"><span class="sig">${['▧','◈','♫'][i]}</span><b>${esc(row[0])}</b><small>편익 ${row[1]}</small><small>명시적 비용 ${row[2]}</small></button>`).join('')}</div><h3>2. 포기한 최선의 대안은?</h3><div class="cardchoices">${d.rows.map((row,i)=>`<button class="${r.sacrifice===i?'selected':''}" data-action="option" data-key="sacrifice" data-index="${i}">${['A','B','C'][i]}</button>`).join('')}</div><p class="ghostlabel">선택하지 않은 활동도 사라지지 않습니다. 그중 가장 큰 편익−명시적 비용이 비용에 연결됩니다.</p>`;case'numbers':return (d.table?textTable(d.table[0],d.table.slice(1)):'')+numInputs(d.labels);case'threshold':case'countermodel':return textTable(['대안','편익','명시적 비용'],DAY)+rangeControl(d)+`<div id="live-note" class="tiny muted"></div>`;case'donation':return textTable(['다른 주민 A','다른 주민 B','다른 주민 C'],[d.others])+`<div class="rule"><b>창작 4명 규칙</b>각 초기 토큰 10, 설치비 24, 설치 편익 각 10. 실패 시 납부액 반환. 타인의 납부액은 위 값으로 고정.</div><h3>내가 낼 토큰</h3><div class="row">${d.choices.map(n=>`<button class="${r.donation===n?'selected':''}" data-action="option" data-key="donation" data-index="${n}">${n}토큰</button>`).join('')}</div>`+numInputs(['내 최종 결과 예상']);case'allocation':return `<div class="rule"><b>모두 충족할 제약</b>정확히 합계 24 · 개인별 최대 6. 다음 조절기는 검토를 위해 0~10까지 움직일 수 있습니다.</div>`+d.names.map((v,i)=>`<div class="rangebox"><div class="rangetop"><b>${v}</b><span class="counter"><button class="small" data-action="count" data-index="${i}" data-delta="-1" aria-label="${v} 납부 감소">−</button><strong data-count-label="${i}">${r.counts[i]}</strong><button class="small" data-action="count" data-index="${i}" data-delta="1" aria-label="${v} 납부 증가">＋</button></span></div><input type="range" min="0" max="10" step="1" aria-label="${v} 납부액" data-field="count" data-index="${i}" value="${r.counts[i]}"></div>`).join('')+`<p id="live-note" class="rule">납부 합계: ${r.counts.reduce((a,b)=>a+b,0)}</p>`;case'ppf':return `<div class="rule"><b>생산 조건</b>X 최대 24 또는 Y 최대 12. 직선 모형, 자원·기술 고정. X를 18개로 맞춥니다.</div>`+rangeControl({min:0,max:d.xmax,step:1},'A국의 X재 생산량')+numInputs(['그때 최대 Y재 수량']);case'trade':return textTable(['나라','최대 X',"함께 생산할 수 있는 Y재"],[['A',d.ax,d.ay],['B',d.bx,d.by]])+`<div class="rule"><b>모형과 목표</b>같은 총노동량·직선 모형·거래 비용 없음. A는 X, B는 Y에 완전 특화. X6과 교환할 Y를 제안하고 양국의 추가 이익을 예측합니다.</div>`+rangeControl(d,'X6과 교환할 Y 수량')+numInputs(['A의 추가 이익(Y개)','B의 추가 이익(Y개)']);case'write':return `<p class="notice">초안 작성과 자기 점검만 기록합니다. 글자 수나 핵심어만으로 경제 설명의 정확성을 자동 인증하지 않습니다.</p><label for="draftText"><b>내 설명 초안</b></label><textarea id="draftText" data-field="text" maxlength="24000" placeholder="${esc(d.starter)}">${esc(r.text)}</textarea><h3>스스로 점검하기</h3>${d.checks.map((v,i)=>`<label class="check"><input type="checkbox" data-field="check" data-index="${i}" ${r.checks[i]?'checked':''}><span>${esc(v)}</span></label>`).join('')}`;default:return '<p>지원하지 않는 형식입니다.</p>';}}
function solutionHTML(s,res=r){const d=s.data;switch(s.type){case'choice':return `<p><b>판단:</b> ${esc(d.options[s.answer])}</p>`;case'multi':return s.answer.map(i=>`<p>✓ ${esc(d.options[i])}</p>`).join('');case'map':return textTable(['자료','연결'],d.rows.map((x,i)=>[x,d.options[s.answer[i]]]));case'numbers':return textTable(['항목','값'],d.labels.map((v,i)=>[v,f(s.answer[i])]));case'ghost':return textTable(['대안',"편익−명시적 비용",'암묵적 비용','기회비용','순편익'],costRows(d.rows).map(x=>[x.name,x.g,x.implicit,x.oc,x.surplus]));case'threshold':return textTable(['B 비용',"B 편익−명시적 비용",'판단'],[[10,26,'B 유일'],[11,25,'B·C 동률'],[12,24,'C 유일']]);case'countermodel':return "<p>C 편익 32.5 → C 편익−명시적 비용 25.5. B 편익−명시적 비용 26은 여전히 최대이며 순편익은 0.5이다.</p>";case'donation':return textTable(['내 납부',"원리금 합계",'설치',"남은 토큰과 편익의 합"],d.choices.map(n=>{const z=publicCalc(d.others,n);return[n,z.total,z.lit?'성공':'실패·반환',z.value];}));case'allocation':return "<p>6+6+6+6=24. 개인별 상한 6과 합계 24를 모두 충족한다.</p>";case'ppf':return '<p>최대 Y=12×(1−18/24)=3개.</p>';case'trade':{const y=num(res?.value),z=tradeCalc(d,Number.isFinite(y)?y:4);return textTable(['항목','현재 제안 또는 예시'],[['X1당 받는Y',f(z.ratio)],['A의 X1 생산 기회비용(Y)',f(z.ca)],['B의 X1 생산 기회비용(Y)',f(z.cb)],['A의 추가 이익(Y)',f(z.gainA)],['B의 추가 이익(Y)',f(z.gainB)]])+`<p>수량 조건을 지키면서 3&lt;Y&lt;6이어야 한다. 예: Y4이면 A 이익 1, B 이익 2.</p>`;}case'write':return '<p>설명 초안은 다시 열어 수정할 수 있습니다. 원고의 근거 확인과 출간 교열은 별도입니다.</p>';default:return '';}}
function confidenceHTML(){return `<div class="confidence"><small>답을 확인하기 전에 확신도를 표시하세요.</small>${[['sure','확실함'],['unsure','애매함'],['guess','추측함']].map(([v,t])=>`<button class="${r.confidence===v?'selected':''}" data-action="confidence" data-value="${v}">${t}</button>`).join('')}</div>`;}
function stageHTML(id){const s=BYID[id],c=CASES.find(c=>c.id===s.c);if(s.kind==='lesson')return `<div class="narrow">${stageBar(s)}<div class="section">${lessonHTML(LBYID[id])}</div></div>`;const speaking=feedback?feedback.ok?'좋아. 이제 같은 원리를 다른 조건에도 적용해 보자.':"놓친 조건이나 계산이 있는지 함께 확인해 보자.":s.type==='write'?'내가 이해한 것을 다른 사람에게 설명할 차례야.':s.prompt;return `<div class="narrow">${stageBar(s)}<article class="card section"><span class="tag">활동 ${s.index+1} / 12 · ${esc(s.id)}</span><h1>${esc(s.title)}</h1>${speaker(c,speaking,feedback?.ok?'happy':r.help?'think':'neutral')}<div id="scene" class="play-scene">${picture(c.id,s,r,!!feedback)}</div><p class="section">${esc(s.prompt)}</p>${taskControls(s)}${s.type!=='write'?confidenceHTML():''}<div class="actions"><button class="primary" data-action="submit">${s.type==='write'?"초안·자기 점검 저장":"채점하기"}</button>${s.type!=='write'?'<button data-action="hint">힌트·풀이 도움</button>':''}<button data-action="related">관련 강의</button></div>${r.help?`<div class="tip"><b>먼저 볼 힌트</b><p>${esc(s.hint)}</p><details><summary>이 문제의 전체 풀이</summary><p>${esc(s.why)}</p>${solutionHTML(s)}</details><small>도움을 본 뒤에도 다시 풀 수 있습니다. 첫 응답과 도움 사용 여부는 학습 기록에 남습니다.</small></div>`:''}<div id="feedback" aria-live="polite">${feedback?`<section class="feedback ${feedback.ok?'':'wrong'}"><span class="earned">${s.type==='write'?'학습용 초안 기록':feedback.ok?feedback.newXP?'+20 XP':'해결 기록 갱신':"다시 풀기"}</span><h3>${s.type==='write'?"작성한 글을 저장했습니다.":feedback.ok?"정답입니다.":"오답입니다. 조건과 계산을 다시 확인해 보세요."}</h3><p class="reason">${esc(s.why)}</p>${solutionHTML(s)}<p class="tiny muted">${s.type==='write'?'서술 내용은 자동 채점하지 않았습니다.':r.assisted?'도움받아 풀기 기록':"도움 없이 푼 기록"}</p><div class="actions"><button class="primary" data-action="next">다음 장면</button><button data-action="retry">다시 풀기</button><button data-action="to-notes">이 풀이를 메모에 저장</button></div></section>`:''}</div>${refsHTML(s.refs)}</article></div>`;}
// END PART 4A.


// PART 4B: 강의 도감·복습·제작실·자유 실험·설정.
function libraryHTML(){return `<div class="row between"><div><span class="eyebrow">CONCEPT STUDIO</span><h1>원리를 배우는 강의실</h1></div><span class="tag">12강 · 세 사건의 학습 범위</span></div><p class="muted">정의와 쉬운 설명, 한 단계씩 펼치는 풀이, 숏컷의 조건과 집필 관점을 나누어 읽습니다.</p>${CASES.map(c=>`<h2 class="section">${c.n}. ${esc(c.title)}</h2><div class="grid">${LESSONS.filter(l=>l.c===c.id).map(l=>`<button class="card bookcard" data-action="lesson" data-id="${l.id}"><span class="tag">${esc(l.id)} · ${state.read[l.id]?'읽음':'미확인'}</span><h3>${esc(l.title)}</h3><p class="smalltext muted">${esc(l.lead)}</p></button>`).join('')}</div>`).join('')}<div class="actions section"><button data-action="export-lessons">12강 원고 Markdown</button><button data-action="export-content">강의·미션 JSON</button></div>`;}
function reviewHTML(){const ts=STAGES.filter(s=>s.kind==='task'&&s.type!=='write'&&lastAttempt(s)&&(!grade(s,lastAttempt(s))||lastAttempt(s).assisted||lastAttempt(s).confidence!=='sure'));return `<h1>다시 도착한 의뢰</h1><p>최근 응답에서 틀렸거나, 확신하지 못했거나, 풀이 도움을 받은 활동을 모았습니다. 해결 기록은 보존하면서 다시 독립적으로 확인합니다.</p><div class="stack">${ts.length?ts.map(s=>`<button class="bookcard card" data-action="stage" data-id="${s.id}"><span class="tag">${esc(s.id)} · ${!grade(s,lastAttempt(s))?'최근 오답':lastAttempt(s).assisted?'도움받아 해결':'확신도 재확인'}</span><h3>${esc(s.title)}</h3><p class="smalltext muted">${esc(s.hint)}</p></button>`).join(''):'<div class="card empty">재의뢰가 없습니다. 아직 문제를 풀지 않은 경우에도 이 목록은 비어 있습니다.</div>'}</div><section class="card section"><h2>다른 조건은 자유 실험실에서</h2><p>같은 답을 반복해서 눌러 경험치를 쌓지는 않습니다. 먼저 도움 없이 다시 확인하고, 자유 실험에서 조건을 바꾸어 관계가 유지되는지 살펴보세요.</p><button data-action="nav" data-view="lab">실험실로</button></section>`;}
function studioHTML(){return `<span class="eyebrow">나의 설명 노트</span><h1>내 말로 설명하기</h1><p>내가 고른 답과 그것을 바꾼 조건을 설명·문항·강의의 재료로 남깁니다. 메모와 스스로 점검하기을 출간 검토 완료로 표시하지 않습니다.</p><div class="stack">${CASES.map(c=>`<article class="card"><div class="row between"><h2>${c.n}. ${esc(c.title)}</h2><button class="small" data-action="case" data-id="${c.id}">사건 보기</button></div><label for="note-${c.id}"><b>개념 설명과 풀이 메모</b></label><textarea id="note-${c.id}" data-note="${c.id}" maxlength="30000" placeholder="정확한 정의 / 대표 예제 / 학생 오개념 / 반례 / 근거 쪽수 / 추가 검토">${esc(state.notes[c.id]||'')}</textarea><div class="actions"><button data-action="assemble" data-id="${c.id}">편집창에 설명 틀 만들기</button><button data-action="write-stage" data-id="${c.id}">설명 작성 활동</button></div>${state.records[c.stageIds[c.stageIds.length-1]]?.solved?.text?`<details><summary>설명 활동에 저장한 초안</summary><div class="report">${esc(state.records[c.stageIds[c.stageIds.length-1]].solved.text)}</div></details>`:''}</article>`).join('')}</div><article class="card section"><h2>설명 편집창</h2><p class="tiny muted">뼈대를 만들 때 기존 메모는 바꾸지 않습니다. 이 편집창은 임시 편집용이므로 완성한 내용은 따로 저장하세요.</p><textarea id="assembled" placeholder="위의 강의안 뼈대 버튼을 누르세요."></textarea><div class="actions"><button data-action="save-assembled">편집창 TXT 저장</button><button data-action="export-notes">전체 메모·설명 TXT</button><button data-action="backup">전체 기록 JSON 백업</button></div></article><h2 class="section">함께 공부하는 동료</h2><div class="grid">${CAST.map((p,i)=>`<article class="card"><div class="row">${portrait(i,complete(CASES[Math.min(i,2)])?'happy':'neutral')}<div><h3>${esc(p.name)}</h3><span class="tiny muted">${esc(p.role)}</span></div></div><p class="smalltext">${esc(p.quote)}</p><span class="tag">학습 도우미 · ${i<3?'이번 사건 안내':'향후 사건 연결용'}</span></article>`).join('')}</div>`;}
function labHTML(){const c=CASES.find(x=>x.id===labCase)||CASES[0];return `<div class="row between"><div><span class="eyebrow">CONDITION 실험 </span><h1>조건을 바꾸는 실험실</h1></div><span class="tag">자유 실험 · 정답 점수 없음</span></div><p class="muted">이곳은 계산 결과를 즉시 보여 줍니다. 먼저 사건에서 예측 연습을 한 뒤 다른 조건에서 원리가 어떻게 나타나는지 확인하세요.</p><div class="tabs">${CASES.map(c=>`<button data-action="lab" data-id="${c.id}" class="${labCase===c.id?'selected':''}">${esc(c.title)}</button>`).join('')}</div><div class="stagegrid"><div class="play-scene" id="lab-scene"></div><article class="card">${labCase==='choice'?`<h2>2등이 바뀌면 1등도 달라질까?</h2><p>A의 편익/비용은 30/8, B는 36/10. C의 비용 7은 고정하고 편익을 바꿉니다.</p><label for="labv">C의 편익</label><input id="labv" type="range" min="28" max="38" step="0.5" data-lab="cBenefit" value="${lab.cBenefit}"><div class="field"><label for="labvn">C 편익 입력</label><input id="labvn" type="number" min="28" max="38" step="0.5" data-lab="cBenefit" value="${lab.cBenefit}"></div>`:labCase==='public'?`<h2>설치와 납부를 분리해서 보기</h2><p>창작 4명 규칙. 다른 세 주민의 납부액은 모두 같다고 가정합니다.</p><label for="other">다른 주민 한 명당 납부</label><input id="other" type="range" min="0" max="10" step="1" data-lab="otherEach" value="${Math.round(lab.others/3)}"><label for="paid">나의 납부</label><input id="paid" type="range" min="0" max="10" step="1" data-lab="paid" value="${lab.paid}">`:`<h2>생산에서 소비로</h2><p>A 최대(24,12), B 최대(8,8). A는X24, B는Y8에 완전 특화하고 X6을 교환합니다.</p><label for="offer">X6과 교환할 Y</label><input id="offer" type="range" min="0" max="8" step="0.5" data-lab="y" value="${lab.y}"><div class="field"><label for="offern">Y 수량 입력</label><input id="offern" type="number" min="0" max="8" step="0.5" data-lab="y" value="${lab.y}"></div>`}<div id="lab-result"></div><p class="notice">입력한 규칙으로 계산한 창작 모형입니다. 현실의 가치나 실제 사람의 행동을 예측하는 모형이 아닙니다.</p><button class="wide" data-action="lab-note">현재 실험을 집필 메모에 추가</button></article></div>${refsHTML(c.sources)}`;}
function labResultText(){if(labCase==='choice'){const rows=costRows([DAY[0],DAY[1],['C',lab.cBenefit,7]]);return 'C 편익='+lab.cBenefit+'\n'+rows.map(z=>`${z.name}: 편익−명시적 비용 ${f(z.g)}, 암묵적 비용 ${f(z.implicit)}, 기회비용 ${f(z.oc)}, 순편익 ${f(z.surplus)}`).join('\n');}if(labCase==='public'){const others=Array(3).fill(lab.others/3),x=publicCalc(others,lab.paid);return `타인 납부 ${others.join('·')}, 내 납부 ${lab.paid}\n합계 ${x.total} / 설치비 24 / 설치 ${x.lit?'성공':'실패'}\n내 최종 결과 ${x.value}`;}const t=tradeCalc({ax:24,ay:12,bx:8,by:8,q:6},lab.y);return `계약 X6:Y${lab.y}, X1당 Y${f(t.ratio)}\nA 이익(Y) ${f(t.gainA)}, B 이익(Y) ${f(t.gainB)}\nA 소비(${t.A}), B 소비(${t.B})`;}
function paintLab(){if(!$('lab-scene'))return;if(labCase==='choice'){const rows=costRows([DAY[0],DAY[1],['C',lab.cBenefit,7]]),best=rows.findIndex(x=>x.g===Math.max(...rows.map(y=>y.g))),sac=rows.findIndex((x,i)=>i!==best&&x.g===Math.max(...rows.filter((_,j)=>j!==best).map(z=>z.g)));$('lab-scene').innerHTML=choiceScene(best,sac,[DAY[0],DAY[1],['C',lab.cBenefit,7]]);$('lab-result').innerHTML=textTable(['대안',"편익−명시적 비용",'암묵적 비용','기회비용','순편익'],rows.map(z=>[z.name,f(z.g),f(z.implicit),f(z.oc),f(z.surplus)]))+`<p class="tiny muted">그림은 편익−명시적 비용이 가장 큰 대안: 하나를 표시합니다. 같은 최대값이 있으면 표에서 동률을 함께 확인하세요.</p>`;}else if(labCase==='public'){$('lab-scene').innerHTML=publicScene(Array(3).fill(lab.others/3),lab.paid,true);$('lab-result').innerHTML=`<div class="equation">${esc(labResultText())}</div>`;}else{$('lab-scene').innerHTML=tradeScene(lab.y,true);$('lab-result').innerHTML=`<div class="equation">${esc(labResultText())}</div>`;}}
function settingsHTML(){return `<div class="narrow"><span class="eyebrow">BUILD ${esc(BUILD)}</span><h1>설정과 기록 관리</h1><section class="card"><h2>읽기·연출</h2><div class="row">${[16,17,19,21].map(n=>`<button class="${state.settings.size===n?'selected':''}" data-action="font" data-value="${n}">${n}px</button>`).join('')}</div><label class="check"><input type="checkbox" data-setting="reduced" ${state.settings.reduced?'checked':''}><span>움직임 줄이기</span></label><label class="check"><input type="checkbox" data-setting="sound" ${state.settings.sound?'checked':''}><span>정답 확인 효과음 · 기본 꺼짐</span></label><p class="tiny muted">색만으로 정답을 전달하지 않으며, 드래그 대신 버튼과 숫자 입력으로 진행할 수 있습니다.</p></section><section class="card section"><h2>학습 기록</h2><p>현재 브라우저에 저장합니다. 자동 기기 간 동기화는 없습니다. 저장 제한이나 브라우저 데이터 삭제에 대비해 중요한 초안은 별도로 백업하세요.</p><div class="actions"><button class="primary" data-action="backup">JSON 백업</button><button data-action="restore">4.0 백업 복원</button><button data-action="export-notes">메모 TXT</button></div><p class="notice">이 첫 실행판은 3.1 백업을 가져와 새 미션의 성취로 바꾸지 않습니다. 기존 HTML과 기록을 그대로 보존하세요. 3.1과 4.0은 저장 키가 다릅니다.</p></section><section class="card section"><h2>홈 화면 앱으로 배포하기</h2><p>아래 버튼은 이 브라우저에서 PWA ZIP을 만듭니다. 실행 HTML, 서비스 워커, manifest, PNG 아이콘, 안내문을 포함합니다. <b>개인 답안·메모·학습 기록은 배포 ZIP에 포함하지 않습니다.</b></p><div class="actions"><button class="primary" data-action="pwa-zip">PWA 배포 ZIP 만들기</button><button data-action="install">이 기기에 설치</button><button data-action="update">대기 중인 업데이트 적용</button></div><p class="notice">설치형 배포는 ZIP을 풀어 HTTPS 정적 호스팅에 올려야 합니다. 다운로드한 file:// HTML과 Drive 미리보기는 설치형 웹앱 서버가 아닙니다. 이 파일만으로 호스팅이나 앱스토어 등록이 완료되지 않습니다. 홈 화면 추가 지원과 안내는 브라우저마다 다릅니다.</p><p id="pwa-status" class="tiny muted">${location.protocol==='file:'?'현재: 로컬 HTML 실행. 학습은 가능하지만 PWA 등록은 하지 않습니다.':swRegistration?'서비스 워커 등록됨. 오프라인·업데이트는 실제 환경에서 확인하세요.':'현재: 서비스 워커 등록 여부 확인 전 또는 일반 HTML 실행.'}</p></section><section class="card section"><h2>자가검사와 제작 상태</h2><p>아래 검사는 현재 브라우저에서 수행합니다. 계산 기준값·응답 검증·데이터 구조·ZIP의 기본 CRC를 확인하지만, 학습 효과·그림 배치·기기별 조작까지 보장하지는 않습니다.</p><div class="actions"><button data-action="audit">자가검사 실행</button><button data-action="export-tests">검사 명세 JSON</button></div><div id="audit-output"></div><p class="notice">4.0.1은 원본 코드를 읽어 저장·기록·이동·화면 로직을 수정한 검토판입니다. 실행 환경 오류로 제작자의 브라우저 회귀 시험은 아직 수행하지 못했습니다. 자가검사 결과는 이 브라우저에서 직접 실행한 후에만 표시합니다. 90분은 세 사건의 학습 설계 목표이며 실제 플레이 시간 검증 전입니다. 30시간 경제 전 범위 4.0판, 72강, 네이티브 앱, 멀티플레이는 이 파일의 구현 범위가 아닙니다.</p></section><section class="card section"><h2>원고와 근거</h2><div class="actions"><button data-action="export-lessons">12강 원고 Markdown</button><button data-action="export-content">강의·미션 데이터 JSON</button></div><p>수능특강 본문의 용어·정의, 동아의 공공재 활동, 수능특강 해설 부록의 비교 우위 자료 유형을 확인했습니다. 원문과 다른 가정·수치·도출한 숏컷은 본문에 표시했습니다. 모든 첨부 자료의 전수 분석 완료를 뜻하지 않습니다.</p></section><details class="card section"><summary>이 파일의 학습 기록 초기화</summary><p>이 브라우저에 저장한 4.0 기록만 지웁니다. 먼저 JSON 백업을 저장하세요. Drive의 파일이나 기존 3.1 기록은 지우지 않습니다.</p><button data-action="reset">4.0 기록 초기화</button></details></div>`;}
function render(){frame();let html='';switch(route.view){case'case':html=caseHTML(route.id);break;case'stage':html=stageHTML(route.id);break;case'library':html=libraryHTML();break;case'lesson':html=`<div class="narrow"><button class="small" data-action="nav" data-view="library">← 강의실</button><div class="section">${lessonHTML(LBYID[route.id],true)}</div></div>`;break;case'lab':html=labHTML();break;case'review':html=reviewHTML();break;case'studio':html=studioHTML();break;case'settings':html=settingsHTML();break;default:html=homeHTML();}$('app').innerHTML=html;if(route.view==='lab')paintLab();}
function paintTask(){const s=currentStage();if(!s||s.kind!=='task')return;if($('scene'))$('scene').innerHTML=picture(s.c,s,r,!!feedback);if($('live-note'))$('live-note').textContent=s.type==='allocation'?'현재 합계 '+r.counts.reduce((a,b)=>a+b,0)+" / 목표 24 · 개인별 상한 6":'현재 조건을 바꾼 장부가 그림에 반영됩니다. 목표를 만족하는 최소값이나 반례를 찾으세요.';}

// PART 5: 조작 이벤트·피드백·원고 내보내기. 자가검사는 저장 데이터를 바꾸지 않는다.
function answered(s){switch(s.type){case'choice':return Number.isInteger(r.choice);case'multi':return r.selected.length>0;case'map':return r.map.length===s.data.rows.length&&r.map.every(Number.isInteger);case'ghost':return Number.isInteger(r.chosen)&&Number.isInteger(r.sacrifice);case'numbers':return r.nums.length===s.data.labels.length&&r.nums.every(x=>Number.isFinite(num(x)));case'threshold':case'countermodel':return Number.isFinite(num(r.value));case'donation':return r.donation!==null&&Number.isFinite(num(r.nums[0]));case'allocation':return r.counts.some(x=>x>0);case'ppf':return Number.isFinite(num(r.value))&&Number.isFinite(num(r.nums[0]));case'trade':return Number.isFinite(num(r.value))&&r.nums.every(x=>Number.isFinite(num(x)));case'write':return grade(s,r);default:return false;}}
function submit(){const s=currentStage();if(!s||s.kind!=='task'||!r)return;if(!answered(s)){toast(s.type==='write'?'초안과 자기 점검을 모두 확인하세요.':'빈칸과 선택을 모두 확인하세요.');return;}if(s.type!=='write'&&!['sure','unsure','guess'].includes(r.confidence)){toast('확신도를 먼저 선택하세요.');return;}if(feedback){toast('이미 결과를 확인했습니다. 다시 풀기 또는 다음 장면을 선택하세요.');return;}const ok=grade(s,r),was=solved(s.id),response=cleanResponse(s,r),old=state.records[s.id]||{solved:null,history:[]};old.history.push({response,time:new Date().toISOString()});old.history=old.history.slice(-15);if(ok&&(!old.solved||old.solved.assisted&&!response.assisted||s.type==='write'))old.solved=response;state.records[s.id]=old;delete state.drafts[s.id];feedback={ok,newXP:ok&&!was&&s.type!=='write'};save();refresh();if(ok){tone();if(!was&&s.type!=='write')toast('+20 XP · 새로운 활동 해결');else if(s.type==='write')toast('설명 초안과 자기 점검을 기록했습니다.');}setTimeout(()=>$('feedback')?.scrollIntoView({block:'nearest'}),30);}
function next(){const s=currentStage();if(!s)return;const c=CASES.find(c=>c.id===s.c);if(s.index+1<c.stageIds.length)go('stage',c.stageIds[s.index+1]);else{go('case',c.id);if(complete(c))toast('사건 완료 · '+c.badge);}}
function invalidate(){if(feedback){r.assisted=true;feedback=null;if($('feedback'))$('feedback').innerHTML='';}}

cp41("상업 자본주의의 배경","다음 사례와 관련된 정책과 자본주의의 유형을 옳게 짝지은 것은?\n\n절대 왕정은 상인의 교역 활동을 지원하고 세금을 확보하였다.",['중상주의와 상업 자본주의','뉴딜 정책과 수정 자본주의','신자유주의의 민영화'],0,"중상주의는 국가의 부를 늘리기 위해 국내 산업을 보호하고 수출을 장려한 정책이다. 절대 왕정의 중상주의 정책은 교역과 상인의 활동을 뒷받침하여 상업 자본주의의 발달에 기여하였다."),
co41("자본주의의 전개 순서",['상업 자본주의','산업 자본주의','수정 자본주의','신자유주의'],"상업 자본주의, 산업 자본주의, 수정 자본주의, 신자유주의의 순서이다. 교역의 확대, 산업 혁명, 대공황, 석유 파동 이후의 정부 대응 한계를 각 시기의 등장 배경과 함께 정리할 수 있다."),
cm41("자본주의의 등장 배경","각 자본주의의 등장 배경으로 알맞은 것을 고르시오.",['산업 자본주의','수정 자본주의','신자유주의'],['대공황','산업 혁명','석유 파동 이후 정부 대응의 한계'],[1,0,2],"산업 혁명으로 대량 생산이 가능해지면서 산업 자본주의가 발달하였다. 대공황 이후에는 시장 실패를 해결하기 위한 수정 자본주의가 등장하였다. 신자유주의는 석유 파동 이후 정부 대응의 한계와 정부 개입에 따른 비효율이 드러난 것을 배경으로 한다."),
cm41("활동과 정책에 나타난 자본주의","각 설명에 해당하는 자본주의의 유형을 고르시오.",['상품 유통에서 이윤 추구','대규모 생산 설비 활용','공공사업으로 유효 수요 창출','공기업 민영화 강조'],['상업','산업','수정','신자유주의'],[0,1,2,3],"상품의 유통에서 이윤을 얻는 것은 상업 자본주의, 대규모 설비로 상품을 생산하는 것은 산업 자본주의의 특징이다. 공공사업으로 유효 수요를 늘리는 정책은 수정 자본주의, 공기업 민영화는 신자유주의와 관련된다."),
ci41("정부 개입의 목적 비교","다음 두 사례에 대한 설명으로 옳은 것은?",["A: 절대 왕정이 상인의 교역 활동을 장려하였다.","B: 대공황 이후 정부가 공공사업을 추진하여 일자리를 제공하였다.","두 사례 모두 정부가 경제활동에 개입하였다."],["A와 B는 모두 대공황을 극복하기 위한 정책이다.","A와 B는 모두 정부가 개입한 사례이지만, 정책의 목적은 서로 다르다.","A와 B는 모두 상품의 유통 과정에서 이윤을 얻는 것을 주된 목적으로 한다."],1,"A는 중상주의 정책으로 교역을 장려한 사례이며 상업 자본주의와 관련된다. B는 고용과 수요를 늘리기 위한 공공사업으로 수정 자본주의와 관련된다.\n\n두 사례 모두 정부가 개입하였지만 A는 교역을 통한 부의 축적을, B는 실업과 수요 부족의 해결을 추구하였다. 대공황 극복을 목적으로 한 것은 B이며, 상품 유통을 통한 이윤 추구는 A와 관련된다.",[0,1]),
cf41("산업 자본주의의 등장 배경",['산업 자본주의는','대공황을 배경으로','대량 생산이 확대되면서 전개되었다.'],1,['산업 혁명을 배경으로','민영화만을 배경으로','정부 실패만을 배경으로'],0,"산업 자본주의는 산업 혁명으로 기계를 이용한 대량 생산이 가능해지면서 발달하였다. 따라서 ‘대공황’을 ‘산업 혁명’으로 고쳐야 한다. 대공황은 수정 자본주의의 등장 배경이다."),
cu41("자본주의의 특징","자본주의에 대한 설명으로 옳은 것을 모두 고르시오.",['자본주의는 사유 재산권을 보장한다.','산업 자본주의는 시장의 자유를 요구하였다.','수정 자본주의는 정부의 모든 역할을 부정하였다.','신자유주의는 정부 역할의 축소를 강조하였다.'],[0,1,3],"자본주의는 사유 재산권을 보장한다. 산업 자본주의는 시장의 자유로운 활동을, 신자유주의는 정부 역할의 축소를 강조하였다. 수정 자본주의는 정부의 모든 역할을 부정한 것이 아니라, 시장 실패를 해결하기 위한 정부의 적극적인 개입을 강조하였다."),
cm41("사상가와 주요 주장","각 사상가의 주장으로 알맞은 것을 고르시오.",['애덤 스미스','케인스','프리드먼·하이에크'],['정부 역할 축소','시장의 조정 기능','정부의 적극적 개입'],[1,2,0],"애덤 스미스는 시장 가격의 조정 기능을 중시하고 정부의 시장 개입을 최소화해야 한다고 보았다. 케인스는 시장의 한계를 보완하는 정부의 적극적 개입을 강조하였다. 프리드먼과 하이에크는 정부 역할의 축소와 시장 기능의 강화를 강조하였다."),
ci41("유통과 생산을 통한 이윤 추구","다음 두 자료에 대한 설명으로 옳은 것은?",['1: 상품 유통과 해외 교역에서 이윤을 얻는다.','2: 공장 설비를 갖추고 대량 생산한다.'],['둘 다 산업 자본주의이다.',"1은 상업 자본주의, 2는 산업 자본주의에 해당한다.",'1은 신자유주의이다.'],1,"1은 상품의 유통과 해외 교역을 통해 이윤을 얻으므로 상업 자본주의에 해당한다. 2는 공장 설비를 이용하여 상품을 대량 생산하므로 산업 자본주의에 해당한다."),
cp41("개념 적용 문제","대공황 이후 공공사업으로 일자리를 제공하고 유효 수요를 늘리려는 정책과 관련된 자본주의는?",['상업 자본주의','수정 자본주의','신자유주의'],1,"수정 자본주의이다. 정부가 공공사업으로 일자리를 제공하면 노동자는 임금을 받고 상품을 구입할 수 있다. 이를 통해 고용과 유효 수요를 늘리고자 하였다.")
],[cp41("중상주의와 수정 자본주의의 비교","절대 왕정의 교역 장려 정책과 대공황 이후의 공공사업을 구별할 때 살펴야 할 내용으로 가장 적절한 것은?",["정책이 시행된 시대적 배경과 목적을 비교한다.","정부가 개입했으므로 같은 자본주의의 단계로 구분한다.","두 정책 모두 민간의 상품 거래를 금지했다고 본다."],0,"교역 장려 정책은 상업 자본주의, 대공황 이후의 공공사업은 수정 자본주의와 관련된다. 두 정책 모두 정부의 개입이지만 등장한 시기와 해결하려는 문제가 다르다. 따라서 시대적 배경과 정책 목적을 비교해야 한다."),cm41("자본주의의 등장 배경 복습","각 설명에 해당하는 자본주의를 고르시오.",['대량 생산','대공황','정부 실패와 역할 축소'],['수정','산업','신자유주의'],[1,0,2],"산업 혁명에 따른 대량 생산은 산업 자본주의, 대공황에 대한 대응은 수정 자본주의의 배경이다. 정부 실패를 줄이고 시장의 기능을 강화하려는 입장은 신자유주의와 관련된다.")],co41("독점 자본주의를 포함한 전개 순서",['상업 자본주의','산업 자본주의','독점 자본주의','수정 자본주의','신자유주의'],"상업 자본주의, 산업 자본주의, 독점 자본주의, 수정 자본주의, 신자유주의의 순서이다. 산업 자본주의가 발달하면서 소수 거대 기업의 시장 지배가 나타났으며, 대공황 이후에는 시장 실패를 해결하는 정부의 역할이 강조되었다."));
addCourse41(2,"경제 체제와 경제적 유인",1,"시장경제 체제와 계획경제 체제의 특징을 비교하고, 보상과 비용의 변화가 선택에 미치는 영향을 알아보자.",['E76','V64'],[
cp41("계획에 따른 생산","정부가 생산할 상품과 수량을 정하여 생산을 지시한다. 이 사례에 해당하는 경제 체제는?",['시장경제','계획경제','자유 방임주의'],1,"계획경제 체제이다. 정부가 상품의 종류와 수량을 정하고 생산을 지시하므로 정부의 계획과 통제에 따라 경제 문제를 해결한다."),
cm41("경제 체제의 구분","각 설명에 해당하는 경제 체제를 고르시오.",["시장 가격과 민간의 자유로운 선택을 중시한다.","정부가 생산과 분배를 계획한다.","시장 원리와 정부의 개입을 함께 활용한다."],['시장경제','계획경제','혼합 경제'],[0,1,2],"민간의 자유로운 선택과 시장 가격을 중시하는 것은 시장경제 체제이다. 정부의 계획과 통제로 경제 문제를 해결하는 것은 계획경제 체제이다. 두 요소가 결합한 것은 혼합 경제 체제이다."),
cm41("기본적인 경제 문제","각 질문이 어떤 경제 문제에 해당하는지 고르시오.",['제품을 몇 개 만들까?','어떤 생산 기술을 사용할까?','생산물을 누구에게 나눌까?'],["어떻게 생산할 것인가","무엇을 얼마나 생산할 것인가","누구에게 어떻게 분배할 것인가"],[1,0,2],"생산할 상품과 수량을 정하는 것은 ‘무엇을 얼마나 생산할 것인가’의 문제이다. 기술을 선택하는 것은 ‘어떻게 생산할 것인가’, 생산물을 나누는 것은 분배에 관한 문제이다."),
cf41("시장경제 체제의 자원 배분",['시장경제는','정부의 명령만으로','자원 배분 문제를 해결한다.'],1,['시장 원리를 중시하며','소비자의 선택을 금지하여','생산 수단을 모두 국유화하여'],0,"시장경제 체제에서는 민간 경제 주체가 시장 가격을 고려하여 자유롭게 경제활동을 결정한다. 정부의 명령만으로 자원을 배분한다는 설명은 시장경제 체제의 특징에 맞지 않는다."),
cu41("시장경제 체제의 장점과 한계","시장경제 체제에 대한 설명으로 옳은 것을 모두 고르시오.",['창의성 발휘에 유리할 수 있다.','빈부 격차가 발생할 수 있다.','모든 욕구를 언제나 완전히 충족한다.','급격한 경기 변동 가능성이 있다.'],[0,1,3],"시장경제 체제는 사유 재산권과 경제활동의 자유를 보장하므로 개인의 능력과 창의성 발휘에 유리하다. 그러나 빈부 격차와 급격한 경기 변동이 발생할 수 있으며 모든 욕구를 완전히 충족하지는 못한다."),
cn41("보상 증가 전후의 선택","A 작업의 편익은 12, 명시적 비용은 4이고 B 작업의 편익은 13, 명시적 비용은 6이다. 이후 B의 편익만 16으로 증가하였다. 변경 전과 후에 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.",["변경 전 B의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"],[7,10],"변경 전 B는 13−6=7, 변경 후에는 16−6=10이다. A의 편익에서 명시적 비용을 빼면 12−4=8이다. 따라서 처음에는 A가 유리하지만, B의 보상이 늘어난 뒤에는 B가 유리하다."),
cp41("계획경제 체제의 한계","계획경제 체제의 한계로 옳은 것은?",['소비자의 다양한 욕구를 반영한 계획 수립의 어려움','정부가 아무 결정도 할 수 없음','경제적 유인이 항상 무한히 커짐'],0,"정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기는 어렵다. 사유 재산권과 자유로운 경제활동이 제한되어 개인의 경제적 유인이 부족해질 수 있다는 한계도 있다."),
ci41("시장과 정부의 역할","다음 자료에 나타난 경제 운영 방식에 대한 설명으로 옳은 것은?",['민간이 시장 가격에 따라 상품을 거래한다.','정부가 공공재 공급과 경쟁 질서에 관여한다.'],['정부가 있으므로 민간 거래는 금지된다.','시장 원리와 정부 역할이 함께 나타난다.','가격이 있으므로 정부는 어떤 역할도 못 한다.'],1,"민간의 시장 거래와 정부의 공공재 공급 및 경쟁 질서 유지가 함께 나타난다. 시장경제적 요소와 계획경제적 요소가 결합한 혼합 경제 체제로 설명할 수 있다."),
cm41("경제 체제의 특징 비교","각 설명의 옳고 그름을 판단하시오.",['시장경제는 자원 배분의 효율성을 중시한다.','계획경제에서는 정부 계획이 중요하다.',"혼합 경제는 시장경제적 요소와 계획경제적 요소를 함께 활용한다.",'시장경제에서는 불평등이 절대 생기지 않는다.'],["옳다","옳지 않다"],[0,0,0,1],"시장경제 체제는 자원 배분의 효율성을 상대적으로 중시하지만 불평등이 발생할 수 있다. 계획경제 체제는 정부의 계획과 통제를, 혼합 경제 체제는 시장경제적 요소와 계획경제적 요소의 결합을 특징으로 한다."),
cp41("개념 적용 문제","혼합 경제 체제에 대한 설명으로 옳은 것은?",['혼합의 정도는 모든 국가에서 같다.','시장경제적 요소와 계획경제적 요소를 함께 활용한다.','시장 거래를 전면 금지한다.'],1,"혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소를 함께 활용한다. 국가가 추구하는 목표와 경제 상황에 따라 두 요소의 결합 정도는 다르다.")
],[cp41("효율성과 형평성","한 학생이 ‘시장경제는 효율성이 높으므로 불평등이 발생하지 않는다.’라고 설명하였다. 이에 대한 평가로 옳은 것은?",['전체 설명이 모두 옳다.',"불평등이 발생하지 않는다는 설명은 옳지 않다.",'어떤 경제 체제도 비교할 수 없다.'],1,"시장경제 체제는 시장 가격을 통한 효율적인 자원 배분에 유리하다. 그러나 빈부 격차가 발생하여 분배의 형평성이 낮아질 수 있다. 따라서 불평등이 발생하지 않는다는 설명은 옳지 않다."),cm41("경제 문제의 해결 방식","각 설명에 해당하는 경제 체제를 고르시오.",["정부의 계획과 통제에 따라 경제활동을 결정한다.","시장 가격을 바탕으로 민간이 자유롭게 선택한다.","시장경제적 요소와 계획경제적 요소를 결합한다."],['시장경제','계획경제','혼합 경제'],[1,0,2],"정부의 계획과 통제를 따르는 것은 계획경제 체제, 시장 가격과 민간의 선택을 중시하는 것은 시장경제 체제이다. 두 체제의 요소가 결합한 것은 혼합 경제 체제이다.")],cn41("보상이 늘어도 선택이 유지되는 경우","A의 편익은 24, 명시적 비용은 8이고 B의 편익은 25, 명시적 비용은 12이다. 이후 B의 편익만 2 증가하였다. 다른 조건은 같다. A와 변경 후 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.",["A 편익−명시적 비용","변경 후 B의 편익−명시적 비용"],[16,15],"A는 24−8=16이다. B의 편익은 27이 되었으므로 변경 후에는 27−12=15이다. B의 보상이 늘어도 A의 16보다 작으므로 A를 선택하는 것이 여전히 유리하다."));
addCourse41(3,"합리적 선택과 기회비용",0,"직접 지출하는 돈과 포기한 가치를 구별하여 기회비용을 계산하고, 가장 유리한 대안을 찾아보자.",['E76','B48'],[
cp41("자원의 희소성","자원의 희소성에 대한 설명으로 옳은 것은?",['절대 수량이 적은 것만 희소하다.','욕구에 비해 자원이 상대적으로 부족하다.','돈으로 살 수 없으면 선택 문제도 없다.'],1,"희소성은 인간의 욕구에 비해 사용할 수 있는 자원이 상대적으로 부족한 상태이다. 자원의 양이 많더라도 사람들이 원하는 양에 비해 부족하면 희소성이 나타난다."),
cb41("예산에 맞는 물품 선택","준비금은 10토큰이다. 각 물품은 최대 1개까지 살 수 있으며, 여러 물품에서 얻는 편익은 더할 수 있다. 예산 안에서 편익을 17 이상 얻도록 물품을 고르시오.",[['자료 꾸러미',6,[10],1],['체험 도구',4,[7],1],['안내판',5,[6],1]],['편익'],[17],[null],10,[1,1,0],"자료 꾸러미와 체험 도구를 선택하면 비용은 6+4=10토큰이다. 편익은 10+7=17이므로 예산을 넘지 않으면서 필요한 편익을 얻을 수 있다."),
cm41("명시적 비용과 암묵적 비용","체험 활동을 선택할 때 발생하는 각 비용을 구분하시오.",["참가비 3만 원을 지불한다.","대신 일을 했다면 비용을 제외하고 얻을 수 있었던 5만 원을 포기한다."],['명시적 비용','암묵적 비용'],[0,1],"참가비 3만 원은 직접 지출한 금액이므로 명시적 비용이다. 일을 했다면 얻을 수 있었던 5만 원은 다른 대안을 선택할 기회를 포기한 가치이므로 암묵적 비용이다."),
cl41("두 대안의 기회비용",[['A',18,6],['B',22,9]],"A의 편익에서 명시적 비용을 빼면 18−6=12만 원, B는 22−9=13만 원이다.\n\nA를 선택하면 B를 포기하므로 암묵적 비용은 13만 원이다. 명시적 비용 6만 원을 더하면 기회비용은 19만 원이다. B를 선택하면 A를 포기하므로 암묵적 비용은 12만 원이고, 기회비용은 9+12=21만 원이다.\n\n순편익은 A가 18−19=−1만 원, B가 22−21=1만 원이다. 따라서 B가 합리적인 선택이다."),
cn41("포기한 대안 중 가장 큰 가치","A, B, C 중 하나만 선택할 수 있으며 A를 선택하였다. B의 편익은 15만 원, 명시적 비용은 5만 원이고 C의 편익은 12만 원, 명시적 비용은 4만 원이다. A 선택의 암묵적 비용을 구하시오. 답은 만 원 단위로 입력한다.",['A의 암묵적 비용'],[10],"B를 선택했다면 15−5=10만 원, C를 선택했다면 12−4=8만 원의 가치를 얻을 수 있었다. 포기한 두 대안 중 더 큰 가치는 B의 10만 원이다. 따라서 A 선택의 암묵적 비용은 10만 원이다."),
cf41("암묵적 비용의 의미",['암묵적 비용은','포기한 모든 대안의 가치를 더한 값','이다.'],1,['포기한 최선의 대안의 가치','실제로 낸 돈만','회수 불가능한 과거 지출만'],0,"하나만 선택할 수 있는 대안들의 가치를 모두 더해서는 안 된다. 다른 대안들을 동시에 선택할 수 있었던 것은 아니기 때문이다. 암묵적 비용은 포기한 대안 중 가장 큰 가치이다."),
cn41("비용 증가와 선택의 변화","A의 편익은 18, 명시적 비용은 6이고 B의 편익은 22, 명시적 비용은 9이다. 이후 B의 명시적 비용만 11로 증가하였다. 변경 후 각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.",["A의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"],[12,11],"A는 18−6=12, 변경 후 B는 22−11=11이다. 변경 전에는 B의 13이 A의 12보다 컸지만, 비용이 늘어난 뒤에는 A가 더 유리하다."),
cn41("공연 선택의 기회비용","공연 관람의 편익은 14만 원, 표 값은 4만 원이다. 대신 할 수 있는 일의 편익은 9만 원, 명시적 비용은 2만 원이다. 둘 중 하나만 선택할 때 공연 선택의 암묵적 비용과 기회비용을 구하시오. 답은 만 원 단위로 입력한다.",['공연의 암묵적 비용','공연의 기회비용'],[7,11],"일을 했다면 편익 9만 원을 얻고 비용 2만 원을 지출하므로 포기한 가치는 7만 원이다. 따라서 공연 선택의 암묵적 비용은 7만 원이다. 여기에 표 값 4만 원을 더하면 기회비용은 11만 원이다."),
cl41("세 대안의 기회비용",[['A',30,12],['B',37,16],['C',35,16]],"편익에서 명시적 비용을 빼면 A는 18만 원, B는 21만 원, C는 19만 원이다. A나 C를 선택할 때에는 B를 포기한 21만 원이 암묵적 비용이다. B를 선택할 때에는 남은 A와 C 중 가치가 더 큰 C의 19만 원이 암묵적 비용이다.\n\n명시적 비용을 더하면 기회비용은 A가 33만 원, B가 35만 원, C가 37만 원이다. 순편익은 각각 −3만 원, 2만 원, −2만 원이므로 B를 선택하는 것이 합리적이다."),
cp41("개념 적용 문제","편익이 같은 대안 중 합리적으로 선택하기 위해 비교해야 할 비용은?",['명시적 비용만','기회비용','매몰 비용만'],1,"편익이 같다면 기회비용이 작은 대안의 순편익이 더 크다. 기회비용에는 직접 지출하는 명시적 비용과 포기한 가치인 암묵적 비용이 모두 포함된다.")
],[cl41("주말 활동의 기회비용",[['독서',24,4],['체험',30,8],['공연',29,10]],"편익에서 명시적 비용을 빼면 독서는 20만 원, 체험은 22만 원, 공연은 19만 원이다. 체험을 선택하면 독서와 공연 중 가치가 더 큰 독서의 20만 원이 암묵적 비용이다.\n\n체험 선택의 기회비용은 8+20=28만 원, 순편익은 30−28=2만 원이다. 독서와 공연의 순편익은 음수이므로 체험이 가장 유리하다."),cn41("기회비용에 포함할 대안","세 대안 중 하나만 선택한다. A의 명시적 비용은 5이다. B와 C의 편익에서 명시적 비용을 뺀 값은 각각 8과 11이다. A 선택의 기회비용을 구하시오.",['A의 기회비용'],[16],"A를 선택하면 B와 C를 포기한다. 두 대안 중 더 큰 가치는 C의 11이므로 A의 암묵적 비용은 11이다. 명시적 비용 5를 더하면 기회비용은 16이다.")],cn41("암묵적 비용·기회비용·순편익","A의 편익과 명시적 비용은 각각 41과 12, B는 49와 17, C는 46과 13이다. 세 대안 중 하나만 선택한다. C 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.",['C의 암묵적 비용','C의 기회비용','C의 순편익'],[32,45,1],"A의 편익에서 명시적 비용을 빼면 29, B는 32이다. C를 선택하면 두 대안 중 더 큰 가치인 32를 포기하므로 암묵적 비용은 32이다.\n\n기회비용은 13+32=45, 순편익은 46−45=1이다."));
addCourse41(4,"매몰 비용과 선택의 변화",4,"매몰 비용의 의미를 알아보고, 앞으로 낼 비용과 받을 금액이 달라질 때 선택이 어떻게 바뀌는지 계산해 보자.",['E76','B48'],[
cm41("매몰 비용과 추가 비용","과거 지출 60은 어떤 대안을 선택해도 회수할 수 없다. 현재 A를 선택하면 90, B를 선택하면 55를 추가로 지출한다. 각 비용을 구분하시오.",["회수할 수 없는 과거 지출 60","A를 선택할 때 추가로 드는 비용 90","B를 선택할 때 추가로 드는 비용 55"],['매몰 비용',"현재 선택에 따라 발생하는 명시적 비용"],[0,1,1],"이미 지출하여 돌려받을 수 없는 60은 매몰 비용이다. A의 90과 B의 55는 지금 선택하는 대안에 따라 새로 발생하는 명시적 비용이다."),
cp41("편익과 비용의 비교","A의 편익은 150, 명시적 비용은 90이고 B의 편익은 130, 명시적 비용은 55이다. 두 대안 중 하나만 선택할 때 어느 대안이 유리한가?",['A','B','항상 같은 결과'],1,"편익에서 명시적 비용을 빼면 A는 150−90=60, B는 130−55=75이다. B의 순편익은 75−60=15로 양수이므로 B를 선택하는 것이 유리하다. A의 편익이 더 크더라도 비용까지 고려하면 결과가 달라진다."),
cl41("사업 지속과 전환의 기회비용",[['계속 A',150,90],['전환 B',130,55]],"A를 선택하면 B에서 얻을 수 있었던 130−55=75만 원을 포기한다. 따라서 A의 기회비용은 90+75=165만 원이다. B를 선택하면 A에서 얻을 수 있었던 150−90=60만 원을 포기하므로 B의 기회비용은 55+60=115만 원이다.\n\n순편익은 A가 −15만 원, B가 15만 원이므로 B가 유리하다."),
cm41("과거 지출과 합리적 선택","A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55로 일정하다. 어떤 선택에서도 회수할 수 없는 과거 지출만 아래와 같이 다르다. 각 경우에 유리한 대안을 고르시오.",["과거 지출이 20인 경우","과거 지출이 60인 경우","과거 지출이 200인 경우"],['A','B'],[1,1,1],"회수할 수 없는 과거 지출은 매몰 비용이므로 현재의 선택에서 제외한다. 모든 경우에 A의 편익에서 명시적 비용을 뺀 값은 60, B는 75이다. 따라서 과거 지출의 크기와 관계없이 B가 유리하다."),
cp41("사업 전환 비용이 증가한 경우","A의 편익은 150, 명시적 비용은 90이다. B의 편익은 130이고 명시적 비용만 55에서 75로 증가하였다. 변경 후 어느 대안을 선택하는 것이 유리한가?",['A','B','자료에 무관하게 B'],0,"A의 편익에서 명시적 비용을 빼면 60, 변경 후 B는 130−75=55이다. B를 선택할 때의 비용이 늘어나면서 A가 더 유리해졌다."),
cn41("반환금을 받는 대안","A의 편익과 명시적 비용은 각각 150과 90, B는 130과 75이다. 새 계약에 따라 B를 선택할 때만 반환금 20을 받는다. 반환금을 포함한 편익에서 명시적 비용을 뺀 값을 각 대안별로 구하시오. 반환금은 제시된 B의 편익에 포함되어 있지 않다.",["A의 편익−명시적 비용","B의 반환금을 포함한 편익−명시적 비용"],[60,75],"A는 반환금을 받지 않으므로 150−90=60이다. B는 반환금 20을 추가로 받으므로 130+20−75=75이다. 반환금을 포함하면 B가 더 유리하다."),
cr41("두 대안이 동률이 되는 비용","A의 편익에서 명시적 비용을 뺀 값은 60이고 B의 편익은 130이다. 두 대안이 동률이 되는 B의 명시적 비용을 구하시오.",40,100,1,70,"B의 명시적 비용을 x라고 하면 130−x=60이다. 따라서 x=70이다. 이때 A와 B의 값이 모두 60이므로 어느 한 대안만 더 유리하지는 않다."),
cl41("새로운 사업 대안의 추가",[['A',150,90],['B',130,55],['C',100,30]],"편익에서 명시적 비용을 빼면 A는 60만 원, B는 75만 원, C는 70만 원이다. B를 선택할 때에는 A와 C 중 더 큰 가치인 C의 70만 원이 암묵적 비용이다. B의 기회비용은 55+70=125만 원, 순편익은 130−125=5만 원이다.\n\nA나 C를 선택하면 B의 75만 원을 포기하므로 순편익이 음수가 된다. 따라서 B가 가장 유리하다."),
cn41("명시적 비용 구하기","A와 B 중 하나만 선택한다. A 선택의 암묵적 비용은 75이고 B의 편익은 130이다. B의 명시적 비용을 구하시오.",['B의 명시적 비용'],[55],"A를 선택하면 B를 포기한다. 따라서 B의 편익 130에서 명시적 비용을 뺀 값이 A의 암묵적 비용 75이다. B의 명시적 비용은 130−75=55이다."),
cu41("사업 선택의 기회비용과 순편익","A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55이다. 두 대안 중 하나만 선택한다. 과거 지출 60은 어떤 선택에서도 회수할 수 없다. 옳은 설명을 모두 고르시오.",['A의 편익이 더 크므로 반드시 A이다.',"회수할 수 없는 과거 지출 60은 매몰 비용이다.","B 선택의 순편익은 15이다.","B 선택의 기회비용은 115이다."],[1,2,3],"과거 지출 60은 매몰 비용이다. B를 선택할 때의 암묵적 비용도 60이지만, 이는 과거 지출이 아니라 A를 포기한 가치 150−90=60이다.\n\nB의 기회비용은 55+60=115이고, 순편익은 130−115=15이다.")
],[cp41("매몰 비용의 변화","현재 두 대안의 편익과 비용은 그대로인데, 어떤 선택에서도 회수할 수 없는 과거 지출만 커졌다. 이에 대한 설명으로 옳은 것은?",["매몰 비용의 증가만으로 유리한 대안이 달라지지는 않는다.",'반드시 계속해야 한다.','반드시 포기해야 한다.'],0,"과거 지출은 매몰 비용이므로 현재의 선택에서 고려하지 않는다. 각 대안의 편익과 앞으로 부담할 비용이 같다면 과거 지출만 커져도 유리한 대안은 바뀌지 않는다."),cn41("비용이 바뀐 뒤의 선택","A의 편익과 명시적 비용은 각각 80과 30, B는 90과 35이다. 이후 B의 명시적 비용만 45로 증가하였다. 변경 후 각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.",["A의 편익−명시적 비용","변경 후 B의 편익−명시적 비용"],[50,45],"A는 80−30=50이고, 변경 후 B는 90−45=45이다. 따라서 비용이 바뀐 뒤에는 A가 더 유리하다.")],cr41("B가 더 유리해지는 최소 반환금","A의 편익과 명시적 비용은 각각 70과 20, B는 74와 30이다. B를 선택할 때만 반환금을 받으며 그 금액은 0 이상의 정수이다. B가 A보다 더 유리해지는 최소 반환금을 구하시오.",0,20,1,7,"A의 편익에서 명시적 비용을 빼면 50이다. 반환금을 r라고 하면 B는 74+r−30=44+r이다.\n\nB가 더 유리하려면 44+r>50이어야 하므로 r>6이다. 반환금은 정수이므로 최소값은 7이다. 6에서는 두 대안이 같아진다."));
addCourse41(5,"외부 효과와 정부의 대응",4,"생산과 소비가 다른 사람에게 미치는 영향을 알아보고, 외부 효과를 개선하기 위한 세금과 보조금의 역할을 살펴보자.",['E76','E77'],[
cp41("생산에 따른 외부 불경제","기업의 생산 활동으로 인근 주민이 피해를 입었지만 기업은 이를 보상하지 않았다. 이 사례에 해당하는 개념은?",['외부 불경제','명시적 비용만','배당'],0,"기업이 생산 과정에서 다른 경제 주체인 주민에게 피해를 주고도 그 대가를 지불하지 않았으므로 외부 불경제에 해당한다."),
ce41("개인 이익이 가장 큰 활동량",NEG41,'private',0,"개인 이익은 활동량이 4일 때 76으로 가장 크다. 따라서 활동량은 4, 개인 이익은 76이다."),
ce41('두 번째 장부',NEG41,'negative',0,"개인 이익에서 제3자의 피해를 빼면 활동량별로 0, 32, 48, 42, 24이다. 활동량이 2일 때 48로 가장 크므로 피해까지 고려한 유리한 활동량은 2이다."),
cm41("외부 효과에 대한 정부의 대응","각 외부 효과를 개선하기 위한 정부의 대응을 고르시오.",['외부 경제','외부 불경제'],["세금·부담금 등으로 생산과 소비를 억제한다.","세금 감면·보조금 등으로 생산과 소비를 촉진한다."],[1,0],"외부 경제가 발생하면 사회적 최적 수준보다 적게 생산하거나 소비하므로 세금 감면과 보조금으로 생산·소비를 늘릴 수 있다. 외부 불경제가 발생하면 사회적 최적 수준보다 많이 생산하거나 소비하므로 세금이나 부담금으로 생산·소비를 줄일 수 있다."),
ce41("부담금을 낸 뒤의 이익",NEG41,'tax',14,"부담금 총액은 활동량에 14를 곱하여 구한다. 개인 이익에서 총부담금을 빼면 활동량별로 0, 22, 32, 30, 20이다. 따라서 활동량이 2일 때 납부 후 이익이 32로 가장 크다."),
cn41("생산자 이익과 정부 수입","생산량은 2, 부담금 납부 전 이익은 60, 부담금 총액은 28, 주민 피해는 12이다. 생산자가 낸 부담금 28은 정부의 수입이다. 행정 비용 등 다른 효과는 없다. 아래 각 금액을 구하시오.",['생산자의 납부 후 이익',"정부의 부담금 수입","생산자 이익+정부 수입−주민 피해"],[32,28,48],"부담금을 낸 뒤 생산자에게 남는 이익은 60−28=32이다. 정부는 부담금 28을 수입으로 얻는다.\n\n두 주체의 금액을 더하고 주민 피해를 빼면 32+28−12=48이다. 생산자 이익에서는 이미 부담금이 빠졌으므로 합계에서 다시 빼지 않는다."),
ce41("제3자의 편익을 더한 활동량",POS41,'positive',0,"개인 이익과 제3자의 편익을 더하면 활동량별로 0, 32, 56, 70, 78이다. 활동량이 4일 때 합계가 78로 가장 크다."),
ce41("보조금을 받은 뒤의 이익",POS41,'subsidy',10,"보조금 총액은 활동량에 10을 곱하여 구한다. 개인 이익에 보조금을 더하면 0, 34, 56, 64, 68이다. 활동량이 4일 때 68로 가장 크다."),
cm41("외부 불경제의 사례","각 사례가 외부 불경제에 해당하는지 판단하시오.",["생산자의 배출물로 주민이 피해를 입었지만 보상받지 못했다.","상품 구매자가 판매자에게 약정한 가격을 지불했다.","경제활동과 무관한 자연재해로 설비가 파손되었다."],["외부 불경제에 해당한다.","제시된 내용은 외부 불경제 사례가 아니다."],[0,1,1],"공장의 배출물로 주민이 피해를 입고 보상받지 못한 것은 외부 불경제이다.\n\n상품을 사고 가격을 지불한 것은 거래 당사자 사이에서 대가를 주고받은 경우이다. 경제활동과 무관한 자연재해의 피해도 다른 경제 주체의 생산이나 소비에서 발생한 것이 아니므로 외부 불경제에 해당하지 않는다."),
cf41("외부 경제와 과소 생산",["긍정적 외부 효과가 발생하면","사회적 적정 수준보다 많이 생산·소비된다","."],1,["사회적 적정 수준보다 적게 생산·소비된다","항상 사회적 적정 수준만큼 생산·소비된다","어떤 생산·소비도 이루어지지 않는다"],0,"긍정적 외부 효과인 외부 경제가 발생하면 다른 경제 주체에게 돌아가는 이익이 개인의 선택에 충분히 반영되지 않는다. 따라서 사회적 최적 수준보다 적게 생산하거나 소비하게 된다.")
],[cm41("외부 경제와 외부 불경제","각 사례에 해당하는 외부 효과를 고르시오.",["경제활동으로 제3자에게 피해를 주었지만 보상하지 않았다.","경제활동으로 제3자에게 이익을 주었지만 대가를 받지 못했다."],['외부 경제','외부 불경제'],[1,0],"경제활동으로 제3자에게 피해를 주고도 보상하지 않으면 외부 불경제이다. 제3자에게 이익을 주고도 대가를 받지 못하면 외부 경제이다."),ce41("제3자 피해를 고려한 선택",[[0,0,0],[1,20,2],[2,32,7],[3,36,18]],'negative',0,"활동량별로 개인 이익에서 피해를 빼면 0, 18, 25, 18이다. 활동량이 2일 때 25로 가장 크다.")],ce41("축제 규모와 주민 피해",[[0,0,0],[1,28,4],[2,45,11],[3,55,29]],'negative',0,"활동량별로 개인 이익에서 주민 피해를 빼면 0, 24, 34, 26이다. 활동량이 2일 때 34로 가장 크므로 주민 피해까지 고려하면 활동량 2가 유리하다."));
