cm41("공공재의 두 특성","각 설명에 해당하는 공공재의 특성을 고르시오.",["대가를 지불하지 않은 사람을 소비에서 배제할 수 없다.","한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다."],['비경합성','비배제성'],[1,0],"대가를 지불하지 않은 사람의 소비를 막을 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는 것은 비경합성이다."),
cn41("네 주민의 가로등 모금","네 주민은 각각 10토큰을 가지고 있으며 설치비로 6토큰씩 냈다. 가로등 설치비는 24토큰이고, 설치되면 각 주민은 편익 10을 얻는다. 전체 납부액과 설치 후 각자의 남은 토큰·편익의 합을 구하시오.",["전체 납부액","설치 후 각자의 남은 토큰과 편익의 합"],[24,14],"전체 납부액은 6×4=24토큰으로 설치비가 모두 모인다. 각 주민은 6토큰을 내고 4토큰을 남기며, 가로등에서 편익 10을 얻는다. 남은 토큰과 편익의 합은 4+10=14이다."),
cg41("납부액과 가로등 설치",[6,6,6],"다른 주민이 낸 돈은 모두 18토큰이다. 내가 6토큰을 내면 24토큰이 모여 가로등이 설치되고, 남은 토큰과 편익의 합은 10−6+10=14이다.\n\n0토큰이나 4토큰을 내면 설치에 실패한다. 낸 금액만 돌려받으므로 처음과 같이 총 10토큰을 보유한다. 10토큰을 내면 설치되지만 남은 토큰과 편익의 합은 10이다. 따라서 제시된 납부액 중 6토큰이 가장 유리하다."),
cg41('이미 모인 비용',[8,8,8],"다른 주민만으로 8+8+8=24토큰이 모였다. 내가 비용을 내지 않아도 가로등이 설치된다. 0토큰을 내면 보유 토큰 10을 그대로 남기고 편익 10을 얻으므로 합은 20이다. 비용을 더 내면 남는 토큰만 줄어드므로 0토큰이 가장 유리하다."),
cf41("가로등 설치 조건",["다른 주민의 납부액 합계와 설치비가 모두 24이면","가로등을 설치할 수 없다","."],1,["가로등을 설치할 수 있다","다른 납부액과 관계없이 언제나 설치할 수 없다","설치 여부를 판단할 정보가 전혀 없다"],0,"다른 주민이 낸 금액이 24토큰이고 설치비도 24토큰이면 필요한 비용이 모두 모인 것이다. 따라서 가로등을 설치할 수 있다. 비용을 내지 않고 이용하는 사람이 있어도 모금액이 충분하면 설치에 성공한다."),
cp41("공공재 공급과 정부","공공재가 시장에서 충분히 공급되지 않을 때 정부가 할 수 있는 역할은?",['공공재 공급에 직접 참여','공공재의 존재를 금지','모든 소비자의 편익을 없앰'],0,"공공재는 대가를 내지 않은 사람의 소비를 막기 어려워 민간 기업이 생산을 통해 이윤을 얻기 어렵다. 정부는 공공재 생산과 공급에 직접 참여하여 공급 부족을 보완할 수 있다."),
ci41("가격 담합의 근거","다음 자료 중 업체들이 가격을 담합하였음을 보여 주는 근거로 가장 적절한 것은?",['세 업체의 판매 가격이 같다.','업체들이 가격을 함께 올리기로 합의한 문서가 있다.','포장 색이 서로 다르다.'],["여러 업체의 판매 가격이 같다는 사실만으로 담합을 확인할 수 있다.","업체들이 가격을 함께 올리기로 합의한 문서가 있다.","업체 수가 적다는 사실만으로 담합을 확인할 수 있다."],1,"업체들이 가격 인상에 합의한 문서는 서로 경쟁하지 않고 가격을 함께 정했다는 근거이다. 반면 판매 가격이 같거나 업체 수가 적다는 사실만으로 실제 합의가 있었다고 단정할 수는 없다.",[1]),
ci41("판매자와 구매자의 정보 차이","중고 물품 거래에 관한 두 자료를 읽고 옳은 설명을 고르시오.",['판매자는 제품의 상태를 알고 있다.','구매자는 제품의 상태를 알지 못한다.'],['정보의 비대칭성이 있다.','모두 같은 정보를 갖는다.','이자 지급 여부만의 문제이다.'],0,"판매자는 제품의 상태를 알지만 구매자는 알지 못한다. 거래에 필요한 정보가 두 당사자 사이에 다르므로 정보의 비대칭성이 나타난다."),
cp41("정보의 비대칭성을 줄이는 방법","판매자와 구매자 사이의 제품 정보 차이를 줄이는 데 도움이 되는 것은?",['광고 배경색','판매자의 취미','상태 검사 결과와 품질 보증'],2,"제품 상태의 검사 결과를 제공하면 구매자가 품질을 파악하기 쉬워진다. 품질 보증 역시 거래의 불확실성을 줄이는 데 도움이 된다. 이러한 제도는 정보의 비대칭성을 개선할 수 있다."),
cm41("시장 실패의 유형","각 사례에 해당하는 시장 실패의 원인을 고르시오.",["가로등 설치에 필요한 모금액이 부족하다.","업체들이 가격을 함께 올리기로 합의한다.","판매자가 아는 제품 상태를 구매자는 모른다.","생산 오염으로 입은 피해를 보상받지 못한다."],['공공재 부족','불공정 경쟁','정보의 비대칭성','외부 불경제'],[0,1,2,3],"가로등 공급 부족은 공공재의 특성과 관련된다. 업체들의 가격 인상 합의는 경쟁을 제한하는 담합이다. 판매자와 구매자의 제품 정보 차이는 정보의 비대칭성이고, 보상되지 않은 생산 오염 피해는 외부 불경제이다.")
],[cg41("부족한 설치비와 나의 납부액",[8,6,4],"다른 주민의 납부액은 8+6+4=18토큰이다. 내가 6토큰을 내면 총 24토큰이 모여 설치에 성공하며, 남은 토큰과 편익의 합은 14이다. 0토큰이나 4토큰을 내면 설치에 실패하고, 10토큰을 내면 설치 후 합이 10이므로 6토큰이 가장 유리하다."),cm41("비배제성과 비경합성","각 설명에 해당하는 특성을 고르시오.",["대가를 내지 않은 사람을 소비에서 배제할 수 없다.","한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는다."],['비배제성','비경합성'],[0,1],"대가를 내지 않은 사람을 소비에서 배제할 수 없는 것은 비배제성이다. 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 것은 비경합성이다.")],cm41("경쟁·정보·공공재의 구별","각 자료에 나타난 문제나 재화의 특성을 고르시오.",["여러 판매자가 공급 수량을 함께 제한하기로 합의한 문서가 있다.","판매자는 제품의 결함을 알지만 구매자는 모른다.","가로등 비용을 내지 않은 사람도 불빛을 이용할 수 있다."],['공정한 경쟁의 제한','정보의 비대칭성','공공재의 비배제성'],[0,1,2],"판매자들이 공급량을 함께 제한하기로 합의한 것은 경쟁을 제한하는 행위이다. 제품의 결함을 판매자만 아는 것은 정보의 비대칭성이다. 가로등 비용을 내지 않은 사람도 불빛을 이용할 수 있는 것은 비배제성이다."));
addCourse41(7,"경제 주체의 역할과 책임",3,"정부, 기업가, 노동자, 소비자가 지속가능발전을 위해 해야 할 일을 알아보자.",['E77','C97'],[
cm41("경제 주체의 역할","각 활동을 담당하는 경제 주체를 고르시오.",['공정 경쟁 질서 마련','위험을 감수한 기술 혁신','노동권 추구와 생산 참여','소비가 사회에 미치는 영향 고려'],['정부','기업가','노동자','소비자'],[0,1,2,3],"정부는 공정한 경쟁 질서를 마련한다. 기업가는 위험을 감수하며 기술 혁신과 새로운 시장 개척을 추진한다. 노동자는 자신의 권리를 추구하며 생산에 참여하고, 소비자는 소비가 사회에 미치는 영향을 고려한다."),
ci41("기업가 정신과 기술 혁신","다음 자료에 나타난 기업의 활동에 대한 설명으로 옳은 것은?",['새로운 기술의 성공은 확정되지 않았다.','회사는 위험을 검토하면서 새로운 시장을 개척한다.','사무실 의자는 초록색이다.'],['위험이 있으므로 기업가 정신이 아니다.','위험과 불확실성을 감수한 혁신과 도전이다.','무조건 안전한 것만 하는 정신이다.'],1,"성공 여부가 불확실한 기술에 투자하고 새로운 시장에 도전하는 모습에서 기업가 정신을 찾을 수 있다. 기업가 정신은 이윤을 추구하는 과정에서 위험과 불확실성을 무릅쓰고 도전하는 정신이다.",[0,1]),
cm41('노동 3권','교재의 개념을 연결하세요.',['노동조합 조직·가입','노동조합을 통한 사용자와의 협상','협상 결렬 시 파업 등 쟁의 행위'],['단결권','단체 행동권','단체 교섭권'],[0,2,1],"노동조합을 조직하거나 가입하는 것은 단결권의 행사이다. 노동조합을 통해 사용자와 임금이나 근로 조건을 협상하는 것은 단체 교섭권, 파업 등 쟁의 행위를 하는 것은 단체 행동권과 관련된다."),
cf41("기업의 사회적 책임",['기업의 사회적 책임은','이윤만 고려하고 노동자 권리를 무시하는 것','이다.'],1,['법규와 권리를 존중하고 사회적 영향을 고려하는 것','사회에 미치는 영향을 숨기는 것','소비자 안전을 배제하는 것'],0,"기업은 이윤을 추구하면서도 법규를 준수하고 노동자와 소비자의 권리를 존중해야 한다. 기업 활동이 지역 사회와 환경에 미치는 영향을 고려하여 사회적 책임을 다할 필요가 있다."),
cb41("기업 활동을 검토할 자료","예산 9 안에서 노동, 환경, 소비자 정보에 관한 문서를 각각 1개 이상 준비하시오. 각 항목은 최대 1개까지 선택할 수 있다. 표의 값은 해당 항목을 선택했을 때 얻는 문서의 수이다.",[['재교육 검토서',4,[1,0,0],1],['환경 설비 검토서',3,[0,1,0],1],['품질 공개 계획',2,[0,0,1],1],['장식 변경',2,[0,0,0],1]],['노동 문서','환경 문서','정보 문서'],[1,1,1],[null,null,null],9,[1,1,1,0],"재교육 검토서, 환경 설비 검토서, 품질 공개 계획을 고르면 세 분야의 문서를 모두 준비할 수 있다. 비용은 4+3+2=9로 예산과 같다. 장식 변경은 필요한 문서를 제공하지 않는다."),
cp41("윤리적 소비와 합리적 소비","갑은 윤리적 상품을 구매하며 얻는 만족을 편익에 포함하고, 그 편익과 기회비용을 비교하였다. 이러한 소비에 대한 설명으로 옳은 것은?",["항상 같다.",'그렇지 않다. 윤리적이면서 합리적일 수 있다.','가격 정보만으로 언제나 결론이 정해진다.'],1,"윤리적 가치를 실천하면서 얻는 만족도 편익에 포함될 수 있다. 이를 고려한 순편익이 가장 큰 대안을 선택한다면 윤리적이면서 합리적인 소비가 가능하다."),
cm41("정부의 문제 해결 방안","각 문제를 해결하는 데 알맞은 정부의 대응을 고르시오.",['정보의 비대칭성','공공재 부족','외부 경제','경제적 불평등'],['품질 보증·정보 표시','공공재 생산','보조금 등 촉진','소득 재분배'],[0,1,2,3],"품질 보증과 정보 표시는 정보의 비대칭성을 줄이는 데 도움이 된다. 정부의 공공재 생산은 공급 부족을 보완한다. 보조금은 외부 경제가 발생하는 활동을 늘릴 수 있으며, 소득 재분배는 경제적 불평등을 완화하기 위한 역할이다."),
ci41("친환경 광고를 확인할 자료","다음 자료를 바탕으로 친환경 광고에 대해 내린 판단으로 옳은 것은?",['광고에 녹색 잎 그림이 있다.','실제 생산 과정의 자원 사용·폐기물 자료를 확인할 수 있다.','품질·노동 조건에 대한 정보도 비교할 수 있다.'],['그림만 있으면 검토가 끝난다.','실제 과정과 관련 정보를 확인해야 한다.','상품 이름이 길수록 윤리적이다.'],1,"친환경 광고의 내용이 사실인지 알려면 생산 과정의 자원 사용량과 폐기물 등에 관한 자료가 필요하다. 윤리적 소비를 위해서는 상품의 품질과 노동 조건도 살펴볼 수 있다. 광고에 사용된 그림은 이러한 사실을 뒷받침하는 근거가 되기 어렵다.",[1,2]),
cu41("지속가능발전을 위한 실천","지속가능발전을 위한 실천으로 적절한 것을 모두 고르시오.",['노동자의 권리를 존중한다.','소비자 안전과 관련 정보를 고려한다.','미래 세대의 필요 충족 능력을 고려한다.','현재 이윤을 위해 사회적 영향은 무조건 제외한다.'],[0,1,2],"지속가능발전은 경제적 성과와 함께 사회적 책임, 환경 보전, 미래 세대의 필요를 고려한다. 현재의 이윤만을 위해 노동자의 권리나 소비자의 안전을 무시하는 것은 적절하지 않다."),
cp41("개념 적용 문제","소비자가 재화와 서비스의 종류나 수량을 결정하는 데 결정적인 권한을 가진다는 개념은?",['소비자 주권','단체 교섭권','매몰 비용'],0,"소비자 주권이다. 소비자가 무엇을 얼마나 구매하는지는 기업이 어떤 상품을 얼마나 생산할지에 영향을 미친다.")
],[cp41("윤리적 소비와 합리성","윤리적 소비와 합리적 소비의 관계에 대한 설명으로 옳은 것은?",['윤리적 소비는 무조건 비합리적이다.','윤리적 소비와 합리적 소비는 양립할 수 있다.',"소비자의 만족감은 언제나 0이다."],1,"윤리적 소비에서 얻는 만족도 편익에 포함될 수 있다. 그 편익과 기회비용을 고려하여 순편익이 가장 큰 대안을 선택한다면 윤리적 소비가 합리적 소비일 수 있다."),cm41("활동에 따른 경제 주체의 구분","각 활동을 하는 경제 주체를 고르시오.",['기술 혁신의 위험 감수','노동조합을 통한 협상','제품 선택으로 생산에 영향'],['기업가','노동자','소비자'],[0,1,2],"기술 혁신의 위험을 감수하는 주체는 기업가이다. 노동조합을 통해 근로 조건을 협상하는 주체는 노동자이고, 상품 선택으로 생산에 영향을 미치는 주체는 소비자이다.")],cn41("윤리적 만족을 포함한 선택","A의 편익은 16, 가격은 7이다. B의 편익은 윤리적 만족을 포함하여 22이고 가격은 11이다. 두 상품 중 하나만 선택하며, 제시된 편익과 비용만 고려한다. 각 상품의 편익에서 가격을 뺀 값을 구하시오.",["A 편익−명시적 비용","B 편익−명시적 비용"],[9,11],"A는 16−7=9, B는 22−11=11이다. B의 가격은 더 높지만 윤리적 만족을 포함한 편익도 더 크다. 두 대안의 편익과 비용을 함께 비교하면 B를 선택하는 것이 유리하다."));
COURSE41.tasks.find(t=>t.id==='C01-02').prompt="다음 네 가지 자본주의를 등장한 순서대로 배열해 보자.";
COURSE41.tasks.find(t=>t.id==='X01-1').prompt="독점 자본주의를 별도 단계로 구분할 때, 다음 다섯 단계를 등장한 순서대로 배열해 보자.";
function addLesson41(ch,no,title,goal,paragraphs,example,steps,result,tip,caution,check,refs){const x={id:'L'+String(ch).padStart(2,'0')+'-'+no,ch,no,title,goal,paragraphs,example,steps,result,tip,caution,check,refs,origin:""};COURSE41.lessons.push(x);COURSE41.chapters[ch-1].lessons.push(x.id);}
addLesson41(1,1,"자본주의의 의미와 특징","자본주의의 의미와 세 가지 특징을 알아보자.",[
"자본주의는 생산 수단의 사적 소유를 인정하고, 시장에서 자유로운 경쟁과 교환을 통해 경제활동이 이루어지는 경제 체제이다.",
"① 사유 재산권의 보장\n개인은 자유롭게 재산을 획득하고 사용할 수 있다. 공장이나 기계와 같은 생산 수단도 개인이나 기업이 소유할 수 있다.\n\n② 시장의 기능 활성화\n상품은 시장에서 결정된 가격에 따라 거래된다. 경제 주체는 시장 가격을 고려하여 생산과 소비를 결정한다.\n\n③ 경제활동의 자유 보장\n경제 주체는 자유롭게 경제활동을 하며 사적 이익을 추구할 수 있다. 기업은 이윤을 얻기 위해 상품을 생산하고, 소비자는 자신의 필요에 따라 상품을 구입한다.",
"자본주의가 전개되는 과정에서 정부의 역할에 대한 입장은 달라졌다. 산업 자본주의에서는 자유로운 경제활동을 중시하여 정부의 시장 개입을 최소화하려 했다. 반면 대공황 이후 등장한 수정 자본주의에서는 시장 실패를 해결하기 위한 정부의 적극적인 개입을 강조했다.\n\n수정 자본주의는 자본주의의 기본 틀을 유지하면서 정부의 역할을 확대하려는 입장이다."
],"생산자가 개인 소유의 설비로 상품을 만들고, 소비자는 가격과 상품에서 얻는 만족을 비교하여 구매한다. 이 사례에 나타난 자본주의의 특징을 설명해 보자.",[
"생산자가 설비를 소유한다는 점에서 사유 재산권의 보장이 나타난다.","소비자가 시장 가격을 고려하여 상품을 구매한다는 점에서 시장의 기능을 확인할 수 있다.","생산자와 소비자가 각각 생산과 구매를 결정한다는 점에서 경제활동의 자유가 나타난다."
],"사유 재산권의 보장, 시장의 기능 활성화, 경제활동의 자유 보장이 모두 나타난다.","공장이나 기계의 사적 소유는 사유 재산권, 시장 가격을 고려한 거래는 시장의 기능, 생산과 소비에 대한 자율적 결정은 경제활동의 자유에 해당한다.","",{q:"자본주의의 특징으로 옳은 것은?",o:['생산 수단의 사적 소유 인정','모든 경제활동의 자유 부정'],a:0,why:"자본주의에서는 생산 수단의 사적 소유를 인정하고, 경제 주체의 자유로운 경제활동을 보장한다."},['E75','V64']);
addLesson41(1,2,"상업·산업 자본주의와 독점 자본주의","자본주의의 전개 과정과 각 시기의 특징을 알아보자.",[
"상업 자본주의는 상품의 유통 과정에서 이윤을 얻는 것을 중시하였다. 신항로 개척으로 교역이 확대되면서 상인들은 해외에서 들여온 상품을 판매하여 이윤을 얻었다. 절대 왕정은 국가의 부를 늘리기 위해 국내 산업을 보호하고 수출을 장려하는 중상주의 정책을 추진하였다. 이러한 정책은 상업 자본주의의 발달을 뒷받침하였다.",
"산업 혁명으로 기계를 이용한 대량 생산이 가능해졌다. 이에 따라 공장과 기계를 소유한 자본가들이 상품을 생산하여 이윤을 얻는 산업 자본주의가 발달하였다. 상업 자본주의가 상품의 유통을 중시했다면 산업 자본주의는 상품의 생산을 중시하였다.\n\n자본가들은 자유롭게 상품을 생산하고 판매할 수 있기를 요구하였다. 애덤 스미스는 자유방임주의를 바탕으로 정부의 시장 개입을 최소화해야 한다고 주장하였다. 그가 말한 ‘보이지 않는 손’은 자원이 효율적으로 배분되도록 하는 시장 가격의 기능을 뜻한다.",
"산업 자본주의가 발달하면서 소수의 거대 기업이 시장을 지배하는 독점 자본주의가 나타났다. 거대 기업의 시장 지배력이 커지면 자유로운 경쟁이 제한되고 자원이 효율적으로 배분되기 어려워진다.\n\n자본주의의 전개 과정에서 독점 자본주의를 별도 단계로 구분하기도 한다. 이 경우 상업 자본주의, 산업 자본주의, 독점 자본주의, 수정 자본주의, 신자유주의의 순서로 정리한다."
],"자료 A는 교역을 장려하는 정책 아래 상인이 상품 유통으로 이윤을 얻는 모습을, B는 기계 설비를 이용한 대량 생산을, C는 소수 거대 기업의 시장 지배를 설명한다. 각 자료에 해당하는 자본주의의 유형을 구분해 보자.",[
"A는 교역 장려와 상품 유통을 통한 이윤 추구가 나타나므로 상업 자본주의에 해당한다.","B는 기계 설비를 이용한 대량 생산이 나타나므로 산업 자본주의에 해당한다.","C는 소수의 거대 기업이 시장을 지배하므로 독점 자본주의에 해당한다."
],"A는 상업 자본주의, B는 산업 자본주의, C는 독점 자본주의이다.","상업 자본주의는 상품의 유통, 산업 자본주의는 상품의 생산, 독점 자본주의는 소수 거대 기업의 시장 지배가 특징이다.","독점 자본주의를 별도로 구분하지 않는 네 단계 배열에서는 제시된 상업 자본주의, 산업 자본주의, 수정 자본주의, 신자유주의를 시대순으로 정리한다.",{q:"산업 자본주의와 수정 자본주의 사이에서 소수 거대 기업이 시장을 지배한 시기를 별도로 구분한 것은?",o:['독점 자본주의','금융 생활 설계'],a:0,why:"소수의 거대 기업이 시장에서 강력한 지배력을 행사한 시기를 독점 자본주의로 구분한다."},['E75','V62']);
addLesson41(1,3,"수정 자본주의와 신자유주의","수정 자본주의와 신자유주의의 등장 배경과 정책을 비교해 보자.",[
"대공황이 발생하면서 기업이 도산하고 실업자가 크게 늘어났다. 시장에 경제활동을 맡기는 것만으로는 이러한 문제를 해결하기 어렵다는 인식이 확산되었다. 수정 자본주의는 정부의 적극적인 시장 개입을 통해 시장 실패를 해결하려는 입장이다. 자본주의의 기본 틀을 유지하면서 시장의 한계를 보완하는 정부의 역할을 강조한다.",
"케인스는 대공황의 원인을 유효 수요의 부족에서 찾았다. 유효 수요란 상품을 구매할 의사와 능력을 갖춘 수요이다. 상품을 사고 싶어도 이를 구입할 돈이 없다면 구매로 이어지기 어렵다.\n\n정부가 공공사업을 추진하면 실업자에게 일자리를 제공할 수 있다. 일자리를 얻은 사람들은 임금을 받고, 그 소득으로 상품을 구입한다. 케인스는 이처럼 정부가 지출을 늘려 고용과 수요를 확대해야 한다고 보았다.",
"석유 파동 이후 경기 침체와 물가 상승이 동시에 나타나는 스태그플레이션이 발생하였다. 이에 대한 정부 대응의 한계가 드러나고, 지나친 시장 개입과 복지 확대에 따른 비효율 및 재정 악화가 문제로 지적되었다.\n\n이러한 배경에서 신자유주의가 등장하였다. 신자유주의는 정부의 역할을 줄이고 시장의 기능과 자유로운 경제활동을 강화해야 한다고 본다. 공기업 민영화, 복지 축소, 노동 시장의 유연화 등이 대표적인 정책이다."
],"A는 수요 부족과 실업을 해결하기 위해 정부가 적극적으로 개입해야 한다고 주장한다. B는 지나치게 커진 정부의 역할을 줄이고 민간의 자유로운 활동을 확대해야 한다고 주장한다. 두 주장이 각각 어떤 입장에 해당하는지 구분해 보자.",[
"A는 시장의 한계를 보완하기 위한 정부의 적극적인 개입을 강조한다.","B는 정부 개입에 따른 비효율을 줄이고 시장의 기능을 강화해야 한다고 본다.","따라서 A는 수정 자본주의, B는 신자유주의에 해당한다."
],"수정 자본주의는 시장 실패를 해결하는 정부의 역할을, 신자유주의는 정부 역할의 축소와 시장 기능의 강화를 강조한다.","대공황과 유효 수요 확대는 수정 자본주의, 스태그플레이션과 정부 역할 축소는 신자유주의와 관련된다.","",{q:"대공황 이후 공공사업을 통해 고용과 유효 수요를 늘리려는 입장은?",o:['수정 자본주의','중상주의의 교역 장려'],a:0,why:"수정 자본주의는 정부의 적극적인 시장 개입을 강조한다. 공공사업을 통한 고용과 수요의 확대는 그 대표적인 정책이다."},['E75','V62']);
addLesson41(2,1,"기본적인 경제 문제와 경제 체제","기본적인 경제 문제와 경제 체제의 의미를 알아보자.",[
"자원이 희소하기 때문에 모든 재화와 서비스를 원하는 만큼 생산할 수는 없다. 따라서 무엇을 얼마나 생산할 것인지, 어떻게 생산할 것인지, 누구를 위해 생산할 것인지를 결정해야 한다.\n\n무엇을 얼마나 생산할 것인지는 생산물의 종류와 수량에 관한 문제이다. 어떻게 생산할 것인지는 생산 방법의 문제이며, 누구를 위해 생산할 것인지는 분배의 문제이다. 이러한 기본적인 경제 문제를 해결하기 위해 합의된 제도나 방식을 경제 체제라고 한다.",
"시장경제 체제에서는 가계와 기업 등 민간 경제 주체가 각자의 이익을 추구하며 생산과 소비를 결정한다. 이때 시장 가격이 자원 배분의 기준이 된다.\n\n소비자들이 새로운 형태의 상품을 선호하면 그 상품에 대한 수요가 증가한다. 생산자는 판매 가격과 예상 이익을 고려하여 생산을 조정한다. 이처럼 시장 가격은 생산자와 소비자의 경제활동에 필요한 정보를 제공한다.",
"계획경제 체제에서는 정부의 계획과 명령에 따라 기본적인 경제 문제를 해결한다. 정부가 필요한 상품의 종류와 수량을 정하고, 생산에 사용할 자원을 배분하며, 생산물의 분배 방식을 결정한다. 민간 경제 주체의 자율적 선택과 시장 가격을 중시하는 시장경제 체제와 차이가 있다."
],"소비자들이 새로운 형태의 상품을 선호하자 생산자들이 판매 가능성과 시장 가격을 고려하여 생산 계획을 조정하였다. 이 사례에 나타난 경제 체제의 특징을 설명해 보자.",[
"소비자의 선호가 바뀌면서 상품에 대한 수요가 달라졌다.","생산자는 시장 가격과 예상 이익을 고려하여 생산을 조정하였다.","민간 경제 주체가 시장 가격을 바탕으로 생산을 결정하므로 시장경제 체제의 특징이 나타난다."
],"시장경제 체제에서는 민간 경제 주체가 시장 가격을 고려하여 생산과 소비를 결정한다.","생산할 상품과 수량은 ‘무엇을 얼마나’, 생산 기술과 방법은 ‘어떻게’, 분배 방식은 ‘누구를 위해’ 생산할 것인가의 문제이다.","",{q:"어떤 생산 기술을 사용할지 결정하는 것은 다음 중 어느 문제에 해당하는가?",o:['어떻게 생산할 것인가의 문제','상품을 누구에게 분배할 것인가의 문제'],a:0,why:"생산 기술의 선택은 생산 방법을 결정하는 문제이므로 ‘어떻게 생산할 것인가’에 해당한다."},['E76','V64']);
addLesson41(2,2,"시장경제 체제와 계획경제 체제의 비교","두 경제 체제의 장점과 한계를 비교해 보자.",[
"시장경제 체제에서는 가계와 기업 등 민간 경제 주체가 시장 가격을 고려하여 생산과 소비를 결정한다. 사유 재산권과 자유로운 경제활동이 보장되므로 개인이 능력과 창의성을 발휘하기에 유리하다. 또한 시장 가격을 통해 자원이 효율적으로 배분될 수 있다.\n\n그러나 빈부 격차가 발생하여 분배의 형평성이 낮아질 수 있다. 급격한 경기 변동으로 경제가 불안정해질 수 있다는 한계도 있다.",
"계획경제 체제에서는 정부가 생산과 자원 배분을 계획하고 통제한다. 정부의 계획에 따라 자원을 배분하므로 부와 소득의 불평등을 완화하고 사회의 주요 목표를 신속하게 달성하는 데 유리하다.\n\n반면 사유 재산권과 경제활동의 자유가 제한되어 개인의 경제적 유인이 부족해질 수 있다. 이로 인해 능력과 창의성이 충분히 발휘되기 어렵고, 자원이 비효율적으로 배분될 수 있다. 정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기도 어렵다.",
"시장경제 체제는 자원 배분의 효율성을, 계획경제 체제는 분배의 형평성을 상대적으로 중시한다. 시장경제 체제에서는 자유로운 경제활동이 효율적인 자원 배분에 도움이 되지만 불평등이 발생할 수 있다. 계획경제 체제에서는 정부의 계획이 불평등 완화에 도움이 되지만 경제적 유인 부족으로 효율성이 낮아질 수 있다."
],"A에서는 민간 경제 주체가 시장 가격을 고려하여 생산을 결정한다. B에서는 정부가 필요한 생산량을 정하여 생산을 지시한다. A와 B의 경제 체제를 구분하고 각각의 장점과 한계를 설명해 보자.",[
"A는 민간의 자율적 선택과 시장 가격을 중시하므로 시장경제 체제이다.","B는 정부의 계획과 명령에 따라 생산하므로 계획경제 체제이다.","시장경제 체제는 개인의 능력과 창의성 발휘에 유리하지만 빈부 격차가 발생할 수 있다. 계획경제 체제는 불평등 완화에 유리하지만 경제적 유인이 부족해질 수 있다."
],"A는 시장경제 체제, B는 계획경제 체제이다. 두 체제는 경제 문제의 해결 방식과 장점·한계가 다르다.","시장의 자율적 조정은 시장경제 체제, 정부의 계획과 통제는 계획경제 체제의 특징이다.","",{q:"계획경제 체제의 한계로 옳은 것은?",o:['소비자의 다양한 욕구를 반영한 계획 수립의 어려움','정부의 계획이 존재하지 않음'],a:0,why:"정부가 소비자의 다양한 욕구를 모두 파악하여 생산 계획에 반영하기는 어렵다."},['E76','V64']);
addLesson41(2,3,"혼합 경제 체제와 경제적 유인","혼합 경제 체제의 특징과 경제적 유인이 선택에 미치는 영향을 알아보자.",[
"혼합 경제 체제는 시장경제적 요소와 계획경제적 요소가 결합된 경제 체제이다. 시장을 통해 이루어지는 민간의 경제활동과 정부의 개입이 함께 나타난다. 민간이 시장에서 상품을 거래하고 정부가 공공재를 공급하는 것이 그 예이다. 시장과 정부의 역할이 결합되는 정도는 국가가 추구하는 목표에 따라 다르다.",
"경제적 유인은 사람들이 어떤 행동을 하거나 하지 않도록 동기를 부여하는 금전적 보상이나 손실이다. 보상이 늘어나거나 지출할 비용이 줄어들면 해당 활동이 이전보다 유리해질 수 있다. 반대로 부담해야 할 비용이 늘어나면 그 활동을 줄이려는 동기가 생길 수 있다.",
"한 대안의 보상이 늘어났다면 변경된 편익과 비용으로 다른 대안과 비교한다. 두 대안 중 하나만 선택할 때에는 각각의 편익에서 명시적 비용을 뺀 값으로 어느 쪽이 유리한지 비교할 수 있다. 보상이 늘어난 뒤에도 다른 대안이 더 유리하다면 선택은 바뀌지 않는다."
],"A의 편익은 15, 명시적 비용은 5이고, B의 편익은 16, 명시적 비용은 8이다. 두 대안 중 하나만 선택한다. 이후 B를 선택할 때 받는 보상이 4 늘어났다. 합리적인 선택은 어떻게 달라질까?",[
"처음에는 편익에서 명시적 비용을 뺀 값이 A는 15−5=10, B는 16−8=8이므로 A가 유리하다.","보상이 늘어난 뒤 B의 편익은 20이다. 명시적 비용을 빼면 20−8=12이다.","변경 후에는 B의 12가 A의 10보다 크므로 B가 유리하다."
],"B에서 받는 보상이 늘어나면서 합리적인 선택이 A에서 B로 바뀌었다.","경제적 유인의 변화는 선택의 편익이나 비용을 바꾸어 경제 주체의 행동에 영향을 준다.","편익에서 명시적 비용을 뺀 값과 순편익은 다르다. 순편익을 구하려면 암묵적 비용까지 빼야 한다.",{q:"민간의 시장 거래와 정부의 공공재 공급이 함께 나타나는 경제 체제는 어떻게 설명할 수 있는가?",o:['항상 모순이다.',"시장과 정부의 역할이 결합된 혼합 경제 체제로 설명할 수 있다."],a:1,why:"혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소가 함께 나타난다."},['E76','E77']);
addLesson41(3,1,"명시적 비용과 암묵적 비용","명시적 비용과 암묵적 비용을 구별하고 기회비용을 구해 보자.",[
"편익은 어떤 선택으로 얻는 이득이나 만족감이다. 공연을 보면서 얻는 만족과 일을 하고 받는 보수가 그 예이다. 명시적 비용은 선택에 따라 실제로 지불하는 금전적 비용이다. 공연을 보기 위해 지불하는 표 값이 이에 해당한다.",
"암묵적 비용은 어떤 대안을 선택하면서 포기한 다른 대안 중 가장 큰 가치이다. 공연을 보는 대신 일을 할 수 있었다면, 일을 해서 얻을 수 있었던 가치를 포기한 것이다. 일을 하는 데에도 교통비와 같은 명시적 비용이 든다면, 보수에서 그 비용을 뺀 금액이 포기한 가치가 된다.",
"기회비용은 명시적 비용과 암묵적 비용을 합한 값이다. 공연을 선택할 때의 기회비용에는 표 값과 일을 했다면 얻을 수 있었던 가치가 모두 포함된다.\n\n순편익은 편익에서 기회비용을 뺀 값이다. 따라서 순편익을 구할 때에는 명시적 비용뿐 아니라 암묵적 비용도 빼야 한다."
],"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 표 값은 3만 원이다. 일을 하면 보수 8만 원을 받지만 교통비 1만 원이 든다. 공연을 선택할 때의 기회비용을 구해 보자.",[
"공연 표 값 3만 원은 공연을 보기 위해 직접 지출하는 돈이므로 명시적 비용이다.","일을 했다면 보수 8만 원을 받고 교통비 1만 원을 지출했을 것이다. 따라서 공연을 선택하면서 포기한 가치는 8−1=7만 원이며, 이 금액이 암묵적 비용이다.","기회비용은 명시적 비용과 암묵적 비용을 합한 3+7=10만 원이다."
],"공연 선택의 명시적 비용은 3만 원, 암묵적 비용은 7만 원, 기회비용은 10만 원이다.","포기한 대안에도 명시적 비용이 든다면, 그 대안의 편익에서 명시적 비용을 뺀 금액을 암묵적 비용으로 계산한다.","일을 하지 않으면 보수도 받지 못하지만 교통비도 지출하지 않는다. 따라서 포기한 가치는 보수 8만 원 전체가 아니라 교통비를 뺀 7만 원이다.",{q:"편익에서 명시적 비용만 뺀 값은 항상 순편익과 같은가?",o:["항상 같다.","그렇지 않다. 순편익은 편익에서 기회비용을 뺀 값이다."],a:1,why:"기회비용에는 명시적 비용과 암묵적 비용이 모두 포함된다. 순편익은 편익에서 두 비용을 모두 뺀 값이다."},['E76','B48']);
addLesson41(3,2,"두 대안의 기회비용과 순편익","두 대안의 기회비용과 순편익을 구하여 합리적인 선택을 찾아보자.",[
"A와 B 중 하나만 선택할 수 있다면 A를 선택할 때 B를 포기한다. B의 편익을 얻으려면 B의 명시적 비용도 지출해야 하므로, B를 포기한 가치는 B의 편익에서 명시적 비용을 뺀 값이다. 이 값이 A 선택의 암묵적 비용이다.\n\n반대로 B를 선택하면 A를 포기하므로, B 선택의 암묵적 비용은 A의 편익에서 명시적 비용을 뺀 값이다.",
"각 대안의 명시적 비용에 암묵적 비용을 더하면 기회비용을 구할 수 있다. 편익에서 기회비용을 빼면 순편익이다.\n\n기회비용 = 명시적 비용 + 암묵적 비용\n순편익 = 편익 − 기회비용",
"합리적 선택은 순편익이 가장 큰 대안을 선택하는 것이다. 편익이 같다면 기회비용이 작은 대안이 유리하다. 그러나 편익이 다르면 기회비용이 큰 대안의 순편익이 더 클 수도 있다. 따라서 편익과 기회비용을 함께 비교해야 한다."
],"A의 편익은 25, 명시적 비용은 7이고, B의 편익은 32, 명시적 비용은 11이다. 두 대안 중 하나만 선택할 수 있으며 다른 대안이나 매몰 비용은 없다. 각 대안의 기회비용과 순편익을 구해 보자.",[
"각 대안의 편익에서 명시적 비용을 빼면 A는 25−7=18, B는 32−11=21이다.","A를 선택하면 B를 포기한다. 암묵적 비용은 21이고 명시적 비용은 7이므로, A 선택의 기회비용은 7+21=28이다.","B를 선택하면 A를 포기한다. 암묵적 비용은 18이고 명시적 비용은 11이므로, B 선택의 기회비용은 11+18=29이다.","편익에서 기회비용을 빼면 A의 순편익은 25−28=−3, B의 순편익은 32−29=3이다. B의 순편익이 더 크므로 B를 선택하는 것이 합리적이다."
],"A의 순편익은 −3, B의 순편익은 3이다. B의 기회비용은 더 크지만 편익의 차이가 더 커서 B가 유리하다.","A의 암묵적 비용에는 B를 포기한 가치를, B의 암묵적 비용에는 A를 포기한 가치를 넣는다.","이 예제에서는 A와 B 중 하나만 선택할 수 있다. 다른 대안이 추가되면 그 대안의 가치도 고려하여 암묵적 비용을 구해야 한다.",{q:"예제에서 A를 선택할 때의 순편익은 얼마인가?",o:['18','−3','28'],a:1,why:"A의 편익은 25, 기회비용은 28이다. 따라서 순편익은 25−28=−3이다."},['E76','B48']);
addLesson41(3,3,"세 대안 중 하나를 선택할 때의 기회비용","포기한 대안 중 가장 큰 가치를 찾아 기회비용을 계산해 보자.",[
"A, B, C 중 하나만 선택할 수 있다고 하자. A를 선택하면 B와 C를 모두 포기한다. 그러나 B와 C를 동시에 선택할 수 있었던 것은 아니므로 두 대안의 가치를 모두 더하지 않는다. A 선택의 암묵적 비용은 B와 C 중 더 큰 가치이다.",
"먼저 각 대안의 편익에서 명시적 비용을 뺀다. 그다음 선택하지 않은 대안들 가운데 이 값이 가장 큰 대안을 찾는다. 그 대안을 포기한 가치가 선택한 대안의 암묵적 비용이다. 여기에 명시적 비용을 더하면 기회비용이 된다.",
"편익에서 명시적 비용을 뺀 값이 가장 큰 대안을 선택하면, 그다음으로 큰 대안의 가치가 암묵적 비용이 된다. 따라서 최선의 선택에 따른 순편익은 가장 큰 값과 두 번째로 큰 값의 차이이다. 두 값이 같다면 두 대안의 순편익은 모두 0이며 어느 하나만 더 유리하지는 않다."
],"A의 편익과 명시적 비용은 각각 40과 12, B는 45와 14, C는 39와 10이다. 세 대안 중 하나만 선택할 때 각 대안의 기회비용과 순편익을 구해 보자.",[
"편익에서 명시적 비용을 빼면 A는 40−12=28, B는 45−14=31, C는 39−10=29이다.","A나 C를 선택하면 가치가 가장 큰 B를 포기하므로 암묵적 비용은 31이다. B를 선택하면 A와 C 중 가치가 더 큰 C를 포기하므로 암묵적 비용은 29이다.","명시적 비용과 암묵적 비용을 더하면 기회비용은 A가 12+31=43, B가 14+29=43, C가 10+31=41이다.","편익에서 기회비용을 빼면 순편익은 A가 −3, B가 2, C가 −2이다. 따라서 B를 선택하는 것이 합리적이다."
],"B의 순편익이 2로 가장 크다. B를 선택할 때의 암묵적 비용은 포기한 A와 C 중 가치가 더 큰 C의 29이다.","선택한 대안을 제외한 뒤, 남은 대안들의 ‘편익−명시적 비용’ 중 가장 큰 값을 암묵적 비용으로 삼는다.","하나만 선택할 수 있는 대안들의 가치를 모두 더하면 암묵적 비용을 실제보다 크게 계산하게 된다.",{q:"A, B, C의 ‘편익−명시적 비용’이 각각 20, 27, 23이다. B 선택의 암묵적 비용은 얼마인가?",o:['27','43','23'],a:2,why:"B를 선택하면 A와 C를 포기한다. 두 값 중 큰 값은 C의 23이므로 암묵적 비용은 23이다."},['E76','B48']);
addLesson41(4,1,"매몰 비용과 합리적 선택","매몰 비용의 의미와 합리적 선택에서 이를 제외하는 이유를 알아보자.",[
"매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 사업을 계속하든 중단하든 돌려받을 수 없는 개발비가 이에 해당한다.",
"합리적으로 선택하려면 각 대안을 선택할 때 앞으로 얻을 편익과 부담할 비용을 비교해야 한다. 매몰 비용은 어느 대안을 선택하더라도 회수할 수 없으므로 현재의 선택에서 고려하지 않는다.\n\n기업이 사업을 계속할지 중단할지 고민하고 있다고 하자. 이미 지출한 개발비를 돌려받을 수 없다면, 개발비가 아깝다는 이유만으로 사업을 계속해서는 안 된다. 앞으로 얻을 편익과 추가로 지출할 비용을 고려해야 한다.",
"이미 지출했더라도 선택에 따라 돌려받을 수 있는 금액은 매몰 비용이 아니다. 그 금액을 돌려받을 수 있는지에 따라 각 대안의 유불리가 달라질 수 있기 때문이다. 현재의 선택으로 새롭게 발생하는 비용 역시 매몰 비용과 구별하여 계산한다."
],"과거에 지출한 개발비 40은 회수할 수 없다. 지금 A를 선택하면 편익 100과 명시적 비용 45가 발생하고, B를 선택하면 편익 95와 명시적 비용 35가 발생한다. 어느 대안을 선택하는 것이 유리한가?",[
"개발비 40은 A와 B 중 어느 대안을 선택해도 회수할 수 없으므로 매몰 비용이다. 현재의 선택에서는 제외한다.","각 대안의 편익에서 명시적 비용을 빼면 A는 100−45=55, B는 95−35=60이다.","B의 값이 더 크므로 B가 유리하다. 회수할 수 없는 과거 개발비만 80으로 달라져도 현재 대안의 편익과 비용은 같으므로 선택은 바뀌지 않는다."
],"B가 유리하다. 회수할 수 없는 과거 개발비는 현재의 선택에 영향을 주지 않는다.","매몰 비용은 과거에 지출했고 현재 어떤 선택을 하더라도 회수할 수 없는 비용이다.","이미 지출한 금액이라도 선택에 따라 돌려받을 수 있다면 그 반환금은 현재의 선택에 반영한다.",{q:"현재의 선택에 따라 앞으로 새로 발생하는 비용도 매몰 비용인가?",o:['그렇다.',"매몰 비용이 아니다. 선택의 편익과 함께 고려해야 한다."],a:1,why:"매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 앞으로 선택에 따라 새로 발생하는 비용은 이에 해당하지 않는다."},['E76','B48']);
addLesson41(4,2,"비용과 반환금의 변화","비용이 늘어나거나 반환금이 생겼을 때 합리적인 선택을 비교해 보자.",[
"앞으로 지출할 명시적 비용이 늘어나면 그 대안은 이전보다 불리해진다. 편익이 같아도 지출하는 금액이 많아지기 때문이다. 반면 이미 지출하여 회수할 수 없는 비용은 현재 어떤 대안을 선택하든 달라지지 않으므로 비교에서 제외한다.",
"특정 대안을 선택하면 돈을 돌려받는 계약이 생겼다면 그 반환금도 고려해야 한다. 반환금은 받을 수 있는 대안에만 더한다. 같은 대안을 선택하더라도 반환금을 받을 수 없었던 경우와 받을 수 있게 된 경우의 결과는 다르다.",
"두 대안의 편익에서 명시적 비용을 뺀 값이 같으면 두 대안은 동률이다. 어느 한 대안만 더 유리해지는 금액을 묻는다면 동률이 되는 값은 답이 될 수 없다. 금액이 정수로 제한되어 있다면 동률이 되는 값과 그다음 정수에서의 결과를 비교한다."
],"A의 편익과 명시적 비용은 각각 100과 45, B는 95와 35이다. 이후 B의 명시적 비용만 45로 증가하였다. 이어서 B를 선택하면 8을 돌려받는 계약이 생겼다. 각 경우에 어느 대안이 유리한지 구해 보자.",[
"처음에는 A의 ‘편익−명시적 비용’이 100−45=55, B는 95−35=60이므로 B가 유리하다.","B의 명시적 비용이 45로 늘어나면 B는 95−45=50이 된다. A는 55이므로 A가 유리하다.","B를 선택할 때 반환금 8을 받게 되면 B는 95+8−45=58이 된다. A의 55보다 크므로 다시 B가 유리하다."
],"B의 비용이 늘어나면 A가 유리해지고, B에 반환금이 생기면 다시 B가 유리해진다.","반환금이 생긴 경우에는 해당 대안에서 받을 금액에 반환금을 포함한 뒤 명시적 비용을 뺀다.","반환금이 이미 편익에 포함되어 있다면 다시 더하지 않는다.",{q:"A의 ‘편익−명시적 비용’은 55이고 B의 편익은 95이다. 두 대안이 동률이 되는 B의 명시적 비용은 얼마인가?",o:['40','55','150'],a:0,why:"B의 명시적 비용이 40이면 95−40=55로 A와 같아진다."},['E76','B48']);
addLesson41(4,3,"기회비용 표의 빈칸 구하기","편익과 비용의 관계를 이용하여 표의 빈칸을 구해 보자.",[
"기회비용은 명시적 비용과 암묵적 비용의 합이다. 따라서 기회비용에서 명시적 비용을 빼면 암묵적 비용을, 암묵적 비용을 빼면 명시적 비용을 구할 수 있다. 표의 빈칸을 채울 때에는 먼저 주어진 값이 편익인지, 명시적 비용인지, 암묵적 비용인지 구분한다.",
"A와 B 중 하나만 선택할 수 있다면 A 선택의 암묵적 비용은 B의 편익에서 명시적 비용을 뺀 값이다. 그러므로 B의 편익과 A의 암묵적 비용을 알면 B의 명시적 비용을 구할 수 있다.\n\nB의 명시적 비용 = B의 편익 − A 선택의 암묵적 비용",
"빈칸을 구한 뒤에는 명시적 비용과 암묵적 비용을 더해 주어진 기회비용과 일치하는지 확인한다. 대안이 셋 이상이면 선택하지 않은 대안 중 가장 큰 가치를 찾아야 한다. 이 경우 다른 대안 하나의 값만으로 암묵적 비용을 정할 수는 없다."
],"A와 B 중 하나만 선택할 수 있다. A 선택의 암묵적 비용은 24, B의 편익은 35, B 선택의 기회비용은 31이다. B의 명시적 비용과 A의 ‘편익−명시적 비용’을 구해 보자.",[
"A를 선택하면 B를 포기한다. 따라서 B의 편익 35에서 B의 명시적 비용을 뺀 값이 A의 암묵적 비용 24이다.","B의 명시적 비용은 35−24=11이다.","B의 암묵적 비용은 기회비용 31에서 명시적 비용 11을 뺀 20이다.","B를 선택하면 A를 포기하므로 A의 ‘편익−명시적 비용’은 20이다."
],"B의 명시적 비용은 11이고, A의 ‘편익−명시적 비용’은 20이다. B의 두 비용을 합하면 11+20=31로 주어진 기회비용과 일치한다.","기회비용에서 명시적 비용을 빼면 암묵적 비용이다. 두 대안 중 하나만 선택할 때에는 그 값이 다른 대안의 ‘편익−명시적 비용’과 같다.","대안이 셋 이상이면 선택하지 않은 대안들의 ‘편익−명시적 비용’ 중 가장 큰 값을 사용한다.",{q:"명시적 비용이 9이고 기회비용이 26일 때 암묵적 비용은 얼마인가?",o:['17','35','26'],a:0,why:"기회비용에서 명시적 비용을 빼면 26−9=17이다."},['E76','B48']);
addLesson41(5,1,"시장 실패와 외부 효과","시장 실패의 의미와 외부 경제·외부 불경제의 차이를 알아보자.",[
"시장 실패는 시장이 자원을 효율적으로 배분하지 못하는 상태이다. 개별 경제 주체가 자신의 편익과 비용을 고려하여 합리적으로 선택하더라도 사회 전체의 자원이 효율적으로 배분되지 않을 수 있다. 외부 효과, 공공재의 부족, 독과점 문제, 정보의 비대칭성 등이 시장 실패의 원인이 된다.",
"외부 효과는 한 경제 주체의 생산이나 소비가 다른 경제 주체에게 의도하지 않은 이익이나 손해를 주지만, 그에 대한 대가를 주고받지 않는 경우이다. 공장이 상품을 생산하면서 배출한 오염 물질로 인근 주민이 피해를 입었는데 공장이 이를 보상하지 않았다면 생산에 따른 외부 효과가 발생한 것이다.",
"다른 경제 주체에게 의도하지 않은 이익을 주고도 대가를 받지 않는 경우를 외부 경제라고 한다. 반대로 다른 경제 주체에게 의도하지 않은 손해를 주고도 대가를 지불하지 않는 경우를 외부 불경제라고 한다. 공장이 보상하지 않은 주민의 오염 피해는 외부 불경제에 해당한다."
],"공장이 상품을 생산하여 이익을 얻었다. 생산 과정에서 배출된 오염 물질로 이웃 주민이 피해를 입었지만, 공장은 그 피해를 보상하지 않았다. 이 사례에 해당하는 외부 효과를 설명해 보자.",[
"주민의 피해는 공장의 생산 활동에서 발생하였다.","오염 물질로 피해를 입은 사람은 공장 인근의 주민이다.","공장이 다른 경제 주체인 주민에게 피해를 주고도 보상하지 않았으므로 외부 불경제에 해당한다."
],"공장의 생산 활동에 따른 외부 불경제가 발생하였다.","대가 없이 다른 경제 주체에게 이익을 주면 외부 경제, 손해를 주면 외부 불경제이다.","상품을 사고 그 가격을 지불하는 거래는 외부 효과와 다르다. 외부 효과는 생산이나 소비의 영향에 대한 대가를 주고받지 않는 경우이다.",{q:"생산이나 소비로 다른 경제 주체에게 의도하지 않은 이익을 주고도 그 대가를 받지 않는 경우는?",o:['외부 경제','외부 불경제'],a:0,why:"다른 경제 주체에게 대가 없이 이익을 주므로 외부 경제에 해당한다."},['E76','E77']);
addLesson41(5,2,"외부 효과와 사회적 최적 생산량","외부 효과가 과다 생산이나 과소 생산을 일으키는 이유를 알아보자.",[
"외부 불경제가 발생하면 생산자나 소비자는 다른 사람에게 주는 피해를 충분히 고려하지 않은 채 활동량을 결정한다. 그 결과 사회적 최적 수준보다 많이 생산하거나 소비하게 된다. 과다 생산은 전년보다 많이 생산했다는 뜻이 아니라 사회적 최적 생산량보다 많이 생산했다는 뜻이다.",
"외부 경제가 발생하면 다른 사람에게 돌아가는 이익이 생산자나 소비자의 선택에 충분히 반영되지 않는다. 따라서 사회적 최적 수준보다 적게 생산하거나 소비하게 된다. 과소 생산 역시 사회적 최적 생산량을 기준으로 판단한다.",
"개인의 이익과 제3자의 피해를 같은 금액 단위로 제시한 경우에는, 개인의 이익에서 제3자의 피해를 뺀 값을 비교할 수 있다. 다른 효과가 없다고 가정하면 이 값이 가장 큰 활동량이 제3자의 피해까지 고려했을 때 가장 유리하다. 제3자에게 피해가 아니라 편익이 발생했다면 개인의 이익에 그 편익을 더한다."
],"활동량이 1, 2, 3일 때 개인의 이익은 각각 30, 48, 54이고 제3자의 피해는 각각 3, 10, 25이다. 이익과 피해는 같은 단위로 표시하며 다른 효과는 없다. 개인의 이익만 고려한 경우와 제3자의 피해까지 고려한 경우의 활동량을 비교해 보자.",[
"개인의 이익은 활동량이 3일 때 54로 가장 크다. 따라서 개인의 이익만 고려하면 활동량 3을 선택한다.","제3자의 피해를 빼면 활동량별 값은 30−3=27, 48−10=38, 54−25=29이다.","피해를 뺀 값은 활동량이 2일 때 38로 가장 크다. 따라서 제3자의 피해까지 고려하면 활동량 2가 유리하다."
],"개인은 활동량 3을 선택하지만, 제3자의 피해까지 고려하면 활동량 2가 유리하다.","개인의 이익이 가장 큰 활동량과 제3자의 영향까지 반영한 값이 가장 큰 활동량을 비교한다.","과다·과소 생산의 기준은 사회적 최적 생산량이다. 전년 생산량이나 다른 기업의 생산량과 비교하는 것이 아니다.",{q:"외부 경제가 발생한 경우 개인이 선택한 활동량은 2, 사회적 최적 활동량은 4이다. 이에 대한 설명으로 옳은 것은?",o:["사회적 최적 수준보다 적게 활동한다.","사회적 최적 수준보다 많이 활동한다."],a:0,why:"개인의 활동량 2가 사회적 최적 활동량 4보다 작으므로 과소 활동에 해당한다."},['E77']);
addLesson41(5,3,"외부 효과를 개선하는 세금과 보조금","세금과 보조금의 목적을 이해하고 총액을 계산해 보자.",[
"정부는 외부 불경제가 발생하는 활동에 세금이나 부담금을 부과하여 과다한 생산과 소비를 줄일 수 있다. 반대로 외부 경제가 발생하는 활동에는 세금을 감면하거나 보조금을 지급하여 부족한 생산과 소비를 늘릴 수 있다.\n\n외부 불경제: 세금·부담금 부과 → 생산·소비 억제\n외부 경제: 세금 감면·보조금 지급 → 생산·소비 촉진",
"생산 1단위당 부담금이 8이면 생산량이 2일 때 납부할 총부담금은 2×8=16이다. 생산자에게 남는 이익을 구하려면 납부 전 이익에서 총부담금을 빼야 한다. 보조금도 단위당 지급액에 활동량을 곱하여 총액을 구한다.",
"생산자가 낸 부담금은 정부의 수입이 된다. 생산자와 정부의 금액을 함께 계산하는 문제에서는 생산자의 납부 후 이익에 정부 수입을 더한다. 주민의 피해도 제시되었다면 이를 뺀다. 행정 비용 등 다른 효과가 있는지는 문제의 조건에 따른다."
],"생산량은 2, 부담금 납부 전 생산자 이익은 50, 주민 피해는 12이다. 생산 1단위당 부담금은 8이다. 정부 수입을 포함하고 다른 효과는 없을 때, 생산자 이익과 정부 수입에서 주민 피해를 뺀 합계를 구해 보자.",[
"총부담금은 생산량에 단위당 부담금을 곱한 2×8=16이다.","부담금을 낸 뒤 생산자에게 남는 이익은 50−16=34이다.","생산자가 낸 부담금 16은 정부의 수입이다.","생산자 이익 34와 정부 수입 16을 더하고 주민 피해 12를 빼면 34+16−12=38이다."
],"부담금 납부 후 생산자 이익은 34, 정부 수입은 16이다. 주민 피해까지 반영한 합계는 38이다.","단위당 부담금과 총부담금을 구별한다. 생산자 이익에서 빼는 금액은 총부담금이다.","생산자의 납부 후 이익에는 이미 부담금이 빠져 있다. 정부 수입과 합산할 때 부담금을 다시 빼지 않는다.",{q:"활동량이 3단위이고 단위당 보조금이 4일 때 보조금 총액은 얼마인가?",o:['4','7','12'],a:2,why:"단위당 보조금에 활동량을 곱하면 4×3=12이다."},['E77']);
addLesson41(6,1,"공공재의 비배제성과 비경합성","공공재의 두 특성과 무임승차가 나타나는 이유를 알아보자.",[
"공공재는 비배제성과 비경합성을 가진 재화나 서비스이다. 국방과 치안 서비스가 대표적인 예이다.\n\n비배제성은 대가를 지불하지 않은 사람을 소비에서 배제할 수 없는 특성이다. 가로등 설치비를 내지 않은 주민도 가로등의 불빛을 이용할 수 있다는 점에서 비배제성이 나타난다.",
"비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 한 주민이 가로등의 불빛을 이용하더라도 다른 주민의 이용 기회가 줄어들지 않는다는 점에서 비경합성이 나타난다.\n\n비배제성은 대가를 내지 않은 사람의 이용을 막을 수 있는지에 관한 특성이고, 비경합성은 한 사람의 이용이 다른 사람의 이용 기회를 줄이는지에 관한 특성이다.",
"공공재는 대가를 지불하지 않아도 이용할 수 있다. 따라서 비용을 부담하지 않고 혜택만 누리려는 무임승차가 나타날 수 있다.\n\n무임승차자가 많으면 민간 기업은 공공재를 생산해도 비용을 회수하고 이윤을 얻기 어렵다. 이 때문에 공공재의 생산을 시장에만 맡기면 사회에서 필요로 하는 만큼 충분히 공급되지 않을 수 있다. 정부는 공공재를 직접 공급하여 이러한 문제를 해결할 수 있다."
],"가로등 설치비를 내지 않은 주민도 가로등을 이용할 수 있다. 또한 한 주민이 불빛을 이용하더라도 다른 주민의 이용 기회는 줄어들지 않는다. 가로등에 나타나는 두 특성을 설명해 보자.",[
"설치비를 내지 않은 주민의 이용을 막을 수 없으므로 비배제성이 나타난다.","한 주민의 이용이 다른 주민의 이용 기회를 줄이지 않으므로 비경합성이 나타난다.","비용을 내지 않고도 이용할 수 있으므로 비용 부담을 피하려는 무임승차가 나타날 수 있다."
],"가로등은 비배제성과 비경합성을 가진다. 무임승차는 대가를 내지 않아도 이용할 수 있는 비배제성과 관련된다.","‘돈을 내지 않아도 이용할 수 있다’는 비배제성, ‘함께 이용해도 다른 사람의 이용 기회가 줄지 않는다’는 비경합성이다.","공급자가 정부인지보다 재화 자체의 비배제성과 비경합성이 공공재를 구분하는 기준이다. 이용 제한이나 혼잡 조건이 제시되었다면 그 조건도 고려한다.",{q:"한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성은?",o:['비배제성','비경합성'],a:1,why:"비경합성이다. 비배제성은 대가를 내지 않은 사람을 소비에서 배제할 수 없는 특성이다."},['E77']);
addLesson41(6,2,"가로등 설치비 모금","설치비를 얼마씩 부담하는 것이 유리한지 비교해 보자.",[
"네 주민이 가로등 설치비를 모으려고 한다. 각 주민은 10토큰을 가지고 있으며, 가로등을 설치하려면 24토큰이 필요하다. 다른 세 주민의 납부액은 공개되어 있고, 나는 이를 보고 낼 금액을 결정한다.",
"24토큰 이상이 모이면 가로등을 설치한다. 가로등이 설치되면 비용을 냈는지와 관계없이 각 주민은 10의 편익을 얻는다. 설치비가 부족하면 가로등을 설치하지 않고 낸 토큰을 모두 돌려준다.\n\n이 활동에서는 남은 토큰과 가로등에서 얻는 편익의 합이 클수록 유리한 선택으로 본다. 설치에 성공하면 ‘10−내 납부액+10’, 실패하면 토큰을 돌려받으므로 10이다.",
"다른 주민이 낸 돈만으로 설치비가 모두 모였다면 나는 내지 않고도 가로등을 이용할 수 있다. 설치비가 부족하다면 내가 낸 금액에 따라 가로등 설치 여부가 달라질 수 있다. 이때에는 납부액뿐 아니라 설치 성공 여부를 함께 고려하여 남은 토큰과 편익의 합을 비교한다."
],"다른 세 주민은 각각 6토큰씩 내기로 하였다. 내가 6토큰을 내는 경우와 4토큰을 내는 경우 중 어느 쪽이 유리한지 비교해 보자.",[
"다른 세 주민이 내는 금액은 6×3=18토큰이다.","내가 6토큰을 내면 총 24토큰이 모이므로 가로등이 설치된다. 내게 남는 토큰은 4이고 편익은 10이므로 두 값의 합은 14이다.","내가 4토큰을 내면 총모금액은 22토큰으로 설치비가 부족하다. 가로등은 설치되지 않고 납부액을 돌려받으므로 내게 남는 토큰은 10이다."
],"다른 세 주민이 각각 6토큰을 낼 때에는 내가 4토큰보다 6토큰을 내는 것이 유리하다. 남은 토큰과 편익의 합이 10보다 14가 더 크기 때문이다.","총모금액이 24토큰 이상이면 남은 토큰에 편익 10을 더한다. 24토큰 미만이면 납부액을 돌려받으며 가로등 편익은 없다.","",{q:"다른 주민만으로 24토큰이 모였다. 내가 0토큰을 냈을 때 남은 토큰과 편익의 합은 얼마인가?",o:['10','20','0'],a:1,why:"가로등이 설치되므로 보유 토큰 10에 편익 10을 더한 20이다."},['E77','D77']);
addLesson41(6,3,"독과점과 정보의 비대칭성","독과점 문제와 정보의 비대칭성을 구별해 보자.",[
"독점은 시장에 공급자가 하나만 있는 상태이고, 과점은 소수의 공급자가 있는 상태이다. 독과점 기업이 가격이나 생산량을 임의로 조정하면 소비자가 피해를 입을 수 있다.\n\n기업들이 가격 인상이나 생산량 제한에 합의하여 경쟁을 피하는 행위를 담합이라고 한다. 담합은 경쟁을 제한하여 자원의 효율적 배분을 어렵게 할 수 있다.",
"정보의 비대칭성은 거래 당사자가 가진 거래에 필요한 정보의 양과 질이 서로 다른 상태이다. 중고 제품의 결함을 판매자는 알지만 구매자는 모르는 경우가 그 예이다. 구매자가 제품의 상태를 제대로 알지 못하면 거래에 관한 합리적 판단이 어려워질 수 있다.",
"정부는 독과점 기업의 횡포와 불공정 거래를 규제하여 공정한 경쟁을 촉진할 수 있다. 정보의 비대칭성을 줄이기 위해서는 품질 보증, 성분 표시, 원산지 표시 등을 활용할 수 있다. 공공재 부족은 정부의 직접 공급으로, 외부 불경제는 세금이나 부담금 부과 등으로 개선할 수 있다."
],"A 자료에는 기업들이 가격 인상에 합의한 내용이 있다. B 자료에는 판매자만 알고 있는 제품의 결함이 제시되어 있다. C 자료에는 생산 과정에서 발생했지만 보상되지 않은 오염 피해가 나타난다. 각 사례에 해당하는 개념을 구분해 보자.",[
"A는 기업들이 가격 인상에 합의하여 경쟁을 제한하므로 담합이다.","B는 판매자와 구매자가 가진 제품 정보가 다르므로 정보의 비대칭성이다.","C는 생산으로 다른 경제 주체에게 피해를 주고도 보상하지 않았으므로 외부 불경제이다."
],"A는 담합, B는 정보의 비대칭성, C는 외부 불경제이다.","업체 간 경쟁 제한 합의는 담합, 거래 당사자 간 정보 차이는 정보의 비대칭성에 해당한다.","여러 업체의 가격이 같다는 사실만으로 담합이라고 할 수는 없다. 가격을 함께 정하기로 합의했는지에 관한 정보가 필요하다.",{q:"제품의 결함을 판매자는 알지만 구매자는 모르는 경우에 해당하는 개념은?",o:['정보의 비대칭성','비경합성'],a:0,why:"거래 당사자가 가진 제품 정보에 차이가 있으므로 정보의 비대칭성이다."},['E77']);
addLesson41(7,1,"시장경제에서 정부의 역할","정부가 시장 실패와 경제적 불평등을 개선하는 방법을 알아보자.",[
"정부는 시장이 자원을 효율적으로 배분하지 못하는 문제를 개선하기 위해 개입한다. 독과점 기업의 횡포, 담합, 불공정 거래 등을 규제하여 공정한 경쟁을 촉진할 수 있다.\n\n외부 불경제가 발생하는 활동에는 세금이나 부담금을 부과하여 과다한 생산과 소비를 줄인다. 외부 경제가 발생하는 활동에는 세금 감면이나 보조금 지급으로 생산과 소비를 늘릴 수 있다.",
"공공재는 무임승차 문제 등으로 민간 시장에서 충분히 공급되기 어렵다. 정부는 공공재를 직접 공급하여 이러한 부족을 보완할 수 있다.\n\n상품의 품질과 성분, 원산지 등에 관한 정보 제공은 거래 당사자 사이의 정보 차이를 줄이는 데 도움이 된다. 품질 보증, 성분 표시, 원산지 표시 등이 정보의 비대칭성을 개선하는 방안이다.",
"정부는 소득 재분배를 통해 경제적 불평등을 완화할 수 있다. 누진세 제도와 사회 보장 제도 등이 그 수단이다.\n\n같은 세금이나 보조금을 사용하더라도 정책의 목적은 다를 수 있다. 오염을 줄이기 위한 세금은 외부 불경제의 개선, 경제적 불평등을 완화하기 위한 조세·사회 보장 정책은 소득 재분배와 관련된다."
],"정부의 정책 A는 상품의 성분 표시, B는 치안 서비스 공급, C는 경제적 불평등 완화를 목적으로 한다. 각 정책에 해당하는 정부의 역할을 구분해 보자.",[
"A는 상품 정보를 제공하므로 정보의 비대칭성을 개선하는 정책이다.","B는 치안 서비스를 제공하므로 공공재를 공급하는 역할이다.","C는 경제적 불평등을 완화하므로 소득 재분배 역할에 해당한다."
],"A는 정보의 비대칭성 개선, B는 공공재 공급, C는 소득 재분배이다.","어떤 정책 수단을 쓰는지와 함께 해결하려는 문제가 무엇인지 살펴보면 정부의 역할을 구분할 수 있다.","",{q:"품질 보증과 성분 표시를 통해 개선하려는 문제는 무엇인가?",o:['정보의 비대칭성','모든 사람의 생애 주기 동일화'],a:0,why:"거래에 필요한 정보를 제공하여 판매자와 소비자 사이의 정보의 비대칭성을 줄이려는 것이다."},['E77']);
addLesson41(7,2,"기업의 책임과 노동자의 권리","기업가 정신, 기업의 사회적 책임, 노동 3권을 알아보자.",[
"기업가 정신은 이윤을 추구하는 과정에서 위험과 불확실성을 무릅쓰고 새로운 시장을 개척하며 도전하는 정신이다. 새로운 기술이나 상품을 개발하고 기존에 없던 시장에 진출하려는 노력에서 기업가 정신을 찾을 수 있다.",
"기업의 활동은 노동자, 소비자, 지역 사회와 환경에 영향을 미친다. 따라서 기업은 법규를 준수하고 노동자와 소비자의 권리를 존중하며 사회적 책임을 다해야 한다. 근로 조건을 개선하고 소비자의 안전을 보호하며 환경에 미치는 영향을 줄이려는 노력이 이에 해당한다.",
"노동자는 자신의 권리를 보장받기 위해 노력하고 생산 활동에 적극적으로 참여하며 기업과 협력할 필요가 있다. 노동 3권에는 다음의 권리가 있다.\n\n① 단결권: 노동조합을 조직하거나 가입할 수 있는 권리\n② 단체 교섭권: 노동조합을 통해 사용자와 임금·근로 조건 등을 협상할 수 있는 권리\n③ 단체 행동권: 협상이 결렬되었을 때 파업 등 쟁의 행위를 통해 사용자에게 대항할 수 있는 권리"
],"노동자들이 노동조합에 가입하였다. 노동조합은 노동자를 대표하여 사용자와 근로 조건을 협상하였다. 각 활동에 해당하는 권리를 구분해 보자.",[
"노동조합에 가입하는 것은 단결권의 행사이다.","노동조합이 사용자와 근로 조건을 협상하는 것은 단체 교섭권의 행사이다.","조직·가입에 관한 단결권과 사용자와의 협상에 관한 단체 교섭권은 서로 다른 권리이다."
],"노동조합 가입은 단결권, 사용자와의 근로 조건 협상은 단체 교섭권에 해당한다.","노동조합의 조직·가입은 단결권, 사용자와의 협상은 단체 교섭권, 파업 등 쟁의 행위는 단체 행동권이다.","",{q:"위험과 불확실성을 무릅쓰고 새로운 기술과 시장에 도전하는 정신은?",o:['기업가 정신','예금의 만기'],a:0,why:"이윤을 추구하는 과정에서 위험을 감수하며 혁신과 새로운 시장에 도전하는 정신은 기업가 정신이다."},['E77']);
addLesson41(7,3,"소비자 주권과 윤리적 소비","소비자가 생산과 지속가능발전에 미치는 영향을 알아보자.",[
"소비자 주권은 재화와 서비스의 종류나 수량을 결정하는 데 소비자가 결정적인 권한을 가진다는 의미이다. 소비자의 선택은 기업이 무엇을 얼마나 생산할지에 영향을 준다. 소비자는 상품의 가격과 품질에 관한 정보를 바탕으로 합리적으로 소비하여 기업의 생산을 바람직한 방향으로 이끌 수 있다.",
"윤리적 소비는 더 나은 사회를 만들기 위해 윤리적 가치와 신념을 고려하는 소비이다. 생산자의 대우, 노동 조건, 환경에 미치는 영향 등을 고려하여 상품을 선택하는 것이 그 예이다. 이러한 소비는 경제 성장, 사회의 안정과 통합, 환경 보전을 함께 추구하는 지속가능발전에 기여할 수 있다.",
"편익에는 상품을 이용하면서 느끼는 만족뿐 아니라 윤리적 가치를 실천하는 만족도 포함될 수 있다. 따라서 가격이 더 비싼 상품을 샀다는 이유만으로 비합리적이라고 할 수는 없다. 아래 예제처럼 윤리적 만족을 포함한 편익이 주어졌다면 이를 비용과 함께 비교하여 합리적인 선택을 구한다."
],"A의 편익은 16, 가격은 6이다. B의 편익은 윤리적 가치를 실천하는 만족을 포함하여 20이고 가격은 9이다. 두 상품 중 하나만 선택하며 주어진 편익과 비용만 고려한다. 어느 상품을 선택하는 것이 유리한가?",[
"A의 편익에서 가격을 빼면 16−6=10이다.","B의 편익에는 윤리적 만족이 포함되어 있다. 가격을 빼면 20−9=11이다.","B의 가격은 더 높지만 편익에서 가격을 뺀 값도 더 크므로 B가 유리하다."
],"주어진 편익과 비용을 비교하면 B를 선택하는 것이 유리하다.","합리적 소비는 가장 싼 상품을 고르는 것과 다르다. 상품에서 얻는 편익과 기회비용을 함께 고려한다.","이 예제에서는 B의 편익 20에 윤리적 만족이 이미 포함되어 있다. 이를 별도로 다시 더하지 않는다.",{q:"윤리적 소비와 합리적 소비의 관계로 옳은 것은?",o:['항상 모순이다.',"윤리적이면서 합리적인 소비가 가능하다."],a:1,why:"윤리적 가치를 실천하는 만족도 편익에 포함될 수 있다. 이를 고려한 순편익이 가장 크다면 윤리적 소비가 합리적 선택이 될 수 있다."},['E77','C97']);

addCourse41(8,"예금·주식·채권",5,"세 금융 자산의 특징과 보유자의 지위를 비교하고, 이자·배당·시세 차익을 구별해 보자.",['F88','F89'],[
cm41("금융 자산별 수익","각 설명에 해당하는 금융 자산을 고르시오. 예금, 주식, 채권의 일반적인 특징을 기준으로 한다.",["이자 수익을 기대할 수 있지만 시세 차익은 기대할 수 없다.","이자 수익 대신 배당 수익을 기대할 수 있다.","이자 수익과 시세 차익을 모두 기대할 수 있다."],['정기 예금','주식','채권'],[0,1,2],"정기 예금에서는 이자 수익을 기대할 수 있다. 주식에서는 배당 수익과 시세 차익을, 채권에서는 이자 수익과 시세 차익을 기대할 수 있다."),
ci41("채권 보유자의 지위","다음 발행 자료에 나타난 증서를 보유한 사람의 지위는?",['기업이 원금과 이자 지급을 약속하며 자금을 빌렸다.','보유자는 그 차용 증서를 가지고 있다.'],['주주','채권자','상품 구매자일 뿐'],1,"자금을 빌리면서 원금과 이자의 지급을 약속하고 발행한 차용 증서는 채권이다. 채권 보유자는 발행자에게 돈을 빌려준 채권자이다. 기업의 지분을 소유한 주주와는 다르다."),
cm41("예금의 종류","각 납입 방식과 입출금 조건에 해당하는 예금의 종류를 고르시오.",['개설할 때 목돈을 예치','일정 금액을 정기적으로 적립','입금과 출금이 자유로움'],['요구불 예금','정기 예금','정기 적금'],[1,2,0],"목돈을 한 번에 맡기는 것은 정기 예금, 일정 금액을 정기적으로 납입하는 것은 정기 적금이다. 입금과 출금이 자유로운 것은 요구불 예금이다."),
cf41("주주와 채권자의 차이",['주식 보유자는','반드시 확정된 이자를 받는 채권자','이다.'],1,['기업의 지분을 가진 주주',"금융 기관에 돈을 맡긴 예금자","다른 사람의 채무를 인수한 사람"],0,"주식은 기업에 대한 투자자의 지분을 나타내며, 주식을 보유한 사람은 주주이다. 돈을 빌려준 채권자와 구별된다. 주주는 배당 수익을, 채권자는 이자 수익을 기대할 수 있다."),
cn41("시세 차익과 배당","주식 1주를 100에 사서 120에 팔고 배당 3을 받았다. 세금과 수수료는 없다. 시세 차익과 배당을 포함한 총이익을 각각 구하시오.",['시세 차익','배당 포함 총이익'],[20,23],"시세 차익은 매도 가격에서 매수 가격을 뺀 120−100=20이다. 배당 3을 더하면 총이익은 23이다. 매도 대금 120에는 처음 투자한 금액도 포함되어 있다."),
cu41("주식과 채권의 공통점","주식과 채권에 공통으로 해당하는 설명을 모두 고르시오.",['시세 차익을 기대할 수 있다.','항상 배당을 받는다.','가격 변동에 따라 거래 결과가 달라질 수 있다.','보유자는 모두 주주이다.'],[0,2],"주식과 채권은 모두 매매할 수 있으므로 시세 차익을 기대할 수 있다. 가격이 하락하면 매매 손실이 발생할 수도 있다. 다만 보유자의 지위는 주주와 채권자로 다르며, 채권에서는 배당 수익을 기대할 수 없다."),
cm41("주식과 채권 발행의 영향","새로 발행할 때의 영향과 보유자의 지위를 보고 해당 금융 자산을 고르시오.",['발행자의 자본금 증가·보유자는 주주','발행자의 부채 증가·보유자는 채권자'],['채권','주식'],[1,0],"주식을 새로 발행하여 자금을 조달하면 발행자의 자본금이 늘며, 보유자는 주주가 된다. 채권 발행은 자금을 빌리는 것이므로 발행자의 부채가 늘고, 보유자는 채권자가 된다."),
cl41("금융 자산 선택의 기회비용",[['예금 A',90,0],['주식 B',80,0],['채권 C',100,0]],"명시적 비용이 모두 0이므로 편익에서 명시적 비용을 뺀 값은 A가 90, B가 80, C가 100이다. A나 B를 선택하면 C의 100을 포기한다. C를 선택할 때에는 남은 대안 중 가치가 더 큰 A의 90을 포기한다.\n\n따라서 C 선택의 순편익은 100−90=10으로 가장 크다."),
ci41("수익 형태로 금융 자산 구분하기","A~C는 각각 정기 예금, 주식, 채권 중 하나이다. 다음 자료를 바탕으로 A~C를 옳게 구분한 것은?",['A는 이자를 기대하지만 시세 차익은 없다.','B는 배당을 기대한다.','C는 이자와 시세 차익을 기대한다.'],["A: 채권 / B: 정기 예금 / C: 주식","A: 정기 예금 / B: 주식 / C: 채권","A~C 모두 정기 예금"],1,"이자 수익만 기대하는 A는 정기 예금이다. 배당 수익을 기대하는 B는 주식이고, 이자 수익과 시세 차익을 모두 기대하는 C는 채권이다."),
cp41("개념 적용 문제","계약 기간 동안 일정한 금액을 정기적으로 납입하는 예금은?",['정기 예금','정기 적금','주식'],1,"정기 적금이다. 정기 적금은 일정 금액을 나누어 납입한다. 계좌를 개설할 때 목돈을 한 번에 맡기는 정기 예금과 납입 방식이 다르다.")
],[cm41("예금·주식·채권의 수익 비교","각 수익 형태에 해당하는 금융 자산을 고르시오. 일반적으로 기대할 수 있는 수익을 기준으로 한다.",['이자만 기대','이자·시세 차익 기대','배당·시세 차익 기대'],['예금','주식','채권'],[0,2,1],"예금에서는 이자 수익, 채권에서는 이자 수익과 시세 차익, 주식에서는 배당 수익과 시세 차익을 기대할 수 있다."),cn41("매매 손실과 배당","주식 1주를 80에 사서 75에 팔고 배당 2를 받았다. 다른 비용은 없다. 매매 손익과 배당을 포함한 총손익을 각각 구하시오.",['매매 손익','배당 포함 손익'],[-5,-3],"매매 손익은 75−80=−5이다. 여기에 배당 2를 더하면 총손익은 −3이다. 배당을 받았지만 매매 손실이 더 크므로 전체적으로는 손실이 발생하였다.")],cn41("주식 수를 고려한 손익","주식 3주를 주당 40에 사서 주당 44에 팔았다. 배당은 주당 2이며 다른 비용은 없다. 매수 총액, 매매 차익, 배당을 포함한 총이익을 각각 구하시오.",['매수 총액','매매 차익','배당 포함 총이익'],[120,12,18],"매수 총액은 주당 가격에 주식 수를 곱한 40×3=120이다. 주당 매매 차익은 44−40=4이므로 세 주의 매매 차익은 12이다. 배당 총액은 2×3=6이다. 따라서 매매 차익과 배당을 합한 총이익은 18이다."));
COURSE41.tasks.find(t=>t.id==='C08-08').prompt="세 금융 자산 중 하나만 선택한다. 표의 편익은 수익과 안전성에서 얻는 만족 등을 금액으로 나타낸 값이다. 실제 수익률을 뜻하지 않는다. 표의 편익과 명시적 비용만 고려하여 비용표를 완성하시오. 원금은 명시적 비용에 추가하지 않는다.";
