],"공연을 보는 것과 일을 하는 것 중 하나만 선택할 수 있다. 공연 관람료는 2만 원이며, 일을 하면 보수 5만 원을 받는다. 다른 비용은 없다. 공연을 선택할 때의 기회비용을 구해 보자.",[
"선택할 수 있는 활동은 공연 관람과 일이다. 공연을 선택하면 일을 할 수 없다.","공연 관람료 2만 원을 직접 지출하고, 일을 했다면 받을 수 있었던 보수 5만 원을 포기한다.","두 금액을 합하면 공연 선택의 기회비용은 2+5=7만 원이다."
],"공연 선택의 기회비용은 관람료 2만 원과 포기한 보수 5만 원을 합한 7만 원이다.","기회비용을 구할 때에는 직접 지출한 돈뿐 아니라 다른 대안을 선택했다면 얻을 수 있었던 가치도 고려한다.","여러 대안 중 하나만 선택할 수 있다면, 포기한 대안들의 가치를 모두 더하지 않고 그중 가장 큰 가치를 고려한다.",{q:"어떤 활동을 선택하면서 다른 활동에서 얻을 수 있었던 만족을 포기하였다. 이 만족은 선택의 비용에 포함되는가?",o:["현금으로 받은 것이 아니므로 비용에서 제외한다.","포기한 대안의 가치이므로 비용에 포함한다."],a:1,why:"선택의 비용에는 직접 지출한 금액과 포기한 기회의 가치가 포함된다. 돈으로 받은 것이 아니어도 포기한 만족은 비용이 될 수 있다."},['E76']);
supplement42(0,2,"분수와 백분율","백분율로 나타낸 비율을 이용하여 금액을 계산해 보자.",[
"백분율은 기준이 되는 전체를 100으로 보았을 때 비교하는 값의 크기이다. 100만 원 중 20만 원의 비율은 20÷100=0.2이므로 20%이다. 어떤 금액의 5%를 구하려면 그 금액에 5÷100, 즉 0.05를 곱한다.",
"분수로 나타낸 값에도 단위가 필요하다. X재 1개 생산의 기회비용이 Y재 1/2개라는 것은 X재 한 개를 더 생산하기 위해 Y재 반 개를 포기해야 한다는 뜻이다. 같은 1/2이라도 어느 재화의 양을 나타내는지에 따라 의미가 달라진다.",
"원금을 맡긴 대가로 받는 돈을 이자라고 한다. 원금과 이자를 합한 금액은 원리금이다. 예를 들어 원금 300에 대한 이자율이 4%라면 이자는 300×0.04로 구한다. 원리금을 구할 때에는 계산한 이자를 원금에 더한다."
],"원금 200만 원을 연 5%의 단리로 1년 동안 맡긴다. 세금과 수수료는 없다. 이자와 원리금을 각각 구해 보자.",[
"5%를 소수로 나타내면 0.05이다.","원금에 이자율을 곱하면 이자는 200×0.05=10만 원이다.","원리금은 원금에 이자를 더한 200+10=210만 원이다."
],"이자는 10만 원, 원리금은 210만 원이다.","1%에 해당하는 금액은 전체 금액을 100으로 나누어 구한다. 5%는 10%에 해당하는 금액의 절반이다.","연 이자율은 1년을 기준으로 한 비율이다. 이자를 계산할 때에는 돈을 맡긴 기간도 함께 고려한다.",{q:"300만 원의 4%는 얼마인가?",o:['12만 원','304만 원'],a:0,why:"300×0.04=12이므로 12만 원이다."},['F91','T105','A86']);
supplement42(0,3,"금액의 단위와 수입·지출 시점","금액의 단위를 맞추고, 돈이 들어오고 나가는 시점을 살펴보자.",[
"경제 자료의 숫자는 표의 제목과 단위에 따라 의미가 달라진다. 재화 한 개를 만드는 데 필요한 노동시간은 투입량을 나타낸다. 일정한 노동으로 만들 수 있는 재화의 최대 수량은 생산량을 나타낸다. 두 표는 서로 다른 정보를 담고 있으므로 계산 방법도 달라진다.",
"금액을 비교하려면 기간과 통화의 단위를 맞추어야 한다. 같은 월급을 12번 받는다면 월급에 12를 곱하여 연간 수입을 구한다. 달러로 표시된 금액과 원화로 표시된 금액은 주어진 환율로 환산한 뒤 비교한다. 환율이 달라졌다면 각 거래가 이루어진 시점의 환율을 적용한다.",
"전체 수입이 전체 지출보다 많아도 필요한 날짜에 돈이 부족할 수 있다. 수입이 들어오기 전에 지출해야 한다면 그때까지 보유한 자금으로 지출을 감당해야 하기 때문이다. 따라서 자금 계획을 세울 때에는 수입과 지출의 금액뿐 아니라 발생 시점도 고려해야 한다."
],"초기 자금은 0이다. 1개월째 말에 30만 원을 지출해야 하고, 2개월째 초에 50만 원의 수입이 들어온다. 대출을 받거나 지출을 미룰 수 없다. 첫 지출을 제때 할 수 있는지 판단해 보자.",[
"첫 지출일은 1개월째 말이며, 필요한 금액은 30만 원이다.","초기 자금이 없고 첫 지출일까지 들어온 수입도 없으므로 사용할 수 있는 돈은 0이다.","50만 원의 수입은 2개월째 초에 들어온다. 따라서 1개월째 말의 지출에 사용할 수 없다."
],"전체 수입은 지출보다 많지만, 첫 지출일에 돈이 없어 30만 원을 제때 낼 수 없다.","날짜순으로 이전 잔액에 수입을 더하고 지출을 빼면, 어느 시점에 자금이 부족한지 알 수 있다.","수입과 지출이 같은 달에 발생해도 월초인지 월말인지에 따라 사용할 수 있는 자금이 달라질 수 있다.",{q:"매월 400만 원을 12번 받는다면 연간 수입은 얼마인가?",o:['400만 원','4800만 원'],a:1,why:"400×12=4,800이므로 연간 수입은 4,800만 원이다."},['F90','F91','A86']);
supplement42(0,4,"생산량표와 투입량표","최대 생산량과 단위당 투입량의 차이를 알아보자.",[
"최대 생산량표는 주어진 생산 요소를 모두 투입할 때 각 재화를 얼마나 생산할 수 있는지 나타낸다. 투입하는 노동량이 같다면 최대 생산량이 많은 쪽의 생산성이 높다. 최대 생산량을 비교할 때에는 두 생산자가 같은 양의 생산 요소를 사용하는지 확인해야 한다.",
"단위당 투입량표는 재화 한 단위를 생산하는 데 필요한 노동이나 비용을 나타낸다. 같은 재화를 생산하는 데 필요한 투입량이 적을수록 생산성이 높다. 최대 생산량표에서는 생산량이 큰 쪽이, 단위당 투입량표에서는 투입량이 작은 쪽이 유리하다.",
"기회비용은 한 재화를 더 생산하기 위해 포기해야 하는 다른 재화의 양이다. 최대 생산량으로 계산할 때와 단위당 노동시간으로 계산할 때에는 나누는 방향이 다르다. 최대 생산량표에서는 포기하는 재화의 최대 생산량을 생산하려는 재화의 최대 생산량으로 나눈다. 노동시간표에서는 생산하려는 재화의 노동시간을 포기하는 재화의 노동시간으로 나눈다."
],"자료 A에서는 같은 노동량으로 X재를 최대 24개 또는 Y재를 최대 12개 생산할 수 있다. 자료 B에서는 X재 1개를 생산하는 데 2시간, Y재 1개를 생산하는 데 4시간이 필요하다. 각 자료에서 X재 1개 생산의 기회비용을 구해 보자.",[
"자료 A는 최대 생산량을, 자료 B는 재화 1개 생산에 필요한 노동시간을 나타낸다.","자료 A에서 X재 24개를 생산하는 대신 Y재 12개를 생산할 수 있다. 따라서 X재 1개 생산의 기회비용은 Y재 12/24개이다.","자료 B에서 X재 1개에 필요한 2시간으로 Y재를 2/4개 생산할 수 있다. 두 자료에서 X재 1개 생산의 기회비용은 모두 Y재 1/2개이다."
],"두 자료는 같은 생산 조건을 서로 다른 방식으로 나타낸다. X재 1개 생산의 기회비용은 모두 Y재 1/2개이다.","생산량표는 생산할 수 있는 양을, 투입량표는 생산에 필요한 양을 나타낸다.","서로 다른 재화의 생산량을 곧바로 비교하여 절대 우위를 판단하지 않는다. 같은 재화를 생산하는 두 생산자를 비교한다.",{q:"최대 생산량표와 단위당 투입량표의 숫자 위치가 같으면 기회비용을 구할 때 나누는 방향도 같은가?",o:['그렇다.',"다르다. 표에 제시된 값의 의미에 따라 계산한다."],a:1,why:"최대 생산량과 단위당 투입량은 서로 다른 정보이다. 기회비용을 구할 때 나누는 방향도 달라진다."},['E76','A86']);
supplement42(0,5,"퍼센트와 퍼센트포인트","비율의 차이와 증가율을 구별해 보자.",[
"퍼센트포인트는 퍼센트로 나타낸 두 비율의 차이를 표시하는 단위이다. 금리가 3%에서 5%로 올랐다면 금리는 2%포인트 상승한 것이다. 두 금리에서 퍼센트 기호 앞의 수를 빼면 그 차이를 구할 수 있다.",
"증가율은 증가한 양을 처음 값으로 나눈 비율이다. 값이 3에서 5로 늘었다면 증가한 양은 2이고, 증가율은 2/3이다. 금리가 3%에서 5%로 오른 경우에도 금리 자체의 증가율은 처음 금리 3%를 기준으로 계산한다. 2%포인트 상승과 2% 증가는 서로 다른 뜻이다.",
"금리의 차이는 비율의 차이이고, 이자의 차이는 금액의 차이이다. 같은 원금을 같은 기간 동안 단리로 맡긴다면 금리가 높은 쪽의 이자가 더 크다. 이자 차이를 구하려면 원금에 금리 차이와 기간을 곱한다. 금리는 같아도 원금이나 기간이 다르면 이자는 달라진다."
],"원금 1,000만 원을 1년 동안 맡기는 연 3% 단리 계약과 연 5% 단리 계약이 있다. 다른 비용은 없다. 두 계약의 금리 차이와 이자 차이를 각각 구해 보자.",[
"금리 차이는 5−3=2%포인트이다.","연 3%일 때 이자는 1,000×0.03=30만 원, 연 5%일 때 이자는 1,000×0.05=50만 원이다.","이자 차이는 50−30=20만 원이다."
],"두 계약의 금리는 2%포인트, 이자는 20만 원 차이가 난다.","같은 원금을 1년간 단리로 맡긴다면 원금에 금리 차이 0.02를 곱하여 이자 차이를 바로 구할 수 있다.","이자율의 차이를 계산에 사용할 때에는 퍼센트를 소수로 바꾼다. 2%포인트에 해당하는 비율은 0.02이다.",{q:"금리 3%와 5%의 차이는 몇 %포인트인가?",o:['2%포인트','2만 원'],a:0,why:"5−3=2이므로 2%포인트이다."},['F91']);
supplement42(0,6,"편익과 비용이 달라질 때의 선택","조건이 달라지기 전과 후의 합리적 선택을 비교해 보자.",[
"어떤 대안에서 얻는 편익이 커지거나 직접 지출할 비용이 줄어들면 그 대안은 이전보다 유리해진다. 반대로 편익이 줄거나 비용이 늘면 이전보다 불리해진다. 다만 다른 대안과 비교했을 때도 더 유리해야 합리적인 선택이 바뀐다.",
"한 대안의 가치가 달라지면 다른 대안을 선택할 때의 암묵적 비용도 달라질 수 있다. A 대신 선택할 수 있는 B의 가치가 커졌다면, A를 선택하면서 포기하는 가치도 커지기 때문이다. 따라서 기회비용과 순편익을 구할 때에는 선택하지 않은 대안의 변화도 반영한다.",
"계약이 바뀌어 특정 대안을 선택할 때 반환금을 받을 수 있게 되었다면 그 금액도 고려해야 한다. 반환금을 받을 수 있는 대안에서 얻는 금액에 이를 포함하여 다른 대안과 비교한다. 반환금이 이미 제시된 편익에 포함되어 있다면 다시 더하지 않는다."
],"A의 편익은 30, 명시적 비용은 8이다. B의 편익은 36, 명시적 비용은 10이다. 이후 B의 명시적 비용만 15로 증가하였다. 조건 변경 전후에 어느 대안을 선택하는 것이 유리한지 비교해 보자.",[
"처음에는 편익에서 명시적 비용을 뺀 값이 A는 30−8=22, B는 36−10=26이다. 따라서 B가 유리하다.","비용이 증가한 뒤에는 A가 22, B가 36−15=21이다. 따라서 A가 유리하다.","A의 편익과 비용은 그대로이지만 B의 명시적 비용이 증가하여 합리적인 선택이 B에서 A로 바뀌었다."
],"변경 전에는 B, 변경 후에는 A가 유리하다. B의 명시적 비용 증가가 선택을 바꾸었다.","편익이나 명시적 비용이 달라지면 변경된 금액으로 각 대안을 비교한다. 기회비용을 구할 때에는 포기한 대안의 가치도 다시 계산한다.","최선의 대안이 그대로여도 그 대안의 기회비용과 순편익은 달라질 수 있다.",{q:"한 대안의 보상이 조금 늘어나더라도 기존의 선택이 유지될 수 있는가?",o:['가능하다.',"반드시 다른 대안으로 바뀐다."],a:0,why:"보상이 늘어난 뒤에도 다른 대안을 선택할 때의 순편익이 더 크다면 기존의 선택이 유지된다."},['E76','F90']);
supplement42(1,4,"중상주의와 수정 자본주의의 정부 역할","교역 장려 정책과 대공황 극복 정책의 차이를 알아보자.",[
"중상주의는 국가의 부를 늘리기 위해 정부가 상공업 활동에 깊이 개입한 경제 정책이다. 절대 왕정은 국내 산업을 보호하고 수출을 장려하였다. 교역과 상인의 활동을 지원한 이러한 정책은 상업 자본주의의 발달을 뒷받침하였다.",
"수정 자본주의는 대공황 이후 실업과 수요 부족 등 시장의 한계를 해결하기 위해 정부의 적극적인 개입을 강조하였다. 정부가 공공사업으로 일자리를 제공하면 노동자는 임금을 받고 상품을 구매할 수 있다. 이를 통해 고용과 유효 수요를 확대하고자 하였다.",
"두 입장은 모두 정부의 역할을 인정하지만 개입의 목적이 다르다. 중상주의는 교역을 통한 국가의 부 축적을, 수정 자본주의는 시장 실패의 해결과 경기 회복을 추구하였다. 따라서 정부가 무역선을 지원하는 사례와 대공황 이후 공공사업을 추진하는 사례는 서로 다른 시기의 정책을 나타낸다."
],"A 문서는 절대 왕정의 교역 장려 정책을, B 문서는 대공황 이후의 공공사업을 설명한다. 각 문서와 관련된 자본주의의 유형을 구분해 보자.",[
"A의 교역 장려 정책은 절대 왕정의 중상주의 정책에 해당한다.","B의 공공사업은 대공황에 따른 실업과 수요 부족을 해결하려는 정책이다.","따라서 A는 상업 자본주의, B는 수정 자본주의와 관련된다."
],"A는 상업 자본주의, B는 수정 자본주의와 관련된다. 두 정책은 정부 개입의 배경과 목적이 다르다.","교역을 장려하여 국가의 부를 늘리려는 정책은 중상주의, 공공사업으로 대공황을 극복하려는 정책은 수정 자본주의와 관련된다.","",{q:"정부가 개입한 두 사례를 자본주의의 전개 과정에 따라 구분하려면 무엇을 살펴야 하는가?",o:['그렇다.',"정책이 시행된 시대적 배경과 목적을 비교한다."],a:1,why:"중상주의와 수정 자본주의는 모두 정부의 역할을 인정하지만, 각각 국가의 부 축적과 시장 실패의 해결이라는 목적을 가진다."},['E75','V62']);
supplement42(3,4,"기회비용의 크기와 합리적 선택","기회비용이 큰 대안도 합리적인 선택이 될 수 있는 이유를 알아보자.",[
"합리적으로 선택하려면 편익에서 기회비용을 뺀 순편익을 비교해야 한다. 두 대안의 편익이 같다면 기회비용이 작은 대안의 순편익이 더 크다. 이 경우에는 기회비용을 적게 부담하는 대안을 선택하는 것이 유리하다.",
"편익이 서로 다르면 기회비용만으로 어느 대안이 유리한지 알 수 없다. 기회비용이 더 크더라도 편익이 그보다 더 많이 증가한다면 순편익은 오히려 커질 수 있다. 따라서 기회비용이 가장 작은 대안을 무조건 선택하는 것은 합리적 선택의 기준이 아니다.",
"명시적 비용이 작은 대안을 고르는 것과 순편익이 큰 대안을 고르는 것도 다르다. 명시적 비용은 직접 지출한 금액이지만, 기회비용에는 포기한 다른 대안의 가치인 암묵적 비용도 포함된다. 두 대안을 비교할 때에는 각각의 편익과 두 비용을 모두 고려해야 한다."
],"A의 편익은 25, 명시적 비용은 7이고, B의 편익은 32, 명시적 비용은 11이다. 두 대안 중 하나만 선택한다. 각 대안의 기회비용과 순편익을 비교해 보자.",[
"A와 B의 편익에서 명시적 비용을 빼면 각각 18과 21이다. A의 암묵적 비용은 21, B의 암묵적 비용은 18이다.","기회비용은 A가 7+21=28, B가 11+18=29이다.","순편익은 A가 25−28=−3, B가 32−29=3이다. 기회비용은 B가 더 크지만 순편익도 B가 더 크므로 B가 유리하다."
],"B의 기회비용은 29로 A보다 크지만, 순편익 역시 B가 더 크다. 따라서 합리적인 선택은 B이다.","편익이 같은 경우에는 기회비용이 작은 대안을, 편익이 다른 경우에는 순편익이 큰 대안을 선택한다.","편익에서 명시적 비용만 뺀 값을 순편익이라고 부르지 않는다. 순편익에는 암묵적 비용도 반영된다.",{q:"편익이 서로 다른 두 대안 중 기회비용이 작은 대안을 선택하면 항상 합리적인가?",o:['그렇다.','그렇지 않다.'],a:1,why:"편익과 기회비용을 함께 고려해야 한다. 기회비용이 더 크더라도 편익의 차이가 더 크면 순편익이 더 클 수 있다."},['E76','B48']);
supplement42(3,5,"선택은 같아도 달라지는 순편익","포기한 대안의 가치가 커질 때 암묵적 비용과 순편익의 변화를 알아보자.",[
"A, B, C의 편익에서 명시적 비용을 뺀 값이 각각 22, 26, 25라고 하자. B의 값이 가장 크므로 B를 선택하는 것이 유리하다. B를 선택할 때 포기하는 A와 C 중에서는 C의 가치가 더 크다. 따라서 B 선택의 암묵적 비용은 25이다.",
"C의 가치가 조금 증가하더라도 B의 26보다 작다면 B가 여전히 가장 유리하다. 그러나 B를 선택하면서 포기하는 C의 가치는 이전보다 커진다. 이 때문에 B 선택의 암묵적 비용과 기회비용은 증가한다.",
"B의 편익과 명시적 비용은 그대로인데 암묵적 비용이 증가하면 B의 순편익은 감소한다. 이처럼 선택하는 대안이 같아도 순편익은 달라질 수 있다. C의 가치가 B와 같아지면 두 대안은 동률이고, B보다 커지면 C를 선택하는 것이 유리해진다."
],"A, B, C의 ‘편익−명시적 비용’은 각각 22, 26, 25이다. 다른 조건은 그대로이고 C의 값만 25.5로 증가하였다. B 선택의 암묵적 비용과 순편익은 어떻게 달라지는가?",[
"B의 26이 여전히 가장 크므로 B를 선택하는 것이 유리하다.","B를 선택할 때 포기하는 대안 중 C의 가치가 가장 크다. 따라서 암묵적 비용은 25에서 25.5로 증가한다.","B의 순편익은 26−25=1에서 26−25.5=0.5로 감소한다."
],"합리적인 선택은 B로 유지되지만, 암묵적 비용은 증가하고 순편익은 감소한다.","선택하지 않은 대안의 가치가 커지면, 기존 선택의 암묵적 비용이 커져 순편익이 줄어들 수 있다.","두 대안의 ‘편익−명시적 비용’이 같아지면 어느 하나만 더 유리하다고 할 수 없다.",{q:"예제의 조건 변경 후에도 B가 가장 유리하다. B 선택의 순편익은 어떻게 달라지는가?",o:["감소한다.","변하지 않는다."],a:0,why:"포기하는 대안 C의 가치가 커져 B 선택의 암묵적 비용이 증가하므로 순편익은 감소한다."},['E76','B48']);
supplement42(4,4,"대안 추가와 암묵적 비용","새로운 대안이 생겼을 때 암묵적 비용과 순편익의 변화를 알아보자.",[
"선택할 수 있는 대안이 늘어나면 포기하는 기회의 가치도 달라질 수 있다. 두 대안 중 하나만 선택할 때에는 다른 대안을 포기한 가치가 암묵적 비용이다. 세 번째 대안이 추가되면 선택하지 않은 두 대안 중 더 큰 가치를 암묵적 비용으로 삼는다.",
"A와 B의 ‘편익−명시적 비용’이 각각 60과 75이면 B가 유리하다. 여기에 그 값이 70인 C가 추가되어도 B의 75가 가장 크므로 B가 여전히 유리하다. 그러나 B를 선택할 때 포기한 대안 중 가장 큰 가치는 A의 60에서 C의 70으로 바뀐다. B 선택의 암묵적 비용이 증가한 것이다.",
"새로운 대안이 생겼다고 모든 선택의 비용이 같은 만큼 변하지는 않는다. 위 조건에서 A를 선택할 때 포기하는 가장 큰 가치는 여전히 B의 75이다. 반면 B를 선택할 때에는 암묵적 비용이 증가하여 순편익이 줄어든다. 각 선택에서 포기하는 대안을 따로 비교해야 한다."
],"A의 편익과 명시적 비용은 각각 150과 90, B는 130과 55이다. 여기에 편익 100, 명시적 비용 30인 C가 추가된다. B 선택의 암묵적 비용과 순편익은 어떻게 달라지는가?",[
"처음에는 A의 ‘편익−명시적 비용’이 60, B는 75이다. B를 선택하면 A를 포기하므로 암묵적 비용은 60이고 순편익은 75−60=15이다.","C의 ‘편익−명시적 비용’은 100−30=70이다. B의 75보다 작으므로 가장 유리한 대안은 여전히 B이다.","C가 추가된 뒤 B의 암묵적 비용은 70이 된다. 순편익은 75−70=5로 감소한다."
],"합리적인 선택은 B로 유지되지만, B의 암묵적 비용은 60에서 70으로 증가하고 순편익은 15에서 5로 감소한다.","새 대안이 가장 유리하지 않더라도 기존 선택의 암묵적 비용을 높일 수 있다.","새 대안의 편익 전체가 아니라 편익에서 명시적 비용을 뺀 가치를 비교한다.",{q:"A와 B의 ‘편익−명시적 비용’이 각각 60과 75이다. 이 값이 70인 C가 추가되면 B 선택의 암묵적 비용은 얼마인가?",o:['60','70','145'],a:1,why:"B를 선택할 때 포기하는 A와 C 중에서는 C의 가치 70이 더 크다. 따라서 암묵적 비용은 70이다."},['E76','B48']);
supplement42(4,5,"동률과 선택이 바뀌는 최소 금액","두 대안이 같아지는 금액과 한 대안이 더 유리해지는 최소 금액을 구별해 보자.",[
"두 대안의 편익에서 명시적 비용을 뺀 값이 같으면 어느 하나가 다른 하나보다 더 유리하지 않다. 두 대안이 동률이 되는 금액은 두 값을 같게 놓은 방정식으로 구할 수 있다.",
"한 대안만 더 유리해지려면 두 값이 같아서는 안 되고 해당 대안의 값이 더 커야 한다. 예를 들어 반환금이 6일 때 두 대안이 같고, 반환금이 커질수록 B가 유리해진다면 B만 더 유리해지는 조건은 반환금이 6보다 큰 경우이다.",
"반환금이 0 이상의 정수라면 6보다 큰 값 중 가장 작은 값은 7이다. 따라서 B만 더 유리해지는 최소 정수 반환금은 7이다. 소수까지 허용하는 문제에서는 값이 변하는 간격이 다르므로 동률이 되는 금액에 무조건 1을 더하지 않는다."
],"A의 편익은 70, 명시적 비용은 20이고, B의 편익은 74, 명시적 비용은 30이다. 새 계약에 따라 B를 선택하면 반환금 r을 받는다. r은 0 이상의 정수이다. B만 더 유리해지는 최소 반환금을 구해 보자.",[
"A의 ‘편익−명시적 비용’은 70−20=50이고, 반환금을 포함한 B의 값은 74+r−30=44+r이다.","44+r=50을 풀면 r=6이다. 이때 두 대안은 동률이므로 B만 더 유리하지는 않다.","B만 더 유리하려면 44+r>50, 즉 r>6이어야 한다. r은 정수이므로 최소 반환금은 7이다."
],"반환금 6에서는 동률이고, B만 더 유리해지는 최소 정수 반환금은 7이다.","‘같아지는 금액’은 등식으로, ‘더 유리해지는 금액’은 부등식으로 구한다.","‘최소값’을 구할 때에는 정수만 가능한지, 소수도 가능한지 확인한다.",{q:"예제에서 반환금이 6일 때 두 대안의 관계로 옳은 것은?",o:["B만 더 유리하다.","두 대안이 동률이다."],a:1,why:"A의 값은 50이고 B도 44+6=50이므로 두 대안은 동률이다."},['E76','B48']);
supplement42(5,4,"부담금 납부와 이익의 합산","생산자 이익, 정부 수입, 제3자 피해를 구별하여 계산해 보자.",[
"생산자가 부담금을 내면 그만큼 생산자에게 남는 이익이 줄어든다. 납부 전 이익이 60이고 부담금이 28이면 납부 후 이익은 60−28=32이다.",
"생산자가 낸 부담금 28은 정부의 수입이다. 정부 수입과 제3자 피해 12까지 포함하고 다른 비용은 없다면, 합계는 32+28−12=48이다. 부담금은 생산자의 지출이자 정부의 수입이므로 두 주체의 금액을 합산할 때 다시 차감하지 않는다.",
"부담금이 부과되어 생산량이 달라지면 생산자 이익과 제3자 피해도 변할 수 있다. 따라서 정책 전후의 결과를 비교하는 문제에서는 각 생산량에서의 이익과 피해를 사용해야 한다. 아래 예제는 생산량과 금액이 정해져 있는 경우의 합산 연습이다."
],"생산량은 2, 부담금 납부 전 이익은 60, 부담금 총액은 28, 제3자 피해는 12이다. 정부 수입 28을 포함하며 다른 비용은 없다. 생산자 이익과 정부 수입에서 제3자 피해를 뺀 합계를 구해 보자.",[
"생산자의 납부 후 이익은 60−28=32이다.","정부가 받은 부담금은 28이므로 정부 수입은 28이다.","생산자 이익과 정부 수입을 더하고 제3자 피해를 빼면 32+28−12=48이다."
],"정부 수입과 제3자 피해를 모두 반영한 합계는 48이다.","부담금은 생산자의 납부액과 정부의 수입액에 각각 한 번씩 반영한다.","",{q:"예제에서 정부 수입과 제3자 피해를 모두 반영한 합계는 얼마인가?",o:['20','48','60'],a:1,why:"생산자의 납부 후 이익 32에 정부 수입 28을 더하고 피해 12를 빼면 48이다."},['E77']);
supplement42(5,5,"외부 불경제와 다른 피해의 구별","외부 불경제에 해당하는 피해를 사례에서 찾아보자.",[
"외부 불경제는 한 경제 주체의 생산이나 소비가 다른 경제 주체에게 의도하지 않은 피해를 주지만 그 대가를 지불하지 않는 경우이다. 공장이 배출한 오염 물질로 이웃 주민이 피해를 입었는데 보상하지 않았다면 생산에 따른 외부 불경제이다.",
"경제활동과 무관한 자연재해로 공장 설비가 파손된 경우에는 다른 경제 주체의 생산이나 소비가 피해의 원인이 아니다. 따라서 공장의 손해가 발생했더라도 앞의 오염 사례와 같은 외부 불경제로 볼 수 없다. 외부 불경제는 경제활동이 다른 경제 주체에게 준 피해라는 점이 중요하다.",
"외부 불경제에서는 피해를 일으킨 경제 주체가 그 피해에 대한 대가를 지불하지 않는다. 따라서 사례의 피해 원인뿐 아니라 보상 여부도 살펴야 한다. 보상 여부가 자료에 제시되지 않았다면, 보상이 없었다고 가정하지 않고 추가 정보가 필요한지 검토한다."
],"A에서는 공장의 생산 과정에서 나온 배출물로 이웃이 피해를 입었지만 보상받지 못했다. B에서는 경제활동과 무관한 자연재해로 공장 설비가 파손되었다. 외부 불경제에 해당하는 사례를 구분해 보자.",[
"A에서는 공장의 생산 활동으로 다른 경제 주체인 이웃에게 피해가 발생하였다.","공장이 피해를 보상하지 않았으므로 A는 외부 불경제에 해당한다.","B의 피해는 다른 경제 주체의 생산이나 소비에서 발생한 것이 아니므로 외부 불경제에 해당하지 않는다."
],"A는 외부 불경제이고, B는 경제활동과 무관한 자연재해의 피해이다.","외부 불경제를 구분할 때에는 피해를 일으킨 경제활동과 피해를 입은 다른 경제 주체가 무엇인지 살펴본다.","보상 여부가 제시되지 않았다는 것과 보상하지 않았다고 명시된 것은 다르다.",{q:"외부 불경제에 해당하는지 판단할 때 확인할 내용으로 적절한 것은?",o:["손해가 발생했다는 사실만 확인한다.","경제활동으로 다른 경제 주체에게 피해가 발생했는지와 대가의 지급 여부를 확인한다."],a:1,why:"외부 불경제는 생산이나 소비로 다른 경제 주체에게 피해를 주고도 대가를 지불하지 않는 경우이다."},['E77']);
supplement42(6,4,"납부액 정보와 모금의 선택","다른 주민의 납부액에 따라 나의 선택이 달라지는 이유를 알아보자.",[
"각 주민이 10토큰을 가지고 있고 설치비는 24토큰, 설치 편익은 10인 가로등 모금을 생각해 보자. 설치에 실패하면 납부액은 반환된다. 다른 주민이 합하여 18토큰을 냈다면 내가 6토큰을 내야 설치비가 모인다. 이때 내게 남는 토큰은 4이고 편익은 10이므로 합은 14이다.",
"다른 주민이 낸 금액만으로 24토큰이 모였다면 내가 내지 않아도 가로등이 설치된다. 0토큰을 내면 보유한 10토큰을 그대로 가지고 편익 10도 얻으므로 합은 20이다. 이 경우 추가로 돈을 내면 편익은 같은데 남은 토큰이 줄어든다.",
"다른 주민의 납부액을 모르면 어느 금액을 내는 것이 가장 유리한지 하나로 정하기 어려울 수 있다. 합계가 18토큰이면 6토큰을, 24토큰이면 0토큰을 내는 것이 유리하기 때문이다. 두 상황이 나타날 확률이나 별도의 선택 기준이 주어지지 않았다면 각 상황의 결과를 나누어 설명해야 한다."
],"초기 보유액은 10토큰, 설치비는 24토큰, 설치 편익은 10이다. 설치에 실패하면 납부액을 돌려받는다. 나는 0·4·6·10토큰 중 하나를 선택한다. 다른 주민의 납부액 합계는 18 또는 24이지만 어느 경우인지는 모른다. 하나의 납부액을 항상 가장 유리하다고 할 수 있는가?",[
"다른 주민이 18토큰을 냈다면 내가 6토큰을 낼 때 남은 토큰과 편익의 합이 14로 가장 크다.","다른 주민이 24토큰을 냈다면 내가 0토큰을 낼 때 합이 20으로 가장 크다.","상황마다 가장 유리한 납부액이 다르다. 추가 정보나 선택 기준 없이 하나의 납부액을 항상 최선이라고 정하기는 어렵다."
],"다른 주민의 납부액에 따라 나에게 가장 유리한 납부액이 달라진다.","모금 규칙이 같아도 다른 주민이 낸 금액이 달라지면 내 납부액에 따른 결과도 달라진다.","이 문제에는 두 상황이 나타날 확률이 주어지지 않았다. 어느 상황이 더 자주 나타나는지 임의로 가정하지 않는다.",{q:"다른 주민의 납부액이 18인지 24인지 모르고 각 경우의 확률도 주어지지 않았다. 옳은 판단은?",o:["0토큰을 내는 것이 언제나 유일하게 최선이다.","추가 정보나 선택 기준 없이 하나의 최선 납부액을 정하기 어렵다."],a:1,why:"다른 주민의 합계가 18이면 6토큰, 24이면 0토큰이 유리하므로 상황마다 최선이 다르다."},['E77','D77']);
supplement42(6,5,"시장 실패의 원인과 개선 방안","공공재 부족, 경쟁 제한, 정보의 비대칭성을 사례와 함께 정리해 보자.",[
"공공재는 비배제성과 비경합성을 가진다. 비용을 내지 않아도 소비할 수 있어 무임승차가 나타날 수 있고, 민간 기업이 이윤을 얻기 어려워 충분히 공급되지 않을 수 있다. 가로등을 이용하는 주민이 많아도 설치비가 잘 모이지 않는 문제는 이러한 특성과 관련된다.",
"기업들이 생산량을 제한하기로 합의하면 경쟁이 제한된다. 판매자만 제품의 결함을 알고 구매자는 모른다면 거래 당사자 사이에 정보의 비대칭성이 존재한다. 경쟁을 제한하는 합의와 제품 정보의 차이는 서로 다른 시장 실패의 원인이다.",
"정부가 공공재를 직접 공급하면 부족한 공급을 보완할 수 있다. 불공정 거래 규제는 공정한 경쟁을 촉진한다. 품질 보증과 제품 정보 제공은 판매자와 구매자가 가진 정보의 차이를 줄이는 데 도움이 된다. 시장 실패의 원인에 따라 알맞은 개선 방안도 달라진다."
],"A는 설치비를 내지 않은 주민의 가로등 이용, B는 업체 간 생산 수량 제한 합의, C는 판매자만 알고 있는 제품 결함에 관한 자료이다. 각 자료에 해당하는 개념을 구분해 보자.",[
"A는 대가를 내지 않은 사람을 소비에서 배제할 수 없다는 비배제성을 보여 준다.","B는 업체들이 생산 수량을 제한하기로 합의하여 경쟁을 제한한 사례이다.","C는 판매자와 구매자가 가진 제품 정보가 다르다는 정보의 비대칭성을 보여 준다."
],"A는 비배제성, B는 경쟁 제한, C는 정보의 비대칭성에 해당한다.","공공재 공급, 불공정 거래 규제, 품질 보증은 각각 공급 부족, 경쟁 제한, 정보의 비대칭성을 개선하는 방안이다.","가격이 같다는 사실과 업체 간 가격 합의가 있었다는 사실은 구별한다. 담합은 경쟁을 제한하는 합의가 있는 경우이다.",{q:"판매자와 구매자가 가진 제품 정보의 양과 질이 다른 상태를 무엇이라고 하는가?",o:['정보의 비대칭성','비경합성만'],a:0,why:"거래 당사자가 가진 정보가 다르므로 정보의 비대칭성이다."},['E77']);
supplement42(7,4,"공장 개선과 경제 주체의 역할","공장 개선안을 기업·노동자·소비자·정부의 입장에서 살펴보자.",[
"공장 개선안을 검토할 때 기업은 새로운 기술과 생산 비용을, 노동자는 근로 조건과 권리를 살펴볼 수 있다. 소비자는 제품의 안전과 정확한 정보에 관심을 가지며, 정부는 공정한 경쟁과 공공의 문제를 고려한다. 같은 개선안이라도 경제 주체에 따라 중점적으로 살펴볼 내용이 다르다.",
"기업의 매출이 늘었다는 자료만으로 근로 조건이 좋아졌는지는 알 수 없다. 노동 환경이 개선되었는지는 근로 조건에 관한 자료로, 소비자에게 정확한 정보가 제공되는지는 정보 공개 계획으로 살펴야 한다. 생산 비용이 증가하더라도 노동 환경이나 제품 안전이 개선될 수 있다.",
"공장 개선안을 검토하는 데 노동 검토서, 환경 검토서, 정보 공개 계획이 필요하다고 하자. 자료를 마련할 예산이 제한되어 있다면 각 자료의 확보 비용을 합하여 예산 안에서 준비할 수 있는지 계산한다. 자료 조사가 끝나면 각 문서의 내용을 바탕으로 개선안을 평가한다."
],"노동 검토서의 확보 비용은 4, 환경 검토서는 3, 정보 공개 계획은 2이다. 예산은 9이며 세 자료가 모두 필요하다. 예산 안에서 자료를 모두 확보할 수 있는가?",[
"필요한 자료는 노동 검토서, 환경 검토서, 정보 공개 계획이다.","확보 비용의 합은 4+3+2=9이다.","비용이 예산 9와 같으므로 세 자료를 모두 확보할 수 있다."
],"세 자료의 확보 비용은 9이므로 예산 안에서 모두 준비할 수 있다.","매출, 근로 조건, 제품 정보는 서로 다른 내용이다. 알고자 하는 내용에 맞는 자료를 사용한다.","자료를 확보하는 비용과 실제 공장을 개선하는 비용은 구별한다. 이 예제는 자료의 확보 비용을 계산한다.",{q:"기업의 매출이 늘었다는 사실만으로 노동 조건도 개선되었다고 알 수 있는가?",o:['가능하다.',"노동 조건에 관한 자료가 더 필요하다."],a:1,why:"매출은 판매 실적을 나타낸다. 노동 조건의 변화는 근로 시간, 작업 환경 등 관련 자료로 확인해야 한다."},['E77','C97']);
supplement42(8,4,"예금·채권·주식의 특징 비교","수익 형태와 보유자의 지위로 금융 자산을 구분해 보자.",[
"예금과 채권은 모두 이자 수익을 기대할 수 있다. 주식은 이자 대신 배당 수익을 기대할 수 있다. 따라서 이자 수익이 있다는 조건만으로는 예금과 채권을 구별하기 어렵지만, 배당을 기대할 수 있다는 조건은 주식의 특징이다.",
"채권과 주식은 매매를 통해 시세 차익을 얻을 수 있다. 예금에서는 일반적으로 이자 수익을, 채권에서는 이자 수익과 시세 차익을, 주식에서는 배당 수익과 시세 차익을 기대할 수 있다.",
"채권은 원금과 이자의 지급을 약속한 차용 증서이며, 보유자는 돈을 빌려준 채권자이다. 주식은 투자자의 지분을 표시한 증서이며, 보유자는 주주이다. 수익 형태만으로 자산을 구별하기 어렵다면 차용 증서인지 지분 증서인지, 보유자가 어떤 지위를 갖는지도 함께 살펴본다."
],"예금·채권·주식의 일반적인 특징을 비교한다. A는 이자 수익만 기대할 수 있다. B는 매매가 가능한 차용 증서이다. C는 투자자의 지분을 나타내며 배당 수익을 기대할 수 있다. 각 자산을 구분해 보자.",[
"A는 이자 수익을 기대하는 예금이다.","B는 차용 증서이므로 채권이다.","C는 지분을 표시하고 배당 수익을 기대할 수 있으므로 주식이다."
],"A는 예금, B는 채권, C는 주식이다.","이자는 예금·채권, 배당은 주식, 시세 차익은 채권·주식의 수익 형태이다.","",{q:"이자 수익을 기대할 수 있다는 조건만으로 예금과 채권을 구별할 수 있는가?",o:['가능하다.',"다른 특징이 더 필요하다."],a:1,why:"예금과 채권은 모두 이자 수익을 기대할 수 있기 때문이다."},['F88','F89']);
supplement42(9,4,"자산 총액과 사용 가능한 금액","지출 기한 전에 마련할 수 있는 자금을 계산해 보자.",[
"곧 지출할 돈을 마련하려면 자산을 얼마나 가지고 있는지뿐 아니라 언제 현금으로 바꿀 수 있는지도 알아야 한다. 쉽게 현금화할 수 있는지는 유동성과, 자산의 가치가 보호되는지는 안전성과 관련된다.",
"오늘 사용할 수 있는 자산 30과 한 달 뒤에만 찾을 수 있는 자산 100을 가지고 있다고 하자. 자산 총액은 130이지만 내일 쓸 수 있는 금액은 30이다. 한 달 뒤에 받을 돈을 내일의 지출에 바로 사용할 수는 없다.",
"자금 계획에서는 필요한 금액과 지출 기한을 함께 충족해야 한다. 대출이나 지출 연기가 불가능하다면 기한 전에 현금화할 수 있는 금액만으로 지출을 감당해야 한다. 같은 총액을 보유하더라도 자산의 인출 조건에 따라 계획의 실행 가능 여부가 달라진다."
],"A는 오늘 30을 현금화할 수 있고, B는 한 달 뒤에만 100을 찾을 수 있다. 내일 필요한 금액은 40이며 대출은 불가능하다. 필요한 자금을 마련할 수 있는가?",[
"자산 총액은 30+100=130이다.","내일까지 현금화할 수 있는 금액은 A의 30뿐이다.","필요한 40에서 사용 가능한 30을 빼면 10이 부족하다."
],"자산 총액은 130이지만 내일까지 사용할 수 있는 금액은 30이므로 10이 부족하다.","필요한 날짜 전에 현금화할 수 있는 자산의 금액만 합산한다.","",{q:"예제에서 내일까지 필요한 금액 40을 마련할 수 있는가?",o:["자산 총액이 130이므로 가능하다.","기한 전에 사용할 금액이 10 부족하다."],a:1,why:"B의 100은 한 달 뒤에만 찾을 수 있으므로 내일은 A의 30만 사용할 수 있다."},['F89','F90']);
supplement42(10,4,"지출에 필요한 최소 초기 자금","수입 전의 지출을 감당하기 위해 처음에 필요한 자금을 구해 보자.",[
"전체 기간의 수입이 지출보다 많아도 지출 기한을 지키지 못할 수 있다. 나중에 들어올 수입을 그보다 앞선 지출에 사용할 수 없기 때문이다. 자금 계획에서는 지출일마다 얼마를 사용할 수 있는지 살펴야 한다.",
"초기 자금을 0으로 놓고 거래 순서대로 수입을 더하고 지출을 빼면 각 시점의 부족액을 알 수 있다. 이때 음(-)의 잔액은 실제로 빌린 돈이 아니라 그 시점까지 부족한 자금을 표시한 것이다.",
"수입·지출 시점이 정해져 있고 돈의 이월이 가능하며 대출과 지출 연기가 불가능하다면, 가장 큰 부족액만큼 처음에 마련해야 모든 지출 기한을 지킬 수 있다. 처음에 필요한 금액과 전체 거래가 끝난 뒤 남는 잔액은 서로 다르다."
],"3개월 동안 매월 말에 200을 지출한다. 수입 600은 3개월째 초에 한 번 들어온다. 남은 돈은 이월할 수 있지만 대출과 지출 연기는 불가능하다. 최소 초기 자금을 구해 보자.",[
"초기 자금이 0이라면 1개월째 말에는 수입 없이 200을 지출해야 하므로 200이 부족하다.","2개월째 말까지의 지출은 200+200=400이고 아직 수입이 없으므로 400이 부족하다.","처음에 400을 준비하면 첫 두 달의 지출을 낼 수 있다. 마지막 지출은 3개월째 초에 들어온 수입 600으로 충당할 수 있다."
],"필요한 최소 초기 자금은 400이다.","초기 자금을 0으로 놓았을 때의 시점별 잔액 중 가장 크게 부족한 금액을 찾는다.","같은 달의 수입과 지출이라도 어느 것이 먼저 발생하는지에 따라 필요한 초기 자금이 달라질 수 있다.",{q:"예제에서 모든 지출 기한을 지키기 위해 처음에 필요한 최소 금액은?",o:['0','400','600'],a:1,why:"수입 전에 발생하는 첫 두 달의 지출 200+200=400을 마련해야 한다."},['F90']);
supplement42(10,5,"금융 생활 설계의 과정","재무 목표 설정부터 평가와 수정까지의 과정을 알아보자.",[
"재무 목표를 설정할 때에는 언제까지 얼마의 자금이 필요한지 정한다. 그다음 현재의 자산과 부채, 수입과 지출, 이용 가능한 자원을 파악한다. 이를 통해 목표를 이루기 위해 추가로 얼마를 마련해야 하는지 알 수 있다.",
"재무 계획을 세울 때에는 목표의 우선순위, 자금 마련 일정, 예산과 구체적인 행동을 정한다. 이후 계획에 따라 수입과 지출을 관리하고 저축 등을 실행한다. 현재 마련할 수 있는 금액이 목표에 못 미친다면 자금 마련 방법이나 목표 금액, 기한을 검토해야 한다.",
"실행 후에는 결산을 통해 목표를 얼마나 달성했는지 평가한다. 계획과 실제 결과가 다르다면 그 원인을 살펴보고 계획을 수정한다. 수입이 줄거나 지출이 늘어나는 등 여건이 달라졌을 때에도 계획을 다시 검토한다."
],"3개월 뒤에 60을 마련하려고 한다. 현재 가진 돈은 20이고 매월 10씩 추가로 마련할 수 있다. 다른 자금은 없다. 현재의 계획으로 목표를 달성할 수 있는가?",[
"목표는 3개월 뒤에 60을 마련하는 것이다. 현재 보유액은 20이고 매월 추가로 마련할 금액은 10이다.","3개월 뒤 마련할 수 있는 총액은 20+10×3=50이다.","목표 금액 60보다 10이 부족하다. 목표 금액이나 기한, 자금 마련 방법을 재검토해야 한다."
],"현재의 계획으로는 50을 마련할 수 있으므로 목표까지 10이 부족하다.","목표 설정에서는 필요한 금액과 기한을, 상태 분석에서는 현재 여건을, 계획 수립에서는 마련 방법을 정한다. 실행 결과는 평가와 수정에 반영한다.","",{q:"결산을 통해 문제의 원인을 찾고 재무 계획을 바꾸는 단계는?",o:['재무 목표 설정만','평가 및 수정'],a:1,why:"실행 결과를 살펴보고 계획을 바꾸는 과정은 평가 및 수정이다."},['F90']);
supplement42(11,4,"외화 가격과 환율 변화의 결합","외화 가격과 환율이 함께 변할 때 원화 수익률을 구해 보자.",[
"외화 자산의 원화 가치는 외화 표시 가격에 환율을 곱하여 구한다. 가격과 환율이 모두 달라졌다면 매수 당시와 매도 당시의 원화 금액을 각각 계산한다. 매도 후 받은 금액에서 매수할 때 지출한 금액을 빼면 원화 기준 손익이다.",
"수량이 일정하고 별도의 수익과 비용이 없다면 원화 금액의 변화 배율은 외화 가격의 변화 배율과 환율의 변화 배율을 곱하여 구할 수 있다.\n\n나중 원화 금액 ÷ 처음 원화 금액\n= (나중 외화 가격 ÷ 처음 외화 가격) × (나중 환율 ÷ 처음 환율)",
"변화 배율이 1.05라면 나중 금액은 처음 금액의 1.05배이고 수익률은 5%이다. 배율에서 1을 뺀 값에 100을 곱하면 수익률을 구할 수 있다. 외화 가격의 증가율과 환율의 증가율을 그대로 더하는 방식은 두 변화가 함께 작용한 결과를 정확히 반영하지 못한다."
],"자산 1개의 처음 가격은 100달러이고 환율은 1달러당 1,200원이다. 나중 가격은 90달러이고 환율은 1달러당 1,400원이다. 배당·세금·수수료는 없다. 원화 기준 손익과 수익률을 구해 보자.",[
"처음 원화 금액은 100×1,200=120,000원, 나중 금액은 90×1,400=126,000원이다. 이익은 6,000원이다.","외화 가격의 변화 배율은 90/100=0.9, 환율의 변화 배율은 1,400/1,200=7/6이다.","두 배율을 곱하면 0.9×7/6=1.05이다. 원화 금액은 처음의 1.05배가 되었으므로 수익률은 5%이다."
],"원화 기준 이익은 6,000원이며 수익률은 5%이다.","외화 가격과 환율의 변화는 각각의 배율을 곱한다. 그 결과에서 1을 빼면 원화 금액의 변화율을 구할 수 있다.","중간 입출금, 배당, 세금, 수수료가 있다면 각 금액과 발생 시점도 반영해야 한다.",{q:"예제에서 나중 원화 금액은 처음 원화 금액의 몇 배인가?",o:['0.9','1.05','1.9'],a:1,why:"0.9×7/6=1.05이므로 처음의 1.05배이다."},['F91']);
supplement42(13,4,"생산 자료의 표와 그래프","같은 생산 조건을 노동시간과 생산량으로 나타내 보자.",[
"단위당 노동시간과 총노동량을 알면 한 재화만 생산할 때의 최대량을 구할 수 있다. 총노동량이 48시간이고 X재 1개에 2시간, Y재 1개에 4시간이 필요하다면 최대량은 X재 24개 또는 Y재 12개이다.",
"같은 조건을 직선인 생산 가능 곡선으로 나타내면 X축 절편은 24, Y축 절편은 12이다. X재를 24개 생산하는 대신 Y재를 12개 생산할 수 있으므로 X재 1개 생산의 기회비용은 Y재 1/2개이다. 노동시간으로 계산한 2/4개와 같다.",
"두 재화를 함께 생산할 때에는 한 재화에 사용한 노동시간을 빼고 남은 시간으로 다른 재화를 얼마나 생산할 수 있는지 구한다. 최대 생산량에 남은 자원의 비율을 곱하는 방법으로도 같은 결과를 얻을 수 있다."
],"총노동량은 48시간이다. X재 1개에 2시간, Y재 1개에 4시간이 필요하다. X재를 18개 생산할 때 함께 생산할 수 있는 Y재의 최대량을 두 방법으로 구해 보자.",[
"모든 노동을 한 재화에 투입하면 X재는 최대 48÷2=24개, Y재는 최대 48÷4=12개이다.","X재 18개에 노동 18×2=36시간을 사용하므로 48−36=12시간이 남는다.","남은 노동으로 Y재를 12÷4=3개 생산할 수 있다. Y재 최대량에 남은 자원 비율을 곱한 12×(1−18/24)로 계산해도 3개이다."
],"X재 18개와 함께 생산할 수 있는 Y재의 최대량은 3개이다.","단위당 노동시간으로 최대 생산량을 구하면 투입량표와 생산량표를 서로 바꿔 나타낼 수 있다.","",{q:"예제에서 X재 18개와 함께 최대로 생산할 수 있는 Y재는 몇 개인가?",o:['3','6','12'],a:0,why:"X재 생산에 36시간을 쓰고 남은 12시간으로 Y재를 12÷4=3개 생산할 수 있다."},['T104','A86']);
supplement42(13,5,"생산 기회비용이 같은 두 나라","최대 생산량이 달라도 기회비용은 같을 수 있음을 알아보자.",[
"최대 생산량이 적다고 생산의 기회비용이 반드시 큰 것은 아니다. 생산 가능 곡선이 직선이면 한 재화 생산의 기회비용은 두 재화의 최대 생산량 비율로 구한다. 두 나라의 이 비율이 같다면 생산 규모가 달라도 기회비용은 같다.",
"같은 총노동량에서 A국의 최대량이 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 4개라고 하자. A국은 두 재화를 모두 더 많이 생산하므로 절대 우위를 가진다. 그러나 X재 1개 생산의 기회비용은 A국이 Y재 12/24개, B국이 Y재 4/8개로 모두 Y재 1/2개이다.",
"이 모형에서 양국이 모두 자급 생산보다 더 큰 이익을 얻으려면 교환 비율이 두 나라의 기회비용 사이에 있어야 한다. 두 기회비용이 같으면 그 사이의 비율이 없으므로, 기회비용의 차이를 이용하여 양국 모두 양(+)의 교역 이익을 얻는 교환 비율도 없다."
],"같은 총노동량에서 A국의 최대 생산량은 X재 24개 또는 Y재 12개, B국은 X재 8개 또는 Y재 4개이다. 생산 가능 곡선은 직선이다. X재 1개 생산의 기회비용을 비교해 보자.",[
"A국의 X재 1개 생산 기회비용은 Y재 12/24=0.5개이다.","B국의 X재 1개 생산 기회비용도 Y재 4/8=0.5개이다.","양국 모두 양(+)의 이익을 얻으려면 교환 비율이 0.5보다 크면서 0.5보다 작아야 한다. 두 조건을 동시에 만족하는 비율은 없다."
],"양국의 X재 1개 생산의 기회비용은 Y재 0.5개로 같다. 주어진 생산 조건에서는 양국 모두 양의 교역 이익을 얻는 교환 비율이 없다.","절대 우위는 같은 투입량에서 생산할 수 있는 수량을 비교한다. 비교 우위는 두 재화의 최대 생산량 비율로 구한 기회비용을 비교한다.","",{q:"A국의 최대량은 X재 24개·Y재 12개, B국은 X재 8개·Y재 4개이다. X재 1개 생산의 기회비용은?",o:["A국만 Y재 0.5개이다.","두 나라 모두 Y재 0.5개이다."],a:1,why:"A국은 12/24, B국은 4/8로 계산하므로 두 나라 모두 Y재 0.5개이다."},['T104','A86']);
supplement42(14,4,"교역 이익이 0이 되는 교환 비율","기회비용과 같은 교환 비율에서 각국의 이익을 구해 보자.",[
"교환 비율이 어느 나라의 생산 기회비용과 같으면 그 나라는 직접 생산할 때보다 추가로 얻는 재화가 없다. 이때 교역 이익은 0이다. 다른 나라가 이익을 얻더라도 양국 모두 양(+)의 이익을 얻는 경우는 아니다.",
"X재 1개 생산의 기회비용이 A국은 Y재 0.5개, B국은 Y재 1개라고 하자. A국이 X재 6개를 생산하면 Y재 3개를 포기한다. 따라서 X재 6개를 수출하고 Y재 3개를 받으면 A국의 이익은 0이다. B국은 X재 6개를 직접 생산할 때 Y재 6개를 포기하므로, 수입 대가로 Y재 6개를 지급하면 이익이 0이다.",
"양국 모두 0보다 큰 이익을 얻으려면 교환하는 Y재의 양이 3개보다 많고 6개보다 적어야 한다. 두 경계값에서는 어느 한 나라의 이익이 0이므로 제외한다. 손해만 보지 않으면 되는 문제라면 이익이 0인 경우를 포함할 수 있다."
],"A국과 B국이 X재 6개를 교환하려고 한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이고 다른 비용은 없다. 양국 모두 양(+)의 이익을 얻는 Y재 수량의 범위를 구해 보자.",[
"Y재 3개를 교환하면 A국의 이익은 3−6×0.5=0이다.","Y재 6개를 교환하면 B국의 이익은 6×1−6=0이다.","A국은 Y재를 3개보다 많이 받아야 하고 B국은 6개보다 적게 주어야 한다. 따라서 교환할 Y재 수량 y의 범위는 3<y<6이다."
],"양국 모두 양(+)의 이익을 얻는 범위는 3<y<6이다.","기회비용과 같은 경계값을 대입하면 어느 나라의 이익이 0인지 확인할 수 있다.","두 나라의 이익을 합한 값이 양수라는 것과 각 나라의 이익이 모두 양수라는 것은 다르다.",{q:"X재 6개와 Y재 3개를 교환할 때 A국의 교역 이익은 얼마인가?",o:['0','3','6'],a:0,why:"받는 Y재 3개와 X재 생산으로 포기한 Y재 3개가 같으므로 이익은 0이다."},['T104','A86']);
supplement42(14,5,"교환 비율과 수출 가능한 수량","교환 비율과 생산량을 함께 고려하여 교역 가능 여부를 판단해 보자.",[
"교환 비율이 양국에 유리하더라도 교환할 재화를 실제로 가지고 있어야 한다. 재고와 다른 거래가 없다면 한 나라의 수출량은 그 나라의 생산량을 넘을 수 없다.",
"A국이 X재 24개, B국이 Y재 8개에 완전 특화했다고 하자. X재 12개와 Y재 9개를 교환하는 비율은 X재 1개당 Y재 0.75개이다. 양국의 X재 생산 기회비용이 각각 Y재 0.5개와 1개라면 비율은 유리하다. 그러나 B국은 Y재를 8개만 생산했으므로 9개를 수출할 수 없다.",
"같은 비율로 수량을 줄이면 생산량 안에서 가능한 교환을 찾을 수 있다. X재 8개와 Y재 6개를 교환하면 비율은 그대로 0.75이고, 두 나라 모두 생산량 안에서 수출할 수 있다. 최소 거래 단위나 정수 조건이 있다면 수량이 그 조건도 만족해야 한다."
],"A국은 X재 24개, B국은 Y재 8개만 생산한다. X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. X재 8개와 Y재 6개를 교환할 수 있는지 판단하고 각국의 이익을 구해 보자.",[
"교환 비율은 X재 1개당 Y재 6/8=0.75개이다. 0.5와 1 사이이므로 양국에 유리하다.","A국의 수출량 8개는 생산량 24개 이하이고, B국의 수출량 6개도 생산량 8개 이하이므로 교환할 수 있다.","A국의 이익은 Y재 6−8×0.5=2개이다. B국의 이익은 직접 생산할 때 포기할 Y재 8개에서 지급한 6개를 뺀 2개이다."
],"교환 비율이 유리하고 수출량도 생산량을 넘지 않는다. 교환은 가능하며 각국은 Y재 2개만큼 이익을 얻는다.","교환 비율이 기회비용 사이에 있는지 확인한 뒤, 각국이 수출할 수량을 실제로 보유하는지 확인한다.","",{q:"B국은 Y재 8개만 생산했고 재고와 다른 거래가 없다. Y재 9개를 수출할 수 있는가?",o:["교환 비율이 유리하면 가능하다.","생산량을 넘으므로 불가능하다."],a:1,why:"B국이 제공할 수 있는 Y재는 8개뿐이므로 9개를 수출할 수 없다."},['T104','A86']);
supplement42(14,6,"소비량으로 거래를 추론하는 조건","소비량에서 생산량과 수입량을 구할 수 있는 조건을 알아보자.",[
"두 나라만 거래하고 재고와 손실이 없다면 양국의 소비량 합계는 총생산량과 같다. 재화별로 소비량을 더하여 생산된 총량을 구할 수 있다. 각 나라가 한 재화에 완전 특화했다면 해당 재화의 총량이 그 나라의 생산량이다.",
"완전 특화한 나라가 자신이 생산하지 않은 재화를 소비한다면 그 수량은 수입량이다. A국이 X재만 생산하고 Y재 5개를 소비했다면 Y재 5개를 수입한 것이다. 다만 Y재를 일부 자급 생산했다면 소비량 전체를 수입량으로 볼 수 없다.",
"다른 나라와도 거래했거나 재고가 있었다면 소비량에는 그 수량이 반영될 수 있다. 따라서 두 나라의 소비량표만으로 두 나라 사이의 교환량을 언제나 구할 수 있는 것은 아니다. 완전 특화 여부와 재고·손실·다른 거래에 관한 조건이 필요하다."
],"A국은 X재, B국은 Y재에 완전 특화하였다. 교역 후 A국은 X재 18개·Y재 5개, B국은 X재 6개·Y재 7개를 소비한다. 재고·손실·다른 거래는 없다. 생산량과 교환 비율을 구해 보자.",[
"양국의 소비량 합계는 X재 18+6=24개, Y재 5+7=12개이다. 따라서 A국은 X재 24개, B국은 Y재 12개를 생산하였다.","A국이 생산하지 않은 Y재의 소비량 5개와 B국이 생산하지 않은 X재의 소비량 6개가 각각 수입량이다.","따라서 X재 6개와 Y재 5개를 교환하였고, X재 1개당 교환 비율은 Y재 5/6개이다."
],"완전 특화와 거래 조건을 이용하면 A국의 생산량은 X재 24개, B국은 Y재 12개이고 교환 수량은 X재 6개 대 Y재 5개임을 알 수 있다.","소비량 합계로 생산량을, 생산하지 않은 재화의 소비량으로 수입량을 구한다.","완전 특화가 아니라면 소비량에 자국 생산량과 수입량이 함께 포함될 수 있다.",{q:"두 나라가 서로 거래하면서 다른 나라와도 거래했다. 두 나라의 소비량표만으로 서로 교환한 수량을 항상 알 수 있는가?",o:["항상 알 수 있다.","다른 거래에 관한 자료가 더 필요할 수 있다."],a:1,why:"다른 나라에서 수입하거나 다른 나라로 수출한 수량이 소비량에 반영될 수 있기 때문이다."},['A86','T104']);
supplement42(15,4,"총액과 시간당·1인당 금액의 차이","무역 자료에서 총액과 평균액을 구별하고 필요한 정보를 찾아보자.",[
"거래 총액은 거래의 전체 규모를 나타낸다. 생산자에게 지급한 대가의 총액은 그중 생산자에게 돌아간 금액을 나타낸다. 두 총액이 모두 늘더라도 증가율은 서로 다를 수 있다. 따라서 거래액의 증가율을 생산자의 소득 증가율로 대신할 수는 없다.",
"시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 평균적으로 한 사람에게 돌아간 금액은 지급 총액을 인원으로 나누어 구한다. 총액이 늘어도 노동시간이나 인원이 얼마나 달라졌는지에 따라 시간당 또는 1인당 금액은 증가할 수도, 감소할 수도 있다.",
"소득의 변화와 노동 조건, 환경의 변화도 각각 살펴야 한다. 지급한 대가가 늘었다는 자료만으로 작업장이 안전해졌거나 환경 오염이 줄었다고 할 수는 없다. 노동 조건은 노동시간과 작업장 안전 자료로, 환경 영향은 오염과 자원 사용에 관한 자료로 살펴본다."
],"거래액은 15%, 생산자에게 지급한 대가 총액은 4% 증가하였다. 노동시간과 환경에 관한 자료는 없다. 이 자료에서 알 수 있는 사실과 추가로 필요한 정보를 설명해 보자.",[
"거래액과 생산자에게 지급한 대가 총액은 모두 증가했으며, 거래액의 증가율이 더 크다.","시간당 보수의 변화를 알려면 노동시간이 얼마나 달라졌는지 알아야 한다.","환경이 개선되었는지 알려면 오염이나 자원 사용의 변화에 관한 자료가 필요하다."
],"두 총액의 증가는 알 수 있지만, 시간당 보수와 환경의 변화는 추가 자료가 있어야 알 수 있다.","총액을 시간으로 나누면 시간당 금액, 인원으로 나누면 평균 1인당 금액이다.","환경 자료가 없다는 사실은 환경 피해가 없다는 뜻이 아니다. 주어지지 않은 피해를 0으로 계산하지 않는다.",{q:"환경에 관한 자료가 없을 때 환경 피해가 없었다고 결론 내릴 수 있는가?",o:['그렇다.',"환경 영향에 관한 자료가 더 필요하다."],a:1,why:"환경에 미친 영향을 알 수 있는 자료가 있어야 피해 발생 여부를 판단할 수 있다."},['T105']);

libraryHTML=function(){return "<span class=\"eyebrow\">CONCEPT LIBRARY · 72 LECTURES</span><h1>기초에서 심화까지, 경제 개념 강의실</h1><p>기초 6강·15단원의 기본 45강·조건 변경과 오개념을 다루는 심화 21강으로 구성했습니다. 모든 강의에 본문·단계별 예제·확인 질문·숏컷과 주의사항이 있습니다. 기초·심화는 기본 문제 경로와 분리하여 선택해 읽을 수 있습니다.</p><div class=\"notice\">72개는 강의 편성 단위입니다. 서로 관련된 개념의 재설명이 포함되어 있으며 72개의 완전히 다른 경제 개념이라는 뜻은 아닙니다. 기존 집중 사건 12강도 별도로 보존하되 새 학습량으로 중복 합산하지 않습니다.</div><h2 class=\"section\">00 · 경제를 읽는 여섯 가지 준비</h2><div class=\"grid\">"+COURSE41.lessons.filter(l=>l.ch===0).map(lessonCard72).join('')+'</div>'+COURSE41.chapters.map(ch=>'<h2 class="section">'+String(ch.id).padStart(2,'0')+'. '+esc(ch.title)+'</h2><div class="grid">'+COURSE41.lessons.filter(l=>l.ch===ch.id).map(lessonCard72).join('')+'</div>').join('')+"<h2 class=\"section\">기존 세 집중 사건 · 보존한 12강</h2><div class=\"grid\">"+LESSONS.map(l=>'<button class="card bookcard" data-action="lesson" data-id="'+l.id+'"><span class="tag">집중 사건 · '+l.id+'</span><h3>'+esc(l.title)+'</h3><p class="smalltext muted">'+esc(l.lead)+'</p></button>').join('')+"</div><div class=\"actions section\"><button data-action=\"c41-export-lectures\">72강 집필 원고 Markdown</button><button data-action=\"c41-export-data\">전체 학습 자료 저장하기(JSON)</button><button data-action=\"export-lessons\">기존 집중 12강 원고</button></div>";};

gp43("공공재 공급과 시장 거래","정부가 공공재를 공급하면 민간의 시장 거래는 모두 금지되는가?",['그렇다.','그렇지 않다. 두 활동은 함께 나타날 수 있다.'],1,"정부의 공공재 공급과 민간의 시장 거래는 함께 나타날 수 있다. 혼합 경제 체제에서는 시장경제적 요소와 계획경제적 요소를 함께 활용한다.","혼합 경제 체제에서는 시장과 정부가 함께 역할을 합니다.")]);
guide43(2,1,"기본적인 경제 문제",'L02-1',"공방 회의에서 A는 어떤 제품을 몇 개 만들지, B는 어떤 기술로 생산할지, C는 생산물을 누구에게 나눌지 논의한다.","상품의 종류와 수량, 생산 방법, 분배 방식은 기본적인 경제 문제이다.",[
gp43("무엇을 얼마나 생산할까","A가 해결하려는 경제 문제는?",['무엇을 얼마나 생산할 것인가','어떻게 생산할 것인가','어떻게 분배할 것인가'],0,"어떤 제품을 몇 개 만들지 정하는 것은 ‘무엇을 얼마나 생산할 것인가’의 문제이다.","제품의 종류와 수량을 정하는 질문입니다."),
gp43("생산 방법과 분배","B와 C가 논의하는 경제 문제를 순서대로 옳게 짝지은 것은?",['분배 / 생산 방법','생산 방법 / 분배','종류·수량 / 종류·수량'],1,"B의 기술 선택은 생산 방법에 관한 문제이다. C의 생산물 배분은 누구에게 나눌 것인지에 관한 분배 문제이다.","기술은 만드는 방법, 배분은 나누는 방법과 관련됩니다."),
gp43("경제 문제와 경제 체제","세 가지 경제 문제를 논의한다는 이유만으로 계획경제 체제라고 볼 수 있는가?",['가능하다.','결정 주체와 해결 방식을 더 확인해야 한다.'],1,"시장경제 체제에서도 같은 경제 문제를 해결해야 한다. 두 체제의 차이는 경제 문제의 유무가 아니라, 시장 가격과 민간의 선택을 따르는지 정부의 계획과 명령을 따르는지에 있다.","시장경제 체제에서도 무엇을 얼마나 생산할지 결정해야 합니다.")]);
guide43(2,2,"보상이 늘어난 뒤의 선택",'L02-3',"A와 B 중 하나만 선택한다. A의 편익은 28, 명시적 비용은 9이고 B의 편익은 25, 명시적 비용은 8이다. 이후 B의 편익만 1 증가한다. 모든 값의 단위는 같고 다른 비용은 없다.","각 대안의 편익에서 명시적 비용을 빼면 유리한 대안을 비교할 수 있다. 보상이 바뀐 뒤에도 두 값을 다시 비교한다.",[
gn43("변경 전 편익과 비용","각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.",["A 편익−명시적 비용","B 편익−명시적 비용"],[19,17],"A는 28−9=19, B는 25−8=17이다. 따라서 처음에는 A가 유리하다.","A는 28에서 9를, B는 25에서 8을 빼세요."),
gn43("보상 증가 후의 비교","B의 편익이 26으로 증가하였다. 변경 후 B의 ‘편익−명시적 비용’과 A에서 구한 값 19에서 이를 뺀 차이를 구하시오.",["변경 후 B의 편익−명시적 비용","19에서 변경 후 B의 값을 뺀 차이"],[18,1],"B는 26−8=18이다. A의 값은 19로 그대로이므로 차이는 19−18=1이다.","B의 명시적 비용은 여전히 8입니다."),
gp43("선택의 변화","B의 보상이 증가한 뒤 가장 유리한 대안은?",['반드시 바뀐다.','아니다. 이 조건에서는 A가 여전히 유리하다.'],1,"B는 전보다 유리해졌지만 편익에서 명시적 비용을 뺀 18이 A의 19보다 작다. 따라서 A를 선택하는 것이 여전히 유리하다.","보상 증가 후에도 19와 18을 비교해야 합니다.")]);
guide43(3,1,"기회비용과 순편익 구하기",'L03-2',"A의 편익은 42, 명시적 비용은 12이고 B의 편익은 48, 명시적 비용은 20이다. 두 대안 중 하나만 선택하며 다른 대안과 매몰 비용은 없다.","A를 선택하면 B를 포기한다. B를 선택했을 때 얻을 수 있었던 가치가 A 선택의 암묵적 비용이다.",[
gn43("편익−명시적 비용 완성","각 대안의 편익에서 명시적 비용을 뺀 값을 구하시오.",["A 편익−명시적 비용","B 편익−명시적 비용"],[30,28],"A는 42−12=30, B는 48−20=28이다.","이 단계에서는 직접 지출하는 비용만 뺍니다. 포기한 대안의 가치는 다음 단계에서 반영합니다."),
gn43("A의 기회비용과 순편익","A 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.",['A 암묵적 비용','A 기회비용','A 순편익'],[28,40,2],"A를 선택하면 B의 28을 포기하므로 암묵적 비용은 28이다. 명시적 비용 12를 더하면 기회비용은 40이다. 편익에서 기회비용을 뺀 순편익은 42−40=2이다.","암묵적 비용에는 B를 선택했을 때 얻을 수 있었던 가치를 넣으세요."),
gp43("명시적 비용과 기회비용의 차이","A의 편익에서 명시적 비용을 뺀 30을 A의 순편익이라고 할 수 있는가?",['가능하다.','아니다. 순편익은 편익에서 기회비용을 뺀 값이다.'],1,"30에는 B를 포기한 가치 28이 아직 반영되지 않았다. 순편익은 편익에서 기회비용을 뺀 값이므로 A의 순편익은 2이다.","기회비용에는 명시적 비용과 암묵적 비용이 모두 포함됩니다.")]);
guide43(3,2,"다른 대안의 가치와 순편익",'L03-5',"A의 편익과 명시적 비용은 각각 52와 20, B는 54와 19, C는 46과 13이다. 세 대안 중 하나만 선택하며 제시된 것 외의 비용은 없다.","편익에서 명시적 비용을 빼면 A는 32, B는 35, C는 33이다. B를 선택할 때에는 남은 A와 C 중 더 큰 가치를 포기한다.",[
gp43("B 선택의 암묵적 비용","B를 선택할 때의 암묵적 비용으로 옳은 것은?",["A와 C의 가치를 합한 65","B의 편익에서 명시적 비용을 뺀 35","포기한 A와 C 중 더 큰 C의 가치 33"],2,"B를 선택하면 A와 C를 포기한다. 두 대안은 동시에 선택할 수 없으므로 가치를 합하지 않고 더 큰 하나인 C의 33을 암묵적 비용으로 본다.","B 자신이 아니라, 선택하지 않은 A와 C를 비교하세요."),
gn43("B의 기회비용과 순편익","B 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.",['암묵적 비용','기회비용','순편익'],[33,52,2],"암묵적 비용은 33이다. 명시적 비용 19를 더하면 기회비용은 52이고, 순편익은 54−52=2이다.","기회비용을 구한 뒤 B의 편익 54에서 빼세요."),
gp43("포기한 가치가 커진 경우","C의 편익에서 명시적 비용을 뺀 값만 34.5로 증가하고 B는 35로 일정하다. 옳은 설명은?",["B가 여전히 가장 유리하지만 B 선택의 암묵적 비용은 커진다.","선택이 같으므로 암묵적 비용도 그대로이다.","C가 반드시 가장 유리해진다."],0,"B의 35가 C의 34.5보다 크므로 B가 여전히 유리하다. 그러나 B를 선택하면서 포기하는 C의 가치는 커졌다. 따라서 암묵적 비용은 늘고 순편익은 35−34.5=0.5로 줄어든다.","선택이 바뀌는지와 포기한 가치가 달라지는지를 각각 생각해 보세요.")]);
guide43(4,1,"매몰 비용과 현재의 선택",'L04-1',"과거에 지출한 200은 어떤 대안을 선택해도 회수할 수 없다. 앞으로 A를 선택하면 편익 180과 추가 비용 120이, B를 선택하면 편익 145와 추가 비용 70이 발생한다.","회수할 수 없는 과거 지출 200은 매몰 비용이다. 현재의 선택에서는 앞으로 얻을 편익과 추가로 부담할 비용을 비교한다.",[
gn43("앞으로의 편익과 비용","A와 B의 편익에서 명시적 비용을 뺀 값을 각각 구하시오.",["A 편익−명시적 비용","B 편익−명시적 비용"],[60,75],"A는 180−120=60, B는 145−70=75이다. 과거 지출 200은 두 계산에서 제외한다.","이미 지출하여 회수할 수 없는 돈은 현재의 비용에 더하지 않습니다."),
gn43("B의 기회비용과 순편익","B 선택의 암묵적 비용, 기회비용, 순편익을 각각 구하시오.",['B 암묵적 비용','B 기회비용','B 순편익'],[60,130,15],"B를 선택하면 A에서 얻을 수 있었던 60을 포기한다. 암묵적 비용은 60이고, 기회비용은 70+60=130이다. 순편익은 145−130=15이다.","암묵적 비용은 포기한 A의 가치입니다."),
gp43("과거 지출만 커진 경우","앞으로의 조건은 같고, 회수할 수 없는 과거 지출만 200에서 500으로 커졌다. 옳은 설명은?",['그 사실만으로 두 대안의 우열은 바뀌지 않는다.','반드시 A를 계속해야 한다.','반드시 B도 포기해야 한다.'],0,"매몰 비용의 크기만 달라졌으므로 앞으로 얻을 편익과 부담할 비용은 그대로이다. B가 더 유리하다는 결론도 달라지지 않는다.","A와 B의 앞으로의 편익이나 비용은 바뀌지 않았습니다.")]);
guide43(4,2,"B가 더 유리해지는 최소 반환금",'L04-5',"A의 편익은 90, 명시적 비용은 36이고 B의 편익은 84, 명시적 비용은 36이다. 새 계약으로 B를 선택할 때만 반환금 r을 받는다. r은 0 이상의 정수이다.","A의 편익에서 명시적 비용을 빼면 54이다. B는 반환금을 포함하면 84+r−36=48+r이다. 두 값이 같아지는 경우와 B가 더 커지는 경우를 구분한다.",[
gp43("동률이 되는 식","두 대안의 편익에서 명시적 비용을 뺀 값이 같아지는 식은?",['54=48+r','54=84+r','54=36−r'],0,"A의 값은 54이고 반환금을 포함한 B의 값은 48+r이다. 따라서 54=48+r로 나타낼 수 있다.","B에는 반환금 r을 더하고 명시적 비용 36을 빼세요."),
gn43("동률과 최소 정수","두 대안이 동률이 되는 반환금과 B가 A보다 더 유리해지는 최소 정수 반환금을 각각 구하시오.",['동률의 반환금','B가 유일한 최선인 최소 정수 반환금'],[6,7],"r=6이면 B는 48+6=54로 A와 같다. B가 더 유리하려면 r이 6보다 커야 한다. r은 정수이므로 최소값은 7이다.","반환금 6에서는 두 대안이 같습니다. 더 유리해지는 값을 찾아야 합니다."),
gp43('조건 확인',"반환금이 6일 때의 설명으로 옳은 것은?",["B만 더 유리하다.",'동률이며 어느 한쪽만 유일한 최선은 아니다.'],1,"A와 B 모두 편익에서 명시적 비용을 뺀 값이 54이다. 두 대안은 동률이므로 어느 하나만 더 유리하지는 않다.","B의 48에 반환금 6을 더한 뒤 A의 54와 비교하세요.")]);
guide43(5,1,"제3자의 피해를 고려한 활동량",'L05-2',"활동량이 1, 2, 3일 때 개인 이익은 각각 26, 45, 54이다. 제3자의 보상되지 않은 피해는 각각 3, 12, 30이다. 활동량이 0이면 이익과 피해도 모두 0이다. 금액의 단위는 같고 다른 효과는 없다.","개인 이익에서 제3자의 피해를 뺀 금액으로 활동량을 비교한다.",[
gp43('비교 기준',"이번 문제에서 활동량을 비교하기 위해 계산할 값은?",['개인 이익+피해','개인 이익−피해','피해를 무시한 개인 이익'],1,"개인이 얻는 이익에 다른 사람이 입는 피해까지 고려하므로 개인 이익에서 제3자의 피해를 빼야 한다.","제3자가 피해를 입었으므로 개인 이익에 더하는 것이 아니라 빼야 합니다."),
gn43('두 번째 장부',"각 활동량에서 개인 이익에서 피해를 뺀 금액을 구하시오. 이어서 그 금액이 가장 큰 활동량을 구하시오.",["활동량 1의 이익−피해","활동량 2의 이익−피해","활동량 3의 이익−피해","이익−피해가 가장 큰 활동량"],[23,33,24,2],"활동량별 금액은 26−3=23, 45−12=33, 54−30=24이다. 활동량이 2일 때 33으로 가장 크다.","구한 세 금액을 비교한 뒤, 가장 큰 금액에 해당하는 활동량을 쓰세요."),
gp43("개인 선택과의 차이","개인 이익만 고려하면 활동량 3이 유리하다. 제3자의 피해를 고려했을 때 결과가 달라지는 이유는?",['두 장부의 고려 범위가 다르다.','산술 계산은 모두 틀렸다.','활동량은 언제나 같아야 한다.'],0,"개인 이익만 고려할 때에는 다른 사람의 피해가 비용에 포함되지 않는다. 피해까지 빼면 활동량 3보다 2에서 얻는 금액이 더 크다.","활동량이 3일 때 개인 이익은 크지만 제3자의 피해도 큽니다.")]);
guide43(5,2,"부담금과 정부의 수입",'L05-4',"활동량은 3, 부담금 부과 전 이익은 72, 단위당 부담금은 8, 제3자의 피해는 18이다. 정부 수입도 합산하며 행정 비용 등 다른 효과는 없다.","생산자가 낸 부담금은 정부가 수입으로 받는다. 생산자의 납부 후 이익과 정부 수입을 더한 뒤 제3자의 피해를 뺀다.",[
gn43("총부담금과 생산자 이익","부담금 총액과 납부 후 생산자 이익을 각각 구하시오.",['부담금 총액','생산자의 납부 후 이익'],[24,48],"총부담금은 3×8=24이다. 생산자의 납부 후 이익은 72−24=48이다.","부담금 8은 1단위당 금액입니다. 활동량 3을 곱해야 총액이 됩니다."),
gn43("정부 수입을 포함한 합계","정부 수입과 ‘생산자의 납부 후 이익+정부 수입−제3자의 피해’를 각각 구하시오.",["정부의 부담금 수입",'생산자+정부−피해'],[24,54],"정부가 받은 부담금은 24이다. 따라서 전체 합계는 48+24−18=54이다.","생산자가 낸 24는 이미 생산자 이익에서 빠졌습니다. 정부 수입으로 더하세요."),
gp43("부담금의 정책 효과","이번 계산에서 부담금이 생산자에게서 정부로 옮겨 간다는 이유로 부담금 정책에 아무 효과도 없다고 볼 수 있는가?",['그렇다. 모든 효과가 없다.','아니다. 선택량 변화와 다른 현실 효과는 별도로 검토한다.'],1,"이번에는 활동량 3이 고정되어 있다. 부담금 때문에 생산자가 선택하는 활동량이 달라진다면 이익과 피해도 달라질 수 있다. 이 계산만으로 정책에 효과가 없다고 결론 내릴 수는 없다.","이번 문제는 활동량이 바뀌는 경우를 계산한 것이 아닙니다.")]);
guide43(6,1,"가로등 모금액과 나의 선택",'L06-2',"주민 4명은 각각 10토큰을 가지고 있다. 24토큰 이상이 모이면 가로등을 설치하고 각자 편익 10을 얻는다. 설치에 실패하면 납부액을 돌려받는다. 다른 세 주민의 납부액은 8, 4, 6으로 정해져 있고, 나는 0, 4, 6, 10 중 하나를 낸다.","총모금액이 설치비에 미치는지에 따라 설치 여부가 달라진다. 설치 후에는 남은 토큰과 편익의 합으로 내게 유리한 선택을 비교한다.",[
gn43("부족한 설치비","다른 주민의 납부액 합계와 설치에 더 필요한 금액을 각각 구하시오.",['타인 납부 합계','설치 부족액'],[18,6],"다른 주민의 납부액은 8+4+6=18토큰이다. 설치비 24토큰에서 18토큰을 빼면 6토큰이 부족하다.","24토큰에서 다른 주민이 낸 돈을 빼세요."),
gn43("4토큰과 6토큰을 내는 경우","내가 4토큰을 내는 경우와 6토큰을 내는 경우에 남은 토큰과 설치 편익의 합을 각각 구하시오.",["내가 4를 낼 때 최종 결과","내가 6을 낼 때 남은 토큰+편익"],[10,14],"4토큰을 내면 22토큰만 모여 설치하지 못한다. 납부액을 돌려받으므로 처음처럼 10토큰을 보유하고 편익은 없다.\n\n6토큰을 내면 설치에 성공한다. 4토큰이 남고 편익 10을 얻으므로 합은 14이다.","설치하지 못하면 낸 돈만 돌려받으며 가로등의 편익은 얻지 못합니다."),
gp43("설치비가 이미 모인 경우","다른 주민만으로 24토큰이 모였다. 제시된 납부액 중 내게 가장 유리한 것은?",['0','6','10'],0,"0토큰을 내도 가로등이 설치된다. 보유 토큰 10을 그대로 남기고 편익 10을 얻으므로 합이 20으로 가장 크다.","다른 주민이 설치비를 전부 냈으므로 내가 추가로 낼 필요는 없습니다.")]);
guide43(6,2,"담합·정보의 비대칭성·비배제성",'L06-5',"A는 업체들이 함께 가격을 올리기로 합의한 문서이다. B는 판매자만 알고 있는 제품 결함에 관한 자료이다. C는 비용을 내지 않은 주민도 가로등을 이용할 수 있다는 설명이다.","세 자료는 각각 경쟁 제한, 거래 정보의 차이, 공공재의 이용 특성과 관련된다.",[
gp43("가격 인상 합의","A가 보여 주는 문제는?",['경쟁 제한','비경합성','배당 지급'],0,"업체들이 가격을 함께 올리기로 합의한 것은 서로 경쟁하지 않고 가격을 조정하는 담합이다.","업체들이 서로 합의하여 경쟁을 제한했습니다."),
gp43("제품 정보와 공공재의 이용","B와 C에 해당하는 개념을 순서대로 옳게 짝지은 것은?",['비배제성 / 정보의 비대칭성','정보의 비대칭성 / 비배제성','매몰 비용 / 원리금'],1,"B에서는 판매자와 구매자가 제품 상태에 대해 가진 정보가 다르므로 정보의 비대칭성이 나타난다. C는 대가를 내지 않은 사람의 소비를 막을 수 없는 비배제성이다.","B는 거래 정보의 차이이고, C는 대가를 내지 않은 사람의 이용에 관한 설명입니다."),
gp43("제품 정보의 차이를 줄이는 방법","구매자가 제품 상태를 파악하는 데 가장 도움이 되는 자료는?",['광고의 배경색','상태 검사 결과와 품질 보증','판매자의 좋아하는 노래'],1,"제품의 상태 검사 결과와 품질 보증은 구매자가 품질을 파악하고 거래의 불확실성을 줄이는 데 도움이 된다.","제품의 결함이나 품질을 확인할 수 있는 자료를 찾으세요.")]);
guide43(7,1,"노동 3권과 기업가 정신",'L07-2',"A는 노동조합에 가입하였다. B는 노동조합을 통해 사용자와 임금을 협상하였다. C는 불확실성을 감수하며 기업의 새로운 시장 개척을 추진하였다.","노동조합 가입과 임금 협상은 노동자의 권리 행사이다. 새로운 시장에 대한 도전은 기업가 정신과 관련된다.",[
gp43("가입과 협상에 관한 권리","A와 B의 활동에 해당하는 권리를 순서대로 옳게 짝지은 것은?",['단결권 / 단체 교섭권','단체 교섭권 / 단결권',"단체 행동권 / 단체 교섭권"],0,"노동조합을 조직하거나 가입하는 것은 단결권이다. 노동조합을 통해 사용자와 임금이나 근로 조건을 협상하는 것은 단체 교섭권이다.","A는 조합에 가입하였고, B는 사용자와 협상하였습니다."),
gp43("새로운 시장에 대한 도전","C의 활동에서 드러나는 정신은?",['기업가 정신',"소비자 주권","기업의 사회적 책임"],0,"위험과 불확실성을 무릅쓰고 새로운 시장을 개척하며 도전하는 정신은 기업가 정신이다.","C는 성공이 보장되지 않은 새로운 시장에 도전하고 있습니다."),
gp43("파업과 관련된 권리","노동조합이 협상 결렬 후 파업 등 쟁의 행위로 사용자에게 대항하는 것과 관련된 권리는?",["단체 교섭권","단체 행동권"],1,"단체 행동권이다. 단체 교섭권은 사용자와의 협상에 관한 권리이고, 단체 행동권은 파업 등 쟁의 행위에 관한 권리이다.","이번에는 협상이 아니라 파업 등 쟁의 행위를 묻습니다.")]);
guide43(7,2,"윤리적 만족을 포함한 소비",'L07-3',"A와 B 중 하나의 소비 계획을 선택한다. A의 총편익은 30, 명시적 비용은 18이고 B의 총편익은 37, 명시적 비용은 22이다. B의 편익에는 윤리적 만족이 이미 포함되어 있으며 다른 비용은 없다.","윤리적 가치를 실천하는 만족도 편익에 포함될 수 있다. B에서는 그 만족을 포함한 총편익 37을 사용한다.",[
gp43("편익에 포함된 윤리적 만족","B의 윤리적 만족을 계산에 반영하는 방법으로 옳은 것은?",["총편익 37에 포함된 상태로 사용한다.",'현금이 아니므로 반드시 제외한다.',"총편익 37에 같은 만족을 한 번 더 더한다."],0,"B의 총편익 37에는 윤리적 만족이 이미 포함되어 있다. 따라서 37을 그대로 사용하며 같은 만족을 다시 더하지 않는다.","총편익에 이미 포함된 금액은 별도로 더하지 않습니다."),
gn43("편익−명시적 비용 완성","각 계획의 편익에서 명시적 비용을 뺀 값을 구하시오.",["A 편익−명시적 비용","B 편익−명시적 비용"],[12,15],"A는 30−18=12, B는 37−22=15이다.","A는 30에서 18을, B는 37에서 22를 빼세요."),
gp43("합리적인 소비 계획","계산 결과에 대한 설명으로 옳은 것은?",['윤리적 소비이므로 B는 항상 비합리적이다.','가격이 더 크므로 B는 무조건 불리하다.','주어진 편익·비용에서 B가 유리하며 윤리적·합리적 소비는 양립할 수 있다.'],2,"B는 비용이 더 크지만 윤리적 만족을 포함한 편익까지 고려하면 A보다 유리하다. 따라서 이 경우 윤리적 소비와 합리적 소비가 함께 이루어질 수 있다.","비용만 비교하지 말고 편익에서 비용을 뺀 두 금액을 비교하세요.")]);
guide43(8,1,"주식 수와 거래비용을 반영한 손익",'L08-3',"주식 3주를 주당 70에 사서 주당 74에 팔았다. 배당은 주당 1이고 전체 거래비용은 2이다. 다른 비용이나 수익은 없다.","주당 금액에는 주식 수 3을 곱한다. 거래비용 2는 전체 금액이므로 한 번만 뺀다.",[
gn43("매수 총액과 매매 차익","매수 총액과 세 주의 매매 차익을 각각 구하시오.",['매수 총액','매매 차익 합계'],[210,12],"매수 총액은 70×3=210이다. 주당 매매 차익은 74−70=4이므로 세 주의 차익은 4×3=12이다.","주당 금액에 주식 수를 곱하세요."),
gn43("배당과 거래비용","배당 총액과 거래비용까지 반영한 총손익을 각각 구하시오.",['배당 합계','비용 반영 총손익'],[3,13],"배당 총액은 1×3=3이다. 매매 차익 12에 배당 3을 더하고 거래비용 2를 빼면 총손익은 13이다.","거래비용 2는 주당 금액이 아니라 전체 금액입니다."),
gp43("배당의 의미","주식회사가 얻은 수익의 일부를 지분에 따라 주주에게 나누어 주는 것은?",['배당','채권 이자','매몰 비용'],0,"배당이다. 주주는 배당 수익을 기대할 수 있으며, 이는 예금이나 채권에서 얻는 이자 수익과 다르다.","주주에게 회사의 수익을 나누어 준다는 설명입니다.")]);
guide43(8,2,"금융 자산과 보유자의 지위",'L08-4',"A는 목돈을 예치하고 이자를 받는 통장이다. B는 기업이 원금과 이자의 지급을 약속한 차용 증서이고, C는 주식회사의 지분을 표시한 증서이다. 일반적인 금융 자산의 특징을 적용한다.","예금자는 금융 기관에 돈을 맡긴 사람이다. 채권자는 발행자에게 돈을 빌려준 사람이고, 주주는 회사의 지분을 보유한 사람이다.",[
gp43("차용 증서의 보유자","B의 종류와 보유자의 지위를 옳게 짝지은 것은?",['주식 / 주주','채권 / 채권자','정기 적금 / 주주'],1,"자금을 빌리면서 원금과 이자의 지급을 약속한 증서는 채권이다. 보유자는 돈을 빌려준 채권자이다.","회사의 지분이 아니라 빌려준 돈에 관한 증서입니다."),
gp43("주식 발행과 수익","C를 새로 발행할 때의 영향과 보유자가 기대할 수 있는 수익을 옳게 짝지은 것은?",['발행자의 자본금 증가 / 배당·시세 차익 기대','발행자의 부채 증가 / 확정 배당 보장','발행자의 자본금 감소 / 모든 수익 불가'],0,"C는 주식이다. 새로 발행하면 기업의 자본금이 증가한다. 주주는 배당 수익과 매매를 통한 시세 차익을 기대할 수 있다.","기존 주식의 매매가 아니라 새 주식의 발행입니다."),
gp43("시세 차익과 매매 손실","시세 차익을 기대할 수 있는 자산이면 매매할 때마다 이익을 얻는가?",['그렇다.','아니다. 실제 매매 결과와 수익의 보장은 별도이다.'],1,"산 가격보다 높은 가격에 팔면 시세 차익을 얻는다. 반대로 낮은 가격에 팔면 매매 손실이 발생한다.","매도 가격이 매수 가격보다 낮을 때를 생각해 보세요.")]);
guide43(9,1,"자산 총액과 당장 쓸 수 있는 돈",'L09-4',"A는 지금 30으로 현금화할 수 있고 금액은 변하지 않는다. B는 한 달 뒤에 90으로만 회수할 수 있다. 내일 40을 지출해야 하며 대출과 지출 연기는 불가능하다.","두 자산의 표시 금액을 합한 값과 내일까지 현금으로 쓸 수 있는 돈은 다르다.",[
gn43("총액과 사용 가능액","두 자산의 표시 금액 합계와 내일까지 쓸 수 있는 금액을 각각 구하시오.",['A와 B의 표시 금액 합계','내일까지 사용 가능액'],[120,30],"표시 금액의 합계는 30+90=120이다. 그러나 내일까지 쓸 수 있는 것은 지금 현금화할 수 있는 A의 30뿐이다.","B의 90은 한 달 뒤에만 회수할 수 있습니다."),
gn43("부족한 금액","내일의 지출에 부족한 금액을 구하시오.",['기한 전 부족액'],[10],"필요한 돈은 40이고 쓸 수 있는 돈은 30이다. 따라서 40−30=10이 부족하다.","필요한 금액 40에서 당장 쓸 수 있는 30을 빼세요."),
gp43("현금화와 유동성","자산을 현금으로 쉽게 바꿀 수 있는 정도를 뜻하는 원칙은?",['유동성','확정 수익률','배당액'],0,"유동성이다. 자산의 총액이 크더라도 필요한 때에 현금으로 바꾸기 어렵다면 지출에 차질이 생길 수 있다.","안전성, 수익성, 유동성 중 현금화에 관한 원칙을 고르세요.")]);
guide43(9,2,"투자 비중과 전체 수익률",'L09-3',"A에 150, B에 50을 투자하였다. 같은 기간의 수익률은 A가 +8%, B가 −4%이다. 중간 입출금과 다른 비용은 없다.","각 자산의 손익을 합하여 총손익을 구한다. 총손익을 전체 투자금으로 나누어 백분율로 나타내면 전체 수익률이다.",[
gn43("자산별 손익","A와 B의 손익을 각각 구하시오.",['A 손익','B 손익'],[12,-2],"A의 손익은 150×0.08=12이다. B는 50×(−0.04)=−2이므로 2의 손실이 발생한다.","손실은 음수로 나타내세요."),
gn43("총손익과 전체 수익률","총손익과 전체 투자금에 대한 수익률을 구하시오.",['총손익','전체 수익률(%)'],[10,5],"총손익은 12+(−2)=10이다. 전체 투자금은 150+50=200이므로 수익률은 10÷200×100=5%이다.","수익률을 구할 때에는 전체 투자금으로 나누세요."),
gp43("수익률의 단순 평균","두 수익률의 단순 평균인 2%가 전체 수익률인가?",['그렇다. 자산 수가 둘이기 때문이다.','아니다. 투자 금액이 다르므로 비중을 반영한다.'],1,"A에 투자한 돈이 B의 3배이므로 A의 수익률이 전체 결과에 더 크게 영향을 준다. 두 자산의 투자 비중을 반영해야 전체 수익률을 구할 수 있다.","두 자산에 같은 금액을 투자한 것이 아닙니다.")]);
guide43(10,1,"지출을 감당할 초기 자금",'L10-4',"4개월 동안 매월 말에 150을 지출한다. 수입 600은 4개월째 월초에 한 번 들어온다. 남은 돈을 다음 달로 넘길 수 있지만 대출과 지출 연기는 불가능하다.","수입을 받기 전에 얼마가 부족해지는지 구하면 처음 마련해야 할 돈을 알 수 있다. 초기 자금 없이 계산한 음수는 실제 대출금이 아니라 부족한 자금이다.",[
gn43("수입 전까지 부족한 돈","초기 자금이 0일 때 1, 2, 3개월 말의 ‘누적 수입−누적 지출’을 각각 구하시오.",['1개월 말','2개월 말','3개월 말'],[-150,-300,-450],"첫 세 달에는 수입이 없고 매달 150을 지출한다. 따라서 값은 차례로 −150, −300, −450이다.","월말마다 지출 150이 쌓입니다."),
gn43("초기 자금과 마지막 잔액","필요한 최소 초기 자금과, 그 금액을 처음 마련했을 때 4개월 말의 잔액을 각각 구하시오.",['최소 초기 자금',"초기 자금을 포함한 4개월 말 잔액"],[450,450],"3개월 말까지 450이 부족하므로 처음에 최소 450을 마련해야 한다. 4개월 말의 잔액은 초기 자금 450에 수입 600을 더하고 총지출 600을 뺀 450이다.","마지막 잔액에는 처음 마련한 돈도 포함하세요."),
gp43("수입·지출의 총액과 시점","총수입과 총지출이 모두 600이므로 초기 자금이 없어도 계획대로 지출할 수 있는가?",['항상 가능하다.','아니다. 수입 이전의 지출 기한이 있다.'],1,"수입은 4개월 초에 들어오지만 지출은 첫 달부터 시작한다. 초기 자금이 없으면 앞선 세 달의 지출을 할 수 없다.","총액이 같더라도 돈이 들어오는 시기가 늦습니다.")]);
guide43(10,2,"납입 시점이 다른 복리 계산",'L10-3',"첫해 초에 300, 둘째 해 초에 100을 납입하고 둘째 해 말에 찾는다. 연 5% 복리로 매년 말에 이자를 계산한다. 다른 입출금, 세금, 수수료는 없다.","첫 납입금에는 2년간, 둘째 납입금에는 1년간 이자가 붙는다. 각 납입금의 원리금을 따로 구한 뒤 합한다.",[
gp43("각 납입금의 예치 기간","두 납입금에 이자가 붙는 기간을 옳게 나타낸 것은?",["둘 다 2년이다.","첫 돈 2년·둘째 돈 1년","첫 돈 1년·둘째 돈 2년"],1,"300은 첫해 초부터 둘째 해 말까지 2년간 예치된다. 100은 둘째 해 초부터 그해 말까지 1년간 예치된다.","각 돈을 넣은 때부터 찾는 때까지의 기간을 세어 보세요."),
gn43("원리금과 전체 이자","중간에 반올림하지 않고 각 납입금의 원리금, 원리금 합계, 전체 이자를 구하시오.",['첫 납입금 원리금','둘째 납입금 원리금',"원리금 합계",'전체 이자'],[330.75,105,435.75,35.75],"첫 납입금의 원리금은 300×1.05²=330.75이고 둘째 납입금은 100×1.05=105이다. 합계는 435.75이다. 납입 원금의 합 400을 빼면 전체 이자는 35.75이다.","이자는 원리금 합계에서 납입한 원금을 뺀 금액입니다."),
gp43("원금을 합하여 계산하면?","원금 400 전체에 2년간 복리를 적용해도 되는가?",["된다. 원금은 결국 400이다.","안 된다. 둘째 100에 존재하지 않은 1년을 더하게 된다."],1,"둘째 납입금 100은 1년 동안만 예치된다. 전체 원금에 2년간 이자를 붙이면 둘째 납입금의 예치 기간을 실제보다 길게 계산하게 된다.","두 납입금은 같은 날 넣은 돈이 아닙니다.")]);
guide43(11,1,"달러와 원화 기준 손익의 차이",'L11-2',"자산을 80달러에 사서 100달러에 전액 매도하였다. 매수 당시 환율은 1,250원/달러, 매도하여 환전할 때의 환율은 900원/달러이다. 중간 수입과 지출, 다른 비용은 없다.","매수 금액은 매수 당시 환율로, 매도 금액은 매도 당시 환율로 환산한다. 두 원화 금액을 비교하여 손익을 구한다.",[
gn43("매수·매도 금액의 원화 환산","처음과 나중의 원화 금액을 각각 구하시오.",['처음 원화 금액','마지막 원화 금액'],[100000,90000],"매수 금액은 80×1,250=100,000원이다. 매도 금액은 100×900=90,000원이다.","각 달러 금액에 같은 시점의 환율을 곱하세요."),
gn43("원화 손익과 수익률","원화 기준 손익과 처음 투자금을 기준으로 한 수익률을 구하시오.",['원화 손익','원화 수익률(%)'],[-10000,-10],"손익은 90,000−100,000=−10,000원이다. 수익률은 −10,000÷100,000×100=−10%이다.","수익률은 손익을 처음 투자한 100,000원으로 나누어 구합니다."),
gp43("달러 가격 상승과 원화 손실","달러 금액이 80에서 100으로 늘었으므로 원화 기준으로도 이익인가?",['그렇다.','아니다. 환율 변화까지 같은 통화로 계산한다.'],1,"달러 가격은 올랐지만 환율은 하락하였다. 두 변화를 모두 반영한 원화 매도 금액이 매수 금액보다 작으므로 원화 기준으로는 손실이다.","달러 금액뿐 아니라 원화로 환산한 금액을 비교하세요.")]);
guide43(11,2,"가격 상승과 구매량 감소",'L11-1',"보유액은 12,000원으로 일정하다. 같은 상품의 가격이 800원에서 1,000원으로 올랐고, 상품은 정수 개만 산다. 다른 비용은 없다.","보유액을 가격으로 나누어 구매 가능한 수량을 구한다. 감소율은 줄어든 수량을 처음 수량으로 나누어 구한다.",[
gn43("가격 상승 전후의 구매량","가격 상승 전후에 살 수 있는 최대 수량을 각각 구하시오.",['이전 개수','이후 개수'],[15,12],"상승 전에는 12,000÷800=15개, 상승 후에는 12,000÷1,000=12개를 살 수 있다.","같은 돈을 각 시점의 상품 가격으로 나누세요."),
gn43("감소량과 감소율","줄어든 수량과 처음 구매량에 대한 감소율을 구하시오.",['줄어든 개수','구매 가능 개수 감소율(%)'],[3,20],"15−12=3개가 줄었다. 처음의 15개를 기준으로 하면 3÷15×100=20% 감소한 것이다.","감소율의 기준은 처음 살 수 있었던 15개입니다."),
gp43("자료에서 알 수 있는 내용","제시된 자료에서 알 수 있는 내용으로 옳은 것은?",['모든 상품의 종합 물가 상승률','같은 돈으로 이 상품을 살 수 있는 수량의 변화','모든 사람의 생활 수준 변화'],1,"이 상품의 가격과 보유액으로 구매 가능량의 변화를 알 수 있다. 전체 물가 상승률이나 다른 사람의 생활 수준을 알려면 여러 상품의 가격과 소득 등에 관한 자료가 더 필요하다.","자료에는 한 상품의 가격만 제시되어 있습니다.")]);
guide43(12,1,"재료와 노동이 제한된 생산",'L12-2',"제품 1개에 재료 4와 노동 3이 필요하다. 재료 29와 노동 20을 가지고 있으며 정수 개의 완제품만 생산한다. 기술 등 다른 요건은 충족하였다.","제품마다 재료와 노동이 모두 필요하다. 두 요소로 만들 수 있는 수량을 각각 계산하면 전체 생산량을 제한하는 요소를 알 수 있다.",[
gp43("생산량을 제한하는 요소","최대 생산량을 구하는 방법으로 옳은 것은?",['재료로 가능한 양과 노동으로 가능한 양을 더한다.','각 요소의 생산 한도 중 작은 값을 정수 조건에 맞춘다.','더 많은 쪽의 생산 한도만 사용한다.'],1,"재료가 충분해도 노동이 부족하면 제품을 더 만들 수 없다. 두 생산 한도 중 작은 것을 적용하고 정수 개만 생산한다는 조건을 고려해야 한다.","완제품 한 개에 두 요소가 모두 들어갑니다."),
gn43("생산량과 남는 재료·노동","최대 완제품 수와 그때 남는 재료, 노동을 구하시오.",['완제품 수','남은 재료','남은 노동'],[6,5,2],"재료 29로는 7개까지 만들 수 있지만 노동 20으로는 6개까지 만들 수 있다. 따라서 최대 6개이다. 재료는 29−4×6=5, 노동은 20−3×6=2가 남는다.","먼저 최대 생산량을 구하고 각 요소의 사용량을 빼세요."),
gp43("재료만 늘어난 경우","노동은 20으로 그대로이고 재료만 40으로 늘었다. 최대 완제품 수는?",["여전히 6개",'10개','20개'],0,"노동 20으로는 여전히 제품 6개까지만 만들 수 있다. 재료가 늘어도 노동의 부족은 해결되지 않으므로 최대 생산량은 6개이다.","생산을 제한한 요소는 노동이었습니다.")]);
guide43(12,2,"생산량과 평균 생산 단가",'L12-3',"같은 상품을 100개 생산할 때 총비용은 280이고, 200개 생산할 때 총비용은 460이다. 통화와 비용에 포함한 항목은 같다.","평균 생산 단가는 총비용을 생산량으로 나눈 값이다. 규모의 경제는 생산량이 늘면서 평균 생산 단가가 낮아지는 현상이다.",[
gn43("평균 생산 단가","각 생산량에서의 평균 생산 단가를 구하시오.",['100개 평균 단가','200개 평균 단가'],[2.8,2.3],"100개일 때에는 280÷100=2.8이고, 200개일 때에는 460÷200=2.3이다.","총비용을 해당 생산량으로 나누세요."),
gn43("한 개당 비용의 감소","생산량이 늘면서 한 개당 비용은 얼마나 줄었는가?",['단가 하락액'],[0.5],"평균 생산 단가가 2.8에서 2.3으로 낮아졌으므로 한 개당 비용은 0.5 줄었다.","총비용이 아니라 두 평균 단가를 비교하세요."),
gp43("규모의 경제","제시된 두 생산량을 비교한 설명으로 옳은 것은?",['총비용이 늘었으니 규모의 경제가 아니다.','제시된 두 규모 사이에서 평균 생산 단가가 하락했다.','모든 생산량에서 단가가 무한히 하락한다.'],1,"100개에서 200개로 생산량이 늘면서 평균 생산 단가가 낮아졌다. 이 두 생산량 사이에서는 규모의 경제가 나타난다. 그보다 많은 생산량의 단가는 제시되어 있지 않다.","생산량이 늘었을 때 평균 생산 단가가 어떻게 변했는지 보세요.")]);
guide43(13,1,"노동시간표와 최대 생산량표",'L13-1',"A국의 총노동량은 60시간이다. X재 1개에 3시간, Y재 1개에 5시간이 필요하며 단위당 노동시간은 일정하다. 두 재화만 생산한다.","총노동량을 재화 1개당 노동시간으로 나누면 최대 생산량을 구할 수 있다. 같은 생산 조건을 두 종류의 표로 나타내어 기회비용을 계산해 보자.",[
gn43("각 재화의 최대 생산량","모든 노동을 한 재화에 투입할 때 X재와 Y재의 최대 생산량을 각각 구하시오.",['최대 X',"함께 생산할 수 있는 Y재"],[20,12],"X재는 60÷3=20개, Y재는 60÷5=12개까지 생산할 수 있다.","60시간을 각 재화 1개를 만드는 시간으로 나누세요."),
gn43("X재 1개 생산의 기회비용","X재 1개 생산의 기회비용을 Y재 수량으로 구하시오. 분수로 입력해도 된다.",['X1의 기회비용(Y개)'],[0.6],"X재 1개에 쓰는 3시간으로 Y재를 3/5개 만들 수 있다. 따라서 기회비용은 Y재 0.6개이다. 최대 생산량을 이용해도 Y재 12÷20=0.6개로 같다.","X재에 쓰는 시간으로 만들 수 있었던 Y재가 포기한 수량입니다."),
gp43("표에 따른 계산 방식","단위당 노동시간표와 최대 생산량표에서 숫자가 놓인 위치가 같으면 같은 방향으로 나누면 되는가?",['항상 같다.','자료가 무엇을 의미하는지에 따라 구분한다.'],1,"노동시간표에서는 X재 1개에 쓰는 시간을 Y재 1개에 필요한 시간으로 나눈다. 최대 생산량표에서는 포기하는 Y재의 최대량을 X재의 최대량으로 나눈다. 두 표는 수치의 의미가 다르다.","3÷5와 12÷20이 왜 같은 기회비용인지 생각해 보세요.")]);
guide43(13,2,"생산 조합과 남은 자원",'L13-2',"자원과 기술은 고정되어 있다. 한 재화만 생산하면 X재는 최대 18개, Y재는 최대 12개 만들 수 있다. 생산 가능 곡선은 직선이며 X재를 6개 생산한다.","X재 6개를 만드는 데 전체 자원의 6/18을 사용한다. 남은 자원으로 Y재를 얼마나 생산할 수 있는지 구한다.",[
gn43("사용한 자원과 남은 비율","X재 생산에 사용한 자원의 비율과 남은 비율을 구하시오. 분수나 소수로 입력할 수 있다.",['X에 사용한 비율','남은 비율'],[1/3,2/3],"X재에 사용한 비율은 6/18=1/3이다. 전체를 1로 보면 남은 비율은 1−1/3=2/3이다.","전체에서 사용한 비율을 빼세요."),
gn43("함께 생산할 수 있는 Y재","X재 6개와 함께 생산할 수 있는 Y재의 최대 수량을 구하시오.",['생산 가능한 최대 Y'],[8],"Y재만 생산하면 12개를 만들 수 있다. 남은 자원은 전체의 2/3이므로 최대 12×2/3=8개를 생산할 수 있다.","Y재의 최대 생산량 12에 남은 자원의 비율을 곱하세요."),
gp43("곡선 안쪽의 생산 조합","같은 조건에서 X재 6개와 Y재 6개를 생산하는 조합은 어디에 해당하는가?",['불가능하다.','생산 가능 영역 내부이다.','항상 곡선 위의 최대 조합이다.'],1,"X재 6개를 만들면서 Y재는 최대 8개까지 만들 수 있다. 6개만 만드는 조합은 자원을 모두 사용하지 않으므로 생산 가능 곡선의 안쪽에 있다.","함께 만들 수 있는 최대 Y재 8개보다 적게 생산합니다.")]);
guide43(14,1,"유리한 교환 비율과 가능한 수량",'L14-5',"양국의 총노동량은 같고 생산 가능 곡선은 직선이다. A국의 최대 생산량은 X재 24개 또는 Y재 12개이고, B국은 X재 8개 또는 Y재 8개이다. A국은 X재 24개, B국은 Y재 8개만 생산하였다. 두 나라만 거래하며 재고, 손실, 거래 비용은 없다.","X재 1개 생산의 기회비용은 A국이 Y재 0.5개, B국이 Y재 1개이다. 양국에 유리한 교환이라도 각국이 실제로 가진 수량을 넘겨 줄 수는 없다.",[
gp43("보유량보다 큰 수출량","X재 12개와 Y재 9개의 교환 비율은 X재 1개당 Y재 0.75개로 양국의 기회비용 사이에 있다. 그러나 이 교환을 실행할 수 없는 이유는?",["A국이 X재 12개를 제공할 수 없기 때문이다.","B국은 Y재 8개만 생산하여 9개를 제공할 수 없기 때문이다.","교환 비율은 언제나 1:1이어야 하기 때문이다."],1,"B국은 Y재를 8개만 생산하였다. 다른 거래나 재고가 없으므로 Y재 9개를 줄 수 없다.","B국이 가진 수량은 8개인데 약속한 수량은 9개입니다."),
gn43("수량을 줄인 교환의 이익","X재 8개와 Y재 6개를 교환한다. A국이 직접 생산할 때보다 더 얻는 Y재와 B국이 절약하는 Y재를 각각 구하시오.",['A 추가 이익(Y개)','B 절약 이익(Y개)'],[2,2],"A국은 X재 8개 생산으로 Y재 4개를 포기하고 6개를 받으므로 2개의 이익을 얻는다. B국은 X재 8개를 직접 생산하면 Y재 8개를 포기하지만 6개만 지급하므로 2개를 절약한다.","X재 8개 생산의 기회비용과 교환할 Y재 6개를 비교하세요."),
gp43("교환 조건의 확인","실제로 실행할 수 있고 양국 모두 이익을 얻는 교환인지 알려면 무엇을 확인해야 하는가?",['비율만 본다.','기회비용·비율·수량 상한·양국 이익을 함께 본다.'],1,"각국의 생산 기회비용과 교환 비율을 비교하여 이익을 확인한다. 또한 수출할 수량이 보유량을 넘지 않는지도 살펴야 한다.","첫 번째 교환은 비율이 유리해도 줄 수 있는 수량이 부족했습니다.")]);
guide43(14,2,"소비량으로 교환량 구하기",'L14-6',"A국은 X재만, B국은 Y재만 생산하였다. 교역 후 소비량은 A국이 X재 14개와 Y재 4개, B국이 X재 6개와 Y재 8개이다. 두 나라만 거래하며 재고, 손실, 다른 거래는 없다.","같은 재화의 소비량을 합하면 생산 총량이다. 각국이 만들지 않은 재화는 상대국에서 수입한 것이다.",[
gn43("특화 생산량","A국의 X재 생산량과 B국의 Y재 생산량을 각각 구하시오.",['A의 X생산량','B의 Y생산량'],[20,12],"X재는 14+6=20개로 A국의 생산량이다. Y재는 4+8=12개로 B국의 생산량이다.","X재끼리, Y재끼리 소비량을 더하세요."),
gn43("수출입 수량과 비율","A국의 X재 수출량과 Y재 수입량을 구하고, X재 1개당 교환한 Y재 수량을 구하시오.",['A의 X수출','A의 Y수입','X1당 교환Y'],[6,4,2/3],"B국이 가진 X재 6개는 A국에서 수입한 것이다. A국이 가진 Y재 4개는 B국에서 수입하였다. 따라서 X재 6개와 Y재 4개를 교환했고, 비율은 X재 1개당 Y재 4/6=2/3개이다.","A국이 주고받은 수량은 X재 6개와 Y재 4개입니다."),
gp43("다른 나라와도 거래했다면?","다른 나라에서도 수입했다는 조건이 추가되면 기존 계산을 그대로 적용할 수 있는가?",['그 정보와 무관하게 같은 역산을 확정한다.','추가 거래의 수량과 범위를 더 확인해야 한다.'],1,"소비한 재화 중 일부가 다른 나라에서 왔다면 두 나라의 소비량 합계가 두 나라의 생산량과 같지 않을 수 있다. 다른 나라에서 수입한 수량을 더 알아야 한다.","원래 계산은 두 나라 사이의 거래만 있다고 가정했습니다.")]);
guide43(15,1,"무역 의존도 계산",'L15-2',"가상 국가의 GDP는 750, 수출액은 180, 수입액은 120이다. 기간과 통화는 같다. 무역 의존도는 ‘(수출액+수입액)÷GDP×100’으로 구한다.","수출액과 수입액을 합한 금액이 GDP에서 차지하는 비율을 구한다.",[
gn43("수출액과 수입액의 합","무역 의존도 계산에 사용할 수출입 합계를 구하시오.",['수출+수입'],[300],"수출액 180과 수입액 120을 합하면 300이다.","무역 의존도에는 두 금액의 차가 아니라 합을 사용합니다."),
gn43("GDP에 대한 비율","무역 의존도를 백분율로 구하시오.",['무역 의존도(%)'],[40],"300÷750=0.4이므로 무역 의존도는 40%이다.","수출입 합계를 GDP로 나눈 뒤 100을 곱하세요."),
gp43("무역 의존도와 생활의 변화","무역 의존도만으로 모든 산업과 개인의 생활이 개선되었다고 알 수 있는가?",["단체 교섭권",'분배·산업·노동 등 다른 자료가 필요하다.'],1,"무역 의존도는 GDP에서 수출입 합계가 차지하는 비율이다. 산업별 고용이나 개인의 소득, 노동 조건의 변화는 해당 자료를 더 살펴야 한다.","무역 의존도의 식에는 고용이나 개인별 소득이 들어 있지 않습니다.")]);
guide43(15,2,"거래 총액과 시간당 보수",'L15-4',"보고서 A에는 전체 거래액이 10% 증가했다고, B에는 생산자에게 지급한 대가 총액이 5% 증가했다고 기록되어 있다. 노동시간, 참여 인원, 환경에 관한 자료는 없다.","총액이 증가한 것과 시간당·1인당 금액이 증가한 것은 다르다. 평균액을 구하려면 노동시간과 인원도 알아야 한다.",[
gp43("자료에서 알 수 있는 사실","두 보고서에서 알 수 있는 사실은?",['거래액과 대가 총액의 증가율은 다르다.',"모든 생산자의 시간당 보수가 5% 증가했다.",'환경 피해가 전혀 없다.'],0,"거래액은 10%, 지급한 대가 총액은 5% 증가하였다. 두 총액은 모두 늘었지만 증가율은 서로 다르다.","보고서에 실제로 제시된 것은 두 총액의 증가율입니다."),
gp43("시간당 보수를 알려면?","‘시간당 보수가 5% 올랐다’는 문장을 어떻게 고쳐야 하는가?",['총액이 늘었으니 원래 문장이 항상 맞다.','노동시간 자료를 확인해야 시간당 보수 변화를 판단할 수 있다.',"정보가 없으니 시간당 보수는 0이다."],1,"시간당 보수는 지급한 대가를 노동시간으로 나누어 구한다. 지급 총액이 5% 증가했더라도 노동시간이 어떻게 달라졌는지 모르면 시간당 보수의 변화는 알 수 없다.","노동시간이 함께 늘어났을 수도 있습니다."),
gp43("지속가능한 무역의 평가","무역의 지속가능성을 평가하기 위해 추가로 해야 할 일은?",['총액 외 자료는 모두 삭제한다.','정당한 대가·노동 조건·환경 영향의 근거를 추가 확인한다.'],1,"생산자에게 정당한 대가를 지급했는지, 노동 조건은 어떠한지, 환경에 어떤 영향을 주었는지를 조사해야 한다. 거래 규모뿐 아니라 사회적 책임과 환경 보호도 고려할 필요가 있다.","노동시간과 참여 인원, 작업 환경과 오염 등에 관한 자료가 필요합니다.")]);
const GUIDE_BY43=Object.fromEntries(GUIDES43.map(g=>[g.id,g]));
GUIDE_BY43['G06-1'].origin+=" · 4인모금 규칙과 타인합계 18·24는 기존 연습과 중복된다.";
GUIDE_BY43['G14-1'].origin+=" · 특화생산 24·8과 교환X8:Y6은 연결 심화강의의 사례를 단계형으로 재구성했다.";
// V43_GUIDED_DATA_END: 30 guided activity blocks; some conditions overlap existing examples; three teaching steps, including one final check per block.
// V43_PRACTICE_ENGINE — 기존 정규 답안과 안내형 연습의 기록은 분리한다.
const cleanText43=(v,max=100)=>typeof v==='string'||typeof v==='number'?String(v).slice(0,max):'';
function answer43(step,raw){const x=raw&&typeof raw==='object'?raw:{};return {choice:Number.isInteger(x.choice)&&x.choice>=0&&x.choice<(step.options?.length||0)?x.choice:null,nums:step.type==='num'?step.labels.map((_,i)=>cleanText43(x.nums?.[i])):[],confidence:['sure','unsure','guess'].includes(x.confidence)?x.confidence:'',help:x.help===true};}
function gradeGuide43(step,a){if(!step||!a)return false;if(step.type==='pick')return Number.isInteger(a.choice)&&a.choice===step.answer;return step.type==='num'&&numsEq(a.nums,step.answer);}
function emptyGuideRecord43(g){return {index:0,note:'',star:false,steps:g.steps.map(s=>({draft:answer43(s),solved:null,history:[],seen:false}))};}
function normalizeGuideRecord43(g,raw){const r=emptyGuideRecord43(g);if(!raw||typeof raw!=='object')return r;r.index=Number.isInteger(raw.index)?Math.max(0,Math.min(g.steps.length-1,raw.index)):0;r.note=typeof raw.note==='string'?raw.note.slice(0,10000):'';r.star=raw.star===true;r.steps=g.steps.map((s,i)=>{const old=raw.steps?.[i]||{},draft=answer43(s,old.draft),sol=answer43(s,old.solved),history=Array.isArray(old.history)?old.history.slice(-12).filter(x=>x&&typeof x==='object').map(x=>{const a=answer43(s,x.answer);return {answer:a,ok:gradeGuide43(s,a),at:typeof x.at==='string'?x.at.slice(0,40):'',mode:['first','recheck','assisted'].includes(x.mode)?x.mode:'recheck'};}):[];return {draft,solved:old.solved&&gradeGuide43(s,sol)?sol:null,history,seen:old.seen===true||!!old.solved||history.length>0||draft.help};});const pending=r.steps.findIndex(s=>!s.solved);if(pending>=0&&r.index>pending)r.index=pending;return r;}
const emptyBase43=empty,normalizeBase43=normalize;
empty=function(){const x=emptyBase43();x.practice43={version:1,records:{},last:null};return x;};
normalize=function(raw){const x=normalizeBase43(raw);if(raw?.practice43?.version===1){for(const g of GUIDES43){if(raw.practice43.records?.[g.id])x.practice43.records[g.id]=normalizeGuideRecord43(g,raw.practice43.records[g.id]);}x.practice43.last=GUIDE_BY43[raw.practice43.last]?raw.practice43.last:null;}return x;};

function report431(){return "경제 설계자 4.3.1 — 학습 연결·복원 보호 패치\n\n[기준과 범위]\n4.3의 72강·정규 195문제·종합 24단계·단계별 30개·프로젝트 6개·실험 12개를 유지했다. 이번에는 새 경제 강의·예제·문항 수를 늘리지 않았다. 원교재의 새로운 전수 대조를 수행한 것도 아니다.\n\n[코드를 읽어 확인한 문제와 수정]\n1. 정규 답안을 채점하면 초안을 지우고, 관련 강의 버튼은 결과가 남아 있는 동안 초안 저장을 건너뛰었다. 따라서 해설 확인 뒤 강의로 이동하면 입력을 잃을 수 있는 경로였다. 강의 이동 전 작업 답안 사본을 명시적으로 저장하도록 수정했다. 확정한 이전 응답·확신도 기록은 바꾸지 않는다.\n2. 빈 슬라이더값null은 복원시 숫자가 아니라는 이유로 기본 최소값으로 바뀌는 경로였다. 비어 있음과숫자 0을구분하고누락값을새응답으로만들지않도록수정했다.\n3. 단계별연습의다시보기는제출이력만검사해힌트를보고제출하지않은경우를놓쳤다. 현재초안의도움사용도대상에포함했다.\n4. 관련강의가단계위치로자동연결되어일부계산문제가다른주제강의를열었다. 금융·생산·무역의문항과기존강의본문을대조해명시적연결표를추가했다.\n5. 브라우저뒤로가기등직접이동에서정규강의탭·예제단계가남을수있어다른화면진입때해당임시상태를초기화했다.\n6. 복원은미리보기전까지기록을바꾸지않고, 지원버전과 저장 형식·알수없는ID·원고길이를먼저확인한다. 긴원고를몰래잘라넣지않는다.\n7. 확인후적용에서도교체전기록을보관하고, 새저장값을다시읽어일치했을때만현재 학습 기록을교체한다. 저장실패를성공으로표시하지않고되돌리기확인결과를별도로안내한다.\n8. 내부자가검사는복제한메모리상태에서수행하고검사중저장함수의쓰기동작을막았다.\n\n[백업호환성]\n이패치에서답안복원을지원하는제작버전은 4.2-full-course.1(72강),4.3-guided-review.1,4.3.1-recovery.1이다. 이름만같은다른 4.2원고는자동으로호환된다고보지않는다. 이전 4.1및다른형식은원본과백업을보관한다.3.1단원메모추가는별도기능으로유지한다.\n교체전보관함은같은브라우저에있는최근 1개사본이며외부파일백업을대신하지않는다. 다중탭저장변경은확인하지만데이터베이스의원자적잠금을제공하는것은아니다.\n\n[검증 상태]\n이번에도container와Python실행요청이ClientError를반환했다. JavaScript실행·실제브라우저조작·저장·스마트폰화면·PWA오프라인검사는제작자가수행하지못했다. 코드대조및반영과실제실행통과를구분한다. 추가검사는정의만수록했고미실행통과수치는없다. 가짜저장소시험은실제기기의저장시험을대신하지않는다.\n\n[남은 일]\n실제실행및회귀검사, 기기별저장·복원·레이아웃검수, 원교재전수교열, 예제와확인질문각 42개보강, 전용게임·카드·서사·그래픽고도화, 변형 600개및 30시간경로실측,PWA실배포검증은남아있다.\n";}
