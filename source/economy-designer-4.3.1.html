guide43(4,2,'같아지는 값과 뒤집히는 값','L04-5','창작 A 편익90·비용36, B 편익84·비용36. 새 계약에서 B를 고를 때만 반환금 r을 앞으로 받는다. r은0 이상의 정수이다.','A의 비교값은54, B는48+r이다. 두 값이 같아지는 식을 먼저 세운다.',[
gp43('식 완성','동률을 만드는 식은?',['54=48+r','54=84+r','54=36−r'],0,'B의 앞으로 편익에 반환금을 더하고 명시적 비용을 뺀 값이48+r이다.','B의 직접 비용36을 빠뜨리지 마세요.'),
gn43('경계와 최소 정수','동률과 유일한 최선을 구별하세요.',['동률의 반환금','B가 유일한 최선인 최소 정수 반환금'],[6,7],'r6이면54로 같고, 최소 정수7이면 B55가 더 크다.','같음과 큼은 다릅니다. 이번에는 정수 조건도 있습니다.'),
gp43('조건 확인','반환금6인 경우의 정확한 결론은?',['B가 유일한 최선','동률이며 어느 한쪽만 유일한 최선은 아니다.'],1,'48+6=54이므로 두 비교값이 같다.','문제에서 요구한 부등호가 엄격한지 확인하세요.')]);
guide43(5,1,'이익만 적힌 행사 장부','L05-2','창작 활동량1·2·3의 개인 이익은26·45·54, 제3자의 미보상 피해는3·12·30이다. 활동0의 값은 모두0. 같은 금액 단위이며 다른 효과는 없다.','이 모형의 비교 목표는 개인 이익에서 제3자 피해를 뺀 값의 최대이다. 이 수치는 현실의 모든 가치를 평가한 점수가 아니다.',[
gp43('비교 기준','이번 목표 계산은?',['개인 이익+피해','개인 이익−피해','피해를 무시한 개인 이익'],1,'누구의 어떤 영향을 합산하는지 발문의 범위를 지킨다.','피해는 이익과 같은 방향으로 더하지 않습니다.'),
gn43('두 번째 장부','각 활동량의 목표 값을 계산하고 최대 활동량을 적으세요.',['활동1 목표값','활동2 목표값','활동3 목표값','목표값이 최대인 활동량'],[23,33,24,2],'26−3=23,45−12=33,54−30=24로 활동2가 최대다.','개인 이익이 최대인 활동3과 결과가 같은지 검산하세요.'),
gp43('개인의 선택과 비교','개인 이익만 최대화하면 활동3을 고른다. 두 결론이 다른 이유는?',['두 장부의 고려 범위가 다르다.','산술 계산은 모두 틀렸다.','활동량은 언제나 같아야 한다.'],0,'제3자 피해를 반영하는지에 따라 비교 기준이 다르다.','한 장부에서 빠져 있던 주체가 누구인지 확인하세요.')]);
guide43(5,2,'부담금은 어디로 갔을까','L05-4','창작 활동량3, 부과 전 이익72, 단위당 부담금8, 제3자 피해18. 정부 수입도 합산하고 행정 비용 등 다른 효과는 없다고 가정한다.','먼저 생산자와 정부를 서로 다른 줄에 적는다. 생산자가 내는 돈은 이 모형에서 정부가 받는 돈이다.',[
gn43('부담금 계산','활동량에 단위당 금액을 곱하세요.',['부담금 총액','생산자의 납부 후 이익'],[24,48],'3×8=24,72−24=48이다.','단위당8과 전체24를 구별하세요.'),
gn43('합산 장부 완성','정부 수입을 포함한 세 주체의 장부이다.',['정부 수입','생산자+정부−피해'],[24,54],'정부24, 합계48+24−18=54이다.','이전된24를 사회 전체에서 또 없어진 비용으로 빼지 마세요.'),
gp43('모형의 한계','위 합산에서 부담금이 이전되었다는 사실이 실제 정책은 아무 효과가 없다는 뜻인가?',['그렇다. 모든 효과가 없다.','아니다. 선택량 변화와 다른 현실 효과는 별도로 검토한다.'],1,'고정 활동량의 단순 합산과 정책이 행동에 미치는 영향은 다른 질문이다.','이번에 가정으로 고정하거나 제외한 항목을 확인하세요.')]);
guide43(6,1,'내가 내야 불이 켜지는가','L06-2','창작4인 모금. 각자10토큰, 설치비24, 설치 시 각자 편익10, 실패 시 납부액 반환. 다른 세 주민은8·4·6을 고정 납부한다. 내 선택지는0·4·6·10이다.','먼저 타인 납부 합계와 부족액을 적은 뒤, 설치 여부에 따라 내 결과를 계산한다.',[
gn43('부족액 찾기','타인의 합계와 설치에 더 필요한 금액은?',['타인 납부 합계','설치 부족액'],[18,6],'8+4+6=18,24−18=6이다.','설치비와 타인의 납부 합계를 구분하세요.'),
gn43('개인 결과 완성','내가4를 내면 실패·반환,6을 내면 설치된다.',['내가4를 낼 때 최종 결과','내가6을 낼 때 남은 토큰+편익'],[10,14],'실패 시 반환 후10, 설치 시10−6+10=14이다.','실패에 설치 편익을 더하거나 반환금을 다시 잃은 것으로 계산하지 마세요.'),
gp43('조건 변화 확인','다른 주민들만으로 이미24를 냈다면 내 선택지 중 개인 결과를 최대화하는 납부는?',['0','6','10'],0,'설치가 이미 충족되면0을 내고도 편익을 얻어 결과20이다. 실제 행동의 예측이 아닌 조건부 계산이다.','다른 사람의 합계가 이전과 달라졌습니다.')]);
guide43(6,2,'같은 시장에서 발견한 세 증거','L06-5','창작 자료. A: 업체들이 함께 가격을 올리기로 한 합의 문서. B: 판매자만 아는 제품 결함. C: 대가를 내지 않은 주민도 가로등을 이용하는 조건.','세 문제를 모두 시장 실패라고 부르는 데서 멈추지 말고 각각의 직접 원인을 찾는다.',[
gp43('합의 문서 읽기','A와 가장 직접적으로 연결되는 것은?',['경쟁 제한','비경합성','배당 지급'],0,'단순히 가격이 같다는 사실이 아니라 합의 문서가 제시되었다.','업체 사이의 행동을 보여 주는 증거입니다.'),
gp43('두 칸 연결','B와 C를 순서대로 연결하면?',['비배제성 / 정보의 비대칭성','정보의 비대칭성 / 비배제성','매몰 비용 / 원리금'],1,'B는 정보 차이, C는 미지급자를 이용에서 배제하는 문제이다.','누가 정보를 갖는지와 누가 이용 가능한지를 구분하세요.'),
gp43('필요한 추가 자료','제품 상태의 정보 차이를 줄이는 자료로 가장 직접적인 것은?',['광고의 배경색','상태 검사 결과와 품질 보증','판매자의 좋아하는 노래'],1,'기존 교재 설명의 정보 제공·품질 보증과 연결된다.','결함과 제품 상태에 관한 정보인지 확인하세요.')]);
guide43(7,1,'권리와 역할의 세 서랍','L07-2','창작 A는 노동조합에 가입했고, B는 노동조합을 통해 사용자와 임금 협상을 했다. C는 기업의 새로운 시장 개척을 추진하며 불확실성을 감수했다.','주체를 먼저 표시하고, 조직·협상·혁신이라는 행위의 차이를 읽는다.',[
gp43('권리 연결','A와 B를 순서대로 연결하면?',['단결권 / 단체 교섭권','단체 교섭권 / 단결권','소비자 주권 / 매몰 비용'],0,'조직·가입은 단결권, 노동조합을 통한 사용자와 협상은 단체 교섭권이다.','가입하는 것과 협상하는 것은 다른 행위입니다.'),
gp43('혁신 설명 완성','C가 위험을 감수한다는 설명의 개념은?',['기업가 정신','모든 위험의 부재','공공재의 비경합성'],0,'위험과 불확실성을 감수하며 도전하는 설명을 적용한다.','실패 가능성이 없어야 기업가 정신이라는 뜻은 아닙니다.'),
gp43('설명의 범위','위 분류만으로 특정한 현실 파업의 적법성까지 판정할 수 있는가?',['할 수 있다.','교재 개념 구분과 현실 법적 판단은 구분해야 한다.'],1,'이 활동은 교재의 권리·역할을 식별하는 과제이다.','발문이 제공한 정보와 판단하려는 범위를 비교하세요.')]);
guide43(7,2,'윤리적 만족도 편익에 들어갈까','L07-3','창작 두 소비 계획 중 하나를 선택한다. A의 총편익30·직접 비용18, B의 총편익37·직접 비용22이다. B의 총편익에는 윤리적 만족이 이미 포함되어 있다. 다른 비용은 없다.','만족이 이미 포함된 총편익에 같은 만족을 다시 더하지 않는다. 윤리적이라는 이름만으로 결론을 정하지 않는다.',[
gp43('편익 읽기','B의 윤리적 만족은 어떻게 처리해야 하는가?',['총편익37에 포함된 상태로 사용한다.','현금이 아니므로 반드시 제외한다.','총편익37에 같은 만족을 한 번 더 더한다.'],0,'주어진 평가 범위를 보존한다. 현금만 편익인 것도 아니고 동일 만족을 두 번 세는 것도 아니다.','이미 포함이라는 조건에 주목하세요.'),
gn43('비교값 완성','각 계획의 편익−직접 비용을 계산하세요.',['A 비교값','B 비교값'],[12,15],'30−18=12,37−22=15이다.','가격이 작은 계획만 자동으로 고르지 마세요.'),
gp43('판단 확인','이 조건에 부합하는 설명은?',['윤리적 소비이므로 B는 항상 비합리적이다.','가격이 더 크므로 B는 무조건 불리하다.','주어진 편익·비용에서 B가 유리하며 윤리적·합리적 소비는 양립할 수 있다.'],2,'기존 강의는 윤리적이면서 합리적인 소비의 가능성을 다룬다.','윤리적이라는 명칭과 계산 결과를 각각 확인하세요.')]);
guide43(8,1,'주식 세 주의 손익 복원','L08-3','창작 주식3주를 주당70에 사서 주당74에 팔았다. 배당은 주당1, 전체 거래비용은 합계2이다. 다른 비용·현금흐름은 없다.','주당 값과 전체 값을 분리해 적는다. 전체 거래비용2에는 주식 수를 다시 곱하지 않는다.',[
gn43('금액의 단위','전체 금액을 계산하세요.',['매수 총액','매매 차익 합계'],[210,12],'70×3=210, (74−70)×3=12이다.','매도대금222와 매매 차익12는 다릅니다.'),
gn43('마지막 두 칸','배당과 비용을 반영하세요.',['배당 합계','비용 반영 총손익'],[3,13],'배당1×3=3, 총손익12+3−2=13이다.','주당1은 곱하고, 전체 합계2는 한 번만 빼세요.'),
gp43('수익 형태 확인','주주에게 회사 수익의 일부를 지분에 따라 나눈 금액의 이름은?',['배당','채권 이자','매몰 비용'],0,'주식의 배당과 채권·예금의 이자를 구별한다.','보유자의 지위가 주주인지 확인하세요.')]);
guide43(8,2,'이자라는 단서만 남았다','L08-4','창작 A는 목돈을 예치하고 이자를 받는 통장, B는 기업이 원금·이자 지급을 약속한 차용 증서, C는 주식회사의 지분을 표시하는 증서이다. 교재의 일반적 비교이다.','이자 여부는 A와 B에 공통이다. 자산을 구별하는 구조와 보유자 지위를 추가로 읽는다.',[
gp43('B의 정체','B와 그 보유자의 지위는?',['주식 / 주주','채권 / 채권자','정기 적금 / 주주'],1,'차용 증서와 자금 대여 관계는 채권의 설명이다.','기업이 발행했다는 사실만으로 주식이라고 하지 마세요.'),
gp43('C의 기록 완성','C의 새 발행과 일반적 수익 형태를 연결하면?',['발행자의 자본금 증가 / 배당·시세 차익 기대','발행자의 부채 증가 / 확정 배당 보장','발행자의 자본금 감소 / 모든 수익 불가'],0,'새 주식 발행의 영향과 보유자의 수익 기대를 구분해 연결한다.','이 문장은 투자자끼리의 기존 주식 매매가 아니라 발행을 묻습니다.'),
gp43('가능성과 보장의 구별','시세 차익을 기대할 수 있다는 말은 언제나 실제 이익을 얻는다는 뜻인가?',['그렇다.','아니다. 실제 매매 결과와 수익의 보장은 별도이다.'],1,'가능한 수익 형태를 확정적인 실현으로 확대하지 않는다.','기대 가능이라는 표현을 그대로 읽으세요.')]);
guide43(9,1,'높은 총액과 내일의 현금','L09-4','창작 A는 지금30으로 현금화 가능하고 금액 변동이 없다. B는 한 달 뒤90으로만 회수할 수 있다. 내일40이 필요하고 대출·지출 연기는 불가하다.','보유액 합계와 기한 전 사용 가능액을 서로 다른 칸에 적는다.',[
gn43('두 총액 구분','제시된 금액을 기준으로 계산하세요.',['A와 B의 표시 금액 합계','내일까지 사용 가능액'],[120,30],'30+90=120이지만 내일 쓸 수 있는 것은30뿐이다.','한 달 뒤의90을 당겨 쓰지 마세요.'),
gn43('부족액 완성','내일 필요한40에서 사용 가능액을 빼세요.',['기한 전 부족액'],[10],'40−30=10이다.','자산 전체120이 아니라 내일의 사용 가능액30과 비교하세요.'),
gp43('원칙 연결','기한 전에 현금으로 쉽게 바꿀 수 있는지 묻는 기준은?',['유동성','확정 수익률','배당액'],0,'현금화의 용이성과 가치 보전은 다르다.','안전성·수익성·유동성의 세 질문 중 골라 보세요.')]);
guide43(9,2,'서로 다른 투자 비중의 평균','L09-3','창작 A에150, B에50을 투자한다. 같은 기간의 제시된 수익률은 A+8%·B−4%이고, 중간 입출금·비용은 없다. 실제 전망이 아니다.','수익률의 산술 평균을 먼저 구하지 말고 각 투자 금액에 생긴 손익부터 구한다.',[
gn43('개별 손익','각 원금에 해당 수익률을 곱하세요.',['A 손익','B 손익'],[12,-2],'150×0.08=12,50×(−0.04)=−2이다.','손실은 음수로 표시하세요.'),
gn43('전체 결과','같은 통화 금액을 합산하세요.',['총손익','전체 수익률(%)'],[10,5],'총손익10, 총원금200이므로10/200×100=5%이다.','수익률의 분모는 총투자금200입니다.'),
gp43('평균의 함정','두 수익률의 단순 평균2%가 이번 전체 수익률인가?',['그렇다. 자산 수가 둘이기 때문이다.','아니다. 투자 금액이 다르므로 비중을 반영한다.'],1,'같은 금액을 넣은 경우와 다른 비중의 경우를 구분한다.','A에는 B보다3배 많은 금액을 넣었습니다.')]);
guide43(10,1,'네 번째 달의 목돈','L10-4','창작4개월간 매월 말150 지출. 수입600은4개월 초에 한 번 들어온다. 잔액 이월 가능, 대출·지출 연기 불가이다.','초기 자금을0으로 둔 가상 누적 잔액을 계산한다. 음수는 실제 대출이 아니라 부족액을 나타낸다.',[
gn43('먼저 발생한 지출','1·2·3개월 말의 초기0 기준 누적 잔액을 적으세요.',['1개월 말','2개월 말','3개월 말'],[-150,-300,-450],'매월150씩 누적되어−150,−300,−450이다.','수입은4개월 초이므로 아직 더하지 않습니다.'),
gn43('계획 완성','모든 지출 기한을 충족하도록 처음 준비할 최소 금액과 그때 최종 잔액을 구하세요.',['최소 초기 자금','초기 자금을 포함한4개월 말 잔액'],[450,450],'최대 부족액450을 준비한다. 최종은450+600−150×4=450이다.','준비금과 마지막 잔액은 질문이 다릅니다. 준비금을 최종 합계에서 누락하지 마세요.'),
gp43('시간 조건','총수입600과 총지출600이 같으면 초기 자금0으로도 항상 가능한가?',['항상 가능하다.','아니다. 수입 이전의 지출 기한이 있다.'],1,'총액의 일치와 각 기한의 충족을 구분한다.','앞의 누적 부족액을 다시 확인하세요.')]);
guide43(10,2,'두 돈의 예치 기간','L10-3','창작 첫해 초300, 둘째 해 초100을 납입하여 둘째 해 말 찾는다. 연5% 복리, 매년 말 계산, 다른 입출금·세금·수수료 없음.','첫 납입금은 두 번, 둘째 납입금은 한 번의 연말 이자 계산을 거친다.',[
gp43('기간 선택','각 납입금의 이자 계산 기간은?',['모두2년','첫 돈2년·둘째 돈1년','첫 돈1년·둘째 돈2년'],1,'만기일은 같아도 납입일이 다르다.','돈이 들어온 날부터 만기까지 세어 보세요.'),
gn43('원리금 복원','중간 반올림 없이 계산하세요.',['첫 납입금 원리금','둘째 납입금 원리금','합계','전체 이자'],[330.75,105,435.75,35.75],'300×1.05²=330.75,100×1.05=105. 합435.75에서 원금400을 빼면35.75다.','두 원리금을 각각 구한 뒤 합하고, 이자는 마지막에 원금을 뺍니다.'),
gp43('합산 순서','원금400 전체에2년 복리를 적용해도 되는가?',['된다. 원금은 결국400이다.','안 된다. 둘째100에 존재하지 않은1년을 더하게 된다.'],1,'합계 원금이 같아도 예치된 기간은 다르다.','둘째 납입금은 첫해에 계좌에 없었습니다.')]);
guide43(11,1,'달러와 원화가 반대로 움직였다','L11-2','창작 자산을80달러·1250원/달러에 취득하고100달러·900원/달러에 전액 매도·환산한다. 중간 현금흐름·비용 없음.','각 시점의 달러 금액과 그 시점 환율을 한 쌍으로 묶는다.',[
gn43('원화 두 칸','원/달러 표시 방향을 사용하세요.',['처음 원화 금액','마지막 원화 금액'],[100000,90000],'80×1250=100000,100×900=90000이다.','달러×원/달러의 단위는 원입니다.'),
gn43('손익과 수익률','처음 원화 금액을 기준으로 비교하세요.',['원화 손익','원화 수익률(%)'],[-10000,-10],'90000−100000=−10000, 처음100000 대비−10%이다.','수익률의 분모는 나중 금액이 아니라 처음 투자금입니다.'),
gp43('기준 통화 확인','달러 금액이80에서100으로 늘었으니 원화 이익도 반드시 양수인가?',['그렇다.','아니다. 환율 변화까지 같은 통화로 계산한다.'],1,'외화와 원화의 결과가 다른 창작 사례이다.','외화액과 환율이 모두 바뀌었습니다.')]);
guide43(11,2,'같은 지갑, 달라진 구매량','L11-1','창작 보유액12000원. 같은 상품의 단가가800원에서1000원으로 올랐다. 정수 개만 구매하며 다른 비용은 없다. 실제 종합 물가 지수를 계산하는 자료는 아니다.','화폐 금액과 그 금액으로 살 수 있는 상품 수량을 별도로 적는다.',[
gn43('구매량 계산','이전과 이후 최대 구매 개수는?',['이전 개수','이후 개수'],[15,12],'12000/800=15,12000/1000=12이다.','금액은 같고 단가만 바뀌었습니다.'),
gn43('감소한 양','처음 구매량을 기준으로 계산하세요.',['줄어든 개수','구매 가능 개수 감소율(%)'],[3,20],'15−12=3,3/15×100=20%이다.','새 개수12가 아니라 처음15를 분모로 사용하세요.'),
gp43('지표의 범위','이 자료로 직접 확인할 수 있는 것은?',['모든 상품의 종합 물가 상승률','같은 돈으로 이 상품을 살 수 있는 수량의 변화','모든 사람의 생활 수준 변화'],1,'단일 상품의 창작 예제와 종합 물가·생활 수준 전체는 다르다.','자료에 실제로 들어 있는 가격이 몇 종류인지 확인하세요.')]);
guide43(12,1,'노동이 부족한 공정','L12-2','창작 제품1개당 재료4·노동3 필요. 재료29·노동20을 보유하고 정수 완제품만 생산한다. 기술 등 다른 요건은 모두 충족했다.','각 요소가 몇 개분인지 따로 계산하고, 두 조건을 함께 만족하는 최대량을 고른다.',[
gp43('생산 제약 선택','전체 최대량을 구하는 기준은?',['재료로 가능한 양과 노동으로 가능한 양을 더한다.','각 요소의 생산 한도 중 작은 값을 정수 조건에 맞춘다.','더 많은 쪽의 생산 한도만 사용한다.'],1,'모든 완제품에 두 요소가 동시에 필요하기 때문이다.','한쪽 요소만으로 완제품을 만들 수는 없습니다.'),
gn43('수량과 잔여량','최대 정수 완제품을 만들 때를 계산하세요.',['완제품 수','남은 재료','남은 노동'],[6,5,2],'노동20/3은6개까지만 가능.6개에 재료24·노동18을 써5·2가 남는다.','재료는7개분 이상이지만 노동이 더 엄격한 제약입니다.'),
gp43('조건 변경','노동은 그대로20, 재료만40으로 늘어나면 최대 정수 완제품은?',['여전히6개','10개','20개'],0,'부족한 노동 조건이 바뀌지 않아 최대량이 유지된다.','이미 넉넉한 요소만 늘어난 경우입니다.')]);
guide43(12,2,'총비용은 늘고 단가는 내렸다','L12-3','창작 같은 상품을100개 만들 때 총비용280,200개 만들 때 총비용460이다. 통화·비용 범위는 같고 다른 정보는 없다.','규모의 경제를 검토하려면 총비용을 각 생산량으로 나누어 평균 생산 단가를 구한다.',[
gn43('두 단가','각 생산량에서 평균 단가를 완성하세요.',['100개 평균 단가','200개 평균 단가'],[2.8,2.3],'280/100=2.8,460/200=2.3이다.','총비용을 서로 빼기 전에 단가로 바꾸세요.'),
gn43('단가 차이','생산량이 늘면서 한 개당 비용은 얼마나 내려갔는가?',['단가 하락액'],[0.5],'2.8−2.3=0.5이다.','총비용 증가액180과 다른 질문입니다.'),
gp43('결론의 범위','자료가 지지하는 설명은?',['총비용이 늘었으니 규모의 경제가 아니다.','제시된 두 규모 사이에서 평균 생산 단가가 하락했다.','모든 생산량에서 단가가 무한히 하락한다.'],1,'정의에 맞는 기준과 자료가 제공한 범위를 지킨다.','제시되지 않은 더 큰 생산 규모까지 자동 연장하지 마세요.')]);
guide43(13,1,'표 제목이 바뀌어도 같은 비용','L13-1','창작 A국의 총노동량60시간. X1개에는3시간, Y1개에는5시간이 필요하며 이 비율은 일정하다. 두 재화만 생산한다.','단위당 투입량에서 최대 생산량을 만들고 두 방식의 기회비용 계산을 대조한다.',[
gn43('최대량표 만들기','전부 한 재화에 투입할 때를 계산하세요.',['최대 X','최대 Y'],[20,12],'60/3=20,60/5=12이다.','총노동을 단위당 필요 노동으로 나누세요.'),
gn43('기회비용 복원','X1개의 생산 기회비용을 Y개 단위로 구하세요. 분수 입력도 가능하다.',['X1의 기회비용(Y개)'],[0.6],'투입량표3/5, 최대량표12/20 모두0.6이다.','X에 쓰는3시간으로 만들 수 있었던 Y를 계산하세요.'),
gp43('두 표 비교','투입량표와 최대량표의 숫자 위치가 같으면 나눗셈 방향도 항상 같은가?',['항상 같다.','자료가 무엇을 의미하는지에 따라 구분한다.'],1,'값의 위치가 아니라 기준 재화와 포기량을 확인한다.','한 표는 필요한 노동, 다른 표는 가능한 생산량입니다.')]);
guide43(13,2,'생산 조합에서 절편으로','L13-2','창작 같은 총자원·기술에서 최대 X18 또는 Y12. 생산 가능 곡선은 직선이다. X6을 생산한다.','X에 사용한 자원의 비율은6/18이다. 남은 비율을 Y 최대량에 곱한다.',[
gn43('자원 비율','분수 또는 소수로 채우세요.',['X에 사용한 비율','남은 비율'],[1/3,2/3],'6/18=1/3, 나머지는2/3이다.','분수를 그대로1/3,2/3으로 입력해도 됩니다.'),
gn43('최대 Y','Y 최대량12에 남은 비율을 곱하세요.',['생산 가능한 최대 Y'],[8],'12×2/3=8이다.','X최대와 Y최대를 동시에 생산하는 것은 아닙니다.'),
gp43('가능과 최대의 차이','X6·Y6이라는 조합은 같은 조건에서?',['불가능하다.','생산 가능 영역 내부이다.','항상 곡선 위의 최대 조합이다.'],1,'X6일 때 Y최대8보다 적은6은 가능한 내부 조합이다.','가능하다는 말과 해당 X에서 Y를 최대로 만든다는 말을 구분하세요.')]);
guide43(14,1,'비율이 좋은데 배에 실을 물건이 없다','L14-5','창작 같은 총노동량·직선 모형 A최대X24·Y12, B최대X8·Y8. A는X24,B는Y8에 완전 특화했다. 두 나라만 거래하며 재고·손실·거래 비용 없음.','X1의 비용은 A가Y0.5,B가Y1이다. 먼저 비율을 보고 그다음 실제 수출 가능한 양을 확인한다.',[
gp43('불가능한 제안','X12:Y9의 비율0.75는 두 비용 사이이다. 그런데 무엇이 문제인가?',['A가X12를 제공할 수 없다.','B가Y8만 생산해Y9를 제공할 수 없다.','비율은 언제나1이어야 한다.'],1,'비율이 유리해도 보유량을 넘는 거래는 이 조건에서 불가능하다.','B의 특화 생산량과 Y수출량을 비교하세요.'),
gn43('새 계약 완성','계약을X8:Y6으로 줄였다. 자급 대비 Y단위의 추가 확보·절약을 계산하세요.',['A 추가 이익(Y개)','B 절약 이익(Y개)'],[2,2],'A6−8×0.5=2, B8×1−6=2이다.','수량 상한 X8≤24,Y6≤8도 동시에 지킵니다.'),
gp43('검산 순서','유리한 실제 교환을 판별하려면?',['비율만 본다.','기회비용·비율·수량 상한·양국 이익을 함께 본다.'],1,'서로 다른 조건을 모두 만족해야 한다.','처음 제안이 실패한 이유를 되짚어 보세요.')]);
