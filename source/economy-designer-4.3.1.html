// PART 2: 12개의 새 강의와 24개의 적용·제작 활동. 예제의 인물·수치는 별도 표시한 창작.
const DAY=[['A · 전시 관람',30,8],['B · 체험 활동',36,10],['C · 공연 관람',32,7]];
defineCase('choice',[
lesson('choice','CH-L1','지갑 밖에도 비용이 있다','선택의 비용은 실제로 낸 돈만으로 끝나지 않는다.',[
['모든 활동을 함께 할 수 없을 때','수능특강은 자원의 희소성을 욕구에 비해 사용할 수 있는 자원이 상대적으로 부족한 상태로 설명한다. 시간이 두 시간이면, 같은 시간에 열리는 공연과 일자리를 모두 선택하기 어려울 수 있다. 하고 싶은 것이 많다는 사실과 실제로 할 수 있는 선택을 구분하자.'],
['얻는 것과 내는 것을 분리한다','편익은 선택을 통해 얻는 이득이나 만족감이다. 돈으로 받은 보수만 편익인 것은 아니다. 공연을 즐기는 만족도 편익이 될 수 있다. 명시적 비용은 선택하면서 실제로 지불하는 금전적 비용이다. 표 값이나 교통비가 여기에 들어갈 수 있다.'],
['포기하는 것은 무엇인가','암묵적 비용은 포기한 최선의 다른 대안에서 얻을 수 있었던 가치이다. 다른 대안에도 직접 지출하는 비용이 있다면 그 비용을 제외한 가치를 비교해야 한다. 이 학습실은 그 중간값인 편익−명시적 비용을 ‘비교값’이라고 표시한다. 교재의 정식 용어인 순편익과 같지 않다.']],
{p:'창작 예제. 공연과 일을 동시에 할 수 없다. 공연 표 값은 3만 원이다. 일을 하면 보수 8만 원을 받지만 교통비 1만 원이 든다. 공연을 선택한다.',steps:['공연의 명시적 비용은 표 값 3만 원이다.','포기한 일의 비교값은 8−1=7만 원이다. 이것이 공연의 암묵적 비용이다.','기회비용은 3+7=10만 원이다.'],result:'공연: 명시적 비용 3, 암묵적 비용 7, 기회비용 10만 원.'},
{rule:'주체 → 가능한 대안 → 편익 → 직접 지출 → 최선의 포기 대안 순서로 읽는다.',limit:'이후 게임은 만족을 화폐 단위로 제시한 창작 비교이다. 실제 모든 사람의 만족을 객관적인 동일 금액으로 측정했다는 뜻이 아니다.'},
'학생이 “돈을 내지 않았으니 비용이 0”이라고 말하면, 같은 시간과 자원으로 할 수 있었던 다른 활동을 먼저 묻는다. 반대로 하지 못한 모든 활동의 가치를 무조건 더하지 않는다. 먼저 대안들이 동시에 가능한지부터 확인한다.',['E76']),
task('CH-T1','map','지출과 포기의 서랍','공연을 선택했다. 각 설명을 올바른 서랍에 넣으세요.',{rows:['공연에서 얻는 만족','공연 표 값 3만 원','대신 가능한 일의 비교값 7만 원'],options:['편익','명시적 비용','암묵적 비용']},[0,1,2],'얻는 만족, 실제 지출, 포기한 다른 대안의 가치를 각각 구분한다.','세 칸은 서로 다른 질문에 답한다. 무엇을 얻고, 직접 무엇을 내고, 어떤 대안을 포기하는가?'),
task('CH-T2','ghost','선택하지 않은 카드','세 활동 중 하나만 한다. 가장 유리한 활동과, 그것을 선택할 때 포기하는 최선의 대안을 각각 선택하세요.',{rows:DAY},[1,2],'비교값은 A 22, B 26, C 25이다. B를 고르며 C의 25를 포기한다.','먼저 편익에서 명시적 비용을 빼세요. 선택한 카드는 포기 대안으로 고를 수 없습니다.'),
lesson('choice','CH-L2','순편익까지 가는 네 칸','비교값, 암묵적 비용, 기회비용, 순편익을 서로 바꾸어 부르지 않는다.',[
['자신의 비용에 다른 대안의 가치를 더한다','A와 B 중 하나만 고르면 A를 선택할 때 포기한 최선의 대안은 B이다. 따라서 A의 암묵적 비용은 B의 비교값이고, 여기에 A 자신의 명시적 비용을 더하면 A의 기회비용이 된다. 자기 자신의 비교값을 암묵적 비용으로 적는 실수를 피하자.'],
['순편익은 마지막에 계산한다','교재의 계산에서 순편익은 편익에서 기회비용을 뺀 값이다. 명시적 비용만 뺀 비교값을 순편익이라고 적지 않는다. 기본 풀이에서는 비교값을 먼저 구하고, 다른 대안을 확인하고, 기회비용을 완성한 뒤 순편익을 구한다.'],
['기회비용이 작으면 무조건 좋은가','편익이 같을 때는 기회비용이 작은 쪽을 선택할 수 있다. 그러나 편익이 다르면 기회비용만 비교해서는 안 된다. 더 큰 기회비용을 감수하더라도 편익까지 고려한 순편익이 더 클 수 있다.']],
{p:'창작 예제. A의 편익/명시적 비용은 25/7, B는 32/11이다. 두 대안 중 하나만 선택하고 다른 대안·매몰 비용은 없다.',table:[['대안','편익','명시적 비용'],['A',25,7],['B',32,11]],steps:['비교값: A 18, B 21.','A: 암묵적 비용 21, 기회비용 7+21=28.','B: 암묵적 비용 18, 기회비용 11+18=29.','순편익: A 25−28=−3, B 32−29=3.'],result:'B가 최선이다. 기회비용 29는 A의 28보다 크지만 순편익도 더 크다.'},
{rule:'선택만 묻는다면 편익−명시적 비용의 큰 값을 먼저 찾는다. 금액을 묻는다면 해당 비용 칸까지 반드시 완성한다.',limit:'두 대안의 편익과 직접 비용이 명확하고 상호 배타적일 때 사용하는 풀이이다. 비교값을 순편익이라고 부르지 않는다.'},
'두 대안의 비교값을 G_A, G_B라고 놓으면 순편익은 G_A−G_B와 G_B−G_A이다. 따라서 두 순편익의 부호가 반대인지 검산할 수 있다. 이는 교재의 정의에서 도출한 계산 요령이지 별도의 암기 개념이 아니다.',['E76']),
task('CH-T3','numbers','B의 두 번째 장부','앞선 세 활동에서 B를 선택한다. B의 비용과 순편익을 복원하세요. 단위: 만 원.',{table:[['대안','편익','명시적 비용'],...DAY],labels:['B의 암묵적 비용','B의 기회비용','B의 순편익']},[25,35,1],'C의 비교값 32−7=25가 포기한 최선의 가치이다. 기회비용 10+25=35, 순편익 36−35=1이다.','B의 비교값 26은 B 자신의 순편익이 아니다.'),
task('CH-T4','numbers','다른 표로 혼자 복원하기','A·B·C 중 하나만 선택한다. 표의 비용은 모두 앞으로 발생하는 명시적 비용이다. B를 선택할 때의 장부를 완성하세요.',{table:[['대안','편익','명시적 비용'],['A',22,4],['B',28,7],['C',25,6]],labels:['B의 암묵적 비용','B의 기회비용','B의 순편익']},[19,26,2],'비교값은 18·21·19이다. B는 C의 19를 포기한다. 7+19=26, 28−26=2이다.','선택하지 않은 두 대안의 비교값을 더하지 말고 큰 값 하나를 고르세요.'),
lesson('choice','CH-L3','이미 쓴 돈과 바뀐 조건','과거라는 말보다 회수할 수 있는지를 먼저 확인한다.',[
['매몰 비용의 기준','수능특강은 매몰 비용을 이미 지출하여 회수할 수 없는 비용으로 설명하고, 합리적 선택에서 고려하지 않는다고 제시한다. “이미 많이 썼다”는 이유만으로 사업 계속이 유리해지는 것은 아니다. 지금 선택에 따라 앞으로 얻는 편익과 비용을 비교해야 한다.'],
['새 계약은 새 조건이다','창작 사건에서 전환할 때에만 반환금을 받는 새 계약이 생겼다고 하자. 그 반환금은 새 조건에서 선택에 따라 달라지는 금액이므로 비교에 반영한다. 이전 문제에서는 회수 불가능하다고 했는데 뒤늦게 그 답을 틀렸다고 처리하는 것은 옳지 않다. 문제마다 적용하는 조건을 나눈다.'],
['얼마나 바뀌어야 선택이 뒤집힐까','비용이 조금 올랐다고 항상 최선의 대안이 바뀌는 것은 아니다. 바뀐 대안의 비교값이 기존 경쟁 대안의 비교값을 넘거나 밑돌았는지 확인한다. 같은 값이 되는 경계와, 확실히 우열이 바뀌는 값을 구분한다.']],
{p:'창작 사업. A는 앞으로 편익 150·비용 90, B는 130·55이다. 회수 불가능한 과거 지출 60은 두 대안에 공통이다. 이후 B의 앞으로 비용만 75가 된다.',steps:['처음 비교값은 A 60, B 75로 B가 크다.','회수 불가능한 60은 어느 선택에서도 달라지지 않는다.','새 비용이 적용되면 B의 비교값은 55로 떨어져 A의 60이 더 커진다.'],result:'선택을 바꾼 것은 과거 지출 60이 아니라 앞으로의 비용 변경이다.'},
{rule:'변한 대안만 먼저 재계산한 뒤, 다른 대안의 최댓값과 비교한다.',limit:'“과거에 냈다”와 “지금 회수할 수 없다”를 동일시하지 않는다. 환불·전환 조건은 문제에 명시된 때만 사용한다.'},
'경계값에서는 두 비교값이 같다. 수능특강의 양수·음수 순편익 설명은 최선이 구분되는 사례를 중심으로 읽고, 이 게임의 동률은 별도로 표시한 수학적 보충 사례로 다룬다. 동률을 피하고 싶다면 조건에 유일한 최선이 생기도록 자료를 조정한다.',['E76']),
task('CH-T5','threshold','선택을 뒤집는 최소 비용','원래 표에서 B의 명시적 비용만 정수로 올릴 수 있다. C가 유일한 최선이 되는 B 비용의 최소 정숫값을 찾으세요.',{rows:DAY,min:10,max:18,step:1,label:'B의 새로운 명시적 비용'},12,'B 비용 11이면 B와 C의 비교값이 모두 25로 동률이다. 비용 12이면 B 24, C 25이므로 C가 유일한 최선이다.','같아지는 값과 확실히 뒤집히는 최소 정숫값을 구분하세요.'),
task('CH-T6','choice','과거 장부의 유혹','모든 대안의 앞으로 편익·비용은 그대로이고, 어느 선택에서도 회수 불가능한 과거 지출만 60에서 200으로 커졌다. 어떤 판단이 적절한가?',{options:['이미 많이 썼으므로 반드시 기존 사업을 계속한다.','그 사실만으로 현재 대안 간 우열은 바뀌지 않는다.','과거 지출이 크므로 미래의 모든 편익은 0이다.']},1,'어느 대안을 선택해도 회수할 수 없는 과거 지출이다. 현재의 비교 조건이 바뀌지 않았다.','선택에 따라 달라지는 금액이 있는지 확인하세요.'),
lesson('choice','CH-L4','선택은 같아도 순편익은 달라진다','최선의 대안과 그 대안의 순편익은 다른 질문이다.',[
['1등은 2등을 포기한다','세 대안의 비교값이 22·26·25라면 1등인 B를 선택할 때는 2등인 C의 25를 포기한다. 나머지 대안들은 B의 26을 포기한다. 따라서 한 대안의 암묵적 비용은 자신을 제외한 최댓값이다.'],
['간격을 읽으면 순편익이 보인다','각 비교값을 G라고 표시하면 이 모형의 순편익은 자신의 G에서 자신을 제외한 최대 G를 뺀 값이다. 유일한 1등의 순편익은 1등과 2등 사이의 간격이다. 이것은 교재 정의에서 도출한 풀이이며 ‘비교값’은 이 학습실에서만 쓰는 중간 계산 표시이다.'],
['비판할 문장을 정확히 고친다','“최선이 같으면 비용도 같다”는 문장은 성립하지 않을 수 있다. 2등의 가치가 올라가되 1등을 넘지 않으면 선택은 유지되지만 포기하는 가치가 커진다. 숫자를 직접 조정해 반례를 만들면 공식의 의미를 더 분명히 알 수 있다.']],
{p:'창작 예제. 비교값 A 22, B 26, C 25이다. C의 비교값만 25.5로 올린다.',steps:['처음 B의 순편익은 26−25=1이다.','변경 후에도 B의 26이 25.5보다 크므로 B가 유일한 최선이다.','그러나 B가 포기하는 가치는 25.5가 되어 순편익은 0.5로 줄어든다.'],result:'선택 B는 유지되지만 B의 암묵적 비용과 순편익은 달라진다.'},
{rule:'1등과 2등만 먼저 표시하면 최선의 선택과 그 순편익을 빠르게 확인할 수 있다.',limit:'상호 배타적인 대안과 평가값이 전부 제시된 모형에서 쓴다. “아무것도 하지 않기”가 대안에 있으면 그것도 비교한다. 동률의 처리도 별도로 확인한다.'},
'학생에게 “기회비용이 큰 대안을 골라도 합리적일 수 있는가?”라고 묻고, 편익이 다른 예제로 설명하게 한다. 원고에서는 최소 비용·최대 편익이라는 표현을 무조건 비용만 최소화하는 규칙으로 바꾸지 않는다. 각 문항에 대안의 범위와 비용 포함 범위를 적는다.',['E76']),
task('CH-T7','countermodel','반례를 만드는 조사관','A·B는 그대로다. C의 편익만 0.5씩 올려서 B가 유일한 최선인 동시에 B의 순편익이 0보다 크고 1보다 작게 만드세요.',{rows:DAY,min:32,max:34,step:0.5,label:'C의 새로운 편익'},32.5,'C의 비교값 32.5−7=25.5이다. B 26이 여전히 가장 크지만 순편익은 26−25.5=0.5이다.','C가 B를 넘으면 안 됩니다. 비교값의 간격을 0과 1 사이로 좁히세요.'),
task('CH-W','write','한결에게 설명하는 1분 강의','“왜 포기한 대안 전체를 더하지 않고 최선의 하나만 보나요?”에 답하는 강의 초안을 작성하세요.',{checks:['동시에 하나만 선택한다는 조건을 밝혔다.','명시적 비용·암묵적 비용·기회비용·순편익을 구분했다.','선택은 같지만 순편익은 달라지는 예를 넣었다.'],starter:'상호 배타적인 대안 중 하나만 선택할 때…'},null,'초안과 작성자 자기 점검만 저장한다. 내용의 정확성이 자동 인증되는 것은 아니다.','앞선 세 활동의 비교값 22·26·25를 예로 들 수 있습니다.')
]);
defineCase('public',[
lesson('public','PG-L1','공공재의 두 가지 질문','돈을 내지 않은 사람을 막을 수 있는가? 한 사람의 이용이 다른 사람의 기회를 줄이는가?',[
['소유 주체로만 판단하지 않는다','수능특강은 공공재를 비배제성과 비경합성을 가진 재화나 서비스로 설명하고 국방·치안을 예로 든다. “정부가 제공하니까 공공재”라는 식으로 소유·공급 주체만 보고 정의를 바꾸지 말자. 먼저 소비에서 나타나는 두 특성을 확인한다.'],
['비배제성','대가를 지불하지 않은 사람을 소비에서 배제할 수 없는 특성이다. 모금에 참여하지 않은 주민도 설치된 가로등의 편익을 얻는 상황은 이 특성을 이해하는 예시이다.'],
['비경합성','한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 이것은 대가를 냈는지와 다른 질문이다. 두 특성을 하나의 설명으로 뭉뚱그리면 사례 분류에서 오류가 생긴다.']],
{p:'학습용 상황. 가로등이 설치되어 골목을 비춘다. 내지 않은 사람도 편익을 얻고, 한 주민이 그 빛을 이용한다고 다른 주민의 이용 기회가 줄지 않는다고 가정한다.',steps:['미납부자의 이용을 막지 못하는 조건은 비배제성이다.','다른 사람의 소비 기회를 줄이지 않는 조건은 비경합성이다.','그림은 이 두 조건을 보여 주는 모형이지 모든 실제 시설의 상태를 판정하는 자료는 아니다.'],result:'비배제성은 배제 가능성, 비경합성은 소비 기회의 감소 여부를 묻는다.'},
{rule:'대가·미지급·배제는 비배제성, 타인의 이용 기회·감소는 비경합성으로 질문을 나눈다.',limit:'단어 하나만 보고 결정하지 말고, 문제에서 시설의 혼잡이나 이용 제한 조건을 따로 주었는지도 확인한다.'},
'공공재 부족은 시장 실패의 한 유형이다. 외부 효과·정보의 비대칭성·독과점도 시장 실패 유형이지만 원인이 같지는 않다. 지도할 때는 공공재의 두 특성을 먼저 설명한 뒤 비용 부담과 공급 문제로 이어간다.',['E77','D77']),
task('PG-T1','map','두 특성의 표지판','각 문장을 알맞은 개념과 연결하세요.',{rows:['비용을 내지 않은 사람을 소비에서 배제할 수 없다.','한 사람의 소비가 다른 사람의 소비 기회를 줄이지 않는다.'],options:['비배제성','비경합성']},[0,1],'비배제성과 비경합성은 각각 배제와 소비 기회에 관한 기준이다.','누가 돈을 냈는지 묻는가, 다른 사람의 소비 기회가 줄어드는지 묻는가?'),
task('PG-T2','numbers','교과서의 모금 자료 읽기','동아 교과서의 활동: 주민 20명, 설치비 12만 원, 설치 시 각자 편익 1만 원. 제시된 금전적 편익과 비용만으로 설치에 따른 차이를 계산하세요.',{labels:['추가 총편익(만 원)','설치비(만 원)','추가 총편익−설치비(만 원)']},[20,12,8],'20명×1만 원=20만 원. 설치비 12만 원을 빼면 차이는 8만 원이다. 모금이 실제 성립하는가는 별도의 문제이다.','사회 전체의 편익 합계와 각 주민이 실제로 내는 금액은 서로 다른 정보입니다.',{refs:['D77']}),
lesson('public','PG-L2','빛은 모두에게, 비용은 누군가에게','공동의 이익이 있다는 사실과 충분한 모금이 이루어진다는 것은 다르다.',[
['교과서가 제시한 문제','동아의 활동은 20명의 주민이 비용 12만 원을 모으는 상황이다. 다른 사람의 납부액은 모르며 각자 가진 1만 원 안에서 납부한다. 교사용 설명은 무임승차 경향과 충분한 공급의 어려움을 정부 공급의 이유와 연결한다.'],
['이번 게임의 규칙은 별도이다','계산 과정을 눈으로 확인하도록 이번 게임은 주민 네 명, 초기 토큰 각 10, 설치 비용 24, 설치 시 편익 각 10으로 바꿨다. 첫 두 게임에서는 다른 세 주민의 납부액을 공개하며, 실패하면 납부액 전액을 반환한다. 이 숫자와 반환 규칙은 교과서 원문이 아니라 창작 조건이다.'],
['설치 여부부터 계산한다','총 납부액이 24 이상이면 설치한다. 성공했을 때 개인의 결과는 남은 토큰과 시설 편익의 합, 즉 10−내 납부액+10이다. 실패하면 반환되므로 개인은 초기 토큰 10을 갖는다. 이 지표는 현실의 행복 점수가 아니라 공개한 게임 계산이다.']],
{p:'창작 네 주민이 모두 6씩 낸다. 설치비 24, 각 초기 토큰 10, 설치 편익 10이다.',steps:['총 납부는 6×4=24이므로 설치된다.','각자 남은 토큰은 10−6=4이다.','시설의 편익 10을 더하면 개인의 결과는 14이다.'],result:'네 주민 모두 결과 14. 다만 이 조합이 타인의 선택을 모르는 상황에서 자동으로 이루어진다는 뜻은 아니다.'},
{rule:'① 합계와 설치비 비교 → ② 성공·실패 구분 → ③ 남은 토큰과 편익 계산.',limit:'교과서의 20명 모형과 게임의 4명 모형, 공개 정보와 비공개 정보, 반환 규칙을 섞지 않는다.'},
'동일한 용어를 다루더라도 모형의 조건이 다르면 질문이 달라진다. 교과서 활동은 공급의 어려움을 탐구하고, 공개된 납부액 게임은 조건부 최선의 선택을 계산한다. 게임 결과를 원문의 예시 답안 교정으로 사용하지 않는다.',['D77','E77']),
task('PG-T3','donation','내가 내야 달라지는 경우','다른 세 주민은 6·6·6을 냈다. 내 선택지는 0·4·6·10이다. 내 결과를 가장 크게 만드는 납부액과 최종 결과를 예상하세요.',{others:[6,6,6],choices:[0,4,6,10]},[6,14],'타인의 합계는 18이다. 0·4는 설치 실패로 결과 10, 6은 설치되어 결과 14, 10은 결과 10이다.','내가 낸 돈으로 설치 여부가 바뀌는 최소 지점을 찾으세요.'),
task('PG-T4','donation','이미 모인 비용','새 조건: 다른 세 주민은 8·8·8을 냈다. 내 선택지는 0·4·6·10으로 같다. 내 결과를 가장 크게 만드세요.',{others:[8,8,8],choices:[0,4,6,10]},[0,20],'다른 주민만으로 24가 모여 이미 설치 조건을 충족한다. 내가 0을 내면 보유 토큰 10과 편익 10을 모두 얻는다.','이번에는 내가 내지 않아도 설치되는지 먼저 확인하세요.'),
lesson('public','PG-L3','보이지 않는 납부액','모형이 정해지지 않은 타인의 행동까지 정답처럼 예측하지 않는다.',[
['한 번의 성공이 모든 경우의 성공은 아니다','타인이 합계 24를 낸 경우, 내 납부가 0이어도 설치된다. 그러나 이것만으로 모두가 언제나 충분한 금액을 낸다고 말할 수는 없다. 반대로 무임승차가 가능하다고 해서 모든 조건에서 설치가 실패한다고 단정할 수도 없다.'],
['타인의 납부액을 숨기면','이번 창작 과제는 타인의 납부액을 모르는 경우에 유일한 최적 납부액을 확정할 정보가 충분한지 묻는다. 앞에서는 합계 18이면 6이, 합계 24이면 0이 유리했다. 가능한 상황과 사람들의 행동 가정을 주지 않으면 같은 계산 답을 그대로 적용할 수 없다.'],
['원문의 설명과 게임 질문을 나눈다','교과서는 비배제성에 따른 무임승차 경향과 공급 부족을 설명한다. 이번 정보 충분성 과제는 타인 행동의 확률·규칙을 주지 않은 상태에서 특정 개인의 최적 납부액을 하나로 확정할 수 있는지를 따로 점검한다. 다른 질문을 같은 결론으로 취급하지 않는다.']],
{p:'창작 비교. 선택지는 0·4·6·10이다. 상황 A에서는 타인의 납부 합계 18, 상황 B에서는 24이다. 어느 상황인지와 발생 확률은 알려 주지 않는다.',steps:['상황 A에서는 6을 내면 결과 14로 가장 크다.','상황 B에서는 0을 내면 결과 20으로 가장 크다.','어느 상황인지 모르는 현재 자료만으로 두 경우의 최적 선택을 하나로 확정할 수 없다.'],result:'필요한 정보나 행동 가정이 무엇인지 밝혀야 한다.'},
{rule:'“알 수 없다”를 고를 때는 서로 다른 결론을 만드는 두 가능한 조건을 찾아 설명한다.',limit:'정보 부족이라는 말로 교과서의 공공재·무임승차 개념 설명을 부정하는 것은 아니다.'},
'자동 주민을 추가하려면 행동 규칙을 공개해야 한다. 예컨대 모든 주민이 같은 납부액을 선택한다는 규칙은 게임의 가정이다. 그 시뮬레이션 결과를 실제 주민들의 보편적 행동이라고 표현하지 않는다.',['D77','E77']),
task('PG-T5','choice','가려진 모금함','타인의 납부 합계가 18 또는 24일 수 있다. 어느 경우인지와 확률은 없다. 앞선 게임에서 항상 하나의 납부액이 유일하게 최선이라고 할 수 있는가?',{options:['두 경우 모두 반드시 0이 최선이다.','두 경우 모두 반드시 6이 최선이다.','두 경우의 최적 선택이 달라 추가 정보나 가정이 필요하다.']},2,'합계 18에서는 6, 합계 24에서는 0이 최선이다. 정보 없는 상황에서 하나를 보편적 답으로 정하지 않는다.','앞선 두 진행 결과를 나란히 비교하세요.'),
task('PG-T6','allocation','공개된 분담 약속','새로운 창작 규칙: 네 주민이 납부를 약속한다. 총액은 정확히 24, 누구도 6보다 많이 내지 않는 조건을 모두 충족하세요. 이 제한은 게임의 합의 조건이지 공정성의 유일한 원칙이 아닙니다.',{names:['주민 A','주민 B','주민 C','주민 D'],max:10,limit:6,total:24},[6,6,6,6],'각자 최대 6이며 네 사람의 합이 24가 되어야 하므로 모두 6씩 낸다. 제약 조건을 충족한 해이지 현실의 유일한 정의로운 분담 규칙이 아니다.','합계뿐 아니라 각자의 상한도 확인하세요.'),
lesson('public','PG-L4','공공재를 설명하는 보고서','특성 → 비용 부담 → 공급 문제 → 정부 역할을 연결한다.',[
['무임승차자 문제','수능특강은 비배제성 때문에 대가를 지불하지 않고 소비하려는 경향이 나타난다고 설명한다. 그 결과 민간 시장에서 공공재가 충분히 공급되기 어려울 수 있다는 내용으로 이어진다. 비경합성만을 비용 회피의 직접 이유로 바꾸지 않는다.'],
['정부 역할의 연결','교재는 정부가 공공재 생산에 직접 참여하여 부족 문제를 해결하는 역할을 제시한다. 여기서 중요한 것은 “어떤 문제가 있어서 어떤 역할을 하는가”이다. 외부 불경제의 부담금, 정보의 비대칭성 개선을 위한 정보 표시와 공공재 공급을 구분한다.'],
['계산과 평가를 분리한다','내 결과를 최대화하는 납부액을 계산하는 문제와, 공동체가 어떤 분담 규칙을 정할지 논의하는 문제는 같지 않다. 많이 냈다고 경제 개념을 더 잘 안다고 평가하지 않는다. 합의 활동에서는 제시된 조건을 만족했는지와 설명의 근거를 확인한다.']],
{p:'창작 보고서에 “비배제성 때문에 미납부자도 편익을 얻을 수 있고, 비용 부담을 회피하려는 경향이 생길 수 있다”라고 적혀 있다. 이를 정부 역할과 연결한다.',steps:['공공재의 비배제성을 확인한다.','비용을 내지 않으려는 무임승차 경향을 연결한다.','충분한 공급이 어려운 문제와 정부의 직접 공급을 연결한다.'],result:'특성과 공급 문제를 연결하되 모든 개별 모금의 실패를 확정하지 않는다.'},
{rule:'문제의 원인과 정부의 대응을 한 쌍으로 적는다.',limit:'정부가 모든 시장 문제를 언제나 완벽하게 해결한다는 결론으로 확대하지 않는다. 이 사건은 특정 실제 정책의 법적·재정적 효과를 분석하지 않는다.'},
'원고 점검: “정부 소유이면 공공재”, “비경합성은 미지급자 배제 불가”, “모금 성공이면 시장 실패 개념이 틀림” 같은 문장을 별도 오개념으로 관리한다. 각 모금 문제의 정보 조건과 반환 조건을 빠뜨리지 않는다.',['E77','D77']),
task('PG-T7','multi','보고서에서 남길 문장','교재의 개념과 이번 창작 게임의 조건에 부합하는 문장을 모두 선택하세요.',{options:['비배제성 때문에 미납부자도 편익을 얻을 수 있다.','비경합성은 한 사람의 소비가 타인의 소비 기회를 줄이지 않는 것이다.','많이 납부한 사람이 항상 경제 개념도 더 잘 이해한다.','공공재 공급 부족과 정부의 직접 공급 역할을 연결할 수 있다.','무임승차가 가능하면 모든 모금은 어떤 조건에서도 실패한다.']},[0,1,3],'두 특성과 정부의 공급 역할을 구분한다. 납부액을 지식 점수로 바꾸거나 모든 상황의 실패를 단정하지 않는다.','항상·모든 조건이라는 말이 주어진 근거를 넘어서는지 확인하세요.'),
task('PG-W','write','도윤의 발표문 완성','가로등 장면을 이용해 비배제성·비경합성·무임승차·정부 역할을 1분 분량으로 설명하세요.',{checks:['비배제성과 비경합성을 따로 설명했다.','원문의 20명 활동과 게임의 4명 조건을 구분했다.','모금 한 번의 결과를 모든 상황으로 일반화하지 않았다.'],starter:'가로등이 켜졌을 때 누가 편익을 얻는지 보면…'},null,'초안과 자기 점검을 저장한다. 서술의 옳고 그름을 자동 인증하지 않는다.','누가 냈는지, 누가 편익을 얻는지, 다른 사람의 이용이 줄어드는지를 차례로 설명하세요.')
]);
defineCase('trade',[
lesson('trade','TR-L1','더 많이 만드는 것과 덜 포기하는 것','절대 우위와 비교 우위는 비교하는 비용이 다르다.',[
['같은 조건에서 생산량을 비교한다','절대 우위는 동일한 상품을 더 적은 비용으로 생산할 수 있는 능력과 연결된다. 같은 총노동량을 투입했을 때 최대 생산량이 더 크다면 같은 물건을 더 효율적으로 생산하는지 비교할 수 있다. 투입 조건을 모르는 생산 총량만으로 단정하지 않는다.'],
['기회비용을 비교한다','비교 우위는 같은 재화를 생산할 때 다른 생산자보다 기회비용이 작다는 뜻이다. 한 나라가 두 재화를 모두 더 많이 만들 수 있어도 포기하는 상대 재화의 양은 다를 수 있다. 절대 우위와 비교 우위가 묻는 것을 분리하자.'],
['한정된 생산 능력','이번 게임은 두 나라·두 재화, 같은 총노동량, 직선 생산 가능 곡선의 창작 모형이다. A는 X만 24개 또는 Y만 12개, B는 X만 8개 또는 Y만 8개를 만든다. “또는”은 두 최대량을 동시에 만든다는 뜻이 아니다.']],
{p:'창작 예제. A국은 모든 노동을 X에 쓰면 24개, Y에 쓰면 12개를 만든다. 생산 가능 곡선은 직선이다.',steps:['X 24개를 만드는 대신 Y 12개를 포기한다.','X 1개당 포기한 Y는 12÷24=1/2개이다.','X 18개를 만들면 노동의 18/24를 X에 사용하므로 나머지로 Y 3개를 만들 수 있다.'],result:'A의 X 1개 생산의 기회비용은 Y 1/2개. X 18개와 Y 3개는 같은 생산 가능 곡선 위에 있다.'},
{rule:'최대 생산량표에서 X 1개의 기회비용은 Y 최대량÷X 최대량이다.',limit:'직선 모형이고 자원·기술이 고정된 조건에 적용한다. 실제 생산 가능 곡선이 항상 직선이라는 뜻은 아니다.'},
'도형을 먼저 보여 준 뒤 표로, 다시 문장으로 바꾼다. 학습자가 X와 Y의 이름만 바꾸어도 혼동한다면 “무엇 1개를 더 만들면서 무엇을 몇 개 포기하는가”라는 단위 문장을 다시 쓰게 한다.',['A86']),
task('TR-T1','choice','두 나라의 생산 능력','같은 총노동량으로 A는 X 최대24·Y 최대12, B는 X 최대8·Y 최대8이다. 절대 우위를 바르게 읽은 것은?',{options:['A국이 두 재화 모두 절대 우위이다.','B국이 두 재화 모두 절대 우위이다.','A는 X, B는 Y에 반드시 절대 우위이다.']},0,'같은 투입 조건에서 A의 최대 생산량이 두 재화 모두 더 크다. 비교 우위는 별도로 기회비용을 비교해야 한다.','지금 묻는 것은 기회비용이 아니라 같은 투입 기준의 생산 능력입니다.'),
task('TR-T2','ppf','생산판에서 X를 늘리면','A국은 X 최대24 또는 Y 최대12, 직선 모형이다. X를 18개로 맞추고 그때 만들 수 있는 최대 Y를 예상하세요.',{xmax:24,ymax:12,target:18},[18,3],'X 18개는 최대량의 3/4이다. 남은 노동 1/4로 Y 12×1/4=3개를 만든다.','두 최대량을 동시에 만들 수 없습니다. X에 쓴 비율만큼 Y의 생산 기회를 포기합니다.'),
lesson('trade','TR-L2','표의 제목이 바뀌면 나눗셈도 바뀐다','최대 생산량과 단위당 투입량을 혼동하지 않는다.',[
['최대 생산량표','A가 X 24개를 만들 때 Y 12개를 포기하므로 X 1개당 Y 12/24개를 포기한다. B는 X 8개를 만들 때 Y 8개를 포기하므로 X 1개의 기회비용이 Y 1개이다. A가 X의 비교 우위를 갖는다.'],
['단위당 투입량표','X 1개에 노동 2시간, Y 1개에 4시간이 필요하다면 X에 쓰는 2시간으로 Y를 2/4개 만들 수 있었다. 따라서 X 1개의 기회비용은 Y 2/4개이다. 투입량표에서는 X에 필요한 노동을 Y 한 개의 노동으로 나눈다.'],
['외우기 전에 같은 조건으로 변환한다','수능특강 해설 부록은 투입량, 최대량과 생산 가능 곡선, 교역 전후 소비량을 다른 유형으로 제시한다. 겉모습은 달라도 생산의 기회비용을 찾아내는 것이 핵심이다. 생산 가능 곡선의 절편도 최대 생산량으로 읽을 수 있다.']],
{p:'창작 대응표. 총노동 48시간이다. A: X당 2시간·Y당 4시간. B: X당 6시간·Y당 6시간.',steps:['최대 생산량은 A (48/2,48/4)=(24,12), B (8,8)이다.','투입량으로 구한 X 1개 비용: A 2/4=1/2, B 6/6=1.','최대량으로 구한 비용: A 12/24=1/2, B 8/8=1로 일치한다.'],result:'표가 달라져도 같은 생산 조건이면 같은 기회비용이 나온다.'},
{rule:'X 1개 기준: 최대량표는 Y/X, 단위당 투입량표는 X투입/Y투입.',limit:'같은 생산 요소·같은 단위로 비교한다. 분수에 반드시 포기한 재화의 단위를 붙인다. 기회비용이 같은 경우에는 유일한 비교 우위를 부여하지 않는다.'},
'숏컷 검산: 두 재화의 기회비용이 서로 역수인지 확인한다. 다만 역수라는 형식만 맞아도 분수를 반대로 쓴 답이 생길 수 있으므로, 한 항목은 “노동 몇 시간을 다른 재화에 쓰면 몇 개를 만들까”로 직접 확인한다.',['A86']),
task('TR-T3','numbers','최대량표의 기회비용','같은 총노동량, 직선 모형. A 최대 X24·Y12, B 최대 X8·Y8이다.',{labels:['A의 X1 기회비용(Y개)','B의 X1 기회비용(Y개)']},[0.5,1],'A는12/24=1/2, B는8/8=1이다.','X를 1개로 맞추려면 포기한 Y 총량을 X 총량으로 나눕니다.'),
task('TR-T4','numbers','새로운 투입량표','새 자료이다. 재화 한 개에 필요한 노동시간은 A국 X3·Y6, B국 X6·Y4이다. X 1개 생산의 기회비용을 구하세요.',{table:[['나라','X1 노동시간','Y1 노동시간'],['A',3,6],['B',6,4]],labels:['A의 X1 기회비용(Y개)','B의 X1 기회비용(Y개)']},[0.5,1.5],'A는3/6=1/2, B는6/4=3/2이다. 최대량표의 나눗셈 방향을 그대로 쓰지 않는다.','X를 만들 노동으로 Y를 얼마나 만들 수 있는가?'),
lesson('trade','TR-L3','양쪽이 수락할 수 있는 비율','생산의 기회비용과 교환 비율을 같은 단위로 비교한다.',[
['계약을 한 단위로 읽는다','다시 기본 조건 A(24,12), B(8,8)로 돌아온다. A는 X에, B는 Y에 완전 특화한다. X q개와 Y y개를 교환한다면 X 1개당 받는 Y는 y/q개이다. 비율을 X:Y와 Y:X로 오가며 뒤집지 않는다.'],
['각 나라가 포기하는 것을 계산한다','A가 X q개를 생산하는 기회비용은 Y q/2개이다. 그보다 많은 y개를 받으면 같은 X 기준에서 Y를 추가로 얻는다. B는 X q개를 스스로 만들려면 Y q개를 포기해야 했으므로 y가 q보다 작을 때 Y를 절약한다. 양국에 양의 추가 이익을 요구하면 1/2<y/q<1이어야 한다.'],
['비율이 맞아도 수량을 확인한다','생산된 수량보다 더 수출하는 계약은 성립하지 않는다. 이번 모형에서 A의 X는 24, B의 Y는 8이다. 비율 조건과 수량 조건을 모두 확인한다. 시뮬레이션의 이익 단위는 Y재이며 실제 화폐 수익률이 아니다.']],

{p:'창작 역산. 교역 후 A의 소비는X18·Y4, B는X6·Y4이다. A는X, B는Y에 완전 특화했고 두 나라 외 거래·재고·손실은 없다.',steps:['X 총량은18+6=24, Y 총량은4+4=8이다.','A의Y4는 수입, B의X6도 수입이다.','서로 교환한 것은X6과Y4이므로 X:Y=3:2, X1당Y2/3이다.'],result:'총량 보존 → 특화 방향 → 수입량 → 교환 비율 순서로 복원한다.'},
{rule:'무역 후 소비량 자료는 합계부터 확인한다. 그다음 각국이 만들지 않은 재화의 소비를 본다.',limit:'완전 특화·두 나라 간 거래·재고와 손실 없음 등의 조건이 없으면 같은 역산이 성립하지 않을 수 있다.'},

function portrait(who,mood='neutral'){const c=CAST[who],glasses=c.style===1||c.style===5,long=c.style===2||c.style===3;return `<svg class="portrait" viewBox="0 0 110 130" role="img" aria-label="창작 캐릭터 ${esc(c.name)}"><path d="M13 129V105Q18 84 40 82H70Q94 86 99 105V129" fill="${c.coat}"/><path d="M41 83L55 104 70 83" fill="#f5efdb"/><path d="M48 96L55 104 62 96 65 129H46Z" fill="#37575a"/><rect x="45" y="70" width="20" height="24" rx="7" fill="${c.skin}"/>${long?`<path d="M23 91V44Q23 9 54 9 89 9 88 50L92 93 76 86 68 53 41 51 36 90Z" fill="${c.hair}"/>`:''}<ellipse cx="55" cy="49" rx="30" ry="35" fill="${c.skin}"/><ellipse cx="24" cy="53" rx="5" ry="8" fill="${c.skin}"/><ellipse cx="86" cy="53" rx="5" ry="8" fill="${c.skin}"/><path d="M24 45Q17 5 54 7Q91 4 87 42L78 30Q55 37 47 22Q35 32 24 45Z" fill="${c.hair}"/>${c.style===2?'<path d="M72 12Q93 0 91 28L81 47" fill="#473e4a"/>':''}<path d="M35 43l11 -2M65 41l11 2" stroke="${c.hair}" stroke-width="2" stroke-linecap="round"/>${mood==='happy'?'<path d="M35 51q6 -6 12 0M64 51q6 -6 12 0" stroke="#2b3536" stroke-width="2.4" fill="none"/>':'<ellipse cx="41" cy="51" rx="2.4" ry="3" fill="#233136"/><ellipse cx="70" cy="51" rx="2.4" ry="3" fill="#233136"/>'}${glasses?'<g fill="none" stroke="#31464a" stroke-width="2"><rect x="31" y="45" width="20" height="15" rx="5"/><rect x="60" y="45" width="20" height="15" rx="5"/><path d="M51 49h9"/></g>':''}<path d="M54 53l-2 10h5" fill="none" stroke="#b7826d" stroke-width="1.3"/><path d="${mood==='happy'?'M45 71q10 9 20 0':mood==='think'?'M48 74l14 -2':'M47 73q8 4 16 0'}" fill="none" stroke="#7c5349" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="65" r="5" fill="#d48e7d" opacity=".22"/><circle cx="78" cy="65" r="5" fill="#d48e7d" opacity=".22"/><rect x="74" y="105" width="12" height="15" rx="3" fill="#f6e7b5"/><path d="M77 109h6M77 113h4" stroke="#7c8268"/></svg>`;}
function speaker(c,text,mood='neutral'){return `<div class="speaker">${portrait(c.who,mood)}<div><b>${esc(CAST[c.who].name)} · ${esc(CAST[c.who].role)}</b><p>${esc(text)}</p></div></div>`;}
function building(x,y,w,h,col,lit=false){let wins='';for(let yy=0;yy<3;yy++)for(let xx=0;xx<2;xx++)wins+=`<path d="M${8+xx*12} ${-12-yy*13}l7 -3.5v-6l-7 3.5Z" fill="${lit?'#f6d17b':'#6d9995'}" opacity="${lit?1:.45}"/>`;return `<g transform="translate(${x} ${y})"><path d="M${-w},${-w/2}L0,0 ${w},${-w/2} 0,${-w}Z" fill="#081f27" opacity=".35" transform="translate(8 8)"/><path d="M${-w},${-w/2}L0,0V${-h}L${-w},${-w/2-h}Z" fill="${col}"/><path d="M0,0L${w},${-w/2}V${-w/2-h}L0,${-h}Z" fill="#345e62"/><path d="M${-w},${-w/2-h}L0,${-w-h} ${w},${-w/2-h} 0,${-h}Z" fill="#a3c8b8"/>${wins}</g>`;}
function cityMap(){return `<svg class="scene-svg" viewBox="0 0 700 420" role="img" aria-label="선택의 거리, 공공의 광장, 교역 항구를 연결하는 창작 도시 지도"><rect width="700" height="420" fill="#123641"/><path d="M0 295Q150 230 280 280T700 290V420H0Z" fill="#265c65"/><g stroke="#75ada5" opacity=".28" fill="none" class="wave"><path d="M50 341q100 -30 210 0M320 352q140 -28 290 0M130 387q110 -27 240 0"/></g><path d="M60 195L337 40 640 204 361 365Z" fill="#5c8374"/><path d="M97 198L337 66 603 209 360 344Z" fill="#b0c0a1"/><path d="M134 214L362 85M211 270L437 125M132 133L509 336" stroke="#e4dfc2" stroke-width="24"/><path d="M134 214L362 85M211 270L437 125M132 133L509 336" stroke="#6a9182" stroke-width="2" stroke-dasharray="5 8"/>${building(231,163,35,65,'#bd9f6f',complete(CASES[0]))}${building(328,126,29,77,'#7fa999',true)}${building(414,188,36,69,'#adbac6',complete(CASES[1]))}${building(310,277,42,59,'#b2a183',true)}${building(467,258,34,46,'#889ea8',complete(CASES[2]))}<circle cx="234" cy="231" r="18" fill="#557f58"/><circle cx="258" cy="244" r="14" fill="#6b9968"/><path d="M355 333l110 -61 28 16 -110 63Z" fill="#d8c7a0"/><g class="boat-motion" transform="translate(526 345)"><path d="M-44 -4L22 -24 47 -8 -16 15Z" fill="#ecbd6b"/><path d="M-44 -4L-16 15 47 -8 39 6 -18 26 -38 10Z" fill="#e6e4c8"/><rect x="-7" y="-27" width="25" height="16" rx="3" fill="#779aa2"/></g><g fill="#e5f4d6" font-family="sans-serif" font-size="15" font-weight="700"><text x="123" y="103">01 · 선택의 거리</text><text x="413" y="99">02 · 공공의 광장</text><text x="478" y="308">03 · 교역 항구</text></g><g fill="#eaca7c" class="nodeglow"><circle cx="206" cy="194" r="5"/><circle cx="386" cy="213" r="5"/><circle cx="465" cy="295" r="5"/></g></svg>`;}
function choiceScene(selected=1,sacrifice=2,rows=DAY){const calc=costRows(rows);return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="선택한 대안과 포기한 대안을 나란히 보여 주는 장부"><rect x="22" y="31" width="586" height="246" rx="19" fill="#1c4750"/><path d="M56 92H580M56 216H580" stroke="#4e6c67" stroke-dasharray="4 6"/>${calc.map((d,i)=>{const x=60+i*184;return `<g opacity="${i===selected?1:.58}"><rect x="${x}" y="65" width="156" height="176" rx="13" fill="${i===selected?'#f5df9c':'#98bfae'}"/><text x="${x+18}" y="97" fill="#133d40" font-size="15" font-weight="700">${['A','B','C'][i]} · ${i===selected?'선택한 활동':'포기한 활동'}</text><text x="${x+18}" y="140" fill="#173b3d" font-size="12">편익 ${f(d.benefit)} − 비용 ${f(d.cost)}</text><text x="${x+18}" y="184" fill="#173b3d" font-size="35" font-weight="800">${f(d.g)}</text><text x="${x+18}" y="217" fill="#173b3d" font-size="12">${i===sacrifice?'최선의 포기 대안':'편익 − 명시적 비용'}</text></g>`;}).join('')}<text x="315" y="299" text-anchor="middle" fill="#d4e8d7" font-size="13">비교값은 순편익이 아닙니다.</text></svg>`;}
function publicScene(others=[6,6,6],paid=0,reveal=false){const out=publicCalc(others,paid),lit=reveal&&out.lit;let houses='';for(let i=0;i<4;i++){const x=54+i*143;houses+=`<g><path d="M${x-16} 173L${x+39} 134 ${x+94} 173Z" fill="${i===3?'#af9970':'#628d84'}"/><rect x="${x-4}" y="173" width="86" height="75" rx="4" fill="${i===3?'#8e8066':'#39676c'}"/><rect x="${x+10}" y="187" width="20" height="24" fill="${lit?'#f3d488':'#82a5a0'}"/><rect x="${x+49}" y="187" width="20" height="24" fill="${lit?'#f3d488':'#82a5a0'}"/><text x="${x+39}" y="272" text-anchor="middle" fill="#e8f2da" font-size="13">${i===3?'나':'주민 '+['A','B','C'][i]} · ${i===3?paid:others[i]}토큰</text></g>`;}return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="${lit?'모든 주민에게 빛이 닿는':'설치 여부를 확인하기 전의'} 가로등 골목"><rect width="630" height="310" rx="15" fill="#12333f"/><circle cx="544" cy="43" r="17" fill="#d8e8c6"/><g fill="#bcdccc" opacity=".65"><circle cx="51" cy="30" r="1.7"/><circle cx="140" cy="47" r="1.4"/><circle cx="421" cy="29" r="1.7"/></g><path d="M0 244H630V310H0Z" fill="#28505b"/>${houses}${lit?'<path class="lantern-glow" d="M309 75L17 279H608L326 75Z" fill="#f5ce75" opacity=".16"/>':''}<path d="M315 82V245M298 248h34" stroke="#b4c6b2" stroke-width="7" stroke-linecap="round"/><path d="M291 65h48l-5 18h-38Z" fill="${lit?'#f9d884':'#758f88'}"/><circle cx="315" cy="75" r="29" fill="#f7d782" opacity="${lit ? 0.22 : 0}"/><text x="315" y="26" text-anchor="middle" fill="#e8e8c9" font-size="14">${reveal?(lit?'설치됨 · 납부 여부와 관계없이 편익':'설치 실패 · 납부액 반환'):'조건을 고르고 결과를 먼저 예상하세요'}</text></svg>`;}
function tradeScene(y=4,reveal=false){const d={ax:24,ay:12,bx:8,by:8,q:6},t=tradeCalc(d,y);const crates=(x,color,count)=>Array.from({length:Math.min(8,count)},(_,i)=>`<rect x="${x+(i%4)*22}" y="${186-Math.floor(i/4)*24}" width="19" height="19" rx="3" fill="${color}"/>`).join('');return `<svg class="scene-svg" viewBox="0 0 630 310" role="img" aria-label="A국의 X재와 B국의 Y재를 교환하는 두 항구"><rect width="630" height="310" rx="16" fill="#143741"/><path d="M0 188H630V310H0Z" fill="#265966"/><path d="M19 223h170l-19 24H5ZM454 223h166l9 24H470Z" fill="#c9b890"/><path d="M42 154l64 -37 64 37v69H42Z" fill="#94b6a4"/><path d="M464 154l62 -37 62 37v69H464Z" fill="#a7b4c7"/>${crates(60,'#e7bf6a',8)}${crates(482,'#a3cbb8',8)}<g fill="#e6f5df" font-size="17" font-weight="750"><text x="106" y="50" text-anchor="middle">A국 · X 특화</text><text x="526" y="50" text-anchor="middle">B국 · Y 특화</text></g><g fill="#bcd9c9" font-size="13"><text x="106" y="76" text-anchor="middle">${reveal?'소비 X18 · Y'+f(y):'생산 X24 · Y0'}</text><text x="526" y="76" text-anchor="middle">${reveal?'소비 X6 · Y'+f(8-y):'생산 X0 · Y8'}</text></g><path d="M198 122H424l-12 -8m12 8l-12 8M425 161H202l12 -8m-12 8l12 8" fill="none" stroke="#e4cd8d" stroke-width="2.5"/><text x="315" y="111" fill="#f1d785" font-size="15" text-anchor="middle">X재 6개 →</text><text x="315" y="186" fill="#c9e7cf" font-size="15" text-anchor="middle">← Y재 ${f(y)}개</text><g class="${reveal?'boat-motion':''}" transform="translate(320 256)"><path d="M-61 -8H59L39 19H-41Z" fill="#e3b867"/><rect x="-30" y="-26" width="23" height="18" rx="3" fill="#9ec9b0"/><rect x="-3" y="-26" width="25" height="18" rx="3" fill="#ded6b4"/><path d="M30 -28v20" stroke="#cfddd2" stroke-width="3"/></g><text x="315" y="300" fill="#cbe3d3" font-size="12" text-anchor="middle">${reveal?'계약 후 총량 X24 · Y8 보존':'양국의 생산 기회비용을 먼저 비교하세요'}</text></svg>`;}
function ppfPicture(d,x,pred,reveal=false){const v=Number.isFinite(x)?Math.max(0,Math.min(d.xmax,x)):0,real=ppfMax(d.xmax,d.ymax,v),px=62+v/d.xmax*460,py=245-real/d.ymax*180;return `<svg class="scene-svg" viewBox="0 0 620 310" role="img" aria-label="X 최대 ${d.xmax}, Y 최대 ${d.ymax}의 직선 생산 가능 곡선"><rect width="620" height="310" rx="15" fill="#143742"/><path d="M62 40V245H553" stroke="#aacbbb" stroke-width="2" fill="none"/><path d="M62 65L522 245H62Z" fill="#245a5e"/><path d="M62 65L522 245" stroke="#8ad7b5" stroke-width="3"/><path d="M${px} 45V245" stroke="#e6bf71" stroke-dasharray="5 6"/><g fill="#d8ebce" font-size="14"><text x="38" y="30">Y재</text><text x="555" y="259">X재</text><text x="30" y="69">${d.ymax}</text><text x="507" y="269">${d.xmax}</text><text x="44" y="267">0</text><text x="${px}" y="286" text-anchor="middle">X ${f(v)}</text></g>${Number.isFinite(pred)&&pred>=0&&pred<=d.ymax?`<circle cx="${px}" cy="${245-pred/d.ymax*180}" r="7" fill="#edc66e"/>`:''}${reveal?`<circle cx="${px}" cy="${py}" r="5" fill="#a4edc9"/><text x="${Math.min(px+10,460)}" y="${py-12}" fill="#e5f7d9" font-size="15">Y ${f(real)}</text>`:''}<text x="300" y="27" fill="#c7e3d2" font-size="13" text-anchor="middle">금색 점: 내 예상 / 민트색 점: 계산 결과</text></svg>`;}
function picture(c,s=null,response=null,reveal=false){if(s&&!['ghost','threshold','countermodel','donation','allocation','ppf','trade'].includes(s.type))return cityMap();if(c==='public'){if(s?.type==='allocation'){const p=response?.counts||[0,0,0,0];return publicScene(p.slice(0,3),p[3],reveal);}return publicScene(s?.data?.others||[6,6,6],response?.donation??0,reveal);}if(c==='trade'){if(s?.type==='ppf')return ppfPicture(s.data,num(response?.value),num(response?.nums?.[0]),reveal);return tradeScene(s?.type==='trade'?num(response?.value)||0:4,reveal);}let rows=DAY;if(s?.type==='threshold')rows=[DAY[0],[DAY[1][0],36,Number.isFinite(num(response?.value))?num(response.value):10],DAY[2]];if(s?.type==='countermodel')rows=[DAY[0],DAY[1],[DAY[2][0],Number.isFinite(num(response?.value))?num(response.value):32,7]];if(s?.type==='threshold'||s?.type==='countermodel'){const cr=costRows(rows),bi=cr.findIndex(v=>v.g===Math.max(...cr.map(w=>w.g))),second=Math.max(...cr.filter((_,i)=>i!==bi).map(v=>v.g)),si=cr.findIndex((v,i)=>i!==bi&&v.g===second);return choiceScene(bi,si,rows);}return choiceScene(Number.isInteger(response?.chosen)?response.chosen:s?.type==='ghost'?-1:1,Number.isInteger(response?.sacrifice)?response.sacrifice:s?.type==='ghost'?-1:2,rows);}

function frame(){applySettings();const xp=totalXP();$('xp').innerHTML=`Lv.${Math.floor(xp/100)+1} · ${xp} XP<div class="bar"><i style="width:${xp%100}%"></i></div>`;const items=[['home','◈','사건 지도'],['library','▤','강의실'],['lab','⌁','실험실'],['review','↻','재의뢰'],['studio','✎','제작실']];$('nav').innerHTML=items.map(([v,g,t])=>`<button data-action="nav" data-view="${v}" ${route.view===v?'aria-current="page"':''}><b aria-hidden="true">${g}</b>${t}</button>`).join('');if(!storeOK)showWarning('브라우저 저장이 제한되어 기록을 임시로 보관합니다. 종료 전에 JSON 백업을 저장하세요.');}
function homeHTML(){const n=STAGES.filter(s=>s.kind==='task'&&s.type!=='write'&&solved(s.id)).length,read=LESSONS.filter(l=>state.read[l.id]).length;return `<section class="hero"><div class="hero-grid"><div><div class="eyebrow">ECONOMY ARCHITECT / FIRST PLAYABLE</div><h1>숫자는 맞는데,<br>결론은 왜 틀렸을까?</h1><p>선택하지 않은 하루, 불 꺼진 골목, 두 나라의 계약.<br>개념을 배우고 조건을 움직여, 도시의 두 번째 장부를 찾아보세요.</p><span class="tag">3개의 완결 사건</span><span class="tag">강의 12개</span><span class="tag">적용·제작 24개</span><div class="actions"><button class="gold" data-action="stage" data-id="${state.last||'CH-L1'}">${state.last?'이어서 조사하기':'첫 이야기 시작'}</button><button data-action="nav" data-view="library">개념부터 읽기</button></div></div><div class="visual"><div class="map-block">${cityMap()}<div class="map-buttons">${CASES.map(c=>`<button data-action="case" data-id="${c.id}">${c.n} · ${esc(c.district)}</button>`).join('')}</div></div></div></div></section><div class="statgrid"><div class="stat"><b>${n}/21</b><span>계산·개념 미션 해결</span></div><div class="stat"><b>${read}/12</b><span>강의 읽음 기록</span></div><div class="stat"><b>${CASES.filter(complete).length}/3</b><span>사건의 모든 활동 기록</span></div><div class="stat"><b>90분</b><span>세 사건의 설계 목표·실측 전</span></div></div><div class="row between section"><h2>오늘의 조사 구역</h2><span class="tiny muted">순서대로 학습 권장 · 모든 사건을 열 수 있습니다</span></div><div class="grid">${CASES.map(c=>`<article class="card casecard"><div class="caseart">${picture(c.id)}</div><div class="casecopy"><div class="row between"><span class="num">CASE ${c.n} · ${esc(c.district)}</span><span class="tag">${c.stageIds.filter(done).length}/12</span></div><h2>${esc(c.title)}</h2><p>${esc(c.hook)}</p><div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="progressdots">${c.stageIds.map(id=>`<i class="${done(id)?'done':''}"></i>`).join('')}</div><button class="primary" data-action="case" data-id="${c.id}">사건 열기</button></div></article>`).join('')}</div><section class="grid section">${CASES.map(c=>`<article class="badgecard"><div class="seal">${complete(c)?'◈':'◇'}</div><span class="tag">${complete(c)?'획득':'수집 목표'}</span><h3>${esc(c.badge)}</h3><p class="tiny muted">해당 사건의 12단계 기록을 마치면 획득합니다. 경제 지식의 완전한 숙달을 인증하는 지표는 아닙니다.</p></article>`).join('')}</section><section class="card section"><h2>이 파일에서 달라진 것</h2><p>선택하지 않은 대안이 장부 옆에 남고, 납부 조건에 따라 가로등이 켜지며, 교역 계약에 따라 두 항구의 재화가 이동합니다. 처음 배우는 사람을 위한 강의와 단계별 예제를 먼저 읽을 수 있습니다.</p><p class="notice">4.0의 첫 세 사건 실행판입니다. 경제 전 범위 30시간판 전체가 4.0 화면으로 전환된 것은 아닙니다. 기존 3.1의 15챕터·48강의·210미션은 별도 파일에 보존했습니다. 이 파일은 3.1 저장 데이터를 수정하지 않습니다.</p><a class="btn small" href="https://drive.google.com/file/d/1rG3rA33XvRvMi3cABhcdsfo_K1imKEBz/view" target="_blank" rel="noopener noreferrer">기존 3.1 파일 위치 · 온라인</a></section>`;}
function caseHTML(id){const c=CASES.find(c=>c.id===id)||CASES[0];return `<div class="narrow"><button class="small" data-action="home">← 사건 지도</button><article class="card section"><span class="eyebrow">CASE ${c.n} / ${esc(c.district)}</span><h1>${esc(c.title)}</h1><div class="play-scene">${picture(c.id)}</div>${speaker(c,c.hook)}<p class="smalltext muted">강의 4개 → 적용·계산 7개 → 설명 초안 1개. 읽음, 도움받은 해결, 독립 해결, 작성자 자기 점검을 구분해 기록합니다.</p><div class="actions"><button class="primary" data-action="stage" data-id="${c.stageIds.find(id=>!done(id))||c.stageIds[0]}">${complete(c)?'처음부터 다시 보기':'이어서 시작'}</button><button data-action="lab" data-id="${c.id}">자유 실험</button></div></article><section class="section stack">${c.stageIds.map((id,i)=>{const s=BYID[id];return `<button class="bookcard card" data-action="stage" data-id="${id}"><div class="row between"><span class="tag">${String(i+1).padStart(2,'0')} · ${s.kind==='lesson'?'개념 강의':s.type==='write'?'자기 설명':'게임 미션'}</span><span class="tiny">${done(id)?s.kind==='lesson'?'읽음':s.type==='write'?'초안 기록':state.records[id]?.solved?.assisted?'도움받아 해결':'독립 해결':'미완료'}</span></div><h3>${esc(s.title)}</h3></button>`;}).join('')}</section>${refsHTML(c.sources)}</div>`;}
function lessonHTML(l,standalone=false){const c=CASES.find(c=>c.id===l.c),idx=BYID[l.id].index;return `<article class="card"><span class="tag">텍스트 강의 · ${esc(l.id)}</span><h1>${esc(l.title)}</h1><p class="smalltext muted">${esc(l.lead)}</p>${speaker(c,l.lead)}<div class="tabs"><button data-action="depth" data-depth="basic" class="${lessonDepth==='basic'?'selected':''}">개념 이해</button><button data-action="depth" data-depth="worked" class="${lessonDepth==='worked'?'selected':''}">함께 푸는 예제</button><button data-action="depth" data-depth="teacher" class="${lessonDepth==='teacher'?'selected':''}">숏컷·집필 심화</button></div>${lessonDepth==='basic'?`<div class="lessonbody">${l.sections.map(([h,p])=>`<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('')}<button class="primary wide" data-action="depth" data-depth="worked">이해한 내용을 예제로 확인하기</button></div>`:lessonDepth==='worked'?`<section class="example"><span class="tag gold">자료의 개념으로 구성한 풀이 예제</span><p>${esc(l.example.p)}</p>${l.example.table?textTable(l.example.table[0],l.example.table.slice(1)):''}<ol>${l.example.steps.slice(0,lessonSteps).map(v=>`<li class="pulse">${esc(v)}</li>`).join('')}</ol>${lessonSteps<l.example.steps.length?`<div class="actions"><button class="primary" data-action="example-next">다음 풀이 단계 ${lessonSteps+1}/${l.example.steps.length}</button><button data-action="example-all">전체 풀이</button></div>`:`<div class="equation">${esc(l.example.result)}</div><button class="primary" data-action="depth" data-depth="teacher">숏컷의 조건 확인</button>`}</section>`:`<div class="lessonbody"><h3>빠른 판단·계산 요령</h3><div class="tip">${esc(l.tip.rule)}<small><b>적용 조건과 주의점</b><br>${esc(l.tip.limit)}</small></div><h3>원리를 설명하는 사람의 관점</h3><p>${esc(l.advanced)}</p><div class="notice">숏컷은 앞의 기본 풀이에서 도출한 보충 설명입니다. 특정 자료형의 방법을 모든 경제 문제에 적용하지 않습니다.</div></div>`}<div class="actions"><button class="primary" data-action="lesson-done" data-id="${l.id}">${standalone?'읽음으로 표시':'읽음 기록하고 다음 활동'}</button><button data-action="stage" data-id="${c.stageIds[Math.min(idx+1,c.stageIds.length-1)]}">읽음 표시 없이 활동으로</button></div><p class="tiny muted">읽음은 자기 표시입니다. 읽었다고 개념 숙련이나 정답을 자동 인정하지 않습니다.</p>${refsHTML(l.refs)}</article>`;}
function stageBar(s){const c=CASES.find(c=>c.id===s.c);return `<div class="stephead"><button class="small" data-action="case" data-id="${c.id}">← ${esc(c.title)}</button><span class="tiny muted">${s.index+1}/12 · ${s.kind==='lesson'?'설명 먼저':'적용과 발견'}</span></div><div class="steps" aria-label="사건의 단계">${c.stageIds.map((id,i)=>`<button data-action="stage" data-id="${id}" class="${id===s.id?'on':done(id)?'done':''}" aria-label="${i+1}단계 ${esc(BYID[id].title)}">${i+1}</button>`).join('')}</div>`;}
function opt(options,value,key='choice',multi=false){return options.map((o,i)=>`<button class="option ${multi?value.includes(i)?'selected':'':value===i?'selected':''}" data-action="option" data-key="${key}" data-index="${i}" aria-pressed="${multi?value.includes(i):value===i}"><span class="letter">${multi?'□':String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join('');}
function numInputs(labels){return labels.map((l,i)=>`<div class="field"><label for="n${i}">${esc(l)}</label><input id="n${i}" type="text" inputmode="text" autocomplete="off" maxlength="60" placeholder="수 또는 1/2" data-field="number" data-index="${i}" value="${esc(r.nums[i]||'')}"></div>`).join('')+`<p class="tiny muted">단위는 질문에 표시되어 있습니다. 숫자 칸에는 0.5, 1/2, -3처럼 입력하세요.</p>`;}
function rangeControl(d,label){const v=Number.isFinite(r.value)?r.value:(d.min||0);return `<div class="rangebox"><div class="rangetop"><b>${esc(label||d.label||'조건 조절')}</b><input aria-label="${esc(label||d.label||'설정값')} 숫자 입력" type="number" min="${d.min||0}" max="${d.max}" step="${d.step||1}" data-field="value" value="${v}"></div><input aria-label="${esc(label||d.label||'설정값')} 슬라이더" type="range" min="${d.min||0}" max="${d.max}" step="${d.step||1}" data-field="value" value="${v}"></div>`;}
function taskControls(s){const d=s.data;switch(s.type){case'choice':return opt(d.options,r.choice);case'multi':return `<p class="tiny muted">옳은 항목을 모두 선택하세요.</p>`+opt(d.options,r.selected,'selected',true);case'map':return d.rows.map((v,i)=>`<div class="field"><label for="m${i}">${esc(v)}</label><select id="m${i}" data-field="map" data-index="${i}"><option value="">개념 선택</option>${d.options.map((o,j)=>`<option value="${j}" ${r.map[i]===j?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('');case'ghost':return `<div class="rule"><b>창작 조건</b>세 활동 중 정확히 하나만 한다. 다른 대안·매몰 비용은 없다. 편익과 비용의 단위는 만 원이다.</div><h3>1. 가장 유리한 활동을 고른다</h3><div class="cardchoices">${d.rows.map((row,i)=>`<button class="activity ${r.chosen===i?'chosen':r.chosen!==null?'faded':''}" data-action="option" data-key="chosen" data-index="${i}"><span class="sig">${['▧','◈','♫'][i]}</span><b>${esc(row[0])}</b><small>편익 ${row[1]}</small><small>명시적 비용 ${row[2]}</small></button>`).join('')}</div><h3>2. 포기한 최선의 대안은?</h3><div class="cardchoices">${d.rows.map((row,i)=>`<button class="${r.sacrifice===i?'selected':''}" data-action="option" data-key="sacrifice" data-index="${i}">${['A','B','C'][i]}</button>`).join('')}</div><p class="ghostlabel">선택하지 않은 활동도 사라지지 않습니다. 그중 가장 큰 비교값이 비용에 연결됩니다.</p>`;case'numbers':return (d.table?textTable(d.table[0],d.table.slice(1)):'')+numInputs(d.labels);case'threshold':case'countermodel':return textTable(['대안','편익','명시적 비용'],DAY)+rangeControl(d)+`<div id="live-note" class="tiny muted"></div>`;case'donation':return textTable(['다른 주민 A','다른 주민 B','다른 주민 C'],[d.others])+`<div class="rule"><b>창작 4명 규칙</b>각 초기 토큰10, 설치비24, 설치 편익 각10. 실패 시 납부액 반환. 타인의 납부액은 위 값으로 고정.</div><h3>내가 낼 토큰</h3><div class="row">${d.choices.map(n=>`<button class="${r.donation===n?'selected':''}" data-action="option" data-key="donation" data-index="${n}">${n}토큰</button>`).join('')}</div>`+numInputs(['내 최종 결과 예상']);case'allocation':return `<div class="rule"><b>모두 충족할 제약</b>정확히 합계24 · 개인별 최대6. 다음 조절기는 검토를 위해 0~10까지 움직일 수 있습니다.</div>`+d.names.map((v,i)=>`<div class="rangebox"><div class="rangetop"><b>${v}</b><span class="counter"><button class="small" data-action="count" data-index="${i}" data-delta="-1" aria-label="${v} 납부 감소">−</button><strong data-count-label="${i}">${r.counts[i]}</strong><button class="small" data-action="count" data-index="${i}" data-delta="1" aria-label="${v} 납부 증가">＋</button></span></div><input type="range" min="0" max="10" step="1" aria-label="${v} 납부액" data-field="count" data-index="${i}" value="${r.counts[i]}"></div>`).join('')+`<p id="live-note" class="rule">납부 합계: ${r.counts.reduce((a,b)=>a+b,0)}</p>`;case'ppf':return `<div class="rule"><b>생산 조건</b>X 최대24 또는 Y 최대12. 직선 모형, 자원·기술 고정. X를 18개로 맞춥니다.</div>`+rangeControl({min:0,max:d.xmax,step:1},'A국의 X재 생산량')+numInputs(['그때 최대 Y재 수량']);case'trade':return textTable(['나라','최대 X','최대 Y'],[['A',d.ax,d.ay],['B',d.bx,d.by]])+`<div class="rule"><b>모형과 목표</b>같은 총노동량·직선 모형·거래 비용 없음. A는 X, B는 Y에 완전 특화. X6과 교환할 Y를 제안하고 양국의 추가 이익을 예측합니다.</div>`+rangeControl(d,'X6과 교환할 Y 수량')+numInputs(['A의 추가 이익(Y개)','B의 추가 이익(Y개)']);case'write':return `<p class="notice">초안 작성과 자기 점검만 기록합니다. 글자 수나 핵심어만으로 경제 설명의 정확성을 자동 인증하지 않습니다.</p><label for="draftText"><b>내 설명 초안</b></label><textarea id="draftText" data-field="text" maxlength="24000" placeholder="${esc(d.starter)}">${esc(r.text)}</textarea><h3>작성자 자기 점검</h3>${d.checks.map((v,i)=>`<label class="check"><input type="checkbox" data-field="check" data-index="${i}" ${r.checks[i]?'checked':''}><span>${esc(v)}</span></label>`).join('')}`;default:return '<p>지원하지 않는 형식입니다.</p>';}}
function solutionHTML(s,res=r){const d=s.data;switch(s.type){case'choice':return `<p><b>판단:</b> ${esc(d.options[s.answer])}</p>`;case'multi':return s.answer.map(i=>`<p>✓ ${esc(d.options[i])}</p>`).join('');case'map':return textTable(['자료','연결'],d.rows.map((x,i)=>[x,d.options[s.answer[i]]]));case'numbers':return textTable(['항목','값'],d.labels.map((v,i)=>[v,f(s.answer[i])]));case'ghost':return textTable(['대안','비교값','암묵적 비용','기회비용','순편익'],costRows(d.rows).map(x=>[x.name,x.g,x.implicit,x.oc,x.surplus]));case'threshold':return textTable(['B 비용','B 비교값','판단'],[[10,26,'B 유일'],[11,25,'B·C 동률'],[12,24,'C 유일']]);case'countermodel':return '<p>C 편익32.5 → C 비교값25.5. B 비교값26은 여전히 최대이며 순편익은0.5이다.</p>';case'donation':return textTable(['내 납부','합계','설치','내 결과'],d.choices.map(n=>{const z=publicCalc(d.others,n);return[n,z.total,z.lit?'성공':'실패·반환',z.value];}));case'allocation':return '<p>6+6+6+6=24. 개인별 상한6과 합계24를 모두 충족한다.</p>';case'ppf':return '<p>최대 Y=12×(1−18/24)=3개.</p>';case'trade':{const y=num(res?.value),z=tradeCalc(d,Number.isFinite(y)?y:4);return textTable(['항목','현재 제안 또는 예시'],[['X1당 받는Y',f(z.ratio)],['A의 X1 생산 기회비용(Y)',f(z.ca)],['B의 X1 생산 기회비용(Y)',f(z.cb)],['A의 추가 이익(Y)',f(z.gainA)],['B의 추가 이익(Y)',f(z.gainB)]])+`<p>수량 조건을 지키면서 3&lt;Y&lt;6이어야 한다. 예: Y4이면 A 이익1, B 이익2.</p>`;}case'write':return '<p>설명 초안은 다시 열어 수정할 수 있습니다. 원고의 근거 확인과 출간 교열은 별도입니다.</p>';default:return '';}}
function confidenceHTML(){return `<div class="confidence"><small>답을 확인하기 전에 확신도를 표시하세요.</small>${[['sure','확실함'],['unsure','애매함'],['guess','추측함']].map(([v,t])=>`<button class="${r.confidence===v?'selected':''}" data-action="confidence" data-value="${v}">${t}</button>`).join('')}</div>`;}
function stageHTML(id){const s=BYID[id],c=CASES.find(c=>c.id===s.c);if(s.kind==='lesson')return `<div class="narrow">${stageBar(s)}<div class="section">${lessonHTML(LBYID[id])}</div></div>`;const speaking=feedback?feedback.ok?'좋아. 이제 같은 원리를 다른 조건에도 적용해 보자.':'어느 조건을 놓쳤는지 장부를 다시 열어 보자.':s.type==='write'?'내가 이해한 것을 다른 사람에게 설명할 차례야.':s.prompt;return `<div class="narrow">${stageBar(s)}<article class="card section"><span class="tag">활동 ${s.index+1} / 12 · ${esc(s.id)}</span><h1>${esc(s.title)}</h1>${speaker(c,speaking,feedback?.ok?'happy':r.help?'think':'neutral')}<div id="scene" class="play-scene">${picture(c.id,s,r,!!feedback)}</div><p class="section">${esc(s.prompt)}</p>${taskControls(s)}${s.type!=='write'?confidenceHTML():''}<div class="actions"><button class="primary" data-action="submit">${s.type==='write'?'초안·자기 점검 기록':'예상과 근거 확인'}</button>${s.type!=='write'?'<button data-action="hint">힌트·풀이 도움</button>':''}<button data-action="related">관련 강의</button></div>${r.help?`<div class="tip"><b>먼저 볼 힌트</b><p>${esc(s.hint)}</p><details><summary>이 문제의 전체 풀이</summary><p>${esc(s.why)}</p>${solutionHTML(s)}</details><small>강의·풀이 도움은 기록됩니다. 다시 풀기는 같은 문항 재확인으로 분류하며 초회 독립 해결로 바꾸지 않습니다.</small></div>`:''}<div id="feedback" aria-live="polite">${feedback?`<section class="feedback ${feedback.ok?'':'wrong'}"><span class="earned">${s.type==='write'?'학습용 초안 기록':feedback.ok?feedback.newXP?'+20 XP':'해결 기록 갱신':'조건 다시 확인'}</span><h3>${s.type==='write'?'설명 재료를 남겼습니다.':feedback.ok?'두 번째 장부를 찾아냈습니다.':'한 가지 조건을 다시 살펴보세요.'}</h3><p class="reason">${esc(s.why)}</p>${solutionHTML(s)}<p class="tiny muted">${s.type==='write'?'서술 내용은 자동 채점하지 않았습니다.':r.assisted?'도움받아 풀기 기록':'독립 응답 기록'}</p><div class="actions"><button class="primary" data-action="next">다음 장면</button><button data-action="retry">다시 풀기</button><button data-action="to-notes">사건 기록을 메모에 추가</button></div></section>`:''}</div>${refsHTML(s.refs)}</article></div>`;}
// END PART 4A.


// PART 4B: 강의 도감·복습·제작실·자유 실험·설정.
function libraryHTML(){return `<div class="row between"><div><span class="eyebrow">CONCEPT STUDIO</span><h1>원리를 배우는 강의실</h1></div><span class="tag">12강 · 세 사건의 학습 범위</span></div><p class="muted">정의와 쉬운 설명, 한 단계씩 펼치는 풀이, 숏컷의 조건과 집필 관점을 나누어 읽습니다.</p>${CASES.map(c=>`<h2 class="section">${c.n}. ${esc(c.title)}</h2><div class="grid">${LESSONS.filter(l=>l.c===c.id).map(l=>`<button class="card bookcard" data-action="lesson" data-id="${l.id}"><span class="tag">${esc(l.id)} · ${state.read[l.id]?'읽음':'미확인'}</span><h3>${esc(l.title)}</h3><p class="smalltext muted">${esc(l.lead)}</p></button>`).join('')}</div>`).join('')}<div class="actions section"><button data-action="export-lessons">12강 원고 Markdown</button><button data-action="export-content">강의·미션 JSON</button></div>`;}
function reviewHTML(){const ts=STAGES.filter(s=>s.kind==='task'&&s.type!=='write'&&lastAttempt(s)&&(!grade(s,lastAttempt(s))||lastAttempt(s).assisted||lastAttempt(s).confidence!=='sure'));return `<h1>다시 도착한 의뢰</h1><p>최근 응답에서 틀렸거나, 확신하지 못했거나, 풀이 도움을 받은 활동을 모았습니다. 해결 기록은 보존하면서 다시 독립적으로 확인합니다.</p><div class="stack">${ts.length?ts.map(s=>`<button class="bookcard card" data-action="stage" data-id="${s.id}"><span class="tag">${esc(s.id)} · ${!grade(s,lastAttempt(s))?'최근 오답':lastAttempt(s).assisted?'도움받아 해결':'확신도 재확인'}</span><h3>${esc(s.title)}</h3><p class="smalltext muted">${esc(s.hint)}</p></button>`).join(''):'<div class="card empty">재의뢰가 없습니다. 아직 문제를 풀지 않은 경우에도 이 목록은 비어 있습니다.</div>'}</div><section class="card section"><h2>다른 조건은 자유 실험실에서</h2><p>같은 답을 반복해서 눌러 경험치를 쌓지는 않습니다. 먼저 도움 없이 다시 확인하고, 자유 실험에서 조건을 바꾸어 관계가 유지되는지 살펴보세요.</p><button data-action="nav" data-view="lab">실험실로</button></section>`;}
function studioHTML(){return `<span class="eyebrow">WRITER'S ROOM</span><h1>사건에서 강의로</h1><p>내가 고른 답과 그것을 바꾼 조건을 설명·문항·강의의 재료로 남깁니다. 메모와 작성자 자기 점검을 출간 검토 완료로 표시하지 않습니다.</p><div class="stack">${CASES.map(c=>`<article class="card"><div class="row between"><h2>${c.n}. ${esc(c.title)}</h2><button class="small" data-action="case" data-id="${c.id}">사건 보기</button></div><label for="note-${c.id}"><b>강의·집필 메모</b></label><textarea id="note-${c.id}" data-note="${c.id}" maxlength="30000" placeholder="정확한 정의 / 대표 예제 / 학생 오개념 / 반례 / 근거 쪽수 / 추가 검토">${esc(state.notes[c.id]||'')}</textarea><div class="actions"><button data-action="assemble" data-id="${c.id}">새 편집창에 강의안 뼈대 만들기</button><button data-action="write-stage" data-id="${c.id}">설명 초안 활동</button></div>${state.records[c.stageIds[c.stageIds.length-1]]?.solved?.text?`<details><summary>설명 활동에 저장한 초안</summary><div class="report">${esc(state.records[c.stageIds[c.stageIds.length-1]].solved.text)}</div></details>`:''}</article>`).join('')}</div><article class="card section"><h2>강의안 편집창</h2><p class="tiny muted">뼈대를 만들 때 기존 메모는 바꾸지 않습니다. 이 편집창은 임시 편집용이므로 완성한 내용은 따로 저장하세요.</p><textarea id="assembled" placeholder="위의 강의안 뼈대 버튼을 누르세요."></textarea><div class="actions"><button data-action="save-assembled">편집창 TXT 저장</button><button data-action="export-notes">전체 메모·설명 TXT</button><button data-action="backup">전체 기록 JSON 백업</button></div></article><h2 class="section">분석실의 동료</h2><div class="grid">${CAST.map((p,i)=>`<article class="card"><div class="row">${portrait(i,complete(CASES[Math.min(i,2)])?'happy':'neutral')}<div><h3>${esc(p.name)}</h3><span class="tiny muted">${esc(p.role)}</span></div></div><p class="smalltext">${esc(p.quote)}</p><span class="tag">창작 캐릭터 · ${i<3?'이번 사건 안내':'향후 사건 연결용'}</span></article>`).join('')}</div>`;}
function labHTML(){const c=CASES.find(x=>x.id===labCase)||CASES[0];return `<div class="row between"><div><span class="eyebrow">CONDITION LAB</span><h1>조건을 바꾸는 실험실</h1></div><span class="tag">자유 실험 · 정답 점수 없음</span></div><p class="muted">이곳은 계산 결과를 즉시 보여 줍니다. 먼저 사건에서 예측 연습을 한 뒤 다른 조건에서 원리가 어떻게 나타나는지 확인하세요.</p><div class="tabs">${CASES.map(c=>`<button data-action="lab" data-id="${c.id}" class="${labCase===c.id?'selected':''}">${esc(c.title)}</button>`).join('')}</div><div class="stagegrid"><div class="play-scene" id="lab-scene"></div><article class="card">${labCase==='choice'?`<h2>2등이 바뀌면 1등도 달라질까?</h2><p>A의 편익/비용은30/8, B는36/10. C의 비용7은 고정하고 편익을 바꿉니다.</p><label for="labv">C의 편익</label><input id="labv" type="range" min="28" max="38" step="0.5" data-lab="cBenefit" value="${lab.cBenefit}"><div class="field"><label for="labvn">C 편익 입력</label><input id="labvn" type="number" min="28" max="38" step="0.5" data-lab="cBenefit" value="${lab.cBenefit}"></div>`:labCase==='public'?`<h2>설치와 납부를 분리해서 보기</h2><p>창작 4명 규칙. 다른 세 주민의 납부액은 모두 같다고 가정합니다.</p><label for="other">다른 주민 한 명당 납부</label><input id="other" type="range" min="0" max="10" step="1" data-lab="otherEach" value="${Math.round(lab.others/3)}"><label for="paid">나의 납부</label><input id="paid" type="range" min="0" max="10" step="1" data-lab="paid" value="${lab.paid}">`:`<h2>생산에서 소비로</h2><p>A 최대(24,12), B 최대(8,8). A는X24, B는Y8에 완전 특화하고 X6을 교환합니다.</p><label for="offer">X6과 교환할 Y</label><input id="offer" type="range" min="0" max="8" step="0.5" data-lab="y" value="${lab.y}"><div class="field"><label for="offern">Y 수량 입력</label><input id="offern" type="number" min="0" max="8" step="0.5" data-lab="y" value="${lab.y}"></div>`}<div id="lab-result"></div><p class="notice">입력한 규칙으로 계산한 창작 모형입니다. 현실의 가치나 실제 사람의 행동을 예측하는 모형이 아닙니다.</p><button class="wide" data-action="lab-note">현재 실험을 집필 메모에 추가</button></article></div>${refsHTML(c.sources)}`;}
function labResultText(){if(labCase==='choice'){const rows=costRows([DAY[0],DAY[1],['C',lab.cBenefit,7]]);return 'C 편익='+lab.cBenefit+'\n'+rows.map(z=>`${z.name}: 비교값 ${f(z.g)}, 암묵적 비용 ${f(z.implicit)}, 기회비용 ${f(z.oc)}, 순편익 ${f(z.surplus)}`).join('\n');}if(labCase==='public'){const others=Array(3).fill(lab.others/3),x=publicCalc(others,lab.paid);return `타인 납부 ${others.join('·')}, 내 납부 ${lab.paid}\n합계 ${x.total} / 설치비24 / 설치 ${x.lit?'성공':'실패'}\n내 최종 결과 ${x.value}`;}const t=tradeCalc({ax:24,ay:12,bx:8,by:8,q:6},lab.y);return `계약 X6:Y${lab.y}, X1당 Y${f(t.ratio)}\nA 이익(Y) ${f(t.gainA)}, B 이익(Y) ${f(t.gainB)}\nA 소비(${t.A}), B 소비(${t.B})`;}
function paintLab(){if(!$('lab-scene'))return;if(labCase==='choice'){const rows=costRows([DAY[0],DAY[1],['C',lab.cBenefit,7]]),best=rows.findIndex(x=>x.g===Math.max(...rows.map(y=>y.g))),sac=rows.findIndex((x,i)=>i!==best&&x.g===Math.max(...rows.filter((_,j)=>j!==best).map(z=>z.g)));$('lab-scene').innerHTML=choiceScene(best,sac,[DAY[0],DAY[1],['C',lab.cBenefit,7]]);$('lab-result').innerHTML=textTable(['대안','비교값','암묵적 비용','기회비용','순편익'],rows.map(z=>[z.name,f(z.g),f(z.implicit),f(z.oc),f(z.surplus)]))+`<p class="tiny muted">그림은 최대 비교값의 대안 하나를 표시합니다. 같은 최대값이 있으면 표에서 동률을 함께 확인하세요.</p>`;}else if(labCase==='public'){$('lab-scene').innerHTML=publicScene(Array(3).fill(lab.others/3),lab.paid,true);$('lab-result').innerHTML=`<div class="equation">${esc(labResultText())}</div>`;}else{$('lab-scene').innerHTML=tradeScene(lab.y,true);$('lab-result').innerHTML=`<div class="equation">${esc(labResultText())}</div>`;}}
function settingsHTML(){return `<div class="narrow"><span class="eyebrow">BUILD ${esc(BUILD)}</span><h1>설정과 기록 관리</h1><section class="card"><h2>읽기·연출</h2><div class="row">${[16,17,19,21].map(n=>`<button class="${state.settings.size===n?'selected':''}" data-action="font" data-value="${n}">${n}px</button>`).join('')}</div><label class="check"><input type="checkbox" data-setting="reduced" ${state.settings.reduced?'checked':''}><span>움직임 줄이기</span></label><label class="check"><input type="checkbox" data-setting="sound" ${state.settings.sound?'checked':''}><span>정답 확인 효과음 · 기본 꺼짐</span></label><p class="tiny muted">색만으로 정답을 전달하지 않으며, 드래그 대신 버튼과 숫자 입력으로 진행할 수 있습니다.</p></section><section class="card section"><h2>학습 기록</h2><p>현재 브라우저에 저장합니다. 자동 기기 간 동기화는 없습니다. 저장 제한이나 브라우저 데이터 삭제에 대비해 중요한 초안은 별도로 백업하세요.</p><div class="actions"><button class="primary" data-action="backup">JSON 백업</button><button data-action="restore">4.0 백업 복원</button><button data-action="export-notes">메모 TXT</button></div><p class="notice">이 첫 실행판은 3.1 백업을 가져와 새 미션의 성취로 바꾸지 않습니다. 기존 HTML과 기록을 그대로 보존하세요. 3.1과 4.0은 저장 키가 다릅니다.</p></section><section class="card section"><h2>홈 화면 앱으로 배포하기</h2><p>아래 버튼은 이 브라우저에서 PWA ZIP을 만듭니다. 실행 HTML, 서비스 워커, manifest, PNG 아이콘, 안내문을 포함합니다. <b>개인 답안·메모·학습 기록은 배포 ZIP에 포함하지 않습니다.</b></p><div class="actions"><button class="primary" data-action="pwa-zip">PWA 배포 ZIP 만들기</button><button data-action="install">이 기기에 설치</button><button data-action="update">대기 중인 업데이트 적용</button></div><p class="notice">설치형 배포는 ZIP을 풀어 HTTPS 정적 호스팅에 올려야 합니다. 다운로드한 file:// HTML과 Drive 미리보기는 설치형 웹앱 서버가 아닙니다. 이 파일만으로 호스팅이나 앱스토어 등록이 완료되지 않습니다. 홈 화면 추가 지원과 안내는 브라우저마다 다릅니다.</p><p id="pwa-status" class="tiny muted">${location.protocol==='file:'?'현재: 로컬 HTML 실행. 학습은 가능하지만 PWA 등록은 하지 않습니다.':swRegistration?'서비스 워커 등록됨. 오프라인·업데이트는 실제 환경에서 확인하세요.':'현재: 서비스 워커 등록 여부 확인 전 또는 일반 HTML 실행.'}</p></section><section class="card section"><h2>자가검사와 제작 상태</h2><p>아래 검사는 현재 브라우저에서 수행합니다. 계산 기준값·응답 검증·데이터 구조·ZIP의 기본 CRC를 확인하지만, 학습 효과·그림 배치·기기별 조작까지 보장하지는 않습니다.</p><div class="actions"><button data-action="audit">자가검사 실행</button><button data-action="export-tests">검사 명세 JSON</button></div><div id="audit-output"></div><p class="notice">4.0.1은 원본 코드를 읽어 저장·기록·이동·화면 로직을 수정한 검토판입니다. 실행 환경 오류로 제작자의 브라우저 회귀 시험은 아직 수행하지 못했습니다. 자가검사 결과는 이 브라우저에서 직접 실행한 후에만 표시합니다. 90분은 세 사건의 학습 설계 목표이며 실제 플레이 시간 검증 전입니다. 30시간 경제 전 범위 4.0판, 72강, 네이티브 앱, 멀티플레이는 이 파일의 구현 범위가 아닙니다.</p></section><section class="card section"><h2>원고와 근거</h2><div class="actions"><button data-action="export-lessons">12강 원고 Markdown</button><button data-action="export-content">강의·미션 데이터 JSON</button></div><p>수능특강 본문의 용어·정의, 동아의 공공재 활동, 수능특강 해설 부록의 비교 우위 자료 유형을 확인했습니다. 원문과 다른 가정·수치·도출한 숏컷은 본문에 표시했습니다. 모든 첨부 자료의 전수 분석 완료를 뜻하지 않습니다.</p></section><details class="card section"><summary>이 파일의 학습 기록 초기화</summary><p>이 브라우저에 저장한 4.0 기록만 지웁니다. 먼저 JSON 백업을 저장하세요. Drive의 파일이나 기존 3.1 기록은 지우지 않습니다.</p><button data-action="reset">4.0 기록 초기화</button></details></div>`;}

function paintTask(){const s=currentStage();if(!s||s.kind!=='task')return;if($('scene'))$('scene').innerHTML=picture(s.c,s,r,!!feedback);if($('live-note'))$('live-note').textContent=s.type==='allocation'?'현재 합계 '+r.counts.reduce((a,b)=>a+b,0)+' / 목표24 · 개인별 상한6':'현재 조건을 바꾼 장부가 그림에 반영됩니다. 목표를 만족하는 최소값이나 반례를 찾으세요.';}

function answered(s){switch(s.type){case'choice':return Number.isInteger(r.choice);case'multi':return r.selected.length>0;case'map':return r.map.length===s.data.rows.length&&r.map.every(Number.isInteger);case'ghost':return Number.isInteger(r.chosen)&&Number.isInteger(r.sacrifice);case'numbers':return r.nums.length===s.data.labels.length&&r.nums.every(x=>Number.isFinite(num(x)));case'threshold':case'countermodel':return Number.isFinite(num(r.value));case'donation':return r.donation!==null&&Number.isFinite(num(r.nums[0]));case'allocation':return r.counts.some(x=>x>0);case'ppf':return Number.isFinite(num(r.value))&&Number.isFinite(num(r.nums[0]));case'trade':return Number.isFinite(num(r.value))&&r.nums.every(x=>Number.isFinite(num(x)));case'write':return grade(s,r);default:return false;}}
function submit(){const s=currentStage();if(!s||s.kind!=='task'||!r)return;if(!answered(s)){toast(s.type==='write'?'초안과 자기 점검을 모두 확인하세요.':'빈칸과 선택을 모두 확인하세요.');return;}if(s.type!=='write'&&!['sure','unsure','guess'].includes(r.confidence)){toast('확신도를 먼저 선택하세요.');return;}if(feedback){toast('이미 결과를 확인했습니다. 다시 풀기 또는 다음 장면을 선택하세요.');return;}const ok=grade(s,r),was=solved(s.id),response=cleanResponse(s,r),old=state.records[s.id]||{solved:null,history:[]};old.history.push({response,time:new Date().toISOString()});old.history=old.history.slice(-15);if(ok&&(!old.solved||old.solved.assisted&&!response.assisted||s.type==='write'))old.solved=response;state.records[s.id]=old;delete state.drafts[s.id];feedback={ok,newXP:ok&&!was&&s.type!=='write'};save();refresh();if(ok){tone();if(!was&&s.type!=='write')toast('+20 XP · 새로운 활동 해결');else if(s.type==='write')toast('설명 초안과 자기 점검을 기록했습니다.');}setTimeout(()=>$('feedback')?.scrollIntoView({block:'nearest'}),30);}

function download(data,name,type='text/plain;charset=utf-8'){const blob=data instanceof Blob?data:new Blob([data],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function lessonsMarkdown(){let out='# 경제 설계자 4.3 — 첫 세 사건 강의 원고\n\n12강. 교재의 개념은 재서술, 사례·예제·그림·문제는 창작. 90분은 목표이며 실측 전. 모든 첨부 전수 검토 완료가 아님.\n';for(const l of LESSONS){out+='\n## '+l.id+' '+l.title+'\n\n'+l.lead+'\n';for(const [h,p]of l.sections)out+='\n### '+h+'\n\n'+p+'\n';out+='\n### 풀이 예제\n\n'+l.example.p+'\n';if(l.example.table)out+='\n'+l.example.table.map(row=>row.join(' | ')).join('\n')+'\n';out+=l.example.steps.map((v,i)=>'\n'+(i+1)+'. '+v).join('')+'\n\n결론: '+l.example.result+'\n\n### 숏컷과 적용 조건\n\n'+l.tip.rule+'\n\n'+l.tip.limit+'\n\n### 집필·강의 심화\n\n'+l.advanced+'\n\n근거: '+l.refs.map(k=>REF[k].name+' '+REF[k].page+' / '+REF[k].what).join('; ')+'\n';}return out;}

function assemble(c){const ls=LESSONS.filter(l=>l.c===c.id),body=`${c.title} — 3분 강의안 초안\n\n1. 도입 사건\n${c.hook}\n\n2. 핵심 개념\n${ls.map(l=>l.title+'\n'+l.lead).join('\n\n')}\n\n3. 대표 예제\n${ls[1].example.p}\n${ls[1].example.steps.join('\n')}\n\n4. 오개념과 조건\n${ls.map(l=>l.tip.limit).join('\n')}\n\n5. 내 설명·메모\n${state.notes[c.id]||'(추가 작성)'}\n\n6. 확인 질문\n${BYID[c.stageIds[c.stageIds.length-1]].prompt}\n\n7. 근거\n${c.sources.map(k=>REF[k].name+' '+REF[k].page).join('\n')}\n\n검토 사항: 정의·단위·숏컷 조건·자료의 가정을 확인할 것.`;if($('assembled')&&$('assembled').value.trim()&&!confirm('현재 임시 편집창을 새 뼈대로 바꿀까요? 저장하지 않은 편집 내용은 사라집니다. 기존 사건 메모는 유지됩니다.'))return;$('assembled').value=body;$('assembled').scrollIntoView({block:'center'});}
function applyField(el){const s=currentStage();if(!s||s.kind!=='task'||!r)return;const key=el.dataset.field,i=Number(el.dataset.index);invalidate();if(key==='number'&&i>=0&&i<r.nums.length)r.nums[i]=el.value.slice(0,60);else if(key==='map'&&i>=0&&i<r.map.length)r.map[i]=el.value===''?null:Number(el.value);else if(key==='text')r.text=el.value.slice(0,24000);else if(key==='check'&&i>=0&&i<r.checks.length)r.checks[i]=el.checked;else if(key==='value'){r.value=el.value===''?null:Number(el.value);document.querySelectorAll('[data-field="value"]').forEach(x=>{if(x!==el&&Number.isFinite(r.value))x.value=r.value;});}else if(key==='count'&&i>=0&&i<4){r.counts[i]=Math.max(0,Math.min(10,Math.round(Number(el.value)||0)));document.querySelectorAll(`[data-count-label="${i}"]`).forEach(x=>x.textContent=r.counts[i]);}stash();paintTask();}
function applyLab(el){const key=el.dataset.lab,v=Number(el.value);if(el.value===''||!Number.isFinite(v))return;if(key==='cBenefit')lab.cBenefit=Math.max(28,Math.min(38,v));else if(key==='y')lab.y=Math.max(0,Math.min(8,v));else if(key==='otherEach')lab.others=Math.max(0,Math.min(10,Math.round(v)))*3;else if(key==='paid')lab.paid=Math.max(0,Math.min(10,Math.round(v)));document.querySelectorAll(`[data-lab="${key}"]`).forEach(x=>{if(x!==el)x.value=key==='otherEach'?lab.others/3:lab[key];});paintLab();}
async function handleAction(b){const ac=b.dataset.action,id=b.dataset.id,s=currentStage();switch(ac){case'home':go('home');break;case'nav':go(b.dataset.view);break;case'settings':go('settings');break;case'case':if(CASES.some(c=>c.id===id))go('case',id);break;case'stage':if(own(BYID,id))go('stage',id);break;case'lesson':if(own(LBYID,id))go('lesson',id);break;case'depth':lessonDepth=['basic','worked','teacher'].includes(b.dataset.depth)?b.dataset.depth:'basic';refresh();break;case'example-next':lessonSteps++;refresh();break;case'example-all':lessonSteps=100;refresh();break;case'lesson-done':if(own(LBYID,id)){state.read[id]=true;save();if(route.view==='stage')next();else{refresh();toast('읽음 기록을 남겼습니다.');}}break;case'option':if(r){invalidate();const k=b.dataset.key,v=Number(b.dataset.index);if(k==='selected'){if(r.selected.includes(v))r.selected=r.selected.filter(x=>x!==v);else r.selected.push(v);}else if(['choice','chosen','sacrifice','donation'].includes(k))r[k]=v;stash();refresh();}break;case'confidence':if(r){r.confidence=b.dataset.value;stash();refresh();}break;case'count':if(r){invalidate();const i=Number(b.dataset.index);r.counts[i]=Math.max(0,Math.min(10,r.counts[i]+Number(b.dataset.delta)));stash();refresh();}break;case'submit':submit();break;case'hint':if(r){r.help=true;r.assisted=true;stash();refresh();}break;case'related':if(s){if(r){r.assisted=true;stash();}const c=CASES.find(c=>c.id===s.c),nearLesson=c.stageIds.slice(0,s.index+1).map(k=>BYID[k]).filter(x=>x.kind==='lesson').pop();go('lesson',nearLesson.id);}break;case'next':next();break;case'retry':if(s){delete state.drafts[s.id];r=blank(s);feedback=null;save();refresh();}break;case'to-notes':if(s)appendNote(s.c,`[${s.id} ${s.title}]\n${s.prompt}\n\n해설: ${s.why}\n내 설명: `);break;case'lab':if(CASES.some(c=>c.id===id))labCase=id;go('lab');break;case'lab-note':appendNote(labCase,'[자유 실험·창작 조건]\n'+labResultText());break;case'assemble':assemble(CASES.find(c=>c.id===id));break;case'write-stage':{const c=CASES.fin
