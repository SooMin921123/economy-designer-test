cp41('비싸면 비합리적인가','윤리적 상품 구매로 만족감을 얻고 편익과 기회비용을 고려했다. 윤리적 소비라는 이유만으로 비합리적이라 할 수 있을까?',['항상 그렇다.','그렇지 않다. 윤리적이면서 합리적일 수 있다.','가격 정보만으로 언제나 결론이 정해진다.'],1,'천재 교사용 자료는 윤리적이면서 합리적인 소비가 가능하다고 설명한다.'),
cm41('정부의 대응 도구','문제와 대응을 연결하세요.',['정보의 비대칭성','공공재 부족','외부 경제','경제적 불평등'],['품질 보증·정보 표시','공공재 생산','보조금 등 촉진','소득 재분배'],[0,1,2,3],'정부 역할을 해결하려는 문제별로 구분한다.'),
ci41('녹색 표지 뒤의 자료','친환경 광고를 검토할 때 필요한 추가 자료를 찾으세요.',['광고에 녹색 잎 그림이 있다.','실제 생산 과정의 자원 사용·폐기물 자료를 확인할 수 있다.','품질·노동 조건에 대한 정보도 비교할 수 있다.'],['그림만 있으면 검토가 끝난다.','실제 과정과 관련 정보를 확인해야 한다.','상품 이름이 길수록 윤리적이다.'],1,'광고의 시각적 표현을 생산 과정·권리·환경의 근거로 대신하지 않는다.',[1,2]),
cu41('합의문에서 남길 조항','교재의 지속가능발전 방향과 부합하는 조항을 고르세요.',['노동자의 권리를 존중한다.','소비자 안전과 관련 정보를 고려한다.','미래 세대의 필요 충족 능력을 고려한다.','현재 이윤을 위해 사회적 영향은 무조건 제외한다.'],[0,1,2],'경제·사회·환경의 여러 측면을 함께 고려한다.'),
cp41('수능형 전환','소비자의 선택이 재화·서비스의 종류나 수량 결정에 중요한 권한을 갖는다는 개념은?',['소비자 주권','단체 교섭권','매몰 비용'],0,'소비자 주권은 생산의 문제에 대한 소비자의 영향과 연결된다.')
],[cp41('윤리적 소비의 판단','교재의 설명으로 옳은 것은?',['윤리적 소비는 무조건 비합리적이다.','윤리적 소비와 합리적 소비는 양립할 수 있다.','소비자의 만족감은 언제나0이다.'],1,'윤리적이면서 합리적인 소비가 가능하다는 설명이다.'),cm41('다시 모인 이사회','주체와 활동을 연결하세요.',['기술 혁신의 위험 감수','노동조합을 통한 협상','제품 선택으로 생산에 영향'],['기업가','노동자','소비자'],[0,1,2],'행위의 주체를 구분한다.')],cn41('새 소비 계획의 두 비교값','창작 신규 자료: A는 편익16·가격7, B는 윤리적 만족을 포함한 편익22·가격11이다. 하나만 선택하며 제시된 편익과 비용만 고려한다.',['A 비교값','B 비교값'],[9,11],'A9, B11이다. B가 비싸다는 이유만으로 불리하다고 판단하지 않는다. 그렇다고 윤리적 상품이면 언제나 정답이라는 뜻도 아니다.'));
COURSE41.tasks.find(t=>t.id==='C01-02').prompt='수능특강75쪽에 제시된 네 단계의 전개 방식에 맞춰 배열하세요. 독점 자본주의를 별도로 구분하는 교과서의 다섯 단계는 신규 조건 문제에서 따로 다룹니다.';
COURSE41.tasks.find(t=>t.id==='X01-1').prompt='비상 교과서62~63쪽처럼 독점 자본주의를 별도 단계로 다루는 전개 방식에 맞춰 다섯 기록을 배열하세요.';
function addLesson41(ch,no,title,goal,paragraphs,example,steps,result,tip,caution,check,refs){const x={id:'L'+String(ch).padStart(2,'0')+'-'+no,ch,no,title,goal,paragraphs,example,steps,result,tip,caution,check,refs,origin:'기존3.1의 동일ID 강의를 자료 대조 후 재편성. 예제·확인 질문은 학습용 창작'};COURSE41.lessons.push(x);COURSE41.chapters[ch-1].lessons.push(x.id);}
addLesson41(1,1,'자본주의는 단순히 돈을 좋아한다는 뜻이 아니다','소유·시장 가격·자유로운 경제활동을 연결한다.',[
'자본주의는 개인의 성격을 가리키는 말이 아니라 경제활동을 조직하는 체제이다. 수능특강은 생산 수단의 사적 소유를 인정하고 자유로운 경쟁과 교환을 통해 경제활동이 이루어지는 체제로 설명한다. 돈을 벌고 싶다는 말만으로 체제를 판단하지 말고, 생산 시설을 누가 소유하고 경제활동을 어떤 방식으로 결정하는지 살펴야 한다.',
'사유 재산권의 보장은 개인의 자유로운 재산 획득과 사용, 시장 기능의 활성화는 시장에서 결정한 가격에 따른 상품 거래, 경제활동의 자유는 경쟁을 통해 사적 이익을 추구할 수 있다는 특징과 연결된다. 세 특징을 서로 다른 단어로 암기하기보다 설비 소유자가 생산하고 소비자가 가격을 비교해 구매하는 하나의 장면으로 읽어 보자.',
'이 특징을 배우는 것과 시장이 언제나 모든 문제를 해결한다고 주장하는 것은 다르다. 자본주의의 역사적 전개에서는 시장과 정부가 어떤 역할을 해야 하는지가 달라진다. 뒤의 단계에서 정부가 등장하더라도 그 사실 하나로 자본주의가 사라졌다고 판단하지 않는다.'
],'창작 사례: 생산자가 개인 소유의 설비로 상품을 만들고, 소비자는 가격과 만족을 비교하여 구매한다.',[
'개인의 설비 소유를 사유 재산권과 연결한다.','시장 가격에 따라 구매하는 모습을 시장 기능과 연결한다.','각 경제 주체의 선택을 경제활동의 자유와 연결한다.'
],'소유권·가격·선택의 세 관계가 함께 나타난다.','누가 소유하는가 → 가격이 어떤 역할을 하는가 → 누가 선택하는가의 순서로 자료를 읽는다.','돈이나 이윤이라는 단어가 나왔다는 이유만으로 모든 경제 체제를 자본주의라고 판정하지 않는다.',{q:'수능특강이 제시한 자본주의의 특징은?',o:['생산 수단의 사적 소유 인정','모든 경제활동의 자유 부정'],a:0,why:'자본주의의 소유·시장·자유라는 특징을 확인한다.'},['E75','V64']);
addLesson41(1,2,'유통에서 생산으로, 그리고 거대 기업의 등장','상업·산업·독점 자본주의와 자료의 단계 구분을 이해한다.',[
'상업 자본주의에서는 상품을 유통하고 교역하는 과정의 이윤 추구가 두드러진다. 수능특강은 교역 확대와 절대 왕정의 중상주의를 배경으로 제시한다. 산업 자본주의에서는 산업 혁명과 기계를 활용한 대량 생산을 배경으로 생산 과정의 이윤 추구가 중요해진다. 두 경우 모두 이윤이 나오므로 이윤의 유무가 아니라 주요 과정과 배경을 구분해야 한다.',
'산업 시설을 소유한 자본가의 자유로운 활동이 강조되는 설명은 애덤 스미스와도 연결된다. 교재에서 보이지 않는 손은 효율적인 자원 배분을 가져오는 시장 가격의 기능에 대한 비유이다. 역사 자료에서는 이름만 외우기보다 어떤 정부 활동을 비판하고 어떤 자유를 강조했는지 함께 확인한다.',
'비상 교과서62~63쪽은 소수 거대 기업이 시장을 지배하는 독점 자본주의를 별도 단계로 제시한다. 수능특강75쪽의 표는 네 단계를 묶고 독과점의 등장을 수정 자본주의의 배경에서 설명한다. 어느 한 분류를 다른 자료에 강제로 덮어쓰지 않는다. 네 단계 배열과 다섯 단계 배열은 문제에서 지정한 자료에 맞춰 답한다.'
],'창작 전시 자료: A는 교역을 장려받은 상인의 유통 이윤, B는 기계 설비의 대량 생산, C는 소수 거대 기업의 시장 지배를 설명한다.',[
'A의 교역·유통·중상주의를 상업 자본주의와 연결한다.','B의 기계·대량 생산·산업 혁명을 산업 자본주의와 연결한다.','C는 비상 교과서에서 독점 자본주의라는 별도 단계와 연결된다.'
],'이윤이라는 공통어보다 생산 방식과 시장 구조를 확인한다.','상업: 유통·교역 / 산업: 기계·대량 생산 / 독점: 소수 거대 기업의 시장 지배라는 중심 단서를 잡는다.','중심 단서는 독해 도움말이다. 단어 하나만 보고 문맥을 읽지 않거나 네 단계와 다섯 단계의 출처 차이를 지우지 않는다.',{q:'비상 교과서가 산업 자본주의와 수정 자본주의 사이에서 별도로 다루는 단계는?',o:['독점 자본주의','금융 생활 설계'],a:0,why:'단계의 묶음 방식이 다름을 원문별로 구분한다.'},['E75','V62']);
addLesson41(1,3,'시장의 한계와 정부의 한계를 구분한다','배경·문제 진단·해결 방향을 세 칸으로 비교한다.',[
'수능특강은 대규모 독과점의 등장, 과잉 생산과 소비 부족, 기업 도산과 대량 실업을 대공황과 연결해 제시한다. 수정 자본주의에서는 정부가 적극적으로 시장에 개입해 시장의 한계를 보완하는 역할을 강조한다. 이 설명을 정부가 모든 생산을 직접 계획하는 체제와 동일시하지 않는다.',
'유효 수요는 실제로 구매할 의사와 능력을 갖춘 수요이다. 교재의 공공사업 사례는 일자리 창출, 임금 수입, 구매 능력의 형성을 연결한다. 물건을 원한다는 사실과 실제로 구매할 수 있는 능력을 구분하면 왜 정부가 공공사업을 추진한다는 설명이 나오는지 이해할 수 있다. 다만 임의의 승수나 실제 정책 효과를 이 강의에서 추가하지 않는다.',
'신자유주의는 정부 역할을 제한하고 시장 기능과 자유로운 경제활동을 강조한다. 교재는 석유 파동 이후 경기 침체와 물가 상승이 함께 나타난 스태그플레이션, 정부 대응의 한계 등을 그 배경으로 설명한다. 수정 자본주의와 신자유주의를 비교할 때는 정부의 등장 여부가 아니라 무엇을 문제로 보고 역할을 어떻게 바꾸려는지 읽는다.'
],'창작 주장: A는 수요 부족과 실업에 정부가 대응해야 한다고 말하고, B는 지나치게 커진 정부 역할을 줄이고 민간의 활동을 강화해야 한다고 말한다.',[
'A의 문제 진단은 시장의 한계이며 처방은 정부의 적극적 역할이다.','B의 문제 진단은 정부 역할의 한계이며 처방은 시장 기능의 강화이다.','A는 수정 자본주의, B는 신자유주의와 직접 연결한다.'
],'같은 정부라는 단어가 서로 다른 배경과 역할을 가리킬 수 있다.','배경 → 문제 진단 → 해결 방향을 한 줄씩 적어 비교한다.','교재의 전개 설명에 없는 실제 정책 효과나 사상가의 모든 견해를 이 핵심어로 단정하지 않는다.',{q:'대공황 이후 공공사업으로 유효 수요를 만들려는 방향은?',o:['수정 자본주의','중상주의의 교역 장려'],a:0,why:'정부가 등장한다는 공통점보다 대공황·수요 부족이라는 배경을 확인한다.'},['E75','V62']);
addLesson41(2,1,'무엇을 만들고, 어떻게 만들고, 어떻게 나눌까','경제 체제와 시장 가격의 결정 경로를 읽는다.',[
'경제 체제는 생산물의 종류와 수량, 생산 방법, 분배 방식 같은 기본적인 경제 문제를 해결하기 위해 합의한 제도나 방식이다. 종류·수량을 정하는 질문과 생산 방법을 정하는 질문, 생산 결과를 나누는 질문은 서로 다르다. 시장경제와 계획경제도 이 문제들을 서로 다른 방식으로 해결한다.',
'시장경제에서는 가계·기업 같은 민간 경제 주체가 이익을 추구하며 선택하고 시장 가격을 통해 자원이 배분된다. 비상 교과서는 소비자의 스마트폰 선호 변화와 생산자의 대응을 예로 들어 가격의 신호 역할을 설명한다. 가격은 자료의 숫자일 뿐 아니라 사람들이 무엇을 생산하고 소비할지 결정하는 정보로 읽힌다.',
'이 설명은 정부 명령으로 필요한 수량을 정하는 계획경제의 설명과 비교할 수 있다. 실제 자료에서는 소비자의 선호, 생산자의 예상 이익, 정부의 지시 등 결정 경로를 먼저 표시한다. 정부 건물이나 공무원이 등장한다는 이유만으로 모든 거래를 계획경제로 분류하지 않는다.'
],'창작 자료: 소비자들이 새로운 형태의 상품을 선호하자 생산자들이 시장의 판매 가능성과 가격을 보고 생산 계획을 조정한다.',[
'소비자 선호가 바뀌었다는 출발점을 찾는다.','생산자는 시장 가격과 얻을 수 있는 이익을 고려한다.','중앙의 생산 명령이 아니라 시장의 신호에 반응하는 선택이다.'
],'같은 생산 문제라도 의사 결정의 경로를 보고 체제를 구분한다.','가격·선호·민간의 선택과 계획·명령·배분 지시를 다른 경로로 표시한다.','자료에 나타난 한 요소를 근거로 다른 요소의 존재를 무조건 부정하지 않는다.',{q:'어떤 생산 기술을 사용할지 정하는 것은?',o:['어떻게 생산할 것인가의 문제','상품을 누구에게 분배할 것인가의 문제'],a:0,why:'생산 방법과 분배 방식은 서로 다른 기본 문제이다.'},['E76','V64']);
addLesson41(2,2,'시장경제와 계획경제의 비교 기준','결정 주체·장점·한계를 같은 항목으로 비교한다.',[
'수능특강은 시장경제가 자원 배분의 효율성을, 계획경제가 분배의 형평성을 상대적으로 중시한다고 설명한다. 시장경제에서는 자유로운 선택과 사유 재산권이 능력과 창의성 발휘에 유리하지만 빈부 격차나 급격한 경기 변동의 문제가 나타날 수 있다. 장점과 한계를 함께 읽어야 한다.',
'계획경제에서는 정부의 계획과 통제로 생산과 자원 배분을 결정한다. 교재는 불평등 완화와 주요 목적의 신속한 달성이라는 장점을 제시하면서, 경제적 유인 부족·창의성 발휘 저해·비효율·다양한 소비 욕구 반영의 어려움도 제시한다. 계획이 있다는 특징과 그 계획이 모든 정보를 반영할 수 있다는 주장은 다르다.',
'비교할 때 한쪽의 장점만 다른 쪽의 한계와 대비하지 않는다. 결정 주체, 배분 방식, 장점, 한계라는 같은 항목을 두 체제에 적용한다. 교재가 어떤 목표를 중시한다고 말한 것을 현실의 모든 상황에서 그 목표가 완벽히 달성된다는 보장으로 바꾸지 않는다.'
],'창작 안내서: A는 민간이 가격을 보고 생산을 결정한다. B는 정부가 필요한 수량을 계획해 생산 단위에 지시한다.',[
'A는 시장경제의 의사 결정 방식이다.','B는 계획경제의 의사 결정 방식이다.','각 체제의 장점과 한계를 같은 기준의 별도 칸에 적는다.'
],'결정 방식의 구분과 장점·한계의 평가는 서로 연결되지만 같은 질문은 아니다.','누가 결정 / 어떤 배분 / 어떤 장점 / 어떤 한계라는 네 칸으로 정리한다.','효율성 중시를 불평등 없음으로, 형평성 중시를 다양한 욕구의 완벽한 반영으로 바꾸지 않는다.',{q:'계획경제의 한계로 제시된 설명은?',o:['소비자의 다양한 욕구를 반영한 계획 수립의 어려움','정부의 계획이 존재하지 않음'],a:0,why:'계획이 중심이라는 특징과 모든 정보를 담기 어렵다는 한계를 구분한다.'},['E76','V64']);
addLesson41(2,3,'혼합 경제와 경제적 유인','시장과 정부의 병존, 보상의 변화와 선택을 연결한다.',[
'혼합 경제는 시장경제적 요소와 계획경제적 요소를 함께 활용한다. 수능특강은 추구하는 목표에 따라 혼합의 정도가 다르다고 설명한다. 민간이 시장에서 상품을 거래한다는 사실과 정부가 공공재를 공급한다는 사실은 함께 나타날 수 있다.',
'경제적 유인은 어떤 행동을 하거나 하지 않도록 동기를 주는 금전적 보상 또는 손실이다. 같은 대안이어도 보상이 늘거나 앞으로 내는 비용이 줄면 선택이 달라질 수 있다. 단순히 마음이 바뀌었다는 결론보다 어떤 조건이 바뀌었는지 찾아보자.',
'계산에서는 변하지 않은 대안의 값은 보존하고, 바뀐 대안의 편익−명시적 비용을 다시 계산한다. 다만 보상이 늘었다고 언제나 선택이 뒤집히지는 않는다. 바뀐 비교값이 기존 최선의 값보다 커지는지 확인해야 한다. 기회비용이나 순편익의 액수는 포기하는 대안을 포함해 별도로 계산한다.'
],'창작 조건: A 편익15·비용5, B16·8. 하나만 선택한다. 이후 B의 보상이4 늘어난다.',[
'처음 비교값은 A10, B8로 A가 더 크다.','B의 편익은20이 되고 비교값20−8=12이다.','변경 후 B12가 A10보다 커져 선택이 바뀐다.'
],'보상이라는 경제적 유인의 변화가 이 조건에서는 선택을 바꾼다.','바뀐 대안만 재계산 → 기존 최댓값과 비교 → 필요하면 비용 장부 전체를 완성한다.','보상 증가만으로 결과를 보장하지 않는다. 이 계산은 대안·평가 기준이 명시된 창작 모형이다.',{q:'시장 거래와 정부의 공공재 공급이 함께 나타나는 것은?',o:['항상 모순이다.','혼합 경제 설명에서 함께 나타날 수 있다.'],a:1,why:'두 요소의 병존과 결합을 설명하는 체제이다.'},['E76','E77']);
addLesson41(3,1,'지출한 돈과 포기한 가치를 따로 읽는다','편익·명시적 비용·암묵적 비용을 구분한다.',[
'희소성은 욕구에 비해 사용할 자원이 상대적으로 부족한 상태이다. 자원의 절대 수량만을 뜻하지 않는다. 같은 시간에 공연을 보거나 일을 할 수 있지만 동시에 모두 할 수 없다면 선택이 필요하다. 공연에서 얻는 만족은 편익이며, 표 값은 실제로 내는 명시적 비용이다.',
'암묵적 비용은 선택 때문에 포기한 최선의 다른 대안의 가치이다. 실제로 돈을 지출하지 않아도 포기한 기회가 있을 수 있다. 다른 대안을 실행할 때도 직접 지출할 비용이 있었다면 그 대안의 편익 전체가 아니라 편익에서 명시적 비용을 뺀 값을 비교한다.',
'이 학습실은 편익−명시적 비용을 비교값이라고 표시한다. 계산 중간에 사용하는 이름일 뿐 정식 용어인 순편익의 동의어가 아니다. 기회비용은 명시적 비용+암묵적 비용이고, 순편익은 편익−기회비용이다. 표의 각 칸이 무엇을 묻는지 먼저 확인한다.'
],'창작 예제: 공연 표 값3만 원. 대신 가능한 일은 보수8만 원, 교통비1만 원이다. 둘 중 하나만 선택한다.',[
'공연의 명시적 비용은3이다.','포기한 일의 비교값은8−1=7이다.','공연의 기회비용은3+7=10이다.'
],'명시적 비용3 / 암묵적 비용7 / 기회비용10만 원.','포기할 대안에도 지출이 있으면 그 대안의 편익에서 먼저 뺀다.','포기한 일을 하지 않으니 교통비도 내지 않는다. 보수8을 그대로 암묵적 비용으로 적지 않는다.',{q:'편익−명시적 비용을 계산하면 곧바로 순편익인가?',o:['항상 그렇다.','아니다. 순편익은 편익−기회비용이다.'],a:1,why:'암묵적 비용까지 반영한 값을 구분해야 한다.'},['E76','B48']);
addLesson41(3,2,'두 대안의 비용을 처음부터 끝까지 계산하기','자기 명시적 비용에 상대 대안의 비교값을 더한다.',[
'A와 B 중 하나만 선택한다. A를 고르면 B를 할 수 없으므로 A의 암묵적 비용은 B의 비교값이다. 반대로 B의 암묵적 비용은 A의 비교값이다. 자기 자신의 비교값을 자기 암묵적 비용으로 적는 실수를 피한다.',
'각 대안의 명시적 비용에 암묵적 비용을 더하면 기회비용이 된다. 자기 편익에서 그 기회비용을 빼면 순편익이다. 편익이 다르면 기회비용만 작다는 이유로 좋은 대안을 고를 수 없다. 비용이 더 커도 편익까지 고려한 순편익이 클 수 있다.',
'선택만 묻는 문제에서는 두 비교값을 먼저 비교할 수 있다. 이 모형에서 A의 순편익은 A 비교값−B 비교값, B의 순편익은 그 반대이기 때문이다. 그러나 기회비용의 금액을 묻는 문제에 중간값을 그대로 답하면 안 된다. 숏컷은 물어본 항목을 생략하는 허가가 아니다.'
],'창작 예제: A 편익25·비용7, B32·11. 다른 대안과 매몰 비용은 없다.',[
'비교값은 A18, B21이다.','A의 암묵적 비용21, 기회비용7+21=28이다.','B의 암묵적 비용18, 기회비용11+18=29이다.','순편익은 A25−28=−3, B32−29=3이다.'
],'B는 기회비용도 더 크지만 순편익이3으로 더 크므로 최선이다.','두 대안의 순편익이 서로 반대 부호인지 검산할 수 있다.','상호 배타적인 두 대안과 편익·비용이 모두 주어진 조건이다. 자료에 없는 대안을 추가하지 않는다.',{q:'이 예제에서 A의 순편익은?',o:['18','−3','28'],a:1,why:'18은 비교값,28은 기회비용,−3이 순편익이다.'},['E76','B48']);
addLesson41(3,3,'세 대안의 최댓값과 두 번째 값','1등은2등을 포기하고, 나머지는1등을 포기한다.',[
'A·B·C가 서로 동시에 선택할 수 없는 대안이라면 A를 고를 때 B와 C를 함께 하는 가치를 포기하는 것이 아니다. B와 C 중 최선의 하나를 했을 때 얻을 수 있던 가치를 포기한다. 따라서 두 비교값을 더하지 않고 최댓값을 찾는다.',
'각 대안의 비교값을 구한 뒤 큰 순서로 배열한다. 유일한 최선을 고를 때는 자신을 뺀 최댓값, 즉 전체2등을 포기한다. 다른 대안을 고를 때는 전체1등을 포기한다. 순편익은 자기 비교값과 자신을 제외한 최대 비교값의 차이로도 구한다.',
'새 대안이 등장하거나2등의 가치가 바뀌면 최선의 선택이 같아도 최선의 순편익은 달라질 수 있다. 상위 두 비교값의 간격을 읽어 보자. 동률은 별도의 수학적 경계 사례이며, 이 경우 어느 하나를 유일한 최선이라고 표시하지 않는다.'
],'창작 표: A40/12, B45/14, C39/10은 각각 편익/명시적 비용이다.',[
'비교값 A28·B31·C29. 1등B,2등C이다.','A와C는31을, B는29를 포기한다.','기회비용은 A43·B43·C41이다.','순편익은 A−3·B2·C−2이다.'
],'B의 순편익은1등31−2등29=2로도 구한다.','비교값 정렬 → 자기 제외 최댓값 → 자기 명시적 비용 더하기의 순서로 채운다.','모든 대안이 상호 배타적이라는 조건을 먼저 확인한다. 자기 자신을 포기 대안에 포함하지 않는다.',{q:'비교값 A20·B27·C23일 때 B의 암묵적 비용은?',o:['27','43','23'],a:2,why:'B를 제외한 최댓값 C23을 포기한다.'},['E76','B48']);
addLesson41(4,1,'이미 냈다는 말보다 회수할 수 없다는 조건','과거 지출과 현재 선택에 따라 달라지는 금액을 분리한다.',[
'매몰 비용은 이미 지출하여 회수할 수 없는 비용이다. 핵심은 이미 냈다는 사실만이 아니라 현재 어느 선택을 하더라도 돌려받을 수 없다는 조건이다. 계속하든 중단하든 회수 불가능하다면 그 돈을 이유로 반드시 계속해야 하는 것은 아니다.',
'과거의 지출을 장부에서 숨기라는 뜻이 아니다. 과거 지출과 지금부터 대안에 따라 달라지는 금액을 서로 다른 칸으로 옮긴다. 앞으로 새로 내야 하는 비용을 과거 비용과 함께 지워 버리면 현재의 비교 자체가 틀어진다.',
'수능특강은 매몰 비용을 기회비용에 포함하지 않는다고 설명한다. 이 원리에 따라 지금의 대안별 편익과 비용을 비교한다. 과거 개발비가 커졌다는 것만으로 미래의 편익이나 다른 선택의 가치가 바뀌었다고 추론하지 않는다.'
],'창작 사업: 회수 불가능한 과거 개발비40. 앞으로 A100/45, B95/35는 편익/비용이다.',[
'과거40은 두 대안 모두에서 회수할 수 없다.','앞으로의 비교값은 A55·B60이다.','B가 최선이다. 과거 비용만80으로 바꾸어도 현재의 비교값은 그대로다.'
],'선택의 근거는 앞으로의55와60이지 과거40의 크기가 아니다.','회수 불가·어떤 선택에서도 동일이라는 표현에 표시하고 미래 조건을 새 표로 옮긴다.','과거라는 이유만으로 모든 금액을 무시하지 않는다. 환불 가능 여부가 다르면 다른 문제이다.',{q:'앞으로 새로 발생할 비용은 무조건 매몰 비용인가?',o:['그렇다.','아니다. 현재 선택에 따라 달라지는 비용으로 검토한다.'],a:1,why:'이미 지출해 회수 불가능한 비용과 구분한다.'},['E76','B48']);
addLesson41(4,2,'비용 변화와 반환 계약이 선택을 바꾼다','변경 전후의 조건을 각각 다른 장부로 작성한다.',[
'같은 비용 증가라도 과거에 회수할 수 없게 확정된 지출인지 앞으로 내는 금액인지 구분한다. 앞으로의 편익이나 명시적 비용이 바뀌면 비교값을 다시 계산해야 한다. 선택이 언제나 그대로인 것도, 비용이 조금 변할 때마다 반드시 뒤집히는 것도 아니다.',
'반환금이 생기는 창작 문제에서는 특정 대안을 택할 때 앞으로 받는 돈이라는 조건을 명시한다. 그 대안의 계산에 반환금을 포함한다. 이전 문제는 회수 불가였는데 새 계약이 생겼다면 각각의 조건에 맞게 답하고 이전 문제의 답을 소급하여 틀렸다고 하지 않는다.',
'동률의 경계는 두 대안의 비교값을 같게 두어 구한다. 그러나 유일한 최선을 요구하면 같다는 것만으로 부족하다. 특히 정수 단위의 최소값을 묻는 경우 동률이 되는 값과 그다음 정수의 결과를 나누어 검산한다.'
],'창작 A100/45, B95/35. 이후 B비용만45가 된다. 그다음 B 선택 시8을 반환받는 새 계약이 생긴다.',[
'처음 A55·B60이므로 B이다.','비용 변경 뒤 A55·B50이므로 A이다.','새 반환 계약에서 B95+8−45=58이므로 다시 B이다.'
],'B→A→B로 바뀐 것은 서로 다른 조건 변경 때문이다.','변경된 항목만 먼저 계산하고 기존 최댓값과 비교한다. 경계에서는 같음과 엄격한 우열을 분리한다.','반환금을 이미 포함한 편익에 같은 반환금을 한 번 더 더하지 않는다.',{q:'A 비교값55, B 편익95일 때 동률이 되는 B비용은?',o:['40','55','150'],a:0,why:'95−40=55이다. 유일한 최선을 묻는 경우는 이 경계의 양쪽을 더 봐야 한다.'},['E76','B48']);
addLesson41(4,3,'가려진 표는 정의에서 역산한다','보이는 숫자를 무작정 더하지 않고 각 칸의 뜻을 먼저 정한다.',[
'표의 제목과 열 이름을 먼저 읽는다. 같은24라는 숫자도 편익인지 암묵적 비용인지에 따라 역할이 다르다. 기회비용은 명시적 비용+암묵적 비용이므로 두 칸을 알면 나머지 칸을 구할 수 있다. 이름이 가려졌다면 가능한 해석이 전체 표와 일치하는지 확인한다.',
'두 대안만 있다면 A의 암묵적 비용은 B의 편익−명시적 비용이다. B의 편익과 A의 암묵적 비용으로 B의 명시적 비용을 역산할 수 있다. 세 대안에서는 어느 대안이 최선의 포기 대안인지도 확인해야 하므로 임의의 한 대안과 곧바로 같게 놓지 않는다.',
'한 칸을 구한 뒤에는 그 값을 반대 방향의 정의에 넣어 검산한다. 자료가 부족하면 무엇이 더 필요한지 남긴다. 표에 없는 대안이나 회수 조건을 새로 만들어 값을 맞추는 것은 원래 문제를 푼 것이 아니다.'
],'창작 A·B 두 대안만 있다. A의 암묵적 비용24, B의 편익35, B의 기회비용31이다.',[
'A의 암묵적 비용=35−B의 명시적 비용=24이다.','B의 명시적 비용은11이다.','B의 암묵적 비용은31−11=20이다.','B가 포기하는 대안은 A이므로 A의 비교값은20이다.'
],'B 명시적 비용11 / A 비교값20. 두 방향의 정의가 일치한다.','기회비용−명시적 비용=암묵적 비용을 먼저 쓴다. 두 대안 조건에서는 상대 편익−내 암묵적 비용도 활용한다.','두 번째 계산은 상대가 최선의 포기 대안으로 확정된 경우에만 적용한다.',{q:'명시적 비용9, 기회비용26이면 암묵적 비용은?',o:['17','35','26'],a:0,why:'26−9=17이다.'},['E76','B48']);
addLesson41(5,1,'내게 유리한 선택이 사회에도 유리할까','시장 실패와 외부 효과의 판단 기준을 구분한다.',[
'수능특강은 시장이 자원을 효율적으로 배분하지 못하는 상태를 시장 실패라고 설명한다. 개인이 자신의 편익과 비용을 비교했다고 해서 사회 전체에서도 효율적인 결과가 자동으로 보장되는 것은 아니다. 어떤 기업의 매출이 줄었다거나 개인이 손해를 봤다는 사실만으로 시장 실패라고 부르는 것도 아니다.',
'외부 효과는 한 경제 주체의 생산·소비가 다른 경제 주체에게 의도하지 않은 이익이나 손해를 주지만 그에 대한 대가를 받거나 지불하지 않는 상태이다. 경제활동의 주체, 영향을 받는 다른 주체, 이익 또는 피해, 대가의 유무를 나누어 읽으면 어떤 계산이 빠졌는지 알 수 있다.',
'다른 주체에게 이익을 주고 대가를 받지 않는 경우는 외부 경제, 손해를 주고 대가를 지불하지 않는 경우는 외부 불경제이다. 상품을 사면서 가격을 지급하는 거래 자체와 거래 밖에서 대가 없이 영향을 받는 제3자의 상황을 구분한다. 손해라는 단어 하나만 보고 자연재해까지 외부 불경제로 분류하지 않는다.'
],'창작 사건: 공장이 상품을 생산하여 이익을 얻는다. 배출물 때문에 이웃이 피해를 보았지만 보상은 이루어지지 않았다.',[
'경제활동은 공장의 생산이다.','영향을 받은 다른 주체는 피해를 본 이웃이다.','피해에 대한 대가가 없으므로 부정적 외부 효과와 연결한다.'
],'공장 자신의 이익 장부만으로 다른 주체의 영향까지 판단할 수 없다.','경제활동 → 다른 주체의 이익·피해 → 대가 여부의 세 고리를 표시한다.','자료에 없는 피해나 보상을 임의로 추가하지 않는다. 이 강의의 사례는 창작이며 실제 사건의 법적 책임 판정이 아니다.',{q:'다른 주체에게 이익을 주고도 그 대가를 받지 못한 경제활동은?',o:['외부 경제','외부 불경제'],a:0,why:'이익과 피해를 먼저 구분한다.'},['E76','E77']);
addLesson41(5,2,'두 장부를 합치면 적정량이 달라진다','과다·과소의 비교 기준을 사회적 적정 수준으로 맞춘다.',[
'부정적 외부 효과에서는 활동 주체의 계산에 다른 주체의 피해가 반영되지 않아 사회적 최적 수준보다 과다하게 생산·소비되는 문제가 제시된다. 긍정적 외부 효과에서는 다른 주체에게 돌아가는 편익이 충분히 반영되지 않아 과소 생산·소비가 나타난다고 교재는 설명한다.',
'많거나 적다는 것은 작년 생산량과 비교한 말이 아니라 사회적으로 적정한 수준과 비교한 말이다. 생산량이 작년보다 늘었다는 사실만으로 외부 불경제라고 단정할 수 없다. 문제에서 어떤 수준을 기준으로 비교하는지 확인해야 한다.',
'게임은 이 관계를 보이기 위해 활동 주체의 이익과 제3자 피해 또는 편익을 같은 가상 금액으로 제시한다. 이익에서 피해를 빼거나 제3자 편익을 더하는 것은 공개한 창작 모형의 계산이다. 사회의 모든 권리와 가치를 실제로 같은 점수로 측정했다거나 이 숫자가 실제 정책의 최적값이라는 뜻이 아니다.'
],'창작 모형: 활동량1·2·3의 개인 이익30·48·54, 제3자 피해3·10·25. 다른 효과는 없다.',[
'개인 이익만 보면54가 가장 커서 활동량3이다.','피해 반영값은27·38·29이다.','이 모형의 두 장부 합산값은 활동량2에서 최대38이다.'
],'개인 선택량3과 피해를 포함한 비교의 최대량2가 다르다.','모든 행에 같은 계산 열을 만든 뒤 최댓값을 찾는다. 눈에 먼저 띈 가장 큰 편익을 바로 고르지 않는다.','제3자 편익을 피해처럼 빼지 않는다. 과다·과소의 기준을 시간 변화로 바꾸지 않는다.',{q:'긍정적 외부 효과 모형에서 개인 선택량2, 사회적 적정량4라면?',o:['적정량보다 과소 활동','적정량보다 과다 활동'],a:0,why:'2를4와 비교한다. 비교 기준은 적정량이다.'},['E77']);
addLesson41(5,3,'부담금과 보조금은 어떤 계산을 바꾸는가','방향을 판별하고 단위당 금액과 전체 금액을 구분한다.',[
'수능특강은 외부 불경제에 세금·부담금 등을 부과하여 활동을 억제하고, 외부 경제에는 세금 감면·보조금 등으로 활동을 촉진하는 방향을 제시한다. 먼저 외부 효과의 종류와 사회적 적정량에 비해 많은지 적은지를 판별한다. 정부가 등장한다는 이유로 모든 수단의 목적을 같게 보면 안 된다.',
'생산1단위당 부담금8이라면 생산량2에서는16을 낸다. 전체 지급액과 단위당 금액을 구분하지 않으면 정책 적용 후의 개인 이익이 틀린다. 보조금도 단위당인지 총액인지 확인하고 수량을 반영한다.',
'일부 보충 문제는 정부 수입·지출을 별도 장부로 포함한다. 세금이 정부로 이전되고 행정 비용 등 다른 효과가 없다고 명시했다면 생산자가 낸 세금을 사회 전체에서 사라진 금액처럼 또 빼지 않는다. 이 합산은 창작 조건에서만 사용하며 실제 세금 정책의 효과를 예측하는 공식으로 확대하지 않는다.'
],'창작 장부: 생산량2, 납부 전 이익50, 주민 피해12. 단위당 부담금8. 정부 수입을 별도 포함하고 다른 효과는 없다.',[
'총부담금2×8=16이다.','생산자 납부 후 이익50−16=34이다.','정부 수입16을 따로 적는다.','세 장부 합은34+16−12=38이다.'
],'정부로 이전된 금액을 이중으로 빼지 않는다. 생산량 선택의 변화는 별도 비교한다.','단위당 금액×수량을 먼저 계산하고 생산자·정부·제3자의 장부를 나누어 합친다.','기본 개념 문제에서 없는 정부 비용이나 피해 값을 만들어 넣지 않는다.',{q:'활동3단위에 단위당 보조금4가 지급되면 총액은?',o:['4','7','12'],a:2,why:'3×4=12이다.'},['E77']);
addLesson41(6,1,'공공재를 구별하는 두 질문','비배제성과 비경합성을 서로 다른 질문으로 읽는다.',[
'공공재는 비배제성과 비경합성을 가진 재화나 서비스이다. 두 용어가 낯설면 질문으로 풀어 보자. 돈을 내지 않은 사람을 이용에서 배제할 수 있는가? 한 사람이 소비하면 다른 사람이 소비할 기회가 줄어드는가? 서로 다른 두 기준이다.',
'비배제성은 대가를 내지 않은 사람을 소비에서 배제할 수 없다는 특성이다. 비경합성은 한 사람의 소비가 다른 사람의 소비 기회를 감소시키지 않는 특성이다. 교재는 국방·치안 서비스 등을 예로 든다. 공급자가 정부라는 사실만 보거나 무료라는 말 하나만 보고 정의를 대체하지 않는다.',
'수능특강은 비배제성 때문에 대가를 내지 않고 소비하려는 무임승차 경향을 설명하고, 공공재가 시장에서 충분히 공급되기 어려운 문제를 정부의 직접 공급 역할과 연결한다. 한 모금 게임이 성공했다고 이 개념을 부정하거나, 반대로 무임승차가 가능하니 어떤 조건에서도 반드시 실패한다고 일반화하지 않는다.'
],'창작 가로등 조건: 설치비를 내지 않은 주민도 빛을 이용하며 한 사람이 이용해도 다른 사람의 이용 기회는 줄지 않는다.',[
'미납부자의 이용을 막지 못한다는 조건은 비배제성이다.','타인의 소비 기회를 줄이지 않는 조건은 비경합성이다.','두 조건을 나눈 뒤 비용 부담과 공급의 문제로 연결한다.'
],'대가 지급과 소비 기회는 서로 다른 질문이다.','미납부자도 이용 → 비배제성 / 내가 이용해도 타인의 기회 유지 → 비경합성. 기억 후에는 정확한 정의를 확인한다.','자료가 주지 않은 혼잡·제한 조건을 임의로 넣어 다른 문제로 바꾸지 않는다.',{q:'한 사람이 소비해도 타인의 소비 기회가 감소하지 않는 특성은?',o:['비배제성','비경합성'],a:1,why:'대가 지급이 아니라 다른 사람의 소비 기회를 묻는다.'},['E77']);
addLesson41(6,2,'모금 게임은 성공 조건부터 계산한다','교과서 원문과 별도의 창작 모형을 구분한다.',[
'동아 교과서의 가로등 활동은20명의 주민과 타인의 납부액을 모르는 조건을 제시한다. 기존 대조 기록에서 확인한 원문 구조이다. 이번 정규 과정은 계산을 익히기 위해 네 주민, 공개된 타인의 납부액, 실패 시 반환이라는 별도의 창작 규칙을 사용한다.',
'각자10토큰을 가지고 설치비는24이다. 설치되면 납부 여부와 관계없이 각자10의 편익을 얻는다. 합계가24 이상이면 성공이고 개인 결과는10−내 납부+10이다. 실패하면 납부액이 반환되어 개인 결과는10이다. 토큰과 편익을 더하는 방식은 이 게임의 공개된 비교 지표이다.',
'타인만으로 이미 설치비가 모였다면 내가 내지 않아도 설치된다. 부족하다면 내 납부가 설치 여부를 바꿀 수 있다. 이 조건을 읽고 결과를 계산하는 것이 과제이다. 많이 냈다는 이유로 지식이나 도덕성 점수를 높이지 않으며, 제시된 타인의 선택을 실제 인간 행동에 관한 보편적 예측으로 바꾸지 않는다.'
],'창작 네 주민. 다른 세 주민은6씩 낸다. 내가6을 내는 경우와4를 내는 경우를 비교한다.',[
'타인의 합은18이다.','내가6을 내면24로 설치되고 내 결과10−6+10=14이다.','내가4를 내면22로 실패하므로 반환 후 내 결과10이다.'
],'설치 여부를 결정한 다음 성공식과 실패식을 각각 적용한다.','총납부액과 설치비 비교 → 설치 여부 → 남은 토큰과 편익의 순서로 계산한다.','실패한 경우에 설치 편익을 더하지 않는다.4인 게임과 원문의20인 활동을 같은 조건으로 취급하지 않는다.',{q:'타인만으로24가 모였고 내가0을 냈다면 개인 결과는?',o:['10','20','0'],a:1,why:'설치되므로 내 토큰10과 편익10을 합한20이다.'},['E77','D77']);
addLesson41(6,3,'경쟁 부족과 정보 부족은 다른 문제이다','공급자 수·합의·정보의 차이·제3자 영향을 구분한다.',[
'독점은 공급자가 하나, 과점은 소수인 상태이다. 교재는 독과점 기업이 생산량이나 가격을 임의로 조정하여 소비자가 피해를 볼 수 있다고 설명한다. 불공정한 경쟁이나 기업 간 합의를 다루는 자료에서는 공급자 수뿐 아니라 어떤 행위가 확인되었는지 살핀다.',
'정보의 비대칭성은 거래 당사자가 가진 거래에 필요한 정보의 양과 질이 서로 다른 상태이다. 중고 제품 상태를 판매자는 알고 구매자는 모른다면 경쟁 여부와 별도로 정보 차이를 봐야 한다. 품질 보증·성분 표시·원산지 표시 등은 정보를 확인하도록 하는 개선 방향이다.',
'공공재 부족, 경쟁 제한, 정보의 차이, 제3자 피해는 같은 원인이 아니다. 가로등 공급에는 공공재의 특성, 제품 검사에는 거래 정보, 가격 인상 합의에는 경쟁 제한이라는 근거가 필요하다. 가상 사건의 자료 판별과 현실 사건의 법적 판정도 구분한다.'
],'창작 자료: A는 가격 인상에 합의한 문서, B는 판매자만 아는 제품 상태, C는 미보상 생산 오염이다.',[
'A는 경쟁을 제한하는 합의의 직접 단서이다.','B는 거래 정보의 차이이다.','C는 제3자 피해와 대가 부재를 확인하는 외부 불경제 사례이다.'
],'원인을 구분해야 대응도 다르게 연결된다.','합의가 있는가 / 누가 어떤 정보를 아는가 / 다른 주체에게 대가 없이 어떤 영향이 있는가를 나누어 조사한다.','가격이 같다는 한 사실만으로 모든 업체의 합의를 확정하지 않는다.',{q:'제품 상태 정보를 판매자만 가지고 있다면 직접 관련된 개념은?',o:['정보의 비대칭성','비경합성'],a:0,why:'정보 차이와 공공재의 소비 특성은 서로 다른 기준이다.'},['E77']);
addLesson41(7,1,'정부의 역할은 문제별로 연결한다','개입이라는 공통어 뒤의 목적과 원인을 구분한다.',[
'정부 역할을 시장에 개입한다는 한 문장으로만 외우면 사례가 구분되지 않는다. 수능특강은 공정한 경쟁 촉진, 외부 효과 개선, 공공재 생산, 정보의 비대칭성 개선, 소득 재분배를 나누어 제시한다. 어떤 문제가 있고 무엇을 보완하려는지 함께 읽는다.',
'가격 담합 등을 규제하는 방향은 공정한 경쟁과, 외부 경제에 보조금을 지급하는 방향은 외부 효과 개선과 연결된다. 공공재 직접 생산과 제품 정보 표시는 각각 공급 부족과 정보 차이를 다룬다. 세금·보조금이라는 수단의 형식만으로 모든 목적이 동일하다고 판단하지 않는다.',
'소득 재분배는 경제적 불평등 악화의 예방이라는 목적과 연결된다. 교재가 제시한 누진세·사회 보장 등은 개념적 역할을 이해하는 예로 읽는다. 이 과정은 현재 세율이나 실제 제도 적용을 안내하지 않으며, 구체적 정책의 효과를 임의의 점수로 확정하지 않는다.'
],'창작 정책 설명: A는 성분 표시, B는 치안 공급, C는 불평등 완화를 목표로 한다.',[
'A는 거래 관련 정보를 확인하게 하므로 정보의 비대칭성 개선이다.','B는 공공재 공급과 연결된다.','C는 소득 재분배 목적과 연결된다.'
],'수단의 이름과 해결하려는 문제를 한 쌍으로 설명한다.','정책에서 무엇이 부족·왜곡되었는지 먼저 표시하고 교재의 역할 분류와 연결한다.','정부가 존재하므로 모든 문제가 완전히 해결된다고 확대하지 않는다.',{q:'품질 보증과 성분 표시는 어떤 문제 개선과 직접 연결되는가?',o:['정보의 비대칭성','모든 사람의 생애 주기 동일화'],a:0,why:'거래 정보의 확인을 돕는 장치이다.'},['E77']);
addLesson41(7,2,'기업가 정신·사회적 책임·노동자의 권리','혁신과 권리·책임을 각각의 기준으로 확인한다.',[
'기업가 정신은 이윤 추구 과정에서 위험과 불확실성을 감수하며 새로운 시장을 개척하고 도전하는 정신이다. 반드시 성공한다는 뜻이나 위험을 전혀 지지 않는다는 뜻은 아니다. 자료의 불확실성·도전·혁신이라는 조건을 함께 읽는다.',
'기업의 사회적 책임은 법규 준수, 노동자와 소비자의 권리 존중, 기업 활동이 사회에 미치는 영향의 고려와 연결된다. 이윤을 얻었다거나 혁신을 했다는 사실만으로 다른 책임도 자동으로 충족했다고 볼 수 없다. 각 기준에 맞는 근거가 있는지 확인한다.',
'수능특강은 노동자가 자신의 권리를 추구하고 생산에 참여하며 기업과 상호 동반자 의식을 가질 것을 설명한다. 노동3권은 단결권·단체 교섭권·단체 행동권이다. 노동조합 조직·가입, 사용자와의 협상, 협상 결렬 후 쟁의 행위라는 교재의 개념을 구분한다. 구체적 행위의 적법 요건을 판단하는 법률 안내는 아니다.'
],'창작 설명: 노동자들이 노동조합에 가입하고 그 조합이 사용자를 상대로 근로 조건을 협상한다.',[
'조직·가입은 단결권과 연결된다.','노동조합을 통한 사용자와의 협상은 단체 교섭권이다.','활동마다 직접 연결되는 권리의 이름을 구분한다.'
],'조직·가입과 협상은 같은 활동이 아니므로 같은 이름으로 뭉뚱그리지 않는다.','단결: 조직·가입 / 교섭: 협상 / 행동: 쟁의의 연결을 익힌 뒤 교재 정의를 확인한다.','기억법을 실제 분쟁의 절차와 법적 요건을 모두 설명하는 규칙으로 사용하지 않는다.',{q:'성공이 확정되지 않은 새 기술과 시장에 도전하는 특징은?',o:['기업가 정신','예금의 만기'],a:0,why:'불확실성을 감수한 혁신과 도전이 핵심이다.'},['E77']);
addLesson41(7,3,'비싼 상품을 골라도 합리적일 수 있다','소비자 주권·윤리적 소비·지속가능발전을 연결한다.',[
'소비자 주권은 재화와 서비스의 종류나 수량 등을 결정하는 데 소비자가 결정적인 권한을 가진다는 개념이다. 소비자는 생산된 물건을 받는 데서 그치는 것이 아니라 어떤 상품을 선택할지에 따라 생산에도 영향을 준다. 소비자의 합리적 선택과 생산자의 대응을 연결해 읽는다.',
'윤리적 소비는 보다 나은 사회 변화를 고려하여 윤리적 차원에서 접근하는 소비이다. 천재 교사용 자료는 윤리적이면서 합리적인 소비가 가능하다고 설명한다. 편익은 만족감을 포함하므로 윤리적 가치에서 얻는 만족을 무조건 빼고 가격만으로 비합리적이라고 판단해서는 안 된다.',
'지속가능발전은 미래 세대의 필요를 저해하지 않으면서 현세대의 필요를 충족하는 발전이다. 교재는 경제·사회·환경의 목표를 함께 제시한다. 윤리적이라는 광고가 있다고 모든 상품의 편익을 임의로 높게 정하는 것도 옳지 않다. 실제 문제에 제시된 편익과 생산 과정·노동·환경 자료의 범위를 확인한다.'
],'창작 선택: A 편익16·가격6, B는 윤리적 만족을 포함한 편익20·가격9. 하나만 선택하고 제시된 편익·비용만 고려한다.',[
'A의 비교값16−6=10이다.','B의 비교값20−9=11이다.','B가 더 비싸지만 제시된 편익까지 고려하면 B가 유리하다.'
],'윤리적 상품이라는 이름만으로 정답이 아니라 주어진 편익과 비용을 비교한 결과이다.','가격을 먼저 단정하지 말고 제시된 만족을 포함한 편익을 같은 기준으로 비교한다.','윤리적 소비=언제나 비합리적, 윤리적 소비=언제나 최선이라는 두 단정을 모두 피한다.',{q:'윤리적 소비와 합리적 소비는?',o:['항상 모순이다.','양립할 수 있다.'],a:1,why:'첨부 천재 교사용 자료는 윤리적이면서 합리적인 소비가 가능하다고 설명한다.'},['E77','C97']);

addLesson41(8,1,'금융은 돈의 보관과 이동을 연결한다','요구불 예금·정기 예금·정기 적금의 차이를 시간축으로 읽는다.',[
'금융 자산을 구분할 때에는 상품 이름보다 돈을 맡기는 방식과 회수하는 조건부터 살핀다. 예금은 이자 수익이나 자금 보관을 목적으로 금융 기관에 예치하는 자금 또는 금융 자산이다. 요구불 예금은 입금과 출금이 자유롭고, 저축성 예금은 정해진 기간 동안 자금을 예치하거나 적립한다. 자유로운 입출금과 정해진 기간이라는 조건은 서로 다른 사용 목적과 연결된다.',
'정기 예금은 처음 일정한 금액을 예치한 뒤 만기에 원금과 이자를 받는 방식이다. 정기 적금은 일정한 금액을 일정 기간 정기적으로 적립한 뒤 만기에 받는 방식이다. 모두 저축성 예금에 속하지만, 납입한 돈이 계좌 안에 머무는 기간은 다르다. 매달 넣은 적금의 원금 전체가 첫날부터 예치된 것으로 계산해서는 안 된다.',
'교재는 예금의 안전성과 유동성을 다른 금융 자산과 비교하여 설명한다. 그러나 구체적인 자금 사용 문제에서는 실제로 주어진 현금화 약정과 만기 조건을 먼저 확인한다. 특정 날짜에만 찾을 수 있다고 제시한 창작 상품을 이름만 보고 즉시 사용할 수 있다고 처리하지 않는다. 예금자 보호와 같은 제도 수치는 이 게임에서 현재의 금융 안내나 정답 생성 조건으로 사용하지 않는다.'
],'창작 납입표: A는 첫 달에600을 한 번 맡긴다. B는 여섯 달 동안 매월100씩 맡긴다. 두 경우의 납입 총액만 비교한다.',[
'A의 납입 총액은600이다.','B의 납입 총액도100×6=600이다.','총액은 같지만 각 돈이 예치되는 기간은 다르므로 이자까지 같다고 결론 내릴 수 없다.'
],'목돈 예치와 정기 적립은 납입 총액이 같아도 시간 구조가 다르다.','처음 한 번 / 일정 간격으로 반복 / 자유로운 입출금의 단서를 먼저 표시한다.','이자율·계산 방식·납입일이 없는 자료에서 이자 금액을 임의로 구하지 않는다.',{q:'일정한 금액을 정기적으로 적립하는 저축성 예금은?',o:['정기 예금','정기 적금','주식'],a:1,why:'목돈을 처음 맡기는 정기 예금과 납입 방식을 구분한다.'},['F88','F89']);
addLesson41(8,2,'주식은 지분, 채권은 차용 증서','발행자·발행의 영향·보유자의 지위를 함께 확인한다.',[
'채권은 필요한 자금을 빌리면서 원금과 이자의 지급을 약속하고 발행하는 차용 증서이다. 교재는 정부·지방 자치 단체·공공 기관·기업 등을 발행자로 제시한다. 보유자는 돈을 빌려준 채권자의 지위에 있다. 자금을 빌린 발행자에게는 부채가 증가한다는 방향으로 연결된다.',
'주식은 주식회사가 경영 자금을 확보하기 위해 투자자의 지분을 표시하여 발행하는 증서이다. 보유자는 주주이고 회사의 의사 결정에 관한 권리를 가질 수 있다. 교재의 비교표에서 주식 발행은 자본금의 증가, 채권 발행은 부채의 증가이다. 지분 취득과 돈을 빌려주는 관계를 같은 말로 쓰지 않는다.',
'발행의 영향과 이미 발행된 증서를 투자자끼리 매매하는 상황은 구분해야 한다. 교재의 표는 새로 자금을 조달하는 발행을 비교한다. 보유자의 이름만 바뀐 거래를 근거로 회사에 언제나 새 자금이 들어왔다고 판단하지 않는다. 채권의 지급 약속도 실제 모든 발행자의 지급 능력과 동일한 말이 아니므로 수익 형태와 안전성의 설명을 분리한다.'
],'창작 문서: A는 기업의 지분을 표시한다. B는 기업이 빌린 돈의 원금과 이자를 지급하기로 약속한 증서이다.',[
'A의 지분 표시는 주식이며 보유자는 주주이다.','B의 차입 약속은 채권이며 보유자는 채권자이다.','새 발행을 비교하면 A는 자본금, B는 부채의 증가와 연결한다.'
],'돈의 이동을 보유자와 발행자 양쪽에서 읽는다.','지분→주주→자본금 / 차용→채권자→부채를 연결한 뒤 발행인지 매매인지 확인한다.','주주에게 확정 이자를 약속했다는 문장과 배당을 기대할 수 있다는 문장을 혼동하지 않는다.',{q:'원금과 이자 지급을 약속한 차용 증서의 보유자는?',o:['주주','채권자'],a:1,why:'채권의 지위는 주식의 지분 소유와 다르다.'},['F88','F89']);
addLesson41(8,3,'이자·배당·시세 차익을 세 칸으로 나눈다','기대 가능한 수익과 계산된 손익을 구분한다.',[
'교재의 일반적인 비교에서는 예금과 채권은 이자 수익, 주식은 배당 수익을 기대한다. 채권과 주식은 매매를 통해 시세 차익도 기대할 수 있다. 배당은 회사가 얻은 수익의 일부를 지분에 따라 주주에게 나누어 주는 것이다. 주식의 배당을 채권의 이자라고 부르면 자산의 지위와 수익 형태를 함께 잘못 연결하게 된다.',
'시세 차익은 매수 가격보다 높은 가격에 팔아 얻은 이익이다. 가격이 낮아져 매도했다면 매매 손실이 생길 수 있다. 계산에서는 매매 손익과 배당·이자를 먼저 다른 칸에 적는다. 그다음 문제에서 요구하는 총손익에 포함할 항목을 합한다. 원리금, 매도 대금, 이익은 서로 다른 금액이다.',
'한 주의 가격과 보유한 전체 주식의 금액도 구별한다. 주당 배당2를 받았고3주를 보유했다면 배당 총액은6이다. 단위가 주당인지 전체인지 확인하고 수량을 곱한다. 이때 제시되지 않은 세금이나 수수료를 임의로 넣지 않되, 다른 비용이 없다는 가정을 명확히 남긴다.'
],'창작 주식2주를 주당50에 사서 주당56에 팔았다. 배당은 주당1, 다른 비용 없음.',[
'매수 대금50×2=100, 매도 대금56×2=112이다.','매매 차익112−100=12이다.','배당 총액1×2=2를 더하면 총이익14이다.'
],'매도 대금112와 총이익14를 혼동하지 않는다.','매매 차익=(매도가−매수가)×수량. 배당도 주당 금액이면 수량을 곱한다.','기대 가능한 수익의 표가 실제 배당 지급이나 미래 가격 상승을 보장하는 것은 아니다.',{q:'1주를80에 사서75에 팔고 배당2를 받으면 총손익은?',o:['−5','−3','2'],a:1,why:'매매−5와 배당+2를 합한다.'},['F88','F89']);
addLesson41(9,1,'안전성·수익성·유동성은 다른 질문이다','현금화할 수 있다는 말과 가치가 유지된다는 말을 분리한다.',[
'자산 관리는 안정적인 경제생활을 위해 자산의 취득·보유·처분을 합리적으로 선택하는 과정이다. 안전성은 투자한 자산의 가치가 안전하게 보호될 수 있는 정도, 수익성은 가치 상승이나 이자 수익 등을 기대할 수 있는 정도, 유동성은 자산을 현금으로 쉽게 바꿀 수 있는 정도이다. 세 기준은 서로 다른 성질을 묻는다.',
'쉽게 매도할 수 있지만 매도 가격이 크게 떨어질 수 있는 자산이라면 유동성이 높다는 설명만으로 안전성도 높다고 할 수 없다. 반대로 금액 변동이 작더라도 정해진 날까지 현금화할 수 없다는 약정이 있다면 임박한 지출에 쓰기 어려울 수 있다. 자료가 어떤 기준에 관한 정보를 주는지 먼저 분류한다.',
'교재는 일반적으로 수익성과 안전성 사이에 상충 관계가 있다고 설명한다. 높은 기대 수익에는 원금 손실 위험이 함께 있을 수 있다. 그러나 이 설명을 어느 자산이 언제 얼마의 손실이나 수익을 낼지 맞히는 공식으로 사용하지 않는다. 학습에서는 주어진 목적·기한·상품 조건으로 판단한다.'
],'창작 약정: A는 오늘 현금화할 수 있으나 금액 변동이 있다. B는 금액이 고정되지만 한 달 뒤에만 찾는다. 내일 돈이 필요하다.',[
'A의 오늘 현금화 조건은 유동성에 관한 정보이다.','B의 고정 금액과 회수 기한을 서로 다른 조건으로 표시한다.','내일 필요한 금액을 충족할 수 있는지는 현금화 시점과 실제 금액을 모두 보아야 한다.'
],'안전성과 유동성의 정보를 한 칸으로 합치지 않는다.','쉽게 현금화→유동성, 가치 보호→안전성, 기대 이익→수익성의 질문으로 바꿔 읽는다.','일반적인 상품 비교와 문제에 제시된 개별 약정을 구분한다.',{q:'자산을 빨리 매도할 수 있다는 설명의 직접 기준은?',o:['유동성','배당률','원금 보장'],a:0,why:'매도하기 쉬움과 손실 가능성은 별도이다.'},['F89','F90']);
addLesson41(9,2,'펀드·보험·연금은 목적과 방식으로 읽는다','운용 주체의 전문성과 손실의 가능성을 동시에 확인한다.',[
'펀드는 전문 기관이 투자자들에게서 모은 자금을 운용하고 결과에 따라 수익을 돌려주는 간접 투자 상품이다. 전문가가 대신 운용한다는 장점과 원금 손실 위험이 있다는 설명은 함께 성립한다. 전문가라는 말만으로 손실 위험이 사라진다고 바꾸지 않는다.',
'보험은 미래 위험에 대비하여 평소 보험료를 내고 사고가 발생하면 보험금을 받는 금융 상품이다. 교재는 수익 극대화보다 사고에 따른 손실 최소화를 목적으로 설명한다. 보험료와 보험금은 내는 시점과 지급 조건이 다르다. 보험을 단순히 수익률이 높은 저축과 같은 방식으로만 평가하지 않는다.',
'연금은 노후 생활의 안정을 위해 일정액을 적립하고 노령이나 은퇴 시 약속한 금액을 받는 금융 상품 또는 제도이다. 교재는 공적 연금·퇴직 연금·개인 연금을 구분한다. 이 과정에서는 목적과 적립·지급 구조를 배우며, 구체적인 가입 요건이나 현재 제도의 금액을 안내하지 않는다.'
],'창작 설명: A는 전문가에게 모은 자금의 운용을 맡긴다. B는 사고 손실에 대비한다. C는 은퇴 이후 생활 안정을 준비한다.',[
'A는 펀드의 운용 방식과 연결한다.','B는 보험의 목적을 설명한다.','C는 연금의 목적과 연결한다.'
],'상품의 이름을 지워도 목적과 운용·지급 구조를 보고 판별한다.','운용을 맡김 / 사고 대비 / 노후 지급을 먼저 분리하고 교재의 정의에 연결한다.','보험이나 연금이라는 이유만으로 모든 조건의 안전성·수익성을 동일하다고 가정하지 않는다.',{q:'교재의 펀드 설명으로 옳은 것은?',o:['전문가가 운용하므로 손실 불가능','전문가가 운용해도 원금 손실 위험 있음'],a:1,why:'장점과 위험을 함께 읽는다.'},['F89']);
addLesson41(9,3,'분산 투자를 계산할 때 투자 금액을 반영한다','포트폴리오의 구성 원칙과 가중 계산을 연결한다.',[
'교재는 안전성과 수익성의 상충 관계를 고려하여 여러 금융 자산에 적절히 배분하는 분산 투자를 설명한다. 포트폴리오는 보유한 금융 자산의 목록이다. 투자 목적과 기간, 금융 자산의 특성, 자산 관리 원칙에 따라 구성해야 한다는 것이 핵심이지 모든 사람에게 같은 비율을 제시한다는 뜻이 아니다.',
'창작 수치 문제에서는 자산별 투자 금액에 해당 상황의 수익률을 적용한 뒤 합산한다. 같은 금액을 넣었을 때만 단순 평균이 전체 수익률과 일치한다. 금액이 다르면 큰 금액을 넣은 자산의 변화가 전체 결과에 더 크게 반영된다. 먼저 최종 금액을 각각 구하는 기본 풀이가 가장 안전하다.',
'여러 자산을 보유했다는 사실만으로 모든 손실이 없어지는 것은 아니다. 문제에서 제시한 서로 다른 상황의 최종 금액을 비교하여, 분산이라는 구성과 실제 결과를 구분한다. 상황의 확률이나 미래 전망이 없는데 기대 수익을 새로 계산하지 않는다.'
],'창작 A80·B20에 투자. 제시된 한 상황에서 A+10%,B−20%, 다른 비용 없음.',[
'A 최종액80×1.1=88이다.','B 최종액20×0.8=16이다.','총액104, 원금100 대비 손익4이다.'
],'단순 평균−5%가 아니라 투자액을 반영한 전체 결과+4이다.','전체 최종액=각 원금×각 변화 배율의 합. 수익률이 필요하면 총손익을 전체 원금으로 나눈다.','서로 다른 투자 비중의 수익률을 그냥 더하거나 평균하지 않는다. 수치는 전망이 아닌 창작 상황이다.',{q:'분산 투자에 관한 설명으로 적절한 것은?',o:['손실이 완전히 사라진다.','목적·기간·위험을 고려하되 손실 가능성은 별도이다.'],a:1,why:'분산을 원금 보장으로 확대하지 않는다.'},['F89','F90']);
addLesson41(10,1,'생애 목표와 월별 잔액을 함께 본다','총수입과 기한 전에 사용할 수 있는 돈을 구분한다.',[
'금융 생활 설계는 생애 주기별 과업을 고려해 재무 목표를 정하고 그 목표를 달성하도록 자산을 관리하는 것이다. 교재는 재무 목표 설정, 재무 상태 분석, 계획 수립, 실행, 평가 및 수정의 순서를 제시한다. 목표와 현재 상태가 바뀌면 계획을 다시 검토하는 절차도 포함된다.',
'재무 상태 분석에서는 자산과 부채, 수입과 지출, 이용할 수 있는 자원을 확인한다. 총수입이 충분하다는 말과 특정 기한에 돈을 쓸 수 있다는 말은 다르다. 늦게 들어올 돈으로 이미 지난 지출을 충당할 수는 없으므로 금액 옆에 시점을 적는다. 대출·이월·지출 연기 가능 여부도 문제의 조건이다.',
'생애 주기별 수입·지출 곡선은 학습을 위한 도식이다. 모든 개인의 실제 수입 곡선이 같다고 단정하지 않는다. 수입과 지출의 크기를 읽는 활동에서 개인의 목표·상태를 검토하는 활동으로 이어져야 한다. 특정 연령의 자산 규모를 게임이 임의로 정상·비정상으로 평가하지 않는다.'
],'창작6개월,매월 말200지출. 수입1200은6개월째 월초,이월 가능·대출과 연기 불가.',[
'첫 다섯 달의 지출은 수입보다 먼저 발생한다.','먼저 필요한 금액은200×5=1000이다.','초기1000이면6개월째 월초 수입으로 마지막 지출을 충족한다.'
],'전체 수입1200만 보지 않고 최대 부족 구간을 확인한다.','기본 풀이: 각 시점 누적수입−누적지출. 최소 초기자금은 그 누적값의 최대 부족액이다.','이 요령은 대출·지출 연기가 없고 문제의 시간 순서가 확정된 창작 현금흐름에 적용한다.',{q:'재무 상태를 분석할 때 포함하는 것은?',o:['자산·부채·수입·지출','목표 금액만'],a:0,why:'목표와 현재 자원 상태를 각각 확인한다.'},['F90']);
addLesson41(10,2,'단리는 원금, 복리는 원금과 쌓인 이자','이자 계산의 대상과 원리금을 분리한다.',[
'이자 계산에서 처음 맡긴 돈은 원금이고 원금과 이자를 합한 금액은 원리금이다. 단리는 기간마다 원금에 대해서만 이자를 계산한다. 원금과 이자율이 고정되어 있다면 기간별 이자는 일정하다. 이자가 얼마인지 묻는지, 원리금이 얼마인지 묻는지 먼저 확인해야 한다.',
'복리는 이전에 발생한 이자를 원금과 합쳐 다음 기간의 이자를 계산한다. 첫 기간에는 단리와 같아도 다음 기간부터 이자가 붙는 대상이 달라진다. 연복리라면 해마다 계산한 뒤 다음 해의 기준 금액으로 넘긴다. 연이율을 주었다고 월마다 같은 연이율을 곱하면 안 된다.',
'일정한 원금P, 기간별 이자율r, 기간 수n이라는 창작 모형에서 단리 원리금은 P(1+rn), 복리 원리금은 P(1+r)의 n제곱으로 쓸 수 있다. 이 식은 교재의 계산 방식에서 도출한 요령이다. 입출금·이자율 변화·세금이 있다면 각각의 시점과 조건을 따로 반영해야 한다.'
],'창작 원금100,연10%,2년,연말계산,입출금·세금·수수료 없음.',[
'단리는 매년100×0.1=10. 원리금100+10+10=120이다.','복리는1년 말110,2년 말110×1.1=121이다.','이자만 묻는다면 각각20과21이다.'
],'원리금120·121과 이자20·21은 다른 답이다.','먼저1기간을 계산하고 다음 기간의 기준 금액이 원금인지 원리금인지 확인한다.','복리 식의 기간과 이율의 기간 단위를 일치시킨다.',{q:'원금100,연10%복리,2년의 이자만 구하면?',o:['121','21','120'],a:1,why:'원리금121에서 원금100을 뺀다.'},['F91']);
addLesson41(10,3,'같은 날 찾더라도 돈마다 나이가 다르다','납입금마다 이자가 붙는 기간을 따로 센다.',[
'여러 번 납입한 돈을 같은 만기일에 찾더라도 각 납입금이 예치된 기간은 다르다. 첫해 초의 돈과 둘째 해 초의 돈을 모두 첫해부터 맡겼다고 계산하면 나중 납입금에 존재하지 않은 기간의 이자를 붙이게 된다. 합계 원금을 먼저 만드는 것보다 각 돈의 출발점을 표시하는 것이 먼저이다.',
'달력에서 납입일과 만기일 사이의 온전한 계산 기간을 센다. 연복리·매년 말 계산이라는 조건이라면 첫해 초부터 둘째 해 말까지는2년, 둘째 해 초부터 그해 말까지는1년이다. 각각의 원리금을 구한 뒤 합산한다. 실제 상품의 일수 계산법이 아니라 문제에 명시된 기간 계산을 사용하는 보충 모형이다.',
'월초와 월말도 구분한다. 월말 납입인데 그 달 한 달의 이자가 이미 붙었다고 가정해서는 안 된다. 어떤 시점에 입금하고 언제 이자를 계산하는지 문제에서 밝히지 않았다면, 필요한 조건을 추가 확인해야 한다. 이 게임은 각 예제의 납입·이자 계산 시점을 발문에 명시한다.'
],'창작 연10%복리. 첫해 초100과 둘째 해 초100을 넣고 둘째 해 말에 찾는다. 다른 거래와 비용은 없다.',[
'첫100은2년:100×1.1²=121이다.','둘째100은1년:100×1.1=110이다.','만기 총액은121+110=231이다.','총원금200의 이자는31이다.'
],'200 전체에2년 복리를 적용한242는 납입 시점을 무시한 값이다.','원금별로 납입일→기간→원리금의 세 칸을 만든 뒤 마지막에 합한다.','이자 계산 전에 납입하는지 뒤에 납입하는지 구분한다. 합계 금액을 계산할 때 같은 납입금을 두 번 포함하지 않는다.',{q:'첫해 초와 둘째 해 초에 넣고 둘째 해 말 찾으면 기간은?',o:['모두2년','각각2년과1년','모두1년'],a:1,why:'같은 만기일이라도 예치된 출발점이 다르다.'},['F88','F91']);
addLesson41(11,1,'금리·물가와 실제로 살 수 있는 양','이자의 비율, 종합 가격 수준, 구매 가능한 양을 나누어 읽는다.',[
'금리는 이자를 원금에 대한 비율로 나타낸 것이며 이자율이라고도 한다. 같은 원금과 기간에서 금리가 달라지면 이자 금액이 달라진다. 금리3%에서5%로의 변화는2%포인트 증가이지만 이자 금액의 변화는 원금과 기간을 알아야 계산할 수 있다. 비율의 차이와 돈의 차이를 구분한다.',
'물가는 여러 재화와 서비스의 가격을 일정한 기준에 따라 평균한 종합적인 가격 수준이다. 교재는 물가 상승 시 같은 금액으로 구매할 수 있는 양이 줄어드는 화폐의 실질 가치 하락을 설명한다. 학습용 장바구니 문제는 이 관계를 같은 상품의 가격과 예산으로 단순화한 창작 모형이다. 상품 하나의 가격 변화가 곧바로 실제 전체 물가의 변화라고 하는 것은 아니다.',
'교재가 제시하는 금리·물가와 금융 선택의 관계는 다른 조건을 함께 고려하여 읽는다. 금리 상승이 대출 이자 부담에 영향을 준다는 설명과 모든 자산 가격을 확정적으로 예언하는 주장은 다르다. 이 강의의 대출 문제는 정해진1년 단리 계약의 두 조건을 비교할 뿐 실제 대출 상품을 권하지 않는다.'
],'창작 예산10000원으로 같은 상품을 산다. 단가는1000원에서1250원으로 바뀌고 정수 개만 산다.',[
'이전10000÷1000=10개이다.','이후10000÷1250=8개이다.','금액은 같아도 살 수 있는 양은 감소한다.'
],'명목 금액과 그 금액으로 살 수 있는 양은 구분한다.','이자=원금×기간별 이자율×기간 수(단리). 구매량=예산÷단가이며 정수 제한이 있으면 가능한 정수만 취한다.','전체 물가와 개별 상품의 가격, 비율과 금액을 바꾸어 부르지 않는다.',{q:'1000만 원의1년 단리5% 이자는?',o:['5만 원','50만 원','1050만 원'],a:1,why:'1000×0.05=50만 원이다.1050만 원은 원리금이다.'},['F91']);
addLesson41(11,2,'환율은 단위가 보이는 곱셈이다','원/달러의 분모와 분자를 확인하고 시점마다 계산한다.',[
'환율은 한 나라 통화와 다른 나라 통화의 교환 비율이다. 이 게임에서 사용하는 원/달러는1달러를 몇 원과 교환하는지 나타낸다. 달러 금액에 원/달러를 곱하면 달러 단위가 없어지고 원화 금액이 남는다. 원화 금액으로 달러를 마련하려면 반대로 원/달러로 나눈다.',
'같은 달러 금액에서 원/달러 환율이 상승하면 원화 환산액이 커진다. 달러를 받는 사람의 원화 수입과 달러 대금을 마련해야 하는 사람의 필요 원화액이 모두 커질 수 있다. 그러나 이들이 얻는 이익과 부담은 같은 의미가 아니므로 거래의 입장도 확인해야 한다.',
'외화 자산 가격과 환율이 함께 달라지면 두 시점의 금액을 따로 계산한다. 외화 가격만 떨어졌다고 원화 기준 손실을 바로 단정할 수 없다. 처음 외화액×처음 환율과 나중 외화액×나중 환율을 비교한다. 수수료·배당·환전 시점이 별도로 주어졌다면 그 조건을 추가로 반영해야 한다.'
],'창작 자산1개: 매수100달러·1200원/달러,매도90달러·1400원/달러. 다른 비용과 수익 없음.',[
'원화 매수액100×1200=120000원이다.','원화 매도액90×1400=126000원이다.','원화 손익126000−120000=6000원이다.'
],'달러 가격은 하락했지만 이 조건의 원화 손익은 양수이다.','시점별 외화액과 환율을 한 쌍으로 묶고 원화끼리 비교한다.','원/달러와 달러/원의 방향을 뒤집지 않는다. 서로 다른 시점의 환율을 잘못 짝지어 곱하지 않는다.',{q:'100달러를1200원/달러로 환산하면?',o:['120000원','1200원','100/1200원'],a:0,why:'달러×원/달러이므로 원화 단위가 남는다.'},['F91']);
addLesson41(11,3,'같은 뉴스도 사람과 목적에 따라 다르게 읽힌다','환경의 영향 가능성을 자료가 없는 가격 예언으로 바꾸지 않는다.',[
'금융 의사 결정은 개인의 재무 목표뿐 아니라 경제적·정치적·사회적 환경의 영향을 받는다. 첨부 교재는 금리·물가·환율을 경제적 환경으로 설명하고, 전쟁·팬데믹·금융 위기와 같은 사회적 변화도 금융 선택에 영향을 준다고 제시한다. 각각의 사건이 어떤 조건을 바꾸는지 읽는 것이 중요하다.',
'교재는 위기 상황에서 불확실성이 커지면 안전성과 유동성을 더 중시할 수 있다고 설명한다. 이것을 모든 자산의 가격이 일정 방향으로 반드시 움직인다는 결론으로 바꾸지 않는다. 개인이 언제 돈을 써야 하는지, 손실을 감당할 조건이 어떤지도 금융 선택에 연결된다.',
'학습용 뉴스는 실제 최신 뉴스나 전망을 제공하지 않는다. 다른 조건이 같다고 명시한 가상 변화의 경로를 분석한다. 같은 환율 상승이라도 외화를 받는 사람과 외화 대금을 내는 사람의 입장을 구분하고, 자료가 말하지 않은 금액·가격·확률은 미확인으로 남긴다.'
],'창작 조건: 원/달러가1000에서1100으로 상승했다. 갑은100달러를 받고, 을은100달러를 마련한다. 다른 조건은 같다.',[
'갑의 원화 환산액은100000→110000원이다.','을에게 필요한 원화도100000→110000원이다.','같은 금액 변화가 수입 증가와 비용 증가라는 다른 입장으로 나타난다.'
],'지표 변화, 계산 방향, 경제 주체의 입장을 함께 설명한다.','뉴스→바뀐 조건→해당 주체의 거래→확인 가능한 결과 순서로 정리한다.','자료가 없는 모든 자산 가격이나 모든 사람의 생활 개선을 단정하지 않는다.',{q:'금융 위기에서 안전성을 중시할 수 있다는 설명은?',o:['모든 가격 상승을 보장한다.','금융 선택에 영향을 줄 수 있다는 설명이다.'],a:1,why:'영향 가능성과 확정된 가격 결과는 다르다.'},['F91']);
addLesson41(12,1,'왜 나라마다 생산에 유리한 것이 다를까','부존자원·자연환경·생산 요소·기술의 차이를 비용과 연결한다.',[
'국제 분업은 각 나라가 무역에 유리한 것을 특화하여 생산하는 것이고, 무역은 재화와 서비스 등을 다른 나라와 사고파는 국제 거래이다. 나라별 생산 조건이 다르므로 같은 상품을 만드는 비용이나 효율이 달라질 수 있다. 모든 나라가 모든 상품을 똑같은 조건으로 생산한다고 가정하지 않는다.',
'부존자원은 보유한 자원의 양과 질, 자연환경은 기후·지형·토양 등의 조건과 연결된다. 생산 요소에는 노동·자본·토지 등이 포함되며 기술 수준도 생산의 효율성과 품질에 영향을 준다. 실제 한 상품에는 여러 요인이 함께 작용할 수 있지만 개념 판별 문제에서는 제시된 직접적인 단서를 우선한다.',
'교재는 자국에서 생산되지 않는 재화를 얻고 다양한 상품·서비스를 선택할 기회가 넓어지는 무역의 이익을 설명한다. 국내 생산이 가능하다고 수입의 이유가 사라지는 것도 아니다. 생산 비용 차이를 고려할 수 있다. 다만 이 설명만으로 무역의 이익이 모든 개인에게 같은 방식으로 분배된다고 결론 내리지 않는다.'
],'창작 집단A는 재료가 풍부하지만 도구가 부족하고, B는 도구가 있지만 재료가 부족하다.',[
'두 집단의 부족한 조건이 서로 다름을 확인한다.','자원과 도구·기술서비스의 교환 가능성을 검토한다.','교환 뒤에도 필요한 조건이 모두 충족되는지 계산한다.'
],'서로 다른 생산 조건을 거래로 연결하는 이유를 찾는다.','자료의 직접 단서를 자원·자연환경·생산 요소·기술에 먼저 분류한 뒤 비용 차이와 연결한다.','실제 나라의 생산 조건을 자료 없이 추정하거나 특정 나라의 모든 산업을 하나의 요인으로 설명하지 않는다.',{q:'같은 재료를 가공하는 방법의 차이는 직접적으로 무엇과 관련되는가?',o:['기술 수준','환율만','매몰 비용만'],a:0,why:'제시된 직접 단서를 기준으로 분류한다.'},['T103']);
addLesson41(12,2,'생산량은 부족한 요소에서 막힌다','여러 생산 제약을 모두 만족하는 수량을 찾는다.',[
'제품을 만들 때 재료가 충분하더라도 노동이나 기술서비스가 부족하면 원하는 수량을 생산하지 못할 수 있다. 교재의 생산 조건 차이를 이해하기 위해 이 게임은 단위당 필요한 요소와 보유량을 정수로 제시한다. 현실의 모든 생산을 이 간단한 모형으로 예측한다는 뜻은 아니다.',
'각 요소로 몇 개를 만들 수 있는지 따로 계산한다. 제품1개에 재료2·노동1이 필요하고 재료8·노동3이면 재료는4개분, 노동은3개분이다. 동시에 충족해야 하므로 최대3개를 만든다. 한 요소의 최대량을 전체 생산량으로 바로 답하지 않는다.',
'교환으로 부족한 요소를 추가 확보하면 생산 가능량이 달라질 수 있다. 그러나 어떤 요소를 얼마나 추가했는지에 따라 달라진다. 이미 넉넉한 요소만 늘었다면 다른 부족한 요소가 계속 제약으로 남을 수 있다. 실제 사용량과 남는 요소를 계산하면 선택의 이유를 설명할 수 있다.'
],'창작 제품1개에 재료3·노동2 필요. 보유 재료18·노동10,제품 정수 개.',[
'재료로18/3=6개를 만들 수 있다.','노동으로10/2=5개를 만들 수 있다.','둘을 함께 만족하는 최대는5개이다.','재료18−3×5=3,노동10−2×5=0이 남는다.'
],'제약별 최대량 가운데 더 작은 수량이 전체를 제한한다.','각 보유량÷단위당 필요량을 구해 최솟값을 고른다. 정수 제품이면 가능한 정수 범위로 제한한다.','투입 요소를 동시에 사용할 수 있다는 가정과 단위당 필요량이 일정하다는 조건을 확인한다.',{q:'재료는6개분,노동은5개분일 때 다른 제약이 없다면?',o:['최대11개','최대6개','최대5개'],a:2,why:'둘 다 필요한 생산에서는 부족한 쪽이 제약이다.'},['T103']);
addLesson41(12,3,'규모의 경제는 평균 생산 단가를 본다','총비용과 단위당 비용의 변화 방향을 구분한다.',[
'규모의 경제는 생산 규모나 생산량이 커질수록 평균 생산 단가가 하락하는 현상이다. 핵심은 총비용이 아니라 한 단위당 평균 비용이다. 더 많이 생산하면 총비용도 늘 수 있지만 생산량이 더 빠르게 늘면 평균 단가는 낮아질 수 있다.',
'자료에서 총비용을 각 생산량으로 나누어 비교한다.100개 생산에200,200개 생산에300이 들면 총비용은 늘었으나 평균 단가는2에서1.5로 하락한다. 총비용의 증감만 보고 규모의 경제를 부정하지 않는다.',
'생산 비용 비교와 운송 비용 비교는 어떤 항목을 포함하는지가 다르다. 게임의 경로 퍼즐에서는 주어진 구간 비용을 합하지만 시간·손실·관세 등 다른 조건은 없다고 명시한다. 현실 무역의 최적 경로를 이 숫자만으로 추천하는 것이 아니다. 범위가 달라지면 비용표를 다시 작성한다.'
],'창작 A규모100개·총비용250, B규모200개·총비용400.',[
'A의 평균 단가는250/100=2.5이다.','B의 평균 단가는400/200=2이다.','총비용은 증가했지만 평균 단가는 하락했다.'
],'제시된 두 규모 사이에서 규모의 경제 관계를 확인할 수 있다.','평균 단가=총비용/생산량. 비용과 생산량의 단위를 먼저 맞춘다.','한 구간의 관계를 무한히 큰 생산량까지 자동 연장하지 않는다.',{q:'총비용이 커졌으므로 규모의 경제가 없다고 단정할 수 있는가?',o:['그렇다.','아니다. 평균 단가를 계산해야 한다.'],a:1,why:'정의가 묻는 것은 단위당 평균 비용이다.'},['T103']);
addLesson41(13,1,'두 종류의 표에서는 나누는 방향이 다르다','최대 생산량표와 단위당 투입량표를 구별한다.',[
'비교 우위를 판단하려면 같은 재화1개를 생산할 때 포기하는 다른 재화의 양을 구한다. 최대 생산량표에서는 모든 요소를X에 투입했을 때의 양과Y에 투입했을 때의 양을 비교한다. 직선 모형에서X최대12·Y최대6이면X12를 만드는 대신Y6을 포기하므로X1의 비용은Y6/12이다.',
'단위당 투입량표는 재화 한 개에 필요한 생산 요소를 준다. X1에노동2, Y1에노동4가 필요하다면 X에 쓰는노동2로Y를2/4개 만들 수 있었다. 따라서X1의 기회비용은Y2/4이다. 같은 노동량이라는 단위를 유지하면 왜 최대량표와 나눗셈 방향이 다른지 알 수 있다.',
'표의 숫자를 외우지 말고 제목과 단위를 먼저 읽는다. 투입량인지 최대량인지 확인한 뒤 무엇1개를 기준으로 무엇을 포기하는지 문장으로 쓴다. 분수의 값이 같아 보여도 단위가 다르면 같은 답이 아니다. 교재 해설 부록은 다양한 표·그래프의 형태에서도 이 요소를 찾아내는 연습을 강조한다.'
],'창작 총노동48. A국은X1에2시간·Y1에4시간이 필요하다.',[
'최대 생산량은X24·Y12이다.','최대량표로X1비용은Y12/24=1/2개이다.','투입량표로X1비용은Y2/4=1/2개이다.','같은 생산 조건이므로 두 계산 결과가 일치한다.'
],'최대량표는 다른 재화 최대량/기준 재화 최대량, 투입량표는 기준 재화 투입/다른 재화 투입이다.','X1의 비용을 구하면 결과의 단위는Y라는 문장을 먼저 적는다.','표의 제목 없이 숫자만 보고 분수 방향을 정하지 않는다.',{q:'X1에노동3,Y1에노동6이 필요한 경우X1의 기회비용은?',o:['Y2개','Y1/2개'],a:1,why:'노동3으로 만들 수 있었던Y는3/6개이다.'},['T103','T104','A86']);
addLesson41(13,2,'두 최대 생산량을 동시에 만드는 것은 아니다','생산 가능 곡선과 자원의 배분 비율을 연결한다.',[
'생산 가능 곡선은 보유한 생산 자원과 기술을 동원하여 최대로 생산할 수 있는 두 상품의 조합을 나타낸 선이다. 두 절편은 한 재화에 자원을 전부 썼을 때의 최대량이다. X최대12·Y최대6이라고 해서 두 양을 동시에 생산할 수 있다는 뜻은 아니다.',
'이 과정의 계산은 자원과 기술이 고정되고 생산 가능 곡선이 직선인 모형을 사용한다. X를 최대량의3분의1만큼 만들면 전체 자원의3분의1을X에 쓰는 셈이다. 나머지3분의2로Y최대량의3분의2를 만들 수 있다. 포기한 양과 남은 양을 구분하여 계산한다.',
'직선 모형에서는 X/X최대+Y/Y최대를 비교해 조합을 분류할 수 있다. 합이1이면 곡선 위,1보다 작으면 가능한 영역 내부,1보다 크면 현재 조건으로 불가능하다. 이 계산은 제시된 직선 모형의 비율식이다. 모든 실제 생산 가능 곡선이 직선이라고 일반화하지 않는다.'
],'창작 A국X최대12·Y최대6. X4를 생산할 때의 최대Y와X4·Y2조합을 검토한다.',[
'X에 쓰는 비율은4/12=1/3이다.','남은 비율2/3로Y6×2/3=4를 생산한다.','X4·Y2는4/12+2/6=2/3이므로 영역 내부이다.'
],'X4일 때 최대Y는4이며Y2조합도 가능하지만 곡선 위는 아니다.','최대Y=Y최대×(1−X/X최대). 두 재화의 자원 사용 비율을 더해 검산한다.','교역 후 소비 가능 조합을 자국의 생산 가능 조합과 같은 뜻으로 사용하지 않는다.',{q:'X최대12·Y최대6인 직선 모형에서X12·Y6은?',o:['곡선 위','현재 조건에서 불가능'],a:1,why:'사용 비율이1+1=2로 자원을 두 번 쓰는 조합이다.'},['T104','A86']);
addLesson41(13,3,'절대 우위와 비교 우위는 무엇을 비교하는가','생산 비용과 포기한 다른 생산량을 따로 비교한다.',[
'절대 우위는 다른 생산자보다 같은 양을 더 적은 비용으로 생산할 수 있는 능력이다. 같은 총노동량을 투입해 생산할 수 있는 최대량이 크다면 그 기준에서 생산 비용의 우위를 비교할 수 있다. 하지만 투입량이 다른 두 나라의 전체 생산량만 보고 절대 우위를 확정해서는 안 된다.',
'비교 우위는 다른 생산자보다 더 작은 기회비용으로 생산하는 능력이다. 한 나라가 두 상품 모두 더 많이 만들 수 있어도 어떤 상품을 만들 때 상대적으로 덜 포기하는지는 따로 계산해야 한다. 교재는 한 나라가 두 재화 모두 절대 우위인 경우의 무역을 비교 우위로 설명할 수 있다고 제시한다.',
'각 나라의X1기회비용을Y단위로 맞춰 비교하고, Y의 비교 우위는 반대 방향의 기회비용으로 확인한다. 교역 가능한 조건도 이후 교환 비율과 수량을 통해 검토한다. 생산의 우위만 판별하고 어떤 계약도 두 나라 모두에게 유리하다고 결론 내리지는 않는다.'
],'창작 같은 총노동량에서 A국X최대24·Y최대12, B국X최대8·Y최대8. 직선 모형이다.',[
'A는 두 재화 모두 최대 생산량이 더 크므로 절대 우위이다.','X1의 비용은A Y1/2,B Y1이다. A가X에 비교 우위이다.','Y1의 비용은A X2,B X1이다. B가Y에 비교 우위이다.'
],'둘 다 더 잘 만드는 나라와도 생산 기회비용의 차이를 활용한 교역을 검토할 수 있다.','절대 우위는 같은 투입의 생산량 또는 같은 양의 비용, 비교 우위는 같은 재화의 기회비용을 비교한다.','기회비용이 같아지는 새 조건에서는 유일한 비교 우위를 임의로 부여하지 않는다.',{q:'X1의 비용A Y2,B Y3이면X의 비교 우위는?',o:['A','B'],a:0,why:'동일X1생산에서 포기하는Y가 작다.'},['T103','T104','A86']);
addLesson41(14,1,'교환 비율은 두 나라가 포기하는 양 사이에서 본다','재화1개 기준의 생산 기회비용과 교환 조건을 맞춘다.',[
'비교 우위 재화에 특화하고 교환하면 생산 비용의 차이를 활용할 수 있다. 그러나 교환 비율이 어떤가에 따라 각 나라의 추가 이익은 달라진다. 한쪽이 자급 생산보다 더 불리하게 교환한다면 양국 모두 이익을 얻는 조건이라고 할 수 없다.',
'X q개와Y y개를 교환하면X1당 받는Y는 y/q이다. A의X1기회비용이Y0.5,B는Y1이라면 양국에 양의 추가 이익을 주는 비율은0.5보다 크고1보다 작아야 한다. A는 자신이 포기한Y보다 더 받아야 하고 B는 직접X를 만들 때 포기할Y보다 적게 내야 한다.',
'이는 두 나라·두 재화·직선 생산 가능 곡선·거래 비용 없음이라는 제시된 모형에서 구한 조건이다. 비율을 만족해도 보유한 재화보다 더 많이 수출하는 계약은 실현할 수 없다. 먼저 단위를 맞춰 비율을 판단하고, 그다음 생산량과 수출량의 제약을 확인한다.'
],'창작 A의X1비용Y0.5,B의X1비용Y1. X4와Y3을 교환한다.',[
'X1당Y3/4=0.75이다.','0.5<0.75<1이므로 양국 모두에게 비용상 유리하다.','A는X4,B는Y3을 실제로 제공할 수 있는지 생산량을 확인한다.'
],'유리한 비율과 가능한 수량은 함께 확인할 별도 조건이다.','X1당Y로 통일한 뒤 작은 기회비용<교환 비율<큰 기회비용인지 비교한다.','양의 추가 이익을 요구할 때 경계를 포함하지 않는다.0을 허용하는 질문이면 발문을 다시 읽는다.',{q:'X1비용A Y2,B Y5일 때 양국 모두 양의 이익을 주는 비율은?',o:['X1:Y1','X1:Y3','X1:Y6'],a:1,why:'2<3<5이다.'},['T104','A86']);
addLesson41(14,2,'교역 후 창고와 교역의 이익을 따로 검산한다','생산·수출·수입·소비량을 연결하고 비교 기준을 명시한다.',[
'교역 후 보유량은 자국 생산량에서 수출량을 빼고 수입량을 더해 구한다. 두 나라 사이에 재고·손실·다른 거래가 없다고 명시했다면 두 나라의 최종 소비를 합해 총생산량이 보존되는지 검산할 수 있다. 교환 자체가 이미 생산된 재화의 수량을 새로 만들어 내는 것은 아니다.',
'추가 이익을 재화 단위로 묻는 경우에는 자급 생산과 비교한 절약 또는 추가 확보량을 구한다. A가X4를 내는 생산 기회비용이Y2인데Y3을 받으면Y1을 추가로 얻는다. B가X4를 직접 생산하려면Y4를 포기해야 하지만Y3만 내면Y1을 절약한다. 원화 이익이나 소득 증가율로 바꾸어 말하지 않는다.',
'교역으로 소비 가능한 조합이 자국의 생산 가능 곡선 밖에 있을 수 있지만 자국의 생산 능력이 즉시 늘었다는 뜻은 아니다. 생산과 소비의 구분이 중요하다. 국가 간 재화상의 이익을 그 나라의 모든 개인에게 같은 이익이 생긴다는 주장으로 확대하지 않는다.'
],'창작 A는X12,B는Y4에 특화 생산하고X4와Y3을 교환한다. A의X1비용Y0.5,B는Y1이다.',[
'A최종은X8·Y3, B최종은X4·Y1이다.','최종 합계X12·Y4로 생산 총량이 보존된다.','A추가Y=3−4×0.5=1, B절약Y=4×1−3=1이다.'
],'창고의 실제 보유량과 자급 대비 이익은 서로 다른 계산이다.','최종=생산−수출+수입. 이익은 받은 양과 포기한 생산량을 같은 단위로 비교한다.','생산량·소비량·추가 이익을 같은 숫자라고 생각하지 않는다.',{q:'A가X12를 만들고X4를 수출하면 남은X는?',o:['8','12','16'],a:0,why:'12−4=8이다.'},['T104','A86']);
addLesson41(14,3,'교역 후 소비량에서 계약을 거꾸로 찾는다','총량 보존과 특화·재고 조건을 먼저 확인한다.',[
'교재 해설 부록은 교역 전후 소비량으로 생산량·특화 방향·교환 비율을 추론하는 자료형을 제시한다. 결과표를 볼 때 숫자를 무작정 나누기보다 무엇이 고정되고 어떤 가정이 있는지 확인한다. 완전 특화, 두 나라 간 거래만 존재, 재고와 손실 없음 등의 조건이 역산의 근거가 된다.',
'A는X에,B는Y에 완전 특화했다고 명시하면 최종X총량은A의 생산량, 최종Y총량은B의 생산량과 연결된다. A가 소비하는Y는 수입량이고 B가 소비하는X도 수입량이다. 이 두 수량에서 교환 비율을 구할 수 있다. 일부를 자급 생산했거나 다른 나라와 거래했다면 같은 역산을 그대로 적용하지 못한다.',
'최대 생산량이 가려진 자료에서도 같은 생산 가능 곡선 위의 조합과 한 재화의 최대량을 주면 포기한 양으로 기회비용을 구할 수 있다. 다만 독립된 관계식이 부족하면 유일한 값을 확정하지 않는다. 무엇을 추가로 알아야 하는지도 자료 해석의 일부이다.'
],'창작 A는X,B는Y에 완전 특화. 교역 후A(18,5),B(6,7). 재고·손실·다른 거래 없음.',[
'X총량18+6=24로A의X생산량을 구한다.','Y총량5+7=12로B의Y생산량을 구한다.','A의Y수입5와B의X수입6에서X6:Y5를 구한다.','X1당Y5/6이다.'
],'총량→특화→수입량→비율의 순서로 복원한다.','두 최종 소비량을 합하고, 만들지 않은 재화의 소비를 찾아본다.','완전 특화·수량 보존 가정이 없으면 같은 방식으로 단정하지 않는다.',{q:'두 나라만 거래하고 손실이 없다면 최종 소비 합계는?',o:['생산 총량과 같음','무조건 생산 총량보다 큼'],a:0,why:'거래는 이미 생산한 재화의 이동이다.'},['A86','T104']);
addLesson41(15,1,'무역이 커졌다고 모든 결과를 알 수는 없다','전체의 이익과 특정 산업의 손실을 함께 읽는다.',[
'교재는 무역 확대의 긍정적 영향으로 다양한 상품·서비스를 소비할 기회, 생산 증가에 따른 고용 창출, 기술 수준과 상품의 질 향상 등을 제시한다. 이익은 수출액 하나로만 표현되지 않는다. 어떤 주체가 어떤 경로로 영향을 받는지 자료를 연결한다.',
'부정적 영향에는 경쟁력이 낮은 산업의 위축과 실업, 국가 간 경제적 격차, 한 지역의 경제 문제가 다른 나라로 확산되는 현상이 포함된다. 전체 거래액이 늘었더라도 일부 산업의 고용이 줄 수 있다는 두 사실은 함께 나타날 수 있다. 총액 증가를 모든 사람의 상황 개선과 같게 보지 않는다.',
'자료에는 총액·비율·고용·노동 조건처럼 서로 다른 기준의 수치가 섞여 있다. 같은 단위끼리 비교하고, 알려진 변화와 아직 없는 정보를 구분한다. 미확인 영향을0으로 두거나 무조건 좋은 값으로 채우는 것은 분석이 아니라 가정을 추가하는 것이므로 그렇게 처리했는지 반드시 밝혀야 한다.'
],'창작 보고: 거래 총액15%증가, 생산자에게 지급한 대가 총액4%증가. 노동시간 자료 없음.',[
'두 총액의 증가율이 서로 다름은 확인할 수 있다.','노동시간이 없으므로 시간당 보수 변화는 확정할 수 없다.','필요한 추가 자료로 노동시간과 분배 구조를 남긴다.'
],'총액이 알려졌다고 단위시간당 결과와 개인별 분배까지 알려진 것은 아니다.','주체·단위·시점·분모를 적은 뒤 사실과 추론을 나눈다.','무역 규모가 커졌다는 한 사실만으로 효율성·권리·환경의 모든 결론을 내리지 않는다.',{q:'고용이 감소한 산업이 있다는 자료를 총액 증가 때문에 삭제해도 되는가?',o:['가능하다.','안 된다. 다른 측면의 자료로 함께 검토한다.'],a:1,why:'전체 합계와 부문별 변화는 구분한다.'},['T105']);
addLesson41(15,2,'WTO·FTA와 무역 의존도 자료를 읽는다','국제기구·협정·지표의 정의를 구별한다.',[
'세계 무역 기구WTO는 국가 간 무역 관계를 관리·감독하는 국제기구로 설명된다. 자유 무역 협정FTA는 체결국 사이의 관세와 비관세 장벽을 완화하는 협정이다. 기구와 협정이라는 성격을 구분하고, 모든 나라에 같은 조건이 적용된다는 뜻으로 바꾸지 않는다. 이 게임은 현재 회원 수나 특정 협정의 시행 일정을 묻지 않는다.',
'자유 무역의 방향은 장벽을 낮춰 거래를 확대하는 것과 연결되고, 보호 무역은 국내 산업을 보호·육성하기 위해 관세 및 비관세 장벽을 활용하는 것과 연결된다. 정책의 이름뿐 아니라 어떤 목적과 수단이 제시되었는지 읽는다. 실제 특정 정책의 효과나 정당성을 자료 없이 확정하지 않는다.',
'무역 의존도는 국민 경제가 무역에 의존하는 정도를 나타내며 교재는 GDP에서 수출액과 수입액의 합이 차지하는 비율로 설명한다. 계산할 때 합과 차를 혼동하지 않는다. 지표 하나가 높다는 사실만으로 국민 생활이나 모든 산업의 안전성까지 평가할 수는 없다.'
],'창작 GDP500,수출120,수입80. 지표는(수출+수입)/GDP×100이다.',[
'분자에 수출과 수입을 더해200을 넣는다.','200/500=0.4이다.','백분율은40%이다.'
],'수출−수입의 차액과 무역 의존도는 다른 값이다.','분모GDP·분자수출+수입을 먼저 쓰고 마지막에100을 곱한다.','서로 다른 통화·기간의 값을 단위 조정 없이 합하지 않는다.',{q:'WTO와FTA는 각각?',o:['국제기구와협정','둘 다 같은 금융상품'],a:0,why:'개념의 성격을 먼저 구분한다.'},['T104','T105']);
addLesson41(15,3,'지속가능한 무역의 마지막 질문','효율성·대가·노동·환경의 근거를 함께 확인한다.',[
'지속가능한 국제 무역은 미래 세대의 필요를 저해하지 않으면서 경제적 효율성뿐 아니라 사회적 책임과 환경 보호를 고려하는 무역 활동이다. 교재는 이익의 불공정한 분배, 노동자의 권리 침해, 생산·운송 과정의 환경 문제를 함께 다룬다. 환경 하나만 개선되었다고 다른 모든 문제도 해결됐다고 판단하지 않는다.',
'공정 무역은 보다 공평한 관계를 추구하고 소외된 생산자와 노동자의 권리를 보호하여 지속가능발전에 기여하려는 무역이다. 정당한 대가 지급, 안전한 노동 환경, 친환경 생산·운송, 국제 규범과 협력 등이 검토 방향으로 제시된다. 단순히 상품 가격이 높거나 표지가 녹색이라는 사실이 이러한 근거를 대신하지 못한다.',
'최종 사건의 문서 확보 게임은 가치의 점수를 더하는 게임이 아니다. 대가·노동·환경을 실제로 확인할 자료를 모두 확보했다는 제약 충족 활동이다. 자유 서술에서는 확인한 사실, 자료가 부족한 항목, 자신의 판단 기준을 구분하여 기록한다. 체크 표시만으로 출간 가능한 설명의 정확성을 인증하지 않는다.'
],'창작 계약에는 매출 자료만 있다. 검토 예산9로 대가·노동·환경 자료를 각3씩 확보할 수 있다.',[
'매출 자료만으로 권리와 환경의 결론을 내리지 않는다.','세 종류의 자료를 모두 확보하는 비용은9이다.','확보한 자료의 내용과 남은 미확인 사항을 보고서에 적는다.'
],'자료를 모았다는 성취와 내용이 실제로 개선되었다는 결론도 구분한다.','효율성 / 누구에게 돌아간 대가 / 노동 조건 / 생산·운송의 환경 영향으로 질문을 나눈다.','게임의 문서 개수를 현실의 도덕성이나 행복 점수로 바꾸지 않는다.',{q:'지속가능한 무역을 검토하는 데 필요한 것은?',o:['수출액만','효율성·분배·노동·환경을 함께 볼 자료'],a:1,why:'교재는 복수의 관점과 국제 협력을 제시한다.'},['T105']);

capstone42(1,'박물관 개관 전날','시대와 경제 체제의 자료를 묶어 마지막 전시 해설을 완성한다.',[1,2],[
ci41('사건의 시대','자료가 지지하는 전개를 고르세요.',['과잉 생산·소비 부족·실업이 커졌다.','정부가 공공사업으로 유효 수요를 늘리려 한다.'],['상업 자본주의의 교역 장려','수정 자본주의의 정부 역할','정부 역할의 전면 부정'],1,'대공황·수요 부족·정부 역할의 맥락을 함께 읽는다.'),

capstone42(2,'축제의 흑자, 마을의 적자','행사장의 이익, 주민 피해, 공동 조명의 세 장부를 구분한다.',[3,5,6],[

function orderCourse41(n,key){const a=Array.from({length:n},(_,i)=>i);let seed=Array.from(key).reduce((v,c)=>(Math.imul(v,31)+c.charCodeAt(0))>>>0,1729);for(let i=n-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(n>1&&a.every((v,i)=>v===i))a.push(a.shift());return a;}
function courseButton41(t,extra=''){const last=courseLast41(t),done=coursePassed41(t.id);return '<button class="bookcard card" data-action="c41-task" data-id="'+t.id+'"><span class="tag">'+esc(t.id)+' · '+esc(extra||{main:'본편',review:'복습',transfer:'새 조건'}[t.group])+'</span><h3>'+esc(t.title)+'</h3><span class="tiny muted">'+(done?'해결 기록 있음':last?'재확인':'아직 응답 없음')+' · '+esc(COURSE_TYPES41[t.type])+'</span></button>';}
const COURSE_TYPES41={pick:'단서 판별',multi:'증거 묶음',map:'개념 연결',sort:'전개 복원',fix:'설명 수리',num:'수치 복원',inspect:'자료 조사',ledger:'기회비용 장부',build:'제약 조건 조합',range:'경계 조절',external:'외부 효과 장부',public:'공공재 모금'};
function courseHub41(){return '<div class="narrow"><span class="eyebrow">CORE COURSE · 01—07</span><h1>개념에서 사건 해결까지</h1><p class="muted">자본주의·경제 체제·합리적 선택·시장 실패·경제 주체를 하나의 경로로 연결했습니다. 3.1의 원고와 문제를 재편성한 통합 제작판입니다.</p><div class="notice">01~07: 정규 강의21개, 본편70개, 기존 복습14개, 신규 조건7개. 강의 확인 질문21개는 별도로 관리합니다. 첫 세 집중 사건의12강·24활동은 겹치는 주제가 있으므로 새 학습량으로 단순 합산하지 않습니다.</div><div class="stack section">'+COURSE41.chapters.map(ch=>'<article class="card"><span class="tag">CHAPTER '+String(ch.id).padStart(2,'0')+'</span><h2>'+esc(ch.title)+'</h2><p>'+esc(ch.hook)+'</p><p class="tiny muted">강의 읽음 '+ch.lessons.filter(id=>cpState41().read[id]).length+'/3 · 본편 해결 '+ch.main.filter(coursePassed41).length+'/10 · 새 조건 '+ch.transfer.filter(coursePassed41).length+'/1</p><div class="actions"><button class="primary" data-action="c41-unit" data-id="'+ch.id+'">학습 경로 열기</button><button data-action="c41-lesson" data-id="'+ch.lessons[0]+'">강의부터</button></div></article>').join('')+'<article class="card"><h2>08~15챕터는 다음 통합 대상입니다</h2><p>금융·생산·무역 전 범위는 기존3.1 파일에 보존되어 있습니다. 이 파일에 새 구조로 이전된 것은01~07과 기존 세 집중 사건입니다.</p><a class="btn" href="https://drive.google.com/file/d/1rG3rA33XvRvMi3cABhcdsfo_K1imKEBz/view" target="_blank" rel="noopener noreferrer">기존3.1 전 범위 파일 위치</a></article></div></div>';}
function courseUnit41(id){const ch=CU41[String(id)];if(!ch)return courseHub41();return '<div class="narrow"><button class="small" data-action="c41-course">← 정규 과정</button><article class="card section"><span class="tag">CHAPTER '+String(ch.id).padStart(2,'0')+'</span><h1>'+esc(ch.title)+'</h1>'+speaker({who:ch.who},ch.hook)+'<p>먼저 배우고, 예제를 따라 푼 뒤, 새로운 자료에서 확인합니다. 강의를 읽었다는 표시와 정답을 맞혔다는 기록은 별도입니다.</p></article><h2 class="section">권장 학습 순서</h2><div class="stack">'+ch.path.map((id,i)=>CL41[id]?'<button class="card bookcard" data-action="c41-lesson" data-id="'+id+'"><span class="tag">'+(i+1)+' · 개념 강의 · '+id+'</span><h3>'+esc(CL41[id].title)+'</h3><span class="tiny muted">'+(cpState41().read[id]?'읽음 표시 있음':'설명 → 예제 → 확인')+'</span></button>':courseButton41(CT41[id],(i+1)+'번째 · 본편')).join('')+'</div><h2 class="section">조건을 바꿔 다시 확인</h2><div class="stack">'+[...ch.review,...ch.transfer].map(id=>courseButton41(CT41[id])).join('')+'</div><div class="actions"><button data-action="c41-notes" data-id="'+ch.id+'">이 단원의 강의 메모</button><button data-action="c41-course">다른 단원</button></div>'+courseRefs41(ch.refs)+'</div>';}
function courseNumbers41(labels){const a=CF41.response;return labels.map((label,i)=>'<div class="field"><label for="c41n'+i+'">'+esc(label)+'</label><input id="c41n'+i+'" type="text" inputmode="text" autocomplete="off" maxlength="100" placeholder="수 또는1/2" data-cfield41="num" data-i="'+i+'" value="'+esc(a.nums[i]||'')+'"></div>').join('')+'<p class="tiny muted">숫자 칸에는0.5,1/2,−3처럼 입력합니다. 단위는 질문에 표시되어 있습니다.</p>';}
function courseOptions41(options,key='choice',multi=false){const a=CF41.response,value=multi?a.selected:a[key];return orderCourse41(options.length,CF41.task.id+key).map((i,j)=>'<button class="option '+((multi?value.includes(i):value===i)?'selected':'')+'" aria-pressed="'+(multi?value.includes(i):value===i)+'" data-action="c41-option" data-key="'+key+'" data-i="'+i+'"><span class="letter">'+(multi?'□':String.fromCharCode(65+j))+'</span><span>'+esc(options[i])+'</span></button>').join('');}
function courseSlider41(d,label){return '<div class="rangebox"><div class="rangetop"><label for="c41value"><b>'+esc(label)+'</b></label><input id="c41value" aria-label="'+esc(label)+' 숫자 입력" type="number" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" data-cfield41="value" value="'+(CF41.response.value??'')+'"></div><input aria-label="'+esc(label)+' 슬라이더" type="range" min="'+d.min+'" max="'+d.max+'" step="'+d.step+'" data-cfield41="value" value="'+(CF41.response.value??d.min)+'"></div>';}
function courseControls41(t){const a=CF41.response,d=t.d;switch(t.type){case'pick':return courseOptions41(d.options);case'multi':return '<p class="tiny muted">옳은 문장을 모두 고릅니다.</p>'+courseOptions41(d.options,'selected',true);case'map':return d.rows.map((label,i)=>'<div class="field"><label for="c41m'+i+'">'+esc(label)+'</label><select id="c41m'+i+'" data-cfield41="map" data-i="'+i+'"><option value="">연결할 개념</option>'+orderCourse41(d.options.length,t.id+i).map(j=>'<option value="'+j+'" '+(a.map[i]===j?'selected':'')+'>'+esc(d.options[j])+'</option>').join('')+'</select></div>').join('');case'sort':return '<div class="coursepool41">'+orderCourse41(d.rows.length,t.id).filter(i=>!a.sequence.includes(i)).map(i=>'<button data-action="c41-sort-add" data-i="'+i+'">'+esc(d.rows[i])+'</button>').join('')+'</div><div class="courseseq41"><span class="tiny muted">선택한 순서 · 놓은 카드를 누르면 되돌립니다</span>'+a.sequence.map((i,j)=>'<button data-action="c41-sort-remove" data-i="'+j+'"><b>'+(j+1)+'</b> '+esc(d.rows[i])+'</button>').join('')+'</div>';case'fix':return '<div class="coursesentence41">'+d.segments.map((text,i)=>'<button class="'+(a.bad===i?'selected':'')+'" data-action="c41-option" data-key="bad" data-i="'+i+'">'+esc(text)+'</button>').join('')+'</div><h3>선택한 부분의 수정안</h3>'+courseOptions41(d.options,'replacement');case'num':return (d.table?textTable(d.table[0],d.table.slice(1)):'')+courseNumbers41(d.labels);case'inspect':return '<div class="courseevidence41">'+d.clues.map((text,i)=>'<button data-action="c41-clue" data-i="'+i+'" class="card '+(a.opened.includes(i)?'selected':'')+'"><span class="tag">자료 '+(i+1)+'</span><p>'+esc(a.opened.includes(i)?text:'열어서 자료를 확인하세요.')+'</p></button>').join('')+'</div><h3>자료에 근거한 판단</h3>'+courseOptions41(d.options);case'ledger':return textTable(['대안','편익','명시적 비용'],d.rows)+courseNumbers41(d.rows.flatMap(row=>[row[0]+'의 암묵적 비용',row[0]+'의 기회비용']))+'<h3>가장 유리한 대안</h3>'+courseOptions41(d.rows.map(row=>row[0]));case'range':return courseSlider41(d,'조건에 맞는 값');case'build':{const totals=courseTotals41(t,a);return '<div class="rule"><b>창작 제약 조건</b>비용 '+d.budget+' 이하. '+d.labels.map((v,i)=>esc(v)+' '+d.mins[i]+' 이상'+(d.maxs[i]==null?'':' / '+d.maxs[i]+' 이하')).join(' · ')+'</div>'+d.items.map((it,i)=>'<div class="courseitem41"><div><b>'+esc(it[0])+'</b><p class="tiny muted">단위 비용 '+it[1]+' · '+d.labels.map((v,j)=>esc(v)+' '+it[2][j]).join(' / ')+' · 최대 '+it[3]+'</p></div><div class="counter"><button aria-label="'+esc(it[0])+' 줄이기" data-action="c41-count" data-i="'+i+'" data-delta="-1">−</button><b>'+a.counts[i]+'</b><button aria-label="'+esc(it[0])+' 늘리기" data-action="c41-count" data-i="'+i+'" data-delta="1">＋</button></div></div>').join('')+'<div class="coursemeters41"><div>총비용<strong>'+f(totals.cost)+'</strong></div>'+totals.vals.map((v,i)=>'<div>'+esc(d.labels[i])+'<strong>'+f(v)+'</strong></div>').join('')+'</div>';}case'external':return '<div class="rule"><b>비교 목표</b>'+esc(courseExternalLabel41(t))+'의 최대값'+(['tax','subsidy'].includes(d.mode)?' · 활동1단위당 '+d.rate+(d.mode==='tax'?' 부담금':' 보조금'):'')+'</div>'+textTable(['활동량','개인 이익','제3자 '+(['positive','subsidy'].includes(d.mode)?'편익':'피해')],d.rows)+courseSlider41({min:d.rows[0][0],max:d.rows[d.rows.length-1][0],step:1},'선택할 활동량')+courseNumbers41(['선택한 활동량의 목표 계산값']);case'public':return textTable(['다른 주민 A','다른 주민 B','다른 주민 C'],[d.others])+'<div class="row">'+[0,4,6,10].map(n=>'<button class="'+(a.donation===n?'selected':'')+'" data-action="c41-option" data-key="donation" data-i="'+n+'">'+n+'토큰 납부</button>').join('')+'</div>'+courseNumbers41(['내 최종 토큰+편익']);default:return '<p>등록되지 않은 형식입니다.</p>';}}
function courseSolution41(t,a=CF41.response){const d=t.d;switch(t.type){case'pick':case'inspect':return '<p><b>판단:</b> '+esc(d.options[t.answer])+'</p>';case'multi':return t.answer.map(i=>'<p>✓ '+esc(d.options[i])+'</p>').join('');case'map':return textTable(['자료','연결'],d.rows.map((x,i)=>[x,d.options[t.answer[i]]]));case'sort':return '<p>'+t.answer.map((i,j)=>(j+1)+'. '+esc(d.rows[i])).join('<br>')+'</p>';case'fix':return '<p><b>수정 문장:</b> '+d.segments.map((v,i)=>esc(i===t.answer[0]?d.options[t.answer[1]]:v)).join(' ')+'</p>';case'num':return textTable(['항목','정답'],d.labels.map((v,i)=>[v,f(t.answer[i])]));case'range':return '<p><b>조건을 만족하는 값: '+f(t.answer)+'</b></p>';case'ledger':return textTable(['대안','비교값','암묵적 비용','기회비용','순편익'],courseLedger41(t).map(v=>[v.name,v.g,v.implicit,v.oc,v.surplus]));case'build':return '<p>제약을 모두 충족하면 정답입니다. 가능한 예시는 다음과 같습니다.</p>'+textTable(['선택','수량'],d.items.map((v,i)=>[v[0],d.witness[i]]));case'external':return textTable(['활동량',courseExternalLabel41(t)],d.rows.map((v,i)=>[v[0],courseExternal41(t)[i]]));case'public':return textTable(['내 납부','모금 합계','설치','내 결과'],[0,4,6,10].map(n=>{const z=publicCalc(d.others,n);return[n,z.total,z.lit?'성공':'실패·반환',z.value];}));default:return '';}}
function courseVisual41(t,a,reveal){if(t.type==='public')return '<div class="play-scene">'+publicScene(t.d.others,a.donation??0,reveal)+'</div>';if(t.type==='external'){const chosen=t.d.rows.find(v=>v[0]===num(a.value)),row=chosen||t.d.rows[0],p=row[1],e=row[2],max=Math.max(1,...t.d.rows.flatMap(v=>[v[1],v[2]]));const calc=chosen?courseExternal41(t)[t.d.rows.indexOf(chosen)]:null;return '<section class="courseledger41"><div class="row between"><b>공장 안의 장부 · 공장 밖의 영향</b><span class="tag">활동량 '+esc(row[0])+'</span></div><div class="coursebar41"><span>개인 이익 '+f(p)+'</span><i style="width:'+(p/max*100)+'%"></i></div><div class="coursebar41 other"><span>제3자 '+(['positive','subsidy'].includes(t.d.mode)?'편익 ':'피해 ')+f(e)+'</span><i style="width:'+(e/max*100)+'%"></i></div><p class="tiny">막대는 원자료의 금액을 나타냅니다. '+(reveal?'해당 목표의 계산값 '+f(calc):'목표 계산값은 먼저 예상한 뒤 확인하세요.')+'</p></section>';}if(t.type==='sort')return '<p class="notice">위치가 바뀌면 설명의 순서도 바뀝니다. 근거 자료의 전개 방식과 비교하며 배열하세요.</p>';if(t.type==='inspect')return '<p class="notice">자료를 열어 확인한 뒤 결론을 선택합니다. 확인하지 않은 자료를 근거로 판단하지 않습니다.</p>';return '';}

"// Node.js 내장 모듈만 사용하는 HTML JavaScript 구문 검사. 게임을 실행하지 않습니다.",

"const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script\\s*>/gi)];",
"const results=scripts.map((m,i)=>{try{new vm.Script(m[1],{filename:path+':script'+(i+1)});return {script:i+1,syntax:'PASS'};}catch(e){return {script:i+1,syntax:'FAIL',message:e.message,stack:e.stack};}});",
"const report={scope:'구문 검사만 수행. 화면·채점·저장·오프라인 검사는 별도',at:new Date().toISOString(),file:path,results};",
"fs.writeFileSync('syntax-result.json',JSON.stringify(report,null,2));",
"console.log(JSON.stringify(report,null,2));",
"if(!scripts.length||results.some(x=>x.syntax==='FAIL'))process.exitCode=1;"
].join('\n');}

supplement42(0,1,'경제 문장을 읽는 네 가지 질문','누가, 무엇 중에서, 무엇을 얻고, 무엇을 내거나 포기하는지 표시한다.',[
'선택 문제의 첫 단계는 숫자를 계산하는 것이 아니라 상황을 나누어 읽는 것이다. 선택하는 사람, 가능한 대안, 각 대안의 편익, 직접 지출하거나 포기하는 가치를 각각 표시한다. 문제에 사람이 여러 명 등장하면 누구의 선택을 묻는지부터 확정한다.',
'편익은 돈으로 받은 보수만이 아니라 선택에서 얻는 만족감도 포함한다. 비용 역시 지갑에서 실제로 나가는 금액에만 한정되지 않는다. 같은 시간에 할 수 있던 다른 활동을 포기했다면 그 가치도 확인해야 한다.',
'게임의 수치 문제는 주어진 만족을 화폐 단위로 평가한 창작 조건을 사용한다. 실제 사람의 만족을 모두 객관적으로 측정했다는 뜻은 아니다. 정의와 계산을 연결하기 위해 문제에 제시된 대안과 평가 범위를 지킨다.'
],'공연과 일을 동시에 할 수 없다. 공연료2만 원, 일의 보수5만 원이며 다른 비용은 없다.',[
'선택 주체는 나이고 대안은 공연과 일이다.','공연의 직접 지출은2, 포기하는 일의 가치는5이다.','공연의 기회비용은2+5=7만 원이다.'
],'직접 지출과 포기한 가치를 따로 적은 뒤 연결한다.','주체 / 대안 / 얻음 / 지출·포기의 네 칸을 만든다.','현금이 아닌 만족을 무조건 제외하거나 포기한 모든 대안을 동시에 더하지 않는다.',{q:'선택 때문에 다른 활동의 만족을 포기했다면?',o:['현금이 아니므로 항상 제외한다.','포기한 대안의 가치로 살핀다.'],a:1,why:'편익과 비용은 지갑의 입출금만으로 정해지지 않는다.'},['E76']);
supplement42(0,2,'분수와 백분율을 경제 문장으로 읽기','비교의 기준과 비율의 단위를 확인한다.',[
'백분율은 기준이 되는 전체를100으로 보았을 때 비교하는 값의 크기이다.100만 원 가운데20만 원이라면20/100=0.2이며20%이다. 계산할 때5%는5가 아니라5/100인0.05로 바꾼다.',
'분수의 분모는 무엇을 기준으로 나누는지와 연결된다. X1개당Y1/2개라는 문장은 X를 한 개 생산할 때Y를 반 개 포기한다는 뜻으로 읽을 수 있다. 같은1/2라도 어떤 재화의 단위인지 빠지면 경제적 의미가 불분명하다.',
'비율을 계산한 뒤 원금·이자·원리금처럼 답의 항목을 확인한다.300의4%를 구하는 질문에 원금에4를 더한304를 답하지 않는다. 이 준비는 경제 개념을 대신하는 이론이 아니라 교재의 수치 자료를 읽는 계산 보충이다.'
],'원금200만 원,연5%단리,정확히1년,세금과 수수료 없음.',[
'5%=0.05이다.','이자200×0.05=10만 원이다.','원리금은200+10=210만 원이다.'
],'이자10과 원리금210은 다른 질문의 답이다.','1%는100으로 나누기,5%는10%의 절반으로도 계산할 수 있다.','연5%를 매달5%로 적용하지 않는다. 비교 기준과 기간이 같을 때 비율을 계산한다.',{q:'300만 원의4%는?',o:['12만 원','304만 원'],a:0,why:'300×0.04=12이다.'},['F91','T105','A86']);
supplement42(0,3,'표의 단위와 돈의 시간을 먼저 맞추기','총액·단위당 값·기간·통화를 맞춘다.',[
'표에 같은 숫자가 있어도 무엇을 뜻하는지 먼저 읽는다. 재화1개에 필요한 노동시간과 같은 노동으로 만들 수 있는 최대 생산량은 비교 방향이 다르다. 표의 제목과 열 이름을 지운 채 숫자만 계산하지 않는다.',
'월 금액을 연 금액과 비교하거나 달러와 원화를 합하기 전에는 단위를 맞춘다. 매월 같은 월급을12번 받는다고 명시했다면 월급에12를 곱해 연간 금액으로 바꿀 수 있다. 통화는 문제에서 주어진 환율과 시점을 사용한다.',
'총수입과 총지출의 차이가 양수여도 먼저 돈이 나가고 나중에 들어오면 기한을 지키지 못할 수 있다. 이월·대출·지출 연기의 가능 여부를 확인한다. 금액의 크기와 사용할 수 있는 시간을 함께 기록한다.'
],'초기0,1개월 말30만 원 지출,2개월 초50만 원 수입. 대출과 지출 연기는 불가능하다.',[
'지출 기한은1개월 말이다.','그때까지 들어온 수입은0이다.','2개월의 수입을 앞당겨 쓸 수 없으므로 첫 지출을 충족하지 못한다.'
],'전체 기간의 총액만으로 기한 문제를 해결하지 못한다.','날짜순으로 이전 잔액+이번 수입−이번 지출을 적는다.','월초·월말,원·만원,달러·원화를 혼동하지 않는다.',{q:'매월 같은400만 원을12번 받는 연간 수입은?',o:['400만 원','4800만 원'],a:1,why:'400×12=4800이다.'},['F90','F91','A86']);
supplement42(0,4,'표의 제목·단위·대안 범위를 표시한다','계산 전에 어떤 자료인지 식별한다.',[
'경제 자료의 표는 겉모습이 같아도 다른 정보를 준다. 최대 생산량표의 숫자가 크다는 것과 단위당 노동 투입량표의 숫자가 크다는 것은 반대 의미일 수 있다. 표 제목에 최대인지,한 개당인지,같은 총량인지 표시한다.',
'단위가 없는 비교도 경계해야 한다. 원/달러와 달러/원, 총액과 한 개당 금액, 매월 금액과 연간 금액을 구분한다. 무엇을 기준으로 비교하고 있는지 문장으로 설명할 수 있어야 식을 올바르게 세울 수 있다.',
'선택 문제에서는 대안의 범위도 자료의 일부이다. 세 대안 중 하나만 고르는지 여러 대안을 함께 선택할 수 있는지에 따라 계산이 다르다. 문제에 없는 대안을 추가하거나 동시에 불가능한 활동을 모두 더하지 않는다.'
],'자료A는같은노동으로X24또는Y12를만들수있는최대량표,자료B는X1에2시간·Y1에4시간이드는투입량표이다.',[
'A의 제목을 최대량, B의 제목을 단위당 투입으로 표시한다.','A에서X1비용은Y12/24이다.','B에서X1비용은Y2/4로 같은1/2이다.'
],'같은 조건을 다른 형식으로 표현할 수 있지만 나눗셈의 출발점은 다르다.','제목→단위→고정된 조건→질문의 기준 순서로 읽는다.','표를 보자마자 위숫자/아래숫자처럼 위치만으로 계산하지 않는다.',{q:'숫자 위치가 같으면 항상 같은 방향으로 나누는가?',o:['그렇다.','아니다. 자료의 뜻을 먼저 본다.'],a:1,why:'생산량과 투입량은 다른 종류의 정보이다.'},['E76','A86']);
supplement42(0,5,'퍼센트와 퍼센트포인트를 나누어 읽는다','비율의 차이와 증가율의 분모를 구별한다.',[
'이자율이3%에서5%로 바뀌었다면 두 비율의 차이는2%포인트이다. 이는 원금에 대한 이자의 비율이 얼마나 달라졌는지 나타낸다. 이자율 자체의 증가율을 묻는 질문과는 다르다.',
'증가율은 증가한 양을 처음 값으로 나누어 계산한다.3에서5로 늘어난 증가율은2/3이지만3%에서5%의 차이는2%포인트이다. 원금이 고정된 이자 문제에서는 금리 차이에 원금을 곱하여 이자 금액의 차이를 구할 수도 있다.',
'같은 자료에 금리의 차이, 이자 금액, 전체 원리금이 함께 나올 수 있다. 어떤 항목을 묻는지에 따라 답의 단위가 달라진다. 부호와 분모를 확인한 뒤 답 옆에%인지%포인트인지 원인지 적는다.'
],'원금1000만 원,1년 단리3%계약과5%계약을 비교하고 다른 비용은 없다.',[
'이자율 차이는5−3=2%포인트이다.','이자는각각30만 원과50만 원이다.','이자 금액의 차이는20만 원이다.'
],'2%포인트와20만 원은 서로 다른 단위의 답이다.','같은원금·기간이라면 이자차이=원금×금리차이의 소수값이다.','금리차이2%포인트를 원금에2배 곱하거나2만원으로 읽지 않는다.',{q:'금리3%와5%의 차이는?',o:['2%포인트','2만 원'],a:0,why:'비율끼리의 차이이며 금액이 아니다.'},['F91']);
supplement42(0,6,'조건 변경 전후를 다른 장부로 기록한다','바뀐 항목과 고정된 항목을 명시한다.',[
'조건이 바뀌는 문제에서는 이전에 맞았던 결론이 새 조건에서도 유지되는지 확인한다. 기존 표를 지워 버리지 말고 변경 전과 후를 나란히 놓는다. 편익·앞으로의 비용·환불 조건·가능한 대안 가운데 무엇이 달라졌는지 표시한다.',
'변하지 않은 숫자는 그대로 두고 바뀐 값만 우선 재계산할 수 있다. 다만 다른 대안의 암묵적 비용까지 달라질 수 있으므로 비용 장부 전체를 묻는 문제에서는 영향이 연결되는 범위까지 확인해야 한다.',
'새 조건을 이전 문제에 소급하여 적용하지 않는다. 원래는 회수 불가능하던 돈을 새 계약에서 반환하기로 했다면 서로 다른 조건의 문제이다. 이전 답을 오류로 처리하는 것이 아니라 두 답이 왜 달라졌는지 설명한다.'
],'A편익30·비용8, B편익36·비용10. 이후B비용만15가된다.',[
'처음 비교값A22·B26이므로B이다.','변경후A22·B21이므로A이다.','선택을 바꾼 것은B의 앞으로 비용이며 A자료는그대로다.'
],'변경 전후에 각각 성립하는 결론을 남긴다.','변경 표시→해당 비교값→경쟁 대안과 비교→비용표 검산의 순서로 본다.','선택이 같다고 모든 비용도 같거나,숫자가바뀌면항상선택이바뀐다고단정하지않는다.',{q:'보상이 조금 늘어도 최선의 선택이 유지될 수 있는가?',o:['가능하다.','항상 뒤집힌다.'],a:0,why:'다른 대안의 비교값을 넘어섰는지 확인해야 한다.'},['E76','F90']);
supplement42(1,4,'같은 정부 개입, 다른 배경과 목적','정부라는 단어보다 해결하려는 문제를 읽는다.',[
'중상주의와 수정 자본주의의 설명에는 모두 정부가 등장한다. 그러나 전자는 상공업과 교역을 장려하는 절대 왕정의 배경, 후자는 대공황과 수요 부족·실업에 대응하려는 배경과 연결된다. 공통 주체가 있다는 사실만으로 같은 시대와 정책 목적을 뜻하지 않는다.',
'자료의 인물·시점·문제 진단·활동을 별도 칸에 적는다. 무역선을 지원하는 활동과 공공사업으로 일자리를 만드는 활동은 정부의 등장이라는 공통점이 있지만 직접 연결되는 맥락이 다르다.',
'서술형 강의에서는 정부개입은무조건한단계라는 학생의 오개념을 두 반례로 고친다. 반대로 정부가 개입했다는 사실만으로 민간의 시장 활동을 모두 부정하는 결론도 피한다.'
],'A문서는절대왕정의교역장려,B문서는대공황이후공공사업을설명한다.',[
'A의 배경은 교역 확대와 중상주의이다.','B의 배경은 수요 부족과 실업에 대한 대응이다.','각각 상업 자본주의와 수정 자본주의에 연결한다.'
],'공통어를 발견한 뒤 차이를 만드는 근거를 확인한다.','주체가 같을수록 배경·목적·수단을 추가로 비교한다.','시대 구분을 낱말 하나로 확정하지 않는다.',{q:'정부가 나온다는 이유로 두 문서를 같은 단계라 할 수 있는가?',o:['그렇다.','배경과 목적을 더 보아야 한다.'],a:1,why:'동일한 주체가 서로 다른 맥락에서 등장한다.'},['E75','V62']);
supplement42(3,4,'기회비용이 더 큰 선택이 합리적일 수 있다','편익이 다른 대안의 비용만 비교하지 않는다.',[
'기회비용이 작으면 더 좋은 선택이라는 말은 편익이 같은 조건과 함께 읽어야 한다. 편익이 다른데 비용의 크기만 비교하면 얻는 이익을 빠뜨릴 수 있다. 합리적 선택에서는 편익과 기회비용을 함께 고려한다.',
'두 대안의 편익−명시적 비용을 먼저 비교하면 어느 대안이 유리한지 빠르게 볼 수 있다. 그러나 그 비교값이 곧 순편익인 것은 아니다. 상대의 비교값을 암묵적 비용에 넣고 기회비용·순편익을 확인한다.',
'교재 정의를 설명할 때는 비용이 더 크면서도 순편익이 큰 실제 수치의 반례를 구성해 보자. 모든 비용 최소화 표현을 무조건 지출이 가장 작은 대안을 고르라는 규칙으로 바꾸지 않는다.'
],'A편익25·명시적비용7, B편익32·명시적비용11. 두대안만있다.',[
'비교값은18과21이다.','A기회비용7+21=28, B기회비용11+18=29이다.','순편익은A−3,B3이므로B가유리하다.'
],'B의기회비용29는더크지만편익까지고려한순편익도더크다.','편익이 같은가를 먼저 확인한다. 다르면 순편익 또는 비교값의 올바른 비교를 사용한다.','명시적비용의최소값과기회비용의최소값을같은뜻으로사용하지않는다.',{q:'편익이 다를 때 기회비용만 작으면 항상 최선인가?',o:['그렇다.','그렇지 않다.'],a:1,why:'편익까지 고려해야 한다.'},['E76','B48']);
supplement42(3,5,'선택은 같고 순편익만 달라지는 반례','최선의 포기 대안의 변화가 비용에 미치는 영향을 읽는다.',[
'세 대안의 비교값이22·26·25라면B가최선이고B는C의25를포기한다. 이제C의가치만조금높아져도B가여전히최선일수있다. 그러나B가포기하는가치는달라진다.',
'비교값의1등과2등사이간격은유일한최선의순편익을검산하는데유용하다.2등이1등에가까워지면선택은유지되면서순편익은작아진다.1등을넘으면그때는선택이바뀐다.',
'이설명은상호배타적인대안과평가값이모두주어진모형에서정의로부터도출한것이다. 문제에없는대안을새로넣거나만족의측정방식을몰래바꾸지않는다.'
],'A·B·C비교값22·26·25에서C만25.5로바뀐다.',[
'B26은여전히가장크다.','B의암묵적비용은25에서25.5로커진다.','B순편익은1에서0.5로줄어든다.'
],'최선이라는질문과그선택의비용이라는질문은다르다.','1등과2등을찾고그간격이어떻게변했는지본다.','동률일때어느하나를유일한최선으로표시하지않는다.',{q:'위조건변경에서B선택은유지되지만순편익은?',o:['작아진다.','항상그대로다.'],a:0,why:'포기한대안의가치가커지기때문이다.'},['E76','B48']);
supplement42(4,4,'대안이 추가되면 누구의 비용이 바뀌는가','선택의 변화와 최선의 포기 대안의 변화를 나누어 본다.',[
'두 대안 중 하나를 고를 때에는 상대 대안이 곧 포기하는 대안이다. 그러나 세 번째 대안이 추가되면 자신을 제외한 대안 가운데 어느 것이 가장 가치 있는지 다시 찾아야 한다. 새로운 대안이 최선이 아니더라도 기존 선택의 암묵적 비용에 영향을 줄 수 있다.',
'비교값이 A60·B75였던 상황에 C70이 추가되었다고 하자. B는 여전히 가장 유리하지만 B를 고를 때 포기하는 것은 이제 A60이 아니라 C70이다. 반면 A를 고를 때 포기하는 최선은 여전히 B75이다. 모든 대안의 암묵적 비용이 똑같이 바뀌는 것은 아니다.',
'이처럼 조건 변경의 영향은 대안별로 추적해야 한다. 원래 선택이 유지되었다는 사실만으로 기회비용이나 순편익이 그대로라고 답하지 않는다. 이 설명은 세 대안 중 하나만 선택하고 주어진 평가값만 고려하는 모형에서 도출한다.'
],'창작 A편익150·비용90, B130·55의 두 대안에 C100·30이 추가된다.',[
'원래 비교값은 A60·B75이고 B의 암묵적 비용은60이다.','C의 비교값은70이므로 추가 후에도 B가 최선이다.','B의 암묵적 비용은70으로 커져 순편익은75−70=5가 된다.'
],'선택 B는 유지되지만 B의 순편익은15에서5로 줄어든다.','새 대안을 넣은 뒤 1등과2등을 다시 찾고 각 대안의 자기 제외 최댓값을 확인한다.','세 번째 대안의 편익 전체를 암묵적 비용으로 넣지 않고 그 대안의 명시적 비용을 먼저 뺀다.',{q:'비교값 A60·B75에 C70이 추가되면 B의 암묵적 비용은?',o:['60','70','145'],a:1,why:'B를 제외한 최선의 대안은 C70이다.'},['E76','B48']);
supplement42(4,5,'동률과 유일한 최선의 경계를 분리한다','같아지는 값과 확실하게 뒤집히는 최소값은 다르다.',[
'두 대안의 비교값을 같게 놓으면 선택의 경계를 찾을 수 있다. 그러나 문제에서 한 대안이 유일한 최선이 되어야 한다고 요구하면 같은 값만으로는 충분하지 않다. 동률인지 엄격한 우열인지 발문의 표현을 구분한다.',
'정수 단위의 최소값 문제에서는 경계 바로 다음의 허용값을 확인한다. 반환금6에서 두 비교값이 같고 반환금이 정수라면 반환금7에서 비로소 한쪽이 더 커질 수 있다. 소수도 허용하는 문제라면 같은 최소 정숫값 규칙을 그대로 적용할 수 없다.',
'동률은 교재의 기본 정의를 적용한 수학적 경계 사례로 따로 표시한다. 교재의 전형적인 유일한 최선 예시를 근거로 모든 문제에 동률이 불가능하다고 가정하지 않는다. 반대로 자료가 동률을 만들지 않는데 임의의 대안을 넣어 동률로 바꾸지도 않는다.'
],'창작 A편익70·비용20, B74·30. B선택 때만 새 계약의 반환금 r을 받는다. r은0이상의 정수이다.',[
'A의 비교값은50, B는44+r이다.','r=6이면50으로 동률이다.','B가 유일한 최선이 되는 최소 정수는 r=7이다.'
],'경계6과 유일한 최선의 최소 반환금7을 구분한다.','같음의 식으로 경계를 찾은 뒤 허용되는 값의 간격과 부등호 방향을 확인한다.','정수 조건 없이 무조건1을 더하지 않는다.',{q:'위 조건에서 반환금6은 어떤 경우인가?',o:['B가 유일한 최선','두 비교값이 같은 경계'],a:1,why:'44+6=50으로 A와 같다.'},['E76','B48']);
supplement42(5,4,'세금 이전과 피해 비용을 이중 계산하지 않는다','정책이 바꾼 선택과 돈의 이전을 별도로 기록한다.',[
'부담금이 개인의 선택에 영향을 주는 계산과 사회 전체 장부를 합치는 계산은 구분해야 한다. 생산자는 부담금을 내면 자기 이익이 줄어들 수 있다. 그러나 게임에서 정부 수입도 별도 포함한다고 명시했다면 그 돈은 다른 주체로 이전된 금액이다.',
'창작 모형에서 납부 전 생산자 이익60, 부담금28, 제3자 피해12라면 생산자에게 남는 이익은32이고 정부는28을 받는다. 다른 효과가 없다는 가정에서 합은32+28−12=48이다. 부담금을 정부 수입에 넣으면서 다시 사회 전체의 소멸 비용으로 빼면 이중 계산이다.',
'이 설명을 세금이나 보조금이 사회에 아무 영향을 주지 않는다는 주장으로 바꾸지 않는다. 부담금 때문에 선택한 생산량이 달라지면 피해와 이익의 값도 달라질 수 있다. 실제 정책에는 여러 효과가 있으므로 이 단순 합산은 공개한 게임 가정 안에서만 사용한다.'
],'창작 생산량2, 납부 전 이익60·부담금28·피해12. 정부 수입28을 포함하며 다른 비용은 없다.',[
'생산자의 납부 후 이익은60−28=32이다.','정부 수입은28이다.','두 주체의 금액에 피해를 반영하면32+28−12=48이다.'
],'이전된 금액과 자원이 실제로 사라지는 비용을 같은 항목으로 두 번 빼지 않는다.','누가 내고 누가 받았는지 먼저 나누어 적고, 합산할 주체의 범위를 확인한다.','행정 비용이나 다른 영향을 문제에서 주지 않았다면 임의로 넣지 않으며, 현실에는 그런 영향이 없다고 일반화하지 않는다.',{q:'정부 수입을 포함한 위 모형의 합은?',o:['20','48','60'],a:1,why:'32+28−12=48이다.'},['E77']);
supplement42(5,5,'같은 손해라도 외부 불경제인지 따로 확인한다','경제활동·제3자 영향·대가 여부를 함께 본다.',[
'손해를 보았다는 말 하나만으로 외부 불경제라고 판정하지 않는다. 외부 효과는 경제 주체의 생산이나 소비가 다른 주체에게 의도하지 않은 이익이나 손해를 주지만 그에 대한 대가를 받거나 지급하지 않는 상태이다. 세 가지 연결이 자료에 있는지 살핀다.',
'공장 배출로 이웃이 미보상 피해를 본 경우와 자연재해가 설비를 파손한 경우는 자료의 구조가 다르다. 상품 구매자가 판매자에게 정해진 가격을 지급하는 거래도 제3자에게 대가 없이 미치는 영향과 같은 설명이 아니다. 현실 사건 전체를 단정하는 것이 아니라 제시된 사례가 해당 개념을 지지하는지 묻는다.',
'정보가 부족하면 무엇을 더 알아야 하는지 남길 수 있다. 피해의 원인이 경제활동인지, 누구에게 어떤 영향이 생겼는지, 대가가 지급되었는지 확인한다. 직접적인 거래 비용을 외부 불경제로 바꾸거나 미확인 보상을0이라고 몰래 가정하지 않는다.'
],'자료A: 생산 배출로 이웃이 미보상 피해. 자료B: 경제활동과 무관한 자연재해로 공장 설비 파손.',[
'A에는 경제활동과 다른 주체의 피해가 연결된다.','A는 보상이 없다는 조건도 주어졌다.','B의 손해만으로는 A와 같은 외부 불경제 구조가 제시되었다고 볼 수 없다.'
],'피해라는 공통어보다 원인과 주체의 관계를 비교한다.','활동 주체 → 영향을 받은 주체 → 편익·피해 → 대가를 네 칸으로 표시한다.','실제 사건의 법적 배상 책임을 이 개념 분류만으로 판단하지 않는다.',{q:'외부 불경제 판별에 함께 확인할 조건은?',o:['손해라는 단어만','경제활동·다른 주체의 피해·대가 여부'],a:1,why:'정의의 여러 요소를 함께 적용한다.'},['E77']);
supplement42(6,4,'모르는 납부액과 조건부 최적 선택','모금 규칙과 타인의 선택에 관한 정보가 다르면 질문도 달라진다.',[
'같은 공공재 모금이라도 다른 사람의 납부액이 공개되어 있는지 모르는지는 다른 조건이다. 교과서의 무임승차 경향과 공급 부족 설명, 그리고 주어진 납부액에서 개인에게 가장 유리한 선택을 계산하는 게임은 같은 질문이 아니다.',
'창작4인 게임에서 타인의 합계가18이면 내가6을 내야 설치가 성립하여 내 결과14를 얻는다. 타인만으로24를 냈다면 내가0을 내고도 설치 편익을 얻어 결과20이 된다. 두 상황의 최선의 납부액은 다르다.',
'타인의 합계가18또는24라는 것만 알고 어느 경우인지와 확률이 없다면, 같은 계산 답을 하나로 확정할 근거가 부족하다. 서로 다른 조건이 서로 다른 답을 만든다는 사실을 설명해야 한다. 이 정보 충분성 과제는 교과서의 공공재·무임승차 개념을 부정하는 것이 아니다.'
],'창작 규칙: 초기10·설치비24·설치편익10·실패 시 반환. 내 선택지는0·4·6·10, 타인 합계는18또는24이나 어느 상황인지 모른다.',[
'타인18이면6을 낼 때 결과14로 선택지 중 최대이다.','타인24이면0을 낼 때 결과20으로 최대이다.','상황이나 확률 정보 없이 유일한 최적 납부액을 일반화하지 않는다.'
],'주어진 정보가 달라지면 조건부 최선도 달라질 수 있다.','알 수 없다는 판단은 다른 결론을 만드는 두 가능한 조건을 제시해 설명한다.','원문의20인 활동과4인 게임의 규칙을 섞지 않는다.',{q:'타인 납부가18인지24인지와 확률을 모르면?',o:['항상0이 유일한 최선','추가 정보나 가정 없이 하나로 확정하기 어렵다.'],a:1,why:'공개된 두 경우의 최선이 서로 다르다.'},['E77','D77']);
supplement42(6,5,'공공재·경쟁·정보의 문제를 한 자료에서 구분한다','시장 실패의 이름보다 원인을 보여 주는 증거를 찾는다.',[
'한 시장에서 여러 문제가 함께 발생할 수 있다. 가로등 공급 부족, 판매자 사이의 가격 합의, 구매자에게 숨겨진 결함이 같은 장소에 있다고 해서 같은 원인은 아니다. 각각 어떤 개념의 조건을 충족하는지 따로 조사한다.',
'미납부자도 이용할 수 있다는 조건은 공공재의 비배제성, 업체의 가격 인상 합의 문서는 경쟁 제한, 판매자만 알고 있는 제품 상태는 정보의 비대칭성과 연결된다. 같은 가격이라는 사실만으로 실제 합의가 있었다고 확정하지 않고 직접적인 자료가 있는지 확인한다.',
'대응도 원인별로 연결한다. 공공재 공급, 공정 경쟁 질서, 품질 보증과 관련 정보 제공은 각각 보완하려는 문제가 다르다. 모든 경우에 정부가 개입한다는 공통점만 외우면 구체적인 사례의 차이를 설명하지 못한다.'
],'창작 시장의 카드: A미납부자의 가로등 이용, B업체 간 수량 제한 합의, C판매자만 아는 결함.',[
'A는 비배제성의 조건을 보여 준다.','B는 공정한 경쟁의 제한과 연결된다.','C는 거래 정보의 차이를 보여 준다.'
],'동일한 장소에서 서로 다른 원인의 문제가 나타날 수 있다.','이용 배제 / 경쟁 행위 / 거래 정보의 세 질문으로 자료를 나눈다.','가상 자료의 개념 분류를 실제 사건의 법적 유죄 판정으로 사용하지 않는다.',{q:'판매자와 구매자가 가진 제품 정보가 다르면 직접 관련된 것은?',o:['정보의 비대칭성','비경합성만'],a:0,why:'정보의 차이와 소비 기회의 감소 여부는 다른 기준이다.'},['E77']);
supplement42(7,4,'같은 제안을 네 경제 주체의 관점에서 설명한다','주체별 역할을 구분하고 주장에 필요한 자료를 확인한다.',[
'공장 개선 제안을 기업·노동자·소비자·정부가 서로 다른 관점에서 볼 수 있다. 기업은 혁신과 비용, 노동자는 근로 조건과 권리, 소비자는 제품의 안전과 정보, 정부는 공정한 질서와 공공의 문제를 함께 검토한다. 한 사람도 여러 지위를 가질 수 있으나 자료에 제시된 활동의 역할을 구별한다.',
'기업이 이익을 얻었다는 사실이 노동자 권리나 소비자 정보의 충족을 자동으로 보장하지는 않는다. 반대로 어느 한 비용이 늘었다고 모든 사회적 영향이 나빠졌다고 단정하지 않는다. 무엇이 실제로 확인되었고 무엇이 아직 판단에 필요한지 나누어 기록한다.',
'게임의 문서 조합은 관련 검토 자료를 확보하는 제약 충족 과제이다. 노동·환경·정보 문서가 각각1개 이상이라는 규칙을 지켜도 그것만으로 현실의 모든 가치 판단이 끝나는 것은 아니다. 문서의 존재와 문서가 뒷받침하는 내용도 구별한다.'
],'창작 예산9로 노동 검토서4·환경 검토서3·정보 공개 계획2를 확보할 수 있다. 세 범주의 자료가 모두 필요하다.',[
'필요한 범주는 노동·환경·정보로 서로 다르다.','세 자료의 총비용은4+3+2=9이다.','예산을 지켰다는 계산과 각 계획의 실제 타당성 검토를 구분한다.'
],'자료를 확보하고 그 자료의 내용을 평가하는 단계는 별도이다.','주체 → 역할·권리 → 필요한 자료 → 확인된 사실의 순서로 설명한다.','문서 개수를 도덕성·행복의 보편적 점수로 바꾸지 않는다.',{q:'매출 증가만으로 노동 조건 개선까지 확정할 수 있는가?',o:['가능하다.','노동 조건 자료가 더 필요하다.'],a:1,why:'서로 다른 측면의 근거를 확인해야 한다.'},['E77','C97']);
supplement42(8,4,'수익 형태 단서로 익명 자산을 판별한다','이자라는 공통 단서와 지분·차용이라는 구별 단서를 함께 읽는다.',[
'금융 자산의 이름이 가려진 문제에서는 단서 하나만으로 성급하게 고르지 않는다. 이자를 기대할 수 있다는 조건은 예금과 채권에 공통으로 나타날 수 있다. 발행자의 지급 약속, 매매 가능성, 보유자의 지위 같은 추가 단서를 결합한다.',
'지분을 가지고 배당을 기대한다면 주식의 특징과 연결된다. 차용 증서이고 보유자가 채권자라면 채권이다. 교재의 일반적인 비교에서 예금은 이자를, 채권은 이자와 시세 차익을, 주식은 배당과 시세 차익을 기대할 수 있다. 이 표를 실제 지급의 확정과 같은 뜻으로 읽지 않는다.',
'후보를 지우는 과정에서도 근거가 필요하다. 배당이 없다는 단서 하나로 예금만 남는다고 생각하지 말고 채권도 검토한다. 모든 후보의 특징을 비교하면 왜 하나의 자산만 자료를 충족하는지 설명할 수 있다.'
],'창작 A는이자만기대하고, B는차용증서로매매가능하며, C는지분과배당의단서가있다.',[
'교재의 일반적 비교에서 A를예금과연결한다.','B는 채권의 지위와 수익 구조를 충족한다.','C는 주식의 지분·배당 관계를 충족한다.'
],'공통 수익 형태와 구별되는 지위를 함께 사용한다.','후보 목록을 만든 뒤 단서마다 제외할 후보와 남는 후보를 기록한다.','가능한 수익과 반드시 지급되는 수익을 혼동하지 않는다.',{q:'이자 수익을 기대한다는 단서만으로 예금과 채권을 반드시 구별할 수 있는가?',o:['가능하다.','추가 단서가 필요하다.'],a:1,why:'두 자산에 공통으로 나타날 수 있는 수익 형태이다.'},['F88','F89']);
supplement42(9,4,'현금화 가능성과 손실 가능성을 따로 검토한다','필요한 날짜와 사용할 수 있는 금액을 함께 확인한다.',[
'곧 사용할 돈을 마련하는 문제에서는 자산의 총액만 보는 것으로 부족하다. 기한 전에 현금화할 수 있는지, 그때 금액이 어떻게 되는지 각각 확인한다. 유동성 정보와 안전성 정보는 서로 다른 질문에 답한다.',
'오늘30을 쓸 수 있는 자산과 한 달 뒤100을 찾을 수 있는 자산을 가지고 있어도 내일130을 사용할 수 있다는 뜻은 아니다. 자산 총액과 특정 기한의 사용 가능액을 별도 칸에 적는다. 만기형이라는 이름만으로 모든 실제 상품의 조기 처분 가능성을 일반화하지 말고 문제의 약정을 따른다.',
'자산 조합 게임의 목표는 주어진 자금 기한과 예산을 충족하는 것이다. 수익 최대화가 목표로 주어지지 않았다면 가장 높은 가상 수익률을 고르는 것과 혼동하지 않는다. 여러 조합이 제약을 충족할 수 있으며 한 조합만 유일한 정답이라고 좁히지 않는다.'
],'창작 A는오늘30을현금화가능, B는한달뒤100만회수가능. 내일40이필요하고대출은없다.',[
'보유한 자산의 표시 총액은130이다.','내일 사용할 수 있는 것은 A의30이다.','기한 전 사용액은10이 부족하다.'
],'보유액130과 내일 사용 가능액30을 구분한다.','자산마다 금액·현금화일·변동 가능성을 나란히 표시한다.','기한 뒤의 돈을 앞당겨 쓰거나 유동성이 높다는 말로 원금 보장을 단정하지 않는다.',{q:'위 조건에서 내일40을 충족할 수 있는가?',o:['총액130이므로 가능','기한 전10이 부족하다.'],a:1,why:'한 달 뒤의100은 내일 사용할 수 없다.'},['F89','F90']);
supplement42(10,4,'수입 총액과 기한 전 자금 부족을 구분한다','기간별 누적 잔액에서 가장 부족한 시점을 찾는다.',[
'재무 계획은 전체 기간의 수입과 지출이 맞는지만 확인하는 작업이 아니다. 돈을 써야 하는 기한에 실제로 사용할 수 있는 금액도 필요하다. 뒤에 들어오는 큰 수입은 앞선 지출 기한을 자동으로 해결하지 못한다.',
'초기 자금을0으로 놓고 시점별 누적 수입에서 누적 지출을 뺀다. 이 값이 가장 크게 부족한 금액만큼 처음 자금이 있어야 모든 기한을 지킬 수 있다. 이 계산은 이월 가능, 대출과 지출 연기 불가, 모든 입출금 시점이 주어진 창작 모형에 적용한다.',
'월초 수입과 월말 지출의 순서를 반드시 지킨다. 같은 달의 수입이라도 지출보다 늦게 들어온다면 그 지출에 쓰지 못할 수 있다. 최소 초기 자금과 마지막 잔액도 서로 다른 질문이므로 각각의 기준을 기록한다.'
],'창작3개월 동안 매월 말200지출. 수입600은3개월 초에만 들어온다. 이월 가능,대출·연기 불가.',[
'초기0일 때1개월 말 누적 부족액은200이다.','2개월 말에는400이 부족하다.','초기400을 마련하면3개월 초 수입으로 마지막 지출을 충족한다.'
],'필요 최소 초기 자금은400이며 전체 수입600과 다른 값이다.','초기0의 시점별 잔액 중 최솟값을 찾고, 음수라면 그 절댓값을 초기 자금으로 마련한다.','모형의 계산상 음수 잔액은 부족액의 표시이지 대출을 허용한다는 뜻이 아니다.',{q:'위 조건의 필요 최소 초기 자금은?',o:['0','400','600'],a:1,why:'먼저 발생하는 두 달의 지출400을 충족해야 한다.'},['F90']);
supplement42(10,5,'재무 계획의 목표·상태·수정 사유를 설명한다','계획의 각 단계가 답하는 질문을 구분한다.',[
'재무 목표는 앞으로 무엇을 언제 달성할지에 관한 기준이다. 재무 상태 분석은 지금 가진 자산과 부채, 수입과 지출, 이용할 수 있는 자원을 파악하는 단계이다. 목표가 크다는 사실과 현재 자금이 충분하다는 사실은 다르다.',
'계획 수립에서는 목표의 우선순위와 시간 계획, 예산, 실행할 행동을 정한다. 실행 뒤에는 결산을 통해 결과를 평가하고 문제점을 분석하여 수정한다. 계획이 있다는 이유만으로 이후의 조건 변화를 무시하지 않는다.',
'강의를 작성할 때는 각 단계에 맞는 자료를 하나씩 연결하면 좋다. 필요한 금액은 목표, 보유 자금은 상태, 월별 배분은 계획, 지출 기록은 실행, 기한 지연 원인 분석은 평가와 수정에 해당한다. 실제 상품의 선택은 이 기본 절차만으로 자동 결정하지 않는다.'
],'창작 목표는3개월 뒤60마련. 현재20,매월 추가로10씩 확보할 수 있다. 다른 자금은 없다.',[
'목표는60,현재 상태는20과 매월 확보액10이다.','3개월 뒤 확보 가능 총액은20+10×3=50이다.','목표보다10이 부족하다는 자료를 바탕으로 목표·일정·실행 계획을 재검토한다.'
],'목표를 적는 것과 그 목표를 충족할 자원이 있는지는 별도이다.','무엇을 원하는가 / 지금 무엇이 있는가 / 어떻게 실행할까 / 결과는 어땠는가로 나누어 읽는다.','부족액이 있다고 자료에 없는 대출이나 수익을 임의로 넣어 계획을 완성하지 않는다.',{q:'결산에서 원인을 찾아 계획을 바꾸는 단계는?',o:['재무 목표 설정만','평가 및 수정'],a:1,why:'교재의 설계 절차는 실행 이후의 평가를 포함한다.'},['F90']);
supplement42(11,4,'외화 가격과 환율이 함께 바뀌는 자료','두 변화의 배율과 원화 손익을 서로 검산한다.',[
'외화 자산의 가격과 환율이 동시에 변하면 처음과 나중의 원화 금액을 따로 계산하는 것이 기본 풀이이다. 외화 가격의 상승률이나 하락률만으로 원화 수익을 확정하지 않는다. 각 시점의 외화액과 그 시점 환율을 올바르게 짝지어야 한다.',
'다른 수익과 비용이 없는 경우 나중 원화액/처음 원화액은 외화액의 변화 배율과 환율의 변화 배율의 곱으로도 구할 수 있다. 이 관계는 두 시점의 환산식에서 도출한 계산 요령이다. 두 증가율을 단순히 더한 값이 항상 정확한 전체 변화율은 아니다.',
'거래 중간에 배당을 받거나 추가 납입·일부 매도가 있으면 단순한 두 배율의 곱만으로 전체 손익을 구할 수 없을 수 있다. 현금흐름과 환산 시점을 더 확인한다. 숏컷은 기본 계산과 같은 조건을 사용할 때만 적용한다.'
],'창작 처음100달러·1200원/달러, 나중90달러·1400원/달러. 수량1개·배당·세금·수수료 없음.',[
'처음 원화120000,나중126000으로 손익6000이다.','외화액 배율90/100=0.9,환율 배율1400/1200=7/6이다.','전체 배율0.9×7/6=1.05이므로 원화액은5% 증가했다.'
],'직접 환산과 변화 배율의 계산이 같은 결과를 준다.','(나중 외화액/처음 외화액)×(나중 환율/처음 환율)로 검산한다.','중간 입출금과 다른 수익·비용이 있는 자료에 같은 식을 무조건 적용하지 않는다.',{q:'이 예제의 원화 변화 배율은?',o:['0.9','1.05','1.9'],a:1,why:'두 변화 배율의 곱은1.05이다.'},['F91']);
supplement42(13,4,'같은 생산 조건을 표·그래프·문장으로 바꾼다','표현이 달라도 포기하는 생산량의 관계를 유지한다.',[
'비교 우위 자료는 노동 투입량표, 최대 생산량표, 생산 가능 곡선, 교역 전후 소비량표 등 여러 모습으로 제시된다. 그래픽에서 답을 찾는 것에 그치지 않고 그 관계를 표와 문장으로도 설명할 수 있어야 한다. 자료형이 달라지면 무엇이 직접 주어졌는지부터 확인한다.',
'총노동48시간이고 X1개에2시간, Y1개에4시간이 필요하다면 최대 생산량은 X24와 Y12이다. 이를 직선 생산 가능 곡선으로 표시하면 절편은24와12이다. X1개를 만들 때 Y1/2개를 포기한다는 관계는 어떤 표현에서도 같다.',
'같은 조건을 옮길 때는 총량, 단위, 자원·기술 고정, 직선 모형이라는 가정을 보존해야 한다. 노동을 더 투입한 새 자료를 같은 조건의 표현 변경이라고 처리해서는 안 된다. 무엇이 표현의 변경이고 무엇이 생산 조건의 변경인지 구분한다.'
],'창작 총노동48시간, X1개당2시간·Y1개당4시간. X를18개 생산한다.',[
'최대량표는X24·Y12이다.','X18에36시간을 쓰고12시간이 남는다.','남은 노동으로Y12/4=3개를 만든다. 곡선식12×(1−18/24)도3이다.'
],'노동시간 계산과 생산 가능 곡선의 비율식이 일치한다.','한 자료에서 최대량과 기회비용을 먼저 찾아 다른 표현으로 옮긴다.','표현을 바꾸면서 단위당 투입량과 총투입량을 혼동하지 않는다.',{q:'위 조건에서 X18과 함께 최대로 생산할 Y는?',o:['3','6','12'],a:0,why:'남은 노동12시간으로 Y3개를 만든다.'},['T104','A86']);
supplement42(13,5,'비교 우위가 같아지는 생산 조건','기회비용이 같은 경계에서 모형의 결론을 다시 확인한다.',[
'생산 조건이 달라지면 이전에 판정한 비교 우위도 다시 계산해야 한다. 최대 생산량이 작다는 이유만으로 상대의 기회비용이 더 크다고 단정하지 않는다. 두 최대량의 비율이 같다면 생산 규모가 달라도 생산의 기회비용은 같을 수 있다.',
'직선 모형에서 A최대X24·Y12, B최대X8·Y4라면 X1의 기회비용은 두 나라 모두Y1/2이다. A는 같은 총노동 기준에서 두 재화 모두 절대 우위일 수 있지만, 이 자료의 기회비용은 같다. 두 우위를 같은 개념으로 쓰면 이 경우를 설명하지 못한다.',
'이 단순 모형에서 교환 비율이 한쪽의 생산 기회비용보다 유리하면서 다른 쪽에도 유리한 열린 구간은 없다. 이것을 현실의 모든 무역에 어떠한 이익도 없다는 주장으로 확대하지 않는다. 여기서 검토하는 것은 주어진 두 재화·직선 모형의 생산 기회비용을 통한 추가 이익이다.'
],'창작 같은 총노동량에서 A(24,12),B(8,4)이며 직선 모형이다. X1당Y로 비교한다.',[
'A의 비용은12/24=0.5이다.','B의 비용도4/8=0.5이다.','두 나라 모두 양의 추가 이익을 얻으려면0.5보다 크고0.5보다 작아야 하므로 그런 비율은 없다.'
],'이 조건에서는 기회비용 차이에 따른 양국의 양의 추가 이익 구간이 없다.','새 생산 조건마다 두 기회비용을 다시 계산하고 구간의 폭을 확인한다.','기회비용의 동일성을 생산량의 동일성이나 모든 현실 무역의 무의미함과 같게 보지 않는다.',{q:'A24/12와B8/4에서 X1의 기회비용은?',o:['A만0.5','두 나라 모두0.5'],a:1,why:'각국의 Y최대/X최대 비율이 같다.'},['T104','A86']);
supplement42(14,4,'교환 비율 경계에서 0이 되는 이익','양의 추가 이익을 요구하는 문항의 경계를 제외한다.',[
'교환 비율이 어떤 나라의 생산 기회비용과 같다면 그 나라는 같은 재화 기준에서 자급 생산보다 추가로 얻는 양이0일 수 있다. 다른 나라의 이익이 양수라고 해서 양국 모두 양의 이익을 얻는 계약이라는 것은 아니다.',
'A의 X1기회비용Y0.5, B의 비용Y1에서 X6을 교환한다면 A는 Y3을 포기하고, B는 직접X6을 만들면 Y6을 포기한다. Y3과 교환하면 A의 추가 이익은0, Y6과 교환하면 B의 추가 이익은0이다.',
'문제가 요구하는 조건을 확인해야 한다. 양국의 추가 이익이 양수라는 표현에는0을 포함하지 않는다. 최소 손해 없음이나 동률 허용처럼 다른 질문을 구성했다면 그 조건에 맞게 경계를 따로 처리해야 한다. 이는 교재 모형의 계산에서 도출한 경계 검토이다.'
],'창작 X6을 교환. A의X1비용Y0.5, B는Y1. 다른 비용은 없다.',[
'Y3을 받으면 A이익3−6×0.5=0이다.','Y6을 내면 B이익6×1−6=0이다.','양국 모두 양수이려면 교환할Y는3보다 크고6보다 작아야 한다.'
],'3<Y<6이 두 나라의 양의 이익 조건이다.','경계값을 양국 이익 식에 직접 넣어 어느 쪽이0이 되는지 확인한다.','총이익이 양수라는 조건과 모든 참가자의 추가 이익이 양수라는 조건을 혼동하지 않는다.',{q:'X6:Y3일 때 A의 추가 이익은?',o:['0','3','6'],a:0,why:'받는Y와 포기한Y가 모두3이다.'},['T104','A86']);
supplement42(14,5,'유리한 비율과 실현 가능한 교환량','비율의 조건을 만족한 뒤 생산량과 수출량을 확인한다.',[
'교환 비율이 생산 기회비용 사이에 있다고 모든 수량의 계약이 가능한 것은 아니다. 수출하려는 재화가 실제로 생산되어 있어야 한다. 생산량보다 많은 수량을 내는 계약은 이 게임의 재고 없는 조건에서 실현할 수 없다.',
'A가X24, B가Y8에 완전 특화한 모형에서 X12와Y9의 비율은0.75이다. X1기회비용이 A0.5, B1이면 비율 자체는 유리하지만 B는Y8만 생산했으므로Y9를 줄 수 없다. 수량의 제약을 확인하지 않으면 불가능한 계약을 정답으로 고르게 된다.',
'같은 비율을 유지하면서 수량을 줄이는 방식으로 가능한 계약을 찾을 수 있다. 다만 최소 거래단위나 정수 제한이 주어졌다면 함께 지켜야 한다. 비율·총량·허용단위의 조건을 서로 다른 점검 항목으로 기록한다.'
],'창작 A는X24, B는Y8만 생산. A의X1비용Y0.5,B는Y1. X8:Y6으로 계약을 바꾼다.',[
'비율6/8=0.75는0.5와1사이이다.','X8≤24,Y6≤8이므로 생산량 범위를 지킨다.','A이익6−8×0.5=2, B이익8−6=2이다.'
],'비율과 수량을 함께 만족할 때 실현 가능한 유리한 계약이다.','기회비용 비교 → 비율 판정 → 수출량 상한 → 양국 이익의 순서로 검산한다.','거래 당사자가 가지지 않은 재화를 재고가 있는 것처럼 임의로 추가하지 않는다.',{q:'B가Y8만 생산했는데Y9를 수출하는 계약은?',o:['비율만 좋으면 가능','생산량 제약을 위반한다.'],a:1,why:'재고나 다른 거래가 없는 조건에서Y9를 제공할 수 없다.'},['T104','A86']);
supplement42(14,6,'소비량에서 역산할 때 필요한 가정','완전 특화·두 나라 간 거래·수량 보존을 확인한다.',[
'교역 후 소비량으로 생산량과 교환량을 역산하려면 어떤 관계를 사용할 수 있는지 확인해야 한다. 두 나라만 있고 각국이 한 재화에 완전 특화하며 재고·손실·다른 거래가 없다는 조건에서는 최종 소비의 총합이 생산 총량과 같다.',
'한 나라가 생산하지 않은 재화를 소비한다면 그 양은 해당 거래의 수입량과 연결된다. 그러나 부분적으로 자급 생산했다거나 다른 나라에서도 수입했다면 같은 결론이 바로 나오지 않는다. 결과표의 숫자만 보고 필요한 가정을 자동으로 채워 넣지 않는다.',
'집필할 때는 역산에 필요한 가정을 발문에 드러내고, 자료가 부족한 경우를 별도의 정보 충분성 문제로 만들 수 있다. 계산 가능한 표와 가정이 누락된 표를 구분해야 같은 풀이를 무조건 적용하는 습관을 줄일 수 있다.'
],'창작 A는X,B는Y에 완전 특화. 교역 후A소비X18·Y5,B소비X6·Y7. 재고·손실·다른 거래 없음.',[

guide43(1,1,'전시실 이름보다 사건의 배경','L01-1','창작 전시 카드. A에는 해외 교역과 상품 유통, B에는 산업 혁명과 공장의 대량 생산이 적혀 있다. 수능특강의 전개 구분을 적용한다.','먼저 공통 단어인 이윤을 표시하고, 이윤을 얻는 주요 과정이 무엇인지 나누어 보자.',[
gp43('단서 선택','A와 B를 구별하는 데 직접 필요한 단서는?',['이윤을 추구한다는 공통점만','유통과 생산이라는 과정의 차이','전시 카드의 종이 색'],1,'두 단계 모두 이윤을 추구한다. 구별 근거는 제시된 주요 과정과 배경이다.','각 카드에서 어디에서 이윤을 얻는지 찾아보세요.'),
